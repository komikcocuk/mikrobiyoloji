şıyıcı ve kanal proteinleri)\n• Aktif transport\nYanlış şıklar:\n• Egzositoz ve endositoz → fagositoz/pinositoz gibi kesecik aracılı taşımalardır.\n• Aktif transport → enerji harcayan ayrı bir başlıktır.\n• Kolaylaştırılmış difüzyon → taşıyıcı ve kanal proteinleriyle olur; osmoz bu başlıkta değildir.\n💡 Akılda kalsın: osmoz = suyun basit difüzyonu; \"Basit difüzyon/Osmoz\" yan yana yazılır.", "shuf": true}, {"q": "Sitoplazma ile ilgili hangisi doğrudur?", "opts": [{"t": "Hücrenin %10'unu oluşturur ve içinde organel bulunmaz"}, {"t": "Yaklaşık %70 su içeren kolloid bir yapıdır"}, {"t": "Yalnızca su ve elektrolitlerden oluşur, inklüzyon içermez"}, {"t": "%70'i proteinden oluşan katı bir yapıdır"}, {"t": "Hücrenin cansız kısmı olduğu için tamamına inklüzyon denir"}], "a": 1, "exp": "Doğru cevap: sitoplazma **yaklaşık %70 su içeren kolloid bir yapıdır**. Sitoplazma; %70 civarında su, karbohidrat, protein, lipit, elektrolitler ve hücre inklüzyonlarını içerir. İçinde endoplazmik retikulum, mitokondri, ribozom, Golgi cihazı, sentrioller, plastidler, lizozom, peroksizom ve vakuol gibi organeller bulunur.\nYanlış şıklar:\n• \"Hücrenin %10'unu oluşturur ve içinde organel bulunmaz\" → %10 bilgisi çekirdeğe aittir; sitoplazmada çok sayıda organel vardır.\n• \"Yalnızca su ve elektrolitlerden oluşur, inklüzyon içermez\" → karbohidrat, protein, lipit ve inklüzyonlar da içerir.\n• \"%70'i proteinden oluşan katı yapıdır\" → %70'lik bileşen sudur ve yapı kolloiddir.\n• \"Cansız kısım olduğu için inklüzyon adını alır\" → inklüzyon, sitoplazmanın içindeki cansız kısımlardır; sitoplazmanın kendisi inklüzyon değildir.\n💡 Akılda kalsın: sitoplazma = %70 su + kolloid + organeller + inklüzyonlar. Kolloid kıvamı için yumurta akını düşün: ne tam sıvı ne katı.", "shuf": true}, {"q": "Nükleozom yapısıyla ilgili şemaya göre hangisi doğrudur?", "opts": [{"t": "Nükleozom sitoplazmadaki bir organeldir"}, {"t": "Nükleozom mitokondrinin birimidir"}, {"t": "RNA, ribozom etrafına sarılır"}, {"t": "DNA, histon oktameri etrafına sarılır; şemada H1 histonu da gösterilir"}, {"t": "DNA, lipit bir çekirdeğin etrafına sarılır"}], "a": 3, "exp": "Doğru cevap: **DNA, histon oktameri etrafına sarılır; şemada H1 histonu da gösterilir**. Nükleozom = histon oktameri (8 histon) + etrafına sarılmış DNA; şemada ayrıca **H1 histonu** ve **10 nm** kalınlık gösterilir. Nükleozom, çekirdekteki kromatinin (heterokromatin ve ökromatin) temel yapı birimidir.\nYanlış şıklar:\n• \"Sitoplazmadaki bir organel\" → nükleozom organel değil, çekirdekteki kromatinin yapı birimidir.\n• \"Mitokondrinin birimi\" → şema çekirdek/kromatin konusundadır.\n• \"RNA ribozom etrafına sarılır\" → sarılan DNA'dır, merkez histon oktameridir.\n• \"DNA lipit bir çekirdeğin etrafına sarılır\" → merkezdeki yapı lipit değil, histon proteinleridir.\n💡 Akılda kalsın: nükleozom = 8 histon (oktamer) + DNA, H1 bağlayıcı, 10 nm. İpe dizilmiş boncuklar: boncuk = nükleozom, ip = DNA.", "shuf": true}, {"q": "Slayta göre insan hücreleriyle ilgili hangisi doğrudur?", "opts": [{"t": "Kan hücreleri hariç yaklaşık 1 katrilyon hücre bulunur"}, {"t": "Kan hücreleri dahil yaklaşık 1 katrilyon hücre bulunur"}, {"t": "Tüm dokularda hücre sayısı sabittir"}, {"t": "Pigmentli hücreler hariç hücreler çoğunlukla renklidir"}, {"t": "Hücrelerin kıvamı tüm hücre çeşitlerinde aynıdır"}], "a": 0, "exp": "Doğru cevap: insanda **kan hücreleri hariç yaklaşık 1 katrilyon hücre** bulunur.\nAynı konudaki diğer bilgiler: MSS, retina ve lens kristalindeki hücrelerin sayısı sabittir; hücreler pigmentli hücreler hariç çoğunlukla renksizdir; hücrelerin kıvamları hücre çeşidine göre değişir (beyin hücreleri – derinin stratum corneum hücreleri).\nYanlış şıklar:\n• \"Kan hücreleri dahil 1 katrilyon\" → doğru ifade \"kan hücreleri hariç\"tir.\n• \"Tüm dokularda hücre sayısı sabittir\" → yalnızca MSS, retina ve lens kristalinde sabittir.\n• \"Pigmentli hücreler hariç hücreler çoğunlukla renklidir\" → tersine, çoğunlukla renksizdir.\n• \"Hücrelerin kıvamı tüm hücre çeşitlerinde aynıdır\" → kıvam hücre çeşidine göre değişir.\n💡 Akılda kalsın: 1 katrilyon (kan hariç), renksiz (pigmentli hariç), sayısı sabit (MSS, retina, lens).", "shuf": true}, {"q": "Çekirdek zarında, zarların birbirine temas ettiği bölgelerde oluşan porlara ne ad verilir?", "opts": [{"t": "Perinükleer aralık"}, {"t": "Desmozom"}, {"t": "Annulus"}, {"t": "Pars amorfa"}, {"t": "Nükleolonema"}], "a": 2, "exp": "Doğru cevap: **annulus**. Çekirdek zarında, iç ve dış zarların birbirine temas ettiği bölgelerde **400–1000 Å çapında annulus** adı verilen porlar bulunur. Bu porlar çekirdek ile sitoplazma arasındaki madde geçişinin kapılarıdır.\nYanlış şıklar:\n• Perinükleer aralık → iç ve dış zar arasındaki 400–700 Å'lük aralıktır; por değildir.\n• Desmozom → hücreler arası tutucu bağlantıdır (makula adherens).\n• Pars amorfa ve nükleolonema → nükleolusun bölümleridir.\nEk bilgi: dış zar ribozom taşıdığından granüllü, iç zar düzdür; çekirdek zarı mitozun profaz evresi sonunda kaybolur.\n💡 Akılda kalsın: annulus (Latince \"halka\") = çekirdek zarındaki halka şeklindeki porlar. Yüzük (anulus) gibi yuvarlak kapılar.", "shuf": true}, {"q": "Tutucu (sabitleyici) hücre bağlantıları hangileridir?", "opts": [{"t": "Konnekson ve gap junction"}, {"t": "Annulus ve nükleer lamina"}, {"t": "Zonula adherens ve makula adherens (desmozom, hemidesmozom)"}, {"t": "Silyum ve mikrovillus"}, {"t": "Zonula okludens ve gap junction"}], "a": 2, "exp": "Doğru cevap: **zonula adherens ve makula adherens (desmozom, hemidesmozom)**. Tutucu (sabitleyici) bağlantılar bunlardır; hücreleri mekanik olarak birbirine ve alttaki yapıya tutturur.\nYanlış şıklar:\n• Konnekson ve gap junction → iletişim sağlayan bağlantıdır.\n• Annulus ve nükleer lamina → çekirdek zarına ait yapılardır (por ve destek tabakası).\n• Silyum ve mikrovillus → \"özel yüzey oluşumları\" başlığındadır; bağlantı değildir.\n• Zonula okludens ve gap junction → biri engelleyici, diğeri iletişim sağlayan bağlantıdır.\n💡 Akılda kalsın: adında \"adherens\" (yapışan) geçen her bağlantı tutucudur. \"Adezyon\" (yapışma) aynı kökten gelir.", "shuf": true}, {"q": "Aşağıdakilerden hangisi slaytta sitoplazmada bulunan organeller arasında **sayılmaz**?", "opts": [{"t": "Mitokondri"}, {"t": "Golgi cihazı"}, {"t": "Nükleolus"}, {"t": "Peroksizom"}, {"t": "Sentrioller"}], "a": 2, "exp": "Doğru cevap: **nükleolus**. Nükleolus sitoplazmada değil çekirdekte bulunur; interfaz çekirdeğinin dört bölgesinden biridir (nükleus zarı, nükleus plazması, kromatin, nükleolus). Bu yüzden sitoplazma organelleri arasında sayılmaz.\nSitoplazmada bulunan organeller: endoplazmik retikulum, **mitokondri**, ribozom, **Golgi cihazı**, **sentrioller**, plastidler, lizozom, **peroksizom** ve vakuol. Diğer dört şık bu listededir.\n💡 Akılda kalsın: \"nükleo-\" ile başlayan yapı (nükleolus) çekirdeğe aittir. \"Nucleus\" Latince çekirdek; nükleolus = küçük çekirdek, çekirdeğin içindeki çekirdekçik.", "shuf": true, "html": true}, {"q": "Hücre zarında fosfolipitlerin slaytta belirtilen görevi hangisidir?", "opts": [{"t": "Dış ortamdan izolasyonu sağlamak"}, {"t": "Zarın dayanıklılığını ve akışkanlığını düzenlemek"}, {"t": "Glikokaliksi oluşturmak"}, {"t": "Virüs reseptörü olarak fonksiyon görmek"}, {"t": "Enzim olarak görev yapmak"}], "a": 0, "exp": "Doğru cevap: **dış ortamdan izolasyonu sağlamak**. Fosfolipitlerin görevi budur. Fosfolipitler zarda en fazla bulunan lipittir ve 45 Å kalınlığında çift katlı tabaka oluşturur.\nYanlış şıklar:\n• Zarın dayanıklılığını ve akışkanlığını düzenlemek → kolesterolün görevidir.\n• Glikokaliksi oluşturmak → zarın dış yüzündeki karbohidratların (glikolipit/glikoprotein olarak) görevidir.\n• Virüs reseptörü olarak fonksiyon görmek → glikokaliksin işlevlerinden biridir.\n• Enzim olarak görev yapmak → zar proteinlerinin görevidir (reseptör, enzim, transport).\n💡 Akılda kalsın: fosfolipit = izolasyon, kolesterol = dayanıklılık/akışkanlık, karbohidrat = glikokaliks, protein = reseptör/enzim/transport. Her molekülün tek cümlelik bir \"iş tanımı\" var.", "shuf": true}]}, {"title": "Mikrop Dünyası ve Sınıflandırma", "desc": "Virüs–viroid–prion, 5 âlem, taksonomi ve adlandırma; mantar ve parazit sınıflaması", "short": "Sınıflandırma", "questions": [{"q": "Aşağıdakilerden hangisi hücresel yapıda **olmayan** (asellüler) bir mikroorganizmadır?", "opts": [{"t": "Arkea"}, {"t": "Protozoa"}, {"t": "Alg"}, {"t": "Fungus"}, {"t": "Prion"}], "a": 4, "exp": "Doğru cevap: **prion**. Mikroorganizmalar iki ana gruba ayrılır:\n• **Hücresel yapıda olmayanlar (asellülerler): virüsler, viroidler, prionlar** → prion bu gruptadır.\n• Hücresel yapıda olanlar: bakteriler ve arkealar (prokaryotik); protozoalar, algler, funguslar (ökaryotik).\nAsellülerlerin gerçek hücresel yapıları yoktur, aktif yaşam formunda değillerdir, çoğalma kapasiteleri yüksektir ve bazılarının hücre zarı bile yoktur. Prion yaklaşık 1 nm büyüklüğündedir ve yalnızca proteinden oluşur.\nYanlış şıklar:\n• Arkea → bakterilerle birlikte hücresel, prokaryotik mikroorganizmadır.\n• Protozoa, alg, fungus → hücresel yapıda (ökaryot) mikroorganizmalardır.\n💡 Akılda kalsın: asellüler üçlü = Virüs, Viroid, Prion (VVP). Hücresi olmayan bu üçlü, canlılığın sınırında durur.", "shuf": true, "html": true}, {"q": "Boyutu yaklaşık 1 nm olan ve yalnızca proteinden oluşan etken hangisidir?", "opts": [{"t": "Bakteri"}, {"t": "Arkea"}, {"t": "Prion"}, {"t": "Virüs"}, {"t": "Viroid"}], "a": 2, "exp": "Doğru cevap: **prion**. Prionlar yaklaşık **1 nm** büyüklüğündedir ve **sadece proteinden** oluşur; nükleik asit içermezler. (Klinik bağlantı: Creutzfeldt-Jakob hastalığı gibi süngerimsi beyin hastalıklarının etkenidir.)\nAsellüler etkenlerin boyut ve yapı karşılaştırması:\n• Virüsler → 20–300 nm, DNA veya RNA içerir\n• Viroidler → 5 nm, tek iplikli RNA\n• **Prionlar → 1 nm, yalnızca protein (doğru cevap)**\nYanlış şıklar:\n• Bakteri ve arkea → hücresel yapıda prokaryot mikroorganizmalardır; nanometre değil mikrometre ölçeğinde, çok daha büyük canlılardır.\n• Virüs → 20–300 nm'dir ve nükleik asit içerir.\n• Viroid → 5 nm'dir ve tek iplikli RNA'dan oluşur.\n💡 Akılda kalsın: PRotein → PRion; en küçüğü (1 nm).", "shuf": true}, {"q": "Yaklaşık 5 nm büyüklüğünde, tek iplikli RNA'dan oluşan etken hangisidir?", "opts": [{"t": "Ribozom"}, {"t": "Viroid"}, {"t": "Arkea"}, {"t": "Prion"}, {"t": "Virüs"}], "a": 1, "exp": "Doğru cevap: **viroid**. Viroidler yaklaşık **5 nm** büyüklüğündedir ve **tek iplikli RNA**'dan oluşur. Virüsler ve prionlarla birlikte hücresel yapıda olmayan (asellüler) grubun üyesidir.\nYanlış şıklar:\n• Ribozom → sitoplazmadaki bir organeldir; mikroorganizma değildir.\n• Arkea → hücresel yapıda prokaryot mikroorganizmadır.\n• Prion → 1 nm'dir ve yalnızca proteinden oluşur.\n• Virüs → 20–300 nm'dir; DNA veya RNA içerir, zarflı veya zarfsız olabilir.\n💡 Akılda kalsın: büyüklük sırası virüs (20–300 nm) > viroid (5 nm, RNA) > prion (1 nm, protein). Viroid = \"virüsümsü\": virüsün yalnızca RNA'sı kalmış hali gibi düşün.", "shuf": true}, {"q": "Slayttaki listeye göre aşağıdakilerden hangisi mikroorganizmaların insanlara **yararları** arasında **sayılmamıştır**?", "opts": [{"t": "Maden yataklarının ıslahı"}, {"t": "C, N, P, S döngüleri"}, {"t": "Biyogaz üretimi"}, {"t": "Bitki ve hayvanlarda ekonomik kayıp"}, {"t": "Biyoinsektisit üretimi"}], "a": 3, "exp": "Doğru cevap: **bitki ve hayvanlarda ekonomik kayıp** — çünkü bu madde **zararlar** başlığındadır, yararlar listesinde değil.\nYararlar listesi: gıda üretimi (yoğurt, boza, alkollü içecekler vb.), endüstriyel ürünlerin üretimi (alkol, aseton vb.), biyolojik atık su arıtımı, **biyogaz üretimi**, **maden yataklarının ıslahı**, biyolojik gübre üretimi, tarımsal savaş ilaçları (**biyoinsektisit**) üretimi, doğada **C, N, P, S döngüleri**, genetik çalışmalar ve biyolojik silah üretimi.\nZararlar: insanları, hayvanları, bitkileri hastalandırma; hastalığın ilerlemiş şekli olan ölüm; bitki-hayvan hastalık ve ölümlerinin ekonomik kaybı; insanlarda iş gücü kaybı ve sigorta giderleri.\n💡 Akılda kalsın: dikkat, \"biyolojik silah üretimi\" bile yararlar listesinde sayılır; ekonomik kayıp ise zararlardadır.", "shuf": true, "html": true}, {"q": "Günümüzde geçerli 5 âlem sistemiyle ilgili hangisi doğrudur?", "opts": [{"t": "Monera âlemi bakteriler ve siyanobakterileri (Eubacteria, Archae) kapsar"}, {"t": "Funguslar Protista âlemindedir"}, {"t": "Virüsler Monera âlemindedir"}, {"t": "Sistem 3 âlemden oluşur"}, {"t": "Protozoalar Animalia âlemindedir"}], "a": 0, "exp": "Doğru cevap: **Monera âlemi bakterileri ve siyanobakterileri (Eubacteria, Archae) kapsar**.\nBugün geçerli olan **5 âlem sistemi**:\n• Plantae\n• Animalia\n• Fungi (maya, küf, şapkalı mantarlar)\n• **Monera (bakteriler ve siyanobakteriler) → Eubacteria ve Archae** (doğru cevap)\n• Protista (Protophyta, Protomycota, Protozoa)\nYanlış şıklar:\n• \"Funguslar Protista âlemindedir\" → funguslar ayrı bir âlem olan Fungi'dedir (Protista'daki Protomycota ile karıştırma).\n• \"Virüsler Monera âlemindedir\" → virüslerin bu sınıflandırmada yeri yoktur; ayrı bir grup olarak değerlendirilir.\n• \"Sistem 3 âlemden oluşur\" → 3 âlem (bitkiler, hayvanlar, protista) eski sistemdir.\n• \"Protozoalar Animalia âlemindedir\" → protozoalar Protista âlemindedir.\n💡 Akılda kalsın: 5 âlem = Plantae, Animalia, Fungi, Monera, Protista; virüs âlemsizdir — hücre yoksa âlem de yok.", "shuf": true}, {"q": "Linnaeus'un adlandırma sistemine göre bir bakteri adının yazımıyla ilgili hangisi doğrudur?", "opts": [{"t": "Cins adı büyük, tür adı küçük harfle başlar; ikisi de italik yazılır"}, {"t": "Cins ve tür adı büyük harfle başlar; yalnızca tür adı italik yazılır"}, {"t": "Cins adı küçük, tür adı büyük harfle başlar; ikisi de düz yazılır"}, {"t": "Adın tamamı büyük harfle ve düz yazılır"}, {"t": "Yalnızca cins adı yazılır, tür adı kullanılmaz"}], "a": 0, "exp": "Doğru cevap: **cins adı büyük, tür adı küçük harfle başlar; ikisi de italik yazılır**. Carl Linnaeus'un (1707–1778) geliştirdiği ve bugün de kullanılan ikili (binomiyal) sistemde her canlı türü **iki kelimelik cins ve tür adıyla** tanımlanır. Örnekler: Streptococcus thermophilus, Escherichia coli.\nYanlış şıklar:\n• \"Cins ve tür adı büyük harfle, yalnızca tür italik\" → tür adı küçük harfle başlar; iki kelime birlikte italik yazılır.\n• \"Cins küçük, tür büyük; ikisi de düz\" → büyük/küçük harf kuralı ters, italik kuralı eksik.\n• \"Tüm ad büyük harfle ve düz\" → hem harf hem italik kuralı bozulmuştur.\n• \"Yalnızca cins adı yazılır\" → sistem iki adlıdır (cins + tür).\nNot: Salmonella'da istisna vardır; Salmonella Enteritidis'te \"Enteritidis\" tür değil serotip olduğu için büyük harfle başlar ve italik yazılmaz.\n💡 Akılda kalsın: Cins Büyük – tür küçük – ikisi de italik. El yazısında italik yerine altı çizilir.", "shuf": true}, {"q": "Adlandırmayla ilgili hangisi **yanlıştır**?", "opts": [{"t": "Cronobacter sakazakii adını titan Cronos ve Riichi Sakazaki'den alır"}, {"t": "Salmonella Enteritidis'te Enteritidis büyük harfle ve italik olmadan yazılır çünkü tür değil serotiptir"}, {"t": "Funguslarda şube adı -mycetes, sınıf adı -mycota ile biter"}, {"t": "Takım adları -ales ile biter (Enterobacteriales)"}, {"t": "Familya adları -aceae ile biter (Enterobacteriaceae)"}], "a": 2, "exp": "Yanlış (dolayısıyla aranan) ifade: **\"funguslarda şube adı -mycetes, sınıf adı -mycota ile biter\"**. Doğrusu tersidir: **sınıf** adının sonuna **-mycetes** (ör. Deuteromycetes), **şube** adının sonuna **-mycota** (ör. Amastigomycota) gelir.\nDiğer adlandırma kuralları (doğru şıklar):\n• Familya adları → -aceae (Enterobacteriaceae)\n• Takım adları → -ales (Enterobacteriales)\n• Salmonella'da türler değil serotipler önemlidir; Salmonella enterica serotype enteritidis kısaca Salmonella Enteritidis yazılır. Enteritidis tür olmadığı için büyük harfle başlar ve italik yazılmaz.\n• Cronobacter sakazakii adını, her çocuğunu doğar doğmaz yutan Yunan titanı Cronos'tan ve Japon mikrobiyolog Riichi Sakazaki'den alır.\n💡 Akılda kalsın: büyük basamak (şube) → -mycota; sınıf → -mycetes. Familya -aceae, takım -ales.", "shuf": true, "html": true}, {"q": "Mantarların sınıflandırılmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Mantarlar parazitler grubunda sınıflandırılır"}, {"t": "Küflerin tamamı septum içermez"}, {"t": "Dimorfik mantarlar yalnızca küf formundadır"}, {"t": "Maya tek hücreli, küf çok hücrelidir; hem maya hem küf formu gösterenlere dimorfik denir"}, {"t": "Maya çok hücreli, küf tek hücrelidir"}], "a": 3, "exp": "Doğru cevap: **maya tek hücreli, küf çok hücrelidir; hem maya hem küf formu gösterenlere dimorfik denir**. Mantarlar ayrıca pigmentli/pigmentsiz ve çekirdekleri bir duvarla (septum) ayrılmış olanlar/septumsuzlar şeklinde de sınıflandırılır.\nYanlış şıklar:\n• \"Mantarlar parazitler grubunda sınıflandırılır\" → mantarlar ve parazitler ayrı gruplardır; parazitler protozoa, helmintler ve artropodlardır.\n• \"Küflerin tamamı septum içermez\" → septumlu ve septumsuz olanlar vardır.\n• \"Dimorfik mantarlar yalnızca küf formundadır\" → dimorfik, iki formu (maya + küf) birden gösterendir.\n• \"Maya çok hücreli, küf tek hücreli\" → tam tersidir.\n💡 Akılda kalsın: Maya = tek, Küf = çok, Dimorfik = ikisi de (\"di\" = iki). Ekmek mayası tek hücre, ekmeğin üstündeki yeşil küf hif ağıdır — mutfaktan iki örnek.", "shuf": true}, {"q": "Helmintlerin (solucanların) sınıflandırılmasında hangi eşleştirme doğrudur?", "opts": [{"t": "Trematod – yassı solucan"}, {"t": "Trematod – yuvarlak solucan"}, {"t": "Nematod – yassı solucan"}, {"t": "Sestod – yapraksı solucan"}, {"t": "Nematod – yuvarlak solucan"}], "a": 4, "exp": "Doğru cevap: **nematod – yuvarlak solucan**.\nHelmintlerin (solucanların) üç grubu:\n• **Yuvarlak solucanlar → Nematodlar** (doğru cevap)\n• Yapraksı solucanlar → Trematodlar\n• Yassı solucanlar → Sestodlar\nYanlış şıklar:\n• Trematod – yassı solucan → trematod yapraksı solucandır; yassı solucan sestoddur.\n• Trematod – yuvarlak solucan → yuvarlak solucan nematoddur.\n• Nematod – yassı solucan → nematod yuvarlaktır.\n• Sestod – yapraksı solucan → sestod yassıdır; yapraksı olan trematoddur.\nParazitlerin diğer grupları: protozoa (amipler, kamçılılar, sporozoonlar) ve artropodlar (sivrisinekler, keneler, pireler, bitler, akarlar, sinekler).\n💡 Akılda kalsın: Nematod = yuvarlak (nema = iplik; iplik yuvarlak kesitlidir), Trematod = yapraksı, Sestod = yassı (şerit; tenyalar bu gruptandır).", "shuf": true}, {"q": "Streptococcus thermophilus adındaki \"coccus\" kısmı bakterinin hangi özelliğini anlatır?", "opts": [{"t": "Yuvarlak olmasını"}, {"t": "Zincir şeklinde olmasını"}, {"t": "Spor oluşturmasını"}, {"t": "Gram pozitif olmasını"}, {"t": "Sıcağa dayanıklı olmasını"}], "a": 0, "exp": "Doğru cevap: **yuvarlak olmasını**. Cins ve tür adından mikroorganizma hakkında bilgi alınabilir. **Streptococcus thermophilus** adı parçalara ayrılınca:\n• Strepto → zincir şeklinde\n• **coccus → yuvarlak** (doğru cevap)\n• thermo → sıcağa\n• philus → dayanıklı (seven)\nYanlış şıklar:\n• Zincir şeklinde olması → \"Strepto\" kısmından gelir.\n• Sıcağa dayanıklı olması → \"thermophilus\" kısmından gelir.\n• Spor oluşturması ve Gram pozitif olması → adın hiçbir kısmı bu özellikleri anlatmaz.\n💡 Akılda kalsın: kok = yuvarlak, basil = çomak; strepto = zincir, stafilo = üzüm salkımı. \"Kokos\" Yunanca tane/çekirdek demektir — yuvarlak tane.", "shuf": true}, {"q": "Virüslerin boyut aralığı slayta göre hangisidir?", "opts": [{"t": "20–300 nm"}, {"t": "5–10 µm"}, {"t": "300–500 µm"}, {"t": "1–3 µm"}, {"t": "1–5 nm"}], "a": 0, "exp": "Doğru cevap: **20–300 nm**. Virüsler bu boyut aralığındadır; asellüler etkenlerin en büyükleridir. Viroidler 5 nm, prionlar 1 nm'dir.\nVirüslerin sınıflandırma ölçütleri: DNA virüsleri / RNA virüsleri; tek veya çift zincirli nükleik asit içermeleri; zarflı veya zarfsız olmaları. Virüslerin 5 âlem sınıflandırmasında yeri yoktur.\nYanlış şıklar:\n• 5–10 µm, 300–500 µm ve 1–3 µm → mikrometre ölçeğindeki bu değerler virüs boyutuyla (nanometre) uyuşmaz; 1–3 µm tipik bakteri boyutuna yakındır.\n• 1–5 nm → prion (1 nm) ve viroid (5 nm) aralığıdır; virüs değildir.\n💡 Akılda kalsın: virüs 20–300 nm > viroid 5 nm > prion 1 nm. Virüslerin çoğu ışık mikroskobuyla görülemez; elektron mikroskobu gerekir.", "shuf": true}, {"q": "Asellüler (hücresel yapıda olmayan) etkenlerle ilgili hangisi doğrudur?", "opts": [{"t": "Gerçek hücresel yapıları vardır ve aktif yaşam formundadırlar"}, {"t": "Çoğalma kapasiteleri düşüktür ve hepsinin hücre zarı vardır"}, {"t": "Prokaryotik hücre yapısındadırlar"}, {"t": "Aktif yaşam formunda değillerdir ama çoğalma kapasiteleri yüksektir"}, {"t": "Bakteriler ve arkealar bu gruptadır"}], "a": 3, "exp": "Doğru cevap: **aktif yaşam formunda değillerdir ama çoğalma kapasiteleri yüksektir**. Asellülerlerin (hücresel yapıda olmayanların) gerçek hücresel yapıları yoktur, aktif yaşam formunda değillerdir, çoğalma kapasiteleri yüksektir ve bazılarının hücre zarı bile yoktur. Bu grupta virüsler (20–300 nm), viroidler (5 nm, tek iplikli RNA) ve prionlar (1 nm, yalnızca protein) bulunur.\nYanlış şıklar:\n• \"Gerçek hücresel yapıları vardır ve aktif yaşam formundadırlar\" → iki özelliğin de tersi doğrudur.\n• \"Çoğalma kapasiteleri düşüktür ve hepsinin hücre zarı vardır\" → çoğalma kapasiteleri yüksektir; bazılarının hücre zarı yoktur.\n• \"Prokaryotik hücre yapısındadırlar\" → prokaryotik olanlar bakteriler ve arkealardır; onlar hücreseldir.\n• \"Bakteriler ve arkealar bu gruptadır\" → bakteri ve arkealar hücresel yapıdadır.\n💡 Akılda kalsın: asellüler = hücresiz, kendi başına pasif ama konak hücre içinde hızla çoğalan. Fotokopi makinesi olmayan ama her matbaayı ele geçiren bir belge gibi.", "shuf": true}, {"q": "Bir mikrobiyal popülasyonun yaşadığı ortamdaki yerine ne ad verilir?", "opts": [{"t": "Vektör"}, {"t": "Mikrobiyom"}, {"t": "Kommünite"}, {"t": "Rezervuar"}, {"t": "Habitat"}], "a": 4, "exp": "Doğru cevap: **habitat**. Mikrobiyal hücreler doğada **popülasyon** adı verilen topluluklar halinde diğer hücrelerle birlikte yaşar; bir mikrobiyal popülasyonun yaşadığı ortamdaki yerine **habitat** denir.\nYanlış şıklar:\n• Vektör → bulaşta rol oynayan canlılardır (ör. tularemide kene, sinek gibi kan emen artropodlar); \"yaşanan yer\" anlamına gelmez.\n• Mikrobiyom → insanda bulunan bakterilere verilen addır.\n• Kommünite → popülasyonların birlikte bulunup birbirleriyle zararlı ya da yararlı etkileşim gösterdiği topluluktur.\n• Rezervuar → etkenin doğada barındığı kaynaktır (ör. Francisella için yabani memeliler, tavşanlar, keneler).\n💡 Akılda kalsın: popülasyon = aynı tür topluluğu; habitat = o topluluğun adresi. Latince \"habitare\" = oturmak, ikamet etmek.", "shuf": true}, {"q": "Aşağıdakilerden hangisi mikroorganizmaların **zararları** arasında sayılır?", "opts": [{"t": "Doğadaki azot (N) döngüsü"}, {"t": "Yoğurt ve boza üretimi"}, {"t": "İnsan, hayvan ve bitkileri hastalandırma; iş gücü kaybı gibi ekonomik kayıplar"}, {"t": "Biyolojik gübre üretimi"}, {"t": "Biyolojik atık su arıtımı"}], "a": 2, "exp": "Doğru cevap: **insan, hayvan ve bitkileri hastalandırma; iş gücü kaybı gibi ekonomik kayıplar**. Zararlar listesi şöyledir: mikroorganizmalar insanları, hayvanları, bitkileri hastalandırır; hastalığın ilerlemiş şekli ölümdür; bitki ve hayvanlarda hastalık ve ölüm ekonomik kayıp olarak değerlendirilir; kapitalist ekonomide insanların hastalanması (**iş gücü kaybı**) ve ölüm (sigorta giderleri) de ekonomik kayıptır.\nYanlış şıklar (hepsi yararlar listesindedir):\n• Doğadaki azot (N) döngüsü → C, N, P, S döngüleri yararlardandır.\n• Yoğurt ve boza üretimi → gıda üretimi yararlardandır.\n• Biyolojik gübre üretimi → yararlardandır.\n• Biyolojik atık su arıtımı → yararlardandır.\n💡 Akılda kalsın: zarar = hastalık + ölüm + ekonomik kayıp (iş gücü, sigorta). Gerisi neredeyse hep yarar hanesindedir.", "shuf": true, "html": true}, {"q": "Protista âleminin alt grupları hangileridir?", "opts": [{"t": "Alg, bakteri, virüs"}, {"t": "Protophyta, Protomycota, Protozoa"}, {"t": "Maya, küf, şapkalı mantar"}, {"t": "Eubacteria, Archae"}, {"t": "Nematod, trematod, sestod"}], "a": 1, "exp": "Doğru cevap: **Protophyta, Protomycota, Protozoa**. Protista âlemi bu üç alt gruptan oluşur — kabaca bitki benzeri, mantar benzeri ve hayvan benzeri tek hücreliler. Eski 3 âlemli sistemde de bitkiler ve hayvanların yanındaki üçüncü âlem Protista idi.\nYanlış şıklar:\n• Alg, bakteri, virüs → virüslerin 5 âlemde yeri yoktur; bakteriler Monera'dadır.\n• Maya, küf, şapkalı mantar → Fungi âlemindedir.\n• Eubacteria, Archae → Monera'nın gruplarıdır.\n• Nematod, trematod, sestod → parazitlerin helmint (solucan) gruplarıdır.\n💡 Akılda kalsın: PROTista'nın üçü de \"PROTO-\" ile başlar: Protophyta (phyton = bitki), Protomycota (myces = mantar), Protozoa (zoon = hayvan).", "shuf": true}, {"q": "Monera âlemi hangi canlıları kapsar?", "opts": [{"t": "Virüsler ve viroidler"}, {"t": "Bakteriler ve siyanobakteriler (Eubacteria ve Archae)"}, {"t": "Protozoalar ve algler"}, {"t": "Şapkalı mantarlar"}, {"t": "Mayalar ve küfler"}], "a": 1, "exp": "Doğru cevap: **bakteriler ve siyanobakteriler (Eubacteria ve Archae)**. Monera âlemi bunları kapsar; alt grupları **Eubacteria ve Archae**'dir. Bunlar \"hücresel yapıda olanlar\" içinde prokaryotik grubu oluşturur.\nYanlış şıklar:\n• Virüsler ve viroidler → asellülerdir; virüslerin 5 âlem sınıflandırmasında yeri yoktur.\n• Protozoalar ve algler → Protista âlemiyle ilgilidir (Protozoa, Protophyta).\n• Şapkalı mantarlar, mayalar ve küfler → Fungi âlemindedir.\n💡 Akılda kalsın: Monera = prokaryotlar (Eubacteria + Archae). Çekirdeksizlerin âlemi tektir: Monera.", "shuf": true}, {"q": "Taksonomik hiyerarşinin küçükten büyüğe doğru sıralanışı hangisidir?", "opts": [{"t": "Tür → cins → familya → takım → sınıf → şube → âlem"}, {"t": "Âlem → tür → cins → familya → takım → sınıf → şube"}, {"t": "Cins → tür → takım → familya → şube → sınıf → âlem"}, {"t": "Tür → cins → takım → familya → sınıf → şube → âlem"}, {"t": "Tür → familya → cins → sınıf → takım → âlem → şube"}], "a": 0, "exp": "Doğru cevap: **tür → cins → familya → takım → sınıf → şube → âlem**. Mantık şudur: benzer türler aynı cins, benzer cinsler aynı familya, benzer familyalar aynı takım, benzer takımlar aynı sınıf, benzer sınıflar aynı şube ve benzer şubeler aynı âlem altında toplanır.\nYanlış şıklar:\n• Âlemi başa koyan sıralama → âlem en büyük basamaktır; en sonda olmalıdır.\n• Cins → tür ile başlayan sıralama → tür cinsten küçüktür.\n• Takım–familya yer değiştirmiş sıralama → familya takımdan küçüktür (familya -aceae, takım -ales).\n• Familya → cins ve âlem → şube sıralaması → cins familyadan, şube âlemden küçüktür.\n💡 Akılda kalsın: \"Tür Cins Familya Takım Sınıf Şube Âlem\" → küçükten büyüğe. Asker benzetmesi: er (tür) → manga → bölük → tabur → alay → tümen → ordu (âlem).", "shuf": true}, {"q": "Aşağıdaki adlardan hangisi bir kişiye ithafen **verilmemiş**, bakterinin özelliklerini tanımlamak için verilmiştir?", "opts": [{"t": "Pasteurella multocida"}, {"t": "Escherichia coli"}, {"t": "Salmonella"}, {"t": "Streptococcus thermophilus"}, {"t": "Neisseria gonorrhoeae"}], "a": 3, "exp": "Doğru cevap: **Streptococcus thermophilus**. Bu ad bir kişiye ithafen değil, bakterinin özelliklerini anlatmak için verilmiştir: zincir şeklinde (Strepto), yuvarlak (coccus), sıcağa (thermo) dayanıklı/seven (philus).\nDiğerleri kişilere ithaftır:\n• Escherichia coli → Theodor von Escherich tarafından izole edilmiştir.\n• Salmonella → ilk kez Daniel Elmer Salmon tarafından izole edilmiştir.\n• Neisseria gonorrhoeae → Albert Neisser'e ithafen adlandırılmıştır.\n• Pasteurella multocida → Louis Pasteur'e ithaf edilmiştir.\n💡 Akılda kalsın: ad Latince bir özellik anlatıyorsa tanımlayıcı, bir soyadına benziyorsa ithaftır. Escherich, Salmon, Neisser, Pasteur — hepsi gerçek soyadlardır.", "shuf": true, "html": true}, {"q": "Hücresel yapıda olup **prokaryot** olan mikroorganizmalar hangileridir?", "opts": [{"t": "Viroidler ve mayalar"}, {"t": "Funguslar ve algler"}, {"t": "Bakteriler ve arkealar"}, {"t": "Protozoalar ve algler"}, {"t": "Virüsler ve prionlar"}], "a": 2, "exp": "Doğru cevap: **bakteriler ve arkealar**. Hücresel yapıda olan mikroorganizmalar içinde **prokaryotik olanlar** bunlardır. Protozoalar, algler ve funguslar da hücreseldir ama ökaryottur. Bakteriler prokaryottur; çekirdek, mitokondri, ER, Golgi vb. içermez.\nYanlış şıklar:\n• Viroidler ve mayalar → viroid asellülerdir; maya fungustur (hücresel ama prokaryot değil).\n• Funguslar ve algler → hücresel ama ökaryottur.\n• Protozoalar ve algler → hücresel ama ökaryottur.\n• Virüsler ve prionlar → asellülerdir (hücresel yapıları yoktur).\n💡 Akılda kalsın: prokaryot = bakteri + arkea = Monera (Eubacteria + Archae). Üç katman düşün: hücresiz (virüs-viroid-prion) → çekirdeksiz hücre (bakteri-arkea) → çekirdekli hücre (protozoa-alg-fungus).", "shuf": true, "html": true}, {"q": "Aşağıdakilerden hangisi asellüler mikroorganizma **değildir**?", "opts": [{"t": "Virüsler"}, {"t": "Viroidler"}, {"t": "Prionlar"}, {"t": "Bakteriler"}, {"t": "Hiçbiri"}], "a": 3, "exp": "Doğru cevap: **bakteriler**. Asellüler (hücresel yapıda olmayan) mikroorganizmalar **virüsler, viroidler ve prionlardır**. Bakteriler ise arkealarla birlikte hücresel yapıda olan prokaryotik mikroorganizmalardır; bu yüzden \"asellüler değildir\" sorusunun cevabı bakterilerdir.\nYanlış şıklar:\n• Virüsler (20–300 nm), viroidler (5 nm, tek iplikli RNA) ve prionlar (1 nm, yalnızca protein) → üçü de asellülerdir.\n• \"Hiçbiri\" → bakteriler asellüler olmadığı için bu şık da yanlıştır.\n💡 Akılda kalsın: hücresi olan en küçük canlılar bakteriler ve arkealardır; onlardan küçük olan virüs–viroid–prion üçlüsü hücresizdir.", "shuf": false, "tag": "Pekiştirme", "html": true}, {"q": "Slayta göre bakteriler (prokaryotlar) aşağıdakilerden hangisini içermez?", "opts": [{"t": "Çekirdek"}, {"t": "Peptidoglikan tabaka"}, {"t": "Hücre duvarı"}, {"t": "Polisakkarit kapsül (bazı türlerde)"}, {"t": "Dış membran (Gram negatiflerde)"}], "a": 0, "exp": "Doğru cevap: **çekirdek**. Bakteriler prokaryottur; **çekirdek**, mitokondri, ER, Golgi vb. zarlı yapıları içermez ve eşeysiz üreme ile çoğalır. İnsanda bulunan bakterilere mikrobiyom denir.\nYanlış şıklar (bunlar bakterilerde bulunabilir):\n• Hücre duvarı → bakteriler hücre duvarlarının Gram boyasıyla boyanmasına göre ikiye ayrılır.\n• Peptidoglikan tabaka → Gram pozitiflerde kalın peptidoglikan; Gram negatiflerde peptidoglikan + dış membran vardır.\n• Dış membran (Gram negatiflerde) → Gram negatif duvarın ikinci bileşenidir.\n• Polisakkarit kapsül (bazı türlerde) → S. aureus, S. pneumoniae, N. meningitidis ve Haemophilus gibi bakterilerde bulunur.\n💡 Akılda kalsın: prokaryot = \"pro\" (önce) + \"karyon\" (çekirdek) → çekirdek öncesi, yani çekirdeksiz. DNA'sı vardır ama zarla sarılı değildir, sitoplazmada serbesttir.", "shuf": true, "tag": "Pekiştirme"}, {"q": "Slayta göre canlıların sınıflandırılmasının tarihsel gelişimi hangisinde doğru verilmiştir?", "opts": [{"t": "Önce 2 âlem, sonra 3 âlem, bugün 5 âlem"}, {"t": "Önce 5 âlem, sonra 3 âlem, bugün 2 âlem"}, {"t": "Önce 3 âlem, sonra 2 âlem, bugün 5 âlem"}, {"t": "Önce 2 âlem, bugün 3 âlem"}, {"t": "Başından beri 5 âlem"}], "a": 0, "exp": "Doğru cevap: **önce 2 âlem, sonra 3 âlem, bugün 5 âlem**. Sınıflandırmanın tarihsel gelişimi: önce 2 âlem (bitkiler ve hayvanlar), sonra 3 âlem (bitkiler, hayvanlar ve protista), bugün 5 âlem (Plantae, Animalia, Fungi, Monera, Protista). Virüslerin bu sınıflandırmada yeri yoktur; ayrı bir grup olarak değerlendirilir.\nYanlış şıklar:\n• 5 → 3 → 2 sıralaması → gelişim tersine yazılmıştır; sistem zamanla genişlemiştir.\n• 3 → 2 → 5 sıralaması → başlangıç 2 âlemdir.\n• \"Bugün 3 âlem\" → bugün geçerli olan 5 âlemdir.\n• \"Başından beri 5 âlem\" → 5 âlem en son aşamadır.\n💡 Akılda kalsın: 2 → 3 → 5 (bitki-hayvan → + protista → + fungi + monera). Mikroskop geliştikçe âlem sayısı arttı: gördükçe böldük.", "shuf": true}, {"q": "Slayttaki bakteri sınıflandırmasına göre spor oluşturma özelliği hangi bakterilerde görülür?", "opts": [{"t": "Sadece Gram pozitif bakterilerde"}, {"t": "Sadece Gram negatif bakterilerde"}, {"t": "Sadece sarmal şekilli bakterilerde"}, {"t": "Sadece zorunlu hücre içi bakterilerde"}, {"t": "Tüm bakterilerde"}], "a": 0, "exp": "Doğru cevap: **sadece Gram pozitif bakterilerde**. Mikrop sınıflandırma tablosunda bakteriler ikinci basamakta **sporlu (sadece Gram pozitif bakteriler)** veya sporsuz olarak ayrılır. Gram pozitif basillerde de spor oluşturan **Bacillus** ile spor oluşturmayan **Listeria ve Corynebacterium** ayrımı yapılır.\nYanlış şıklar:\n• Sadece Gram negatiflerde → spor yalnızca Gram pozitiflerde vardır.\n• Sadece sarmal şekilli bakterilerde → sarmal şekilliler (Campylobacter, Helicobacter, Treponema, Borrelia, Leptospira) ayrı bir sınıflama başlığıdır; spor ölçütü değildir.\n• Sadece zorunlu hücre içilerde → zorunlu hücre içiler (Rickettsia, Chlamydia vb.) de ayrı bir başlıktır.\n• Tüm bakterilerde → sporsuz bakteriler de vardır (Listeria, Corynebacterium).\n💡 Akılda kalsın: spor = yalnız Gram pozitif (ör. Bacillus, Clostridium). Spor bakterinin üreme aracı değil, zor koşullara dayanma zırhıdır.", "shuf": true}, {"q": "Slayta göre enfeksiyonun oluşması neye bağlıdır?", "opts": [{"t": "Yalnızca mikroorganizmanın virülansına; konak savunması önemsizdir"}, {"t": "Mikroorganizmaların hastalık yetenekleri ile konağın savunması arasındaki etkileşime"}, {"t": "Yalnızca konağın savunma mekanizmalarının çökmesine"}, {"t": "Mikroorganizmanın habitatına"}, {"t": "Mikroorganizmanın hücresel ya da asellüler olmasına"}], "a": 1, "exp": "Doğru cevap: **mikroorganizmaların hastalık yetenekleri ile konağın savunması arasındaki etkileşime**. İnsan organizması (konak) yaşam boyu mikroorganizmalarla iç içedir. Vücut savunma mekanizmalarını kullanır; mikroorganizma ise hastalık oluşturarak direnci kırmaya çalışır. **Enfeksiyon bu iki gücün etkileşimi** sonucu oluşur; sonuçta konak hasta ya da sağlıklı olabilir. Karşılaşma sonucunda hastalık oluşmayabilir; enfeksiyon, bağışıklık, taşıyıcılık ya da subklinik enfeksiyon gelişebilir.\nYanlış şıklar:\n• \"Yalnızca mikroorganizmanın virülansına\" ve \"yalnızca konak savunmasının çökmesine\" → tek tarafı ele alır; tanım iki tarafın etkileşimidir.\n• \"Mikroorganizmanın habitatına\" → habitat, popülasyonun yaşadığı yerdir; enfeksiyonun belirleyicisi olarak verilmez.\n• \"Hücresel ya da asellüler olmasına\" → bu bir sınıflama ölçütüdür, enfeksiyon mekanizması değildir.\n💡 Akılda kalsın: enfeksiyon = mikrobun saldırı gücü ↔ konağın savunması. Bir kalenin düşmesi hem topun gücüne hem surun sağlamlığına bağlıdır.", "shuf": true}, {"q": "Slayttaki parazit sınıflandırmasına göre protozoaların (tek hücreli parazitler) grupları hangileridir?", "opts": [{"t": "Amipler, kamçılılar, sporozoonlar"}, {"t": "Nematodlar, trematodlar, sestodlar"}, {"t": "Maya, küf, dimorfik"}, {"t": "Sivrisinekler, keneler, pireler"}, {"t": "Eubacteria, Archae"}], "a": 0, "exp": "Doğru cevap: **amipler, kamçılılar, sporozoonlar**.\nParazit sınıflandırması:\n• **Protozoa (tek hücreli): amipler, kamçılılar, sporozoonlar** (doğru cevap)\n• Solucanlar (helmintler): yuvarlak (nematodlar), yapraksı (trematodlar), yassı (sestodlar)\n• Böcekler (artropodlar): sivrisinekler, keneler, pireler, bitler, akarlar, sinekler\nYanlış şıklar:\n• Nematodlar, trematodlar, sestodlar → helmintlerin gruplarıdır.\n• Maya, küf, dimorfik → mantarların gruplarıdır.\n• Sivrisinekler, keneler, pireler → artropodlardır.\n• Eubacteria, Archae → Monera'nın (bakteriler) gruplarıdır.\n💡 Akılda kalsın: protozoa = amip (hareket için yalancı ayak) + kamçılı (kamçı) + sporozoon (hareketsiz, sporlu). Hareket biçimi gruba adını verir.", "shuf": true}, {"q": "Slayttaki mikrop sınıflandırmasına göre virüsler hangi özelliklerine göre sınıflandırılır?", "opts": [{"t": "DNA veya RNA içermelerine, tek veya çift zincirli nükleik asit içermelerine, zarflı veya zarfsız olmalarına"}, {"t": "Gram boyanma özelliklerine"}, {"t": "Spor oluşturup oluşturmamalarına"}, {"t": "Maya veya küf formunda olmalarına"}, {"t": "Kok veya basil şeklinde olmalarına"}], "a": 0, "exp": "Doğru cevap: **DNA veya RNA içermelerine, tek veya çift zincirli nükleik asit içermelerine, zarflı veya zarfsız olmalarına**. Virüsler önce **DNA virüsleri / RNA virüsleri** olarak, sonra **tek veya çift zincirli nükleik asit içerenler** ve **zarflı veya zarfsız olanlar** şeklinde sınıflandırılır.\nYanlış şıklar (başka mikropların ölçütleri):\n• Gram boyanma özellikleri → bakterilerin ölçütüdür (Gram pozitif / Gram negatif / aside dirençli / diğer).\n• Spor oluşturup oluşturmama → bakterilerde kullanılır (sporlu olanlar yalnız Gram pozitifler).\n• Maya veya küf formu → mantarların ölçütüdür.\n• Kok veya basil şekli → bakterilerin ölçütüdür.\n💡 Akılda kalsın: virüs sınıflaması üç soru = nükleik asit tipi (DNA/RNA)? zincir sayısı (tek/çift)? zarf (var/yok)?", "shuf": true}, {"q": "Bakteri sporu ile ilişkili aşağıdaki ifadelerden hangisi **doğru değildir**?", "html": true, "shuf": true, "tag": "Feyyaz Akay", "opts": [{"t": "Gram negatif ve gram pozitif bakteriler tarafından üretilebilir"}, {"t": "Dehidrate olması ve içerdiği Ca-dipikolinat sporun direncinden sorumludur"}, {"t": "Bacillus ve Clostridium cinsleri spor oluşturabilir"}, {"t": "Mikroskobik incelemesinde Muzarelli ve Kleim gibi boyama yöntemleri kullanılabilir"}, {"t": "Bakteri sporu, mantar sporundan farklı olarak üreme elemanı kabul edilmez"}], "a": 0, "exp": "Yanlış (dolayısıyla aranan) ifade: **\"Gram negatif ve Gram pozitif bakteriler tarafından üretilebilir\"**. Spor yalnızca **Gram pozitif** bakterilerce üretilir; Gram negatifler spor oluşturmaz.\n📖 Kitap: Bakteri sporu için \"3D\"yi unutma: **Direnç, Dehidrate, Dipikolinik asit** — spor, dehidrate olması ve içerdiği Ca-dipikolinat sayesinde bakteriye direnç kazandırır. **Bacillus ve Clostridium** gibi Gram pozitif cinsler spor oluşturur. Sporun gösterilmesi için Muzarelli, Kleim gibi özel boyama yöntemleri kullanılır. Bakteri sporu, mantar sporundan farklı olarak üreme elemanı değildir; dayanıklılık formudur.\n📑 Slaytta: Mikrop sınıflandırma tablosunda bakteriler **sporlu (sadece Gram pozitif bakteriler)** veya sporsuz olarak ayrılır. Gram pozitif basil sunumunda spor oluşturan **Bacillus** ile spor oluşturmayan Listeria ve Corynebacterium ayrımı yapılır; şarbon tedavisinde \"sporların topraktan eliminasyonunun zor olduğu\" vurgulanır. Tyndall da bakterilerin sporları olduğu için tek ısıtmanın yetmediğini göstermiştir.\nDiğer şıklar kitaba göre doğru bilgilerdir (Ca-dipikolinat, Clostridium ve boyama yöntemleri kitaptan ek bilgidir).\n💡 Akılda kalsın: spor = yalnız Gram pozitif (Bacillus, Clostridium) + 3D (Direnç, Dehidrate, Dipikolinat)."}]}, {"title": "Bakteri Temelleri ve Klinik Sendromlar", "desc": "Gram ayrımı, hastalık oluşum aşamaları, hangi hastalıkta hangi etken tabloları, SEPSIS", "short": "Klinik", "questions": [{"q": "Konak bir mikroorganizmayla karşılaştığında slayta göre ortaya çıkabilecek sonuçlardan hangisi **DEĞİLDİR**?", "opts": [{"t": "Bağışıklık gelişir"}, {"t": "Hastalık oluşmaz"}, {"t": "Mikroorganizma konağın genomuna her zaman yerleşir"}, {"t": "Enfeksiyon oluşur"}, {"t": "Taşıyıcılık / subklinik enfeksiyon"}], "a": 2, "exp": "Doğru cevap: **\"Mikroorganizma konağın genomuna her zaman yerleşir.\"** — böyle bir sonuç yoktur; üstelik \"her zaman\" ifadesi, sonucun konak savunmasına göre değiştiği gerçeğiyle çelişir.\n\"Mikroorganizma ile karşılaşma\" şemasına göre olası sonuçlar: **hastalık oluşmaz, enfeksiyon oluşur, bağışıklık gelişir, taşıyıcılık, subklinik enfeksiyon.**\nKonak (insan) yaşam boyu mikroorganizmalarla iç içedir. Vücut savunma mekanizmalarını kullanır; mikroorganizma ise hastalık oluşturarak bu direnci kırmaya çalışır. Mücadelenin sonunda konak ya HASTA ya da SAĞLIKLI kalır.\n• Bağışıklık gelişir → şemada var; karşılaşma sonrası bağışıklık kazanılabilir.\n• Hastalık oluşmaz → şemada var; savunma galip gelirse hastalık gelişmez.\n• Enfeksiyon oluşur → şemada var.\n• Taşıyıcılık / subklinik enfeksiyon → şemada var; kişi belirti göstermeden mikroorganizmayı taşıyabilir.\n💡 Akılda kalsın: enfeksiyon = mikrobun hastalık yapma yeteneği ile konağın savunması arasındaki etkileşimin sonucu. \"Her zaman\" diyen şık, bu dengeyi yok saydığı için yanlıştır.", "shuf": true, "html": true}, {"q": "Mikropların sınıflandırma tablosuna göre \"sporlu olma\" özelliği hangi bakteri grubunda görülür?", "opts": [{"t": "Yalnızca Gram pozitif bakterilerde"}, {"t": "Yalnızca aside dirençli bakterilerde"}, {"t": "Yalnızca zorunlu hücre içi bakterilerde"}, {"t": "Hem Gram pozitif hem Gram negatiflerde eşit oranda"}, {"t": "Yalnızca Gram negatif bakterilerde"}], "a": 0, "exp": "Doğru cevap: **yalnızca Gram pozitif bakterilerde**.\n\"Mikropların sınıflandırılması\" tablosunda bakteriler önce **Gram pozitif / Gram negatif / aside dirençli / diğer** olarak ayrılır. İkinci basamakta kok–basil, aerobik–anaerobik, **sporlu (sadece Gram pozitif bakteriler) veya sporsuz**, kısmi veya tam aside dirençli, sarmal şekilli ve zorunlu hücre içi olanlar şeklinde alt gruplara bölünür.\nBağlantılar: Aerobik Gram pozitif basiller spor oluşturan (**Bacillus**: B. anthracis, B. cereus) ve spor oluşturmayan (**Listeria, Corynebacterium**) diye ikiye ayrılır. B. anthracis sporlarının topraktan eliminasyonu zordur. Tyndall da bakterilerin sporları olduğu için tek ısıtmanın yetmediğini göstermiş ve tindalizasyonu (3 gün 100 °C'de ½ saat) bulmuştur.\nYanlış şıklar:\n• Yalnızca aside dirençliler → aside dirençli bakteriler (Mycobacterium, Nocardia, Rhodococcus…) \"hareketsiz, **sporsuz** Gram pozitif basillerdir\".\n• Yalnızca zorunlu hücre içiler → Rickettsia, Chlamydia gibi organizmalar ayrı bir başlıktır; sporla ilişkilendirilmez.\n• Hem Gram pozitif hem negatif / yalnızca Gram negatif → tabloda spor özelliği yalnızca Gram pozitiflere verilmiştir.\n💡 Akılda kalsın: spor = yalnız Gram pozitif (ör. Bacillus). Spor, bakterinin zor koşullara karşı zırhıdır; üreme aracı değildir.", "shuf": true}, {"q": "Aşağıdakilerden hangisi slayttaki sarmal şekilli bakteriler arasında **DEĞİL**, zorunlu hücre içi organizmalar arasında sayılır?", "opts": [{"t": "Helicobacter"}, {"t": "Chlamydia"}, {"t": "Borrelia"}, {"t": "Treponema"}, {"t": "Leptospira"}], "a": 1, "exp": "Doğru cevap: **Chlamydia**.\n\"Diğer bakteriler\" bölümü iki gruba ayrılır:\n• **Sarmal şekilli bakteriler:** Campylobacter, Helicobacter, Treponema, Borrelia, Leptospira.\n• **Zorunlu hücre içi organizmalar:** Rickettsia, Orientia, Ehrlichia, Anaplasma, Coxiella, Chlamydia.\nChlamydia ikinci listededir; yalnızca hücre içinde çoğalabilir. Klinik sendrom tablosunda da C. trachomatis üretrit, servisit ve proktit etkeni olarak geçer.\nYanlış şıklar (hepsi sarmal gruptadır):\n• Helicobacter → tabloda gastrit etkeni (H. pylori).\n• Borrelia → tabloda miyokardit etkeni (B. burgdorferi).\n• Treponema → tabloda genital ülser ve granülomatöz enfeksiyon etkeni (T. pallidum).\n• Leptospira → sarmal bakteridir.\n💡 Akılda kalsın: sarmallar = C-H-T-B-L (Campylobacter, Helicobacter, Treponema, Borrelia, Leptospira); zorunlu hücre içiler = Rickettsia, Orientia, Ehrlichia, Anaplasma, Coxiella, Chlamydia. Hücre içine mahkûm olanlar kültürde zor ürer; tanı çoğu kez seroloji/moleküler testle konur.", "shuf": true, "html": true}, {"q": "Bakterilerin genel özellikleriyle ilgili aşağıdakilerden hangisi **YANLIŞTIR**?", "opts": [{"t": "Çekirdek, mitokondri, ER ve Golgi içermez"}, {"t": "Prokaryottur"}, {"t": "İnsanda bulunan bakterilere mikrobiyom denir"}, {"t": "Eşeyli üreme ile çoğalırlar"}, {"t": "Steril vücut dokularının istilası ile hastalık oluşur"}], "a": 3, "exp": "Yanlış (dolayısıyla aranan) ifade: **\"eşeyli üreme ile çoğalırlar\"**. Bakteriler **eşeysiz** üreme (ikiye bölünme) ile çoğalır.\n\"Bakterilerin özellikleri\" başlığındaki doğru bilgiler:\n• Bakteriler **prokaryottur** → hücre içi organellerin zarla çevrili olup olmamasına göre iki hücre tipi vardır: prokaryot ve ökaryot.\n• Çekirdek, mitokondri, ER, Golgi vb. içermezler → prokaryot oldukları için zarla çevrili organelleri yoktur.\n• İnsanda bulunan bakterilere **mikrobiyom** denir.\n• Hastalık, **steril vücut dokularının istilası** ile oluşur.\n• Hücre duvarlarının Gram boyasıyla boyanmasına göre Gram pozitif ve Gram negatif olarak ikiye ayrılırlar.\n💡 Akılda kalsın: bakteri = prokaryot + organelsiz + eşeysiz üreme. Bir bakteri bölünerek iki özdeş kopya yapar; eşi yoktur, eşeyi de yoktur.", "shuf": true, "html": true}, {"q": "Gram pozitif ve Gram negatif bakterilerin hücre duvarı farkı hangisinde doğru verilmiştir?", "opts": [{"t": "Gram negatifte peptidoglikan yoktur"}, {"t": "Her ikisinde de dış membran vardır"}, {"t": "Gram pozitifte peptidoglikan yoktur"}, {"t": "Gram pozitifte dış membran vardır, Gram negatifte yoktur"}, {"t": "Gram negatifte hem peptidoglikan hem dış membran vardır; Gram pozitifte yalnızca peptidoglikan vardır"}], "a": 4, "exp": "Doğru cevap: **Gram negatifte hem peptidoglikan hem dış membran vardır; Gram pozitifte yalnızca peptidoglikan vardır**.\n• **Gram pozitif:** sadece peptidoglikan tabaka.\n• **Gram negatif:** peptidoglikan tabaka + dış membran.\nYani peptidoglikan her iki grupta ortaktır; **dış membran yalnızca Gram negatiflere özgüdür**.\nAntibiyotik bağlantısı: kolistin ve polimiksin B dış membranın geçirgenliğini bozar; birçok Gram negatife etkilidir ama Gram pozitiflere etkisizdir, çünkü Gram pozitifler dış membran içermez.\nYanlış şıklar:\n• \"Gram negatifte peptidoglikan yoktur\" → Gram negatifte de (ince de olsa) peptidoglikan vardır.\n• \"Her ikisinde de dış membran vardır\" → Gram pozitifte dış membran yoktur.\n• \"Gram pozitifte peptidoglikan yoktur\" → Gram pozitifin tek duvar tabakası peptidoglikandır.\n• \"Gram pozitifte dış membran var, Gram negatifte yok\" → tam tersidir.\n💡 Akılda kalsın: Gram negatif = peptidoglikan + DIŞ MEMBRAN. Gram pozitif kalın tek duvarlı ev, Gram negatif iki duvarlı (avlulu) ev gibidir.", "shuf": true}, {"q": "Slayta göre bir mikroorganizmanın hastalık oluşturma aşamalarının doğru sırası hangisidir?", "opts": [{"t": "Yayılma → Tutunma → Maruz kalma → Hastalık"}, {"t": "Maruz kalma → Toksisite → Tutunma → Enfeksiyon → Hastalık"}, {"t": "Maruz kalma → Tutunma → Yayılma → Enfeksiyon → Toksisite → Doku hasarı → Hastalık"}, {"t": "Tutunma → Maruz kalma → Enfeksiyon → Yayılma → Hastalık"}, {"t": "Maruz kalma → Enfeksiyon → Tutunma → Doku hasarı → Toksisite → Hastalık"}], "a": 2, "exp": "Doğru cevap: **Maruz kalma → Tutunma → Yayılma → Enfeksiyon → Toksisite → Doku hasarı → Hastalık**.\n\"Bakterilerin hastalıklardaki etkileri\" konusuna göre mikroorganizma bu aşamaları sırayla geçer. Mantık zinciri: önce mikroorganizmayla **karşılaşılır (maruz kalma)**, bakteri konak hücreye **tutunur**, dokuda **yayılır**, **enfeksiyon** kurulur, toksinler etkisini gösterir (**toksisite**), **doku hasarı** gelişir ve sonuçta **hastalık** ortaya çıkar.\nEk bilgi: birçok mikroorganizmanın klinik tablosu benzer olduğundan tedavi için etkenin **uygun testlerle doğru belirlenmesi** gerekir.\nTutunma örnekleri: gonokokta pilin ağız boşluğu ve vajinaya tutunmayı sağlar; S. pyogenes'te M ve F proteinleri yapışma ve yayılma yapar.\nYanlış şıklar:\n• Yayılma veya tutunma ile başlayan sıralar → ilk basamak her zaman maruz kalmadır.\n• Toksisitenin tutunmadan önce geldiği sıra → bakteri önce tutunmalıdır.\n• Enfeksiyonun tutunmadan önce geldiği sıra → enfeksiyon, tutunma ve yayılmadan sonra kurulur.\n💡 Akılda kalsın: \"Maruz kal – Tutun – Yayıl – Enfekte et – Toksin sal – Hasar ver – Hasta et.\" Bir işgal planı gibi: kıyıya çık, köprübaşı tut, iç bölgeye yayıl, sonra tahribat.", "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre farenjitin en yaygın bakteriyel etkeni hangisidir?", "opts": [{"t": "Moraxella catarrhalis"}, {"t": "Staphylococcus aureus"}, {"t": "Streptococcus pneumoniae"}, {"t": "Streptococcus pyogenes (grup A)"}, {"t": "Haemophilus influenzae"}], "a": 3, "exp": "Doğru cevap: **Streptococcus pyogenes (grup A)**.\nKlinik sendromlar tablosunda üst solunum yolu başlığında farenjit etkeni olarak yalnızca **S. pyogenes (grup A)** yazılıdır; \"bakteriyel farenjitin asıl sorumlusudur\". Farenjit ve yumuşak doku enfeksiyonları M proteini ile oluşturulur; damlacık yoluyla yayılır. Tedavi edilmezse (ilk 10 gün içinde tedavi başlamazsa) **romatizmal ateş** gelişebilir; tedavide penisilin V ve amoksisilin kullanılır.\nYanlış şıklar:\n• Moraxella catarrhalis → tabloda sinüzit, otitis media ve bronşit etkeni.\n• Staphylococcus aureus → tabloda eksternal otit, impetigo, fronkül vb. etkeni; farenjit başlığında yoktur.\n• Streptococcus pneumoniae → tabloda sinüzit, otitis media, pnömoni, menenjit etkeni.\n• Haemophilus influenzae → tabloda sinüzit, otitis media, menenjit etkeni.\n💡 Akılda kalsın: sinüzit/otitis media üçlüsü = S. pneumoniae + H. influenzae + M. catarrhalis; farenjit = grup A streptokok. Boğaz kültürünün klasik hedefi de budur.", "org": ["spyogenes"], "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre kateter ile ilişkili sepsisin en yaygın etkeni hangisidir?", "opts": [{"t": "Enterococcus faecalis"}, {"t": "Koagülaz-negatif stafilokoklar"}, {"t": "Streptococcus agalactiae"}, {"t": "Escherichia coli"}, {"t": "Neisseria meningitidis"}], "a": 1, "exp": "Doğru cevap: **koagülaz-negatif stafilokoklar**.\nTablonun sepsis başlığı üçe ayrılır:\n• **Genel sepsis:** S. aureus, koagülaz-negatif stafilokoklar, E. coli, Klebsiella pneumoniae, P. aeruginosa.\n• **Kateter ile ilişkili sepsis:** koagülaz-negatif stafilokoklar.\n• **Septik tromboflebit:** S. aureus, P. aeruginosa.\nKoagülaz-negatif stafilokoklar tabloda yabancı cisim/cihazla ilişkili diğer enfeksiyonlarda da öne çıkar: diyaliz ile ilişkili peritonit, cerrahi yaralar, protez ile ilişkili enfeksiyonlar. (Neden? Cilt florasının üyesidirler ve plastik yüzeylere biyofilmle tutunurlar.)\nYanlış şıklar:\n• Enterococcus faecalis → tabloda peritonit, prostatit, yanık enfeksiyonu etkeni; nozokomiyal enfeksiyon nedeni olsa da kateter sepsisi başlığında yoktur.\n• Streptococcus agalactiae → yenidoğan sepsisi ve menenjiti ile ilişkilidir.\n• Escherichia coli → genel sepsis etkenidir; kateter sepsisi başlığında yoktur.\n• Neisseria meningitidis → meningokoksemi ve menenjit etkenidir.\n💡 Akılda kalsın: kateter, diyaliz, protez — yani her tür \"takılan cihaz\" = koagülaz-negatif stafilokok.", "shuf": true}, {"q": "Tabloda endokardit etkenleri arasında sayılan HACEK grubunda hangi organizmalar bulunur?", "opts": [{"t": "Haemophilus, Aggregatibacter, Cardiobacterium, Eikenella, Kingella"}, {"t": "Haemophilus, Acinetobacter, Campylobacter, Enterococcus, Klebsiella"}, {"t": "Helicobacter, Acinetobacter, Corynebacterium, Eikenella, Kingella"}, {"t": "Haemophilus, Acinetobacter, Clostridium, Enterococcus, Klebsiella"}, {"t": "Helicobacter, Aggregatibacter, Campylobacter, E. coli, Klebsiella"}], "a": 0, "exp": "Doğru cevap: **Haemophilus, Aggregatibacter, Cardiobacterium, Eikenella, Kingella**.\nTablodaki endokardit etkenleri: viridans streptokoklar, S. aureus, koagülaz-negatif stafilokoklar, **HACEK organizmaları** ve Coxiella.\nHACEK harf harf: **H**aemophilus – **A**ggregatibacter – **C**ardiobacterium – **E**ikenella – **K**ingella.\nBağlantı: Eikenella corrodens ve Kingella kingae ağız florasında bulunan fırsatçı patojenlerdir; her ikisinin hastalıkları arasında **subakut endokardit** sayılır. Eikenella endokarditi seftriakson ile tedavi edilir.\nYanlış şıklar:\n• Acinetobacter içerenler → Acinetobacter solunum yolu, idrar yolu, yara enfeksiyonu ve sepsis etkenidir; HACEK'te yoktur.\n• Helicobacter, Campylobacter içerenler → bunlar sarmal bakterilerdir; tabloda gastrit ve gastroenterit etkenidir.\n• Enterococcus, Klebsiella, Clostridium, Corynebacterium, E. coli → HACEK'in harfleriyle uyumsuz; \"A\" Aggregatibacter, \"C\" Cardiobacterium'dur.\n💡 Akılda kalsın: HACEK'in E'si Eikenella, K'si Kingella — ikisi de ağız florasından, ikisi de subakut endokardit yapar. HACEK grubu, kültürde yavaş üreyen \"sessiz\" endokardit etkenleridir.", "org": ["haemophilus", "eikenella", "kingella"], "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre aşağıdaki hastalık–etken eşleştirmelerinden hangisi **YANLIŞTIR**?", "opts": [{"t": "Basiller anjiyomatozis – Bartonella henselae"}, {"t": "Isırık yaraları – Eikenella corrodens, Pasteurella multocida"}, {"t": "Gastrit – Helicobacter pylori"}, {"t": "Antibiyotik ilişkili diyare – Clostridioides difficile"}, {"t": "Erizipel – Neisseria gonorrhoeae"}], "a": 4, "exp": "Yanlış (dolayısıyla aranan) eşleştirme: **erizipel – Neisseria gonorrhoeae**. Tabloda erizipelin etkeni **S. pyogenes**'tir; S. pyogenes'in hastalıkları arasında erizipel, selülit, piyoderma ve nekrotizan fasiit sayılır. N. gonorrhoeae ise tabloda **üretrit, servisit, proktit ve artrit** başlıklarında geçer; ayrıca septik artritin en sık nedenidir.\nDiğer eşleştirmeler tablodakiyle aynıdır:\n• Basiller anjiyomatozis – Bartonella henselae (ve B. quintana) → doğru.\n• Isırık yaraları – Eikenella corrodens, Pasteurella multocida, karışık aerop ve anaeroplar → doğru. Eikenella insan ısırığı, Pasteurella hayvan (özellikle kedi) ısırığı/tırmalaması ile ilişkilidir.\n• Gastrit – Helicobacter pylori → doğru.\n• Antibiyotik ile ilişkili diyare – Clostridioides difficile → doğru; tedavisinde fidaksomisin geçer.\n💡 Akılda kalsın: deri–yumuşak dokuda \"erizipel\" yalnız S. pyogenes; selülitte S. pyogenes + S. aureus. Erizipelin keskin sınırlı, parlak kırmızı plağı grup A streptokokun imzasıdır.", "shuf": true, "html": true}, {"q": "Slayta göre \"bakteriyel virülans\" nedir?", "opts": [{"t": "Bakteriyi öldüren en düşük antibiyotik konsantrasyonu"}, {"t": "Bir antibiyotiğin etkili olduğu mikroorganizma grubu"}, {"t": "Bakterinin Gram boyanma özelliği"}, {"t": "Bakterinin spor oluşturma hızı"}, {"t": "Bakterinin insan vücudu gibi düşman ortamlarda hayatta kalma yeteneği"}], "a": 4, "exp": "Doğru cevap: **bakterinin insan vücudu gibi düşman ortamlarda hayatta kalma yeteneği**. Tanım aynen şöyledir: \"Bakteriyel virülans, bakterilerin insan vücudu gibi düşman ortamlarda hayatta kalma yeteneğidir.\"\nVirülans; **tutunma, immün sistemden kaçma ve hidrolitik enzim üretme** yetenekleri ile ölçülür. Virülansı en yüksek sayılanlar: S. pneumoniae, S. agalactiae, S. pyogenes ve S. aureus.\nYanlış şıklar:\n• Bakteriyi öldüren en düşük antibiyotik konsantrasyonu → bu **Minimal Bakterisidal Konsantrasyon (MBK)** tanımıdır.\n• Bir antibiyotiğin etkili olduğu mikroorganizma grubu → bu **antibakteriyel spektrum** tanımıdır.\n• Gram boyanma özelliği → hücre duvarı yapısına göre sınıflandırma ölçütüdür; virülans değildir.\n• Spor oluşturma hızı → virülans tanımıyla ilişkilendirilmez; spor yalnız Gram pozitiflerde görülen bir sınıflandırma özelliğidir.\n💡 Akılda kalsın: virülans = \"düşman ortamda hayatta kalma\"; MİK = durdurur, MBK = öldürür, spektrum = etki alanı. \"Virulentus\" Latince \"zehirli\" demektir.", "shuf": true}, {"q": "Slayttaki SEPSIS kısaltmasına göre aşağıdakilerden hangisi sepsisin uyarı belirtileri arasında **yer almaz**?", "opts": [{"t": "Extreme pain: aşırı ağrı / genel rahatsızlık"}, {"t": "Short of breath: nefes darlığı"}, {"t": "Sweet urine: tatlı idrar"}, {"t": "Shivering: titreme, ateş veya çok üşüme"}, {"t": "Pale: soluk veya renk değişmiş cilt"}], "a": 2, "exp": "Doğru cevap: **\"Sweet urine: tatlı idrar\"** — bu, SEPSIS listesinde yoktur (tatlı idrar diyabeti çağrıştırır, sepsisi değil).\nSEPSIS kısaltmasında her harf bir uyarı belirtisidir:\n• **S**hivering, fever or very cold → titreme, ateş veya çok üşüme.\n• **E**xtreme pain or general discomfort → aşırı ağrı / genel rahatsızlık.\n• **P**ale or discolored skin → soluk veya renk değişmiş cilt.\n• **S**leepy, difficult to wake, confused → uykulu hal, zor uyanma, konfüzyon.\n• **I** feel like I might die → \"ölecekmiş gibi hissediyorum\".\n• **S**hort of breath → nefes darlığı.\nTablo bağlantısı: genel sepsisin en yaygın etkenleri S. aureus, koagülaz-negatif stafilokoklar, E. coli, Klebsiella pneumoniae ve P. aeruginosa'dır; meningokok ve pnömokok için de ağır/fulminan sepsis geçer.\n💡 Akılda kalsın: S-E-P-S-I-S = Titreme, Aşırı ağrı, Soluk cilt, Uykululuk/konfüzyon, \"Ölecek gibiyim\", Nefes darlığı. Altı harf, altı alarm zili.", "shuf": true, "html": true}, {"q": "\"Mikrobiyom\" terimi slayta göre neyi ifade eder?", "opts": [{"t": "İnsanda bulunan bakterileri"}, {"t": "Steril vücut dokularını istila eden bakterileri"}, {"t": "Yalnızca hastalık yapan bakterileri"}, {"t": "Toprakta yaşayan mikroorganizmaları"}, {"t": "Laboratuvarda saf kültürde üretilen bakterileri"}], "a": 0, "exp": "Doğru cevap: **insanda bulunan bakteriler**. Tanım: **insanda bulunan bakterilere mikrobiyom denir.** Hastalık ise **steril vücut dokularının istilası** ile oluşur; yani mikrobiyomu oluşturan bakterilerin varlığı tek başına hastalık demek değildir. Bazı bakteriler insan florasında normal olarak bulunur: aerobik Gram pozitif koklar ağızda, GİS'te, genitoüriner sistemde ve ciltte yaygındır; Eikenella ve Kingella ağız florasındadır.\nYanlış şıklar:\n• Steril vücut dokularını istila eden bakteriler → bu hastalık oluşum mekanizmasıdır, mikrobiyom tanımı değildir.\n• Yalnızca hastalık yapan bakteriler → mikrobiyom insandaki tüm bakterileri kapsar; çoğu hastalık yapmaz.\n• Toprakta yaşayan mikroorganizmalar → tanım insanla ilgilidir.\n• Laboratuvarda saf kültürde üretilenler → bu \"saf (aksenik) kültür\" kavramıdır (Koch, Pastör).\n💡 Akılda kalsın: mikrobiyom = insandaki bakteri \"nüfusu\"; hastalık = bu nüfusun steril bölgeye göçü. Vücut, florası olan bölgeler ile steril bölgelerin haritasıdır.", "shuf": true}, {"q": "Bakterilerin Gram pozitif / Gram negatif olarak ayrılması hangi yapının boyanma özelliğine dayanır?", "opts": [{"t": "Ribozom"}, {"t": "Sitoplazma"}, {"t": "Hücre zarı"}, {"t": "Hücre duvarı"}, {"t": "Kapsül"}], "a": 3, "exp": "Doğru cevap: **hücre duvarı**. Bakteriler, **hücre duvarlarının Gram boyası ile boyanmasına göre** ikiye ayrılır:\n• **Gram pozitif** duvar: yalnızca peptidoglikan tabaka.\n• **Gram negatif** duvar: peptidoglikan tabaka + dış membran.\nBu ayrım klinikte çok önemlidir: antibiyotik tablosunda pek çok ilacın spektrumu \"Gram pozitiflere etkili / Gram negatiflere etkisiz\" şeklinde tanımlanır (vankomisin Gram negatiflere, kolistin Gram pozitiflere etkisizdir).\nYanlış şıklar:\n• Ribozom → protein sentezinin yeridir; aminoglikozid, tetrasiklin, makrolid gibi ilaçların hedefidir ama Gram boyanmayı belirlemez.\n• Sitoplazma → hücre içeriğidir; boyanma farkı buradan kaynaklanmaz.\n• Hücre zarı → her iki grupta da bulunur; ayrımın temeli değildir.\n• Kapsül → fagositozdan korunmayı sağlayan dış yapıdır (pnömokok, meningokok, Hib); Gram ayrımının ölçütü değildir.\n💡 Akılda kalsın: Gram boyası = hücre DUVARI farkı. Kalın peptidoglikan boyayı tutar (mor = pozitif); ince duvar + dış membran boyayı bırakır (pembe = negatif).", "shuf": true}, {"q": "Neisseria gonorrhoeae'nin hücre duvarında bulunan ve endotoksin üreten yapı slayta göre hangisidir?", "opts": [{"t": "Poli-D-glutamik asit"}, {"t": "Lipopolisakkarit"}, {"t": "Peptidoglikan"}, {"t": "Mikolik asit"}, {"t": "Hiyaluronik asit"}], "a": 1, "exp": "Doğru cevap: **lipopolisakkarit**. Gonokokta \"**lipopolisakkarit hücre duvarı endotoksin üretir**\". Lipopolisakkarit (LPS), Gram negatif bakterilerin dış membranıyla ilişkili bir yapıdır. Benzer şekilde meningokokta hücre duvarındaki **lipopoligosakkarit endotoksindir**; Haemophilus influenzae'de hücre duvarındaki **Lipid A menenjiti indükler**.\nGonokokun diğer virülans yapıları: pilin (ağız boşluğu ve vajinaya tutunma), porin (nötrofillerde fagozom füzyonunu önler), opasite proteini (hücreye tutunma), beta laktamaz (penisilin direnci).\nYanlış şıklar:\n• Poli-D-glutamik asit → B. anthracis kapsülünün yapısıdır; fagositozu önler.\n• Peptidoglikan → tüm bakterilerin hücre duvarında bulunur; endotoksin değildir.\n• Mikolik asit → aside dirençli bakterilerin (Mycobacterium, Nocardia…) duvarında bulunur; asitle boyanmaya direnç verir.\n• Hiyaluronik asit → S. pyogenes'in immünojenik olmayan kapsülünün yapısıdır.\n💡 Akılda kalsın: Gram negatif koklarda endotoksin = LPS/LOS/Lipid A. Endotoksin salgılanmaz; bakteri parçalanınca açığa çıkar ve ateş–şok tablosunu tetikler.", "org": ["gonokok"], "shuf": true}, {"q": "Slayta göre aşağıdaki bakterilerden hangisinin aşısı **YOKTUR**?", "opts": [{"t": "Bordetella pertussis"}, {"t": "Neisseria meningitidis"}, {"t": "Haemophilus influenzae"}, {"t": "Streptococcus pneumoniae"}, {"t": "Neisseria gonorrhoeae"}], "a": 4, "exp": "Doğru cevap: **Neisseria gonorrhoeae** — gonokok için açıkça \"**aşısı yoktur**\" denir. Korunma kondom kullanımı ve hasta eğitimi ile sağlanır; tedavide seftriakson ve azitromisin kullanılır, yenidoğan profilaksisinde %1'lik AgNO3 uygulanır.\nDiğerlerinin aşısı vardır:\n• Bordetella pertussis → aşı 5 doz (2, 4, 6, 15–18. aylar ve 4–6 yaş); aşılar filamentöz hemaglutinin, pertaktin gibi tutunma proteinlerinden yapılır.\n• Neisseria meningitidis → \"aşısı vardır\"; ilk 6 ayda bebekte immünite bulunur.\n• Haemophilus influenzae → HIB aşısı (konjuge PRP); ilk 6 ayda, sonra 12–15. ayda yapılır.\n• Streptococcus pneumoniae → çocuklara 13 değerli konjuge, erişkinlere 23 değerli polivalan aşı.\nAşısı olmayan diğer bakteriler: S. aureus (\"aşı yok\") ve S. agalactiae (\"aşısı yoktur\").\n💡 Akılda kalsın: gonokok, S. aureus ve grup B streptokokun aşısı yok. Gonokok yüzey antijenlerini (pilin) sürekli değiştirir; aşı geliştirmeyi zorlaştıran da budur.", "org": ["gonokok", "pertussis", "meningokok", "haemophilus", "spneumoniae"], "shuf": true, "html": true}, {"q": "Aşağıdakilerden hangisi slaytlarda HÜCRE İÇİ patojen olarak tanımlananlardan **DEĞİLDİR**?", "opts": [{"t": "Francisella tularensis"}, {"t": "Mycobacterium tuberculosis"}, {"t": "Brucella spp."}, {"t": "Streptococcus pyogenes"}, {"t": "Listeria monocytogenes"}], "a": 3, "exp": "Doğru cevap: **Streptococcus pyogenes** — hücre içi patojen değildir.\nHücre içi yaşamı açıkça belirtilenler:\n• **Francisella tularensis** → \"hücre içi patojendir; fagositoza dirençlidir.\"\n• **Brucella** → \"retiküloendotelyal hücre içi patojendir\"; fagositoza ve seruma dirençlidir.\n• **Listeria monocytogenes** → \"hücre içi fakültatiftir\"; hemolizinler hücrede sağ kalmasını ve çoğalmasını sağlar.\n• **Mycobacterium tuberculosis** → \"hücre içi patojendir ve hayat boyu enfeksiyon oluşturabilir\"; fagozom–lizozom birleşmesini engeller.\n**S. pyogenes** için böyle bir ifade yoktur; stratejisi farklıdır: hücre dışında kalarak fagositozdan kaçar. Hiyaluronik asit kapsülü vardır; M, M benzeri ve C5 proteinleri fagositozu önler; M ve F proteinleri yapışma ve yayılma sağlar.\n💡 Akılda kalsın: hücre içi dörtlü = Francisella, Brucella, Listeria, M. tuberculosis. Hücre içine saklananlar kronik/granülomatöz seyir yapar; S. pyogenes ise dışarıda hızlı ve irinli savaşır.", "org": ["francisella", "tbc", "brucella", "spyogenes", "listeria"], "shuf": true, "html": true}, {"q": "Slayta göre bakteriler aşağıdakilerden hangisine göre **SINIFLANDIRILMAZ**?", "opts": [{"t": "Hücrelerin şekli"}, {"t": "Üremeleri ve solunum türleri"}, {"t": "Koloni kokusu"}, {"t": "Hücrelerin büyüklüğü"}, {"t": "Yerleşimleri (dizilimleri)"}], "a": 2, "exp": "Doğru cevap: **koloni kokusu** — sınıflandırma ölçütleri arasında yoktur.\n\"Bakterilerin sınıflandırılması\" başlığına göre bakteriler **hücrelerin büyüklüğü, şekli, yerleşimleri, üremeleri ve solunum türlerine** göre sınıflandırılır.\nÖrnekler:\n• Şekil → kok / basil / sarmal (Campylobacter, Helicobacter, Treponema…).\n• Solunum türü → aerobik / anaerobik (ör. S. aureus hem aerobik hem anaerobik çoğalır).\n• Yerleşim/dizilim → Streptococcus adı \"zincir şeklinde (strepto) yuvarlak (coccus)\" anlamına gelir.\n• Büyüklük → Brucella \"çok küçüktür\".\nAyrıca mikropların sınıflandırma tablosunda Gram boyanma, sporlu olma, aside dirençlilik ve zorunlu hücre içi olma da ölçüt olarak geçer.\n💡 Akılda kalsın: Büyüklük – Şekil – Yerleşim – Üreme – Solunum. (Koku laboratuvarda bazen ipucu verir ama resmi bir sınıflandırma ölçütü değildir.)", "shuf": true, "html": true}, {"q": "Enfeksiyon oluşması slayta göre neyin sonucudur?", "opts": [{"t": "Mikroorganizmanın hastalık yapma yetenekleri ile konağın savunması arasındaki etkileşimin"}, {"t": "Yalnızca mikroorganizmanın virülansının"}, {"t": "Yalnızca konağın savunma mekanizmalarının yetersizliğinin"}, {"t": "Yalnızca vücuda giren mikroorganizma sayısının"}, {"t": "Konağın daha önce antibiyotik kullanmış olmasının"}], "a": 0, "exp": "Doğru cevap: **mikroorganizmanın hastalık yapma yetenekleri ile konağın savunması arasındaki etkileşimin**. Tanım: \"Enfeksiyon oluşması, MO'ların hastalık yetenekleri ile konağın savunması arasındaki etkileşim sonucu oluşur.\"\nKonak yaşam boyu mikroorganizmalarla iç içedir; vücut savunma mekanizmalarını kullanır, mikroorganizma ise hastalık oluşturarak direnci kırmaya çalışır. Sonuçta konak hasta ya da sağlıklı kalır. Karşılaşma; hastalık oluşmaması, enfeksiyon, bağışıklık, taşıyıcılık veya subklinik enfeksiyon ile sonuçlanabilir.\nYanlış şıklar:\n• \"Yalnızca virülans\" → eksik; konağın savunması hesaba katılmamıştır.\n• \"Yalnızca konağın savunma yetersizliği\" → eksik; mikroorganizmanın yetenekleri de belirleyicidir (bağışıklığı zayıf kişilerde risk artsa da tek neden değildir).\n• \"Yalnızca mikroorganizma sayısı\" → tek başına belirleyici değildir.\n• \"Antibiyotik kullanımı\" → tanımda yoktur.\n💡 Akılda kalsın: anahtar kelime \"ETKİLEŞİM\" — \"yalnızca…\" ile başlayan tek taraflı şıklar yanlıştır.", "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre menenjitin en yaygın etkenleri arasında **YER ALMAYAN** hangisidir?", "opts": [{"t": "Haemophilus influenzae"}, {"t": "Pseudomonas aeruginosa"}, {"t": "Escherichia coli"}, {"t": "Neisseria meningitidis"}, {"t": "Streptococcus agalactiae (grup B)"}], "a": 1, "exp": "Doğru cevap: **Pseudomonas aeruginosa** — menenjit listesinde yoktur.\nTablodaki SSS–menenjit etkenleri: **S. agalactiae (grup B), E. coli, H. influenzae, S. pneumoniae, N. meningitidis, Listeria monocytogenes.**\nBağlantılar: S. agalactiae ve Listeria yenidoğan menenjiti, N. meningitidis meninkslerin inflamasyonu ve meningokoksemi, H. influenzae (özellikle serotip b) ve S. pneumoniae çocuk ve yaşlı menenjiti ile ilişkilidir.\nP. aeruginosa ise tabloda eksternal otit, keratit, endoftalmit, follikülit, paronişi, yanık enfeksiyonu, osteomiyelit, prostatit gibi başlıklarda geçer; menenjit listesinde yer almaz.\n💡 Akılda kalsın: tablodaki menenjit altılısı = GBS, E. coli, Hib, pnömokok, meningokok, Listeria. Yaşa göre sırala: yenidoğan (GBS, E. coli, Listeria) → çocuk/erişkin (Hib, pnömokok, meningokok) → yaşlı (pnömokok, Listeria).", "shuf": true, "html": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre eksternal otitin (dış kulak yolu iltihabı) en yaygın etkenleri hangileridir?", "opts": [{"t": "Brucella türleri"}, {"t": "S. pneumoniae, H. influenzae, M. catarrhalis"}, {"t": "N. gonorrhoeae"}, {"t": "Pseudomonas aeruginosa ve S. aureus"}, {"t": "E. coli ve Proteus mirabilis"}], "a": 3, "exp": "Doğru cevap: **Pseudomonas aeruginosa ve S. aureus**.\nTabloda kulak enfeksiyonları ikiye ayrılır:\n• **Eksternal otit:** P. aeruginosa, S. aureus.\n• **Otitis media:** S. pneumoniae, H. influenzae, M. catarrhalis.\nMantığı: dış kulak cilde yakındır → cilt/çevre (su) bakterileri (P. aeruginosa, S. aureus); orta kulak östaki ile solunum yoluna bağlıdır → solunum yolu patojenleri.\nYanlış şıklar:\n• S. pneumoniae, H. influenzae, M. catarrhalis → otitis media ve sinüzit etkenleridir; eksternal otit değil.\n• N. gonorrhoeae → tabloda üretrit, servisit, proktit, artrit.\n• E. coli ve Proteus mirabilis → tabloda sistit ve piyelonefrit.\n• Brucella → bruselloz (dalgalı ateş) etkenidir; kulak başlığında yoktur.\n💡 Akılda kalsın: DIŞ kulak = Pseudomonas + S. aureus (\"yüzücü kulağı\"nın klasik etkeni Pseudomonas'tır); ORTA kulak = pnömokok + H. influenzae + Moraxella.", "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre granülomatöz enfeksiyonların genel etkenleri hangi üçlüdür?", "opts": [{"t": "M. tuberculosis, Nocardia türleri, T. pallidum"}, {"t": "B. cereus, Listeria, Kingella"}, {"t": "Gonokok, meningokok, Moraxella"}, {"t": "S. aureus, S. pyogenes, E. coli"}, {"t": "Bordetella, Brucella, Pasteurella"}], "a": 0, "exp": "Doğru cevap: **M. tuberculosis, Nocardia türleri, T. pallidum**.\nTabloda granülomatöz enfeksiyonlar (genel) bu üçlüdür.\nBağlantılar: tüberkülozda bakteri fagozom–lizozom birleşmesini engeller; sitokinler, T ve NK hücreleri makrofajları aktive eder ve nekrotik hücrelerden **granülom** oluşur. Granülomlar enfeksiyonu sınırlar ancak bakterilerin de canlı kalmasını sağlar. Nocardia aside dirençli bakteriler grubundadır (kısmi ARB, uzun dallanan filamentler); T. pallidum sarmal bakteridir.\nYanlış şıklar:\n• B. cereus, Listeria, Kingella → granülomatöz başlıkta yoktur (gastroenterit/endoftalmit, menenjit/yenidoğan, septik artrit/endokardit).\n• Gonokok, meningokok, Moraxella → piyojenik/akut enfeksiyon etkenleri.\n• S. aureus, S. pyogenes, E. coli → piyojenik (irinli) enfeksiyon etkenleri; S. aureus \"piyojeniktir\", akut nötrofilik inflamasyon yapar.\n• Bordetella, Brucella, Pasteurella → tabloda granülomatöz başlıkta yoktur.\n💡 Akılda kalsın: granülom = TB + Nocardia + Treponema. Granülom, vücudun öldüremediği mikrobu \"duvarla çevirme\" taktiğidir — yavaş, kronik etkenlerin işidir.", "org": ["tbc", "nocardia"], "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre sistit ve piyelonefritin en yaygın etkeni hangisidir?", "opts": [{"t": "Escherichia coli"}, {"t": "Staphylococcus aureus"}, {"t": "Pseudomonas aeruginosa"}, {"t": "Streptococcus pneumoniae"}, {"t": "Moraxella catarrhalis"}], "a": 0, "exp": "Doğru cevap: **Escherichia coli**.\nTabloda üriner sistem başlığı:\n• **Sistit ve piyelonefrit:** E. coli, Proteus mirabilis, diğer Enterobacteriales, Staphylococcus saprophyticus.\n• **Böbrek taşı:** P. mirabilis, S. saprophyticus.\n• **Böbrek apsesi:** S. aureus.\n• **Prostatit:** E. coli, P. aeruginosa, Enterococcus türleri.\nAntibiyotik bağlantısı: sülfonamidler idrar yolu enfeksiyonlarında seçilecek ilaçtır; fosfomisin de Gram pozitif ve Gram negatiflerin neden olduğu idrar yolu enfeksiyonlarında geniş spektrumludur.\nYanlış şıklar:\n• Staphylococcus aureus → üriner başlıkta yalnızca böbrek apsesi etkenidir.\n• Pseudomonas aeruginosa → üriner başlıkta prostatit etkenidir; sistit/piyelonefrit listesinde yoktur.\n• Streptococcus pneumoniae → pnömoni, menenjit, sinüzit, otitis media etkenidir.\n• Moraxella catarrhalis → bronşit, sinüzit, otitis media etkenidir.\n💡 Akılda kalsın: sistitte bir numara E. coli (bağırsak komşuluğu nedeniyle); taşta Proteus ve S. saprophyticus; apsede S. aureus.", "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre aşağıdakilerden hangisi gastroenteritin yaygın etkenleri arasında **SAYILMAZ**?", "opts": [{"t": "Salmonella türleri"}, {"t": "Shigella türleri"}, {"t": "Vibrio cholerae"}, {"t": "Campylobacter jejuni"}, {"t": "Bordetella pertussis"}], "a": 4, "exp": "Doğru cevap: **Bordetella pertussis** — gastroenterit listesinde yoktur.\nTablodaki gastroenterit etkenleri: **Salmonella, Shigella, Campylobacter jejuni/coli, E. coli, Vibrio cholerae, V. parahaemolyticus, B. cereus, P. aeruginosa.**\nAynı GİS başlığında: gastrit – H. pylori; antibiyotik ile ilişkili diyare – C. difficile; besin zehirlenmesi – S. aureus, B. cereus; proktit – N. gonorrhoeae, C. trachomatis.\nB. pertussis ise **boğmaca** etkenidir: soğuk algınlığı belirtileri, ardından tekrarlayan öksürük nöbetleri ve ıslık sesi; insan tek konaktır, aerosollerle kişiden kişiye bulaşır; tedavisi makrolidlerle (azitromisin/klaritromisin) yapılır.\nDiğer şıklar (Salmonella, Shigella, Vibrio cholerae, Campylobacter jejuni) tablodaki gastroenterit etkenleridir; Salmonella aynı zamanda Daniel Elmer Salmon'a ithaf edilen bakteridir.\n💡 Akılda kalsın: Bordetella = solunum yolu (boğmaca); bağırsakla işi yoktur.", "org": ["pertussis"], "shuf": true, "html": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre yanık enfeksiyonlarının yaygın etkenleri arasında **OLMAYAN** hangisidir?", "opts": [{"t": "Enterobacteriales"}, {"t": "Pseudomonas aeruginosa"}, {"t": "Mycobacterium leprae"}, {"t": "Enterococcus türleri"}, {"t": "Staphylococcus aureus"}], "a": 2, "exp": "Doğru cevap: **Mycobacterium leprae** — yanık enfeksiyonu etkeni değildir.\nTablodaki yanık enfeksiyonu etkenleri: **S. aureus, P. aeruginosa, Enterococcus, Enterobacteriales.** Yanık yarası, bozulmuş cilt bariyeri ve hastane ortamı nedeniyle bu bakterilere açıktır; S. aureus yara enfeksiyonları yapar ve yüzey, giysi, çarşaf temasıyla yayılır.\nM. leprae ise **cüzzam** etkenidir: kültürde üretilememiştir; tüberküloid veya lepromatöz lepra yapar; yara eksudaları, solunum salgıları ve aerosollerle bulaşır; klinik belirtilerin ortaya çıkması yıllar sürer; tedavide rifamisin, dapson, klofazimin kullanılır.\nDiğer şıklar (Enterobacteriales, P. aeruginosa, Enterococcus, S. aureus) tablodaki yanık etkenleridir.\n💡 Akılda kalsın: yanık dörtlüsü = S. aureus + Pseudomonas + Enterococcus + Enterobacteriales. Pseudomonas yanıkta yeşilimsi akıntı ve tatlımsı kokusuyla klasiktir.", "org": ["leprae"], "shuf": true, "html": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre impetigonun en yaygın etkenleri hangileridir?", "opts": [{"t": "S. pyogenes (grup A) ve S. aureus"}, {"t": "E. coli ve Proteus mirabilis"}, {"t": "Meningokok ve gonokok"}, {"t": "Brucella ve Francisella"}, {"t": "M. tuberculosis ve M. leprae"}], "a": 0, "exp": "Doğru cevap: **S. pyogenes (grup A) ve S. aureus**.\nTabloda deri ve yumuşak doku enfeksiyonlarında impetigo etkenleri bu ikisidir. S. aureus'ta impetigo piyojenik hastalıkların ilk sırasındadır; S. pyogenes'te de piyoderma (yüzeyel deri enfeksiyonu) sayılır.\nKarşılaştırmalı tablo bilgisi:\n• Follikülit → S. aureus, P. aeruginosa.\n• Fronkül ve karbonkül → yalnız S. aureus.\n• Erizipel → yalnız S. pyogenes.\n• Selülit → S. pyogenes, S. aureus.\n• Nekrotizan fasiit → S. pyogenes, C. perfringens, B. fragilis.\nYanlış şıklar: E. coli/P. mirabilis sistit; meningokok/gonokok menenjit ve üretrit; Brucella/Francisella bruselloz ve tularemi; M. tuberculosis/M. leprae tüberküloz ve cüzzam etkenleridir.\n💡 Akılda kalsın: impetigo ve selülit = iki \"S\" (S. pyogenes + S. aureus). Derine indikçe liste değişir: yüzey (impetigo) iki S, kıl kökü (fronkül) tek S. aureus, fasya (nekrotizan fasiit) S. pyogenes + anaeroplar.", "org": ["spyogenes", "saureus"], "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre besin zehirlenmesinin iki klasik etkeni hangileridir?", "opts": [{"t": "Eikenella ve Kingella"}, {"t": "S. aureus ve B. cereus"}, {"t": "C. diphtheriae ve B. pertussis"}, {"t": "M. tuberculosis ve M. avium"}, {"t": "Meningokok ve H. influenzae"}], "a": 1, "exp": "Doğru cevap: **S. aureus ve B. cereus** — besin zehirlenmesinin iki klasik etkeni.\nAyrıntılar:\n• **S. aureus** → yüksek tuzda çoğalarak gıda zehirlenmesi yapabilir; enterotoksini **ısıya ve mide asidine dirençlidir**; klinik: kusma, ishal, mide krampı.\n• **B. cereus** → enterotoksin **ısıya dirençli suşta kusmaya, ısıya duyarlı suşta ishale** neden olur; çevrede ve toprakta yaygındır; gıdaların saklama ve üretim koşullarının takibi gerekir.\nYanlış şıklar:\n• Eikenella ve Kingella → ağız florası; ısırık yarası, endokardit, septik artrit.\n• C. diphtheriae ve B. pertussis → difteri ve boğmaca (solunum yolu).\n• M. tuberculosis ve M. avium → tüberküloz ve AIDS'te fırsatçı enfeksiyon; M. avium kontamine su ve besinle bulaşsa da tabloda besin zehirlenmesi etkeni değildir.\n• Meningokok ve H. influenzae → menenjit etkenleri.\n💡 Akılda kalsın: besin zehirlenmesi = hazır TOKSİN işidir; bakteri değil toksin hasta eder. Bu yüzden başlangıç hızlıdır (saatler) ve pişirme toksini yok etmeyebilir. S. aureus + B. cereus.", "org": ["saureus", "cereus"], "shuf": true}, {"q": "Slaytlarda meningokok, pnömokok, H. influenzae ve Francisella tularensis için fagositozu engellediği belirtilen ortak yapı hangisidir?", "opts": [{"t": "Sitoplazma zarı"}, {"t": "Pilin"}, {"t": "Peptidoglikan tabaka"}, {"t": "Kapsül"}, {"t": "Dış membran"}], "a": 3, "exp": "Doğru cevap: **kapsül**.\nDört bakteride de aynı ifade geçer:\n• N. meningitidis → \"polisakkarit kapsül fagositozu engeller.\"\n• S. pneumoniae → \"fagositoza dirençli polisakkarit kapsülün 100 farklı serotipi tanımlanmıştır.\"\n• H. influenzae → \"polisakkarit kapsül ile antifagositik etki gösterir\"; a–f kapsül antijenleri vardır, en virülanı serotip b'dir; PRP'ye karşı antikorlar koruyucudur.\n• F. tularensis → \"polisakkarit kapsül antikor aracılı fagositozu önler.\"\nKapsülün koruması başka bakterilerde de geçer: S. agalactiae'de kapsül ve sialik asit, B. anthracis'te poli-D-glutamik asit kapsül fagositozu önler.\nYanlış şıklar:\n• Pilin → tutunmayı sağlar (gonokok, meningokok).\n• Peptidoglikan → hücre duvarının temel yapısıdır.\n• Dış membran → Gram negatif duvarın parçasıdır; antifagositik yapı olarak geçmez.\n• Sitoplazma zarı → tüm bakterilerde bulunur; fagositozla ilişkilendirilmez.\n💡 Akılda kalsın: fagositozdan kaçış = KAPSÜL; tutunma = PİLİ. Kapsül, fagositin tutamadığı kaygan bir yağmurluk gibidir.", "org": ["meningokok", "spneumoniae", "haemophilus", "francisella"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Slayta göre aspleni (dalak yokluğu) hangi bakteride sepsis için risk faktörü olarak belirtilmiştir?", "opts": [{"t": "Streptococcus agalactiae"}, {"t": "Streptococcus pneumoniae"}, {"t": "Acinetobacter baumannii"}, {"t": "Listeria monocytogenes"}, {"t": "Nocardia"}], "a": 1, "exp": "Doğru cevap: **Streptococcus pneumoniae**. Epidemiyoloji bilgisi: \"**Hematolojik hastalık ve aspleni sepsis riskidir.**\" Pnömokok nazofarenks ve orofarenkse yerleşir; akciğer, sinüsler, menenks ve kulaklara yayılır; fulminan sepsis yapabilir. Benzer şekilde H. influenzae için de \"risk; düşük antikor, geç kompleman, **splenektomide** fazladır\" denir. Her ikisi de polisakkarit kapsüllü bakterilerdir — dalak, kapsüllü bakterilere karşı antikor yanıtının ve kandan temizlenmenin ana organıdır.\nDiğerlerinin risk faktörleri farklıdır:\n• S. agalactiae → yenidoğanda erken membran rüptürü, uzamış/erken doğum, annede GBS varlığı; erişkinde diyabet, alkol, kanser.\n• Acinetobacter baumannii → geniş spektrumlu antibiyotik kullanımı, cerrahi yara, solunum cihazına bağlılık, enfekte kişiyle temas.\n• Listeria monocytogenes → yenidoğan, yaşlı ve hasta kişiler; kontamine gıdalar.\n• Nocardia → HIV, kanser, transplantasyon gibi immün yetmezlik durumları ve travma.\n💡 Akılda kalsın: dalağı olmayan kişi = kapsüllü bakteri riski (pnömokok, Hib, meningokok).", "org": ["spneumoniae"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Neisseria gonorrhoeae'de ağız boşluğu ve vajinaya tutunmayı sağlayan yapı slayta göre hangisidir?", "opts": [{"t": "Pilin"}, {"t": "Porin"}, {"t": "Beta laktamaz"}, {"t": "Lipopolisakkarit"}, {"t": "Polisakkarit kapsül"}], "a": 0, "exp": "Doğru cevap: **pilin**. Gonokokta \"**pilin, ağız boşluğu ve vajinaya tutunmayı sağlar**\"; opasite proteini de hücreye tutunmaya katkıda bulunur. Meningokokta da \"pilin tutunmayı sağlar\".\nGonokokun diğer yapılarının görevleri:\n• Porin → nötrofillerde fagozom füzyonunu önler (fagositik öldürmeden kaçış).\n• Beta laktamaz → penisilin direnci sağlar; bu yüzden tedavide seftriakson (+ azitromisin) kullanılır.\n• Lipopolisakkarit → hücre duvarında endotoksin üretir.\n• Polisakkarit kapsül → fagositozu engelleyen yapı olarak meningokok için belirtilir, gonokok için değil.\nEk bilgi: gonokok insan dışında canlı kalamaz; kültürde nem ve CO2 gerektirir; demiri transferrin, laktoferrin ve hemoglobinden alır.\n💡 Akılda kalsın: Pilin = tutunma (kancalar); Porin = f
