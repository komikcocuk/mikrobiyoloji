agozom füzyonunu önleme. Pilus Latince \"kıl\" demektir — bakterinin tutunma kılları.", "org": ["gonokok"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre endoftalmitin yaygın etkenleri arasında yer alan Gram pozitif basil hangisidir?", "opts": [{"t": "Listeria monocytogenes"}, {"t": "Corynebacterium diphtheriae"}, {"t": "Bacillus cereus"}, {"t": "Bacillus anthracis"}, {"t": "Nocardia"}], "a": 2, "exp": "Doğru cevap: **Bacillus cereus**.\nTabloda göz enfeksiyonları:\n• Konjonktivit → S. aureus, S. pneumoniae, Haemophilus aegyptius.\n• Keratit → S. aureus, S. pneumoniae, P. aeruginosa.\n• **Endoftalmit → Bacillus cereus, S. aureus, P. aeruginosa.**\nB. cereus'un hastalıkları arasında **travmatik göz enfeksiyonu** sayılır; serolizin ile hemoliz, **PLC ile lesitinaz** yaparak gözde doku hasarı oluşturur. Göz enfeksiyonunda siprofloksasin, klindamisin, vankomisin ve gentamisin ile tedavi edilir. Tabloda travma yaralarında da Bacillus türleri geçer.\nYanlış şıklar:\n• Listeria monocytogenes → yenidoğan hastalığı, menenjit, bakteriyemi, gastroenterit.\n• Corynebacterium diphtheriae → respiratuvar ve kutanöz difteri.\n• Bacillus anthracis → deri, bağırsak ve akciğer şarbonu.\n• Nocardia → bronkopulmoner hastalık, miçetom, beyin apsesi (aside dirençli grupta).\n💡 Akılda kalsın: göze travma (toprakla/metal cisimle) + Gram pozitif sporlu basil = B. cereus. Toprakta yaşayan sporlu bakteri, travmayla göze taşınır.", "org": ["cereus"], "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre artritin yaygın etkenleri hangileridir?", "opts": [{"t": "E. coli ve Proteus mirabilis"}, {"t": "S. aureus ve N. gonorrhoeae"}, {"t": "M. catarrhalis ve Mycoplasma pneumoniae"}, {"t": "Bartonella henselae ve B. quintana"}, {"t": "Clostridioides difficile ve Helicobacter pylori"}], "a": 1, "exp": "Doğru cevap: **S. aureus ve N. gonorrhoeae**.\nTabloda kemik ve eklem başlığı:\n• Osteomiyelit → S. aureus, koagülaz-negatif stafilokoklar, P. aeruginosa, Enterobacteriales.\n• **Artrit → S. aureus, N. gonorrhoeae.**\n• Protez ile ilişkili enfeksiyon → S. aureus, koagülaz-negatif stafilokoklar.\nBağlantılar: gonokok için \"**septik artritin en sık görülen nedenidir**\" denir; S. aureus'un piyojenik hastalıkları arasında osteomiyelit ve septik artrit vardır. Ayrıca Kingella kingae septik artrit, H. influenzae artrit yapabilir.\nYanlış şıklar:\n• E. coli ve P. mirabilis → sistit/piyelonefrit.\n• M. catarrhalis ve Mycoplasma pneumoniae → bronşit.\n• Bartonella henselae ve B. quintana → basiller anjiyomatozis.\n• C. difficile ve H. pylori → antibiyotik ilişkili diyare ve gastrit.\n💡 Akılda kalsın: eklem = S. aureus + gonokok. Cinsel aktif genç erişkinde septik artritte önce gonokok akla gelir.", "org": ["saureus", "gonokok"], "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre peritonitin etkenleri arasında **YER ALMAYAN** hangisidir?", "opts": [{"t": "E. coli"}, {"t": "Bacteroides fragilis"}, {"t": "Enterococcus türleri"}, {"t": "Koagülaz-negatif stafilokoklar (diyaliz ile ilişkili)"}, {"t": "Haemophilus ducreyi"}], "a": 4, "exp": "Doğru cevap: **Haemophilus ducreyi** — peritonit etkeni değildir.\nTabloda karın içi enfeksiyonlar:\n• **Peritonit:** E. coli, Bacteroides fragilis, Enterococcus türleri (bağırsak florası kaynaklı).\n• **Diyaliz ile ilişkili peritonit:** koagülaz-negatif stafilokoklar (kateter/cihaz ilişkili).\nEnterococcus'un hastalıkları arasında da peritonit sayılır; enterokoklar GİS'e yerleşir ve enfeksiyon kaynağı endojendir.\nH. ducreyi ise tabloda **genital ülser** etkenidir (T. pallidum ile birlikte; hastalığı şankroid/yumuşak şankrdır).\nDiğer şıklar:\n• E. coli, B. fragilis, Enterococcus → peritonit listesindedir.\n• Koagülaz-negatif stafilokoklar → diyaliz ile ilişkili peritonitte geçer.\n💡 Akılda kalsın: peritonit = bağırsak florası (E. coli + B. fragilis + Enterococcus); diyaliz peritoniti = koagülaz-negatif stafilokok. Karın zarı iltihabının etkenleri, delinen bağırsağın sakinleridir.", "shuf": true, "html": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre bronşitin yaygın etkenleri hangileridir?", "opts": [{"t": "M. catarrhalis ve Mycoplasma pneumoniae"}, {"t": "Treponema pallidum ve Haemophilus ducreyi"}, {"t": "S. saprophyticus ve Proteus mirabilis"}, {"t": "Clostridium perfringens ve Bacteroides fragilis"}, {"t": "Bartonella henselae ve B. quintana"}], "a": 0, "exp": "Doğru cevap: **M. catarrhalis ve Mycoplasma pneumoniae**.\nTabloda plevropulmoner ve bronşiyal enfeksiyonlar:\n• **Bronşit:** M. catarrhalis, Mycoplasma pneumoniae.\n• Ampiyem: S. aureus, S. pneumoniae, S. pyogenes.\n• Pnömoni: S. pneumoniae, S. aureus, K. pneumoniae, diğer Enterobacteriales, P. aeruginosa, Legionella pneumophila.\nMoraxella catarrhalis'in hastalıkları: **bronşit, bronkopnömoni, sinüzit, otit.** Adı \"catarrhus\" (mukus salgısı) kökünden gelir; balgamda bol inflamatuar hücre içermesiyle diğer Gram negatif pnömonilerden ayrılır; penisiline dirençlidir.\nYanlış şıklar:\n• T. pallidum ve H. ducreyi → genital ülser.\n• S. saprophyticus ve P. mirabilis → sistit ve böbrek taşı.\n• C. perfringens ve B. fragilis → nekrotizan selülit/fasiit (B. fragilis peritonitte de).\n• Bartonella türleri → basiller anjiyomatozis.\n💡 Akılda kalsın: bronşit = \"iki M\" (Moraxella + Mycoplasma). KOAH alevlenmesinde Moraxella klasik üçüncü etkendir (pnömokok ve H. influenzae'den sonra).", "org": ["moraxella"], "shuf": true}, {"q": "Sık rastlanan klinik sendromlar tablosuna göre genital ülserlerin yaygın etkenleri hangileridir?", "opts": [{"t": "N. gonorrhoeae ve C. trachomatis"}, {"t": "Treponema pallidum ve Haemophilus ducreyi"}, {"t": "Mycoplasma hominis ve Mobiluncus"}, {"t": "E. coli ve Enterococcus türleri"}, {"t": "S. aureus ve koagülaz-negatif stafilokoklar"}], "a": 1, "exp": "Doğru cevap: **Treponema pallidum ve Haemophilus ducreyi**.\nTabloda genital enfeksiyonlar:\n• **Genital ülserler:** T. pallidum, H. ducreyi.\n• Üretrit: N. gonorrhoeae, C. trachomatis, Mycoplasma genitalium.\n• Servisit: N. gonorrhoeae, C. trachomatis, M. genitalium.\n• Vajinit: Mycoplasma hominis, Mobiluncus, diğer anaerobik türler.\nT. pallidum sarmal bakterilerdendir ve tabloda granülomatöz enfeksiyon etkeni olarak da geçer (sifiliz). H. ducreyi yumuşak şankr (şankroid) yapar.\nYanlış şıklar:\n• N. gonorrhoeae ve C. trachomatis → üretrit, servisit, proktit (akıntı yapar, ülser değil). Gonokok kadında anormal vajinal akıntı, erkekte penisten akıntı ve idrarda yanma yapar.\n• M. hominis ve Mobiluncus → vajinit.\n• E. coli ve Enterococcus → prostatit.\n• S. aureus ve koagülaz-negatif stafilokoklar → cerrahi yara ve protez enfeksiyonu.\n💡 Akılda kalsın: ÜLSER = Treponema + H. ducreyi (sifilizin şankrı ağrısız ve sert; şankroid ağrılı ve yumuşak); AKINTI (üretrit/servisit) = gonokok + Chlamydia.", "shuf": true}, {"q": "Splenektomili hastalarda bakteriyel enfeksiyonların daha ağır seyretmesi öncelikle hangi bakteriyel yapı ile ilişkilidir?", "opts": [{"t": "Sitoplazmik membran"}, {"t": "Pili"}, {"t": "Flagella"}, {"t": "Kapsül"}, {"t": "Dış membran"}], "a": 3, "exp": "Doğru cevap: **kapsül**.\n📖 Kitap: Kapsül genellikle polisakkarit yapıdadır ve temel işlevi bakteriyi fagositoza karşı korumaktır. Kapsül varlığı çini mürekkebi, kapsül şişme deneyi ya da lateks testi ile araştırılabilir; örneğin pnömokoklar Quellung reaksiyonuna göre 90'ın üzerinde serotipe ayrılır.\nKapsüllü mikroorganizmalara karşı vücudun savunması opsonizasyondur; IgG ve C3b temel opsonizanlardır. IgG üretiminde dalak çok önemli olduğundan splenektomili ya da orak hücreli anemili (otoenfarktlara bağlı otosplenektomi) kişiler pnömokok, meningokok, H. influenzae tip b gibi kapsüllü bakterilere duyarlı hâle gelir.\n📑 Slaytta:\n• S. pneumoniae: \"hematolojik hastalık ve **aspleni** sepsis riskidir\"; fagositoza dirençli polisakkarit kapsülünün 100 farklı serotipi vardır.\n• H. influenzae: risk \"düşük antikor, geç kompleman, **splenektomide** fazladır\"; polisakkarit kapsül ile antifagositik etki gösterir.\n• N. meningitidis: polisakkarit kapsül fagositozu engeller.\nYanlış şıklar:\n• Pili → tutunmayı sağlar (gonokok, meningokok); fagositozdan koruma değil.\n• Flagella → harekettir; fagositozdan korunmayla ilişkilendirilmez.\n• Dış membran → Gram negatif duvarın parçası; splenektomi riskiyle ilişkisi yoktur.\n• Sitoplazmik membran → tüm bakterilerde bulunur.\n💡 Akılda kalsın: dalak yok → kapsüllü bakteri (pnömokok, meningokok, Hib) ağır seyreder. Bu yüzden splenektomi öncesi/sonrası bu üçlüye karşı aşılama önerilir.", "org": ["spneumoniae", "haemophilus", "meningokok"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdaki bakterilerden hangisi Gram negatiftir?", "opts": [{"t": "Enterococcus faecium"}, {"t": "Staphylococcus aureus"}, {"t": "Bacillus anthracis"}, {"t": "Nocardia asteroides"}, {"t": "Escherichia coli"}], "a": 4, "exp": "Doğru cevap: **Escherichia coli** — şıklardaki tek Gram negatif bakteri.\n📖 Kitap: Endotoksinler sadece Gram negatiflerde bulunur ve komplemanı alternatif yoldan aktive eder. Bir bakteri hem kanlı agarda hem de EMB agarda üreyebiliyorsa Gram negatiftir; şıklardan bu özelliğe sahip olan E. coli'dir.\n📑 Slaytta:\n• Gram negatif bakterilerde hücre duvarında **peptidoglikan + dış membran** bulunur; gonokokta lipopolisakkarit hücre duvarı endotoksin üretir.\n• E. coli, tabloda Enterobacteriales ile birlikte sepsis, menenjit, sistit/piyelonefrit, peritonit, gastroenterit ve prostatit etkenidir; adı Theodor von Escherich'ten gelir.\nYanlış şıklar (hepsi Gram pozitif):\n• Enterococcus faecium → \"aerobik Gram pozitif koklar\" arasında Staphylococcus ve Streptococcus ile birlikte sayılır.\n• Staphylococcus aureus → aerobik Gram pozitif kok.\n• Bacillus anthracis → aerobik Gram pozitif, sporlu basil.\n• Nocardia asteroides → aside dirençli bakteriler; \"hareketsiz, sporsuz Gram pozitif basiller\", kısmi ARB.\n💡 Akılda kalsın: şıklarda dört Gram pozitif (kok, kok, sporlu basil, ARB) ve bir Enterobacteriales üyesi var → E. coli Gram negatiftir. Enterobacteriales familyasının tamamı Gram negatif çomaktır.", "org": ["enterococcus", "saureus", "anthracis", "nocardia"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Genç kadınlarda akut sistite Escherichia coli'den sonra en sık neden olan mikroorganizma aşağıdakilerden hangisidir?", "opts": [{"t": "Staphylococcus aureus"}, {"t": "Staphylococcus saprophyticus"}, {"t": "Pseudomonas aeruginosa"}, {"t": "Streptococcus pneumoniae"}, {"t": "Candida albicans"}], "a": 1, "exp": "Doğru cevap: **Staphylococcus saprophyticus**.\n📖 Kitap: Genç kadınlarda komplike olmamış idrar yolu enfeksiyonunun en sık etkeni E. coli'dir; ikinci sık etken **S. saprophyticus**'tur. Laboratuvar kimliği: katalaz (+), koagülaz (–), **novobiyosine dirençli** sistit etkeni → S. saprophyticus.\n📑 Slaytta (klinik sendromlar tablosu, üriner başlık):\n• **Sistit ve piyelonefrit:** E. coli, Proteus mirabilis, diğer Enterobacteriales, **Staphylococcus saprophyticus**.\n• Böbrek taşı: P. mirabilis, S. saprophyticus.\n• Böbrek apsesi: S. aureus.\n• Prostatit: E. coli, P. aeruginosa, Enterococcus türleri.\nYanlış şıklar:\n• Staphylococcus aureus → üriner başlıkta yalnızca böbrek apsesi etkeni.\n• Pseudomonas aeruginosa → üriner başlıkta prostatit etkeni; sistit listesinde yok.\n• Streptococcus pneumoniae → pnömoni, menenjit, sinüzit, otitis media.\n• Candida albicans → bir mantardır (maya); tablodaki bakteriyel sistit etkenleri arasında yoktur.\n(Not: Kitaptaki \"Enterobacter cloacae\" şıkkı, slayttaki \"diğer Enterobacteriales\" sistit etkenleri içinde kaldığından S. pneumoniae ile değiştirildi.)\n💡 Akılda kalsın: genç kadında sistit = E. coli > S. saprophyticus. Koagülaz-negatif stafilokoklar içinde novobiyosine dirençli olan \"saprophyticus\"tur.", "shuf": true, "tag": "Feyyaz Akay"}]}, {"title": "Antibiyotikler", "desc": "MİK–MBK, bakterisidal/bakteriyostatik ayrımı, etki mekanizmaları ve ilaç grupları", "short": "Antibiyotik", "questions": [{"q": "Antimikrobik kemoterapide \"seçici toksisite\" kavramını ilk kez ortaya atan kimdir?", "opts": [{"t": "Paul Ehrlich"}, {"t": "Joseph Lister"}, {"t": "Louis Pastör"}, {"t": "Robert Koch"}, {"t": "Alexander Fleming"}], "a": 0, "exp": "**Cevap: Paul Ehrlich.**\nSlayta göre antimikrobik kemoterapide temel kavram olan \"**seçici toksisite**\" ilk olarak Paul Ehrlich tarafından ortaya atılmıştır.\nSeçici toksisite: antimikrobiğin **konağa zarar vermeden**, konak hücrede olmayan ancak mikroorganizmada var olan hedef bölgeler üzerine etkili maddelerle hedefi öldürmesidir. Örneğin hücre duvarı (peptidoglikan) insan hücresinde yoktur; bu yüzden β-laktamlar ve vankomisin gibi hücre duvarı sentezini bozan ilaçlar seçici toksisitenin iyi örnekleridir.\nDiğer isimlerin slayttaki katkıları:\n• Joseph Lister → cerrahi antisepsis.\n• Louis Pastör → abiyogenez–biyogenez tartışmasını bitirdi; fermantasyonu ve pütrefaksiyonu mikroorganizmalara bağladı; saf kültür elde etti; Pastör etkisini buldu.\n• Robert Koch → şarbon etkeni (B. anthracis), Koch postulatları, katı besiyeri.\n• Alexander Fleming → penisilinin keşfi.\n💡 Akılda kalsın: Ehrlich = seçici toksisite; Fleming = penisilin.", "shuf": true}, {"q": "Bir bakterinin üremesini ve gelişmesini durduran en küçük antibiyotik konsantrasyonu nedir ve hangi etkiyi ifade eder?", "opts": [{"t": "MBK – bakterisidal etki"}, {"t": "MBK – bakteriyostatik etki"}, {"t": "Spektrum – bakteriyostatik etki"}, {"t": "MİK – bakterisidal etki"}, {"t": "MİK – bakteriyostatik etki"}], "a": 4, "exp": "**Cevap: MİK – bakteriyostatik etki.**\nSlayttaki tanımlar:\n• **Bakteriyostatik etki** → **Minimal İnhibisyon Konsantrasyonu (MİK)** ile ifade edilir: bir bakterinin üreme ve gelişmesini **durduran** en küçük antibiyotik konsantrasyonu.\n• **Bakterisidal etki** → **Minimal Bakterisidal Konsantrasyon (MBK)** ile ifade edilir: bir bakteriyi **öldürebilen** en düşük antibiyotik konsantrasyonu.\n• **Antibakteriyel spektrum** → bir antibiyotiğin etkili olduğu mikroorganizma grubu.\nSlayttaki örnekler: bakterisidaller – aminoglikozitler, β-laktamlar, florokinolonlar, glikopeptidler, rifampin; bakteriyostatikler – ketolidler, klindamisin, kloramfenikol, makrolidler, oksazolidinonlar, streptograminler, sülfonamidler, tetrasiklinler.\n• MBK – bakterisidal → MBK öldüren konsantrasyondur; soruda \"durduran\" denildiği için yanlış.\n• MBK – bakteriyostatik / MİK – bakterisidal → eşleştirmeler ters.\n• Spektrum → konsantrasyon değil, etki alanıdır.\n💡 Akılda kalsın: MİK = İnhibe eder (durdurur, -statik); MBK = Bakterisidal (öldürür, -sidal).", "shuf": true}, {"q": "Aşağıdaki antibiyotik gruplarından hangisi slayta göre **BAKTERİSİDALDİR**?", "opts": [{"t": "Makrolidler"}, {"t": "Kloramfenikol"}, {"t": "Aminoglikozitler"}, {"t": "Tetrasiklinler"}, {"t": "Sülfonamidler"}], "a": 2, "exp": "**Cevap: Aminoglikozitler.**\nSlayttaki sınıflama:\n• **Bakterisidaller:** aminoglikozitler, β-laktamlar, florokinolonlar, glikopeptidler, rifampin.\n• **Bakteriyostatikler:** ketolidler, klindamisin, kloramfenikol, makrolidler, oksazolidinonlar, streptograminler, sülfonamidler, tetrasiklinler.\nAminoglikozitler (gentamisin, amikasin, tobramisin, streptomisin…) peptid zincirlerinin 30S ribozomdan olgunlaşmadan ayrılmasını sağlar ve öncelikle Gram negatif basil enfeksiyonlarında kullanılır. Protein sentezini bozan ilaçların çoğu bakteriyostatik iken aminoglikozitlerin bakterisidal olması sık sorulan bir istisnadır.\n• Makrolidler → bakteriyostatik (50S, polipeptid uzamasını engeller).\n• Kloramfenikol → bakteriyostatik listede.\n• Tetrasiklinler → bakteriyostatik (30S, polipeptid uzamasını engeller).\n• Sülfonamidler → bakteriyostatik (antimetabolit, folik asit sentezini bozar).\n💡 Akılda kalsın: Bakterisidal beşli = \"Aminoglikozit – β-laktam – Florokinolon – Glikopeptid – Rifampin\".", "shuf": true, "html": true}, {"q": "Aşağıdakilerden hangisi slayta göre **BAKTERİYOSTATİK** bir ilaç grubudur?", "opts": [{"t": "Beta-laktamlar"}, {"t": "Klindamisin"}, {"t": "Rifampin"}, {"t": "Glikopeptidler"}, {"t": "Florokinolonlar"}], "a": 1, "exp": "**Cevap: Klindamisin.**\nKlindamisin slayttaki bakteriyostatik listesindedir: ketolidler, **klindamisin**, kloramfenikol, makrolidler, oksazolidinonlar, streptograminler, sülfonamidler, tetrasiklinler.\nKlindamisin bir linkozamiddir; 50S ribozomda polipeptid uzamasını engeller; aerobik Gram pozitif koklara ve anaeroplara etkilidir. Slaytlarda S. aureus (tablet), S. pyogenes (IV penisilin + klindamisin) ve B. cereus göz enfeksiyonu tedavisinde geçer.\nDiğerleri bakterisidal listededir:\n• β-laktamlar → penisilin bağlayan proteinlere bağlanıp hücre duvarı sentezini bozar.\n• Rifampin → DNA'ya bağımlı RNA polimerazı inhibe eder.\n• Glikopeptidler (vankomisin) → peptidoglikan çapraz bağlanmasını inhibe eder.\n• Florokinolonlar → DNA girazı hedefler.\n💡 Akılda kalsın: Hücre duvarı (β-laktam, glikopeptid) ve nükleik asit (kinolon, rifampin) hedefleyenler -sidal; klindamisin, makrolid, tetrasiklin gibi ribozom ilaçlarının çoğu -statik (istisna: aminoglikozit).", "shuf": true, "html": true}, {"q": "Antibiyotiklerin etki mekanizmaları arasında slaytta **sayılmayan** hangisidir?", "opts": [{"t": "Hücre membran fonksiyonunu değiştirme"}, {"t": "Hücre duvarı sentezinin inhibisyonu"}, {"t": "Nükleik asit sentezinin inhibisyonu"}, {"t": "Konak bağışıklık hücrelerinin uyarılması"}, {"t": "Protein sentezinin inhibisyonu"}], "a": 3, "exp": "**Cevap: Konak bağışıklık hücrelerinin uyarılması.**\nSlayttaki etki mekanizmaları:\n1. **Hücre duvarı sentezinin inhibisyonu** → β-laktamlar (penisilin, sefalosporin, karbapenem, aztreonam), vankomisin, basitrasin, fosfomisin, sikloserin; mikobakterilerde izoniazid (mikolik asit) ve etambutol (arabinogalaktan).\n2. **Protein sentezinin inhibisyonu** → 30S: aminoglikozidler, tetrasiklinler, tigesiklin; 50S: linezolid, makrolidler, klindamisin, streptograminler.\n3. **Nükleik asit sentezinin inhibisyonu** → kinolonlar (DNA giraz), rifampin (RNA polimeraz), metronidazol (DNA'yı parçalar).\n4. **Hücre membran fonksiyonunu değiştirenler** → kolistin, polimiksin B (dış membran geçirgenliğini bozar).\n5. **Etki mekanizması bilinmeyenler.**\nAyrıca tabloda **antimetabolitler** (sülfonamid, trimetoprim, dapson: folik asit sentezini bozar) yer alır.\n\"Konak bağışıklık hücrelerinin uyarılması\" bu listede yoktur; seçici toksisite ilkesine göre antibiyotik doğrudan mikroorganizmadaki hedefe etki eder.\n💡 Akılda kalsın: Duvar – Protein – Nükleik asit – Membran (+ antimetabolit).", "shuf": true, "html": true}, {"q": "Doğal penisilinler (penisilin G) nasıl etki eder?", "opts": [{"t": "Bakteri DNA'sını parçalar"}, {"t": "Peptidoglikan sentezinden sorumlu penisilin bağlayan proteinlere ve enzimlere bağlanır"}, {"t": "Dihidropteroat sentazı inhibe eder"}, {"t": "DNA girazın alfa alt birimine bağlanır"}, {"t": "DNA'ya bağımlı RNA polimerazı inhibe eder"}], "a": 1, "exp": "**Cevap: Peptidoglikan sentezinden sorumlu penisilin bağlayan proteinlere ve enzimlere bağlanır.**\nTabloya göre doğal penisilinler **hücre duvarı hasarı** yapar: peptidoglikan sentezinden sorumlu proteinlere (**penisilin bağlayan proteinler, PBP**) ve enzimlere bağlanır.\nSpektrum (tablo): tüm β-hemolitik streptokoklara ve diğer streptokokların çoğuna etkili; **stafilokoklara etkisi çok az**; meningokoklara ve birçok Gram pozitif anaeroba etkin; Gram negatif basillere etkisi zayıf.\nSlaytlarla bağlantı: S. pyogenes'te penisilin V, S. agalactiae'de penisilin G (+aminoglikozid) kullanılır; gonokokta β-laktamaz enzimi penisilin direnci sağlar; MRSA suşları β-laktamlara dirençlidir.\n• Bakteri DNA'sını parçalar → metronidazol.\n• Dihidropteroat sentazı inhibe eder → sülfonamidler ve dapson.\n• DNA girazın α alt birimine bağlanır → kinolonlar.\n• DNA'ya bağımlı RNA polimerazı inhibe eder → rifampin, rifabutin.\n💡 Akılda kalsın: β-laktam = PBP'ye bağlanır = hücre duvarı.", "shuf": true}, {"q": "Kinolonların (nalidiksik asit, siprofloksasin, levofloksasin, moksifloksasin) etki mekanizması hangisidir?", "opts": [{"t": "Folik asit sentezini bozar"}, {"t": "Peptidoglikan sentezini bozar"}, {"t": "Hücre membranını parçalar"}, {"t": "DNA girazın α-alt birimine bağlanarak nükleik asit sentezini inhibe eder"}, {"t": "Ribozoma bağlanarak protein sentezini durdurur"}], "a": 3, "exp": "**Cevap: DNA girazın α-alt birimine bağlanarak nükleik asit sentezini inhibe eder.**\nTabloda kinolonlar \"Nükleik asit sentezinin inhibisyonu\" başlığındadır ve **DNA girazın α-alt birimine bağlanır.** Slayta göre florokinolonlar bakterisidaldir.\nKinolonların spektrumu (tablo):\n• Dar spektrumlu (nalidiksik asit) → belirli Gram negatif basiller; Gram pozitiflere etkisiz.\n• Geniş spektrumlu (siprofloksasin, levofloksasin) → Gram pozitif ve Gram negatif.\n• Genişlemiş spektrumlu (moksifloksasin, gatifloksasin, delafloksasin, gemifloksasin) → Gram pozitiflere artmış etkinlik; Gram negatif etkinlik siprofloksasine benzer.\nSlaytlarda siprofloksasin şarbon, B. cereus göz enfeksiyonu ve meningokok temaslı profilaksisinde geçer.\n• Folik asit sentezini bozar → sülfonamid, trimetoprim.\n• Peptidoglikan sentezini bozar → β-laktamlar, vankomisin.\n• Membranı bozar → kolistin, polimiksin B.\n• Ribozoma bağlanır → aminoglikozid, tetrasiklin, makrolid, linezolid.\n💡 Akılda kalsın: \"-floksasin\" = DNA giraz.", "shuf": true}, {"q": "Anaerop bakterilere etkili olan ve bakteri DNA'sını parçalayarak etki eden antibiyotik hangisidir?", "opts": [{"t": "Metronidazol"}, {"t": "Trimetoprim"}, {"t": "Rifampin"}, {"t": "Dapson"}, {"t": "Fidaksomisin"}], "a": 0, "exp": "**Cevap: Metronidazol.**\nTabloya göre **metronidazol** nükleik asit sentezinin inhibisyonu grubundadır ve **bakteri DNA'sını parçalar**; **anaeroplara etkilidir, aerop ve fakültatif anaeroplara etkisizdir.** Bu nedenle dar spektrumlu bir ilaçtır. Tabloda anaerop etkenler (B. fragilis, Fusobacterium) peritonit, beyin apsesi ve nekrotizan fasiit gibi tablolarda geçer.\n• Trimetoprim → dihidropteroat redüktazı inhibe ederek folik asit sentezini bozar (antimetabolit).\n• Rifampin → DNA'ya bağımlı RNA polimeraza bağlanarak transkripsiyonu önler; mikobakteriler ve aerop Gram pozitiflere etkili.\n• Dapson → dihidropteroat sentazı inhibe eder; mikobakterilere etkili (lepra tedavisinde).\n• Fidaksomisin → DNA–RNA polimeraz kompleksine bağlanıp RNA polimerazı inhibe eder; C. difficile tedavisinde kullanılan bakterisidal makrolid.\n💡 Akılda kalsın: Anaerop + DNA parçalanması = metronidazol.", "shuf": true}, {"q": "Antimetabolit antibiyotiklerle ilgili aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Sülfonamidler yalnızca Gram pozitiflere etkilidir"}, {"t": "Trimetoprim hücre duvarı sentezini bozar"}, {"t": "Dapson anaeroplara etkilidir"}, {"t": "Dapson DNA girazı inhibe eder"}, {"t": "Sülfonamidler dihidropteroat sentazı inhibe ederek folik asit sentezini bozar; idrar yolu enfeksiyonlarında seçilir"}], "a": 4, "exp": "**Cevap: Sülfonamidler dihidropteroat sentazı inhibe ederek folik asit sentezini bozar; idrar yolu enfeksiyonlarında seçilir.**\nTablodaki antimetabolitler:\n• **Sülfonamidler** → dihidropteroat **sentazı** inhibe eder, folik asit sentezini bozar; geniş Gram pozitif ve Gram negatif spektrum; **idrar yolu enfeksiyonlarında seçilecek ilaç.** Slayta göre bakteriyostatiktir.\n• **Trimetoprim** → dihidropteroat **redüktazı** inhibe eder, folik asit sentezini bozar.\n• **Dapson** → dihidropteroat sentazı inhibe eder; **mikobakterilere** etkili (slaytta lepra tedavisinde rifamisin ve klofazimin ile birlikte).\nTrimetoprim-sülfametoksazol (SXT) slaytlarda S. aureus, M. catarrhalis ve Nocardia tedavisinde geçer.\n• \"Sülfonamidler yalnızca Gram pozitiflere etkilidir\" → yanlış; geniş Gram pozitif ve Gram negatif spektrum.\n• \"Trimetoprim hücre duvarı sentezini bozar\" → yanlış; folik asit sentezini bozar.\n• \"Dapson anaeroplara etkilidir\" → yanlış; mikobakterilere etkilidir (anaerop ilacı metronidazol).\n• \"Dapson DNA girazı inhibe eder\" → yanlış; DNA giraz kinolonların hedefidir.\n💡 Akılda kalsın: Antimetabolit = folik asit; sülfonamid–dapson \"sentaz\", trimetoprim \"redüktaz\".", "shuf": true}, {"q": "Clostridioides difficile enfeksiyonlarının tedavisinde kullanılan, DNA–RNA polimeraz kompleksine bağlanan bakterisidal makrolid hangisidir?", "opts": [{"t": "Klindamisin"}, {"t": "Kinupristin-dalfopristin"}, {"t": "Fidaksomisin"}, {"t": "Azitromisin"}, {"t": "Metronidazol"}], "a": 2, "exp": "**Cevap: Fidaksomisin.**\nTabloya göre **fidaksomisin** DNA–RNA polimeraz kompleksine bağlanıp RNA polimerazı inhibe eder; **Clostridioides difficile** tedavisinde kullanılan **bakterisidal bir makroliddir.** Tablonun GİS başlığında antibiyotik ile ilişkili diyarenin etkeni C. difficile'dir.\nDikkat: Fidaksomisin \"makrolid\" olarak adlandırılsa da diğer makrolidler gibi ribozoma değil RNA polimeraza etki eder.\n• Klindamisin → linkozamid; 50S ribozomda polipeptid uzamasını engeller; aerobik Gram pozitif koklar ve anaeroplara etkili; bakteriyostatik.\n• Kinupristin-dalfopristin → streptogramin; 50S'de polipeptid uzamasını engeller; E. faecium'a etkili, E. faecalis'e etkisiz.\n• Azitromisin → klasik makrolid; 50S ribozomda polipeptid uzamasını engeller; boğmaca ve gonore tedavisinde geçer.\n• Metronidazol → bakteri DNA'sını parçalar; anaeroplara etkili.\n💡 Akılda kalsın: C. difficile + RNA polimeraz + bakterisidal makrolid = fidaksomisin.", "shuf": true}, {"q": "Antibiyotikler ile kemoterapötiklerin tarihsel ayrımı hangisinde doğru verilmiştir?", "opts": [{"t": "Kemoterapötikler yalnızca virüslere etkilidir"}, {"t": "İki terim hiçbir zaman ayrı anlam taşımamıştır"}, {"t": "Antibiyotikler her zaman sentetik olarak üretilmiştir"}, {"t": "Antibiyotikler önceleri sentez yoluyla elde edilen kemoterapötiklerden ayrı bir grup iken, sonradan onlar da sentetik olarak üretilmeye başlanmıştır"}, {"t": "Antibiyotikler yalnızca bitkilerden elde edilir"}], "a": 3, "exp": "**Cevap: Antibiyotikler önceleri sentez yoluyla elde edilen kemoterapötiklerden ayrı bir grup iken, sonradan onlar da sentetik olarak üretilmeye başlanmıştır.**\nSlayttaki ifade: \"Antibiyotikler, önceleri sentez yoluyla elde edilen kemoterapötiklerden ayrı bir ilaç grubu iken, sonradan onlar da sentetik olarak üretilmeye başlanmıştır.\"\nYani:\n• Kemoterapötikler → başından beri sentez yoluyla (laboratuvarda) elde edilen ilaçlar.\n• Antibiyotikler → başlangıçta ayrı bir grup (penisilin, Fleming tarafından keşfedilmiştir); zamanla onlar da sentetik üretilmeye başlanınca ayrım belirsizleşmiştir.\nAynı slaytta antimikrobik kemoterapinin temel kavramı **seçici toksisite**nin Paul Ehrlich'e ait olduğu belirtilir.\n• \"Kemoterapötikler yalnızca virüslere etkilidir\" → slaytta böyle bir bilgi yok; antibakteriyel ilaçlar konusunda geçerler.\n• \"Hiçbir zaman ayrı anlam taşımamıştır\" → yanlış; önceleri ayrı gruplardı.\n• \"Antibiyotikler her zaman sentetikti\" → yanlış; sentetik üretim sonradan başlamıştır.\n• \"Yalnızca bitkilerden elde edilir\" → slaytta yok.\n💡 Akılda kalsın: Önce ayrı (kemoterapötik = sentetik), sonra antibiyotikler de sentetik.", "shuf": true}, {"q": "Slayta göre \"geniş spektrumlu antibiyotik\" ne demektir?", "opts": [{"t": "Çok sayıda Gram negatif ve Gram pozitif mikroorganizmaya etkili antibiyotik"}, {"t": "Yalnızca anaeroplara etkili antibiyotik"}, {"t": "Yalnızca mikobakterilere etkili antibiyotik"}, {"t": "Yalnızca Gram pozitiflere etkili antibiyotik"}, {"t": "Bakteriyi öldürebilen en düşük antibiyotik konsantrasyonu"}], "a": 0, "exp": "**Cevap: Çok sayıda Gram negatif ve Gram pozitif mikroorganizmaya etkili antibiyotik.**\nSlayta göre **antibakteriyel spektrum**, bir antibiyotiğin etkili olduğu mikroorganizma grubunu tanımlar. **Geniş spektrumlu antibiyotikler**, çok sayıda Gram negatif ve Gram pozitif mikroorganizmaya etkilidir.\nTablodan geniş spektrum örnekleri: **karbapenemler** (birçok aerop ve anaerop Gram pozitif ve Gram negatife etkili), **tetrasiklinler** (Gram pozitif, bazı Gram negatifler, mikoplazma, klamidya, riketsiya), geniş spektrumlu sefalosporinler (seftriakson, sefepim…).\nDar spektrum örnekleri:\n• Yalnızca anaeroplara → metronidazol.\n• Yalnızca mikobakterilere → izoniazid, etambutol, dapson.\n• Yalnızca Gram pozitiflere → vankomisin, linezolid.\n• \"Bakteriyi öldürebilen en düşük konsantrasyon\" → bu MBK tanımıdır, spektrum değil.\nSlayttaki bir uyarı: Enterokoklar geniş spektrumlu sefalosporin tedavilerinde nozokomiyal enfeksiyonların en yaygın nedenidir; Acinetobacter'de geniş spektrumlu antibiyotik kullanımı risk faktörüdür.\n💡 Akılda kalsın: Geniş spektrum = Gram (+) VE Gram (–).", "shuf": true}, {"q": "Slayta göre bakteriyel direnç gelişimiyle ilgili hangisi doğrudur?", "opts": [{"t": "Bakteriler antibiyotiklere direnç geliştiremez"}, {"t": "Direnç yalnızca virüslerde görülür"}, {"t": "Bakteri plazmasında antibiyotik miktarı arttıkça bakteriyel direnç gelişir"}, {"t": "Direnç yalnızca aşılama sonrasında gelişir"}, {"t": "Direnç gelişimi yalnızca Gram pozitif bakterilerde görülür"}], "a": 2, "exp": "**Cevap: Bakteri plazmasında antibiyotik miktarı arttıkça bakteriyel direnç gelişir.**\nSlayttaki ifade: \"Bakteri plazmasında antibiyotik miktarı arttıkça bakteriyel direnç gelişir.\" Yani gereksiz/uzun antibiyotik maruziyeti direnç gelişimini kolaylaştırır.\nSlaytlardaki direnç örnekleri:\n• **MRSA** suşları β-laktam grubu antibiyotiklere dirençlidir.\n• **Gonokokta** β-laktamaz enzimi penisilin direnci sağlar.\n• **Pnömokok** penisilin, sefalosporin ve makrolidlere dirençli olabilir; penisilin dirençlide seftriakson ve vankomisin kullanılır.\n• **Acinetobacter baumannii** Irak ve Afganistan'daki çatışmalarda neredeyse tüm antibiyotiklere direnç geliştirmiştir; kolistin tek etkili antibiyotiktir.\n• **Enterokoklarda** antibiyotik direnci tedaviyi zorlaştırır; enfeksiyona göre antibiyotik ayarlanıp direnç gelişmesinden kaçınılmalıdır.\nYanlış şıklar: Bakteriler direnç geliştirebilir; direnç bakterilerde (Gram pozitif ve Gram negatif — ör. MRSA ve Acinetobacter) görülür; aşılama ile ilişkilendirilmez.\n💡 Akılda kalsın: Antibiyotik maruziyeti ↑ → direnç ↑.", "shuf": true}, {"q": "Aşağıdakilerden hangisi penisilinaza DİRENÇLİ penisilinlerden biri **DEĞİLDİR**?", "opts": [{"t": "Metisilin"}, {"t": "Nafsilin"}, {"t": "Oksasilin"}, {"t": "Dikloksasilin"}, {"t": "Ampisilin"}], "a": 4, "exp": "**Cevap: Ampisilin.**\nTablodaki penisilin alt grupları:\n• **Penisilinaza dirençli penisilinler:** metisilin, nafsilin, oksasilin, kloksasilin, dikloksasilin → doğal penisilinlere benzer, **stafilokoklara artmış etkinlik** gösterirler (stafilokokların ürettiği penisilinaz bunları yıkamaz).\n• **Genişlemiş spektrumlu penisilinler:** **ampisilin**, amoksisilin, piperasilin → Gram pozitif koklara etkisi doğal penisilinlerle aynı; ek olarak bazı Gram negatif basillere etkili.\nSlaytla bağlantı: S. aureus'ta \"metisiline duyarlı (MSSA) ve dirençli (MRSA) tespiti kolayca yapılır\"; MRSA suşları tüm β-laktamlara dirençlidir. Tabloda karbapenemlerin \"oksasiline dirençli stafilokoklara\" etkisiz olduğu yazılır.\n• Metisilin, nafsilin, oksasilin, dikloksasilin → hepsi penisilinaza dirençli grupta.\n💡 Akılda kalsın: \"-silin\" ile biten antistafilokokal grup: Metisilin, Nafsilin, Oksasilin, Kloksasilin, Dikloksasilin; Ampisilin/Amoksisilin/Piperasilin = genişlemiş spektrum.", "shuf": true, "html": true}, {"q": "Genişlemiş (extended) spektrumlu penisilinler hangileridir?", "opts": [{"t": "Metisilin, nafsilin, oksasilin"}, {"t": "Ampisilin, amoksisilin, piperasilin"}, {"t": "Sefaleksin, sefazolin, sefadroksil"}, {"t": "Vankomisin, daptomisin, linezolid"}, {"t": "Gentamisin, amikasin, streptomisin"}], "a": 1, "exp": "**Cevap: Ampisilin, amoksisilin, piperasilin.**\nTabloya göre **genişlemiş spektrumlu penisilinler** (ampisilin, amoksisilin, piperasilin): Gram pozitif koklara etkisi doğal penisilinlerle aynıdır; ek olarak **bazı Gram negatif basillere** etkilidir. β-laktamaz inhibitörüyle kombine edildiklerinde (ampisilin-sulbaktam, amoksisilin-klavulanat, piperasilin-tazobaktam) β-laktamaz üreten stafilokoklara ve bazı Gram negatif basillere de etkinlik kazanırlar.\nSlaytlarda: Listeria'da penisilin ve ampisilin; Eikenella'da monomikrobik enfeksiyonda ampisilin, polimikrobikte amoksisilin-klavulanat; Enterococcus'ta aminoglikozid + ampisilin; S. pyogenes ve doğal yolla oluşan şarbonda amoksisilin kullanılır.\n• Metisilin, nafsilin, oksasilin → penisilinaza dirençli penisilinler.\n• Sefaleksin, sefazolin, sefadroksil → dar spektrumlu sefalosporinler.\n• Vankomisin, daptomisin, linezolid → penisilin değil (glikopeptid, lipopeptid, oksazolidinon); slaytta dirençli Gram pozitif (enterokok, MRSA) tedavisinde geçer.\n• Gentamisin, amikasin, streptomisin → aminoglikozidler.\n💡 Akılda kalsın: \"A-A-P\" = Ampisilin, Amoksisilin, Piperasilin.", "shuf": true}, {"q": "Dar spektrumlu sefalosporinler (sefaleksin, sefalotin, sefazolin, sefadroksil) için tablodaki tanım hangisidir?", "opts": [{"t": "Gram negatiflere etkisizdir; yalnızca Gram pozitif anaeroplara etkilidir"}, {"t": "Yalnızca mikobakterilere etkilidir"}, {"t": "Gram pozitiflere etkisi oksasilinle aynıdır; ek olarak E. coli, Klebsiella ve P. mirabilis'e etkilidir"}, {"t": "Gram negatif etkinliği Pseudomonas'ı da içerecek şekilde geliştirilmiştir"}, {"t": "Gram pozitiflere etkisizdir"}], "a": 2, "exp": "**Cevap: Gram pozitiflere etkisi oksasilinle aynıdır; ek olarak E. coli, Klebsiella ve P. mirabilis'e etkilidir.**\nTablodaki sefalosporin basamakları:\n• **Dar spektrumlu** (sefaleksin, sefalotin, sefazolin, sefadroksil) → Gram pozitiflere etkisi oksasilinle aynı; bazı Gram negatiflere (**E. coli, Klebsiella, P. mirabilis**) etkili.\n• **Genişletilmiş spektrumlu** (sefuroksim, sefotetan, sefoksitin, sefprozil) → Gram negatif etkinlik **Enterobacter, Citrobacter ve Proteus**'u içerecek şekilde geliştirilmiş.\n• **Geniş spektrumlu** (sefiksim, sefotaksim, seftriakson, seftazidim, sefpodoksim, sefepim, sefpirom) → Gram negatif etkinlik **Pseudomonas**'ı da içerecek şekilde.\nHepsinde Gram pozitif etki oksasiline eşittir; basamak yükseldikçe Gram negatif etkinlik genişler.\n• \"Pseudomonas'ı içerecek şekilde\" → geniş spektrumlu sefalosporinlerin tanımı.\n• \"Yalnızca mikobakteriler\" → izoniazid/etambutol gibi ilaçlar.\n• \"Gram pozitiflere etkisiz\" ve \"Gram negatiflere etkisiz, yalnız anaerop\" → tablodaki tanıma aykırı.\n💡 Akılda kalsın: Dar → E. coli, Klebsiella, Proteus mirabilis; genişletilmiş → + Enterobacter, Citrobacter; geniş → + Pseudomonas.", "shuf": true}, {"q": "Rifampinin etki mekanizması ve spektrumu hangisidir?", "opts": [{"t": "Folik asit sentezini bozar; anaeroplara etkilidir"}, {"t": "RNA polimeraza bağlanıp transkripsiyonu önler; mikobakteri ve aerop Gram pozitiflere etkilidir"}, {"t": "Hücre duvarı sentezini inhibe eder; yalnızca Gram negatiflere etkilidir"}, {"t": "Ribozomun 30S alt birimine bağlanır; öncelikle Gram negatif basillere etkilidir"}, {"t": "DNA girazı inhibe eder; Gram pozitiflere etkisizdir"}], "a": 1, "exp": "**Cevap: RNA polimeraza bağlanıp transkripsiyonu önler; mikobakteri ve aerop Gram pozitiflere etkilidir.**\nTabloya göre **rifampin ve rifabutin** \"Nükleik asit sentezinin inhibisyonu\" grubundadır: **DNA'ya bağımlı RNA polimeraza** bağlanarak transkripsiyonu önler; **mikobakteriler ve aerop Gram pozitiflere** etkilidir; Gram negatiflere etkin değildir. Slayta göre bakterisidaldir.\nSlaytlardaki kullanımları: tüberküloz (rifamisin + etambutol + izoniazid; profilakside izoniazid + rifapentin), lepra (rifamisin + dapson + klofazimin), M. avium (etambutol + rifabutin) ve meningokok temaslılarında profilaksi.\n• Folik asit sentezi + anaerop → karışık; folik asit sülfonamid/trimetoprim, anaerop ilacı metronidazoldür.\n• Hücre duvarı sentezi → β-laktamlar, vankomisin.\n• 30S ribozom, Gram negatif basil → aminoglikozidler.\n• DNA giraz, Gram pozitife etkisiz → nalidiksik asit (dar spektrumlu kinolon).\n💡 Akılda kalsın: Rifampin = RNA polimeraz = TB/lepra + meningokok profilaksisi.", "org": ["tbc", "leprae", "meningokok"], "shuf": true}, {"q": "Klindamisinin (linkozamid) etki spektrumu tabloya göre hangisidir?", "opts": [{"t": "Aerobik Gram pozitif koklar ve anaeroplar"}, {"t": "Belirli aerop Gram negatif basiller; anaeroplara etkisiz"}, {"t": "Öncelikle Gram negatif basiller"}, {"t": "Yalnızca mikobakteriler"}, {"t": "Gram negatiflere etkili, Gram pozitiflere etkisiz"}], "a": 0, "exp": "**Cevap: Aerobik Gram pozitif koklar ve anaeroplar.**\nTabloya göre **linkozamid (klindamisin)** 50S ribozomda polipeptid uzamasını engeller; **aerobik Gram pozitif koklar ve anaeroplara** etkilidir. Slayta göre bakteriyostatiktir.\nSlaytlardaki kullanımları: S. aureus (tablet; TMP-SMX ve doksisiklin ile birlikte seçenekler arasında), S. pyogenes (IV penisilin + klindamisin), B. cereus göz enfeksiyonu.\n• \"Belirli aerop Gram negatif basiller; anaeroplara etkisiz\" → aztreonamın (monobaktam) tanımı.\n• \"Öncelikle Gram negatif basiller\" → aminoglikozidler.\n• \"Yalnızca mikobakteriler\" → izoniazid, etambutol, dapson.\n• \"Gram negatiflere etkili, Gram pozitiflere etkisiz\" → kolistin, polimiksin B (Gram pozitiflerde dış membran yoktur).\n💡 Akılda kalsın: Klindamisin = Gram (+) kok + anaerop; 50S; bakteriyostatik.", "shuf": true}, {"q": "Streptograminler (kinupristin-dalfopristin) hakkında tablodaki bilgi hangisidir?", "opts": [{"t": "Mikobakterilerin ilk seçenek ilacıdır"}, {"t": "Enterobacteriales ve diğer Gram negatif basillere etkilidir"}, {"t": "E. faecalis'e etkili, E. faecium'a etkisizdir"}, {"t": "E. faecium'a etkili, E. faecalis'e etkisizdir"}, {"t": "Yalnızca anaeroplara etkilidir"}], "a": 3, "exp": "**Cevap: E. faecium'a etkili, E. faecalis'e etkisizdir.**\nTabloya göre **streptograminler** (kinupristin-dalfopristin) 50S ribozomda polipeptid uzamasını engeller; primer olarak Gram pozitiflere etkilidir: metisiline duyarlı ve dirençli stafilokoklar, streptokoklar, **E. faecium (E. faecalis'e etkisiz)**; ayrıca Haemophilus, Moraxella ve anaeroplar. **Enterobacteriales ve diğer Gram negatif basillere etkisizdir.** Slayta göre bakteriyostatiktir.\nSlaytla bağlantı: Enterococcus tedavisinde direnç varsa **linezolid, daptomisin, kinupristin** kullanılır.\n• \"Mikobakterilerin ilk seçenek ilacı\" → mikobakteride rifampin, izoniazid, etambutol kullanılır.\n• \"Enterobacteriales'e etkili\" → tam tersi; etkisizdir.\n• \"E. faecalis'e etkili, E. faecium'a etkisiz\" → tersi doğrudur.\n• \"Yalnızca anaeroplara\" → metronidazol tanımı; streptograminler anaeroplara da etkilidir ama \"yalnızca\" değil.\n💡 Akılda kalsın: Kinupristin → \"faeci-UM'a Uygun, faeca-LIS'e Lâzım değil\".", "org": ["enterococcus"], "shuf": true}, {"q": "Peptidoglikan öncüllerinin çapraz bağlanmasını inhibe ederek hücre duvarı sentezini bozan antibiyotik hangisidir?", "opts": [{"t": "Metronidazol"}, {"t": "Sikloserin"}, {"t": "Rifampin"}, {"t": "Tetrasiklin"}, {"t": "Kloramfenikol"}], "a": 1, "exp": "**Cevap: Sikloserin.**\nTablonun \"Hücre duvarı hasarı\" bölümünde **sikloserin**, \"peptidoglikan öncüllerinin çapraz bağlanmasını inhibe eder\" diye geçer. Aynı bölümde mikobakterilere etkili duvar ilaçları da vardır: **izoniazid/etiyonamid** (mikolik asit sentezi) ve **etambutol** (arabinogalaktan sentezi).\nHücre duvarı ilaçlarının basamakları (tablo): fosfomisin → N-asetil muramik asit sentezi (erken safha); basitrasin → peptidoglikan öncüllerinin taşınması; vankomisin → peptidoglikan katmanlarında çapraz bağlanma; β-laktamlar → penisilin bağlayan proteinler.\n• Metronidazol → bakteri DNA'sını parçalar.\n• Rifampin → DNA'ya bağımlı RNA polimerazı inhibe eder (mikobakteride kullanılır ama hücre duvarı ilacı değildir).\n• Tetrasiklin → 30S ribozomda polipeptid uzamasını engeller.\n• Kloramfenikol → slayttaki bakteriyostatik ilaçlar listesinde; hücre duvarına etki etmez.\n💡 Akılda kalsın: Sikloserin = öncüllerin çapraz bağlanması (hücre duvarı).", "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdaki antibiyotiklerden hangisi protein sentezinin inhibisyonu yoluyla etki gösterir?", "opts": [{"t": "Doksisiklin"}, {"t": "Kolistin"}, {"t": "Rifampin"}, {"t": "Basitrasin"}, {"t": "Metronidazol"}], "a": 0, "exp": "**Cevap: Doksisiklin.**\nTabloya göre **doksisiklin** bir **tetrasiklindir**; **30S ribozomda polipeptid uzamasını engeller** (protein sentezinin inhibisyonu). Tetrasiklinler geniş spektrumludur: Gram pozitifler, bazı Gram negatifler (Neisseria, bazı Enterobacteriales), mikoplazma, klamidya ve riketsiyalar. Slayta göre bakteriyostatiktir.\nSlaytlarda doksisiklin: S. aureus (tablet), şarbon (siprofloksasin ile), bruselloz (+ gentamisin/streptomisin) tedavisinde.\n• Kolistin → bakteri dış membranının geçirgenliğini bozar (membran fonksiyonu).\n• Rifampin → DNA'ya bağımlı RNA polimerazı inhibe eder (nükleik asit sentezi).\n• Basitrasin → sitoplazmik membran oluşumu ve peptidoglikan öncüllerinin taşınmasını inhibe eder (hücre duvarı); topikal.\n• Metronidazol → bakteri DNA'sını parçalar (nükleik asit).\n💡 Akılda kalsın: Protein sentezi ilaçları: 30S → aminoglikozid, tetrasiklin (doksisiklin), tigesiklin; 50S → linezolid, makrolid, klindamisin, streptogramin.", "shuf": true, "tag": "Pekiştirme"}, {"q": "Slaytlarda S. aureus, Moraxella catarrhalis ve Nocardia tedavisinde geçen trimetoprim-sülfametoksazolün iki bileşeni de hangi süreci bozar?", "opts": [{"t": "Peptidoglikan sentezini"}, {"t": "30S ribozomda protein sentezini"}, {"t": "Folik asit sentezini"}, {"t": "DNA giraz aktivitesini"}, {"t": "Dış membran geçirgenliğini"}], "a": 2, "exp": "**Cevap: Folik asit sentezini.**\nTabloda antimetabolitler başlığında:\n• **Sülfonamidler** (sülfametoksazol) → dihidropteroat **sentazı** inhibe ederek folik asit sentezini bozar.\n• **Trimetoprim** → dihidropteroat **redüktazı** inhibe ederek folik asit sentezini bozar.\nİki ilaç aynı yolun farklı basamaklarını hedefler. Sülfonamidler idrar yolu enfeksiyonlarında seçilecek ilaçtır.\nSlaytlardaki SXT kullanımları: S. aureus (tablet; klindamisin ve doksisiklin ile seçenekler arasında), M. catarrhalis, **Nocardia** (immünkompetan kişilerde kutanöz enfeksiyon; immün yetmezlikte SXT + amikasin; SSS'de SXT + imipenem veya sefalosporin; tedavi 12 ay sürer).\n• Peptidoglikan sentezi → β-laktamlar, vankomisin.\n• 30S protein sentezi → aminoglikozidler, tetrasiklinler.\n• DNA giraz → kinolonlar.\n• Dış membran geçirgenliği → kolistin, polimiksin B.\n💡 Akılda kalsın: SXT = çift basamaklı folik asit blokajı.", "org": ["saureus", "moraxella", "nocardia"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Beta-laktam olduğu hâlde Gram pozitif bakterilere etkisi az olan antibiyotik aşağıdakilerden hangisidir?", "opts": [{"t": "Sefalotin"}, {"t": "Amoksisilin"}, {"t": "Aztreonam"}, {"t": "Piperasilin"}, {"t": "Nafsilin"}], "a": 2, "exp": "**Cevap: Aztreonam.**\nTabloya göre **aztreonam** dar spektrumlu bir **monobaktamdır**: **belirli aerop Gram negatif basillere** etkilidir; **anaeroplara ve Gram pozitif koklara etkisizdir.** Bir β-laktam olarak hücre duvarı sentezini bozar ama spektrumu Gram negatif aeroplarla sınırlıdır.\nDiğer β-laktamların Gram pozitif etkinliği:\n• Sefalotin → dar spektrumlu sefalosporin; Gram pozitiflere etkisi oksasilinle aynı.\n• Amoksisilin ve piperasilin → genişlemiş spektrumlu penisilin; Gram pozitif koklara etkisi doğal penisilinlerle aynı.\n• Nafsilin → penisilinaza dirençli penisilin; stafilokoklara artmış etkinlik.\n💡 Akılda kalsın: AZtreonam = en AZ Gram pozitif etkisi olan β-laktam (yalnız aerop Gram negatif).", "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdaki antimikrobiyal ajanlardan hangisi DNA girazın α-alt birimine bağlanarak nükleik asit sentezini inhibe eder?", "opts": [{"t": "Vankomisin"}, {"t": "Polimiksin B"}, {"t": "Nalidiksik asit"}, {"t": "Eritromisin"}, {"t": "Gentamisin"}], "a": 2, "exp": "**Cevap: Nalidiksik asit.**\nTabloya göre **nalidiksik asit** dar spektrumlu bir **kinolondur**; **DNA girazın α-alt birimine** bağlanır; belirli Gram negatif basillere etkilidir, Gram pozitiflere etkisizdir. Daha yeni kinolonlar (siprofloksasin, levofloksasin, moksifloksasin…) aynı mekanizmayla daha geniş spektrumludur.\n• Vankomisin → glikopeptid; peptidoglikan katmanlarında çapraz bağlanmayı inhibe eder (hücre duvarı); tüm stafilokok ve streptokoklara etkili, Gram negatiflere etkisiz.\n• Polimiksin B → bakteri dış membranının geçirgenliğini bozar; Gram negatiflere etkili.\n• Eritromisin → makrolid; 50S ribozomda polipeptid uzamasını engeller.\n• Gentamisin → aminoglikozid; peptid zincirlerinin 30S ribozomdan olgunlaşmadan ayrılmasını sağlar.\n💡 Akılda kalsın: Kinolon ailesinin ilk/dar üyesi nalidiksik asit → yalnız bazı Gram negatif basiller.", "shuf": true, "tag": "Pekiştirme"}, {"q": "DNA'ya bağımlı RNA polimeraza bağlanarak transkripsiyonu önleyen antibiyotik hangisidir?", "opts": [{"t": "Metronidazol"}, {"t": "Rifampin"}, {"t": "Florokinolonlar"}, {"t": "Trimetoprim"}, {"t": "Klindamisin"}], "a": 1, "exp": "**Cevap: Rifampin.**\nTabloya göre **rifampin** (ve rifabutin) **DNA'ya bağımlı RNA polimeraza** bağlanarak transkripsiyonu önler; mikobakteriler ve aerop Gram pozitiflere etkilidir, Gram negatiflere etkin değildir. Slayta göre bakterisidaldir. Tüberküloz tedavisinin temel ilaçlarındandır (rifamisin, etambutol, izoniazid).\nDikkat: Fidaksomisin de RNA polimerazı inhibe eder ama tabloda C. difficile tedavisinde kullanılan bakterisidal makrolid olarak geçer.\n• Metronidazol → bakteri DNA'sını parçalar.\n• Florokinolonlar → DNA girazın α-alt birimine bağlanır.\n• Trimetoprim → dihidropteroat redüktazı inhibe eder, folik asit sentezini bozar.\n• Klindamisin → 50S ribozomda polipeptid uzamasını engeller.\n💡 Akılda kalsın: RNA polimeraz = Rifampin (\"R-R\").", "org": ["tbc"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Glikopeptidler (vankomisin) için tablodaki bilgi hangisidir?", "opts": [{"t": "Peptidoglikan katmanlarında çapraz bağlanmaları inhibe eder; tüm stafilokok ve streptokoklara etkilidir, Gram negatiflere etkisizdir"}, {"t": "30S ribozoma bağlanır; öncelikle Gram negatif basil enfeksiyonlarında kullanılır"}, {"t": "Bakteri dış membranının geçirgenliğini bozar; Gram pozitiflere etkisizdir"}, {"t": "DNA girazın α-alt birimine bağlanır; Gram pozitiflere etkisizdir"}, {"t": "Dihidropteroat sentazı inhibe eder; idrar yolu enfeksiyonlarında seçilecek ilaçtır"}], "a": 0, "exp": "**Cevap: Peptidoglikan katmanlarında çapraz bağlanmaları inhibe eder; tüm stafilokok ve streptokoklara etkilidir, Gram negatiflere etkisizdir.**\nTabloya göre **glikopeptidler (vankomisin)** peptidoglikan katmanlarında çapraz bağlanmaları inhibe eder (hücre duvarı hasarı); **tüm stafilokok ve streptokoklara** etkilidir; **enterokokların çoğuna, Gram pozitif basillere ve tüm Gram negatiflere karşı etkisizdir.** Slayta göre bakterisidaldir.\nSlaytlardaki kullanımları: S. aureus'ta (MRSA dahil) IV vankomisin; penisilin dirençli pnömokokta seftriakson + vankomisin; penisilin alerjili gebede GBS profilaksisinde; enterokokta penisilin/ampisilin yerine aminoglikozidle kombine; B. cereus göz enfeksiyonunda.\n• 30S ribozom, Gram negatif basil → aminoglikozidler.\n• Dış membran geçirgenliği, Gram pozitife etkisiz → kolistin, polimiksin B.\n• DNA giraz, Gram pozitife etkisiz → nalidiksik asit.\n• Dihidropteroat sentazı, İYE → sülfonamidler.\n💡 Akılda kalsın: Vankomisin = yalnız Gram pozitif koklar (stafilokok + streptokok); enterokokların çoğu ve Gram negatifler hariç.", "shuf": true}, {"q": "Bakteri dış membranının geçirgenliğini bozan ve slayta göre Acinetobacter baumannii'de tek etkili antibiyotik olan ilaç hangisidir?", "opts": [{"t": "Basitrasin"}, {"t": "Vankomisin"}, {"t": "Kolistin"}, {"t": "Fosfomisin"}, {"t": "Sikloserin"}], "a": 2, "exp": "**Cevap: Kolistin.**\nTabloya göre polipeptidler (**kolistin**, polimiksin B) **bakteri dış membranının geçirgenliğini bozar**; birçok Gram negatife etkilidir; **Gram pozitiflere etkisizdir, çünkü Gram pozitifler dış membran içermez.**\nAcinetobacter slaytında: \"İnvitro teste göre tedavi uygulanır. **Kolistin tek etkili antibiyotiktir.**\" A. baumannii Irak ve Afganistan'daki çatışmalarda neredeyse tüm antibiyotiklere direnç geliştirmiştir; hastanelerin iç ve dış ortamlarında, nemli yüzeylerde canlı kalır.\n• Basitrasin → sitoplazmik membran oluşumu ve peptidoglikan öncüllerinin taşınmasını inhibe eder; stafilokok ve streptokoklara etkili topikal ilaç; Gram negatiflere etkisiz.\n• Vankomisin → peptidoglikan çapraz bağlanmasını inhibe eder; Gram negatiflere etkisiz.\n• Fosfomisin → N-asetil muramik asit sentezini bloke eder; idrar yolu enfeksiyonlarında kullanılır.\n• Sikloserin → peptidoglikan öncüllerinin çapraz bağlanmasını inhibe eder.\n💡 Akılda kalsın: Dış membran = Gram negatif = kolistin; Acinetobacter'in son kozu.", "org": ["acinetobacter"], "shuf": true}, {"q": "Peptid zincirlerinin 30S ribozomdan olgunlaşmadan ayrılmasını sağlayan ve tabloya göre en etkin üyesi amikasin olan grup hangisidir?", "opts": [{"t": "Tetrasiklinler"}, {"t": "Aminoglikozidler"}, {"t": "Glisilsiklinler"}, {"t": "Makrolidler"}, {"t": "Oksazolidinonlar"}], "a": 1, "exp": "**Cevap: Aminoglikozidler.**\nTabloya göre **aminoglikozidler** (neomisin, streptomisin, kanamisin, gentamisin, tobramisin, amikasin) **peptid zincirlerinin 30S ribozomdan olgunlaşmadan ayrılmasını** sağlar; öncelikle **Gram negatif basil** enfeksiyonlarında kullanılır. Neomisin topikaldir; kanamisinin aktivitesi sınırlıdır; tobramisin Pseudomonas'a gentamisinden biraz daha etkindir; **amikasin en etkin olandır.** Slayta göre bakterisidaldir.\nSlaytlardaki kullanımları: S. agalactiae (penisilin G + aminoglikozid), Enterococcus (aminoglikozid + penisilin/ampisilin/vankomisin), Francisella (gentamisin), Brucella (doksisiklin + gentamisin/streptomisin), Nocardia (immün yetmezlikte SXT + amikasin).\n• Tetrasiklinler → 30S'de polipeptid **uzamasını** engeller (bakteriyostatik).\n• Glisilsiklinler (tigesiklin) → 30S'ye bağlanıp protein sentezinin **başlamasını** önler.\n• Makrolidler → 50S'de polipeptid uzamasını engeller.\n• Oksazolidinonlar (linezolid) → 50S'de protein sentezinin başlamasını önler.\n💡 Akılda kalsın: 30S + erken ayrılma + bakterisidal = aminoglikozid.", "shuf": true}, {"q": "Mikobakterilerde mikolik asit sentezini inhibe eden ilaç hangisidir?", "opts": [{"t": "Etambutol"}, {"t": "Rifampin"}, {"t": "İzoniazid"}, {"t": "Dapson"}, {"t": "Sikloserin"}], "a": 2, "exp": "**Cevap: İzoniazid.**\nTabloya göre **izoniazid** (ve etiyonamid) **mikolik asit sentezini** inhibe eder; mikobakterilere etkilidir. Mikolik asit, aside dirençli bakterilerin hücre duvarında bulunur ve slayta göre asitle boyanmaya direnç sağlar (Mycobacterium, Nocardia, Rhodococcus, Gordonia, Tsukamurella).\nSlaytlardaki TB tedavisi: rifamisin, etambutol, izoniazid; profilakside 3 ay izoniazid + rifapentin; BCG aşısı.\n• Etambutol → **arabinogalaktan** sentezini inhibe eder (yine mikobakteri hücre duvarı).\n• Rifampin → DNA'ya bağımlı RNA polimerazı inhibe eder.\n• Dapson → dihidropteroat sentazı inhibe eder (folik asit); lepra tedavisinde.\n• Sikloserin → peptidoglikan öncüllerinin çapraz bağlanmasını inhibe eder.\n💡 Akılda kalsın: İzoniazid = mİkolİk asİt; Etambutol = arabinogalaktan.", "org": ["tbc"], "shuf": true}, {"q": "50S ribozomda protein sentezinin başlamasını önleyen ve Gram negatiflere etkisiz olan oksazolidinon hangisidir?", "opts": [{"t": "Tigesiklin"}, {"t": "Klindamisin"}, {"t": "Eritromisin"}, {"t": "Linezolid"}, {"t": "Fosfomisin"}], "a": 3, "exp": "**Cevap: Linezolid.**\nTabloya göre **oksazolidinon (linezolid)** **50S ribozomda protein sentezinin başlamasını** önler; Staphylococcus, Enterococcus, Streptococcus, Gram pozitif basiller, Clostridium ve anaerop koklara etkilidir; **Gram negatiflere etkisizdir.** Slayta göre oksazolidinonlar bakteriyostatiktir. Enterococcus slaytında **direnç varsa linezolid**, daptomisin, kinupristin kullanılır.\n• Tigesiklin → glisilsiklin; **30S**'ye bağlanıp protein sentezinin başlamasını önler; Gram negatiflere ve hızlı üreyen mikobakterilere tetrasiklinlerden daha etkili.\n• Klindamisin → linkozamid; 50S'de polipeptid **uzamasını** engeller.\n• Eritromisin → makrolid; 50S'de polipeptid **uzamasını** engeller.\n• Fosfomisin → hücre duvarı (N-asetil muramik asit sentezi).\n💡 Akılda kalsın: 50S + \"başlama\" = linezolid; 50S + \"uzama\" = makrolid, klindamisin, streptogramin.", "org": ["enterococcus"], "shuf": true}, {"q": "Karbapenemler (imipenem, meropenem, ertapenem, doripenem) tabloya göre hangisine karşı **etkisizdir**?", "opts": [{"t": "Birçok aerop Gram pozitif bakteriye"}, {"t": "Birçok anaerop bakteriye"}, {"t": "Birçok aerop Gram negatif bakteriye"}, {"t": "Neisseria meningitidis'e"}, {"t": "Oksasiline dirençli stafilokoklara ve çoğu E. faecium'a"}], "a": 4, "exp": "**Cevap: Oksasiline dirençli stafilokoklara ve çoğu E. faecium'a.**\nTabloya göre karbapenemler birçok **aerop ve anaerop Gram pozitif ve Gram negatife etkili geniş spektrumlu** β-laktamlardır; ancak **oksasiline dirençli stafilokoklar (MRSA), çoğu E. faecium** ve belirli Gram negatif basillere (**Pseudomonas, Stenotrophomonas, Burkholderia**) karşı etkisizdir.\nSlaytla bağlantı: MRSA suşları β-laktam grubu antibiyotiklere dirençlidir; bu yüzden MRSA'da IV vankomisin kullanılır. Meningokok tedavisinde seftriakson, sefotaksim ve **meropenem** kullanılır; Nocardia SSS enfeksiyonunda SXT + **imipenem** verilebilir.\n• Aerop Gram pozitif, anaerop ve aerop Gram negatiflerin çoğu → karbapenemlerin etkili olduğu geniş spektrumdur.\n• N. meningitidis → slayta göre meropenem tedavide kullanılır, yani etkilidir.\n💡 Akılda kalsın: Karbapenem en geniş β-laktamdır ama MRSA, E. faecium ve Pseudomonas/Stenotrophomonas/Burkholderia'da güvenilmez.", "org": ["saureus", "enterococcus"], "shuf": true, "html": true}, {"q": "Amoksisilin-klavulanat gibi β-laktamaz inhibitörü içeren β-laktamlar, doğal penisilinlere ek olarak hangisine etkinlik kazanır?", "opts": [{"t": "Mikobakterilere"}, {"t": "β-laktamaz üreten stafilokoklara ve bazı Gram negatif basillere"}, {"t": "Yalnızca anaeroplara"}, {"t": "Mikoplazma ve klamidyalara"}, {"t": "Oksasiline dirençli stafilokoklara (MRSA)"}], "a": 1, "exp": "**Cevap: β-laktamaz üreten stafilokoklara ve bazı Gram negatif basillere.**\nTabloya göre β-laktamaz inhibitörleri **β-laktamazlara bağlanarak β-laktamın enzimatik inaktivasyonunu önler.** Kombinasyonlar: ampisilin-sulbaktam, amoksisilin-klavulanat, piperasilin-tazobaktam, seftazidim-avibaktam, seftolozan-tazobaktam, meropenem-vaborbaktam. Spektrumları doğal penisilinlere benzer; **ek olarak β-laktamaz üreten stafilokoklara ve bazı Gram negatif basillere** etkinlik kazanırlar.\nSlaytla bağlantı: Eikenella corrodens'in polimikrobik (ör. ısırık) enfeksiyonları amoksisilin-klavulanat ile tedavi edilir; gonokokta β-laktamaz enzimi penisilin direnci sağlar.\n• Mikobakteriler → izoniazid, rifampin, etambutol gibi ilaçlar.\n• \"Yalnızca anaeroplar\" → metronidazol.\n• Mikoplazma ve klamidya → tetrasiklinler ve makrolidler.\n• MRSA → MRSA tüm β-laktamlara dirençlidir (direnç β-laktamaz kaynaklı değil); β-laktamaz inhibitörü eklemek bunu çözmez.\n💡 Akılda kalsın: İnhibitör β-laktamazı \"kalkan gibi\" tutar → β-laktamaz üreten bakteriler de kapsama girer.", "org": ["eikenella"], "shuf": true}, {"q": "DNA giraz (topoizomeraz II) enziminde mutasyonla değişiklik olması sonucunda aşağıdaki ilaçlardan hangisine karşı direnç gelişmesi beklenir?", "opts": [{"t": "Streptomisin"}, {"t": "Rifampisin"}, {"t": "Siprofloksasin"}, {"t": "İzoniazid"}, {"t": "Tetrasiklin"}], "a": 2, "exp": "📖 Kitap:\nSiprofloksasin kinolon grubu bir antibiyotik olup topoizomeraz II (DNA giraz) ve topoizomeraz IV üzerinden etki gösterir; bu enzimlerde meydana gelen mutasyon bakteride kinolon direncine neden olur. Streptomisin direnci 30S rRNA'nın P12 reseptöründe değişiklikle, rifampin direnci DNA bağımlı RNA polimeraz enzimindeki mutasyonla, izoniazid (INH) direnci katalaz-peroksidaz enzimindeki mutasyonla, tetrasiklin direnci ise aktif efluks sistemi ile meydana gelir.\n📑 Slaytta:\n• Kinolonlar (nalidiksik asit, **siprofloksasin**, levofloksasin, moksifloksasin…) **DNA girazın α-alt birimine bağlanır** → hedef enzim değişirse ilaç bağlanamaz ve direnç gelişir.\n• Streptomisin → aminoglikozid; hedefi 30S ribozom.\n• Rifampisin → hedefi DNA'ya bağımlı RNA polimeraz.\n• İzoniazid → mikolik asit sentezini inhibe eder.\n• Tetrasiklin → 30S ribozomda polipeptid uzamasını engeller.\n💡 Akılda kalsın: İlacın hedefi neyse direnç de genellikle o hedefteki değişiklikle gelişir: DNA giraz → kinolon.", "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Hücre duvarı öncüllerinin sitoplazmik membrandan transportunu inhibe eden antibiyotik hangisidir?", "opts": [{"t": "Basitrasin"}, {"t": "Fosfomisin"}, {"t": "Vankomisin"}, {"t": "Seftriakson"}, {"t": "Gentamisin"}], "a": 0, "exp": "📖 Kitap:\nHücre duvarı öncüllerinin sitoplazmik membrandan taşınmasını sağlayan baktoprenolün yeniden kazanımını engelleyen antibiyotik basitrasindir. Hücre duvarı öncüllerinin birbirine dönüşümünü engelleyen ve gebelerde idrar yolu enfeksiyonu tedavisinde kullanılabilen antibiyotik ise fosfomisindir.\n📑 Slaytta:\n• **Basitrasin** (polipeptid) → \"sitoplazmik membran oluşumu ve **peptidoglikan öncüllerinin taşınmasını** inhibe eder\"; stafilokok ve streptokoklara etkili **topikal** ilaç; Gram negatiflere etkisiz.\n• Fosfomisin → N-asetil muramik asit sentezini ve erken safhada hücre duvarı sentezini bloke eder; idrar yolu enfeksiyonlarında geniş spektrum.\n• Vankomisin → peptidoglikan katmanlarında çapraz bağlanmayı inhibe eder.\n• Seftriakson → geniş spektrumlu sefalosporin; penisilin bağlayan proteinlere bağlanır.\n• Gentamisin → aminoglikozid; 30S ribozom (protein sentezi), hücre duvarına etki etmez.\n💡 Akılda kalsın: Hücre duvarı yapım sırası: fosfomisin (erken, NAM) → basitrasin (taşıma) → vankomisin (çapraz bağ) → β-laktam (PBP).", "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdaki antibiyotiklerden hangisi hücre duvarı öncüllerinin birbirine dönüşümünü inhibe eder?", "opts": [{"t": "Basitrasin"}, {"t": "Fosfomisin"}, {"t": "Vankomisin"}, {"t": "Seftriakson"}, {"t": "Gentamisin"}], "a": 1, "exp": "📖 Kitap:\nHücre duvarı öncüllerinin birbirine dönüşümünü engelleyen, gebelerde idrar yolu enfeksiyonu tedavisinde kullanılabilen antibiyotik fosfomisindir. Hücre duvarı öncüllerinin sitoplazmik membrandan taşınmasını sağlayan baktoprenolün yeniden kazanımını engelleyen antibiyotik ise basitrasindir.\n📑 Slaytta:\n• **Fosfomisin** → \"**N-asetil muramik asit sentezini** ve erken safhada hücre duvarı sentezini bloke eder\" — yani peptidoglikanın ilk yapı taşlarının (öncüllerin) oluşumunu durdurur; Gram pozitif ve Gram negatiflerin neden olduğu **idrar yolu enfeksiyonlarında** geniş spektrumludur.\n• Basitrasin → peptidoglikan öncüllerinin taşınmasını inhibe eder (dönüşüm değil, taşıma basamağı).\n• Vankomisin → peptidoglikan katmanlarında çapraz bağlanmayı inhibe eder (son basamaklar).\n• Seftriakson → penisilin bağlayan proteinlere bağlanır.\n• Gentamisin → 30S ribozom; protein sentezi.\n💡 Akılda kalsın: Fosfomisin = en erken basamak (NAM sentezi) + idrar yolu enfeksiyonu.", "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdakilerden hangisi Gram negatif ve Gram pozitif bakterilere karşı etkili en geniş spektrumlu antibiyotiklerden biridir?", "opts": [{"t": "Vankomisin"}, {"t": "İmipenem"}, {"t": "Kolistin"}, {"t": "Aztreonam"}, {"t": "Teikoplanin"}], "a": 1, "exp": "📖 Kitap:\nKarbapenemler en geniş spektrumlu β-laktamlar olup hem Gram negatif hem de Gram pozitif etkinlik gösterir (geniş spektrum). Vankomisin ve teikoplanin glikopeptid grubu iri yapılı antibiyotiklerdir; Gram negatiflerin porlarından geçemedikleri için yalnızca Gram pozitif etkinlik gösterirler (dar spektrum). Kolistin (diğer adıyla polimiksin E) Gram negatiflerin dış membranına etkili, polipeptid yapılı bir antibiyotiktir (dar spektrum). Aztreonam en az spektrumlu β-laktamdır; etkisi Gram negatif ve aerob bakterilerle sınırlıdır (dar spektrum).\n📑 Slaytta:\n• **Karbapenemler** (imipenem, meropenem, ertapenem, doripenem) → birçok aerop ve anaerop Gram pozitif ve Gram negatife etkili **geniş spektrumlu** (MRSA, çoğu E. faecium ve Pseudomonas, Stenotrophomonas, Burkholderia hariç).\n• Geniş spektrum tanımı: çok sayıda Gram negatif ve Gram pozitif mikroorganizmaya etkili.\n• Vankomisin (ve aynı gruptaki teikoplanin) → glikopeptid; Gram negatiflere etkisiz.\n• Kolistin → dış membranı bozar; Gram pozitiflere etkisiz (dış membranları yok).\n• Aztreonam → monobaktam; anaeroplara ve Gram pozitif koklara etkisiz.\n💡 Akılda kalsın: En geniş β-laktam = karbapenem; en dar β-laktam = aztreonam.", "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdaki antimikrobiyallerden en dar spektrumlu olan hangisidir?", "opts": [{"t": "İmipenem"}, {"t": "Tetrasiklin"}, {"t": "Metronidazol"}, {"t": "Piperasilin"}, {"t": "Sefepim"}], "a": 2, "exp": "📖 Kitap:\nMetronidazol (yalnızca) anaerob bakterilere etkinlik gösterir; bu nedenle dar spektrumlu antibiyotik kabul edilir.\n📑 Slaytta:\n• **Metronidazol** → bakteri DNA'sını parçalar; **anaeroplara etkili, aerop ve fakültatif anaeroplara etkisiz** → tek bir gruba sınırlı, en dar spektrum.\n• İmipenem → karbapenem; birçok aerop ve anaerop Gram pozitif ve Gram negatife etkili geniş spektrum.\n• Tetrasiklin → Gram pozitifler, bazı Gram negatifler (Neisseria, bazı Enterobacteriales), mikoplazma, klamidya ve riketsiyalara etkili geniş spektrum.\n• Piperasilin → genişlemiş spektrumlu penisilin; Gram pozitif koklar + bazı Gram negatif basiller.\n• Sefepim → geniş spektrumlu sefalosporin; Gram negatif etkinliği Pseudomonas'ı da içerir.\n💡 Akılda kalsın: \"Yalnız anaerop\" = metronidazol = dar spektrum.", "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Karbapenemler ve direnç mekanizmaları ile ilgili aşağıdakilerden hangisi **doğru değildir**?", "opts": [{"t": "Sınıf A karbapenemazlar Klebsiella ve Pseudomonas tarafından üretilir ve bütün β-laktamlara karşı direnç gelişiminden sorumludur."}, {"t": "Sınıf B karbapenemazlar Gram negatiflerde bulunup aztreonam dışındaki β-laktamlara direnci kodlar."}, {"t": "Sınıf D karbapenemazlar esas olarak Acinetobacter'de bulunur, birkaç istisna dışında bütün β-laktamlara direnci kodlar ve geleneksel duyarlılık testleri ile saptanabilir."}, {"t": "Karbapenemlerin etki spektrumu Gram negatif ve aerob bakterilerle sınırlıdır."}, {"t": "PBP'ye bağlanarak transpeptidasyonu engellerler."}], "a": 3, "exp": "📖 Kitap:\nβ-laktam antibiyotikler içinde etki spektrumu Gram negatif ve aeroblarla sınırlı olan aztreonamdır. Şıklarda yazan diğer bilgiler karbapenemler ve karbapenemazlar için doğrudur.\n📑 Slaytta:\n• **Karbapenemler** (imipenem, meropenem, ertapenem, doripenem) → birçok **aerop ve anaerop**, **Gram pozitif ve Gram negatife** etkili **geniş spektrumlu** ilaçlardır → \"Gram negatif ve aeroplarla sınırlı\" ifadesi slayta göre de yanlıştır.\n• \"Belirli aerop Gram negatif basillere etkili; anaeroplara ve Gram pozitif koklara etkisiz\" tanımı slaytta **aztreonam** (monobaktam) içindir.\n• β-laktamlar peptidoglikan sentezinden sorumlu **penisilin bağlayan proteinlere** bağlanır → PBP şıkkı doğrudur.\n• Karbapenemaz sınıfları (A, B, D) kitap bilgisidir; slaytta karbapenemlerin Pseudomonas, Stenotrophomonas, Burkholderia gibi bazı Gram negatif basillere etkisiz olduğu, Acinetobacter'in ise neredeyse tüm antibiyotiklere direnç geliştirdiği belirtilir.\n💡 Akılda kalsın: Karbapenem = geniş (aerop + anaerop); aztreonam = dar (yalnız aerop Gram negatif).", "shuf": true, "tag": "Feyyaz Akay", "html": true}, {"q": "Glikopeptit yapılı antibiyotiklere karşı en fazla direnç gösteren bakteri aşağıdakilerden hangisidir?", "opts": [{"t": "Staphylococcus aureus"}, {"t": "Streptococcus pyogenes"}, {"t": "Streptococcus pneumoniae"}, {"t": "Staphylococcus epidermidis"}, {"t": "Enterococcus faecium"}], "a": 4, "exp": "📖 Kitap:\nVankomisine en sık kazanılmış direnç geliştiren bakteriler enterokoklardır. Vankomisin yalnızca Gram pozitiflere etkilidir; peptidoglikanın son iki peptidi olan D-alanin-D-alanine bağlanarak hücre duvarı sentezini engeller. VRSA ve VRE'de direnç mekanizması farklı pentapeptid öncüllerinin sentezi, VISA'da ise hücre duvarı kalınlığının artırılmasıdır. VanA tipi kazanılmış dirençte hem vankomisine hem teikoplanine direnç vardır.\n📑 Slaytta:\n• **Glikopeptidler (vankomisin)** → peptidoglikan katmanlarında çapraz bağlanmayı inhibe eder; **tüm stafilokok ve streptokoklara etkilidir**; **enterokokların çoğuna**, Gram pozitif basillere ve tüm Gram negatiflere **etkisizdir.**\n• Enterococcus slaytı: antibiyotik direnci tedaviyi zorlaştırır; direnç varsa linezolid, daptomisin, kinupristin (E. faecium'a etkili) kullanılır.\nYanlış şıklar:\n• S. aureus ve S. epidermidis (koagülaz-negatif stafilokok) → \"tüm stafilokoklar\" vankomisine duyarlı; MRSA'da bile IV vankomisin kullanılır.\n• S. pyogenes ve S. pneumoniae → \"tüm streptokoklar\" duyarlı; penisilin dirençli pnömokokta vankomisin kullanılır.\n💡 Akılda kalsın: Vankomisin direnci denince enterokok (VRE).", "org": ["enterococcus"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aminoglikozidler ile ilgili aşağıda verilen bilgilerden hangisi doğrudur?", "opts": [{"t": "Oral absorpsiyonları oldukça iyidir."}, {"t": "Bacteroides fragilis'e karşı etkinlikleri oldukça iyidir."}, {"t": "Enterokokal endokardit vakasında gentamisin + ampisilin verilebilir."}, {"t": "Hastane kaynaklı S. marcescens tedavisinde streptomisin, netilmisinden daha etkilidir."}, {"t": "Yukarıdakilerin hiçbiri"}], "a": 2, "exp": "📖 Kitap:\nAminoglikozidlerin lipofilitesi oldukça düşük olduğundan oral biyoyararlanımları da düşüktür. Gram negatif ve aerob enfeksiyonların tedavisinde kullanılırlar; bu nedenle bir anaerob olan B. fragilis tedavisinde tercih edilmezler. Aminoglikozid + hücre duvarı sentez inhibitörü (gentamisin + ampisilin gibi) kombinasyonu enterokokal endokardit vakasında kullanılır; bu kombinasyon aynı zamanda sinerjizm (1+1>2) örneğidir.\n📑 Slaytta:\n• Enterococcus tedavisi: \"**Aminoglikozid (+ penisilin/ampisilin/vankomisin)** verilir\"; slayta göre enterokokun hastalıkları arasında **endokardit** de vardır → doğru şık.\n• Aminoglikozidler (neomisin, streptomisin, kanamisin, gentamisin, tobramisin, amikasin) → 30S ribozom; **öncelikle Gram negatif basil** enfeksiyonlarında; bakterisidal; tabloda en etkin üye amikasin, Pseudomonas'a en etkin olanlardan tobramisin.\n• B. fragilis → tabloda peritonit ve nekrotizan fasiit etkeni bir anaeroptur; slayta göre anaeroplara etkili ilaç metronidazoldür.\n• Oral absorpsiyon ve S. marcescens/netilmisin bilgileri slaytta yoktur; kitaba göre her ikisi de yanlıştır.\n💡 Akılda kalsın: Enterokok endokarditi = aminoglikozid + hücre duvarı ilacı (ampisilin/penisilin/vankomisin).", "org": ["enterococcus"], "shuf": false, "tag": "Feyyaz Akay"}, {"q": "Antibiyotik – özellik eşleştirmelerinden hangisi **doğru değildir**?", "opts": [{"t": "Siprofloksasin – Nükleotid yapısının süpersarmal hâle gelmesini engeller"}, {"t": "Klindamisin – Ribozomal 50S bölgesindeki mutasyon sonucu direnç gelişimi"}, {"t": "Streptograminler – Enterococcus faecalis tedavisinde öncelikli tercih olma"}, {"t": "Sefiderokol – Siderofor özelliğinde olma"}, {"t": "Meropenem + vaborbaktam – E. coli, Klebsiella'ya bağlı komplike İYE tedavisinde kullanılma"}], "a": 2, "exp": "📖 Kitap:\nE. faecalis streptograminlere dirençlidir; bu nedenle \"E. faecalis tedavisinde öncelikli tercih\" eşleştirmesi yanlıştır. Diğer eşleştirmeler doğrudur: siprofloksasin DNA giraz üzerinden DNA'nın süpersarmal hâle gelmesini engeller; klindamisin direnci 50S ribozomal bölgedeki değişiklikle gelişir; sefiderokol siderofor özellikli bir sefalosporindir; meropenem-vaborbaktam komplike idrar yolu enfeksiyonlarında kullanılır.\n📑 Slaytta:\n• **Streptograminler** (kinupristin-dalfopristin) → \"E. faecium (**E. faecalis'e etkisiz**)\"; ayrıca metisiline duyarlı/dirençli stafilokoklar, streptokoklar, Haemophilus, Moraxella ve anaeroplara etkili; Enterobacteriales ve Gram negatif basillere etkisiz.\n• Siprofloksasin → kinolon; DNA girazın α-alt birimine bağlanır.\n• Klindamisin → linkozamid; **50S** ribozomda polipeptid uzamasını engeller.\n• Meropenem-vaborbaktam → tabloda β-laktamaz inhibitörü içeren β-laktamlar arasında; inhibitör β-laktamın enzimatik inaktivasyonunu önler. Komplike İYE etkenleri olarak tabloda sistit/piyelonefritte E. coli ve diğer Enterobacteriales geçer.\n• Sefiderokol slaytta geçmez (kitap bilgisi).\n💡 Akılda kalsın: Kinupristin = faecium evet, faecalis hayır.", "org": ["enterococcus"], "shuf": true, "tag": "Feyyaz Akay", "html": true}]}, {"title": "Gram (+) Koklar", "desc": "S. aureus, S. pyogenes, S. agalactiae, pnömokok ve enterokoklar; toksinler ve vakalar", "short": "Gram (+) kok", "questions": [{"q": "Aerobik Gram pozitif koklarla ilgili hangisi **YANLIŞTIR**?", "opts": [{"t": "Çarşaf, kapı kolu, masa gibi yüzeylerde uzun süre canlı kalırlar"}, {"t": "Hiçbiri insan florasında normalde bulunmaz"}, {"t": "Virülansları tutunma, immün sistemden kaçma ve hidrolitik enzim üretme yetenekleriyle ölçülür"}, {"t": "Ağız, GİS, genitoüriner sistem ve cilt yüzeyinde yaygındırlar"}, {"t": "En önemlileri Staphylococcus, Streptococcus ve Enterococcus'tur"}], "a": 1, "exp": "Slayta göre aerobik Gram pozitif koklardan **bazıları insan florasında normal olarak da bulunur**; bu yüzden \"hiçbiri florada bulunmaz\" ifadesi yanlıştır.\nBu grubu slayttaki 5 maddeyle öğren:\n• Yerleşim: ağız, GİS, genitoüriner sistem ve cilt yüzeyinde yaygındırlar (ör. enterokoklar GİS'e yerleşir, S. agalactiae genitoüriner sistemde asemptomatik koloni yapar).\n• Çevre direnci: çarşaf, kapı kolu, masa gibi yüzeylerde uzun süre canlı kalırlar — S. aureus'un yüzey, giysi, çarşaf ve temasla yayılması bu yüzdendir.\n• Virülans ölçütü: tutunma, immün sistemden kaçma ve hidrolitik enzim üretme yetenekleri.\n• En önemli cinsler: Staphylococcus, Streptococcus ve Enterococcus.\nDiğer dört şık bu slayt maddelerinin aynısıdır, yani doğrudur.\n💡 Akılda kalsın: \"Florada olabilir, yüzeyde yaşar, üç cins: Stafilo – Strepto – Entero.\"", "shuf": true, "html": true}, {"q": "Slayta göre bakteriyel virülansı en yüksek olanlar arasında sayılmayan hangisidir?", "opts": [{"t": "Enterococcus faecalis"}, {"t": "Staphylococcus aureus"}, {"t": "Streptococcus pneumoniae"}, {"t": "Streptococcus pyogenes"}, {"t": "Streptococcus agalactiae"}], "a": 0, "exp": "Slayttaki \"bakteriyel virülansı en yüksek olanlar\" listesinde dört bakteri vardır: **S. pneumoniae, S. agalactiae, S. pyogenes ve S. aureus**. Enterococcus faecalis bu listede yoktur.\nEnterokoklar slaytta virülansları ile değil, **antibiyotik dirençleri** ile öne çıkar: geniş spektrumlu sefalosporin tedavilerinde nozokomiyal enfeksiyonların en yaygın nedenidir ve direnç tedaviyi zorlaştırır; enfeksiyon kaynakları endojendir (GİS).\nDiğer şıklar listede olduğu için \"sayılmayan\" olamaz:\n• S. aureus → piyojenik ve toksin kaynaklı hastalıklar.\n• S. pneumoniae → viridanslar içinde en virülan olan; pnömoni, menenjit, fulminan sepsis.\n• S. pyogenes → farenjit, nekrotizan fasiit, romatizmal ateş.\n• S. agalactiae → yüksek mortaliteli yenidoğan hastalığı.\n💡 Akılda kalsın: Listede \"3 Streptococcus + 1 Staphylococcus\" var; Enterococcus yok.", "org": ["saureus", "spyogenes", "sagalactiae", "spneumoniae", "enterococcus"], "shuf": true}, {"q": "Staphylococcus aureus ile ilgili hangisi **YANLIŞTIR**?", "opts": [{"t": "Polisakkarit kapsülü vardır"}, {"t": "Hem aerobik hem anaerobik olarak çoğalır"}, {"t": "MRSA suşları β-laktam grubu antibiyotiklere de dirençlidir"}, {"t": "Yüksek tuz konsantrasyonunda çoğalamaz"}, {"t": "Piyojeniktir; akut nötrofilik inflamasyona ve irin oluşumuna neden olur"}], "a": 3, "exp": "Slayta göre S. aureus **yüksek tuzda çoğalabilir** ve bu sayede (tuzlu gıdalarda) gıda zehirlenmesi yapabilir; \"yüksek tuzda çoğalamaz\" ifadesi yanlıştır.\nSlayttaki S. aureus özellikleri:\n• Kültürde çabuk ürer; MSSA/MRSA ayrımı kolayca yapılır.\n• Hem aerobik hem anaerobik çoğalır.\n• Polisakkarit kapsülü ve yapışmayı sağlayan hücre yüzey proteinleri vardır.\n• Katalaz, koagülaz, lipaz, hiyalüronidaz, nükleaz ve sitotoksinlerle hastalık yapar; enterotoksin, eksfoliyatif toksin ve TŞS toksini salgılar.\n• Piyojeniktir: akut nötrofilik inflamasyon ve irin oluşumu.\n• MRSA suşları β-laktam grubu antibiyotiklere de dirençlidir.\nDiğer dört şık bu listeden alınmıştır, yani doğrudur.\n💡 Akılda kalsın: \"Tuzu sever, irini sever\" → S. aureus.", "org": ["saureus"], "shuf": true, "html": true}, {"q": "S. aureus'un ısıya ve mide asidine dirençli olup gıda zehirlenmesi yapan toksini hangisidir?", "opts": [{"t": "Eksfoliyatif toksin"}, {"t": "Toksik şok sendromu toksini"}, {"t": "Streptolizin O"}, {"t": "Pnömolizin"}, {"t": "Enterotoksin"}], "a": 4, "exp": "S. aureus **enterotoksini** slayta göre ısıya dirençli ve mide asidine dirençlidir; bu yüzden ısıtılmış gıdada bile etkinliğini korur ve kusma, ishal, mide krampı ile seyreden gıda zehirlenmesi yapar.\nS. aureus'un slayttaki üç toksinini birbirinden ayır:\n• Enterotoksin → ısıya + mide asidine dirençli → gıda zehirlenmesi.\n• Eksfoliyatif toksin (A ve B tipi) → cildin soyulması → haşlanmış deri sendromu.\n• Toksik şok sendromu toksini → ısıya + proteaza dirençli → çoklu organ patolojisi (ateş, hipotansiyon, döküntü).\nYanlış şıklar:\n• Eksfoliyatif toksin → deri soyulması yapar, gıda zehirlenmesi değil.\n• TŞS toksini → proteaza dirençlidir ama tablosu çoklu organ tutulumudur.\n• Streptolizin O → S. pyogenes'in hidrolitik enzimi.\n• Pnömolizin → S. pneumoniae'nın epitel ve makrofajları yok eden toksini.\n💡 Akılda kalsın: \"Mide asidine dayanan toksin = enterotoksin (entero = bağırsak).\"", "org": ["saureus"], "shuf": true}, {"q": "Aşağıdaki S. aureus hastalıklarından hangisi piyojenik değil, **TOKSİN** kaynaklıdır?", "opts": [{"t": "Fronkül ve karbonkül"}, {"t": "Osteomiyelit"}, {"t": "Haşlanmış deri sendromu"}, {"t": "İmpetigo"}, {"t": "Septik artrit"}], "a": 2, "exp": "Slayt S. aureus hastalıklarını iki gruba ayırır ve **haşlanmış deri sendromu \"toksin kaynaklı hastalıklar\"** grubundadır; eksfoliyatif toksinin cildi soydurmasıyla oluşur.\n• Piyojenik hastalıklar (bakterinin dokuda çoğalıp irin yapması): impetigo, follikülit, fronkül ve karbonkül, yara enfeksiyonları, pnömoni, endokardit, osteomiyelit, septik artrit.\n• Toksin kaynaklı hastalıklar: gıda zehirlenmesi (enterotoksin), haşlanmış deri sendromu (eksfoliyatif toksin), toksik şok sendromu (TŞS toksini).\nYanlış şıklar:\n• Fronkül ve karbonkül → piyojenik deri enfeksiyonu.\n• Osteomiyelit → piyojenik kemik enfeksiyonu.\n• İmpetigo → piyojenik yüzeyel deri enfeksiyonu.\n• Septik artrit → piyojenik eklem enfeksiyonu.\n💡 Akılda kalsın: Toksin kaynaklı üçlü = \"Gıda – Haşlanmış deri – Toksik şok\".", "org": ["saureus"], "shuf": true, "html": true}, {"q": "Lokalize bir bölgedeki toksik ajanın birçok organı etkilediği; ateş, hipotansiyon ve döküntüyle seyreden tablo hangisidir?", "opts": [{"t": "Follikülit"}, {"t": "Toksik şok sendromu"}, {"t": "Gıda zehirlenmesi"}, {"t": "Haşlanmış deri sendromu"}, {"t": "Kızıl"}], "a": 1, "exp": "Slayttaki tanım: **Toksik şok sendromu**, lokalize bölgedeki toksik ajanın birçok organı etkilemesidir; ateş, hipotansiyon ve döküntü görülür. Sorumlu toksin TŞS toksinidir (ısıya ve proteaza dirençli, çoklu organ patolojisi yapar). Slayta göre S. pyogenes'in de \"streptokokal toksik şok sendromu\" vardır.\nYanlış şıklar:\n• Follikülit → S. aureus'un lokal, piyojenik kıl kökü enfeksiyonu; çoklu organ tutulumu yoktur.\n• Gıda zehirlenmesi → enterotoksin; kusma, ishal, mide krampı ile seyreder.\n• Haşlanmış deri sendromu → eksfoliyatif toksin; tablo deri soyulmasıdır.\n• Kızıl → S. pyogenes hastalığı; slayttaki tanım (lokal ajan → çoklu organ) ona ait değildir.\n💡 Akılda kalsın: \"Lokal odak + sistemik şok (ateş–hipotansiyon–döküntü) = TŞS\".", "org": ["saureus"], "shuf": true}, {"q": "S. aureus enfeksiyonlarının tedavi ve korunmasıyla ilgili hangisi **YANLIŞTIR**?", "opts": [{"t": "Etkili bir aşısı vardır"}, {"t": "İnsizyon ve drenaj uygulanır"}, {"t": "El yıkama, maske ve eldiven korunmada önemlidir"}, {"t": "Tablet olarak trimetoprim-sulfametoksazol, klindamisin veya doksisiklin kullanılabilir"}, {"t": "IV vankomisin kullanılır"}], "a": 0, "exp": "Slayta göre S. aureus için **aşı yoktur**; bu nedenle \"etkili bir aşısı vardır\" yanlıştır.\nSlayttaki tedavi ve korunma maddeleri:\n• Cerrahi: insizyon ve drenaj (apse boşaltılır), yara pansumanı.\n• Oral (tablet): trimetoprim-sülfametoksazol, klindamisin, doksisiklin.\n• IV: vankomisin (MRSA dahil tüm stafilokoklara etkili glikopeptid).\n• Korunma: dezenfektan kullanımı, el yıkama, maske ve eldiven — çünkü bakteri yüzey, giysi, çarşaf ve temasla kişiden kişiye bulaşır.\nDiğer şıkların hepsi bu listede yer alır.\n💡 Akılda kalsın: Bu konudaki Gram (+) koklardan aşısı olan yalnızca **pnömokoktur** (13 ve 23 değerli); S. aureus ve S. agalactiae'nın aşısı yoktur.", "org": ["saureus"], "shuf": true, "html": true}, {"q": "Bir hastada lokalize deri yarasından sonra yüksek ateş, hipotansiyon, yaygın döküntü ve birden çok organda tutulum gelişiyor. Yara kültüründe S. aureus üretiliyor. Tablodan sorumlu toksin hangisidir?", "opts": [{"t": "S. aureus – enterotoksin"}, {"t": "S. aureus – toksik şok sendromu toksini"}, {"t": "S. pneumoniae – pnömolizin"}, {"t": "S. pyogenes – streptolizin O"}, {"t": "S. aureus – eksfoliyatif toksin"}], "a": 1, "exp": "Lokalize bir yara odağından sonra ateş, hipotansiyon, yaygın döküntü ve çoklu organ tutulumu = **toksik şok sendromu**; S. aureus'ta sorumlusu **TŞS toksinidir**. Slayta göre bu toksin ısıya ve proteaza dirençlidir ve çoklu organ patolojisi oluşturur.\nYanlış şıklar:\n• S. aureus – enterotoksin → gıda zehirlenmesi (kusma, ishal, kramp); şok tablosu yapmaz.\n• S. aureus – eksfoliyatif toksin → cildin soyulması (haşlanmış deri sendromu).\n• S. pneumoniae – pnömolizin → epitel ve makrofajları yok eder; pnömoni/menenjit etkeni, yara kültüründe S. aureus üremesiyle uyumsuz.\n• S. pyogenes – streptolizin O → hidrolitik enzim (hemolizin); ayrıca kültürde S. aureus üretilmiştir.\n💡 Akılda kalsın: S. aureus toksin–hastalık eşleşmesi: Enterotoksin → gıda, Eksfoliyatif → deri soyulması, TŞST → şok.", "org": ["saureus"], "shuf": true}, {"q": "Bir düğün yemeğinden sonra aynı masadaki 5 kişide kısa süre içinde kusma, ishal ve mide krampı başlıyor. Yiyeceklerin yeniden ısıtılmış olduğu öğreniliyor. En olası neden hangisidir?", "opts": [{"t": "Brucella melitensis"}, {"t": "Bordetella pertussis"}, {"t": "Neisseria meningitidis"}, {"t": "Mycobacterium tuberculosis"}, {"t": "S. aureus enterotoksini ile gıda zehirlenmesi"}], "a": 4, "exp": "Aynı yemeği yiyen kişilerde **kısa sürede** başlayan kusma, ishal ve mide krampı tipik **S. aureus enterotoksini** ile gıda zehirlenmesidir. Slayta göre enterotoksin **ısıya dirençlidir**; bu yüzden yemeğin yeniden ısıtılması toksini yok etmez. Ayrıca mide asidine dirençlidir ve S. aureus yüksek tuzda çoğalabilir. Slayttaki klinik sendromlar tablosunda besin zehirlenmesi etkenleri S. aureus ve B. cereus'tur.\nYanlış şıklar:\n• Brucella melitensis → çiğ süt/süt ürünleriyle bulaşır; dalgalı ateş, kas-eklem ağrısı yapar; akut kusma salgını değil.\n• Bordetella pertussis → aerosolle bulaşan boğmaca (öksürük nöbetleri).\n• Neisseria meningitidis → solunum yoluyla bulaşır; menenjit, meningokoksemi.\n• Mycobacterium tuberculosis → aerosolle bulaşır, yavaş seyirli akciğer tüberkülozu.\n💡 Akılda kalsın: \"Isıtmak kurtarmaz\" → ısıya dirençli enterotoksin.", "org": ["saureus"], "shuf": true}, {"q": "\"MRSA\" kısaltması neyi ifade eder ve slayta göre önemi nedir?", "opts": [{"t": "Çoklu dirençli S. anginosus"}, {"t": "Makrolide dirençli S. agalactiae"}, {"t": "Metronidazole dirençli S. aureus"}, {"t": "Metisiline dirençli S. aureus; β-laktam grubu antibiyotiklere de dirençlidir"}, {"t": "Metisiline duyarlı S. aureus"}], "a": 3, "exp": "**MRSA = Metisiline dirençli S. aureus**; MSSA ise metisiline duyarlı S. aureus'tur. Slayta göre MSSA/MRSA ayrımı kolayca yapılır ve **MRSA suşları β-laktam grubu anti
