sin**,\n- **SSS tutulumunda SXT, imipenem veya sefalosporin** kullanılır.\n- **Tedavi 12 ay sürer**; **yara bakımı** önemlidir.\n- Bakteri her yerde bulunduğu için **temastan kaçmak zordur**.\n(SXT'deki sülfametoksazol dihidropteroat sentazı, trimetoprim ise folik asit yolunda bir sonraki basamağı inhibe ederek folik asit sentezini bozar.)\nYanlış şıklar:\n- **Penisilin 10 gün** → Nocardia tedavisinde penisilin yoktur; süre de 12 aydır.\n- **Kolistin tek seçenektir** → kolistin Gram negatiflere etkilidir, Gram pozitiflere etkisizdir.\n- **Temastan kaçınmak kolaydır** → slayt tam tersini söyler: her yerde bulunduğu için **zordur**.\n- **3 ay izoniazid** → 3 ay izoniazid + rifapentin **tüberküloz profilaksisidir**.\n💡 **Ezber ipucu:** Nocardia = \"**SXT, 12 ay**\"; İY'de \"+ amikasin\"; SSS'de \"SXT / imipenem / sefalosporin\".", "org": ["nocardia"], "shuf": true}, {"q": "Aşağıdakilerden hangisi tüberkülozda granülomun rolünü en iyi açıklar?", "opts": [{"t": "Enfeksiyonu sınırlar ama bakterinin canlı kalmasını da sağlar"}, {"t": "Bakteriyi tamamen eradike eder"}, {"t": "Bakterinin yayılmasını hızlandırır"}, {"t": "Sadece lepromatöz leprada görülür"}, {"t": "Antikor üretiminin tek kaynağıdır"}], "a": 0, "exp": "**Doğru cevap: Enfeksiyonu sınırlar ama bakterinin canlı kalmasını da sağlar.**\nSlayta göre **granülomlar enfeksiyonu sınırlar ancak bakterilerin de canlı kalmasını sağlar.** Patogenezde granülom; makrofaj fagositozu, fagozom-lizozom birleşme engeli, sitokinlerle T ve NK hücrelerinin gelişi ve makrofaj aktivasyonundan sonra **nekrotik hücrelerden** oluşur. Bakteri granülom içinde yaşamaya devam ettiği için M. tuberculosis **hücre içi, persistan** bir patojendir ve **hayat boyu enfeksiyon** oluşturabilir.\nYanlış şıklar:\n- **Bakteriyi tamamen eradike eder** → granülom bakteriyi öldürmez, yalnızca sınırlar.\n- **Yayılmayı hızlandırır** → tersine yayılımı sınırlar.\n- **Sadece lepromatöz leprada görülür** → granülom slaytta tüberkülozun patogenezinin son basamağıdır; ayrıca klinik sendrom tablosunda granülomatöz enfeksiyon etkenleri M. tuberculosis, Nocardia ve T. pallidum'dur.\n- **Antikor üretiminin tek kaynağıdır** → granülom hücresel (makrofaj, T ve NK) bir yanıttır; antikor üretimiyle ilgili değildir.\n💡 **Ezber ipucu:** Granülom = \"hapishane\": bakteriyi tutar ama öldürmez.", "org": ["tbc"], "shuf": true}, {"q": "Slayta göre \"insan tek rezervuardır\" ifadesi aşağıdaki bakterilerden hangisi için geçer?", "opts": [{"t": "Nocardia"}, {"t": "Mycobacterium tuberculosis"}, {"t": "Mycobacterium avium"}, {"t": "Listeria monocytogenes"}, {"t": "Bacillus anthracis"}], "a": 1, "exp": "**Doğru cevap: Mycobacterium tuberculosis.**\nSlayttaki tüberküloz epidemiyolojisine göre **insan tek rezervuardır** ve **kişiden kişiye aerosol bulaşma** vardır. Bu yüzden tüberküloz kontrolü olgu takibi ve taramaya dayanır.\nYanlış şıklar (her birinin slayttaki kaynağı farklıdır):\n- **Nocardia** → **organik topraklarda** bulunur; inhalasyon ve kutanöz travma ile eksojen enfeksiyon yapar.\n- **Mycobacterium avium** → **kontamine su ve besinle** bulaşır; adı tüberküloz benzeri hastalığı olan **kuşlardan (avis)** gelir.\n- **Listeria monocytogenes** → **toprak, bitki, hayvan ve sularda** yaşar; kontamine gıdalarla bulaşır.\n- **Bacillus anthracis** → **sığır konağıdır, insan rastlantısal konaktır**.\n💡 **Ezber ipucu:** \"Rezervuar yalnız insan + aerosol\" = tüberküloz.", "org": ["tbc", "nocardia", "avium", "listeria", "anthracis"], "shuf": true}, {"q": "M. tuberculosis kültürünün değerlendirilmesi neden haftalar alır?", "opts": [{"t": "Bakteri kültürde 3–4 günde ürer"}, {"t": "Bakteri kültürde hiç üremez"}, {"t": "Bakteri yavaş ürer; 2–6 hafta inkübasyon gerekir"}, {"t": "Kültürde çevresel kontaminasyonlar görülür"}, {"t": "Bakteri yalnızca İV kateterde ürer"}], "a": 2, "exp": "**Doğru cevap: Bakteri yavaş ürer; 2–6 hafta inkübasyon gerekir.**\nSlayta göre M. tuberculosis'in **üremeleri yavaştır ve 2–6 hafta inkübasyon gerekir.** Yavaş üreme, tüm aside dirençlilerin ortak özelliğidir ve hücre duvarındaki mikolik asitten zengin yapıyla ilişkilidir. Slayta göre yavaş üreyenler fırsatçı olmadığından kolay belirlenir.\nYanlış şıklar — her biri başka bir aside dirençlinin kültür özelliğidir:\n- **3–4 günde ürer** → **Nocardia**.\n- **Kültürde hiç üremez** → **M. leprae** (kültürde üretilememiştir).\n- **Kültürde çevresel kontaminasyonlar görülür** → **M. avium**.\n- **Yalnızca İV kateterde ürer** → anlamsız bir ifadedir; İV kateter enfeksiyonu **Gordonia ve Tsukamurella** için slaytta geçer.\n💡 **Ezber ipucu:** Kültür özellikleri: TB \"2–6 hafta\", Nocardia \"3–4 gün\", Lepra \"üretilemedi\", Avium \"kontaminasyon\".", "org": ["tbc", "nocardia", "leprae", "avium"], "shuf": true}, {"q": "Aşağıdakilerden hangisi tüberküloz için slaytta sayılan risk faktörlerinden **değildir**?", "opts": [{"t": "HIV enfeksiyonu"}, {"t": "İmmün yetersizlik"}, {"t": "İlaç ve alkol bağımlılığı"}, {"t": "Evsizlik"}, {"t": "Çiğ süt tüketimi"}], "a": 4, "exp": "**Doğru cevap: Çiğ süt tüketimi.**\nSlaytta tüberküloz için sayılan risk faktörleri: **immün yetersizlik, HIV enfeksiyonu, ilaç ve alkol bağımlılığı ile evsizlik**. Tüberküloz **kişiden kişiye aerosolle** bulaşır ve **insan tek rezervuardır**; bu yüzden gıda kaynaklı bir risk sayılmamıştır.\n**Çiğ süt ve süt ürünleri tüketimi** slaytta **Brucella** (bruselloz) için risk olarak geçer; korunmada da \"çiğ süt ve süt ürünleri tüketilmemeli\" denir.\nDiğer şıklar (HIV, immün yetersizlik, ilaç/alkol bağımlılığı, evsizlik) slaytta doğrudan sayılan tüberküloz risk faktörleridir.\n💡 **Ezber ipucu:** TB riskleri \"**HIV – İmmün yetersizlik – Bağımlılık – Evsizlik**\".", "org": ["tbc"], "shuf": true, "html": true}, {"q": "Tüberküloz aşısı BCG'nin açılımı nedir?", "opts": [{"t": "Bakteriyel Canlı Genom"}, {"t": "Bacille Calmette-Guérin"}, {"t": "Basil Kültür Jeneriği"}, {"t": "Bordetella Calmette Grubu"}, {"t": "Bacillus Cereus Grubu"}], "a": 1, "exp": "**Doğru cevap: Bacille Calmette-Guérin.**\nSlayta göre tüberkülozdan korunmada **Bacille Calmette-Guérin (BCG) aşısı** uygulanır; BCG canlı atenüe bir aşıdır. Tüberküloz tedavisinde **rifampisin (rifamisin), etambutol ve izoniazid** kullanılır; **profilakside 3 ay izoniazid ve rifapentin** verilir; tedavi hızla değiştiği için **bölgeseldir**; **dikkatli olgu takibi ve tarama** ile hastalık kontrolü sağlanır.\nYanlış şıklar uydurma açılımlardır:\n- \"Bakteriyel Canlı Genom\", \"Basil Kültür Jeneriği\" → böyle bir aşı adı yoktur.\n- \"Bordetella Calmette Grubu\" → Bordetella boğmaca etkenidir, BCG ile ilgisi yoktur.\n- \"Bacillus Cereus Grubu\" → B. cereus gıda zehirlenmesi/gastroenterit etkenidir.\n💡 **Ezber ipucu:** BCG = **B**acille **C**almette-**G**uérin; tüberküloz aşısı.", "org": ["tbc"], "shuf": true}, {"q": "Leprada tüberküloid ya da lepromatöz formun gelişmesini belirleyen temel etmen nedir?", "opts": [{"t": "İklim"}, {"t": "Hastanın kan grubu"}, {"t": "Bakterinin spor sayısı"}, {"t": "Bakterinin Gram boyanması"}, {"t": "Konağın immün yanıtı"}], "a": 4, "exp": "**Doğru cevap: Konağın immün yanıtı.**\nSlayta göre M. leprae **yavaş üremesi ve immün yanıt ile** enfeksiyon oluşturur: **hücresel bağışıklık ile sitokin üretimi artarak makrofajlar basilleri temizlerse tüberküloid lepra** olur; **bol miktarda aside dirençli basilin olduğu ve yaygın nekrozun görüldüğü** tabloda **lepromatöz lepra** gelişir. Bu, tüm aside dirençliler için geçerli olan \"hastalığın ortaya çıkması konağın immün yeteneğine bağlıdır\" kuralının leprada görünümüdür.\nYanlış şıklar:\n- **İklim** → slaytta lepranın görüldüğü bölgeler (Brezilya, Endonezya) verilir ama formu iklim belirlemez.\n- **Kan grubu** → slaytta lepra formuyla ilişkilendirilmez.\n- **Spor sayısı** → aside dirençli bakteriler **sporsuzdur**.\n- **Gram boyanması** → tüm aside dirençliler Gram pozitif yapıdadır; formu belirlemez.\n💡 **Ezber ipucu:** Lepra formu = konağın hücresel bağışıklığı (iyi → tüberküloid; zayıf → lepromatöz).", "org": ["leprae"], "shuf": true}, {"q": "M. leprae vücuda hangi yollarla girer?", "opts": [{"t": "Yalnızca kan nakliyle"}, {"t": "Yara eksüdaları, deri, solunum salgıları ve aerosollerle"}, {"t": "Yalnızca cinsel yolla"}, {"t": "Yalnızca kontamine su ve besinle"}, {"t": "Yalnızca kutanöz travmayla"}], "a": 1, "exp": "**Doğru cevap: Yara eksüdaları, deri, solunum salgıları ve aerosollerle.**\nSlayta göre M. leprae **yara eksüdaları, derinin/solunum salgıları ve aerosoller** ile vücuda girer. **Yavaş ürediği** ve immün yanıtla hastalık oluşturduğu için **klinik belirtilerin ortaya çıkması yıllar sürer**. **Lepromatöz form yüksek bulaşıcıdır**; bu yüzden **karantina ve tedavi önemlidir**. Brezilya ve Endonezya'da görülmüştür; ABD'de yıllık 200 yeni olgu gelişir.\nYanlış şıklar:\n- **Yalnızca kan nakliyle** → slaytta böyle bir bulaş yolu yoktur.\n- **Yalnızca cinsel yolla** → slaytta yoktur; cinsel yol gonokok gibi bakterilerin bulaş yoludur.\n- **Yalnızca kontamine su ve besinle** → bu, **M. avium**'un bulaş yoludur.\n- **Yalnızca kutanöz travmayla** → kutanöz travma (inhalasyonla birlikte) **Nocardia**'nın eksojen bulaş yoludur.\n💡 **Ezber ipucu:** Lepra = \"yara + salgı + aerosol\", belirtiler \"yıllar sonra\".", "org": ["leprae"], "shuf": true}, {"q": "Mycobacterium avium adındaki \"avium\" neyi ifade eder?", "opts": [{"t": "Avustralya kıtasını"}, {"t": "Altın rengi kolonileri"}, {"t": "Avis (kuş): tüberküloz benzeri hastalığı olan kuşlardan elde edilmiştir"}, {"t": "Bir ilaç adını"}, {"t": "Keşfeden bilim insanının adını"}], "a": 2, "exp": "**Doğru cevap: Avis (kuş): tüberküloz benzeri hastalığı olan kuşlardan elde edilmiştir.**\nSlayta göre M. avium, **tüberküloz benzeri hastalığı olan \"avis\" (kuş)** kuşlardan elde edildiği için bu adı almıştır. Bakteri **AIDS hastalarında en sık rastlanan fırsatçı enfeksiyondur**, **kontamine su ve besinle** bulaşır ve tüberkülozun az olduğu ülkelerde görülür; hastalıkları pulmoner enfeksiyon, servikal adenit ve dissemine hastalıktır.\nYanlış şıklar:\n- **Avustralya kıtası** → isimle ilgisi yoktur.\n- **Altın rengi koloniler** → isimle ilgili değildir.\n- **Bir ilaç adı** → M. avium'un tedavisinde etambutol ve rifabutin kullanılır; isim ilaçtan gelmez.\n- **Keşfeden bilim insanının adı** → bu, **Nocardia** için geçerlidir (Fransız veteriner Edmond Nocard'a ithaf edilmiştir); Listeria da Lord Joseph Lister'e ithaf edilmiştir.\n💡 **Ezber ipucu:** \"Avium = avis = kuş\"; \"Nocardia = Edmond Nocard\".", "org": ["avium", "nocardia"], "shuf": true}, {"q": "Balgam mikroskopisinde kısmi aside dirençli boyanan, uzun dallanan filamentler görülüyor. En olası etken hangisidir?", "opts": [{"t": "Nocardia"}, {"t": "B. anthracis"}, {"t": "Listeria"}, {"t": "M. leprae"}, {"t": "M. tuberculosis"}], "a": 0, "exp": "**Doğru cevap: Nocardia.**\nSlayta göre Nocardia **kısmi aside dirençlidir (kısmi ARB)** ve **uzun dallanan filamentler** oluşturur. Balgamda böyle bir görüntü, özellikle immün yetmezliği olan bir hastada **bronkopulmoner Nocardia enfeksiyonunu** düşündürür (inhalasyonla bulaşır; pnömoni sonra beyin ve deride apselere dönüşebilir). Mikrop sınıflandırması slaytında da bakteriler \"kısmi veya tam aside dirençli boyananlar\" diye ayrılır.\nYanlış şıklar:\n- **B. anthracis** → aside dirençli değildir; spor oluşturan Gram pozitif basildir.\n- **Listeria** → aside dirençli değildir; spor oluşturmayan aerobik Gram pozitif basildir.\n- **M. leprae** → aside dirençlidir ama dallanan filament yapmaz; deri/sinir hastalığı (cüzzam) yapar ve kültürde üretilememiştir.\n- **M. tuberculosis** → aside dirençlidir ama slayta göre **kümeler halinde** bulunur; dallanan filament oluşturmaz.\n💡 **Ezber ipucu:** \"**Kısmi** ARB + **dallanan filament** = Nocardia\".", "org": ["nocardia"], "shuf": true}, {"q": "VAKA: Böbrek nakli olmuş, immünosupresif ilaç kullanan bir hastada pnömoni gelişiyor; ardından beyinde apse saptanıyor. Organik topraklarda bulunan bu etken en olası hangisidir?", "opts": [{"t": "Bordetella pertussis"}, {"t": "N. gonorrhoeae"}, {"t": "M. leprae"}, {"t": "Nocardia"}, {"t": "S. pyogenes"}], "a": 3, "exp": "**Doğru cevap: Nocardia.**\nVakadaki ipuçları slayttaki Nocardia bilgileriyle birebir örtüşür:\n- **Böbrek nakli + immünosupresif ilaç** → slayta göre Nocardia **HIV'li, kanserli, transplantlı** ve diğer immün yetmezlik hastalarında fırsatçı enfeksiyon yapar.\n- **Pnömoni sonrası beyin apsesi** → slayta göre **pnömoni olarak başlayan enfeksiyon beyinde ve deride apselere dönüşür**.\n- **Organik topraklarda bulunur** → Nocardia eksojendir; inhalasyon ve kutanöz travma ile bulaşır.\nTedavide immün yetmezliği olanlarda **SXT + amikasin**, SSS tutulumunda **SXT, imipenem veya sefalosporin** kullanılır; tedavi **12 ay** sürer.\nYanlış şıklar:\n- **Bordetella pertussis** → boğmaca etkenidir.\n- **N. gonorrhoeae** → gonore ve septik artrit etkenidir; topraktan bulaşmaz.\n- **M. leprae** → cüzzam etkenidir; pnömoni → beyin apsesi tablosu yapmaz.\n- **S. pyogenes** → farenjit, impetigo, erizipel gibi tablolar yapar; topraktaki fırsatçı bir patojen değildir.\n💡 **Ezber ipucu:** \"Transplant/İY + akciğer + beyin apsesi + toprak\" = Nocardia.", "org": ["nocardia"], "shuf": true}, {"q": "Aside dirençli bakterilerin eşleştirmesinden hangisi doğrudur?", "opts": [{"t": "Rhodococcus – primer invaziv pulmoner hastalık; Gordonia/Tsukamurella – pulmoner ve İV kateter enfeksiyonları"}, {"t": "Rhodococcus – cüzzam; Gordonia – şarbon"}, {"t": "Tsukamurella – difteri; Rhodococcus – boğmaca"}, {"t": "Gordonia – tüberküloz; Tsukamurella – lepra"}, {"t": "Rhodococcus – miçetom; Gordonia – servikal adenit"}], "a": 0, "exp": "**Doğru cevap: Rhodococcus – primer invaziv pulmoner hastalık; Gordonia/Tsukamurella – pulmoner ve İV kateter enfeksiyonları.**\nSlayta göre **Rhodococcus immün yetmezliği olan kişilerde patojendir ve primer invaziv pulmoner hastalık** oluşturur; **Gordonia ve Tsukamurella fırsatçı olup pulmoner enfeksiyon ve İV kateter enfeksiyonlarına** neden olur. Bu üçü de mikolik asit içeren aside dirençli bakterilerdir.\nYanlış eşleştirmeler:\n- **Cüzzam** → M. leprae; **şarbon** → B. anthracis.\n- **Difteri** → C. diphtheriae; **boğmaca** → B. pertussis.\n- **Tüberküloz** → M. tuberculosis; **lepra** → M. leprae.\n- **Miçetom** → Nocardia; **servikal adenit** → M. avium.\n💡 **Ezber ipucu:** \"Rhodococcus = primer invaziv akciğer; Gordonia/Tsukamurella = akciğer + kateter\".", "org": ["rhodococcus"], "shuf": true}, {"q": "Slaytlarda \"deri testi pozitiftir\" bilgisi hangi iki hastalık için verilmiştir?", "opts": [{"t": "Şarbon ve tularemi"}, {"t": "Gonore ve bruselloz"}, {"t": "Tüberküloz ve lepra"}, {"t": "Listerioz ve nokardiyoz"}, {"t": "Difteri ve boğmaca"}], "a": 2, "exp": "**Doğru cevap: Tüberküloz ve lepra.**\nSlaytta \"**deri testi +'dir**\" bilgisi iki yerde geçer: **M. tuberculosis** (kümeler halinde, yavaş üreyen, 2–6 hafta inkübasyon gerektiren bakteri) ve **M. leprae** (kültürde üretilememiş, cüzzam etkeni). Her ikisi de hücre içi yaşayan ve hücresel bağışıklıkla kontrol edilen mikobakterilerdir; deri testi bu hücresel yanıtı yansıtır.\nYanlış şıklar — slaytta bu hastalıklar için deri testinden söz edilmez:\n- **Şarbon ve tularemi** → B. anthracis ve Francisella.\n- **Gonore ve bruselloz** → N. gonorrhoeae ve Brucella.\n- **Listerioz ve nokardiyoz** → Listeria ve Nocardia.\n- **Difteri ve boğmaca** → C. diphtheriae ve B. pertussis.\n💡 **Ezber ipucu:** \"Deri testi (+)\" slaytta yalnız **iki mikobakteri** için: TB ve lepra.", "org": ["tbc", "leprae"], "shuf": true}, {"q": "Hücre duvarındaki mikolik asitler aside dirençli bakterilere hangi özelliği kazandırır?", "opts": [{"t": "Hareket yeteneği"}, {"t": "Spor oluşturma"}, {"t": "Asitle boyanmaya direnç"}, {"t": "Endotoksin üretimi"}, {"t": "Gram negatif boyanma"}], "a": 2, "exp": "**Doğru cevap: Asitle boyanmaya direnç.**\nSlayta göre aside dirençli bakteriler (Mycobacterium, Nocardia, Rhodococcus, Gordonia, Tsukamurella) **hücre duvarındaki mikolik asitler** sayesinde **asitle boyanmaya direnç** gösterirler. Bu grup ayrıca **yavaş ürer**, **sert çevre şartlarına, dezenfektanlara ve antibiyotiklere dirençlidir**; mikolik asit sentezini inhibe eden **izoniazid** bu yüzden mikobakterilere etkilidir.\nYanlış şıklar:\n- **Hareket yeteneği** → bu bakteriler **hareketsizdir**.\n- **Spor oluşturma** → **sporsuzdurlar** (sporlu olanlar Bacillus gibi Gram pozitif basillerdir).\n- **Endotoksin üretimi** → endotoksin (lipid A/LPS) Gram negatiflerin özelliğidir.\n- **Gram negatif boyanma** → aside dirençliler Gram pozitif basillerdir.\n💡 **Ezber ipucu:** Mikolik asit → \"aside direnç\"; izoniazid → \"mikolik asit sentezini durdurur\".", "org": ["tbc", "leprae", "avium", "nocardia", "rhodococcus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdakilerden hangisi tüberküloid lepranın özelliğidir?", "opts": [{"t": "Bol miktarda aside dirençli basil ve yaygın nekroz görülür"}, {"t": "Yüksek bulaşıcıdır"}, {"t": "Tedavisi 18 ay sürer"}, {"t": "Hücresel bağışıklık ile sitokin üretimi artar ve makrofajlar basilleri temizler"}, {"t": "Kültürde 2–6 haftada ürer"}], "a": 3, "exp": "**Doğru cevap: Hücresel bağışıklık ile sitokin üretimi artar ve makrofajlar basilleri temizler.**\nSlayta göre **hücresel bağışıklık ile sitokin üretimi artarak makrofajlar basilleri temizler ve tüberküloid lepra** olur. Basil yükü az olduğundan tedavi de daha kısadır: rifampisin, dapson ve klofazimin ile **6 ay**.\nYanlış şıklar:\n- **Bol aside dirençli basil ve yaygın nekroz** → **lepromatöz lepranın** tanımıdır.\n- **Yüksek bulaşıcıdır** → slayta göre **lepromatöz form** yüksek bulaşıcıdır.\n- **Tedavisi 18 ay sürer** → 18 ay **lepromatöz** lepranın tedavi süresidir; tüberküloidde 6 aydır.\n- **Kültürde 2–6 haftada ürer** → bu **M. tuberculosis**'e aittir; M. leprae **kültürde üretilememiştir**.\n💡 **Ezber ipucu:** Tüberküloid = \"iyi hücresel yanıt, az basil, 6 ay\"; Lepromatöz = \"bol basil, nekroz, çok bulaşıcı, 18 ay\".", "org": ["leprae"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Mycobacterium leprae ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "Kültürde üretilememiştir"}, {"t": "Deri testi pozitiftir"}, {"t": "Klinik belirtilerin ortaya çıkması yıllar sürer"}, {"t": "Lepromatöz form yüksek bulaşıcıdır"}, {"t": "Kültürde 2–6 haftalık inkübasyonla üretilir"}], "a": 4, "exp": "**Doğru cevap: Kültürde 2–6 haftalık inkübasyonla üretilir.**\nSlayta göre **M. leprae kültürde üretilememiştir**; \"2–6 hafta inkübasyon gerekir\" bilgisi **M. tuberculosis**'e aittir. Bu yüzden bu şık M. leprae için yanlıştır.\nDoğru olan (slayttaki) M. leprae bilgileri:\n- **Kültürde üretilememiştir**; cüzzam etkenidir; tüberküloid veya lepromatöz lepra yapar.\n- **Deri testi pozitiftir** (tüberkülozda olduğu gibi).\n- Yavaş üremesi nedeniyle **klinik belirtilerin ortaya çıkması yıllar sürer**.\n- **Lepromatöz form yüksek bulaşıcıdır**; karantina ve tedavi önemlidir.\n- Yara eksüdaları, deri/solunum salgıları ve aerosollerle vücuda girer.\n💡 **Ezber ipucu:** M. leprae'yi kültürle değil klinik + aside dirençli basil + deri testiyle düşün; \"kültür yok\" en sık sorulan özelliktir.", "org": ["leprae", "tbc"], "shuf": true, "tag": "Pekiştirme", "html": true}, {"q": "Mycobacterium avium ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "Tüberkülozun az olduğu ülkelerde görülür"}, {"t": "Akciğer hastalığı olanlarda yavaş, immün yetmezliği olanlarda hızlı ilerler"}, {"t": "Kültürde çevresel kontaminasyonlar görülebilir"}, {"t": "Kronik pulmoner hastalığı olan yaşlılarda çok sayıda balgam örneği incelenmelidir"}, {"t": "Kişiden kişiye aerosolle bulaşır ve insan tek rezervuardır"}], "a": 4, "exp": "**Doğru cevap: Kişiden kişiye aerosolle bulaşır ve insan tek rezervuardır.**\nBu ifade slaytta **M. tuberculosis** için geçer. **M. avium** ise **kontamine su ve besinle** bulaşır; adını tüberküloz benzeri hastalığı olan kuşlardan (avis) alır.\nDoğru olan (slayttaki) M. avium bilgileri:\n- **Tüberkülozun az olduğu ülkelerde** görülür.\n- **Akciğer hastalığı olanlarda yavaş, immün yetmezliği olanlarda hızlı** ilerler; AIDS hastalarında en sık fırsatçı enfeksiyondur.\n- **Kültürde çevresel kontaminasyonlar** görülebilir.\n- Özellikle **kronik pulmoner hastalığı olan yaşlılarda çok sayıda balgam örneği** incelenmelidir.\n- Kronik akciğer hastalığı ve immün yetmezlik risk oluşturur; tedavide etambutol + rifabutin, idamede klaritromisin/azitromisin.\n💡 **Ezber ipucu:** Avium \"su/besin – AIDS – kontaminasyon – çok balgam\"; TB \"insan – aerosol\".", "org": ["avium", "tbc"], "shuf": true, "html": true}, {"q": "Mikolik asit sentezini inhibe ederek mikobakterilere etkili olan ilaç hangisidir?", "opts": [{"t": "Etambutol"}, {"t": "İzoniazid"}, {"t": "Rifampin"}, {"t": "Dapson"}, {"t": "Klofazimin"}], "a": 1, "exp": "**Doğru cevap: İzoniazid.**\nSlayttaki antibakteriyel ilaç tablosunda, hücre duvarı hasarı yapan ilaçlar arasında **\"mikolik asit sentezini inhibe eder: izoniazid, etiyonamid — mikobakterilere etkili\"** bilgisi yer alır. Mikolik asit aside dirençliliği sağlayan duvar bileşeni olduğu için izoniazid doğrudan bu hedefi vurur; tüberküloz tedavisinde (rifampisin ve etambutolle) ve profilaksisinde (3 ay, rifapentinle) kullanılır. (İzoniazid, periferik nöropatiyi önlemek için B6 vitamini — piridoksin — ile birlikte verilir.)\nYanlış şıklar:\n- **Etambutol** → **arabinogalaktan** sentezini inhibe eder.\n- **Rifampin** → **DNA'ya bağımlı RNA polimeraza** bağlanarak transkripsiyonu önler.\n- **Dapson** → **dihidropteroat sentazı** inhibe eden antimetabolittir; lepra tedavisinde kullanılır.\n- **Klofazimin** → slaytta lepra tedavisinde (rifampisin ve dapsonla) sayılır; mikolik asit sentezi inhibitörü olarak geçmez.\n💡 **Ezber ipucu:** \"**İ**zoniazid → m**İ**kolik asit\"; \"**E**tambutol → arabinogalaktan\"; \"**R**ifampin → **R**NA polimeraz\".", "org": ["tbc"], "shuf": true}, {"q": "Mikobakterilerde kullanılan ilaçlar ile etki mekanizmaları eşleştirmesinden hangisi **yanlıştır**?", "opts": [{"t": "İzoniazid – mikolik asit sentezini inhibe eder"}, {"t": "Etambutol – arabinogalaktan sentezini inhibe eder"}, {"t": "Rifampin – DNA'ya bağımlı RNA polimeraza bağlanarak transkripsiyonu önler"}, {"t": "Dapson – dihidropteroat sentazı inhibe eder"}, {"t": "Etambutol – 30S ribozoma bağlanarak protein sentezini engeller"}], "a": 4, "exp": "**Doğru cevap: Etambutol – 30S ribozoma bağlanarak protein sentezini engeller.**\nSlayttaki tabloya göre **etambutol arabinogalaktan sentezini inhibe eder** (hücre duvarı hasarı). 30S ribozoma bağlanarak protein sentezini bozan ilaçlar **aminoglikozidler** (ör. amikasin, streptomisin) ve **tetrasiklinler**dir; bu nedenle bu eşleştirme yanlıştır.\nDoğru eşleştirmeler (slayttaki):\n- **İzoniazid** → mikolik asit sentezini inhibe eder (etiyonamid de).\n- **Etambutol** → arabinogalaktan sentezini inhibe eder (bilinen yan etkisi göz toksisitesi, yani optik nörittir).\n- **Rifampin** (ve rifabutin) → DNA'ya bağımlı RNA polimeraza bağlanarak transkripsiyonu önler; mikobakteriler ve aerop Gram pozitiflere etkilidir.\n- **Dapson** → dihidropteroat sentazı inhibe eder; mikobakterilere etkilidir.\nKlinik bağ: TB → rifampisin + etambutol + izoniazid; M. avium → etambutol + rifabutin; lepra → rifampisin + dapson + klofazimin; Nocardia (İY) → SXT + **amikasin** (30S'e etkili aminoglikozid).\n💡 **Ezber ipucu:** Etambutol duvarı (arabinogalaktan) bozar, ribozoma dokunmaz.", "org": ["tbc", "leprae", "avium"], "shuf": true, "html": true}, {"q": "İmmün yetmezliği olan bir nokardiyoz hastasında slayta göre hangi tedavi kullanılır?", "opts": [{"t": "SXT ve amikasin"}, {"t": "İzoniazid ve rifapentin"}, {"t": "Etambutol ve rifabutin"}, {"t": "Rifampisin, dapson ve klofazimin"}, {"t": "Penisilin ve ampisilin"}], "a": 0, "exp": "**Doğru cevap: SXT ve amikasin.**\nSlayta göre Nocardia tedavisi hastanın durumuna göre değişir:\n- İmmün sistemi sağlam kişide **kutanöz** enfeksiyon → **SXT (trimetoprim-sülfametoksazol)**,\n- **İmmün yetmezliği olan (İMY) kişide → SXT + amikasin**,\n- **SSS tutulumunda** → SXT, imipenem veya sefalosporin.\nTedavi **12 ay** sürer; yara bakımı önemlidir.\nYanlış şıklar — her biri başka bir aside dirençlinin rejimidir:\n- **İzoniazid + rifapentin** → **tüberküloz profilaksisi** (3 ay).\n- **Etambutol + rifabutin** → **M. avium** tedavisi.\n- **Rifampisin, dapson, klofazimin** → **lepra** tedavisi.\n- **Penisilin + ampisilin** → **Listeria** tedavisi.\n💡 **Ezber ipucu:** Nocardia'da her durumda **SXT** var; İY'de **+amikasin**, SSS'de **imipenem/sefalosporin** seçeneği.", "org": ["nocardia"], "shuf": true}, {"q": "Klinik sendromlar tablosunda \"granülomatöz\" enfeksiyonların genel etkenleri arasında sayılan aside dirençli bakteriler hangileridir?", "opts": [{"t": "Mycobacterium tuberculosis ve Nocardia"}, {"t": "Rhodococcus ve Gordonia"}, {"t": "Mycobacterium avium ve Tsukamurella"}, {"t": "Mycobacterium leprae ve Rhodococcus"}, {"t": "Gordonia ve Tsukamurella"}], "a": 0, "exp": "**Doğru cevap: Mycobacterium tuberculosis ve Nocardia.**\nSlayttaki \"Sık rastlanan bakteriler ve ilişkili klinik sendromlar\" tablosunda **granülomatöz enfeksiyonların genel etkenleri: Mycobacterium tuberculosis, Nocardia türleri ve T. pallidum** olarak verilmiştir. Bu bağlantı patogenezle uyumludur: M. tuberculosis'te fagozom-lizozom birleşmesi engellenir, makrofaj aktivasyonu sonrası **nekrotik hücrelerden granülom** oluşur; slayta göre Mycobacterium ve Nocardia **eksojen** bakterilerdir.\nYanlış şıklar:\n- **Rhodococcus ve Gordonia** → Rhodococcus primer invaziv pulmoner hastalık, Gordonia pulmoner/İV kateter enfeksiyonu yapar; tabloda granülomatöz etken olarak geçmez.\n- **M. avium ve Tsukamurella** → M. avium pulmoner, servikal adenit, dissemine hastalık; Tsukamurella pulmoner/kateter enfeksiyonu yapar; tabloda yoktur.\n- **M. leprae ve Rhodococcus** → tabloda granülomatöz etken olarak sayılmazlar.\n- **Gordonia ve Tsukamurella** → fırsatçı pulmoner ve İV kateter enfeksiyonu etkenleridir.\n💡 **Ezber ipucu:** Tablodaki granülomatöz üçlü: \"**TB – Nocardia – T. pallidum**\".", "org": ["tbc", "nocardia"], "shuf": true}, {"q": "Kaviter pnömonisi ve beyin apsesi olan immünsüpresif bir hastadan alınan örneklerin laboratuvar incelemesinde Gram pozitif dallanan basiller ve kısmen aside dirençli boyanan basiller saptanmıştır. En olası etken aşağıdakilerden hangisidir?", "opts": [{"t": "Actinomyces israelii"}, {"t": "Aspergillus fumigatus"}, {"t": "Nocardia asteroides"}, {"t": "Mycobacterium tuberculosis"}, {"t": "Fusobacterium nucleatum"}], "a": 2, "exp": "📖 Kitap:\nGram pozitif filamentöz (dallanan) basil + kısmen ARB (+) basil + immünsüpresif hasta + kaviter pnömoni + beyin apsesi → **Nocardia**. Kitabın hızlı tekrarına göre Nocardia **zorunlu aerob ve katalaz pozitiftir**; aynı görünümdeki Actinomyces ise **zorunlu anaerob ve katalaz negatiftir** ve ARB ile boyanmaz. İmmünsüpresif hastada kaviter pnömoni + beyin apsesi tablosunun klasik etkeni **N. asteroides**'tir.\n📑 Slaytta:\n- Nocardia **kısmi aside dirençlidir (kısmi ARB)** ve **uzun dallanan filamentler** oluşturur.\n- **Pnömoni olarak başlayan enfeksiyon beyinde ve deride apselere dönüşür.**\n- Organik topraklarda bulunur; HIV'li, kanserli, transplantlı ve diğer **immün yetmezlik** hastalarında fırsatçı enfeksiyon yapar.\nYanlış şıklar:\n- **M. tuberculosis** → aside dirençlidir ama **tam** ARB'dir, **kümeler halinde** bulunur, dallanan filament yapmaz.\n- **Fusobacterium nucleatum** → slayttaki tabloda beyin apsesi etkenleri arasında (S. aureus, Fusobacterium, anaeroplar) geçer ama aside dirençli değildir, dallanan filament yapmaz.\n- **Actinomyces israelii** ve **Aspergillus fumigatus** (bir küf mantarı) → slaytlardaki aside dirençli bakteriler listesinde yer almaz; ARB boyamada pozitif değildir.\n💡 **Ezber ipucu:** \"İY hasta + akciğer + beyin apsesi + **kısmi ARB dallanan basil** = Nocardia\".", "org": ["nocardia", "tbc"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Sistemik lupus eritematozus tanısı alan ve tedavisinde 3 aydan uzun süre günde 40 mg prednizolon kullanan bir hastada deride çok sayıda eritematöz nodül, akciğerlerde nodüler konsolidasyon ve beyin apsesi saptanıyor. Bu hastadaki bulgulardan sorumlu etken en büyük olasılıkla aşağıdakilerden hangisidir?", "opts": [{"t": "Nocardia spp."}, {"t": "Streptococcus pneumoniae"}, {"t": "Escherichia coli"}, {"t": "Pseudomonas spp."}, {"t": "Viridans streptokoklar"}], "a": 0, "exp": "📖 Kitap:\nUzun süreli yüksek doz steroid kullanan **immünsüpresif** hasta + akciğer tutulumu (kaviter/nodüler pnömoni) + **beyin apsesi** (+ deri lezyonları); kültürde ARB (+) ve Gram pozitif dallanan basiller görülmesi beklenir → **Nocardia** (en sık N. asteroides). Kitapta Nocardia tedavisinde **sülfonamidler** tercih edilir.\n📑 Slaytta:\n- Nocardia **immün yetmezlik durumunda** fırsatçı enfeksiyon yapar (HIV, kanser, transplantasyon ve diğer immün yetmezlikler; steroid tedavisi de bağışıklığı baskılar).\n- **Pnömoni olarak başlayan enfeksiyon beyinde ve deride apselere dönüşür.**\n- Hastalıkları: bronkopulmoner hastalık, miçetom, lenfokutanöz hastalık, selülit, **subkutan apseler**, **beyin apsesi**. Bu vakada üç sistem birlikte tutulmuştur.\n- Tedavi: İY kişilerde **SXT + amikasin**; SSS'de **SXT, imipenem veya sefalosporin**; 12 ay.\nYanlış şıklar (slayttaki klinik sendrom tablosuna göre):\n- **S. pneumoniae** → pnömoni, menenjit, otitis media etkenidir; deri nodülü + beyin apsesi + akciğer üçlüsü yapmaz.\n- **E. coli** → idrar yolu enfeksiyonu, peritonit, menenjit (yenidoğan), sepsis etkenidir.\n- **Pseudomonas** → pnömoni, eksternal otit, yanık enfeksiyonu etkenidir; aside dirençli değildir.\n- **Viridans streptokoklar** → **endokardit** etkenidir.\n💡 **Ezber ipucu:** \"Steroid/transplant + akciğer + deri + beyin = Nocardia\".", "org": ["nocardia"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Nocardia enfeksiyonlarında en çok tercih edilen ilaç aşağıdakilerden hangisidir?", "opts": [{"t": "Trimetoprim-sülfametoksazol"}, {"t": "Tinidazol"}, {"t": "Albendazol"}, {"t": "Metronidazol"}, {"t": "Klindamisin"}], "a": 0, "exp": "📖 Kitap:\n\"SNAP\" formülünü unutmuyoruz: **S**ülfonamidler → **N**ocardia; **A**ctinomyces → **P**enisilin. Yani Nocardia'da sülfonamid (trimetoprim-sülfametoksazol), Actinomyces'te penisilin tercih edilir.\n📑 Slaytta:\n- Nocardia tedavisinin temeli **trimetoprim-sülfametoksazoldür (SXT)**: immün sistemi sağlam kişide kutanöz enfeksiyonda **SXT**, immün yetmezlikte **SXT + amikasin**, SSS tutulumunda **SXT, imipenem veya sefalosporin**. Tedavi **12 ay** sürer; yara bakımı önemlidir.\n- Etki mekanizması (antibiyotik tablosu): sülfonamidler **dihidropteroat sentazı**, trimetoprim folik asit yolunun sonraki basamağını inhibe ederek **folik asit sentezini bozar**.\nYanlış şıklar:\n- **Metronidazol** → slayta göre bakteri DNA'sını parçalar; **anaeroplara** etkili, aerop ve fakültatif anaeroplara etkisizdir (Nocardia aerop bir bakteridir).\n- **Klindamisin** → aerobik Gram pozitif koklar ve anaeroplara etkili linkozamiddir; slaytta Nocardia tedavisinde yer almaz.\n- **Tinidazol** ve **albendazol** → slayttaki antibakteriyel ilaç tablosunda ve Nocardia tedavisinde yer almaz (albendazol bir antiparaziter ilaçtır).\n💡 **Ezber ipucu:** Nocardia = \"**SXT**, 12 ay\".", "org": ["nocardia"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Yüzünde ve vücudunda çok sayıda nodüler lezyon bulunan bir hastanın burun mukozasından ve deri lezyonlarından alınan örnekler Ziehl-Neelsen tekniğiyle boyandığında aside dirençli boyanan basiller görülüyor. Yapılan kültürlerde ise üreme saptanmıyor. Bu hastada etken olarak aşağıdaki Mycobacterium türlerinden hangisi düşünülmelidir?", "opts": [{"t": "Mycobacterium tuberculosis"}, {"t": "Mycobacterium leprae"}, {"t": "Mycobacterium intracellulare"}, {"t": "Mycobacterium avium"}, {"t": "Mycobacterium marinum"}], "a": 1, "exp": "📖 Kitap:\nYüzeyel **deri ve sinir tutulumu** ile seyreden, **ARB (+) basillerin** görüldüğü, **kültürü yapılamayan** bakteri **M. leprae**'dir. M. leprae 37 °C'de iyi yaşayamadığı için daha soğuk olan yüzeyel dokuları (deri, burun, farinks, göz, testis) tutar. M. tuberculosis'in tipik kliniği akciğerde kaviter lezyondur (sekonder tüberküloz). MAC (M. avium–intracellulare) immünsüpresif hastada CD4+ T lenfosit sayısı 50'nin altına indiğinde fırsatçı enfeksiyon yapar. M. marinum fotokromojen bir mikobakteridir ve yüzme havuzu granülomu etkenidir.\n📑 Slaytta:\n- M. leprae **kültürde üretilememiştir**; **cüzzam** etkenidir; tüberküloid veya lepromatöz lepra yapar.\n- **Yara eksüdaları, deri/solunum salgıları ve aerosollerle** vücuda girer (bu yüzden burun mukozası tanı için iyi bir örnektir).\n- Bol aside dirençli basil ve yaygın nekrozla giden form **lepromatöz lepradır** ve **yüksek bulaşıcıdır**.\nYanlış şıklar:\n- **M. tuberculosis** → kültürde **2–6 hafta** inkübasyonla **ürer**; akciğerde tüberkül oluşumuyla karakterizedir.\n- **M. avium** → kültürde ürer (çevresel kontaminasyon görülebilir); pulmoner enfeksiyon, servikal adenit, dissemine hastalık yapar.\n- **M. intracellulare**, **M. marinum** → slaytlarda geçmez; kitaba göre kültürde üretilebilen mikobakterilerdir.\n💡 **Ezber ipucu:** \"Deri lezyonu + ARB (+) + **kültürde üreme yok**\" = M. leprae.", "org": ["leprae", "tbc", "avium"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdaki mikobakteri türlerinden hangisi özellikle AIDS'li hastalarda CD4 T lenfosit sayısı 100/mm³'ün altına indiğinde dissemine enfeksiyona neden olur?", "opts": [{"t": "Mycobacterium ulcerans"}, {"t": "Mycobacterium scrofulaceum"}, {"t": "Mycobacterium fortuitum"}, {"t": "Mycobacterium kansasii"}, {"t": "Mycobacterium avium kompleksi"}], "a": 4, "exp": "📖 Kitap:\n**Mycobacterium avium kompleksi (MAC):**\n- Non-kromojendir (pigment oluşturmaz).\n- AIDS'li hastada CD4+ T lenfosit sayısı (çok) düştüğünde (kitapta özellikle 50/mm³'ün altı vurgulanır) fırsatçı, dissemine enfeksiyona neden olur.\n- Profilakside **klaritromisin** kullanılır.\n- Soliter pulmoner nodüle en sık neden olan mikobakteri türüdür.\n📑 Slaytta:\n- M. avium **AIDS hastalarında en sık rastlanan fırsatçı enfeksiyondur**; immün yetmezliği olanlarda **hızlı** ilerler.\n- Hastalıkları: **pulmoner enfeksiyonlar, servikal adenit ve dissemine hastalık**.\n- Tedavi: **etambutol + rifabutin**; **klaritromisin ve azitromisin idame tedavisinde ve CD4 sayısı düşük kişilerde** kullanılır (kitaptaki profilaksi bilgisiyle uyumlu).\n- Kontamine su ve besinle bulaşır; tüberkülozun az olduğu ülkelerde görülür.\nYanlış şıklar: **M. ulcerans, M. scrofulaceum, M. fortuitum ve M. kansasii** slaytlarda yer almaz; slayta göre AIDS/düşük CD4 ile ilişkilendirilen tek mikobakteri **M. avium**'dur. (Kitaba göre M. kansasii TB benzeri kaviter akciğer hastalığı, M. scrofulaceum kronik servikal lenfadenit, M. fortuitum manikür-pedikür kaynaklı deri enfeksiyonu etkenidir.)\n💡 **Ezber ipucu:** \"AIDS + düşük CD4 + dissemine mikobakteri\" = **M. avium**; tedavide klaritro/azitro.", "org": ["avium"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdaki mikroorganizmalardan hangisi, fagolizozom füzyonunu engelleyerek konak savunmasından kaçabilecek bir mekanizmaya sahiptir?", "opts": [{"t": "Bacillus anthracis"}, {"t": "Staphylococcus aureus"}, {"t": "Mycobacterium tuberculosis"}, {"t": "Streptococcus pneumoniae"}, {"t": "Haemophilus influenzae"}], "a": 2, "exp": "📖 Kitap:\nFagolizozom oluşumunu engelleyen başlıca mikroorganizmalar: **Klamidya, Tüberküloz (M. tuberculosis), Lejyonella**. Bu mekanizma sayesinde bakteri makrofaj içinde yaşamaya ve çoğalmaya devam eder.\n📑 Slaytta:\n- M. tuberculosis patogenezi: solunum yolu → alveol penetrasyonu → makrofaj fagositozu → **fagozom ve lizozom birleşme engeli** → sitokinler, T ve NK hücre gelişi → makrofaj aktivasyonu → nekrotik hücreler (granülom).\n- Aside dirençlilerin genel özelliği olarak da \"**tüberkülozda olduğu gibi bakteri fagositozda fagozom ve lizozomların birleşmesini engeller**\" denir.\n- Bu yüzden M. tuberculosis **hücre içi, persistan** bir patojendir ve hayat boyu enfeksiyon oluşturabilir.\nYanlış şıklar — slayta göre bunlar fagositozdan **kapsülle** korunur:\n- **B. anthracis** → **poli-D-glutamik asit** yapısındaki kapsül fagositozu önler.\n- **S. aureus** → polisakkarit kapsül; ayrıca katalaz, koagülaz ve toksinlerle hastalık yapar (piyojeniktir).\n- **S. pneumoniae** → **fagositoza dirençli polisakkarit kapsül** (100 farklı serotip).\n- **H. influenzae** → **polisakkarit kapsül** ile antifagositik etki (en virülan tip b).\n💡 **Ezber ipucu:** \"Kapsül = yutulmayı engeller; TB = yutulduktan sonra **sindirilmeyi** (fagozom-lizozom birleşmesini) engeller\".", "org": ["tbc", "anthracis", "saureus", "spneumoniae", "haemophilus"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "42 yaşında kadın, derisinde renk değişikliği şikâyetiyle başvuruyor. Fizik muayenesinde duyu kaybı ve üst ekstremitelerde hipopigmentasyon göze çarpıyor. Yapılan sinir biyopsisinde Schwann hücrelerini enfekte eden mikroorganizmalar gözleniyor. Anti-HIV antikorları negatif gelen bu hastadaki klinikten sorumlu mikroorganizmayla ilgili hangisi **doğru değildir**?", "opts": [{"t": "Klinik belirtilerin ortaya çıkması yıllar sürer."}, {"t": "Klinik, hastanın hücresel immünitesine bağlıdır."}, {"t": "İn vitro kültürü yapılamamıştır."}, {"t": "Lepromatöz formu yüksek bulaşıcıdır."}, {"t": "Antikorlar, bahsi geçen bakteriye karşı savunmada çok önemlidir."}], "a": 4, "exp": "📖 Kitap:\nBahsedilen klinik **lepradır**. M. leprae **hücre içi** bir bakteri olduğu için leprada savunmada esas olan **hücresel yanıttır**; antikorlar koruyucu değildir. M. leprae 37 °C'de iyi üreyemediği için iç organları tutmaz; yüzeyel sinir, deri, testis, farinks, göz, burun tutulumu yapar. İki formu vardır: hücresel yanıtı baskılanmamış kişilerde **tüberküloid**, hücresel yanıtı baskılanmış kişilerde **lepromatöz** form görülür. M. leprae'nin in vitro kültürü yapılamamıştır. Makrofaj içinde küme yapmış basiller (Virchow / köpük hücresi) lepromatöz leprada görülür ve kötü prognoz göstergesidir. Lepromin cilt testinin pozitif olması hücresel yanıtın sağlam olduğunu gösterir (tüberküloid formda pozitiftir).\n(Not: Kitaptaki \"iç organ tutulumu göstermez\" ve \"makrofaj içinde küme yapmış basiller kötü prognoz kriteridir\" şıkları slaytta olmadığı için, slayttaki iki doğru bilgiyle değiştirilmiştir.)\n📑 Slaytta:\n- **Hücresel bağışıklık ile sitokin üretimi artarak makrofajlar basilleri temizler ve tüberküloid lepra olur**; bol aside dirençli basil ve yaygın nekrozla **lepromatöz lepra** gelişir → klinik **hücresel immüniteye bağlıdır** (B doğru).\n- **Kültürde üretilememiştir** (C doğru).\n- Yavaş üremesi nedeniyle **klinik belirtilerin ortaya çıkması yıllar sürer** (A doğru).\n- **Lepromatöz form yüksek bulaşıcıdır** (D doğru).\n- Slaytta savunma **hücresel** bağışıklık ve makrofajlar üzerinden anlatılır; **antikorlardan** söz edilmez → E yanlıştır.\n💡 **Ezber ipucu:** Hücre içi bakteri (TB, lepra) → savunma **hücresel**; deri testi (+).", "org": ["leprae"], "shuf": true, "tag": "Feyyaz Akay", "html": true}, {"q": "Mycobacterium tuberculosis kompleksinde bulunan kalın, lipitten zengin ve hidrofobik hücre duvarı yapısı için hangisi **yanlıştır**?", "opts": [{"t": "Birçok dezenfektana ve yaygın kullanılan laboratuvar boyalarına karşı direnç kazandırır."}, {"t": "ARB boyanma özelliği kazandırır."}, {"t": "Yaygın kullanılan antibakteriyel antibiyotiklere direnç özelliği kazandırır."}, {"t": "Kümeleşme (clumping) veya kord faktörü oluşumu gibi karakteristik özelliklerin oluşmasından sorumludur."}, {"t": "Bakteriye hızlı üreme özelliği kazandırır."}], "a": 4, "exp": "📖 Kitap:\nMikobakteriler, sahip oldukları katı, lipitten zengin, hidrofobik hücre duvarları sayesinde:\n- **Dezenfektanlara ve antibiyotiklere direnç** kazanırlar.\n- İçerdikleri **mikolik asit** sayesinde **ARB (+)** boyanırlar.\n- Gram boya ile iyi boyanmazlar.\n- **Geç ve güç ürerler**, çünkü besin molekülleri hücre içine sınırlı düzeyde girebilir.\nBu nedenle \"hızlı üreme özelliği kazandırır\" ifadesi yanlıştır.\n📑 Slaytta:\n- Aside dirençli bakteriler **hücre duvarındaki mikolik asitler** sayesinde asitle boyanmaya direnç gösterir (B doğru).\n- **Yavaş ürerler**; **sert çevre şartlarına, dezenfektanlara ve antibiyotiklere dirençlidirler** (A ve C doğru; E yanlış).\n- M. tuberculosis **kümeler halindedir** (D'deki kümeleşme ile uyumlu); **üremesi yavaştır, 2–6 hafta inkübasyon** gerekir.\n💡 **Ezber ipucu:** Lipitten zengin duvar = \"boya tutar, asitle çıkmaz, ilaç/dezenfektan geçirmez, **yavaş** ürer\".", "org": ["tbc"], "shuf": true, "tag": "Feyyaz Akay", "html": true}, {"q": "Aşağıdaki menenjit etkeni bakterilerden hangisi \"yavaş üreme özelliği\" nedeniyle in vitro ortamlarda (besiyerlerinde) haftalar gibi uzun sürede üreyebilen bakteridir?", "opts": [{"t": "Neisseria meningitidis"}, {"t": "Streptococcus pneumoniae"}, {"t": "Haemophilus influenzae"}, {"t": "Mycobacterium tuberculosis"}, {"t": "Listeria monocytogenes"}], "a": 3, "exp": "📖 Kitap:\nM. tuberculosis katı, \"margarin\" kıvamındaki (lipitten zengin) hücre duvarı nedeniyle besin moleküllerinin hücre içine geçişine pek izin vermez. Bu yüzden ikiye bölünme (katlanma) süresi **15–18 saat** gibi çok uzundur ve besiyerinde üremesi **4–6 hafta** kadar sürebilir. (Tüberküloz, ekstrapulmoner tutulum olarak kronik menenjit de yapabilir.)\n📑 Slaytta:\n- M. tuberculosis'in **üremesi yavaştır, 2–6 hafta inkübasyon gerekir** (slayttaki aralık budur; kitapta 4–6 hafta denmektedir — sınav için slayttaki **2–6 hafta**yı esas al).\n- Aside dirençliler genel olarak **yavaş ürer**; tüberkülozun hastalık formları **pulmoner** ve **ekstrapulmoner** tüberkülozdur (menenjit ekstrapulmoner bir formdur).\nYanlış şıklar: slayttaki klinik sendrom tablosunda **menenjit etkenleri** S. agalactiae, E. coli, **H. influenzae, S. pneumoniae, N. meningitidis ve L. monocytogenes**'tir. Bunlar rutin besiyerlerinde (ör. kanlı agar, kan kültürü) **kısa sürede** ürer; haftalar süren inkübasyon gerektirmez. (Örneğin slayta göre H. influenzae kan kültüründe ürer; S. aureus gibi piyojenler kültürde çabuk ürer.)\n💡 **Ezber ipucu:** \"Haftalar süren kültür\" = **M. tuberculosis** (2–6 hafta); \"3–4 gün\" = Nocardia; \"hiç üremez\" = M. leprae.", "org": ["tbc", "meningokok", "spneumoniae", "haemophilus", "listeria"], "shuf": true, "tag": "Feyyaz Akay"}]}];
const VAKA_SET = {"title": "Klinik Vaka ve TUS Tarzı Sorular", "desc": "Slayt ipuçlarıyla vaka soruları, öncüllü (I–IV) ve eşleştirme soruları; her şıkkın neden yanlış olduğu açıklanır", "short": "TUS tarzı", "questions": [{"q": "Fronkül ve karbonkül nedeniyle başvuran hastanın irinli lezyonundan, akut nötrofilik inflamasyon ve irin oluşumuna yol açan (piyojenik), yüksek tuzda çoğalabilen ve koagülaz üreten bir Gram (+) kok izole ediliyor. Etken için en doğru ifade hangisidir?", "opts": [{"t": "Aşısı yoktur; MRSA suşları β-laktam grubu antibiyotiklere de dirençlidir"}, {"t": "Hiyalüronik asit kapsülü vardır ve romatizmal ateşe yol açar"}, {"t": "Polivalan aşısı vardır; IgA proteaz ile mukozal IgA'yı etkisizleştirir"}, {"t": "Geniş spektrumlu sefalosporin tedavisi sırasında GİS'ten kaynaklanan nozokomiyal enfeksiyon yapar"}, {"t": "Kapsülü poli-D-glutamik asit yapısındadır"}], "a": 0, "exp": "Piyojenik (akut nötrofilik inflamasyon ve irin yapan), yüksek tuzda çoğalabilen, koagülaz üreten Gram (+) kok ve fronkül-karbonkül etkeni **Staphylococcus aureus**'tur. Klinik sendromlar tablosunda fronkül ve karbonkülün etkeni yalnızca S. aureus olarak geçer.\nSlayta göre S. aureus kültürde çabuk ürer; metisiline duyarlı (**MSSA**) ve dirençli (**MRSA**) suşların ayrımı kolayca yapılır ve **MRSA suşları β-laktam grubu antibiyotiklere de dirençlidir**. Katalaz, koagülaz, lipaz, hiyalüronidaz, nükleaz ve sitotoksinlerle hastalık yapar; polisakkarit kapsülü vardır.\nTedavide insizyon-drenaj, tablet olarak trimetoprim-sülfametoksazol, klindamisin, doksisiklin; ağır durumda **IV vankomisin** kullanılır. Korunma el yıkama, maske-eldiven, dezenfektan ve yara pansumanı ile olur; **aşısı yoktur**.\n**Neden diğerleri değil:**\n• Hiyalüronik asit kapsül + romatizmal ateş → S. pyogenes (kapsülü immünojenik değildir; RA süpüratif olmayan otoimmün komplikasyondur).\n• Polivalan aşı + IgA proteaz → S. pneumoniae (IgA proteaz mukustaki bakterinin IgA ile inaktivasyonunu önler).\n• Geniş spektrumlu sefalosporin tedavisi sırasında GİS kaynaklı (endojen) nozokomiyal enfeksiyon → Enterococcus.\n• Poli-D-glutamik asit kapsül → B. anthracis.\n**Akılda kalsın:** Fronkül-karbonkül = S. aureus; S. aureus'un aşısı yok, ağır MRSA'da vankomisin IV.", "org": ["saureus"], "shuf": true}, {"q": "Bakteriyel farenjitin asıl sorumlusu olan etkenle enfekte çocukta farenjitin ardından kızıl gelişiyor. Bu etkenin **toksini** olarak bilinen virülans faktörü hangisidir?", "opts": [{"t": "M proteini"}, {"t": "Streptokokal pirojenik ekzotoksin"}, {"t": "Streptolizin O"}, {"t": "Hiyalüronik asit kapsül"}, {"t": "Toksik şok sendromu toksini"}], "a": 1, "exp": "Bakteriyel farenjitin asıl sorumlusu ve kızılın etkeni **Streptococcus pyogenes**'tir. Slayta göre S. pyogenes'in virülans faktörleri görevlerine göre ayrılır:\n- **Kapsül:** hiyalüronik asitten yapılmıştır, immünojenik değildir.\n- **Fagositozu önleyen:** M, M benzeri ve C5 hücre duvarı proteinleri.\n- **Yapışma ve yayılma:** M ve F proteinleri.\n- **Hidrolitik enzimler:** streptolizin S ve O, streptokinaz, DNazlar.\n- **Toksin:** **streptokokal pirojenik ekzotoksin**.\nHastalıkları süpüratif (farenjit, kızıl, piyoderma, erizipel, selülit, nekrotizan fasiit, streptokokal toksik şok sendromu) ve süpüratif olmayan (romatizmal ateş, akut glomerülonefrit) olarak ikiye ayrılır.\n**Neden diğerleri değil:**\n• M proteini → fagositozu önleyen, yapışma ve yayılmayı sağlayan hücre duvarı proteinidir; toksin değildir.\n• Streptolizin O → slaytta hidrolitik enzimler arasında sayılır.\n• Hiyalüronik asit kapsül → immünojenik olmayan kapsüldür.\n• Toksik şok sendromu toksini → S. aureus'un toksinidir (ısıya ve proteaza dirençli, çoklu organ patolojisi yapar).\n**Akılda kalsın:** S. pyogenes'in toksini = streptokokal pirojenik ekzotoksin; streptolizinler ise enzim grubunda.", "org": ["spyogenes"], "shuf": true, "html": true}, {"q": "Streptokokal farenjit geçiren ve tedavi almayan çocukta haftalar sonra romatizmal ateş gelişiyor. Bu komplikasyonla ilgili en doğru ifade hangisidir?", "opts": [{"t": "Süpüratif bir komplikasyondur"}, {"t": "Farenjit tedavisi ilk 10 gün içinde başlanmazsa romatizmal ateş gelişir"}, {"t": "Etken S. aureus'tur, toksik şok sendromu toksini sorumludur"}, {"t": "Tedavisinde tek etkili antibiyotik kolistindir"}, {"t": "S. agalactiae'nin geç başlangıçlı hastalığıdır"}], "a": 1, "exp": "Romatizmal ateş **S. pyogenes**'in **süpüratif olmayan (otoimmün)** hastalıklarındandır; akut glomerülonefrit de bu gruptadır. Slayta göre **farenjitte tedavi ilk 10 gün içinde başlamazsa romatizmal ateş oluşur**; bu nedenle streptokokal farenjit mutlaka tedavi edilir.\nTedavide penisilin V (alternatif sefalosporin, makrolid) veya amoksisilin tablet; ağır invaziv enfeksiyonda **penisilin + klindamisin IV** kullanılır. Romatizmal ateşe bağlı kalp hastalığı olan kişilerde **diş tedavisinden önce antibiyotik** gerekir.\nS. pyogenes damlacıkla, artropod vektörle ve hasarlı cildin kontaminasyonuyla yayılır; farenjit ve yumuşak doku enfeksiyonları M proteini ile oluşturulur. Risk grubu 2-5 ve 5-15 yaş ile hijyeni zayıf kişilerdir.\n**Neden diğerleri değil:**\n• Süpüratif komplikasyon → yanlış; slayta göre otoimmün hastalıklar süpüratif değildir.\n• S. aureus + toksik şok sendromu toksini → romatizmal ateşle ilgisi yok; TSST S. aureus'un toksinidir.\n• Kolistin → Acinetobacter baumannii'nin tek etkili antibiyotiğidir.\n• S. agalactiae → yenidoğan hastalığı (erken/geç başlangıçlı) yapar; romatizmal ateş yapmaz.\n**Akılda kalsın:** Farenjit → 10 gün içinde tedavi yoksa romatizmal ateş; RA'lı kalp hastasına diş tedavisi öncesi antibiyotik.", "org": ["spyogenes"], "shuf": true}, {"q": "Gebede erken membran rüptürü oluyor ve doğum uzuyor. Bebekte doğumdan kısa süre sonra pnömoni ve sepsis gelişiyor. Annede β-hemolitik streptokok varlığı biliniyor. En olası etken ve korunma yolu hangisidir?", "opts": [{"t": "Listeria – gebenin krem peynirden kaçınması"}, {"t": "S. agalactiae – riskli durumda doğumdan 4 saat önce penisilin"}, {"t": "N. gonorrhoeae – yenidoğana %1'lik gümüş nitrat"}, {"t": "S. pneumoniae – 13 değerli konjuge aşı"}, {"t": "S. aureus – bebeğe vankomisin profilaksisi"}], "a": 1, "exp": "**Streptococcus agalactiae** bir yenidoğan hastalığıdır ve **anneden bebeğe bulaşır**; mortalitesi ve ciddi sekel oluşturma oranı yüksektir. Kapsül ve sialik asit fagositoza karşı korur.\nSlayta göre yenidoğan riskini artıranlar: **erken membran rüptürü, uzamış ya da erken doğum, annede β-streptokok varlığı, annede kompleman ve antikor eksikliği**. Hastalıkları erken ve geç başlangıçlı yenidoğan hastalığı, pnömoni, menenjit, sepsis ve bakteriyemidir; gebede endometrit ve idrar yolu enfeksiyonu yapar.\nTedavi penisilin G (+ aminoglikozid); alerjide sefalosporin / vankomisin. Bebek için risk varsa **doğumdan 4 saat önce penisilin** verilir. **Aşı yoktur.**\n**Neden diğerleri değil:**\n• Listeria – krem peynirden kaçınma → Listeria da yenidoğan hastalığı yapar ve transplasentaldir, ama kontamine gıdalarla bulaşır; öyküdeki membran rüptürü ve annede β-streptokok GBS'yi gösterir.\n• N. gonorrhoeae – %1'lik AgNO3 → oftalmia neonatorum profilaksisidir; pnömoni-sepsis tablosu değildir.\n• S. pneumoniae – 13 değerli konjuge aşı → çocukluk pnömokok aşısıdır; yenidoğan GBS korunması değildir.\n• S. aureus – bebeğe vankomisin → slaytta böyle bir yenidoğan profilaksisi yoktur.\n**Akılda kalsın:** GBS → anneden bebeğe; korunma = doğumdan 4 saat önce penisilin; aşı yok.", "org": ["sagalactiae", "listeria"], "shuf": true}, {"q": "Dalağı alınmış 45 yaşında erkekte kış aylarında fulminan sepsis gelişiyor. Kan kültüründe, viridans streptokoklar içinde en virülan olan, polisakkarit kapsüllü bir Gram (+) kok üremiş. Bu hastada korunma için uygulanması gereken hangisidir?", "opts": [{"t": "23 değerli polivalan pnömokok aşısı"}, {"t": "BCG aşısı"}, {"t": "Toksoid aşı"}, {"t": "Temaslılara rifamisin veya siprofloksasin"}, {"t": "Doğumdan önce penisilin"}], "a": 0, "exp": "Viridans streptokoklar içinde **en virülan** olan, fagositoza dirençli **polisakkarit kapsüllü** (100 farklı serotip) etken **Streptococcus pneumoniae**'dır. Slayta göre **hematolojik hastalık ve aspleni sepsis riskidir**; hastalık **soğuk aylarda** yaygındır ve hastalıkları arasında pnömoni, menenjit, sinüzit, otitis media ve **fulminan sepsis** vardır.\nVirülansında yüzey proteini adezinler (epitele tutunma), fosforilkolin (endotel, trombosit ve lökositlere bağlanma), IgA proteaz ve pnömolizin (epitel ve makrofajları yok eder) rol oynar.\nKorunmada **13 değerli konjuge aşı çocuklara, 23 değerli polivalan aşı erişkinlere** uygulanır. Penisilin dirençli suşta seftriakson + vankomisin; monoterapide sefalosporin veya florokinolon kullanılır.\n**Neden diğerleri değil:**\n• BCG → tüberküloz aşısıdır.\n• Toksoid aşı → difteride (ekzotoksin nötralizasyonu ile birlikte) uygulanır.\n• Temaslılara rifamisin / siprofloksasin → N. meningitidis temaslılarına verilir.\n• Doğumdan önce penisilin → S. agalactiae'nin yenidoğana geçişini önlemek içindir.\n**Akılda kalsın:** Asplenik erişkin + pnömokok → 23 değerli polivalan aşı (çocukta 13 değerli konjuge).", "org": ["spneumoniae"], "shuf": true}, {"q": "Uzun süre geniş spektrumlu sefalosporin alan, hastanede yatan hastada üriner sistem enfeksiyonu gelişiyor. Etkenin GİS'te yerleştiği ve enfeksiyon kaynağının endojen olduğu düşünülen bir Gram (+) kok olduğu bildiriliyor. En olası etken ve uygun tedavi hangisidir?", "opts": [{"t": "Enterococcus – aminoglikozid + ampisilin; dirençte linezolid"}, {"t": "S. pyogenes – penisilin V"}, {"t": "S. aureus – oksasilin"}, {"t": "S. agalactiae – doğumdan önce penisilin"}, {"t": "Acinetobacter – kolistin"}], "a": 0, "exp": "Slayta göre **Enterococcus faecalis / faecium**, **geniş spektrumlu sefalosporin tedavilerinde nozokomiyal enfeksiyonların en yaygın nedenidir**. GİS'e yerleşir, geniş spektrumlu antibiyotik kullanımı ile mukozaya yayılır; **enfeksiyon kaynağı endojendir** ve nozokomiyal hastalarda sık görülür.\nHastalıkları: **üriner sistem enfeksiyonu**, peritonit, bakteriyemi ve endokardit. Antibiyotik direnci tedaviyi zorlaştırır.\nTedavide **aminoglikozid (+ penisilin / ampisilin / vankomisin)** verilir; direnç varsa **linezolid, daptomisin, kinupristin** kullanılır. Antibiyotik enfeksiyona göre ayarlanıp direnç gelişmesinden kaçınılmalıdır.\n**Neden diğerleri değil:**\n• S. pyogenes – penisilin V → farenjit ve deri-yumuşak doku enfeksiyonu etkenidir; nozokomiyal endojen İYE etkeni değildir.\n• S. aureus – oksasilin → S. aureus toplum ve hastane enfeksiyonu yapar ama kişiden kişiye, yüzey/giysi/çarşafla bulaşır; sefalosporin kullanımına bağlı endojen GİS kaynağı Enterococcus'a özgüdür.\n• S. agalactiae – doğumdan önce penisilin → yenidoğan korunmasıdır.\n• Acinetobacter – kolistin → Gram (−) bakteridir; soruda Gram (+) kok var.\n**Akılda kalsın:** Sefalosporin altında gelişen hastane İYE'si + Gram (+) kok = Enterococcus (sefalosporinlere doğal olarak yanıt vermez).", "org": ["enterococcus"], "shuf": true}, {"q": "Romatizmal ateşe bağlı kalp hastalığı olan kişide diş tedavisinden sonra uzun süren ateş ve yeni üfürüm gelişiyor. Kan kültürlerinde kanlı agarda kısmi (α) hemoliz yapan streptokok üremiş. En olası tanı ve etken hangisidir?", "opts": [{"t": "Akut romatizmal ateş – S. pyogenes"}, {"t": "Endokardit – viridans streptokoklar"}, {"t": "Toksik şok sendromu – S. aureus"}, {"t": "Peritonit – Enterococcus"}, {"t": "Septik artrit – Kingella"}], "a": 1, "exp": "Kanlı agarda **α hemoliz kısmi hemoliz** demektir ve kısmi hemoliz yapan streptokoklar **viridans** grubudur (β tam hemoliz, γ hiç hemoliz). Slayttaki klinik sendromlar tablosunda **endokarditin** en yaygın etkenleri viridans streptokoklar, S. aureus, koagülaz-negatif stafilokoklar, HACEK grubu (Eikenella, Kingella dahil) ve Coxiella'dır.\nSlayta göre **romatizmal ateşe bağlı kalp hastalığı olan kişilerde diş tedavisinden önce antibiyotik gerekir**; bu hasta profilaksi almadığı için diş işlemi sonrası ağızdaki viridans streptokoklar bakteriyemi ve endokardit yapmıştır. Uzun süren ateş + yeni üfürüm endokarditi düşündürür.\n**Neden diğerleri değil:**\n• Akut romatizmal ateş – S. pyogenes → RA otoimmün (süpüratif olmayan) bir hastalıktır, kan kültüründe etken üremez; ayrıca S. pyogenes β (tam) hemolitiktir.\n• Toksik şok sendromu – S. aureus → ateş, hipotansiyon ve döküntüyle seyreder; S. aureus streptokok değildir.\n• Peritonit – Enterococcus → klinik tablo (diş işlemi + üfürüm) peritonitle uyumsuz.\n• Septik artrit – Kingella → Kingella subakut endokardit de yapabilir ama Gram (−) bir ağız florası bakterisidir, α-hemolitik streptokok değildir.\n**Akılda kalsın:** α = kısmi hemoliz = viridans; viridans streptokok = endokarditin klasik etkeni.", "shuf": true}, {"q": "Uygun koşullarda saklanmayıp oda sıcaklığında bekletilen yemeği yiyen birkaç kişide kısa sürede kusma başlıyor. Etkenin toprakta yaygın, spor oluşturan ve ısıya dirençli enterotoksini kusmaya yol açan bir Gram (+) basil olduğu düşünülüyor. Besin zehirlenmesinde aynı şekilde düşünülmesi gereken diğer etken hangisidir?", "opts": [{"t": "Listeria monocytogenes"}, {"t": "S. aureus"}, {"t": "Brucella melitensis"}, {"t": "Clostridioides difficile"}, {"t": "Francisella tularensis"}], "a": 1, "exp": "Toprakta yaygın, **spor oluşturan** Gram (+) basil, ısıya dirençli enterotoksini kusmaya yol açan etken **Bacillus cereus**'tur. Slayta göre B. cereus'un ısıya dirençli ve duyarlı suşları vardır: **enterotoksin ısıya dirençli suşta kusmaya, duyarlı suşta ishale** neden olur. Gıdaların saklama koşulları önemlidir; besinler hemen tüketilmeli ya da buzdolabında saklanmalıdır.\nSlayttaki klinik sendromlar tablosunda **besin zehirlenmesi**nin etkenleri **S. aureus ve B. cereus** olarak verilir. S. aureus yüksek tuzda çoğalarak gıda zehirlenmesi yapar; enterotoksini **ısıya ve mide asidine dirençlidir** ve kusma, ishal, mide krampına yol açar. Bu yüzden iki etken de kısa sürede başlayan kusmalı besin zehirlenmesinde akla gelmelidir.\n**Neden diğerleri değil:**\n• Listeria monocytogenes → kontamine gıdalarla bulaşır ama yenidoğan hastalığı, ateşli bakteriyemi, menenjit, grip benzeri tablo ve gastroenterit yapar; slaytta 'besin zehirlenmesi' etkeni olarak geçmez.\n• Brucella melitensis → çiğ süt ürünleriyle bulaşır, dalgalı ateşli kronik tablo (bruselloz) yapar.\n• Clostridioides difficile → antibiyotik ile ilişkili diyare etkenidir.\n• Francisella tularensis → tularemi etkenidir.\n**Akılda kalsın:** Besin zehirlenmesi = S. aureus + B. cereus; ikisinin de kusturan toksini ısıya dirençlidir.", "org": ["cereus", "saureus"], "shuf": true}, {"q": "Askeriyede kalan 19 yaşında genç ani başlayan menenjit tablosuyla getiriliyor. BOS'ta Gram (−) kok görülüyor; etkenin solunum ve aerosollerle bulaştığı biliniyor. Aynı koğuşta kalan askerlere ne yapılmalıdır?", "opts": [{"t": "Rifamisin, siprofloksasin veya seftriakson ile koruma"}, {"t": "Hepsine BCG aşısı yapılması"}, {"t": "Doksisiklin ile tedavi"}, {"t": "%1'lik gümüş nitrat damla"}, {"t": "Hiçbir şey; etken bulaşıcı değildir"}], "a": 0, "exp": "Askeriye ve üniversite gibi toplu yaşam alanlarında görülen, **solunum ve aerosollerle** bulaşan Gram (−) kok menenjiti **Neisseria meningitidis**'tir. Slayta göre meningokok bulaşıcıdır, ağır sepsise dönüşebilir; sadece insanda bulunur, kuru ve soğuk aylarda görülür. İnsidans yaş<5, üniversite, askeriye, bakım evi ve geç kompleman eksikliğinde fazladır.\nHastanın tedavisi **seftriakson, sefotaksim, meropenem** ile yapılır. **Temas halinde rifamisin, siprofloksasin veya seftriakson** uygulanır (temaslı profilaksisi). İlk 6 ayda bebekte bağışıklık vardır; **aşısı vardır**.\nVirülans: pilin tutunmayı sağlar, polisakkarit kapsül fagositozu engeller, hücre duvarındaki lipooligosakkarit endotoksindir.\n**Neden diğerleri değil:**\n• BCG → tüberküloz aşısıdır; meningokok temaslısını korumaz.\n• Doksisiklin → bruselloz tedavisidir (gentamisin / streptomisin eklenebilir).\n• %1'lik gümüş nitrat → yenidoğanda gonokokal oftalmia neonatorum profilaksisidir.\n• 'Bulaşıcı değildir' → yanlış; slayta göre meningokok bulaşıcıdır.\n**Akılda kalsın:** Meningokok temaslısı → rifamisin / siprofloksasin / seftriakson.", "org": ["meningokok"], "shuf": true}, {"q": "Cinsel aktif 22 yaşında kadında septik artrit gelişiyor; eklem sıvısında Gram (−) kok görülüyor. Etkenin tek konağı insandır ve kadınlarda asemptomatik taşıyıcılık yapabilir. Bu etken için doğru ifade hangisidir?", "opts": [{"t": "Polisakkarit kapsülü fagositozu engeller ve aşıyla önlenir"}, {"t": "Aşısı yoktur; tedavide seftriakson ve azitromisin kullanılır"}, {"t": "Sinsi klinik belirtilerle seyreden, kültürü zaman alan ağız florası bakterisidir"}, {"t": "Hayvan ısırığı ve tırmalamasıyla bulaşır"}, {"t": "Kültürde üretilememiştir"}], "a": 1, "exp": "Cinsel yolla bulaşan, **tek konağı insan** olan, **kadınlarda asemptomatik taşıyıcılık** yapan Gram (−) kok **Neisseria gonorrhoeae**'dir. Slayta göre gonokok **septik artritin en sık görülen nedenidir**; klinik sendromlar tablosunda da artrit etkenleri S. aureus ve N. gonorrhoeae'dir. Hastalıkları gonore, dissemine enfeksiyon ve oftalmia neonatorumdur; kısırlığa neden olur.\nTedavide **seftriakson ve azitromisin** kullanılır; yenidoğanda %1'lik AgNO3 profilaksisi yapılır. Korunma kondom ve hasta eğitimi ile sağlanır; **aşısı yoktur**. Beta-laktamaz penisilin direnci sağlar.\nVirülans: pilin tutunma, porin nötrofillerde fagozom füzyonunu önler, opasite proteini tutunma; LPS endotoksin üretir. Kompleman eksikliğinde risk yüksektir.\n**Neden diğerleri değil:**\n• Polisakkarit kapsül + aşı → N. meningitidis'in özelliğidir; gonokokun aşısı yoktur.\n• Sinsi seyir, kültürü zaman alan ağız florası bakterisi → Kingella kingae (o da septik artrit yapar ama cinsel yolla bulaşmaz).\n• Hayvan ısırığı / tırmalamasıyla bulaş → Pasteurella multocida.\n• Kültürde üretilememiş → Mycobacterium leprae.\n**Akılda kalsın:** Cinsel aktif genç + septik artrit + Gram (−) kok = gonokok → seftriakson + azitromisin, aşı yok.", "org": ["gonokok", "kingella"], "shuf": true}, {"q": "Aşı takvimi hiç uygulanmamış 3 yaşında çocukta epiglotit gelişiyor. Kan kültüründe, kapsülünde riboz, ribitol ve fosfat (PRP) bulunan bir Gram (−) kokobasil üremiş. En olası etken ve önleyici aşı hangisidir?", "opts": [{"t": "S. pyogenes – penisilin V"}, {"t": "H. influenzae tip b – konjuge PRP aşısı"}, {"t": "B. pertussis – 5 doz aşı"}, {"t": "C. diphtheriae – BCG aşısı"}, {"t": "M. catarrhalis – 23 değerli polivalan aşı"}], "a": 1, "exp": "Kapsülünde **riboz, ribitol ve fosfat (PRP)** bulunan, epiglotit yapan Gram (−) kokobasil **Haemophilus influenzae tip b (Hib)**'dir. Slayta göre a-f kapsül antijenleri vardır ve **en virülan serotip b'dir**; polisakkarit kapsül antifagositik etki gösterir, hücre duvarındaki lipid A menenjiti indükler.\n**PRP'ye karşı oluşan antikorlar koruyucudur**; bu yüzden hastalık **Hib konjuge PRP aşısı** ile önlenir: çocuklara ilk 6 ayda, sonra 12-15. ayda yapılır. Risk düşük antikor, geç kompleman eksikliği ve splenektomide fazladır.\nHastalıkları menenjit, **epiglotit**, selülit ve artrittir; tedavide sefalosporinler kullanılır. Bu çocukta aşı hiç yapılmadığı için Hib hastalığı beklenen bir tablodur.\n**Neden diğerleri değil:**\n• S. pyogenes – penisilin V → Gram (+) koktur; farenjit etkenidir, PRP kapsülü yoktur.\n• B. pertussis – 5 doz aşı → boğmaca (öksürük nöbetleri, ıslık sesi) yapar; epiglotit değil.\n• C. diphtheriae – BCG → difteri toksoid aşı ile önlenir; BCG tüberküloz aşısıdır.\n• M. catarrhalis – 23 değerli polivalan aşı → 23 değerli aşı erişkin pnömokok aşısıdır; Moraxella'nın aşısı slaytta yoktur.\n**Akılda kalsın:** PRP = Hib kapsülü = aşının hedefi; aşısız çocukta epiglotit/menenjit → Hib.", "org": ["haemophilus"], "shuf": true}, {"q": "3 aylık bebekte soğuk algınlığı belirtilerinin ardından tekrarlayan öksürük nöbetleri ve ıslık sesi gelişiyor. Etkenin öksürüğe yol açan toksininin etkisi hangisidir?", "opts": [{"t": "Protein zinciri uzama faktörü-2'yi (EF-2) inhibe eder"}, {"t": "Gi-alfa (G1alfa) proteinini inhibe eder; mukus artar ve öksürük oluşur"}, {"t": "Makrofajları uyararak TNF ve IL salgılatır"}, {"t": "Cildin soyulmasına neden olur"}, {"t": "Mide asidine dirençli olup gıda zehirlenmesi yapar"}], "a": 1, "exp": "Soğuk algınlığı belirtilerinin ardından **tekrarlayan öksürük nöbetleri ve ıslık sesi** boğmacanın, yani **Bordetella pertussis**'in tablosudur; 1 yaş altında şiddetli seyreder. Slayta göre **pertussis ve adenilat siklaz / hemolizin toksini** orofaringeal epitel ve makrofajlara bağlanır, **G1alfa (Gi-alfa) proteinini inhibe eder; ATP oluşumu bozulur, mukus artar ve öksürük oluşur.** Toksinler fagositozu ve monosit müdahalesini de engeller.\n**Trakeal toksin** epitel hücrelerini öldürür ve IL-1 salgılatarak ateşe neden olur. Bakteri filamentöz hemaglutinin ve pertaktin proteinleriyle trakea epiteline bağlanır; aşılar bu proteinlerden yapılır.\nTedavi makrolid (azitromisin / klaritromisin); aşı 5 doz (2, 4, 6, 15-18. aylar ve 4-6 yaş).\n**Neden diğerleri değil:**\n• EF-2 inhibisyonu → difteri toksini (C. diphtheriae).\n• Makrofajlardan TNF ve IL salgılatma → şarbonun letal toksini (B. anthracis).\n• Cildin soyulması → S. aureus eksfoliyatif toksini (haşlanmış deri sendromu).\n• Mide asidine dirençli, gıda zehirlenmesi yapan toksin → S. aureus enterotoksini.\n**Akılda kalsın:** Pertussis toksini → Gi-alfa inhibisyonu → mukus ve öksürük; ateş → trakeal toksin (IL-1).", "org": ["pertussis"], "shuf": true}, {"q": "Yaşlı bir hastada bronkopnömoni gelişiyor; balgamda bol inflamatuar hücre ve Neisseria ile karıştırılabilen Gram (−) koklar görülüyor. Ampirik olarak başlanan penisiline yanıt alınamıyor. En olası açıklama hangisidir?", "opts": [{"t": "Etken M. catarrhalis'tir; penisiline dirençlidir"}, {"t": "Etken N. gonorrhoeae'dir; porin direnç yapar"}, {"t": "Etken S. pneumoniae'dır; Gram (+) olduğu için yanıt yoktur"}, {"t": "Etken Nocardia'dır; SXT gerekir"}, {"t": "Etken Acinetobacter'dir; yalnız kolistin etkilidir"}], "a": 0, "exp": "Slayta göre **Moraxella catarrhalis** (adını mukus salgısından, 'catarrhus') diğer Gram (−) pnömonilerden **balgamdaki bol inflamatuar hücre** ile ayrılır ve **Neisseria ile karıştırılır**. Fırsatçı patojendir, ağız florasında bulunur; hastalıkları **bronşit, bronkopnömoni, sinüzit ve otit**tir.\nSlayta göre **penisiline dirençlidir**; bu nedenle ampirik penisiline yanıt alınamaması beklenir. Tedavide **sefalosporin, eritromisin, tetrasiklin, trimetoprim-sülfametoksazol** kullanılır. Klinik sendromlar tablosunda da bronşit, sinüzit ve otitis media etkenleri arasında yer alır.\n**Neden diğerleri değil:**\n• N. gonorrhoeae – porin → gonokok cinsel yolla bulaşır, pnömoni etkeni değildir; porin direnç değil, nötrofillerde fagozom füzyonunu önleyen virülans faktörüdür.\n• S. pneumoniae → Gram (+) koktur; soruda Gram (−) kok var.\n• Nocardia – SXT → kısmi aside dirençli, uzun dallanan filament oluşturan bir bakteridir, Gram (−) kok değildir.\n• Acinetobacter – kolistin → hastane kaynaklı, çoklu dirençli Gram (−) bakteridir; Neisseria'yla karışan Gram (−) kok tanımı Moraxella'ya aittir.\n**Akılda kalsın:** Neisseria'ya benzeyen Gram (−) kok + bol inflamatuar hücreli balgam + penisilin direnci = M. catarrhalis.", "org": ["moraxella"], "shuf": true}, {"q": "Kediyi beslerken elinden ısırılan kadında ısırık çevresinde selülit gelişiyor. Antibiyotik seçiminde dikkat edilmesi gereken özellik hangisidir?", "opts": [{"t": "Oksasiline dirençlidir; penisilin veya geniş spektrumlu sefalosporin seçilir"}, {"t": "Penisilin ve sefalosporinler etkisizdir; gentamisin seçilir"}, {"t": "Yalnız kolistin etkilidir"}, {"t": "Tedavi gerekmez"}, {"t": "Ekzotoksin nötralizasyonu yapılmalıdır"}], "a": 0, "exp": "Hayvanların ağız florasında bulunan, **tırmalama ve ısırma** ile insana geçen, selülit yapan etken **Pasteurella multocida**'dır (Louis Pasteur'e ithaf). Slayta göre **kedi ısırmaları daha derine bulaş nedeniyle tehlikelidir**; hastalıkları selülit, lenfadenit, kronik ÜSYE ve sistemik enfeksiyondur.\nAntibiyotik seçiminde önemli nokta: P. multocida **oksasiline dirençlidir**; tedavi **penisilin ve geniş spektrumlu sefalosporin** ile yapılır. Derin ısırıklarda **yara bakımı** önemlidir. (Oksasilin, stafilokoklara etkili penisilinaza dirençli penisilindir; bu yüzden 'deri enfeksiyonu = antistafilokokal ilaç' refleksi burada yanıltır.)\n**Neden diğerleri değil:**\n• Penisilin ve sefalosporin etkisiz, gentamisin seçilir → F. tularensis'in özelliğidir.\n• Yalnız kolistin etkili → çoklu dirençli A. baumannii'nin özelliğidir.\n• Tedavi gerekmez → yanlış; selülit ve sistemik enfeksiyon yapabilir, derin kedi ısırığı tehlikelidir.\n• Ekzotoksin nötralizasyonu → difteri tedavisinin parçasıdır.\n**Akılda kalsın:** Kedi/köpek ısırığı = Pasteurella → penisilin; oksasilin işe yaramaz.", "org": ["pasteurella", "francisella"], "shuf": true}, {"q": "İnsan ısırığı sonrası gelişen yara enfeksiyonunda etkenin insan ağız florasında bulunan fırsatçı bir bakteri olduğu ve enfeksiyonun polimikrobik olduğu düşünülüyor. En uygun antibiyotik hangisidir?", "opts": [{"t": "Amoksisilin-klavulanat"}, {"t": "Kolistin"}, {"t": "Gentamisin"}, {"t": "Rifamisin + dapson"}, {"t": "Metronidazol"}], "a": 0, "exp": "İnsan ısırığı yarası etkeni, **insan ağız florasında** bulunan fırsatçı patojen **Eikenella corrodens**'tir (M. Eiken'e ithaf). Slayta göre ısırık ile ilişkili enfeksiyon yapar ve **tedavisi diğer Gram (−)'lerden farklıdır**. Hastalıkları insan ısırığı yarası, subakut endokardit (HACEK grubu) ve fırsatçı enfeksiyonlardır.\nTedavi enfeksiyonun tipine göre seçilir: **monomikrobik enfeksiyonlar ampisilin**, **polimikrobik enfeksiyonlar amoksisilin-klavulanat**, **endokardit seftriakson** ile tedavi edilir. Soruda polimikrobik yara enfeksiyonu tanımlandığı için doğru seçim amoksisilin-klavulanattır (β-laktamaz inhibitörü içeren kombinasyon).\n**Neden diğerleri değil:**\n• Kolistin → çoklu dirençli A. baumannii'nin tek etkili antibiyotiğidir.\n• Gentamisin → tularemi (F. tularensis) tedavisidir.\n• Rifamisin + dapson → lepra tedavisidir (klofazimin ile birlikte).\n• Metronidazol → yalnız anaeroplara etkilidir; aerop ve fakültatif anaeroplara etkisizdir.\n**Akılda kalsın:** Eikenella: monomikrobik → ampisilin; polimikrobik → amoksisilin-klavulanat; endokardit → seftriakson.", "org": ["eikenella"], "shuf": true}, {"q": "Irak'taki çatışmada yaralanıp solunum cihazına bağlı olarak izlenen askerde pnömoni gelişiyor. İzole edilen Gram (−) bakteri hareketsiz ve neredeyse tüm antibiyotiklere dirençli. Tedavide hangisi seçilir?", "opts": [{"t": "Kolistin"}, {"t": "Penisilin G"}, {"t": "Seftriakson"}, {"t": "Doksisiklin"}, {"t": "Klindamisin"}], "a": 0, "exp": "Adı 'hareketsiz' anlamına gelen **akinetos** sözcüğünden gelen, Irak ve Afganistan'daki çatışmalarda **neredeyse tüm antibiyotiklere direnç geliştiren** Gram (−) bakteri **Acinetobacter baumannii**'dir. Slayta göre pnömoni ve ağır sepsis taşıyan askerler ülkelerinde rezervuar olmuştur.\nHastanelerin iç ve dış ortamlarında ve nemli yüzeylerde (insan derisi) canlı kalır, **florada yoktur**. Risk; geniş spektrumlu antibiyotik kullananlarda, cerrahi yarası olanlarda, **solunum cihazına bağlı olanlarda** ve enfekte kişiyle temasta olanlarda fazladır. Solunum yolu, idrar yolu, yara enfeksiyonları ve sepsis yapar.\nTedavi in vitro teste göre düzenlenir; slayta göre **kolistin tek etkili antibiyotiktir**. Hastane yayılımını önlemek için yara bakımı ve solunum cihazlarının sterilizasyonu önemlidir. (Kolistin dış membran geçirgenliğini bozar; Gram (−)'lere etkili, Gram (+)'lere etkisizdir.)\n**Neden diğerleri değil:**\n• Penisilin G → doğal penisilinlerin Gram (−) basillere etkisi zayıftır; çoklu dirençli suşta işe yaramaz.\n• Seftriakson → bu çoklu dirençli suşa etkisizdir; slayta göre tek etkili ilaç kolistindir.\n• Doksisiklin → bruselloz tedavisidir.\n• Klindamisin → aerobik Gram (+) koklara ve anaeroplara etkilidir.\n**Akılda kalsın:** Asker + ventilatör + hareketsiz çoklu dirençli Gram (−) = A. baumannii → kolistin.", "org": ["acinetobacter"], "shuf": true}, {"q": "Yabani tavşan avlayıp derisini yüzen avcıda ülseroglandüler tularemi gelişiyor. Bu etkenle ilgili doğru ifade hangisidir?", "opts": [{"t": "Gentamisin ile tedavi edilir; penisilin ve sefalosporin etkili değildir"}, {"t": "Oksasiline dirençlidir; penisilin veya geniş spektrumlu sefalosporin seçilir"}, {"t": "Kolistin tek etkili antibiyotiktir"}, {"t": "İnsan tek konaktır; kişiden kişiye aerosolle bulaşır"}, {"t": "Canlı aşısı insanlarda rutin olarak uygulanır"}], "a": 0, "exp": "Tavşan teması (avlama, deri yüzme) + **ülseroglandüler tularemi** = **Francisella tularensis**. Slayta göre biyoterörizm etkenidir; kene ısırığı ve enfekte dokularla bulaşır. **Hücre içi patojendir**, fagositoza dirençlidir; polisakkarit kapsülü antikor aracılı fagositozu önler. Hastalık formları ülseroglandüler, oküloglandüler ve pnömotik tularemidir.\nTedavi **gentamisin** ile yapılır; **penisilin ve sefalosporin etkili değildir**. Korunmada vektörlerden kaçınmak ve **kenenin hemen çıkarılması** gerekir; **canlı aşısı vardır ama insanda kullanılmaz**.\nEpidemiyoloji: **insan rastlantısal konaktır**; yabani memeliler, kan emen artropodlar, evcil hayvanlar, tavşanlar, kediler, keneler ve ısıran sinekler rezervuardır.\n**Neden diğerleri değil:**\n• Oksasiline dirençli, penisilin / sefalosporinle tedavi → P. multocida.\n• Kolistin tek etkili antibiyotik → A. baumannii.\n• İnsan tek konak, kişiden kişiye aerosol → B. pertussis (veya M. tuberculosis) özelliği; Francisella'da insan rastlantısal konaktır.\n• Canlı aşı insanlarda rutin → yanlış; canlı aşı vardır ama insanda kullanılmaz.\n**Akılda kalsın:** Tularemi → gentamisin; penisilin-sefalosporin etkisiz.", "org": ["francisella"], "shuf": true}, {"q": "Köyden getirilen çiğ sütten yapılmış peyniri yiyen 40 yaşında hastada haftalardır süren dalgalı ateş, terleme, kas-eklem ağrısı, yorgunluk ve kilo kaybı var. En olası etken ve tedavi hangisidir?", "opts": [{"t": "Brucella melitensis – doksisiklin (gentamisin / streptomisin eklenebilir)"}, {"t": "Listeria monocytogenes – ampisilin"}, {"t": "M. tuberculosis – BCG aşısı"}, {"t": "F. tularensis – penisilin"}, {"t": "B. cereus – semptomatik tedavi"}], "a": 0, "exp": "Çiğ süt ürünü öyküsü + **dalgalı ateş**, terleme, titreme, kas-eklem ağrısı, yorgunluk ve kilo kaybı = **bruselloz (Malta humması)**. Slayta göre **insanda en sık görülen tür Brucella melitensis**'tir ve rezervuarı **koyun ve keçidir** (B. abortus sığır, B. suis ren geyiği-domuz, B. canis köpek-tilki-çakal).\nBrucella çok küçük, **retiküloendotelyal hücre içi** patojendir; fagositoza ve seruma dirençlidir. Meme, plasenta, epididim ve uterusu enfekte ederek süt, idrar ve doğum ürünlerine geçer; çoklu organ tutulumu yapabilir. Risk çiğ süt/süt ürünü tüketenler, hayvanla temas edenler ve laboratuvar personelinde yüksektir.\nTedavi **doksisiklin**; **gentamisin ve streptomisin de eklenebilir**. Korunma hayvan aşılaması, eradikasyon ve çiğ süt ürünlerinden kaçınmakla olur.\n**Neden diğerleri değil:**\n• Listeria – ampisilin → Listeria da süt ürünleriyle bulaşır ama gebede grip benzeri tablo, yenidoğan hastalığı, bakteriyemi ve menenjit yapar; haftalarca süren dalgalı ateş Brucella'yı düşündürür.\n• M. tuberculosis – BCG → BCG bir aşıdır, tedavi değildir; tüberküloz çiğ sütle ilişkilendirilmez, insan tek rezervuardır.\n• F. tularensis – penisilin → Francisella'da penisilin etkili değildir; bulaş tavşan/kene ile olur.\n• B. cereus – semptomatik tedavi → kısa süreli gastroenterit yapar, haftalarca süren ateş yapmaz.\n**Akılda kalsın:** Çiğ süt/peynir + dalgalı ateş = B. melitensis → doksisiklin (± gentamisin/streptomisin).", "org": ["brucella", "listeria"], "shuf": true}, {"q": "Hasta sığırlarla temas eden çiftçinin önkolunda, ortası siyah renkli ve çevresi ödemli deri lezyonu gelişiyor. Lezyondaki ödemden sorumlu toksinin etkisi hangisidir?", "opts": [{"t": "Adenilat siklaz aktivitesi"}, {"t": "Protein zinciri uzama faktörü-2 (EF-2) inhibisyonu"}, {"t": "Gi-alfa proteininin inhibisyonu"}, {"t": "Makrofajları uyararak TNF ve IL salgılatma"}, {"t": "Cildin soyulması"}], "a": 0, "exp": "Hasta sığırlarla temas + siyah merkezli, çevresi ödemli deri lezyonu = **deri şarbonu (Bacillus anthracis)**; siyah görünümü nedeniyle 'kömür' denmiştir. Slayta göre **sığır konağıdır, insan rastlantısal konaktır**; hayvan aşılamasının az olduğu ülkelerde yaygındır.\nHastalık oluşturması için **kapsül** ve **koruyucu antijen, letal faktör, ödem toksini** gerekir. Kapsül poli-D-glutamik asit yapısındadır ve fagositozu önler. **Adenilat siklaz (ödem toksini) ödeme neden olur**; **letal toksin** makrofajları uyararak TNF ve IL salgılatır. Hastalık formları deri, bağırsak ve akciğer şarbonudur.\nTedavi siprofloksasin + doksisiklin kombinasyonu; doğal yolla oluşmuşsa amoksisilin yeterlidir. Aşı etkilidir ama toksisitesi vardır.\n**Neden diğerleri değil:**\n• EF-2 inhibisyonu → difteri toksini.\n• Gi-alfa proteininin inhibisyonu → pertussis toksini.\n• Makrofajlardan TNF ve IL salgılatma → şarbonun **letal** toksinidir; soru ödemden sorumlu toksini soruyor.\n• Cildin soyulması → S. aureus eksfoliyatif toksini.\n**Akılda kalsın:** Şarbon: ödem toksini = adenilat siklaz; letal toksin = makrofajdan TNF/IL.", "org": ["anthracis"], "shuf": true}, {"q": "28 haftalık gebe; krem peynir ve işlenmiş et ürünleri tükettikten sonra grip benzeri hafif ateşli hastalık geçiriyor. Etkenin hangi özellikleri bu tabloyu ve bebek için riski açıklar?", "opts": [{"t": "Buzdolabında üreyebilmesi ve transplasental geçebilmesi"}, {"t": "Spor oluşturup toprakta yaşaması"}, {"t": "Kültürde üretilememesi"}, {"t": "Isıya dirençli enterotoksini ile kusma yapması"}, {"t": "Yalnız cinsel yolla bulaşması"}], "a": 0, "exp": "Gebe + **krem peynir ve işlenmiş et ürünleri** + grip benzeri hafif ateşli hastalık = **Listeria monocytogenes**. Slayta göre Listeria **buzdolabında ve yüksek tuzda yaşayabilir**, mide asidi ve safraya dirençlidir; işlenmiş etler, çiğ sebzeler, sosis, süt gibi kontamine gıdalarla yayılır. **Transplasentaldir**; bu nedenle bebek için risk oluşturur ve erken / geç başlangıçlı yenidoğan hastalığı yapar.\nHücre içi fakültatiftir; yüzey proteinleri hücre reseptörüne bağlanır, hemolizinler hücrede sağ kalmasını ve çoğalmasını sağlar. Yenidoğan, yaşlı ve hasta kişiler yüksek risklidir.\nTedavide **penisilin ve ampisilin** kullanılır; yüksek riskli kişiler krem peynir, çiğ gıdalar ve yıkanmamış sebzelerden kaçınmalıdır.\n**Neden diğerleri değil:**\n• Spor oluşturup toprakta yaşama → Bacillus türleri; Listeria spor oluşturmayan Gram (+) basildir.\n• Kültürde üretilememe → M. leprae.\n• Isıya dirençli enterotoksinle kusma → B. cereus (ve S. aureus).\n• Yalnız cinsel yolla bulaş → N. gonorrhoeae.\n**Akılda kalsın:** Listeria = soğukta (buzdolabı) ve tuzda üreyen, plasentayı geçen gıda kaynaklı Gram (+) basil.", "org": ["listeria"], "shuf": true}, {"q": "Aşısız çocukta respiratuvar difteri tanısı konuyor. Etken lizojenik β-faj ile A ve B ekzotoksini üretmektedir. Tedavi yaklaşımı hangisidir?", "opts": [{"t": "Ekzotoksin nötralizasyonu + penisilin / eritromisin"}, {"t": "Yalnız antibiyotik yeterlidir, toksine yönelik işlem gerekmez"}, {"t": "Kolistin"}, {"t": "Rifamisin + izoniazid + etambutol"}, {"t": "Doğumdan önce anneye penisilin"}], "a": 0, "exp": "Slayta göre **Corynebacterium diphtheriae**, **lizojenik β-faj** oluşturarak **A ve B ekzotoksin** üretir ve difteriye neden olur; toksin **protein zinciri uzama faktörü-2'yi (EF-2) inhibe eder**. Yalnız insanda bulunur, damlacık ve deri ile bulaşır; hastalıkları respiratuvar ve kutanöz difteridir. Aşılamanın olduğu ülkelerde nadirdir.\nHastalık bir **ekzotoksin hastalığı** olduğu için tedavi iki ayaklıdır: bakteriyi yok etmek için **penisilin ve eritromisin**, dolaşan toksin için **ekzotoksin nötralizasyonu**. Korunmada **toksoid aşılama** yapılır ('Difteri aşı ile önlenebilen ölümcül bir hastalıktır').\n**Neden diğerleri değil:**\n• 'Yal
