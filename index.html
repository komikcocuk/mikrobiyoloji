eudomonas aeruginosa ve Burkholderia cepacia; oksidaz negatif olanlar Stenotrophomonas maltophilia ve **Acinetobacter (hareketsiz)**'dir. Çoklu ilaç direnci gösteren P. aeruginosa ve Acinetobacter'de kolistin kullanılır.\n\n📑 Slaytta: Acinetobacter adını **akinetos (hareketsiz)** kelimesinden alır; **hastane** ortamında bulunur ve **cerrahi yarası** olan, uzun süre yatan hastalarda risk yüksektir. Hastane kaynaklı (nöroşirürji sonrası yoğun bakım) enfeksiyon + \"hareketsiz\" ipucu Acinetobacter'i gösterir. Tedavi in vitro teste göre; kolistin tek etkili antibiyotiktir. (Oksidaz ve fermentasyon bilgisi kitaptandır.)\nYanlış şıklar:\n• Pseudomonas aeruginosa → kitaba göre oksidaz pozitiftir (ve hareketlidir); \"hareketsiz, oksidaz negatif\" tanımına uymaz.\n• Neisseria meningitidis → toplumda görülen menenjit etkeni; Gram negatif **kok**tur, kokobasil değil.\n• Haemophilus influenzae → kan kültüründe üreyen kokobasil; toplum kaynaklı çocukluk menenjiti/epiglotit etkenidir, hastane kaynaklı nonfermenter değildir.\n• Alcaligenes faecalis → slaytta işlenmez.\n\n💡 **Ezber ipucu:** Yoğun bakım + hareketsiz Gram negatif = A-kinetos-bacter.", "org": ["acinetobacter"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Yüksek ateşli dönemi ateşsiz (normal) bir dönemin izlediği, brusellozun neden olduğu ateş türü hangisidir?", "opts": [{"t": "Ondülan (dalgalı) ateş"}, {"t": "Bifazik ateş"}, {"t": "İntermittan ateş"}, {"t": "Sürekli ateş"}], "a": 0, "exp": "📖 Kitap: Brusellozda görülen ateş tipi ondülan ateştir: yüksek ateşli dönemi normal ısının olduğu bir dönem izler ve bu dalgalanma tekrarlar. Kitap diğer ateş tiplerini de tanımlar: sürekli ateşte vücut sıcaklığı sürekli 38°C'nin üstünde ve sabah-akşam farkı 1°C'den azdır (tifo); intermittan ateşte sabah normale inen ateş akşam yine 39–40°C'ye çıkar (tüberküloz, infektif endokardit, leishmania).\n\n📑 Slaytta: Brucella hastalığı \"**Buruselloz (Dalgalı Ateş)**\" olarak geçer; eşlik eden bulgular kas-eklem ağrısı, titreme, terleme, yorgunluk, ateş, kilo kaybı ve çoklu organ tutulumudur. \"Ondülan\" kelimesi Latince unda (dalga) kökünden gelir ve \"dalgalı\" demektir.\nYanlış şıklar: Bifazik, intermittan ve sürekli ateş slaytta brusellozla ilişkilendirilmez; slayttaki tanım \"dalgalı ateş\"tir.\n\n💡 **Ezber ipucu:** Bruselloz = ondülan = dalgalı ateş.", "org": ["brucella"], "shuf": true, "tag": "Feyyaz Akay"}]}, {"title": "Gram (+) Basiller", "desc": "Şarbon, B. cereus, Listeria ve difteri; toksin mekanizmaları ve vakalar", "short": "Gram (+) basil", "questions": [{"q": "Aerobik Gram pozitif basiller spor oluşturma özelliğine göre nasıl ayrılır?", "opts": [{"t": "Sporlu: Corynebacterium; sporsuz: Bacillus"}, {"t": "Bacillus, Listeria ve Corynebacterium'un üçü de sporsuzdur"}, {"t": "Sporlu: Listeria; sporsuz: Bacillus ve Corynebacterium"}, {"t": "Sporlu: Bacillus; sporsuz: Listeria ve Corynebacterium"}, {"t": "Bacillus, Listeria ve Corynebacterium'un üçü de sporludur"}], "a": 3, "exp": "Aerobik Gram pozitif basiller iki gruba ayrılır: **spor oluşturan Bacillus** (B. anthracis, B. cereus) ve **spor oluşturmayan Listeria ve Corynebacterium**.\nBu ayrımın pratik önemi var: şarbon sporlarının topraktan eliminasyonu zordur, B. cereus da toprakta ve çevrede yaygın bulunur. Sporsuz grupta ise Listeria buzdolabı ve yüksek tuzda yaşayarak gıdaları bozar, C. diphtheriae ise sadece insanda bulunur.\nSınıflandırma tablosuna göre spor oluşturma yeteneği **yalnızca Gram pozitif** bakterilerde vardır.\nDiğer şıklar:\n• Corynebacterium sporlu / Bacillus sporsuz → tam ters eşleştirme.\n• Listeria sporlu → Listeria sporsuz gruptadır.\n• \"Üçü de sporsuz\" veya \"üçü de sporlu\" → grup içindeki ayrımı yok sayar.\n💡 **Ezber ipucu:** Spor = **B**acillus; sporsuz ikili = **L**isteria + **C**orynebacterium.", "org": ["anthracis", "cereus", "listeria", "diphtheriae"], "shuf": true}, {"q": "Aerobik Gram pozitif basillerin önemiyle ilgili aşağıdaki bilgilerden hangisi doğrudur?", "opts": [{"t": "Difteri aşısından sonra vaka sayısı değişmemiştir"}, {"t": "Bacillus cereus ABD'de yaklaşık 65 bin gıda zehirlenmesine yol açar"}, {"t": "Şarbon insandan insana kolayca bulaşan bir hastalıktır"}, {"t": "Listeria buzdolabı sıcaklığında üreyemez"}, {"t": "Listeria yalnızca sebzelerde ürer"}], "a": 1, "exp": "Giriş slaytında her bakteri bir \"önem cümlesi\" ile tanıtılır: **B. cereus ABD'de 65 bin gıda zehirlenmesi yapar.** B. cereus GİS'i enfekte eder ve kontamine besinlerle ilişkilidir; bu yüzden gıdaların saklanma ve üretilme koşullarının takibi gerekir.\nDiğer şıklar:\n• Difteri → aşı bulunmadan önce 200 bin kişi difteri olurken aşıdan sonra yalnızca 2 C. diphtheriae enfeksiyonu bildirilmiştir; yani vaka sayısı çarpıcı biçimde düşmüştür.\n• Şarbon → B. anthracis'in **kaza ile insana geçmesi** sonucu oluşur; sığır konaktır, insan rastlantısal konaktır.\n• Listeria buzdolabında üreyemez → tam tersine Listeria **buzdolabında ve tuzda üreyip** et ve süt ürünlerini bozar.\n• Listeria yalnızca sebzede ürer → işlenmiş et, sosis, süt, krem peynir gibi pek çok gıdayla yayılır.\n💡 **Ezber ipucu:** 65 bin = B. cereus; 200 bin → 2 = difteri aşısının başarısı.", "org": ["anthracis", "cereus", "listeria", "diphtheriae"], "shuf": true}, {"q": "Bacillus anthracis'in hastalık oluşturabilmesi için sahip olması gereken yapılar hangileridir?", "opts": [{"t": "Pilin ve IgA proteaz"}, {"t": "M proteini ve streptolizin"}, {"t": "Hücre duvarında mikolik asit"}, {"t": "Lipid A ve PRP"}, {"t": "Kapsül ile koruyucu antijen, letal faktör ve ödem toksini"}], "a": 4, "exp": "B. anthracis'in hastalık oluşturması için **kapsüllü olması** ve **koruyucu antijen, letal faktör ve ödem toksinine** sahip olması gerekir.\nBu yapıların görevleri: kapsül **poli-D-glutamik asit** yapısındadır ve fagositozu önler; ödem toksini **adenilat siklaz** etkisiyle ödeme yol açar; letal toksin makrofajları uyararak **TNF ve IL** salgılatır.\nDiğer şıklar:\n• M proteini ve streptolizin → S. pyogenes'in virülans faktörleri.\n• Lipid A ve PRP → H. influenzae (PRP kapsül yapısı, PRP'ye karşı antikorlar koruyucudur).\n• Mikolik asit → aside dirençli bakterilerin (Mycobacterium, Nocardia, Rhodococcus) hücre duvarı.\n• IgA proteaz → S. pneumoniae'nın mukozal IgA'yı inaktive etmesini önleyen enzim.\n💡 **Ezber ipucu:** Şarbon için \"kapsül + 3 parça toksin (koruyucu antijen, letal faktör, ödem toksini)\".", "org": ["anthracis"], "shuf": true}, {"q": "B. anthracis kapsülünün yapısı ve görevi hangisidir?", "opts": [{"t": "Poli-D-glutamik asit; fagositozu önler"}, {"t": "Hiyalüronik asit; immünojenik olmayan kapsül"}, {"t": "Polisakkarit; 100 farklı serotip"}, {"t": "Riboz-ribitol-fosfat (PRP); koruyucu antikor hedefi"}, {"t": "Mikolik asit; asitle boyanmaya direnç"}], "a": 0, "exp": "B. anthracis kapsülü **poli-D-glutamik asit** yapısındadır ve **fagositozu önler**. Kapsül, hastalık oluşturmak için şart olan yapılardan biridir (koruyucu antijen, letal faktör ve ödem toksini ile birlikte).\nKapsüller sınavda sık karşılaştırılır; her bakterinin kapsülünü ayrı tanımak gerekir:\n• Hiyalüronik asit kapsül → S. pyogenes.\n• 100 farklı serotipli, fagositoza dirençli polisakkarit kapsül → S. pneumoniae.\n• PRP (riboz, ribitol, fosfat) içeren kapsül → H. influenzae; PRP'ye karşı antikorlar koruyucudur, Hib aşısı konjuge PRP'dir.\n• Mikolik asit bir kapsül değil, aside dirençli bakterilerin hücre duvarı bileşenidir ve asitle boyanmaya direnç sağlar.\n💡 **Ezber ipucu:** Bakteriyel kapsüller genelde polisakkarittir; **şarbonun kapsülü ise bir amino asit polimeridir (poli-D-glutamik asit)**.", "org": ["anthracis"], "shuf": true}, {"q": "B. anthracis'te ödeme neden olan toksin hangi enzim aktivitesine sahiptir?", "opts": [{"t": "IgA proteaz"}, {"t": "Beta-laktamaz"}, {"t": "Adenilat siklaz"}, {"t": "Fosfolipaz C"}, {"t": "Koagülaz"}], "a": 2, "exp": "B. anthracis **adenilat siklaz (ödem toksini)** ile ödeme neden olur. Bu, şarbon lezyonlarının çevresindeki belirgin ödemin nedenidir.\nŞarbonun diğer toksin bileşeni olan **letal toksin** ise makrofajları uyararak TNF ve IL salgılanmasını sağlar. Hastalık için kapsül, koruyucu antijen, letal faktör ve ödem toksini birlikte gerekir.\nDiğer şıklar:\n• Fosfolipaz C (PLC) → B. cereus'un lesitinaz etkisiyle gözde doku hasarı yapan enzimi.\n• Koagülaz → S. aureus'un virülans enzimi.\n• IgA proteaz → S. pneumoniae'nın mukozal IgA'yı yıkan enzimi.\n• Beta-laktamaz → β-laktam antibiyotikleri inaktive eden direnç enzimi; toksin değildir.\n💡 **Ezber ipucu:** **Ö**dem toksini = **A**denilat siklaz; **L**etal toksin = makrofajdan TNF/IL.", "org": ["anthracis"], "shuf": true}, {"q": "Şarbon epidemiyolojisiyle ilgili hangisi **yanlıştır**?", "opts": [{"t": "Nadir görüldüğü için tanısı zordur"}, {"t": "Biyolojik silah/biyoterör potansiyeli vardır"}, {"t": "Tek rezervuar insandır"}, {"t": "Hayvan aşılamasının az olduğu ülkelerde yaygındır"}, {"t": "Asıl konak sığırdır, insan rastlantısal konaktır"}], "a": 2, "exp": "Şarbonda **sığır konaktır, insan rastlantısal konaktır**; hastalık bakterinin kaza ile insana geçmesiyle oluşur. Bu yüzden \"tek rezervuar insandır\" ifadesi yanlıştır.\nDoğru olan diğer bilgiler:\n• Nadiren görüldüğü ve mikrobiyologların tanı tecrübesi az olduğu için tanısı zordur.\n• Biyolojik silah potansiyeli vardır, biyoterörizmde kullanılabilir.\n• Hayvan aşılamasının az olduğu ülkelerde yaygındır (hayvan hastalığı olduğu için hayvan aşılaması korunmada önemlidir).\nKarıştırma: \"Sadece insanda bulunur\" bilgisi C. diphtheriae için geçerlidir; M. tuberculosis için de \"insan tek rezervuardır\" denir.\n💡 **Ezber ipucu:** Şarbon → hayvan (sığır) hastalığı, insan kazara konak.", "org": ["anthracis"], "shuf": true, "html": true}, {"q": "Şarbonun tedavisi ve korunmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Siprofloksasin ve doksisiklin ile kombine tedavi edilir; doğal yolla oluşmuşsa amoksisilin yeterlidir"}, {"t": "Tek etkili antibiyotik kolistindir; diğer ilaçlara doğal dirençlidir"}, {"t": "Sporlar topraktan kolayca temizlendiği için çevresel kontrol sorun değildir"}, {"t": "Aşısı etkisizdir ama hiçbir toksisitesi yoktur"}, {"t": "Aşısı yoktur; korunma yalnızca antibiyotik profilaksisiyle sağlanır"}], "a": 0, "exp": "Şarbon **siprofloksasin ve doksisiklin ile kombine** tedavi edilir; **doğal yolla oluşmuşsa amoksisilin yeterlidir**. Yani biyoterör gibi doğal olmayan bir maruziyette kombine tedavi, doğal (hayvan kaynaklı) olguda amoksisilin seçilir.\nKorunmayla ilgili slayt bilgileri: **sporların topraktan eliminasyonu zordur**; **aşı etkilidir ancak toksisitesi vardır**.\nDiğer şıklar:\n• Kolistin tek etkili antibiyotik → bu bilgi Acinetobacter için geçer.\n• Sporlar kolayca temizlenir → yanlış, eliminasyon zordur.\n• Aşı etkisiz ama toksisitesiz → tam tersi: etkili ama toksik.\n• Aşısı yoktur → şarbon aşısı vardır.\n💡 **Ezber ipucu:** Şarbon tedavisi \"Sipro + Doksi\"; doğal olguda \"Amoksisilin\".", "org": ["anthracis"], "shuf": true}, {"q": "Bacillus cereus enterotoksiniyle ilgili hangisi doğrudur?", "opts": [{"t": "Enterotoksini menenjite yol açar"}, {"t": "Enterotoksin üretmez"}, {"t": "Her iki suş da yalnızca ateş yapar"}, {"t": "Isıya dirençli suş kusmaya, ısıya duyarlı suş ishale neden olur"}, {"t": "Isıya dirençli suş ishale, ısıya duyarlı suş kusmaya neden olur"}], "a": 3, "exp": "B. cereus enterotoksini **ısıya dirençli suşta kusmaya, ısıya duyarlı suşta ishale** neden olur. B. cereus'un ısıya duyarlı ve dirençli suşları vardır ve bakteri GİS'i enfekte eder.\nB. cereus gastroenteriti kontamine besinlerle ilişkilidir; klinik sendromlar tablosunda da hem **gastroenterit** hem **besin zehirlenmesi** etkenleri arasında (S. aureus ile birlikte) yer alır. GİS enfeksiyonu semptomlara göre tedavi edilir.\nDiğer şıklar:\n• Ters eşleştirme (dirençli → ishal, duyarlı → kusma) → en sık yapılan hata.\n• Enterotoksin üretmez → yanlış, gastroenteriti enterotoksin yapar.\n• Menenjit → B. cereus hastalıkları arasında yoktur; Gram pozitif basiller içinde menenjit Listeria'nın hastalığıdır.\n• Yalnızca ateş → enterotoksinin etkisi kusma veya ishaldir.\n💡 **Ezber ipucu:** Isıya **D**irençli → **K**usma (pişirmeye dayanan toksin hızlı kusturur); duyarlı → ishal.", "org": ["cereus"], "shuf": true}, {"q": "B. cereus'un gözde doku hasarı yapan faktörleri hangileridir?", "opts": [{"t": "Pertaktin ve hemaglutinin"}, {"t": "Serolizin (hemoliz) ve fosfolipaz C (lesitinaz)"}, {"t": "M ve F proteinleri"}, {"t": "Pilin ve IgA proteaz"}, {"t": "Lipid A ve PRP"}], "a": 1, "exp": "B. cereus **serolizin ile hemoliz, PLC (fosfolipaz C) ile lesitinaz** yaparak gözde doku hasarı oluşturur. Genel olarak da **sitotoksik enzimlerle** doku hasarına neden olur.\nKlinik bağlantı: B. cereus'un hastalıklarından biri **travmatik göz enfeksiyonudur**; klinik sendromlar tablosunda **endoftalmit** etkenleri arasında sayılır. Göz enfeksiyonunda **siprofloksasin, klindamisin, vankomisin ve gentamisin** kullanılır.\nDiğer şıklar:\n• Pertaktin ve hemaglutinin → B. pertussis'in trakea epiteline bağlanma proteinleri (aşılar bu proteinlerden yapılır).\n• M proteini → S. pyogenes'te farenjit ve yumuşak doku enfeksiyonunu oluşturan protein.\n• Lipid A ve PRP → H. influenzae'nin yapıları.\n• IgA proteaz → S. pneumoniae.\n💡 **Ezber ipucu:** Göz + Bacillus → \"Serolizin + PLC (lesitinaz)\".", "org": ["cereus"], "shuf": true}, {"q": "Aşağıdakilerden hangisi B. cereus'un neden olduğu hastalıklardan biri **değildir**?", "opts": [{"t": "Gastroenterit"}, {"t": "Şarbon benzeri pulmoner hastalık"}, {"t": "Travmatik göz enfeksiyonu"}, {"t": "Fırsatçı enfeksiyonlar"}, {"t": "Romatizmal ateş"}], "a": 4, "exp": "B. cereus'un hastalıkları dört başlıkta sayılır: **gastroenterit, travmatik göz enfeksiyonu, fırsatçı enfeksiyonlar ve şarbon benzeri pulmoner hastalık**.\n• Gastroenterit → enterotoksin (ısıya dirençli suş kusma, duyarlı suş ishal).\n• Travmatik göz enfeksiyonu → serolizin ve PLC ile doku hasarı; tabloda endoftalmit etkeni.\n• Fırsatçı enfeksiyonlar → B. cereus fırsatçı bir bakteridir; steril, delici olmayan yaralarla da ilişkilidir.\n• Şarbon benzeri pulmoner hastalık → aynı cinsten (Bacillus) olduğu için B. anthracis'in akciğer şarbonunu taklit edebilir.\n**Romatizmal ateş** ise S. pyogenes farenjiti ilk 10 gün içinde tedavi edilmezse gelişen immünolojik komplikasyondur; B. cereus ile ilgisi yoktur.\n💡 **Ezber ipucu:** B. cereus = \"GİS + göz + fırsatçı + şarbon benzeri akciğer\".", "org": ["cereus"], "shuf": true, "html": true}, {"q": "Listeria monocytogenes ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "Floradaki Streptococcus ve Corynebacterium'lardan kolayca ayırt edilir"}, {"t": "Lord Joseph Lister'e ithaf edilmiştir"}, {"t": "Hücre içi fakültatif bir bakteridir"}, {"t": "Buzdolabı sıcaklığında ve yüksek tuzda yaşayabilir"}, {"t": "Mide asidi ve safraya dirençlidir"}], "a": 0, "exp": "Listeria floradaki Streptococcus ve Corynebacterium'lardan **zor** ayırt edilir; bu yüzden \"kolayca ayırt edilir\" ifadesi yanlıştır.\nDoğru olan Listeria özellikleri:\n• Lord Joseph Lister'e ithaf edilmiştir.\n• **Hücre içi fakültatiftir**; yüzey proteinleri hücre reseptörüne bağlanır, hemolizinler hücre içinde sağ kalmasını ve çoğalmasını sağlar.\n• **Buzdolabında ve yüksek tuzda** yaşayabilir; bu yüzden soğukta saklanan et ve süt ürünlerini bozar.\n• **Mide asidi ve safraya dirençlidir**; bu sayede kontamine gıdayla alındığında bağırsağa ulaşabilir.\n💡 **Ezber ipucu:** Listeria'yı gıda kaynaklı tehlikeli yapan üçlü → soğuk + tuz + asit/safraya dayanıklılık.", "org": ["listeria"], "shuf": true, "html": true}, {"q": "Aşağıdaki Gram pozitif basillerden hangisi transplasental geçer ve yenidoğanda erken/geç başlangıçlı hastalık yapar?", "opts": [{"t": "Bacillus anthracis"}, {"t": "Bacillus cereus"}, {"t": "Listeria monocytogenes"}, {"t": "Nocardia"}, {"t": "Corynebacterium diphtheriae"}], "a": 2, "exp": "Listeria **transplasentaldir**. Hastalıkları: **erken başlangıçlı yenidoğan hastalığı, geç başlangıçlı yenidoğan hastalığı, ateşli bakteriyemi ve menenjit, grip benzeri soğuk algınlığı ve gastroenterit**.\nBu yüzden yüksek riskli gruplar yenidoğan, yaşlı ve hasta kişilerdir; gebeler krem peynir, çiğ gıda ve yıkanmamış sebzeden kaçınmalıdır.\nDiğer şıklar:\n• B. anthracis → deri, bağırsak ve akciğer şarbonu.\n• B. cereus → gastroenterit, travmatik göz enfeksiyonu, fırsatçı enfeksiyonlar, şarbon benzeri pulmoner hastalık.\n• C. diphtheriae → respiratuvar ve kutanöz difteri.\n• Nocardia → pnömoni olarak başlayıp beyin ve deride apselere dönüşen enfeksiyon (bronkopulmoner hastalık).\n💡 **Ezber ipucu:** \"Erken ve geç başlangıçlı yenidoğan hastalığı\" ifadesi iki bakteride geçer: S. agalactiae (Gram + kok) ve Listeria (Gram + basil).", "org": ["listeria"], "shuf": true}, {"q": "Listeria epidemiyolojisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Yalnızca kış aylarında salgın yapar"}, {"t": "İşlenmiş et, çiğ sebze, sosis ve sütle yayılır; yenidoğan, yaşlı ve hastalar risklidir"}, {"t": "Sadece insanda yaşar; doğada rezervuarı yoktur"}, {"t": "En riskli grup sağlıklı genç erişkinlerdir"}, {"t": "Damlacık ve deri temasıyla kişiden kişiye bulaşır"}], "a": 1, "exp": "Listeria **işlenmiş etler, çiğ sebzeler, sosis, süt gibi kontamine gıdalarla** yayılır; **yenidoğan, yaşlı ve hasta kişiler** yüksek risklidir.\nDiğer epidemiyolojik bilgiler: toprak, bitki, hayvan ve sularda yaşar; transplasentaldir; bozunmuş gıdalarla toplumda hızla yayılır; sporadik vakalar ve salgınlar **tüm yıl** görülebilir.\nDiğer şıklar:\n• Yalnızca kışın → yanlış, tüm yıl görülür.\n• Sadece insanda yaşar → Listeria toprak, bitki, hayvan ve sularda bulunur; \"sadece insanda bulunur\" C. diphtheriae'nin özelliğidir.\n• Sağlıklı gençler en riskli → risk grubu yenidoğan, yaşlı ve hasta kişilerdir.\n• Damlacık ve deri ile bulaş → C. diphtheriae'nin bulaş yoludur; Listeria gıda kaynaklıdır.\n💡 **Ezber ipucu:** Listeria = \"gıda + gebelik + yaşlı/hasta\".", "org": ["listeria"], "shuf": true}, {"q": "Listeriozun tedavisi ve korunmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Kendi kendini sınırladığı için tedavi gerekmez"}, {"t": "Tek etkili antibiyotik kolistindir"}, {"t": "Toksoid aşı ile rutin olarak önlenir"}, {"t": "Penisilin ve ampisilin kullanılır; yüksek riskliler krem peynir ve çiğ gıdadan kaçınır"}, {"t": "Dapson ve klofazimin ile uzun süreli tedavi edilir"}], "a": 3, "exp": "Listeria tedavisinde **penisilin ve ampisilin** kullanılır. Korunmada **yüksek riskli kişilerin** (gebe, yenidoğan, yaşlı, hasta) **krem peynir, çiğ gıdalar ve yıkanmamış sebzelerden kaçınması** gerekir; çünkü bulaş bu gıdalarla olur.\nDiğer şıklar:\n• Toksoid aşı → difteride uygulanır (toksin aracılı hastalık olduğu için). Listeria için aşı yoktur.\n• Dapson ve klofazimin → lepra tedavisi (rifampisinle birlikte).\n• Kolistin tek etkili antibiyotik → Acinetobacter.\n• Tedavi gerekmez → menenjit ve bakteriyemi yapabilen bir bakteri için yanlış; \"semptomatik tedavi\" B. cereus GİS enfeksiyonu için geçer.\n💡 **Ezber ipucu:** Listeria'da \"Penisilin/Ampisilin + riskli gıdadan kaçınma\".", "org": ["listeria"], "shuf": true}, {"q": "Corynebacterium diphtheriae difteriye nasıl neden olur?", "opts": [{"t": "Poli-D-glutamik asit kapsül ile fagositozu önleyerek"}, {"t": "Adenilat siklaz (ödem toksini) ile ödem oluşturarak"}, {"t": "Serolizin ve fosfolipaz C ile doku hasarı yaparak"}, {"t": "G1alfa proteinini inhibe ederek mukus artışı ve öksürüğe yol açarak"}, {"t": "Lizojenik β-faj kaynaklı A-B ekzotoksin ile uzama faktörü-2'yi (EF-2) inhibe ederek"}], "a": 4, "exp": "C. diphtheriae **lizojenik β-faj** oluşturarak **A ve B ekzotoksin** ile difteriye neden olur; toksin **protein zinciri uzama faktörü-2'yi (EF-2)** inhibe eder ve hücrede protein sentezi durur.\nYani hastalığı yapan bakterinin kendisinden çok **toksinidir**; bu yüzden tedavide antibiyotik (penisilin, eritromisin) yanında **ekzotoksin nötralizasyonu**, korunmada **toksoid aşı** vardır.\nDiğer şıklar:\n• Poli-D-glutamik asit kapsül ve adenilat siklaz (ödem toksini) → B. anthracis.\n• Serolizin ve fosfolipaz C → B. cereus'un gözde doku hasarı.\n• G1alfa proteinini inhibe ederek mukus ve öksürük → B. pertussis toksini.\n💡 **Ezber ipucu:** Difteri = \"faj + A-B toksin + EF-2\".", "org": ["diphtheriae"], "shuf": true}, {"q": "Corynebacterium'larla ilgili hangisi doğrudur?", "opts": [{"t": "Deri ve mukoza florasında hiç bulunmazlar"}, {"t": "C. diphtheriae'nin asıl rezervuarı hayvanlardır"}, {"t": "Spor oluşturan aerobik Gram pozitif basillerdir"}, {"t": "Deri ve mukozada bulunan türleri fırsatçı ve kontaminant olabilir"}, {"t": "Cinsin tüm üyeleri zorunlu patojendir"}], "a": 3, "exp": "**Deri ve mukozada farklı korinebakteriler bulunur**; bunlar **fırsatçı ve kontaminant**tır. C. diphtheriae ise cins içinde **sık rastlanmayan ve zor izole edilen** türdür.\nBu yüzden klinik örnekte korinebakteri üremesi her zaman difteri anlamına gelmez; floradaki türler kontaminasyon olabilir. Listeria'nın da floradaki Streptococcus ve Corynebacterium'lardan zor ayırt edildiği vurgulanır.\nDiğer şıklar:\n• Florada hiç bulunmazlar → yanlış, deri ve mukozada bulunurlar.\n• C. diphtheriae hayvan rezervuarlı → yanlış, **sadece insanda** bulunur; enfekte ve asemptomatik insanlarla yayılır.\n• Sporlu → Corynebacterium sporsuz gruptadır (sporlu olan Bacillus).\n• Hepsi zorunlu patojen → floradaki türler fırsatçıdır.\n💡 **Ezber ipucu:** Korinebakteriler çoğunlukla flora/kontaminant; patojen yıldız C. diphtheriae nadir ve zor izole edilir.", "org": ["diphtheriae"], "shuf": true}, {"q": "Difteri epidemiyolojisi ve tedavisiyle ilgili hangisi **yanlıştır**?", "opts": [{"t": "Damlacık ve deri temasıyla bulaşır"}, {"t": "Asemptomatik insanlar hastalığı yaymaz"}, {"t": "Penisilin ve eritromisin kullanılır; ekzotoksin nötralizasyonu yapılır"}, {"t": "Aşılamanın yapıldığı ülkelerde nadirdir"}, {"t": "Sadece insanda bulunur"}], "a": 1, "exp": "Difteri **enfekte ve asemptomatik insanlarla** yayılır; dolayısıyla \"asemptomatik insanlar yaymaz\" ifadesi yanlıştır. Belirti göstermeyen taşıyıcılar da bulaş kaynağıdır.\nDoğru olan bilgiler:\n• **Sadece insanda** bulunur; **damlacık ve deri** ile bulaşır (bu iki yol, iki klinik formla uyumludur: respiratuvar ve kutanöz difteri).\n• **Aşılama olan ülkelerde nadirdir** (aşı öncesi 200 bin vaka → aşı sonrası 2 vaka).\n• Tedavide **penisilin ve eritromisin** kullanılır; **ekzotoksin nötralizasyonu ve toksoid aşılama** yapılır.\n💡 **Ezber ipucu:** Difteri kaynağı = yalnız insan (hasta + asemptomatik taşıyıcı).", "org": ["diphtheriae"], "shuf": true, "html": true}, {"q": "Toksin – bakteri – etki eşleştirmelerinden hangisi **yanlıştır**?", "opts": [{"t": "Difteri toksini – Listeria – mide asidine direnç"}, {"t": "Ödem toksini – B. anthracis – adenilat siklaz"}, {"t": "Difteri toksini – C. diphtheriae – EF-2 inhibisyonu"}, {"t": "Letal toksin – B. anthracis – makrofajlardan TNF ve IL salınımı"}, {"t": "Enterotoksin – B. cereus – kusma veya ishal"}], "a": 0, "exp": "Difteri toksini **C. diphtheriae**'ye aittir; lizojenik β-faj kaynaklı A-B ekzotoksindir ve **uzama faktörü-2'yi** inhibe eder. Mide asidi ve safraya direnç ise Listeria'nın kendi özelliğidir, bir toksin etkisi değildir. Listeria'nın virülansında **yüzey proteinleri** (hücre reseptörüne bağlanma) ve **hemolizinler** (hücre içinde sağ kalma ve çoğalma) rol oynar.\nDoğru eşleştirmeler:\n• Ödem toksini – B. anthracis – adenilat siklaz → ödem.\n• Letal toksin – B. anthracis – makrofajlardan TNF ve IL.\n• Difteri toksini – C. diphtheriae – EF-2 inhibisyonu → protein sentezi durur.\n• Enterotoksin – B. cereus – ısıya dirençli suş kusma, duyarlı suş ishal.\n💡 **Ezber ipucu:** Bu grupta toksinle hastalık yapan üç bakteri var (B. anthracis, B. cereus, C. diphtheriae); Listeria ise hücre içi yaşamıyla hastalık yapar.", "org": ["anthracis", "cereus", "listeria", "diphtheriae"], "shuf": true, "html": true}, {"q": "Aşağıdakilerden hangisi gıda kaynaklı hastalık açısından **en az** ilişkili olandır?", "opts": [{"t": "Bağırsak şarbonu"}, {"t": "Mycobacterium avium (kontamine su/besin)"}, {"t": "Corynebacterium diphtheriae"}, {"t": "Listeria monocytogenes"}, {"t": "Bacillus cereus"}], "a": 2, "exp": "C. diphtheriae **damlacık ve deri ile** bulaşır, sadece insanda bulunur ve enfekte/asemptomatik insanlarla yayılır; gıda kaynaklı bir bakteri değildir.\nDiğerleri gıda/su ile ilişkilidir:\n• B. cereus → kontamine besinlerle ilişkilidir, GİS'i enfekte eder; gıdaların saklama ve üretim koşullarının takibi gerekir.\n• Listeria → kontamine gıdalardan (işlenmiş et, sosis, süt, krem peynir, çiğ sebze) insana bulaşır.\n• M. avium → kontamine su ve besin ile bulaşır.\n• Bağırsak şarbonu → şarbonun üç formundan biri; sindirim sistemi yoluyla oluşan formdur.\n💡 **Ezber ipucu:** Bu konudaki tek \"damlacık + deri\" bulaşlı bakteri C. diphtheriae'dir.", "org": ["diphtheriae", "cereus", "listeria", "avium", "anthracis"], "shuf": true, "html": true}, {"q": "Aşağıdaki hastalık – aşı/korunma eşleştirmelerinden hangisi **doğrudur**?", "opts": [{"t": "Listerioz – rutin çocukluk aşısı"}, {"t": "Tüberküloz – aşısı yoktur"}, {"t": "Nokardiyoz – BCG aşısı"}, {"t": "Şarbon – aşısı yoktur"}, {"t": "Difteri – toksoid aşı"}], "a": 4, "exp": "Difteride **toksoid aşılama** yapılır. Hastalık toksin aracılı olduğu için aşı da toksinin zararsızlaştırılmış formuna (toksoid) karşı bağışıklık oluşturur; aşı öncesi 200 bin olan vaka sayısı aşı sonrası 2'ye inmiştir. \"Difteri; aşı ile önlenebilen ölümcül bir hastalıktır.\"\nDiğer şıklar:\n• Tüberküloz – aşısı yok → yanlış; **BCG (Bacille Calmette Guérin)** aşısı uygulanır.\n• Nokardiyoz – BCG → BCG tüberküloz aşısıdır, Nocardia ile ilgisi yoktur.\n• Şarbon – aşısı yok → yanlış; aşı **etkilidir ancak toksisitesi vardır**.\n• Listerioz – rutin aşı → Listeria için aşı yoktur; korunma yüksek riskli kişilerin riskli gıdalardan kaçınmasıyla sağlanır.\n💡 **Ezber ipucu:** Toksoid = difteri; BCG = tüberküloz; şarbon aşısı = etkili ama toksik.", "org": ["diphtheriae", "anthracis", "listeria", "tbc", "nocardia"], "shuf": true, "html": true}, {"q": "Şarbonun üç klinik formu hangileridir?", "opts": [{"t": "Ülseroglandüler, okuloglandüler, pnömonik"}, {"t": "Menenjit, otit, sinüzit"}, {"t": "Erken, geç ve kronik şarbon"}, {"t": "Tüberküloid, lepromatöz, sınır form"}, {"t": "Deri, bağırsak ve akciğer şarbonu"}], "a": 4, "exp": "Şarbonun formları: **deri şarbonu, bağırsak şarbonu ve akciğer şarbonu**. Formlar bakterinin vücuda giriş yerini yansıtır: deri teması, sindirim ve solunum.\nAdını da deri lezyonundan alır: oluşturduğu enfeksiyon **siyah olduğu için «kömür»** denmiştir. B. cereus'un \"şarbon benzeri pulmoner hastalık\" yapabildiğini de hatırla.\nDiğer şıklar başka hastalıkların form adlarıdır:\n• Ülseroglandüler, okuloglandüler, pnömonik → tularemi (F. tularensis).\n• Tüberküloid, lepromatöz → lepra (M. leprae).\n• Erken/geç başlangıç → yenidoğan hastalığı (S. agalactiae ve Listeria).\n• Menenjit, otit, sinüzit → S. pneumoniae, H. influenzae gibi solunum yolu patojenlerinin tabloları.\n💡 **Ezber ipucu:** Şarbon = Deri – Bağırsak – Akciğer (giriş yolu = form).", "org": ["anthracis"], "shuf": true}, {"q": "B. anthracis'in letal toksini makrofajlar üzerinde nasıl etki eder?", "opts": [{"t": "Makrofajlarda fagozom-lizozom birleşmesini engeller"}, {"t": "Makrofajları uyararak TNF ve interlökin salgılatır"}, {"t": "Adenilat siklaz etkisiyle makrofaj çevresinde ödem yapar"}, {"t": "Uzama faktörü-2'yi inhibe ederek makrofajda protein sentezini durdurur"}, {"t": "Hücre içinde sağ kalmayı sağlayan hemolizin gibi davranır"}], "a": 1, "exp": "B. anthracis **makrofajları letal toksin ile uyararak TNF ve IL salgılanmasını** sağlar. Şarbon toksininin bir başka bileşeni olan ödem toksini ise adenilat siklaz etkisiyle ödem yapar; poli-D-glutamik asit kapsül fagositozu önler. Hastalık için kapsül + koruyucu antijen + letal faktör + ödem toksini gerekir.\nDiğer şıklar:\n• Fagozom-lizozom birleşmesini engelleme → M. tuberculosis ve aside dirençli bakterilerin hücre içi yaşam stratejisi.\n• Adenilat siklaz ile ödem → şarbonun **ödem** toksinidir, letal toksin değil.\n• EF-2 inhibisyonu → difteri toksini.\n• Hücre içinde sağ kalmayı sağlayan hemolizin → Listeria.\n💡 **Ezber ipucu:** Letal toksin → makrofaj → sitokin (TNF, IL) fırtınası.", "org": ["anthracis"], "shuf": true}, {"q": "VAKA: Tarlada çalışırken gözüne metal çapağı kaçan işçide, travmaya bağlı hızla ilerleyen göz içi enfeksiyonu (endoftalmit) gelişiyor. En olası etken hangisidir?", "opts": [{"t": "Bordetella pertussis"}, {"t": "Listeria monocytogenes"}, {"t": "Mycobacterium leprae"}, {"t": "Bacillus cereus"}, {"t": "Corynebacterium diphtheriae"}], "a": 3, "exp": "Travma + toprak + göz = **B. cereus**. B. cereus **toprakta yaygındır**, hastalıkları arasında **travmatik göz enfeksiyonu** vardır ve klinik sendromlar tablosunda **endoftalmit** etkenleri arasında (S. aureus, P. aeruginosa ile birlikte) sayılır. Tabloda travma yaralarında da \"Bacillus türleri\" geçer.\nHasarın mekanizması: **serolizin ile hemoliz, PLC ile lesitinaz** yaparak gözde doku hasarı oluşturur. Tedavide **siprofloksasin, klindamisin, vankomisin ve gentamisin** kullanılır.\nDiğer şıklar:\n• Listeria → kontamine gıdalarla bulaşır; yenidoğan hastalığı, bakteriyemi, menenjit yapar.\n• C. diphtheriae ve B. pertussis → damlacıkla bulaşan solunum yolu patojenleri.\n• M. leprae → lepra (tüberküloid/lepromatöz).\n💡 **Ezber ipucu:** \"Göz travması + toprak\" gördüğünde B. cereus.", "org": ["cereus"], "shuf": true}, {"q": "VAKA: Restoranda pişirildikten sonra uygun koşullarda saklanmadan bekletilen yemeği yiyen müşterilerde kısa sürede bulantı ve kusma başlıyor. Sorumlu etken ve toksin özelliği hangisidir?", "opts": [{"t": "S. pyogenes – M proteini"}, {"t": "C. diphtheriae – difteri toksini"}, {"t": "B. cereus – ısıya dirençli enterotoksin"}, {"t": "B. cereus – ısıya duyarlı enterotoksin"}, {"t": "Listeria – hemolizin"}], "a": 2, "exp": "Pişirilip uygunsuz saklanan yemek + kısa sürede kusma = **B. cereus, ısıya dirençli enterotoksin**. B. cereus enterotoksini **ısıya dirençli suşta kusmaya**, ısıya duyarlı suşta ishale neden olur. Pişirmeye dayanan toksin bekletilen yemekte kalır ve kusma yapar.\nKorunma: gıdaların saklama ve üretilme koşullarının takibi gerekir; **besinler uygun hazırlanıp hemen tüketilmeli ya da buzdolabında saklanmalıdır**. GİS enfeksiyonu semptomlara göre tedavi edilir.\nDiğer şıklar:\n• B. cereus – ısıya duyarlı enterotoksin → ishal yapar, kusma değil.\n• Listeria – hemolizin → hemolizin Listeria'nın hücre içinde sağ kalmasını sağlar; besin zehirlenmesi tablosu değildir.\n• C. diphtheriae → damlacık ve deri ile bulaşır.\n• S. pyogenes M proteini → farenjit ve yumuşak doku enfeksiyonu.\n💡 **Ezber ipucu:** Kusma = ısıya dirençli; ishal = ısıya duyarlı.", "org": ["cereus"], "shuf": true}, {"q": "VAKA: 28 haftalık gebe; krem peynir ve çiğ sebze ağırlıklı beslenme sonrası grip benzeri hafif ateşli hastalık geçiriyor. Bu tablonun anne karnındaki bebek için en önemli riski hangisidir?", "opts": [{"t": "Transplasental geçişle yenidoğan hastalığı (bakteriyemi, menenjit) gelişmesi"}, {"t": "Bebekte deri şarbonu gelişmesi"}, {"t": "Bebekte kutanöz difteri gelişmesi"}, {"t": "Bebekte travmatik göz enfeksiyonu gelişmesi"}, {"t": "Bebekte lepra gelişmesi"}], "a": 0, "exp": "Gebe + krem peynir/çiğ sebze + grip benzeri tablo = **Listeria**. Listeria erişkinde **grip benzeri soğuk algınlığı ve gastroenterit** gibi hafif tablolar yapabilir; ancak **transplasentaldir** ve bebekte **erken ve geç başlangıçlı yenidoğan hastalığı, ateşli bakteriyemi ve menenjit** yapar.\nKorunma ve tedavi: krem peynir, çiğ gıdalar ve yıkanmamış sebzelerle bulaştığı için **yüksek riskli kişilerin (gebeler) bunlardan kaçınması** gerekir; tedavide **penisilin ve ampisilin** kullanılır. Mide asidi ve safraya direnci, gıdayla alındığında hayatta kalmasını sağlar.\nDiğer şıklar başka bakterilerin hastalıklarıdır:\n• Deri şarbonu → B. anthracis (hayvan teması).\n• Kutanöz difteri → C. diphtheriae (insan, deri teması).\n• Travmatik göz enfeksiyonu → B. cereus.\n• Lepra → M. leprae.\n💡 **Ezber ipucu:** Gebede gıda kaynaklı hafif ateş → Listeria → bebekte sepsis/menenjit riski.", "org": ["listeria"], "shuf": true}, {"q": "Difteri tedavisinin iki temel ayağı nedir?", "opts": [{"t": "Gentamisin + karantina"}, {"t": "Dapson + klofazimin"}, {"t": "Yalnızca semptomatik tedavi"}, {"t": "Antibiyotik (penisilin/eritromisin) + ekzotoksin nötralizasyonu"}, {"t": "Kolistin + BCG"}], "a": 3, "exp": "Difteride **penisilin ve eritromisin** kullanılır ve **ekzotoksin nötralizasyonu** yapılır; korunmada **toksoid aşılama** uygulanır.\nMantık: hastalığı yapan lizojenik β-faj kaynaklı A-B ekzotoksindir (EF-2'yi inhibe eder). Antibiyotik bakteriyi öldürür ama dolaşımdaki toksini etkilemez; bu yüzden toksinin ayrıca nötralize edilmesi gerekir.\nDiğer şıklar:\n• Dapson + klofazimin (rifampisinle) ve karantina → lepra.\n• BCG → tüberküloz aşısı.\n• Kolistin → Acinetobacter için tek etkili antibiyotik.\n• Yalnızca semptomatik tedavi → B. cereus GİS enfeksiyonu.\n• Gentamisin → tularemi tedavisi; B. cereus göz enfeksiyonunda da kullanılır.\n💡 **Ezber ipucu:** Toksin hastalığı = \"bakteriyi öldür + toksini nötralize et + toksoidle aşıla\".", "org": ["diphtheriae"], "shuf": true}, {"q": "Difteri toksini hücrede hangi süreci durdurur?", "opts": [{"t": "Mikolik asit sentezini"}, {"t": "Protein sentezini (uzama faktörü-2'yi inhibe ederek)"}, {"t": "Folik asit sentezini"}, {"t": "DNA replikasyonunu"}, {"t": "Hücre duvarı sentezini"}], "a": 1, "exp": "Lizojenik β-faj aracılığıyla oluşan A ve B ekzotoksin **protein zinciri uzama faktörü-2'yi (EF-2) inhibe eder**; böylece protein zinciri uzayamaz ve hücrede **protein sentezi durur**.\nBu mekanizma difterinin toksin aracılı bir hastalık olduğunu gösterir; tedavide ekzotoksin nötralizasyonu, korunmada toksoid aşı bu yüzden önemlidir.\nDiğer şıklar antibiyotik etki mekanizmalarıdır, toksin değil:\n• Mikolik asit sentezi → izoniazid, etiyonamid hedefler.\n• Folik asit sentezi → sülfonamidler ve trimetoprim.\n• DNA replikasyonu → kinolonlar DNA girazı hedefler.\n• Hücre duvarı sentezi → β-laktamlar, vankomisin.\nKarıştırma: B. pertussis toksini G1alfa proteinini inhibe eder; şarbonun ödem toksini adenilat siklazdır.\n💡 **Ezber ipucu:** Difteri toksini = \"EF-2 → protein sentezi durur\".", "org": ["diphtheriae"], "shuf": true}, {"q": "Difterinin iki klinik formu hangileridir?", "opts": [{"t": "Ülseroglandüler ve pnömonik difteri"}, {"t": "Erken ve geç başlangıçlı difteri"}, {"t": "Tüberküloid ve lepromatöz difteri"}, {"t": "Pulmoner ve ekstrapulmoner difteri"}, {"t": "Respiratuvar difteri ve kutanöz difteri"}], "a": 4, "exp": "Difterinin formları **respiratuvar difteri ve kutanöz difteri**dir. Bu iki form, bakterinin bulaş yollarıyla birebir uyumludur: **damlacık** (solunum yolu) ve **deri** teması.\nEk bağlantı: C. diphtheriae sadece insanda bulunur, enfekte ve asemptomatik insanlarla yayılır; aşılamanın olduğu ülkelerde nadirdir.\nRespiratuvar formda boğazda tipik gri **psödomembran** görülür. Çeldiriciler başka hastalıkların form adlarıdır:\n• Pulmoner/ekstrapulmoner → tüberküloz.\n• Erken/geç başlangıçlı → S. agalactiae ve Listeria yenidoğan hastalığı.\n• Tüberküloid/lepromatöz → lepra.\n• Ülseroglandüler/pnömonik (okuloglandüler ile) → tularemi.\n💡 **Ezber ipucu:** Difteri = solunum + deri (bulaş yolu = form).", "org": ["diphtheriae"], "shuf": true}, {"q": "Şarbon için aşağıdakilerden hangisi doğrudur?", "opts": [{"t": "Asıl konak sığırdır; insan rastlantısal konaktır"}, {"t": "Bakteri polisakkarit kapsüllüdür"}, {"t": "Spor oluşturmayan bir basildir"}, {"t": "Primer hayvan rezervuarı tavşanlar ve kemirgenlerdir"}, {"t": "Tedavide kolistin tek etkili antibiyotiktir"}], "a": 0, "exp": "B. anthracis için **sığır konaktır, insan rastlantısal konaktır**; şarbon, bakterinin **kaza ile insana geçmesiyle** oluşur. Hayvan aşılamasının az olduğu ülkelerde yaygındır.\nDiğer şıklar:\n• Polisakkarit kapsül → yanlış; B. anthracis kapsülü **poli-D-glutamik asit** yapısındadır ve fagositozu önler.\n• Sporsuz → yanlış; Bacillus **spor oluşturan** gruptadır (sporların topraktan eliminasyonu zordur).\n• Tavşan ve kemirgenler → tularemi (F. tularensis) ile ilişkilidir; onda da insan rastlantısal konaktır ama rezervuar yabani memeliler, tavşanlar ve kenelerdir.\n• Kolistin → Acinetobacter; şarbonda siprofloksasin + doksisiklin, doğal olguda amoksisilin.\n💡 **Ezber ipucu:** \"İnsan rastlantısal konaktır\" ifadesi şarbon, tularemi ve brusellozda ortaktır; şarbonda konak sığırdır.", "org": ["anthracis"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdaki virülans faktörlerinden hangisinin oluşumu lizojenik β-faja bağlıdır?", "opts": [{"t": "B. cereus enterotoksini"}, {"t": "Difteri toksini"}, {"t": "B. anthracis ödem toksini"}, {"t": "Pertussis toksini"}, {"t": "Listeria hemolizinleri"}], "a": 1, "exp": "C. diphtheriae **lizojenik β-faj oluşturarak A ve B ekzotoksin** ile difteriye neden olur; toksin protein zinciri uzama faktörü-2'yi inhibe eder. Yani difteri toksini, bakteriye faj aracılığıyla kazandırılan bir özelliktir.\nDiğer şıkların hiçbiri faja bağlanarak anlatılmaz:\n• B. cereus enterotoksini → ısıya dirençli suşta kusma, duyarlı suşta ishal.\n• B. anthracis ödem toksini → adenilat siklaz; ödem.\n• Pertussis toksini → G1alfa proteinini inhibe eder; mukus artar ve öksürük oluşur.\n• Listeria hemolizinleri → hücre içinde sağ kalma ve çoğalmayı sağlar.\n💡 **Ezber ipucu:** \"Faj\" kelimesini gördüğünde difteri toksinini düşün.", "org": ["diphtheriae"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdaki bakterilerden hangisi spor oluşturur?", "opts": [{"t": "Pseudomonas aeruginosa"}, {"t": "Listeria monocytogenes"}, {"t": "Bacillus anthracis"}, {"t": "Corynebacterium diphtheriae"}, {"t": "Escherichia coli"}], "a": 2, "exp": "Aerobik Gram pozitif basiller **spor oluşturan (Bacillus)** ve **spor oluşturmayan (Listeria ve Corynebacterium)** olarak ayrılır; B. anthracis sporlu gruptadır. Şarbon sporlarının topraktan eliminasyonunun zor olması da bu yüzdendir.\nSınıflandırma tablosunda sporluların **sadece Gram pozitif** bakteriler olduğu belirtilir.\nDiğer şıklar:\n• Listeria ve C. diphtheriae → Gram pozitif ama **sporsuz** basiller.\n• Pseudomonas aeruginosa ve E. coli → Gram negatiftir; Gram negatiflerde spor yoktur.\n💡 **Ezber ipucu:** Spor = yalnız Gram pozitif; aerobik Gram + basiller içinde yalnız Bacillus.", "org": ["anthracis"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Otuz iki yaşındaki bir kasabın sol el sırtında siyah, kabuklu bir yara lezyonu oluşmuştur. Hastada sistemik başka bir patoloji yoktur. Lezyondan alınan örneğin mikroskopik incelemesinde Gram pozitif, kapsüllü basiller görülmüştür. En olası tanı aşağıdakilerden hangisidir?", "opts": [{"t": "Fronkül"}, {"t": "Kutanöz difteri"}, {"t": "İmpetigo"}, {"t": "Erizipel"}, {"t": "Deri şarbonu"}], "a": 4, "exp": "Hayvanla temas (kasap) + siyah kabuklu deri lezyonu + Gram pozitif **kapsüllü** basil = **deri şarbonu**. Deri şarbonunun siyah kabuklu lezyonu tipik olarak **ağrısızdır**. B. anthracis'in oluşturduğu enfeksiyon **siyah olduğu için «kömür» (şarbon)** denmiştir; sığır konaktır, insan rastlantısal konaktır.\nKapsül poli-D-glutamik asit yapısındadır ve fagositozu önler; lezyon çevresindeki ödemi ödem toksini (adenilat siklaz) yapar. Şarbonun formları deri, bağırsak ve akciğer şarbonudur. Tedavide siprofloksasin + doksisiklin; doğal yolla oluşmuşsa amoksisilin yeterlidir.\nDiğer şıklar:\n• Fronkül → S. aureus.\n• İmpetigo → S. pyogenes ve S. aureus; erizipel → S. pyogenes. Bunların etkenleri **kok**tur, basil değil.\n• Kutanöz difteri → C. diphtheriae; sadece insanda bulunur (hayvan teması öyküsü uymaz), kapsülü tanımlanmaz.\n💡 **Ezber ipucu:** \"Hayvan teması + siyah kabuk + Gram + kapsüllü basil\" = deri şarbonu.", "org": ["anthracis"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdaki bakterilerden hangisinin kapsülü poli-D-glutamik asit yapısındadır?", "opts": [{"t": "Streptococcus pneumoniae"}, {"t": "Neisseria meningitidis"}, {"t": "Haemophilus influenzae"}, {"t": "Bacillus anthracis"}, {"t": "Streptococcus pyogenes"}], "a": 3, "exp": "B. anthracis kapsülü **poli-D-glutamik asit** yapısındadır ve **fagositozu önler**. Kapsül, B. anthracis'in hastalık yapabilmesi için gereken yapılardandır (koruyucu antijen, letal faktör ve ödem toksiniyle birlikte).\nDiğer şıkların kapsülleri:\n• S. pneumoniae → 100 farklı serotipi olan, fagositoza dirençli polisakkarit kapsül.\n• H. influenzae → PRP (riboz, ribitol, fosfat) içeren polisakkarit kapsül; PRP'ye karşı antikorlar koruyucudur.\n• S. pyogenes → hiyalüronik asit kapsül.\n• N. meningitidis → polisakkarit kapsül fagositozu engeller.\n💡 **Ezber ipucu:** Listede polisakkarit olmayan tek kapsül şarbonunkidir.", "org": ["anthracis"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Biyolojik silah olarak kullanılan şarbona karşı aşağıdaki antibiyotiklerden hangisini kullanırsınız?", "opts": [{"t": "Kolistin"}, {"t": "Gentamisin"}, {"t": "Siprofloksasin"}, {"t": "Dapson"}, {"t": "Klofazimin"}], "a": 2, "exp": "Şarbon **siprofloksasin ve doksisiklin ile kombine** tedavi edilir; **yalnızca doğal yolla oluşmuşsa amoksisilin yeterlidir**. Biyoterör kaynaklı şarbon doğal yolla oluşmadığı için siprofloksasin (doksisiklinle) seçilir.\nB. anthracis'in biyolojik silah potansiyeli vardır ve biyoterörizmde kullanılabilir; nadir görüldüğü için tanısı da zordur.\nDiğer şıklar:\n• Dapson ve klofazimin → lepra ilaçları (rifampisinle birlikte).\n• Kolistin → Acinetobacter için tek etkili antibiyotik.\n• Gentamisin → tularemi tedavisi; B. cereus göz enfeksiyonunda ve brusellozda (doksisikline eklenerek) kullanılır.\n💡 **Ezber ipucu:** Biyoterör şarbonu → Sipro + Doksi.", "org": ["anthracis"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Kontamine gıdalarla bulaşan; yenidoğan, yaşlı ve hasta kişilerde ateşli bakteriyemi ve menenjit yapabilen, mide asidi ve safraya dirençli Gram pozitif basil hangisidir?", "opts": [{"t": "Listeria monocytogenes"}, {"t": "Brucella"}, {"t": "Bacteroides fragilis"}, {"t": "Clostridium perfringens"}, {"t": "Bacillus cereus"}], "a": 0, "exp": "Listeria **kontamine gıdalardan insana bulaşır**, **mide asidi ve safraya dirençlidir**; **yenidoğan, yaşlı ve hasta kişiler** yüksek risklidir. Hastalıkları: erken/geç başlangıçlı yenidoğan hastalığı, **ateşli bakteriyemi, menenjit**, grip benzeri tablo ve gastroenterit. Menenjit etkenleri tablosunda da Listeria monocytogenes yer alır.\nTedavide penisilin ve ampisilin kullanılır; yüksek riskliler krem peynir, çiğ gıda ve yıkanmamış sebzeden kaçınmalıdır.\nDiğer şıklar:\n• B. cereus → o da gıdayla bulaşan Gram pozitif basildir ama menenjit yapmaz (gastroenterit, travmatik göz enfeksiyonu).\n• Brucella → Gram negatif kokobasil; çiğ süt ürünleriyle bulaşır, dalgalı ateş yapar.\n• B. fragilis → tabloda peritonit ve nekrotizan fasiit etkeni.\n• C. perfringens → tabloda nekrotizan selülit ve fasiit etkeni.\n💡 **Ezber ipucu:** Gıda + menenjit + Gram pozitif basil = Listeria.", "org": ["listeria"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Listeria monocytogenes'in hücre içinde sağ kalmasını ve çoğalmasını sağlayan faktör hangisidir?", "opts": [{"t": "Hemolizinler"}, {"t": "Poli-D-glutamik asit kapsül"}, {"t": "Adenilat siklaz (ödem toksini)"}, {"t": "Lizojenik β-faj kaynaklı A-B ekzotoksin"}, {"t": "M proteini"}], "a": 0, "exp": "Listeria'da **yüzey proteinleri hücrenin reseptörüne bağlanır** (hücreye giriş), **hemolizinler ise hücrede sağ kalmasını ve çoğalmasını** sağlar; bu hemolizinlerin en bilineni **listeriolizin O**'dur. Listeria **hücre içi fakültatif** bir bakteridir; bu iki faktör hücre içi yaşam döngüsünün temelidir.\nDiğer şıklar:\n• Poli-D-glutamik asit kapsül → B. anthracis; fagositozu önler.\n• Adenilat siklaz (ödem toksini) → B. anthracis; ödem yapar.\n• Lizojenik β-faj kaynaklı A-B ekzotoksin → C. diphtheriae; EF-2'yi inhibe eder.\n• M proteini → S. pyogenes; farenjit ve yumuşak doku enfeksiyonu.\n💡 **Ezber ipucu:** Listeria = yüzey proteini ile gir, hemolizin ile hücrede yaşa.", "org": ["listeria"], "shuf": true}, {"q": "Bacillus cereus enfeksiyonlarının tedavisi ve korunmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Gastrointestinal enfeksiyonda penisilin ve ampisilin zorunludur"}, {"t": "GİS enfeksiyonu semptomlara göre; göz enfeksiyonu siprofloksasin, klindamisin, vankomisin ve gentamisinle tedavi edilir"}, {"t": "Tüm enfeksiyonlarda siprofloksasin ve doksisiklin kombinasyonu verilir"}, {"t": "Ekzotoksin nötralizasyonu ve toksoid aşılama yapılır"}, {"t": "Tek etkili antibiyotik kolistindir"}], "a": 1, "exp": "B. cereus **GİS enfeksiyonu semptomlara göre** tedavi edilir (toksin aracılı, kendini sınırlayan tablo); **göz enfeksiyonunda siprofloksasin, klindamisin, vankomisin ve gentamisin** kullanılır. Göz enfeksiyonu hızlı doku hasarı yaptığı için (serolizin, PLC) antibiyotik gerektirir.\nKorunma: **besinler uygun hazırlanıp hemen tüketilmeli ya da buzdolabında saklanmalıdır**; gıdaların saklama ve üretilme koşullarının takibi gerekir.\nDiğer şıklar:\n• Penisilin ve ampisilin → Listeria tedavisi.\n• Siprofloksasin + doksisiklin → şarbon.\n• Ekzotoksin nötralizasyonu ve toksoid aşı → difteri.\n• Kolistin → Acinetobacter.\n💡 **Ezber ipucu:** B. cereus'ta \"bağırsak → destek tedavi, göz → 4'lü antibiyotik (Sipro, Klinda, Vanko, Genta)\".", "org": ["cereus"], "shuf": true}, {"q": "Çin lokantasında yenen pirinçli bir yemeği takiben 1–6 saatte ortaya çıkan bulantı, kusma ve abdominal kramp ile seyreden besin zehirlenmesi tablosundan sorumlu mikroorganizma aşağıdakilerden hangisi olabilir?", "opts": [{"t": "Clostridium perfringens"}, {"t": "Clostridium botulinum"}, {"t": "Bacillus cereus"}, {"t": "Vibrio parahaemolyticus"}, {"t": "Campylobacter jejuni"}], "a": 2, "exp": "📖 Kitap:\n1–6 saat içinde, önceden oluşmuş toksinlerin alınmasıyla meydana gelen besin zehirlenmelerinde öyküde dondurma, mayonez, tuzlu et yendiyse etken S. aureus; **pirinç yendiyse B. cereus**'tur. S. aureus ve B. cereus en kısa kuluçka süreli iki besin zehirlenmesi etkenidir. C. botulinum ACh salınımını inhibe ederek kabızlığa ve nörolojik tabloya, C. perfringens et kaynaklı besin zehirlenmesine yol açar.\n📑 Slaytta:\nKlinik sendromlar tablosunda **besin zehirlenmesi** etkenleri olarak yalnızca **S. aureus ve B. cereus** sayılır. B. cereus enterotoksini **ısıya dirençli suşta kusmaya**, ısıya duyarlı suşta ishale neden olur; kısa sürede başlayan kusma ısıya dirençli toksinle uyumludur. Gıdaların saklama koşullarının takibi gerekir; besinler hemen tüketilmeli ya da buzdolabında saklanmalıdır. GİS enfeksiyonu semptomlara göre tedavi edilir.\nDiğer şıklar:\n• V. parahaemolyticus ve C. jejuni → tabloda gastroenterit etkenleri olarak geçer, \"besin zehirlenmesi\" (hazır toksinle hızlı kusma) etkeni olarak değil.\n• C. perfringens → tabloda nekrotizan selülit ve fasiit etkeni.\n• C. botulinum → kusma ve kramp değil, nörolojik tablo yapar.\n💡 **Ezber ipucu:** Pirinç + 1–6 saat + kusma = B. cereus (ısıya dirençli enterotoksin).", "org": ["cereus"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdakilerden hangisi biyoterörizm Kategori A etkenidir?", "opts": [{"t": "Rickettsia prowazekii"}, {"t": "Vibrio cholerae"}, {"t": "Coxiella burnetii"}, {"t": "Listeria monocytogenes"}, {"t": "Bacillus anthracis"}], "a": 4, "exp": "📖 Kitap:\nBacillus anthracis biyoterörizm **Kategori A** etkenidir. Biyoterör amaçlı şarbonda inhalasyon (akciğer) şarbonu görülür; maruziyet sonrası profilakside aşı ile birlikte 60 gün süreyle siprofloksasin ya da doksisiklin verilir.\n📑 Slaytta:\nB. anthracis'in **biyolojik silah potansiyeli vardır** ve **biyoterörizmde kullanılabilir**. Biyoterör kaynaklı (doğal olmayan) şarbonda siprofloksasin + doksisiklin kombinasyonu kullanılır; yalnızca doğal yolla oluşmuşsa amoksisilin yeterlidir. Slaytta biyoterörizm etkeni olarak bir de F. tularensis sayılır (şıklarda yok).\nDiğer şıklar:\n• Listeria → kontamine gıdalarla bulaşan, yenidoğan ve yaşlıda menenjit yapan bakteri; biyoterör etkeni olarak geçmez.\n• V. cholerae → tabloda gastroenterit etkeni.\n• R. prowazekii ve C. burnetii → slaytta zorunlu hücre içi organizmalar arasında sayılır (Coxiella ayrıca endokardit etkeni).\n(Not: Kitaptaki \"Brucella suis\" şıkkı, slaytta Brucella \"seçilmiş ajan\" olarak geçtiği için karışıklık olmasın diye Listeria ile değiştirildi.)\n💡 **Ezber ipucu:** Biyoterör + Gram pozitif sporlu basil = B. anthracis.", "org": ["anthracis"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Bir çiftlikte bulunan enfekte hayvanları muayene eden bir veterinerde akut hemorajik mediastinit ve solunum yetmezliği gelişmiştir. Balgam örneğinde geniş, uzun, düz, Gram pozitif, kapsüllü basiller izlenmiştir. Bu hastada klinik tabloya yol açan en olası patojen hangisidir?", "opts": [{"t": "Brucella melitensis"}, {"t": "Corynebacterium diphtheriae"}, {"t": "Streptococcus pneumoniae"}, {"t": "Legionella pneumophila"}, {"t": "Bacillus anthracis"}], "a": 4, "exp": "📖 Kitap:\nHayvanla temas öyküsü + hemorajik mediastinit + Gram pozitif basiller = **inhalasyon (akciğer) şarbonu**. Sporların inhalasyon yoluyla (hayvanlar, hayvan ürünleri ya da biyoterör ajanı olarak) alınmasıyla gelişir; kuluçka süresi en uzun şarbon kliniğidir (6–8 hafta) ve hemorajik mediastinal lenfadenite (akciğer grafisinde mediastinal lenf bezlerinde genişleme) neden olur. Maruziyet sonrası profilakside 3 doz aşı yapılır ve 60 gün süreyle siprofloksasin ya da doksisiklin verilir.\n📑 Slaytta:\nŞarbonun üç formu **deri, bağırsak ve akciğer şarbonudur**. **Sığır konaktır, insan rastlantısal konaktır** (veteriner = hayvan teması). B. anthracis **kapsüllüdür** (poli-D-glutamik asit, fagositozu önler) ve aerobik Gram pozitif **sporlu** basildir. Tedavi siprofloksasin + doksisiklin; aşı etkili ama toksiktir.\nDiğer şıklar:\n• Brucella melitensis → hayvan teması (koyun, keçi) öyküsü uyar ama Gram **negatif**, çok küçük bir bakteridir; dalgalı ateş yapar.\n• C. diphtheriae → Gram pozitif basil ama **sadece insanda** bulunur, kapsülü tanımlanmaz; respiratuvar/kutanöz difteri yapar.\n• S. pneumoniae → Gram pozitif **kok** (polisakkarit kapsüllü).\n• L. pneumophila → tabloda pnömoni etkeni, Gram negatiftir.\n💡 **Ezber ipucu:** Hayvan teması + ağır solunum tablosu + Gram + kapsüllü basil = akciğer şarbonu.", "org": ["anthracis"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Bir tümör hücresine bağlanarak etkinlik gösteren monoklonal antikor ve buna bağlanmış, hücrenin protein sentezini durdurarak hücreyi öldüren bir toksin ile tümör tedavisi planlanmaktadır. Bu amaçla hangi bakteriye ait toksin kullanılmalıdır?", "opts": [{"t": "E. coli – LT"}, {"t": "C. diphtheriae – Difteri toksini"}, {"t": "S. aureus – TSST-1"}, {"t": "B. anthracis – EF"}, {"t": "C. botulinum – Botulinum toksini"}], "a": 1, "exp": "📖 Kitap:\nDifteri toksini ADP ribozilasyonu ile EF-2'yi inaktive eder, hücrede protein sentezini durdurur ve hücre ölür. Bu nedenle difteri toksini **sitotoksik** ve **antitümoral** etkili bir toksin olarak sorulur. Toksin faj aracılı kodlanır; salıverilmesi ortamdaki demir miktarıyla ilişkilidir (demir düşükken artar) ve etki mekanizması Pseudomonas ekzotoksin A'ya benzer.\n📑 Slaytta:\nC. diphtheriae **lizojenik β-faj** oluşturarak **A ve B ekzotoksin** ile difteriye neden olur; toksin **protein zinciri uzama faktörü-2'yi inhibe eder**. Soruda istenen \"protein sentezini durdurarak hücreyi öldürme\" tam olarak bu mekanizmadır.\nDiğer şıklar:\n• B. anthracis EF (ödem faktörü) → slayta göre **adenilat siklaz** etkisiyle ödem yapar; protein sentezini durdurmaz.\n• E. coli LT → bağırsakta sulu ishal yapan enterotoksin; S. aureus TSST-1 → toksik şok sendromu toksini; botulinum toksini → nörotoksin. Hiçbiri protein sentezini durdurarak hücre öldürmez.\n💡 **Ezber ipucu:** \"Protein sentezini durdurup hücreyi öldüren toksin\" = difteri toksini (EF-2).", "org": ["diphtheriae"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Difteri toksini ile ilgili aşağıdakilerden hangisi **doğru değildir**?", "opts": [{"t": "Salıverilmesi ortamdaki demir miktarı ile ilişkilidir"}, {"t": "EF-2 inaktivasyonu ile protein sentezini durdurmaktadır"}, {"t": "Etki mekanizması Pseudomonas ekzotoksin A'sına benzemektedir"}, {"t": "Plazmid tarafından kodlanmaktadır"}, {"t": "Sitotoksik ve antitümoral etkilidir"}], "a": 3, "exp": "📖 Kitap:\nDifteri toksini **faj aracılı** kodlanır (lizojenik faj konversiyonu); plazmid tarafından kodlanmaz. Ortamdaki demir miktarı düştüğünde difteri toksininin salıverilmesi artar; bakteri demiri sideroforlarıyla konaktan temin eder. Toksin ADP ribozilasyonu ile EF-2'yi inaktive ederek protein sentezini durdurur ve hücre ölür; Pseudomonas ekzotoksin A da aynı mekanizmayla etki eder. Bu yüzden sitotoksik ve antitümoral etkili toksin olarak da sorulur.\n📑 Slaytta:\nC. diphtheriae **lizojenik β-faj oluşturarak** A ve B ekzotoksin ile difteriye neden olur ve toksin **protein zinciri uzama faktörü-2'yi** inhibe eder. Yani toksin genini taşıyan yapı plazmid değil **bakteriyofajdır**; \"plazmid tarafından kodlanır\" ifadesi bu nedenle yanlıştır. EF-2 şıkkı da slaytta doğrudan geçen doğru bilgidir.\nDiğer doğru şıklar (demir ilişkisi, Pseudomonas ekzotoksin A benzerliği, antitümoral etki) kitabın ek bilgileridir.\n💡 **Ezber ipucu:** Difteri toksini = faj (plazmid değil) + EF-2.", "org": ["diphtheriae"], "shuf": true, "tag": "Feyyaz Akay", "html": true}, {"q": "Hücresel immün yetmezliği olanlarda meningoensefalit etkeni olan; kavun, süt ve süt ürünleri kaynaklı besin zehirlenmesine neden olabilen, psikrofil, Gram pozitif sporsuz basil hangisidir?", "opts": [{"t": "Listeria monocytogenes"}, {"t": "Yersinia enterocolitica"}, {"t": "Mycobacterium bovis"}, {"t": "Brucella abortus"}, {"t": "Staphylococcus aureus"}], "a": 0, "exp": "📖 Kitap:\nHücresel yanıtı baskılanmış bireylerde menenjite (meningoensefalite), immün sistemi normal konakta ise kavun ve süt kaynaklı besin zehirlenmesine neden olabilen **psikrofil** (soğukta üreyebilen) bakteri **Listeria**'dır. Listeria fakültatif hücre içi bir bakteridir; yenidoğanda erken dönemde granülomatozis infantiseptika, geç dönemde menenjit yapar.\n📑 Slaytta:\nAerobik Gram pozitif basillerde **spor oluşturmayan** grup Listeria ve Corynebacterium'dur. Listeria **buzdolabında ve yüksek tuzda yaşayabilir** (psikrofil özellik); işlenmiş et, çiğ sebze, sosis, süt, krem peynir gibi kontamine gıdalarla bulaşır; **hücre içi fakültatiftir**. **Hasta kişiler, yenidoğan ve yaşlılar** yüksek risklidir ve hastalıkları arasında **ateşli bakteriyemi ve menenjit** vardır. Tedavi penisilin ve ampisilin.\nDiğer şıklar:\n• Yersinia ve Brucella → Gram **negatif** bakterilerdir (Brucella sığırdan bulaşan, çiğ süt ürünleriyle ilişkili dalgalı ateş etkeni).\n• S. aureus → Gram pozitif **kok**tur; besin zehirlenmesi yapar ama menenjit tablosunda yer almaz.\n• M. bovis → aside dirençli mikobakteri; Gram pozitif sporsuz basil tanımına ve menenjit/besin zehirlenmesi kombinasyonuna uymaz.\n💡 **Ezber ipucu:** Soğukta üreyen + süt ürünü + immün yetmezlikte menenjit = Listeria.", "org": ["listeria"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Akut bakteriyel menenjit ön tanısı konulan ve altta yatan herhangi bir hastalığı bulunmayan 70 yaşındaki bir hastaya ampirik antibiyotik tedavisi başlanırken mutlaka hedef alınması gereken etken mikroorganizma hangisidir?", "opts": [{"t": "Streptococcus pyogenes"}, {"t": "Staphylococcus aureus"}, {"t": "Listeria monocytogenes"}, {"t": "Corynebacterium jeikeium"}, {"t": "Neisseria gonorrhoeae"}], "a": 2, "exp": "📖 Kitap:\nL. monocytogenes hücre içi bir bakteridir ve ona karşı temel immün yanıt **hücresel** tiptedir. Yenidoğan dönemi, **yaşlılık**, gebelik, organ transplant alıcılığı, AIDS gibi hücresel yanıtın azaldığı durumlarda menenjite neden olur. Bu yüzden ileri yaştaki hastada ampirik menenjit tedavisi Listeria'yı da kapsamalıdır.\n📑 Slaytta:\nListeria için **yenidoğan, yaşlı ve hasta kişiler yüksek risklidir**; hastalıkları arasında **ateşli bakteriyemi ve menenjit** vardır ve menenjit etkenleri tablosunda (S. agalactiae, E. coli, H. influenzae, S. pneumoniae, N. meningitidis ile birlikte) **Listeria monocytogenes** yer alır. Listeria **hücre içi fakültatiftir**. Tedavide **penisilin ve ampisilin** kullanılır.\nDiğer şıklar:\n• S. pyogenes → farenjit, impetigo, erizipel, selülit; S. aureus → deri/yumuşak doku, endokardit, osteomiyelit. İkisi de tabloda menenjit etkeni değildir.\n• N. gonorrhoeae → üretrit, servisit, proktit, artrit (cinsel yolla).\n• C. jeikeium → deri ve mukozadaki fırsatçı/kontaminant korinebakterilerden biri; toplum kökenli menenjit etkeni değildir.\n💡 **Ezber ipucu:** Yaşlı (veya yenidoğan, gebe, immün yetmezlikli) + menenjit → Listeria'yı unutma (ampisilin).", "org": ["listeria"], "shuf": true, "tag": "Feyyaz Akay"}]}, {"title": "Aside Dirençli Bakteriler", "desc": "Tüberküloz, lepra, M. avium, Nocardia ve akrabaları; mikolik asit ve granülom mantığı", "short": "ARB", "questions": [{"q": "Aside dirençli bakterilerin asitle boyanmaya direnç göstermesinin nedeni nedir?", "opts": [{"t": "Polisakkarit kapsül"}, {"t": "Lipopolisakkarit (LPS)"}, {"t": "Hücre duvarındaki mikolik asitler"}, {"t": "Spor yapıları"}, {"t": "Pilin"}], "a": 2, "exp": "**Doğru cevap: Hücre duvarındaki mikolik asitler.**\nSlayta göre aside dirençli bakteriler (Mycobacterium, Nocardia, Rhodococcus, Gordonia, Tsukamurella) hareketsiz, sporsuz Gram pozitif basillerdir ve **hücre duvarlarındaki mikolik asitler** sayesinde asitle boyanmaya (asitle renk gidermeye) direnç gösterirler. Aynı lipitten zengin duvar, bu bakterilerin **sert çevre şartlarına, dezenfektanlara ve antibiyotiklere dirençli** olmasını ve **yavaş üremesini** de açıklar.\nYanlış şıklar:\n- **Polisakkarit kapsül** → slaytta S. aureus, S. pneumoniae, H. influenzae gibi bakterilerde fagositozdan korunma aracıdır; boyanma direnciyle ilgisi yoktur.\n- **Lipopolisakkarit (LPS)** → Gram negatiflerin dış membran yapısıdır; aside dirençliler Gram pozitif yapıdadır.\n- **Spor yapıları** → aside dirençliler **sporsuzdur**.\n- **Pilin** → tutunma (adezyon) yapısıdır, boyanmayı etkilemez.\n💡 **Ezber ipucu:** \"Mikolik asit = aside direnç + dezenfektan/antibiyotik direnci + yavaş üreme\".", "org": ["tbc", "leprae", "avium", "nocardia", "rhodococcus"], "shuf": true}, {"q": "Aşağıdakilerden hangisi aside dirençli bakteriler grubunda **değildir**?", "opts": [{"t": "Listeria"}, {"t": "Rhodococcus"}, {"t": "Mycobacterium"}, {"t": "Nocardia"}, {"t": "Gordonia / Tsukamurella"}], "a": 0, "exp": "**Doğru cevap: Listeria.**\nSlayttaki aside dirençli bakteriler listesi: **Mycobacterium, Nocardia, Rhodococcus, Gordonia ve Tsukamurella**. Hepsi hareketsiz, sporsuz Gram pozitif basillerdir ve hücre duvarlarında mikolik asit taşırlar.\n**Listeria** ise \"Aerobik Gram Pozitif Basiller\" sunumunda, Corynebacterium ile birlikte **spor oluşturmayan aerobik Gram pozitif basiller** arasında yer alır; aside dirençli değildir. Listeria hücre içi fakültatif bir patojendir, buzdolabı ısısında ve yüksek tuzda yaşayabilir, kontamine gıdalarla bulaşır.\nDiğer şıklar (Rhodococcus, Mycobacterium, Nocardia, Gordonia/Tsukamurella) slayttaki aside dirençli listenin doğrudan üyeleridir.\n💡 **Ezber ipucu:** Aside dirençli 5'li: \"**M**yco – **N**ocardia – **R**hodococcus – **G**ordonia – **T**sukamurella\".", "org": ["listeria", "tbc", "leprae", "avium", "nocardia", "rhodococcus"], "shuf": true, "html": true}, {"q": "Aside dirençli bakterilerle ilgili hangisi doğrudur?", "opts": [{"t": "Granülomlar bakterileri tamamen öldürür"}, {"t": "Hızlı ürerler"}, {"t": "Dezenfektanlara çok duyarlıdırlar"}, {"t": "Hastalık persistan kalabilir ve ortaya çıkması konağın immün yeteneğine bağlıdır"}, {"t": "Fagozom–lizozom birleşmesini hızlandırırlar"}], "a": 3, "exp": "**Doğru cevap: Hastalık persistan kalabilir ve ortaya çıkması konağın immün yeteneğine bağlıdır.**\nSlayta göre aside dirençli bakterilerde **hastalık persistan olarak kalabilir; ortaya çıkması konağın immün yeteneğine bağlıdır.** Bu yüzden örneğin M. avium AIDS'lilerde, Nocardia ve Rhodococcus immün yetmezliği olanlarda öne çıkar; leprada da formu (tüberküloid/lepromatöz) konağın immün yanıtı belirler.\nYanlış şıklar:\n- **Granülomlar bakterileri tamamen öldürür** → slayta göre granülomlar enfeksiyonu **sınırlar ama bakterilerin canlı kalmasını da sağlar**.\n- **Hızlı ürerler** → bu bakteriler **yavaş ürer** (M. tuberculosis'te 2–6 hafta inkübasyon gerekir).\n- **Dezenfektanlara çok duyarlıdırlar** → tersine sert çevre şartlarına, **dezenfektanlara ve antibiyotiklere dirençlidirler**.\n- **Fagozom–lizozom birleşmesini hızlandırırlar** → tüberkülozda olduğu gibi bu birleşmeyi **engellerler**; böylece makrofaj içinde canlı kalırlar.\n💡 **Ezber ipucu:** Aside dirençliler = yavaş, dirençli, persistan; sonucu konağın bağışıklığı belirler.", "org": ["tbc", "leprae", "avium", "nocardia", "rhodococcus"], "shuf": true}, {"q": "İmmün yetmezliği olan kişilerde primer invaziv pulmoner hastalık oluşturan aside dirençli bakteri hangisidir?", "opts": [{"t": "Listeria"}, {"t": "Rhodococcus"}, {"t": "Mycobacterium leprae"}, {"t": "Tsukamurella"}, {"t": "Gordonia"}], "a": 1, "exp": "**Doğru cevap: Rhodococcus.**\nSlayta göre **Rhodococcus immün yetmezliği olan kişilerde patojendir ve primer invaziv pulmoner hastalık oluşturur.** Rhodococcus da hücre duvarında mikolik asit taşıyan aside dirençli bakteriler grubundadır.\nYanlış şıklar:\n- **Gordonia** ve **Tsukamurella** → slaytta fırsatçıdır; **pulmoner enfeksiyonlara ve İV kateter enfeksiyonlarına** neden olur (primer invaziv pulmoner hastalık ifadesi Rhodococcus için kullanılır).\n- **Mycobacterium leprae** → cüzzam (lepra) etkenidir; deri ve sinir tutulumuyla bilinir, kültürde üretilememiştir.\n- **Listeria** → aside dirençli değildir; spor oluşturmayan aerobik Gram pozitif basildir ve menenjit, yenidoğan hastalığı yapar.\n💡 **Ezber ipucu:** \"**R**hodococcus = p**R**imer invaziv pulmoner\"; \"Gordonia/Tsukamurella = akciğer + kateter\".", "org": ["rhodococcus"], "shuf": true}, {"q": "Mycobacterium tuberculosis patogenezinin slayttaki doğru sırası hangisidir?", "opts": [{"t": "Solunum yolu → alveol penetrasyonu → makrofaj fagositozu → fagozom-lizozom birleşme engeli → sitokinler, T ve NK hücre gelişi → makrofaj aktivasyonu → nekrotik hücreler (granülom)"}, {"t": "Solunum yolu → alveol penetrasyonu → nötrofil fagositozu → fagozom-lizozom birleşmesi → bakterinin tamamen ölümü → iyileşme"}, {"t": "Solunum yolu → alveol penetrasyonu → makrofaj fagositozu → fagozom-lizozom birleşmesinin hızlanması → irin ve apse oluşumu"}, {"t": "Kan yolu → alveol → makrofaj aktivasyonu → T ve NK hücre gelişi → makrofaj fagositozu → granülom"}, {"t": "Solunum yolu → granülom oluşumu → makrofaj fagositozu → sitokin salınımı → alveol penetrasyonu"}], "a": 0, "exp": "**Doğru cevap: Solunum yolu → alveol penetrasyonu → makrofaj fagositozu → fagozom-lizozom birleşme engeli → sitokinler, T ve NK hücre gelişi → makrofaj aktivasyonu → nekrotik hücreler (granülom).**\nSlayttaki patogenez sırası budur. Bakteri **aerosolle** solunum yoluna girer, alveollere ulaşır ve makrofajlarca fagosite edilir; ancak **fagozom ve lizozomun birleşmesini engellediği** için makrofaj içinde ölmez. Ardından salınan sitokinlerle **T ve NK hücreleri** bölgeye gelir, makrofajlar aktive olur ve ortada **nekrotik hücrelerden oluşan granülom** gelişir. Granülom enfeksiyonu sınırlar ama bakterinin canlı kalmasını da sağlar; hastalık bu yüzden **persistandır**.\nYanlış şıklar:\n- **Nötrofil fagositozu → bakterinin tamamen ölümü** → tüberkülozda bakteri makrofaj içinde yaşar; tamamen ölüm olmaz.\n- **Birleşmenin hızlanması → irin/apse** → bakteri birleşmeyi **engeller**; irin ve akut nötrofilik inflamasyon (piyojenik tablo) slaytta S. aureus gibi bakteriler için anlatılır.\n- **Kan yoluyla başlayan sıra** → bulaş kişiden kişiye **aerosol** iledir; ayrıca makrofaj aktivasyonu fagositozdan önce gelmez.\n- **Granülomla başlayan sıra** → granülom sürecin **son** basamağıdır.\n💡 **Ezber ipucu:** \"Gir – yut – birleştirme – çağır (T/NK) – aktive et – granülom\".", "org": ["tbc"], "shuf": true}, {"q": "Tüberkülozla ilgili slayttaki sayısal bilgilerden hangisi doğrudur?", "opts": [{"t": "Kültürde 2–3 günde ürer"}, {"t": "Deri testi negatiftir"}, {"t": "Dünya nüfusunun yarısı enfektedir; 2019'da 14 milyon ölüm"}, {"t": "ABD'de yılda 200 olgu görülür"}, {"t": "Dünya nüfusunun yaklaşık 1/4'ü enfekte olmuştur; 2019'da 1,4 milyon ölüm"}], "a": 4, "exp": "**Doğru cevap: Dünya nüfusunun yaklaşık 1/4'ü enfekte olmuştur; 2019'da 1,4 milyon ölüm.**\nSlayta göre **dünyada her 4 kişiden 1'i M. tuberculosis ile enfekte olmuştur** ve tüberküloz **2019'da 1,4 milyon kişinin ölümüne** neden olmuştur. Slayttaki diğer sayısal bilgi: **ABD'de yılda 9000 enfeksiyon, göçmenlerde** saptanır.\nYanlış şıklar:\n- **Kültürde 2–3 günde ürer** → M. tuberculosis **yavaş ürer**, **2–6 hafta inkübasyon** gerekir (3–4 günde üreyen Nocardia'dır).\n- **Deri testi negatiftir** → slayta göre tüberkülozda **deri testi pozitiftir**.\n- **Nüfusun yarısı; 14 milyon ölüm** → oran 1/4, ölüm sayısı 1,4 milyondur (sayılar abartılmış).\n- **ABD'de yılda 200 olgu** → bu sayı **lepraya** aittir (ABD'de yıllık 200 yeni lepra olgusu); tüberkülozda 9000'dir.\n💡 **Ezber ipucu:** TB → \"1/4 dünya, 1,4 milyon ölüm, ABD 9000\"; Lepra → \"ABD 200\".", "org": ["tbc"], "shuf": true}, {"q": "Tüberküloz epidemiyolojisiyle ilgili hangisi **yanlıştır**?", "opts": [{"t": "Kontamine su ve besinle bulaşır"}, {"t": "İnsan tek rezervuardır"}, {"t": "Kişiden kişiye aerosolle bulaşır"}, {"t": "HIV, immün yetersizlik, ilaç ve alkol bağımlılığı ile evsizlik risk faktörüdür"}, {"t": "Doğu Avrupa, Afrika, Çin, Hindistan ve Pakistan'da görülür"}], "a": 0, "exp": "**Doğru cevap: Kontamine su ve besinle bulaşır.**\nBu ifade slaytta tüberküloz için değil, **Mycobacterium avium** için geçer (M. avium kontamine su ve besinle bulaşır; tüberkülozun az olduğu ülkelerde görülür).\nSlayttaki tüberküloz epidemiyolojisi (diğer şıklar doğrudur):\n- **Kişiden kişiye aerosol bulaşma** vardır.\n- **İnsan tek rezervuardır.**\n- **İmmün yetersizlik, HIV enfeksiyonu, ilaç ve alkol bağımlılığı ile evsizlik** risk faktörüdür.\n- **Doğu Avrupa, Afrika, Çin, Hindistan ve Pakistan'da** görülür; ABD'de yılda 9000 enfeksiyon göçmenlerde saptanır.\n💡 **Ezber ipucu:** TB = \"insan → aerosol → insan\"; M. avium = \"su ve besin\".", "org": ["tbc", "avium"], "shuf": true, "html": true}, {"q": "Tüberküloz tedavisi ve korunmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Penisilin V yeterlidir"}, {"t": "Rifampisin, etambutol, izoniazid kullanılır; profilakside izoniazid + rifapentin verilir; BCG aşısı uygulanır"}, {"t": "Aşısı yoktur"}, {"t": "Profilakside 18 ay dapson verilir"}, {"t": "Tedavi her bölgede aynıdır ve hiç değişmez"}], "a": 1, "exp": "**Doğru cevap: Rifampisin, etambutol, izoniazid kullanılır; profilakside izoniazid + rifapentin verilir; BCG aşısı uygulanır.**\nSlayta göre tüberküloz tedavisinde **rifampisin (rifamisin), etambutol ve izoniazid** kullanılır; **profilakside 3 ay izoniazid ve rifapentin** verilir; **Bacille Calmette-Guérin (BCG) aşısı** uygulanır. Ayrıca **dikkatli olgu takibi ve tarama** ile hastalık kontrolü sağlanır. İlaçların etki yerleri (antibiyotik tablosu): izoniazid mikolik asit sentezini, etambutol arabinogalaktan sentezini inhibe eder; rifampin DNA'ya bağımlı RNA polimerazı bloke eder. (Rifampisinin idrar ve gözyaşını turuncuya boyaması zararsız ama bilinen bir özelliğidir.)\nYanlış şıklar:\n- **Penisilin V yeterlidir** → penisilin aside dirençli bakterilerin tedavisinde yer almaz.\n- **Aşısı yoktur** → BCG aşısı vardır.\n- **Profilakside 18 ay dapson** → dapson **lepra** ilacıdır; 18 ay da **lepromatöz lepranın** tedavi süresidir.\n- **Tedavi her bölgede aynıdır** → slayta göre **tedavi hızla değişir, bu nedenle bölgeseldir**.\n💡 **Ezber ipucu:** TB tedavi \"R-E-İ\"; profilaksi \"3 ay İ + Rifapentin\"; aşı \"BCG\".", "org": ["tbc"], "shuf": true}, {"q": "Kültürde üretilememiş olan ve cüzzama neden olan bakteri hangisidir?", "opts": [{"t": "Rhodococcus"}, {"t": "Mycobacterium avium"}, {"t": "Nocardia"}, {"t": "Mycobacterium leprae"}, {"t": "Mycobacterium tuberculosis"}], "a": 3, "exp": "**Doğru cevap: Mycobacterium leprae.**\nSlayta göre **M. leprae kültürde üretilememiştir ve cüzzam (lepra) hastalığının** etkenidir. Tüberküloid lepra ya da lepromatöz lepra yapar; yara eksüdaları, deri/solunum salgıları ve aerosollerle vücuda girer, yavaş ürediği için **klinik belirtilerin ortaya çıkması yıllar sürer**; deri testi pozitiftir.\nYanlış şıklar:\n- **Mycobacterium tuberculosis** → kültürde **ürer** ama yavaştır (**2–6 hafta** inkübasyon); tüberküloz etkenidir.\n- **Mycobacterium avium** → kültürde ürer; slayta göre kültürde **çevresel kontaminasyonlar** görülebilir.\n- **Nocardia** → kültürde **3–4 günde** ürer.\n- **Rhodococcus** → immün yetmezlikte primer invaziv pulmoner hastalık etkenidir; cüzzamla ilgisi yoktur.\n💡 **Ezber ipucu:** \"Kültürde **hiç** üretilememiş = M. leprae; **yavaş** üreyen = M. tuberculosis; **3–4 gün** = Nocardia\".", "org": ["leprae"], "shuf": true}, {"q": "Tüberküloid ve lepromatöz lepra ayrımıyla ilgili hangisi doğrudur?", "opts": [{"t": "Lepromatöz form bulaşıcı değildir"}, {"t": "Lepromatöz formun tedavisi tüberküloidden daha kısadır"}, {"t": "Tüberküloid leprada hücresel bağışıklık ile sitokin üretimi artar, makrofajlar basilleri temizler; lepromatöz formda bol basil ve yaygın nekroz vardır"}, {"t": "Tüberküloid leprada bol aside dirençli basil ve yaygın nekroz görülür"}, {"t": "İkisi arasında fark yoktur"}], "a": 2, "exp": "**Doğru cevap: Tüberküloid leprada hücresel bağışıklık ile sitokin üretimi artar, makrofajlar basilleri temizler; lepromatöz formda bol basil ve yaygın nekroz vardır.**\nSlayta göre **hücresel bağışıklık ile sitokin üretimi artarak makrofajlar basilleri temizler ve tüberküloid lepra olur**. Buna karşılık **bol miktarda aside dirençli basilin olduğu ve yaygın nekrozun görüldüğü** tabloda **lepromatöz lepra** gelişir. Yani formu konağın immün yanıtı belirler.\nYanlış şıklar:\n- **Lepromatöz form bulaşıcı değildir** → slayta göre **lepromatöz form yüksek bulaşıcıdır** (çünkü basil çok fazladır).\n- **Lepromatöz formun tedavisi daha kısadır** → tersine: tüberküloid **6 ay**, lepromatöz **18 ay**.\n- **Tüberküloid leprada bol basil ve yaygın nekroz** → bu, **lepromatöz** formun tanımıdır; iki form yer değiştirilmiş.\n- **İkisi arasında fark yoktur** → immün yanıt, basil yükü, bulaşıcılık ve tedavi süresi açısından farklıdırlar.\n💡 **Ezber ipucu:** **T**überküloid = **T** hücre yanıtı iyi, az basil, 6 ay; **L**epromatöz = **L**ots of basil, nekroz, çok bulaşıcı, 18 ay.", "org": ["leprae"], "shuf": true}, {"q": "Lepra tedavisinde kullanılan ilaçlar ve süreler hangisidir?", "opts": [{"t": "Rifampisin, dapson, klofazimin; tüberküloid 18 ay, lepromatöz 6 ay"}, {"t": "İzoniazid ve etambutol; her iki form 3 ay"}, {"t": "Rifampisin, dapson, klofazimin; tüberküloid lepra 6 ay, lepromatöz lepra 18 ay"}, {"t": "Kolistin; 12 ay"}, {"t": "Penisilin; 10 gün"}], "a": 2, "exp": "**Doğru cevap: Rifampisin, dapson, klofazimin; tüberküloid lepra 6 ay, lepromatöz lepra 18 ay.**\nSlayta göre lepra tedavisinde **rifampisin (rifamisin), dapson ve klofazimin** kullanılır; süre **tüberküloid lepra için 6 ay, lepromatöz lepra için 18 ay**dır. **Karantina ve tedavi önemlidir.** Dapson, antibiyotik tablosunda **dihidropteroat sentazı inhibe eden** ve mikobakterilere etkili bir antimetabolittir.\nYanlış şıklar:\n- **Aynı ilaçlar ama tüberküloid 18 ay, lepromatöz 6 ay** → süreler **ters** verilmiştir; basil yükü yüksek olan lepromatöz form daha uzun tedavi ister.\n- **İzoniazid ve etambutol; 3 ay** → izoniazid ve etambutol **tüberküloz** ilaçlarıdır; \"3 ay\" tüberküloz **profilaksisinin** (izoniazid + rifapentin) süresidir.\n- **Kolistin; 12 ay** → kolistin Gram negatiflere etkili polipeptiddir (Gram pozitiflere etkisiz); 12 ay **Nocardia** tedavi süresidir.\n- **Penisilin; 10 gün** → aside dirençlilerin tedavisinde yer almaz.\n💡 **Ezber ipucu:** Lepra = \"**R-D-K**\" (Rifampisin-Dapson-Klofazimin), \"T 6 – L 18\".", "org": ["leprae"], "shuf": true}, {"q": "AIDS hastalarında en sık rastlanan fırsatçı enfeksiyon etkeni olan, kontamine su ve besinle bulaşan mikobakteri hangisidir?", "opts": [{"t": "Mycobacterium avium"}, {"t": "Mycobacterium leprae"}, {"t": "Mycobacterium tuberculosis"}, {"t": "Gordonia"}, {"t": "Rhodococcus"}], "a": 0, "exp": "**Doğru cevap: Mycobacterium avium.**\nSlayta göre **M. avium, AIDS hastalarında en sık rastlanan fırsatçı enfeksiyondur** ve **kontamine su ve besinle bulaşır**. Ayrıca tüberkülozun az olduğu ülkelerde görülür; akciğer hastalığı olanlarda yavaş, immün yetmezliği olanlarda hızlı ilerler; kronik akciğer hastalığı ve immün yetmezlik risk oluşturur.\nYanlış şıklar:\n- **Mycobacterium tuberculosis** → **kişiden kişiye aerosolle** bulaşır, **insan tek rezervuardır**; su/besinle bulaşmaz.\n- **Mycobacterium leprae** → **yara eksüdaları, deri/solunum salgıları ve aerosollerle** vücuda girer; cüzzam etkenidir.\n- **Gordonia** → fırsatçıdır; **pulmoner ve İV kateter enfeksiyonu** yapar.\n- **Rhodococcus** → immün yetmezlikte **primer invaziv pulmoner hastalık** yapar.\n💡 **Ezber ipucu:** \"AIDS + su/besin = M. **avium**\".", "org": ["avium"], "shuf": true}, {"q": "Mycobacterium avium tedavisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Dapson ve klofazimin kullanılır"}, {"t": "Etambutol ve rifabutin kullanılır; idamede ve CD4 sayısı düşük kişilerde klaritromisin/azitromisin"}, {"t": "Tedavi gerekmez"}, {"t": "Kolistin tek seçenektir"}, {"t": "Penisilin ve ampisilin yeterlidir"}], "a": 1, "exp": "**Doğru cevap: Etambutol ve rifabutin kullanılır; idamede ve CD4 sayısı düşük kişilerde klaritromisin/azitromisin.**\nSlayta göre M. avium tedavisinde **etambutol ve rifabutin** kullanılır; **klaritromisin ve azitromisin idame tedavisinde ve CD4 sayısı düşük kişilerde** kullanılır. Antibiyotik tablosuna göre etambutol **arabinogalaktan sentezini**, rifabutin **DNA'ya bağımlı RNA polimerazı** inhibe eder; klaritromisin ve azitromisin (makrolid) **bazı mikobakterilere de etkindir**.\nYanlış şıklar:\n- **Dapson ve klofazimin** → bunlar (rifampisinle birlikte) **lepra** ilaçlarıdır.\n- **Tedavi gerekmez** → M. avium özellikle immün yetmezlikte hızlı ilerler; tedavi gerekir.\n- **Kolistin tek seçenektir** → kolistin Gram negatiflere etkilidir, Gram pozitif yapıdaki mikobakterilere etkisizdir (slaytta \"tek etkili antibiyotik\" ifadesi Acinetobacter için geçer).\n- **Penisilin ve ampisilin** → **Listeria** tedavisidir.\n💡 **Ezber ipucu:** M. avium = \"**E**tambutol + **R**ifa**b**utin\", idame \"klaritro/azitro\".", "org": ["avium"], "shuf": true}, {"q": "M. avium hastalık formları arasında slaytta **sayılmayan** hangisidir?", "opts": [{"t": "Pulmoner enfeksiyonlar"}, {"t": "Dissemine hastalık"}, {"t": "Servikal adenit"}, {"t": "Lepromatöz lepra"}, {"t": "Hepsi sayılmıştır"}], "a": 3, "exp": "**Doğru cevap: Lepromatöz lepra.**\nSlaytta M. avium'un hastalık formları üç tanedir: **pulmoner enfeksiyonlar, servikal adenit (boyun lenf bezi iltihabı) ve dissemine hastalık**. Dissemine form özellikle AIDS'li ve immün yetmezliği olan kişilerde, hastalığın hızlı ilerlemesiyle ilgilidir; pulmoner form ise kronik akciğer hastalığı olan yaşlılarda öne çıkar (bu kişilerde çok sayıda balgam örneği incelenmelidir).\n**Lepromatöz lepra**, **M. leprae**'nin (tüberküloid lepra ile birlikte) yaptığı hastalık formudur; bol aside dirençli basil ve yaygın nekrozla seyreder.\n\"Hepsi sayılmıştır\" şıkkı da yanlıştır, çünkü lepromatöz lepra M. avium için sayılmaz.\n💡 **Ezber ipucu:** M. avium \"**P-S-D**\": Pulmoner – Servikal adenit – Dissemine.", "org": ["avium", "leprae"], "shuf": false, "html": true}, {"q": "Nocardia ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "Organik topraklarda bulunur ve immün yetmezlikte fırsatçı enfeksiyon yapar"}, {"t": "Kısmi aside dirençlidir ve uzun dallanan filamentler oluşturur"}, {"t": "Kültürde 3–4 günde ürer"}, {"t": "Fransız veteriner Edmond Nocard'a ithaf edilmiştir"}, {"t": "Kişiden kişiye aerosolle bulaşır ve insan tek rezervuardır"}], "a": 4, "exp": "**Doğru cevap: Kişiden kişiye aerosolle bulaşır ve insan tek rezervuardır.**\nBu iki ifade slaytta **M. tuberculosis** epidemiyolojisi için geçer. Nocardia ise **eksojen** bir bakteridir: **organik topraklarda** bulunur, **dünyada yaygındır** ve eksojen enfeksiyonlar **inhalasyon ve kutanöz travma** ile oluşur. Bu yüzden kişiden kişiye bulaş ve \"insan tek rezervuar\" ifadesi Nocardia için yanlıştır.\nDoğru olan (slayttaki) Nocardia özellikleri:\n- Organik topraklarda bulunur ve **immün yetmezlikte** (HIV, kanser, transplantasyon vb.) fırsatçı enfeksiyon yapar.\n- **Kısmi aside dirençlidir (kısmi ARB)** ve **uzun dallanan filamentler** oluşturur.\n- Kültürde **3–4 günde** ürer.\n- **Fransız veteriner Edmond Nocard'a** ithaf edilmiştir.\n💡 **Ezber ipucu:** Nocardia = \"toprak + travma/inhalasyon\"; TB = \"insan + aerosol\".", "org": ["nocardia", "tbc"], "shuf": true, "html": true}, {"q": "Pnömoni olarak başlayıp beyinde ve deride apselere dönüşebilen aside dirençli bakteri hangisidir?", "opts": [{"t": "Bacillus cereus"}, {"t": "Corynebacterium diphtheriae"}, {"t": "Mycobacterium leprae"}, {"t": "Nocardia"}, {"t": "Listeria"}], "a": 3, "exp": "**Doğru cevap: Nocardia.**\nSlayta göre Nocardia'da **pnömoni olarak başlayan enfeksiyon beyinde ve deride apselere dönüşür**. Slayttaki Nocardia hastalıkları: **bronkopulmoner hastalık, miçetom, lenfokutanöz hastalık, selülit, subkutan apseler ve beyin apsesi**. Bakteri kısmi aside dirençlidir, uzun dallanan filamentler yapar ve immün yetmezliği olanlarda fırsatçıdır.\nYanlış şıklar:\n- **Bacillus cereus** → aside dirençli değildir; gastroenterit, travmatik göz enfeksiyonu, fırsatçı enfeksiyonlar ve şarbon benzeri pulmoner hastalık yapar.\n- **Corynebacterium diphtheriae** → aside dirençli değildir; respiratuvar ve kutanöz difteri yapar.\n- **Mycobacterium leprae** → aside dirençlidir ama **cüzzam** (tüberküloid/lepromatöz lepra) etkenidir; pnömoni → beyin apsesi tablosu yapmaz.\n- **Listeria** → aside dirençli değildir; menenjit ve yenidoğan hastalığı yapar.\n💡 **Ezber ipucu:** \"Akciğerden başlayıp beyne ve deriye apse = Nocardia\".", "org": ["nocardia"], "shuf": true}, {"q": "Aşağıdakilerden hangisi Nocardia'nın yaptığı hastalıklardan biridir?", "opts": [{"t": "Boğmaca"}, {"t": "Romatizmal ateş"}, {"t": "Miçetom"}, {"t": "Dalgalı ateş"}, {"t": "Deri şarbonu"}], "a": 2, "exp": "**Doğru cevap: Miçetom.**\nSlayttaki Nocardia hastalıkları: **bronkopulmoner hastalık, miçetom, lenfokutanöz hastalık, selülit, subkutan apseler ve beyin apsesi**. Deri tutulumlu formlar (miçetom, lenfokutanöz hastalık, selülit, subkutan apse), Nocardia'nın **kutanöz travma** ile bulaşabilmesiyle ilişkilidir; akciğer formu ise **inhalasyonla** oluşur.\nYanlış şıklar:\n- **Boğmaca** → **Bordetella pertussis**'in hastalığıdır.\n- **Romatizmal ateş** → **S. pyogenes** farenjiti sonrası (ilk 10 gün içinde tedavi başlamazsa) gelişir.\n- **Dalgalı ateş (bruselloz)** → **Brucella** türlerinin hastalığıdır.\n- **Deri şarbonu** → **Bacillus anthracis**'in hastalığıdır.\n💡 **Ezber ipucu:** Nocardia deride \"**miçetom – lenfokutanöz – selülit – subkutan apse**\", akciğerde \"bronkopulmoner\", SSS'de \"beyin apsesi\".", "org": ["nocardia"], "shuf": true}, {"q": "Nocardia tedavisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Penisilin 10 gün yeterlidir"}, {"t": "Kolistin tek seçenektir"}, {"t": "Temastan kaçınmak kolaydır"}, {"t": "Tedavi 3 ay izoniaziddir"}, {"t": "SXT temel ilaçtır; SSS tutulumunda SXT, imipenem veya sefalosporin kullanılır; tedavi 12 ay sürer"}], "a": 4, "exp": "**Doğru cevap: SXT temel ilaçtır; SSS tutulumunda SXT, imipenem veya sefalosporin kullanılır; tedavi 12 ay sürer.**\nSlayta göre Nocardia tedavisi:\n- İmmün sistemi sağlam kişilerde kutanöz enfeksiyonda **trimetoprim-sülfametoksazol (SXT)**,\n- İmmün yetmezliği olanlarda **SXT + amika
