nız antibiyotik yeterli' → yanlış; hastalığı toksin yaptığı için toksin nötralizasyonu gerekir.\n• Kolistin → çoklu dirençli A. baumannii'nin ilacıdır.\n• Rifamisin + izoniazid + etambutol → tüberküloz tedavisidir.\n• Doğumdan önce anneye penisilin → S. agalactiae'nin yenidoğana geçişini önleme yöntemidir.\n**Akılda kalsın:** Difteri = antibiyotik (penisilin/eritromisin) + toksin nötralizasyonu; korunma toksoid aşı.", "org": ["diphtheriae"], "shuf": true}, {"q": "Toprakla kirlenmiş bir cisimle gözünden yaralanan çiftçide travmatik göz enfeksiyonu (endoftalmit) gelişiyor. Etken toprakta yaygın, sporlu bir Gram (+) basildir. Gözdeki doku hasarından sorumlu faktörler hangileridir?", "opts": [{"t": "Serolizin ve fosfolipaz C (lesitinaz)"}, {"t": "Pilin ve opasite proteinleri"}, {"t": "Filamentöz hemaglutinin ve pertaktin"}, {"t": "Fosforilkolin ve IgA proteaz"}, {"t": "Mikolik asitler"}], "a": 0, "exp": "Toprakta yaygın, **sporlu** Gram (+) basil ve **travmatik göz enfeksiyonu** etkeni **Bacillus cereus**'tur; klinik sendromlar tablosunda endoftalmitin ilk sıradaki etkenidir. Slayta göre B. cereus **serolizin ile hemoliz, PLC (fosfolipaz C) ile lesitinaz** yaparak **gözde doku hasarı** oluşturur; genel olarak da sitotoksik enzimlerle doku hasarı yapar.\nHastalıkları gastroenterit, travmatik göz enfeksiyonu, fırsatçı enfeksiyonlar ve şarbon benzeri pulmoner hastalıktır. Göz enfeksiyonunda **siprofloksasin, klindamisin, vankomisin ve gentamisin** kullanılır; GİS enfeksiyonu semptomatik tedavi edilir. Önemsiz kontaminant olarak da görülebildiğinden tanısı zordur.\n**Neden diğerleri değil:**\n• Pilin ve opasite proteinleri → N. gonorrhoeae'nin tutunma faktörleri.\n• Filamentöz hemaglutinin ve pertaktin → B. pertussis'in trakea epiteline bağlanma proteinleri (aşılar bunlardan yapılır).\n• Fosforilkolin ve IgA proteaz → S. pneumoniae'nın virülans faktörleri.\n• Mikolik asitler → aside dirençli bakterilerin (Mycobacterium, Nocardia vb.) hücre duvarı bileşenidir.\n**Akılda kalsın:** Toprakla göz travması → B. cereus; göz hasarı = serolizin + lesitinaz (PLC).", "org": ["cereus"], "shuf": true}, {"q": "HIV enfeksiyonu olan, evsiz 38 yaşında erkekte aylardır süren öksürük ve kilo kaybı var; balgamda aside dirençli basiller görülüyor. Bu etkenle ilgili hangisi **yanlıştır**?", "opts": [{"t": "Kişiden kişiye aerosolle bulaşır"}, {"t": "Kültürde 2-6 hafta inkübasyon gerekir"}, {"t": "Hayvanlar önemli rezervuardır; insan rastlantısal konaktır"}, {"t": "Fagozom ve lizozom birleşmesini engeller"}, {"t": "Korunmada BCG aşısı uygulanır"}], "a": 2, "exp": "Aside dirençli basil + HIV enfeksiyonu, evsizlik + aylardır süren öksürük ve kilo kaybı = **Mycobacterium tuberculosis**. Slayta göre tüberkülozda **insan tek rezervuardır**; bu yüzden 'hayvanlar önemli rezervuardır, insan rastlantısal konaktır' ifadesi **yanlıştır** (bu tanım Brucella, Francisella ve B. anthracis için geçerlidir).\nDiğer şıklar slayta göre doğrudur:\n• Kişiden kişiye **aerosol** bulaşma vardır.\n• Üremeleri yavaştır; kültürde **2-6 hafta** inkübasyon gerekir.\n• Fagositozda **fagozom ve lizozom birleşmesini engeller**; makrofaj aktivasyonu ve nekrotik hücrelerle **granülom** oluşur. Granülom enfeksiyonu sınırlar ama bakterinin canlı kalmasını da sağlar.\n• Korunmada **BCG aşısı** uygulanır; tedavide rifamisin, etambutol, izoniazid; profilakside 3 ay izoniazid + rifapentin kullanılır.\nRisk faktörleri: immün yetmezlik, HIV, ilaç ve alkol bağımlılığı, evsizlik. Dünya nüfusunun ¼'ü enfekte olmuştur; deri testi pozitiftir.\n**Akılda kalsın:** Tüberküloz → rezervuar yalnız insan, bulaş aerosol.", "org": ["tbc"], "shuf": true, "html": true}, {"q": "Brezilya'dan gelen hastada yıllar içinde gelişen yaygın deri lezyonları var; biyopside bol miktarda aside dirençli basil ve yaygın nekroz görülüyor. Bu tabloyla ilgili doğru ifade hangisidir?", "opts": [{"t": "Tüberküloid formdur; makrofajlar basilleri temizlemiştir"}, {"t": "Lepromatöz formdur; bulaşıcılığı yüksektir"}, {"t": "Etken kültürde 3-4 günde ürer"}, {"t": "Tedavi SXT ile yapılır"}, {"t": "Etken kontamine su ve besinle bulaşan M. avium'dur"}], "a": 1, "exp": "Slayta göre **Mycobacterium leprae** kültürde üretilememiştir ve cüzzam (lepra) yapar; yara eksudaları, deri/solunum salgıları ve aerosollerle vücuda girer, klinik belirtilerin ortaya çıkması **yıllar** sürer. Brezilya ve Endonezya'da görülmüştür.\nİki formu immün yanıta göre ayrılır:\n- **Tüberküloid lepra:** hücresel bağışıklıkla sitokin üretimi artar, **makrofajlar basilleri temizler**.\n- **Lepromatöz lepra:** **bol miktarda aside dirençli basil** ve **yaygın nekroz** görülür; slayta göre **lepromatöz form yüksek bulaşıcıdır**.\nBu hastadaki bol basil + yaygın nekroz lepromatöz formu gösterir. Tedavi **rifamisin, dapson, klofazimin**: tüberküloid lepra için 6 ay, lepromatöz lepra için 18 ay. Karantina ve tedavi önemlidir.\n**Neden diğerleri değil:**\n• Tüberküloid form, makrofajlar basilleri temizlemiş → bu durumda basil az olur; tabloda bol basil var.\n• Kültürde 3-4 günde üreme → Nocardia; M. leprae kültürde üretilememiştir.\n• SXT ile tedavi → Nocardia tedavisidir.\n• Kontamine su ve besinle bulaşan M. avium → AIDS'te fırsatçı pulmoner/dissemine hastalık yapar, lepra yapmaz.\n**Akılda kalsın:** Lepromatöz = bol basil + yaygın nekroz + yüksek bulaşıcılık + 18 ay tedavi.", "org": ["leprae"], "shuf": true}, {"q": "CD4 sayısı çok düşük AIDS hastasında uzun süren ateş ve kilo kaybıyla seyreden dissemine hastalık; kültürde aside dirençli basil üremiş. Etkenin kontamine su ve besinle bulaştığı düşünülüyor. En olası etken ve tedavisi hangisidir?", "opts": [{"t": "M. avium – etambutol + rifabutin; idamede klaritromisin / azitromisin"}, {"t": "M. leprae – dapson"}, {"t": "Nocardia – trimetoprim-sülfametoksazol"}, {"t": "B. anthracis – siprofloksasin"}, {"t": "Listeria – ampisilin"}], "a": 0, "exp": "Slayta göre **Mycobacterium avium** (adını tüberküloz benzeri hastalığın elde edildiği kuşlardan, 'avis') **AIDS hastalarında en sık rastlanan fırsatçı enfeksiyondur**; **kontamine su ve besinle** bulaşır. Akciğer hastalığı olanlarda yavaş, immün yetmezliği olanlarda hızlı ilerler; hastalıkları pulmoner enfeksiyonlar, servikal adenit ve **dissemine hastalıktır**. Tüberkülozun az olduğu ülkelerde görülür; kültürde çevresel kontaminasyon olabildiğinden çok sayıda balgam örneği incelenmelidir.\nTedavide **etambutol ve rifabutin** kullanılır; **klaritromisin ve azitromisin idame tedavisinde ve CD4 sayısı düşük kişilerde** kullanılır.\n**Neden diğerleri değil:**\n• M. leprae – dapson → kültürde üretilemez; lepra yapar, AIDS'te dissemine hastalık etkeni değildir.\n• Nocardia – SXT → kısmi aside dirençli, uzun dallanan filamentli bakteri; pnömoni ve beyin/deri apsesi yapar, su ve besinle bulaşmaz (inhalasyon/kutanöz travma).\n• B. anthracis – siprofloksasin → sporlu Gram (+) basil, aside dirençli değildir.\n• Listeria – ampisilin → Gram (+) basil, aside dirençli değildir.\n**Akılda kalsın:** AIDS + düşük CD4 + dissemine ARB = M. avium → etambutol + rifabutin, idamede makrolid.", "org": ["avium"], "shuf": true}, {"q": "Böbrek nakli yapılmış, immün yetmezliği olan hastada pnömoni; balgamda kısmi aside dirençli, uzun dallanan filamentler görülüyor. Kısa süre sonra beyin apsesi saptanıyor. Doğru tedavi hangisidir?", "opts": [{"t": "SXT; SSS tutulumunda SXT + imipenem veya sefalosporin; tedavi 12 ay"}, {"t": "Penisilin G, 2 hafta"}, {"t": "Rifamisin + izoniazid + etambutol"}, {"t": "Kolistin"}, {"t": "Ekzotoksin nötralizasyonu"}], "a": 0, "exp": "Slayta göre **Nocardia** (veteriner Edmond Nocard'a ithaf) **kısmi ARB**'dir ve **uzun dallanan filament** oluşturur; organik topraklarda bulunur, kültürde 3-4 günde ürer. Eksojen enfeksiyon inhalasyon veya kutanöz travmayla olur. HIV'li, kanserli, **transplantlı** ve diğer immün yetmezlikli hastalarda **pnömoni olarak başlayan enfeksiyon beyin ve deride apselere dönüşür**.\nTedavi tutulum yerine göre değişir:\n- İmmün yeterli kişide kutanöz enfeksiyon: **SXT**\n- İmmün yetmezlikte: **SXT + amikasin**\n- **SSS tutulumunda: SXT, imipenem veya sefalosporin**\n- **Tedavi 12 ay sürer**; yara bakımı önemlidir.\nBu hasta transplantlı ve beyin apsesi var, bu yüzden SSS rejimi ve uzun süreli tedavi gerekir.\n**Neden diğerleri değil:**\n• Penisilin G, 2 hafta → slaytta Nocardia için böyle bir tedavi yoktur; tedavi SXT temelli ve 12 aydır.\n• Rifamisin + izoniazid + etambutol → M. tuberculosis tedavisidir.\n• Kolistin → çoklu dirençli A. baumannii'nin ilacıdır.\n• Ekzotoksin nötralizasyonu → difteri tedavisinin parçasıdır.\n**Akılda kalsın:** Nocardia: pnömoni → beyin apsesi; SXT, 12 ay.", "org": ["nocardia"], "shuf": true}, {"q": "Aşağıdaki 'etken – tedavi' eşleştirmelerinden hangisi **yanlıştır**?", "opts": [{"t": "Tularemi – gentamisin"}, {"t": "Bruselloz – doksisiklin"}, {"t": "Nocardia – trimetoprim-sülfametoksazol"}, {"t": "Çok dirençli Acinetobacter – kolistin"}, {"t": "Moraxella catarrhalis – penisilin"}], "a": 4, "exp": "Slayta göre **Moraxella catarrhalis penisiline dirençlidir**; bu nedenle 'M. catarrhalis – penisilin' eşleştirmesi **yanlıştır**. Moraxella **sefalosporin, eritromisin, tetrasiklin ve trimetoprim-sülfametoksazol** ile tedavi edilir; bronşit, bronkopnömoni, sinüzit ve otit yapar.\nDiğer eşleştirmeler slayta göre doğrudur:\n• **Tularemi – gentamisin:** Francisella'da penisilin ve sefalosporin etkili değildir.\n• **Bruselloz – doksisiklin:** gentamisin ve streptomisin de eklenebilir.\n• **Nocardia – SXT:** immün yetmezlikte + amikasin, SSS'de SXT + imipenem/sefalosporin; tedavi 12 ay.\n• **Çok dirençli Acinetobacter – kolistin:** slayta göre tek etkili antibiyotiktir.\n**Akılda kalsın:** Penisiline dirençli olduğu slaytta özellikle yazılanlar: M. catarrhalis (penisilin), Pasteurella (oksasilin), gonokok (β-laktamaz ile penisilin direnci).", "org": ["moraxella", "francisella", "brucella", "nocardia", "acinetobacter"], "shuf": true, "html": true}, {"q": "Aşağıdaki toksin – etki eşleştirmelerinden hangisi **doğrudur**?", "opts": [{"t": "Difteri toksini – adenilat siklaz"}, {"t": "Pertussis toksini – EF-2 inhibisyonu"}, {"t": "Şarbon ödem toksini – adenilat siklaz"}, {"t": "S. aureus enterotoksini – ısıya duyarlıdır"}, {"t": "Trakeal toksin – fagozom-lizozom birleşmesini engeller"}], "a": 2, "exp": "Doğru eşleştirme **şarbon ödem toksini – adenilat siklaz**'dır. Slayta göre B. anthracis **adenilat siklaz (ödem toksini) ile ödeme neden olur**; letal toksin ise makrofajları uyararak TNF ve IL salgılatır. Hastalık oluşturması için kapsül ve koruyucu antijen, letal faktör, ödem toksini gerekir.\n(Not: Slaytta B. pertussis'in de 'adenilat siklaz / hemolizin' toksini vardır; ama şıklarda pertussis'e EF-2 inhibisyonu yazıldığı için o şık yanlıştır.)\n**Neden diğerleri değil:**\n• Difteri toksini – adenilat siklaz → yanlış; difteri toksini **EF-2'yi inhibe eder** (lizojenik β-faj ile oluşan A ve B ekzotoksin).\n• Pertussis toksini – EF-2 inhibisyonu → yanlış; pertussis toksini **Gi-alfa (G1alfa) proteinini inhibe eder**, mukus artar ve öksürük oluşur.\n• S. aureus enterotoksini – ısıya duyarlı → yanlış; enterotoksin **ısıya ve mide asidine dirençlidir**.\n• Trakeal toksin – fagozom-lizozom birleşmesini engeller → yanlış; trakeal toksin **epitel hücrelerini öldürür ve IL-1 salgılatarak ateş** yapar. Fagozom-lizozom birleşmesini engelleyen M. tuberculosis'tir.\n**Akılda kalsın:** EF-2 = difteri; Gi-alfa = pertussis; ödem (adenilat siklaz) = şarbon.", "org": ["anthracis", "diphtheriae", "pertussis", "saureus"], "shuf": true, "html": true}, {"q": "Aşağıdakilerden hangisinde insan **tek** konaktır?", "opts": [{"t": "Brucella"}, {"t": "Francisella"}, {"t": "B. anthracis"}, {"t": "Bordetella pertussis"}, {"t": "Pasteurella"}], "a": 3, "exp": "Slayta göre **Bordetella pertussis'te insan tek konaktır**; kişiden kişiye aerosollerle bulaşır, dünya genelinde yaygındır ve risk aşılanmamışlarda yüksektir. 1 yaş altı çocuklarda şiddetli boğmaca gelişir; farkına varılmayan olgular rezervuar olur, bu yüzden eliminasyonunda aşı ve subklinik takip önemlidir.\nSlaytta insanın tek konak / tek rezervuar olduğu belirtilen diğer etkenler: **N. gonorrhoeae, N. meningitidis, C. diphtheriae, M. tuberculosis**.\n**Neden diğerleri değil:**\n• Brucella → **insan rastlantısal konaktır**; rezervuar hayvanlardır (B. melitensis koyun-keçi, B. abortus sığır, B. suis ren geyiği-domuz, B. canis köpek-tilki-çakal).\n• Francisella → **insan rastlantısal konaktır**; yabani memeliler, tavşanlar, kediler, keneler ve ısıran sinekler rezervuardır.\n• B. anthracis → **sığır konağıdır**, insan rastlantısal konaktır.\n• Pasteurella → **hayvanların ağız florasında** bulunur, ısırma / tırmalama ile insana geçer.\n**Akılda kalsın:** 'İnsan tek konak' = gonokok, meningokok, pertussis, difteri, tüberküloz; 'insan rastlantısal' = Brucella, Francisella, B. anthracis.", "org": ["pertussis", "brucella", "francisella", "anthracis", "pasteurella"], "shuf": true, "html": true}, {"q": "Aşağıdaki etkenlerden hangisine karşı insanlarda kullanılan bir aşı **vardır**?", "opts": [{"t": "S. aureus"}, {"t": "N. gonorrhoeae"}, {"t": "S. agalactiae"}, {"t": "N. meningitidis"}, {"t": "F. tularensis"}], "a": 3, "exp": "Slayta göre **N. meningitidis'in aşısı vardır**; ayrıca temaslılara rifamisin / siprofloksasin / seftriakson profilaksisi uygulanır ve ilk 6 ayda bebekte bağışıklık bulunur.\n**Neden diğerleri değil:**\n• S. aureus → slayta göre **aşı yoktur**; korunma el yıkama, maske-eldiven, dezenfektan ve yara pansumanıyla olur.\n• N. gonorrhoeae → **aşısı yoktur**; korunma kondom ve hasta eğitimi, yenidoğanda %1'lik AgNO3.\n• S. agalactiae → **aşı yoktur**; riskli durumda doğumdan 4 saat önce penisilin verilir.\n• F. tularensis → **canlı aşısı vardır ama insanda kullanılmaz**; korunma vektörlerden kaçınma ve keneyi hemen çıkarma ile.\nSlaytta aşısı olduğu belirtilen diğer etkenler: **Hib** (konjuge PRP; ilk 6 ay ve 12-15. ay), **pnömokok** (çocuğa 13 değerli konjuge, erişkine 23 değerli polivalan), **boğmaca** (5 doz), **difteri** (toksoid), **tüberküloz** (BCG), **şarbon** (etkili ama toksisitesi var), **Brucella** (aşılama ve hayvan eradikasyonu).\n**Akılda kalsın:** İki Neisseria'dan yalnız meningokokun aşısı var; gonokok, S. aureus ve GBS'nin aşısı yok.", "org": ["meningokok", "saureus", "gonokok", "sagalactiae", "francisella"], "shuf": true, "html": true}, {"q": "Hücre içi yaşayan bakterilerle ilgili aşağıdaki ifadelerden hangisi doğrudur?", "opts": [{"t": "Brucella retiküloendotelyal hücre içi patojendir; fagositoza ve seruma dirençlidir"}, {"t": "Francisella hücre dışı patojendir ve kapsülü yoktur"}, {"t": "Listeria mide asidi ve safraya duyarlıdır; buzdolabında yaşayamaz"}, {"t": "M. tuberculosis fagozom ve lizozomların birleşmesini kolaylaştırır"}, {"t": "Tüberküloz profilaksisi 3 gün izoniazid ile yapılır"}], "a": 0, "exp": "Slayta göre **Brucella retiküloendotelyal hücre içi patojendir; fagositoza ve seruma dirençlidir**. Çok küçüktür, seçilmiş ajan olarak bilinir; insanda en sık B. melitensis görülür. Meme, plasenta, epididim ve uterusu enfekte ederek süt, idrar ve doğum ürünlerine geçer.\n**Neden diğerleri değil:**\n• Francisella hücre dışı, kapsülsüz → yanlış; F. tularensis **hücre içi patojendir**, fagositoza dirençlidir ve **polisakkarit kapsülü antikor aracılı fagositozu önler**.\n• Listeria mide asidi/safraya duyarlı, buzdolabında yaşayamaz → yanlış; Listeria **hücre içi fakültatiftir**, **mide asidi ve safraya dirençlidir**, **buzdolabında ve yüksek tuzda yaşayabilir**.\n• M. tuberculosis fagozom-lizozom birleşmesini kolaylaştırır → yanlış; **engeller**. Bu sayede makrofaj içinde yaşar; sonuçta granülom oluşur.\n• Tüberküloz profilaksisi 3 gün izoniazid → yanlış; profilakside **3 ay izoniazid ve rifapentin** kullanılır.\n**Akılda kalsın:** Hücre içi yaşayanlar: Brucella (RES), Francisella, Listeria (fakültatif), M. tuberculosis (fagozom-lizozom füzyonunu engeller).", "org": ["brucella", "francisella", "listeria", "tbc"], "shuf": true}, {"q": "Menenjit etkenlerinin risk grubuyla eşleştirmesinde hangisi **yanlıştır**?", "opts": [{"t": "Yenidoğan – S. agalactiae, Listeria"}, {"t": "Aşısız küçük çocuk – H. influenzae tip b"}, {"t": "Üniversite yurdunda kalan genç – N. meningitidis"}, {"t": "Yaşlı – S. pneumoniae"}, {"t": "Sağlıklı genç erişkin – Nocardia en sık etkendir"}], "a": 4, "exp": "Slayta göre **Nocardia** organik topraklarda bulunur ve **immün yetmezlik durumunda** (HIV, kanser, transplantasyon vb.) fırsatçı enfeksiyon yapar; pnömoni olarak başlayan enfeksiyon beyin ve deride apselere dönüşebilir. Sağlıklı genç erişkinde **menenjitin en sık etkeni değildir**; bu yüzden bu eşleştirme **yanlıştır**. Ayrıca slayttaki menenjit etken listesinde Nocardia yoktur (Nocardia beyin apsesi ile ilişkilidir).\nKlinik sendromlar tablosunda menenjit etkenleri: **S. agalactiae (grup B), E. coli, H. influenzae, S. pneumoniae, N. meningitidis, L. monocytogenes.**\nDiğer eşleştirmeler slayta göre doğrudur:\n• Yenidoğan – S. agalactiae ve Listeria: ikisi de yenidoğan hastalığı ve menenjit yapar.\n• Aşısız küçük çocuk – Hib: menenjit etkenidir, konjuge PRP aşısıyla önlenir.\n• Üniversite yurdu – N. meningitidis: insidans yaş<5, üniversite, askeriye ve bakım evinde fazladır.\n• Yaşlı – S. pneumoniae: slayta göre çocuk ve yaşlı menenjit için risklidir.\n**Akılda kalsın:** Menenjit yaş/risk eşleşmesi: yenidoğan GBS + Listeria; aşısız çocuk Hib; yurt/askeriye meningokok; yaşlı pnömokok.", "org": ["nocardia", "sagalactiae", "listeria", "haemophilus", "meningokok", "spneumoniae"], "shuf": true, "html": true}, {"q": "Aşağıdaki bakterilerden hangilerinde konak / rezervuar **yalnızca insandır**?\nI. Neisseria gonorrhoeae\nII. Bordetella pertussis\nIII. Brucella melitensis\nIV. Corynebacterium diphtheriae", "opts": [{"t": "I, II ve IV"}, {"t": "I ve III"}, {"t": "II ve III"}, {"t": "Yalnız I"}, {"t": "I, II, III ve IV"}], "a": 0, "exp": "Slayta göre:\n• **I. N. gonorrhoeae:** tek konak insandır; insan dışında canlı kalamaz → doğru.\n• **II. B. pertussis:** insan tek konaktır → doğru.\n• **IV. C. diphtheriae:** sadece insanda bulunur; enfekte ve asemptomatik insanlarla yayılır → doğru.\n• **III. B. melitensis → yanlış:** Brucella'da **rezervuar hayvanlardır** (B. melitensis koyun ve keçi); insan rastlantısal konaktır ve çiğ süt/süt ürünleri, hayvan teması ile enfekte olur.\nBu nedenle doğru yanıt **I, II ve IV**'tür.\nSlaytta insanın tek konak / tek rezervuar olduğu diğer etkenler: N. meningitidis (sadece insanda bulunur) ve M. tuberculosis (insan tek rezervuardır).\n**Akılda kalsın:** Zoonozlar (Brucella, Francisella, B. anthracis, Pasteurella) bu listeye girmez.", "org": ["gonokok", "pertussis", "brucella", "diphtheriae"], "shuf": false, "html": true}, {"q": "Aşağıdaki 'bakteri – kapsül yapısı' eşleştirmelerinden hangileri doğrudur?\nI. N. meningitidis – polisakkarit kapsül\nII. S. pyogenes – poli-D-glutamik asit kapsül\nIII. H. influenzae tip b – riboz, ribitol ve fosfat (PRP) içeren polisakkarit kapsül\nIV. B. anthracis – poli-D-glutamik asit kapsül", "opts": [{"t": "I, III ve IV"}, {"t": "I ve II"}, {"t": "II ve IV"}, {"t": "Yalnız III"}, {"t": "I, II, III ve IV"}], "a": 0, "exp": "Slayta göre kapsül yapıları:\n• **I. N. meningitidis – polisakkarit kapsül** → doğru; kapsül fagositozu engeller (aşının da hedefidir).\n• **III. Hib – riboz, ribitol ve fosfat (PRP)** içeren polisakkarit kapsül → doğru; PRP'ye karşı antikorlar koruyucudur ve konjuge PRP aşısının temelidir.\n• **IV. B. anthracis – poli-D-glutamik asit** kapsül → doğru; fagositozu önler. Hastalık oluşturması için kapsül + toksinler gerekir.\n• **II. S. pyogenes – poli-D-glutamik asit → yanlış:** S. pyogenes'in kapsülü **hiyalüronik asitten** yapılmıştır ve **immünojenik değildir**.\nBu nedenle doğru yanıt **I, III ve IV**'tür.\nSlayttaki diğer kapsüller: S. aureus ve S. pneumoniae'nın polisakkarit kapsülü (pnömokokta 100 serotip), S. agalactiae'de kapsül ve sialik asit, Francisella'da polisakkarit kapsül.\n**Akılda kalsın:** Protein (poliglutamat) kapsül = B. anthracis; hiyalüronik asit = S. pyogenes; PRP = Hib.", "org": ["meningokok", "spyogenes", "haemophilus", "anthracis"], "shuf": false}, {"q": "Ağır sepsise dönüşebilen meningokok enfeksiyonunda, hücre duvarında bulunan ve endotoksin özelliği taşıyan bileşen hangisidir?", "opts": [{"t": "Lipooligosakkarit"}, {"t": "Polisakkarit kapsül"}, {"t": "Pilin"}, {"t": "IgA proteaz"}, {"t": "Porin"}], "a": 0, "exp": "Slayta göre **N. meningitidis'in hücre duvarındaki lipooligosakkarit endotoksindir**; meningokok enfeksiyonunun **ağır sepsise (meningokoksemi)** dönüşebilmesinde bu endotoksin rol oynar. Meningokok menenjit, meningokoksemi ve pnömoni yapar.\nMeningokokun diğer virülans faktörleri: **pilin** tutunmayı sağlar, **polisakkarit kapsül** fagositozu engeller. (Gonokokta da hücre duvarındaki lipopolisakkarit endotoksin üretir.)\n**Neden diğerleri değil:**\n• Polisakkarit kapsül → fagositozu engeller; endotoksin değildir.\n• Pilin → tutunmayı sağlar.\n• IgA proteaz → S. pneumoniae'da mukustaki bakterinin IgA ile inaktivasyonunu önler.\n• Porin → gonokokta nötrofillerin fagozom füzyonunu önler.\n**Akılda kalsın:** Meningokok: pilin = tutunma, kapsül = antifagositik, lipooligosakkarit = endotoksin (sepsis).", "org": ["meningokok"], "shuf": true}, {"q": "Tekrarlayan meningokok enfeksiyonları geçiren 20 yaşındaki hastada, artmış riskle ilişkili olarak hangi durum araştırılmalıdır?", "opts": [{"t": "Geç kompleman komponenti eksikliği"}, {"t": "Diyabet"}, {"t": "Kronik akciğer hastalığı"}, {"t": "Alkol ve ilaç bağımlılığı"}, {"t": "Erken membran rüptürü"}], "a": 0, "exp": "Slayta göre meningokok enfeksiyonu insidansı yaş<5, üniversite, askeriye, bakım evi ve **geç kompleman eksikliğinde** fazladır. Tekrarlayan Neisseria enfeksiyonu olan hastada bu nedenle **geç kompleman komponenti eksikliği** araştırılır. Gonokokta da risk **kompleman ve komponent eksikliğinde** yüksektir; Hib'de de geç kompleman eksikliği risk faktörüdür.\nMeningokok sadece insanda bulunur, solunum ve aerosollerle bulaşır; kuru ve soğuk aylarda görülür. Aşısı vardır.\n**Neden diğerleri değil:**\n• Diyabet → slaytta (alkol ve kanserle birlikte) S. agalactiae enfeksiyon riskini artıran durum olarak geçer.\n• Kronik akciğer hastalığı → M. avium riski (kronik akciğer hastalığı olan yaşlılarda).\n• Alkol ve ilaç bağımlılığı → tüberküloz risk faktörü.\n• Erken membran rüptürü → S. agalactiae yenidoğan hastalığı için risk.\n**Akılda kalsın:** Tekrarlayan Neisseria enfeksiyonu → geç kompleman eksikliği.", "org": ["meningokok", "gonokok"], "shuf": true}, {"q": "Uzun süre geniş spektrumlu antibiyotik alan hastada izole edilen enterokok, standart tedaviye dirençli çıkıyor. Aşağıdakilerden hangisi tedavide kullanılabilir?", "opts": [{"t": "Linezolid"}, {"t": "Seftriakson"}, {"t": "Oksasilin"}, {"t": "Kolistin"}, {"t": "Metronidazol"}], "a": 0, "exp": "Slayta göre Enterococcus'ta standart tedavi **aminoglikozid (+ penisilin / ampisilin / vankomisin)** iken, **direnç varsa linezolid, daptomisin, kinupristin** kullanılır. Linezolid (oksazolidinon) 50S ribozomda protein sentezinin başlamasını önler; Staphylococcus, Enterococcus, Streptococcus ve Gram (+) basillere etkilidir, Gram (−)'lere etkisizdir.\nEnterokok GİS'e yerleşir, geniş spektrumlu antibiyotik kullanımı ile mukozaya yayılır, kaynağı endojendir; üriner sistem enfeksiyonu, peritonit, bakteriyemi ve endokardit yapar. Antibiyotik enfeksiyona göre ayarlanıp direnç gelişmesinden kaçınılmalıdır.\n**Neden diğerleri değil:**\n• Seftriakson → enterokok **geniş spektrumlu sefalosporin tedavilerinde** nozokomiyal enfeksiyonların en yaygın nedenidir; yani sefalosporinler uygun değildir.\n• Oksasilin → penisilinaza dirençli penisilindir, stafilokoklara etkinlik için kullanılır.\n• Kolistin → dış membranı bozar; Gram (−)'lere etkili, **Gram (+)'lere etkisizdir**.\n• Metronidazol → yalnız **anaeroplara** etkilidir.\n**Akılda kalsın:** Dirençli enterokok → linezolid / daptomisin / kinupristin.", "org": ["enterococcus"], "shuf": tru <h3>Konak ve mikroorganizma</h3>
<div class="callout">İnsan organizması (konak) yaşam boyu mikroorganizmalarla iç içedir. <b>Vücut</b> savunma mekanizmalarıyla karşı koyar; <b>mikroorganizma</b> hastalık oluşturarak direnci kırmaya çalışır. Sonuçta konak <span class="warn">HASTA</span> ya da <span class="okk">SAĞLIKLI</span> olur.<br>
<b>Enfeksiyon</b> = mikroorganizmanın hastalık yeteneği ile konağın savunması arasındaki etkileşimin sonucu.</div>
<p><span class="k">Mikroorganizma ile karşılaşmanın olası sonuçları:</span></p>
<p><span class="c">Hastalık oluşmaz</span><span class="c">Enfeksiyon oluşur</span><span class="c">Subklinik enfeksiyon oluşur</span><span class="c">Bağışıklık</span><span class="c">Taşıyıcılık</span></p>

<h3>Sık karıştırılanlar</h3>
<ul class="mix">
<li><b>Appertizasyon ↔ tindalizasyon:</b> appertizasyon = Appert (19. yy); tindalizasyon = Tyndall (3 gün, 100 °C, ½ saat — sporlar yüzünden).</li>
<li><b>Redi ↔ Pastör:</b> Redi etteki kurtların sinek larvasından geldiğini gösterdi; tartışmaya <b>son veren</b> Pastör'dür.</li>
<li><b>Saf kültür:</b> Pastör saf kültür <b>elde etti</b>; Koch saf (aksenik) kültür <b>kavramını ortaya atanlardan</b> biridir.</li>
<li><b>Koch ↔ Petri:</b> jelatinli <b>katı besiyeri</b> Koch'un; <b>kap</b> öğrencisi Petri'nin.</li>
<li><b>Lister ↔ Pastör:</b> cerrahi antisepsis Lister; fermantasyon/pütrefaksiyon ve Pastör etkisi Pastör.</li>
<li><b>Tıbbi mikrobiyolojinin temeli:</b> Koch postulatları (Pastör değil).</li>
<li><b>2. dönem ↔ 4. dönem:</b> 2. dönem bakteriyel <b>genetik</b> + moleküler biyoloji; 4. dönem mikrobiyal <b>genomik</b>. Yaşam ağacı = 3. dönem (rRNA).</li>
<li><b>Mikrobiyoloji ↔ klinik mikrobiyoloji:</b> ilki tüm mikroskobik canlılar; ikincisi patojenlerin tanı/identifikasyonu ve laboratuvar işlemleri.</li>
</ul>

<tr><td>Virüs</td><td>20–300 nm</td><td>—</td></tr>

<tr><td>Prion</td><td>1 nm</td><td><b>Sadece protein</b></td></tr>
</table></div>
<p class="sm">Slaytta tanıtılan mikrop grupları: bakteriler, virüsler, funguslar, arkealar, protozoalar, algler.</p>

<h3>Sınıflandırma: âlemler</h3>
<p><span class="c">2 âlem: bitkiler + hayvanlar</span> → <span class="c">3 âlem: + protista</span> → <span class="c">Bugün: 5 âlem</span></p>
<div class="tbl"><table>
<tr><th>Âlem</th><th>İçerik</th></tr>
<tr><td>Plantae</td><td>Bitkiler</td></tr>
<tr><td>Animalia</td><td>Hayvanlar</td></tr>
<tr><td>Fungi</td><td>Maya, küf, şapkalı mantarlar</td></tr>
<tr><td>Monera</td><td>Bakteriler ve siyanobakteriler: <b>Eubacteria</b>, <b>Archae</b></td></tr>
<tr><td>Protista</td><td>Protophyta, Protomycota, Protozoa</td></tr>
</table></div>
<div class="callout"><b>Virüslerin</b> bu sınıflandırmada <b>yeri yoktur</b>; ayrı bir grup olarak değerlendirilir.</div>

<h3>Linnaeus sistemi ve hiyerarşi</h3>
<p><b>Carl Linnaeus (1707–1778)</b> tarafından geliştirilen sistem bugün de kullanılır: her tür <b>2 kelimeden</b> (cins + tür adı) oluşan adla tanımlanır.</p>
<ul class="tree">
<li><b>Âlem</b>
 <ul><li><b>Şube</b> <span class="sm">(funguslarda son ek -mycota)</span>
  <ul><li><b>Sınıf</b> <span class="sm">(funguslarda -mycetes)</span>
   <ul><li><b>Takım</b> <span class="sm">(-ales)</span>
    <ul><li><b>Familya</b> <span class="sm">(-aceae)</span>
     <ul><li><b>Cins</b>
      <ul><li><b>Tür</b></li></ul></li></ul></li></ul></li></ul></li></ul></li></ul>
</li>
</ul>
<p class="sm">Benzer türler aynı cins, benzer cinsler aynı familya, benzer familyalar aynı takım, benzer takımlar aynı sınıf, benzer sınıflar aynı şube, benzer şubeler aynı âlem altında toplanır.</p>

<h3>Adlandırma kuralları</h3>
<div class="tbl"><table>
<tr><th>Kural</th><th>Örnek</th></tr>

<tr><td>Çoğu Latince; addan mikroorganizma hakkında bilgi alınır</td><td>strepto = zincir · coccus = yuvarlak · thermo = sıcak · philus = dayanıklı/seven</td></tr>
<tr><td>Bazen bulan kişinin adı verilir</td><td><i>Escherichia coli</i> (Theodor von Escherich) · <i>Salmonella</i> (Daniel Elmer Salmon)</td></tr>

<tr><td>Familya son eki</td><td>-aceae → Enterobacteriaceae</td></tr>

<h3>Sık karıştırılanlar</h3>
<ul class="mix">
<li><b>Viroid ↔ prion:</b> viroid = 5 nm, tek iplikli RNA; prion = 1 nm, sadece protein.</li>
<li><b>Monera:</b> Eubacteria + Archae; protozoa Protista'dadır.</li>
<li><b>Virüs:</b> 5 âlemin hiçbirinde değildir.</li>
<li><b>-aceae ↔ -ales:</b> familya -aceae, takım -ales. -mycetes (sınıf) ve -mycota (şube) funguslara özgüdür.</li>
<li><b>Salmonella Enteritidis:</b> büyük harf, italik değil (serotip). <i>Streptococcus thermophilus</i>: tür küçük harf, italik.</li>
<li><b>Trematod ↔ sestod:</b> trematod yapraksı, sestod yassı solucan.</li>
<li><b>Spor:</b> yalnızca Gram pozitif bakterilerde.</li>
</ul>

<div class="callout"><b>Sınavda çıkabilecek</b>
<ul>
<li>Virüs / viroid / prion boyutları ve yapıları</li>
<li>2 → 3 → 5 âlem ve 5 âlemin içerikleri; virüslerin yeri yok</li>
<li>Linnaeus (1707–1778), ikili adlandırma</li>
<li>Son ekler: -aceae, -ales, -mycetes, -mycota</li>
<li>Salmonella serotip yazımı</li>
<li>Maya / küf / dimorfik; nematod / trematod / sestod</li>
</ul></div>`,
`<h3>Bakterilerin özellikleri</h3>
<ul>
<li>Bakteriler <b>prokaryottur</b>: zarla çevrili çekirdek ve mitokondri, ER, Golgi vb. organeller içermez.</li>

<li>İnsanda bulunan bakterilerin tümüne <b>mikrobiyom</b> denir.</li>

<li>Hücre duvarlarının <b>Gram boyası</b> ile boyanmasına göre ikiye ayrılırlar.</li>
</ul>

<h3>Bakteriler hastalığı nasıl oluşturur?</h3>
<p>Birçok mikroorganizmanın klinik tablosu <b>benzerdir</b>; bu yüzden tedavi için etkenin <b>uygun testlerle doğru belirlenmesi</b> gerekir. Mikroorganizma şu aşamaları geçerek hastalık oluşturur:</p>
<p><span class="c">1 Maruz kalma</span> → <span class="c">2 Tutunma</span> → <span class="c">3 Yayılma</span> → <span class="c">4 Enfeksiyon</span> → <span class="c">5 Toksisite</span> → <span class="c">6 Doku hasarı</span> → <span class="c">7 Hastalık</span></p>
<p><span class="k">Bakteriyel virülans:</span> bakterilerin insan vücudu gibi düşman ortamlarda hayatta kalma yeteneği.</p>

<h3>Sık karıştırılanlar</h3>
<ul class="mix">
<li><b>Sinüzit ve otitis media</b> aynı üçlü: S. pneumoniae, H. influenzae, M. catarrhalis. <b>Eksternal otit</b> farklı: P. aeruginosa, S. aureus.</li>

r; M ve F proteinleri yapışma-yayılma</td><td>Streptolizin S ve O, streptokinaz, DNazlar; streptokokal pirojenik ekzotoksin</td><td>Bakteriyel farenjitin asıl sorumlusu</td></tr><tr><td>S. agalactiae</td><td>Kapsül ve sialik asit fagositoza karşı korur</td><td>-</td><td>Yenidoğan hastalığı; anneden bebeğe</td></tr><tr><td>S. pneumoniae</td><td>Fagositoza dirençli polisakkarit kapsül (100 serotip); yüzey proteini adezinler; fosforilkolin</td><td>IgA proteaz; pnömolizin (epitel ve makrofajları yok eder)</td><td>Viridans içinde en virülan</td></tr><tr><td>Enterococcus</td><td>-</td><td>-</td><td>Antibiyotik direnci; nozokomiyal; endojen kaynak</td></tr></table></div><h3>S. aureus</h3><ul><li>Kültürde çabuk ürer; <b>MSSA</b> (metisiline duyarlı) ve <b>MRSA</b> (dirençli) tespiti kolaydır. MRSA suşları <span class='warn'>β-laktam grubuna da dirençlidir</span>.</li><li><b>Piyojeniktir:</b> akut nötrofilik inflamasyon ve irin oluşturur; pürülan ya da sistemik hastalık yapar.</li><li>Epidemiyoloji: toplum ve hastane kaynaklı; kişiden kişiye; yüzey, giysi, çarşaf ve temasla bulaş.</li></ul><div class="tbl"><table><tr><th>Toksin</th><th>Özellik</th><th>Sonuç</th></tr><tr><td>Enterotoksin</td><td>Isıya ve mide asidine dirençli</td><td>Gıda zehirlenmesi: kusma, ishal, mide krampı</td></tr><tr><td>Eksfoliyatif toksin</td><td>A ve B tipleri</td><td>Cildin soyulması (haşlanmış deri sendromu)</td></tr><tr><td>Toksik şok sendromu toksini</td><td>Isıya ve proteaza dirençli</td><td>Çoklu organ patolojisi: ateş, hipotansiyon, döküntü</td></tr></table></div><p><span class='k'>Piyojenik hastalıklar:</span> <span class="c">İmpetigo</span><span class="c">Follikülit</span><span class="c">Fronkül ve karbonkül</span><span class="c">Yara enfeksiyonu</span><span class="c">Pnömoni</span><span class="c">Endokardit</span><span class="c">Osteomiyelit</span><span class="c">Septik artrit</span></p><p><span class='k'>Toksin kaynaklı:</span> <span class="c">Gıda zehirlenmesi</span><span class="c">Haşlanmış deri sendromu</span><span class="c">Toksik şok sendromu</span></p><h3>S. pyogenes</h3><div class="tbl"><table><tr><th>Süpüratif</th><th>Süpüratif olmayan (otoimmün)</th></tr><tr><td>Farenjit, kızıl, piyoderma, erizipel, selülit, nekrotizan fasiit, streptokokal toksik şok sendromu</td><td>Romatizmal ateş, akut glomerülonefrit</td></tr></table></div><ul><li>Bulaş: damlacık, artropod vektör ve hasarlı cildin kontaminasyonu. Farenjit ve yumuşak doku enfeksiyonları M proteini ile oluşur.</li><li>Risk: 2-5 yaş, 5-15 yaş, hijyeni zayıf olanlar; farenjit, yumuşak doku enfeksiyonu veya toksik şok sendromu geçirenler.</li></ul><h3>S. agalactiae</h3><p><span class='k'>Yenidoğan riskini artıranlar:</span> <span class="c">Erken membran rüptürü</span><span class="c">Uzamış ya da erken doğum</span><span class="c">Annede β-streptokok varlığı</span><span class="c">Annede kompleman ve antikor eksikliği</span></p><ul><li>Üst solunum yolu ve genitoüriner sistemde asemptomatik kolonizasyon yapabilir; genitoüriner hastalığı olan kadınlar postpartum hastalık için risklidir.</li><li>Diyabet, alkol, kanser enfeksiyon riskini artırır. Mevsimsel dağılımı yoktur.</li><li><b>Yenidoğan:</b> erken ve geç başlangıçlı hastalık (pnömoni, menenjit, sepsis, bakteriyemi). <b>Gebe:</b> endometrit, idrar yolu enfeksiyonu. <b>Erişkin:</b> pnömoni, eklem ve yumuşak doku enfeksiyonları.</li></ul><h3>S. pneumoniae</h3><ul><li>Nazofarenks ve orofarenkse yerleşip akciğer, sinüsler, meninks ve kulaklara yayılır. Çocuklarda ve temaslılarında kolonizasyon yüksektir.</li><li>Önceden virüsle enfekte çocuklarda pnömoni, otitis media, sinüzit gelişebilir. Çocuk ve yaşlı menenjit için risklidir; hematolojik hastalık ve aspleni sepsis riskidir.</li><li>Bulaş nadirdir; soğuk aylarda yaygındır. <span class='warn'>Penisilin, sefalosporin ve makrolidlere dirençli</span> suşlar vardır.</li><li>Hastalıklar: <span class="c">Pnömoni</span><span class="c">Menenjit</span><span class="c">Sinüzit</span><span class="c">Otitis media</span><span class="c">Fulminan sepsis</span></li></ul><h3>Enterococcus faecalis / faecium</h3><ul><li>Geniş spektrumlu sefalosporin tedavilerinde <b>nozokomiyal enfeksiyonların en yaygın nedenidir</b>; antibiyotik direnci tedaviyi zorlaştırır.</li><li>GİS'e yerleşir, geniş spektrumlu antibiyotik kullanımıyla mukozaya yayılır; kaynak <b>endojendir</b>.</li><li>Hastalıklar: <span class="c">Üriner sistem enfeksiyonu</span><span class="c">Peritonit</span><span class="c">Bakteriyemi</span><span class="c">Endokardit</span></li></ul><h3>Tedavi ve korunma özeti</h3><div class="tbl"><table class="vs"><tr><th>Bakteri</th><th>Tedavi</th><th>Aşı / korunma</th></tr><tr><td>S. aureus</td><td>İnsizyon, drenaj; tablet: TMP-SMX, klindamisin, doksisiklin; IV: vankomisin</td><td><span class='no'>Aşı yok</span>; yara pansumanı, dezenfektan, el yıkama, maske-eldiven</td></tr><tr><td>S. pyogenes</td><td>Tablet: penisilin V (sefalosporin, makrolid), amoksisilin; IV: penisilin + klindamisin</td><td>Slaytta aşı bilgisi yok; ilk 10 günde tedavi başlamazsa romatizmal ateş; romatizmal ateşe bağlı kalp hastalığı olanlara diş tedavisinden önce antibiyotik</td></tr><tr><td>S. agalactiae</td><td>Penisilin G (+ aminoglikozid); alerjide sefalosporin / vankomisin</td><td><span class='no'>Aşı yok</span>; riskli bebek için doğumdan 4 saat önce anneye penisilin</td></tr><tr><td>S. pneumoniae</td><td>Penisilin dirençliyse seftriakson + vankomisin; monoterapide sefalosporin, florokinolon</td><td><span class='yes'>Aşı var:</span> çocuklara 13 değerli konjuge, erişkinlere 23 değerli polivalan</td></tr><tr><td>Enterococcus</td><td>Aminoglikozid (+ penisilin / ampisilin / vankomisin); dirençte linezolid, daptomisin, kinupristin</td><td>Slaytta aşı bilgisi yok; enfeksiyona göre antibiyotik seçip direnç gelişiminden kaçınılmalı</td></tr></table></div><h3>Ayırt edici ipuçları</h3><div class="tbl"><table class="clue"><tr><th>İpucu</th><th>Etken</th></tr><tr><td>Yüksek tuzda üreme, ısıya dirençli enterotoksin, gıda zehirlenmesi</td><td><span class="c">S. aureus</span></td></tr><tr><td>Cilt soyulması, eksfoliyatif toksin A-B</td><td><span class="c">S. aureus</span></td></tr><tr><td>Ateş + hipotansiyon + döküntü (toksik şok)</td><td><span class="c">S. aureus</span><span class="c">S. pyogenes</span></td></tr><tr><td>Farenjit sonrası romatizmal ateş, akut glomerülonefrit</td><td><span class="c">S. pyogenes</span></td></tr><tr><td>Erken membran rüptürü, yenidoğan sepsisi / menenjiti</td><td><span class="c">S. agalactiae</span></td></tr><tr><td>Aspleni, fulminan sepsis; viral enfeksiyon sonrası otitis media</td><td><span class="c">S. pneumoniae</span></td></tr><tr><td>Geniş spektrumlu sefalosporin altında hastane enfeksiyonu</td><td><span class="c">Enterococcus</span></td></tr></table></div><h3>Sık karıştırılanlar</h3><ul class="mix"><li><b>Aşı:</b> Gram (+) koklar içinde slaytta aşısı olan tek etken <span class='yes'>S. pneumoniae</span> (13 konjuge çocuk / 23 polivalan erişkin). S. aureus ve S. agalactiae için <span class='no'>aşı yok</span>.</li><li><b>Penisilin V</b> (oral) S. pyogenes'te; <b>Penisilin G</b> S. agalactiae'de.</li><li><b>S. pneumoniae viridanstır</b> (α-hemoliz) ama viridanslar içinde en virülan olandır; S. agalactiae ve S. pyogenes β-hemolitiktir.</li><li>S. pyogenes kapsülü <b>hiyalüronik asittir ve immünojenik değildir</b>; S. pneumoniae kapsülü polisakkarit olup 100 serotipi vardır.</li><li>Romatizmal ateş ve akut glomerülonefrit <b>süpüratif değildir</b> (otoimmün); nekrotizan fasiit ve toksik şok süpüratif gruptadır.</li></ul>`,
`<h3>Neisseria: tek gerçek Gram (−) kok</h3><div class="callout">Slayt: <b>Tek gerçek Gram negatif koklar Neisseria'dır.</b> Bu başlık altında incelenen cinsler: <span class="c">Neisseria</span><span class="c">Eikenella</span><span class="c">Kingella</span><span class="c">Moraxella</span><span class="c">Haemophilus</span><span class="c">Pasteurella</span><span class="c">Acinetobacter</span><span class="c">Bordetella</span><span class="c">Francisella</span><span class="c">Brucella</span></div>{{MINI}}<h3>Gonokok × meningokok karşılaştırması</h3><div class="tbl"><table class="vs"><tr><th>Özellik</th><th>N. gonorrhoeae</th><th>N. meningitidis</th></tr><tr><td>Hastalık</td><td>Gonore (bel soğukluğu), dissemine enfeksiyon, oftalmia neonatorum</td><td>Menenjit, meningokoksemi, pnömoni</td></tr><tr><td>Bulaş</td><td>Cinsel yol</td><td>Solunum ve aerosoller</td></tr><tr><td>Konak</td><td>Tek konak insan; insan dışında canlı kalamaz</td><td>Sadece insanda bulunur</td></tr><tr><td>Tutunma</td><td>Pilin (ağız boşluğu, vajina); Opa (opasite) proteini</td><td>Pilin</td></tr><tr><td>Kapsül</td><td>-</td><td>Polisakkarit kapsül fagositozu engeller</td></tr><tr><td>Endotoksin</td><td>Hücre duvarı lipopolisakkarit</td><td>Hücre duvarı lipopoligosakkarit</td></tr><tr><td>Diğer virülans</td><td>Porin: nötrofillerde fagozom füzyonunu önler; demiri transferrin, laktoferrin, hemoglobinden alır; β-laktamaz: penisilin direnci</td><td>Ağır sepsise dönüşür; bulaşıcıdır</td></tr><tr><td>Risk</td><td>Erkek, 15-24 yaş, siyahlar; kompleman eksikliği</td><td>&lt;5 yaş, üniversite, askeriye, bakım evi; geç kompleman eksikliği</td></tr><tr><td>Mevsim</td><td>-</td><td>Kuru ve soğuk aylar</td></tr><tr><td>Tedavi</td><td>Seftriakson + azitromisin</td><td>Seftriakson, sefotaksim, meropenem</td></tr><tr><td>Profilaksi</td><td>Yenidoğanda %1 AgNO<sub>3</sub></td><td>Temaslılara rifamisin, siprofloksasin veya seftriakson</td></tr><tr><td>Aşı</td><td><span class='no'>Yok</span> (kondom ve hasta eğitimi)</td><td><span class='yes'>Var</span>; ilk 6 ay bebekte immünite</td></tr></table></div><h3>1. Neisseria gonorrhoeae</h3><ul><li>Ad: Albert Neisser'e ithafen; <i>gonor</i> = 'tohumların akımı', pürülan eksüdaya verilen isim.</li><li><b>CYBH içinde en sık görülenidir.</b> 2019'da ABD'de 600 binden fazla bildirimle 2. sıradaki hastalık; dünyada yılda 100 milyon vaka.</li><li>Düşük ısıya dayanıksızdır; kültürde <b>nem ve CO<sub>2</sub></b> gerektirir.</li><li>Kadınlarda <b>asemptomatik taşıyıcılık</b> görülür. <b>Septik artritin en sık nedenidir</b>. Kısırlığa neden olur.</li></ul><div class="tbl"><table><tr><th>Kadın</th><th>Erkek</th><th>Her iki cinsiyet</th></tr><tr><td>Anormal vajinal akıntı, pelvik ağrı</td><td>Penisten akıntı</td><td>İdrar sırasında ağrı ve yanma</td></tr></table></div><h3>2. Neisseria meningitidis</h3><ul><li>Meninkslerin inflamasyonuna yol açar; bulaşıcıdır; ağır sepsise dönüşebilir.</li><li>Hastalıklar: <span class="c">Menenjit</span><span class="c">Meningokoksemi</span><span class="c">Pnömoni</span></li></ul><h3>Klinik sendrom tablosunda Neisseria</h3><div class="organ-grid"><div class="organ"><div class="oh">Menenjit</div><span class="c">N. meningitidis</span><span class="c">S. agalactiae</span><span class="c">E. coli</span><span class="c">H. influenzae</span><span class="c">S. pneumoniae</span><span class="c">L. monocytogenes</span></div><div class="organ"><div class="oh">Üretrit · Servisit</div><span class="c">N. gonorrhoeae</span><span class="c">C. trachomatis</span><span class="c">M. genitalium</span></div><div class="organ"><div class="oh">Proktit</div><span class="c">N. gonorrhoeae</span><span class="c">C. trachomatis</span></div><div class="organ"><div class="oh">Artrit</div><span class="c">S. aureus</span><span class="c">N. gonorrhoeae</span></div></div><h3>Antibiyotik tablosundan</h3><ul><li>Doğal penisilin (penisilin G) meningokoklara etkindir.</li><li>Tetrasiklinler ve makrolidler Neisseria'ya etkilidir.</li><li>Gonokokta β-laktamaz enzimi penisilin direnci sağlar.</li></ul><h3>Sık karıştırılanlar</h3><ul class="mix"><li><b>Aşı:</b> meningokokta <span class='yes'>var</span>, gonokokta <span class='no'>yok</span>.</li><li><b>Endotoksin adı:</b> gonokokta lipopolisakkarit, meningokokta lipopoligosakkarit (slayttaki ifadeler).</li><li><b>Kapsül:</b> polisakkarit kapsül meningokokta vurgulanır; gonokokta porin ve Opa öne çıkar.</li><li><b>Moraxella catarrhalis Neisseria ile karıştırılır</b>; balgamda bol inflamatuar hücre ile diğer Gram (−) pnömonilerden ayrılır.</li><li>Gonokok tedavisi seftriakson + azitromisin; meningokok temaslısına profilaksi rifamisin / siprofloksasin / seftriakson.</li></ul>`,
`<h3>Solunum yolu kokobasilleri</h3><div class="callout">Üç etken, üç ayrı tablo: <span class="c">Moraxella catarrhalis: bronşit, sinüzit, otit</span><span class="c">Haemophilus influenzae: menenjit, epiglotit</span><span class="c">Bordetella pertussis: boğmaca</span></div>{{MINI}}<h3>Karşılaştırma tablosu</h3><div class="tbl"><table class="vs"><tr><th>Özellik</th><th>M. catarrhalis</th><th>H. influenzae</th><th>B. pertussis</th></tr><tr><td>Adın kökeni</td><td>Morax + catarrhus (mukus salgısı)</td><td>İnfluenza etkeni olduğu düşünülmüş</td><td>Bordet + per (şiddetli) tussis (öksürük)</td></tr><tr><td>Bulunduğu yer</td><td>Ağız florası; fırsatçı</td><td>Ağız florası (Hib nadir)</td><td>İnsan tek konak</td></tr><tr><td>Virülans</td><td>-</td><td>a-f kapsül antijenleri; en virülan serotip b; polisakkarit kapsül antifagositik; PRP (riboz, ribitol, fosfat); lipid A menenjiti indükler</td><td>Filamentöz hemaglütinin, pertaktin ile trakea epiteline bağlanır; pertussis toksini, adenilat siklaz/hemolizin, trakeal toksin</td></tr><tr><td>Hastalık</td><td>Bronşit, bronkopnömoni, sinüzit, otit</td><td>Menenjit, epiglotit, selülit, artrit</td><td>Boğmaca</td></tr><tr><td>Risk</td><td>-</td><td>Düşük antikor, geç kompleman eksikliği, splenektomi</td><td>Aşılanmamış olmak; 1 yaş altında şiddetli</td></tr><tr><td>Bulaş</td><td>-</td><td>Kişiden kişiye bulaşan menenjit etkeni</td><td>Kişiden kişiye aerosol</td></tr><tr><td>Tedavi</td><td>Sefalosporin, eritromisin, tetrasiklin, TMP-SMX; <span class='warn'>penisiline dirençli</span></td><td>Sefalosporinler</td><td>Makrolid (azitromisin / klaritromisin)</td></tr><tr><td>Aşı</td><td>Slaytta aşı bilgisi yok</td><td><span class='yes'>Hib konjuge PRP aşısı</span>: ilk 6 ayda, sonra 12-15. ayda</td><td><span class='yes'>5 doz:</span> 2, 4, 6, 15-18. ay ve 4-6 yaş</td></tr></table></div><h3>5. Moraxella catarrhalis</h3><ul><li>Diğer Gram (−) pnömonilerden <b>balgamda bol inflamatuar hücre</b> içermesiyle ayrılır.</li><li><b>Neisseria ile karıştırılır.</b> Fırsatçı patojendir; ağız florasında ürer.</li></ul><h3>6. Haemophilus influenzae</h3><ul><li>Kan kültüründe ürer. Kişiden kişiye bulaşan bir menenjit etkenidir; Hib aşısı uygulanır.</li><li>Kapsül antijenleri a'dan f'ye; <b>en virülan serotip b (Hib)</b>. Polisakkarit kapsül antifagositiktir.</li><li>Kapsül yapısı riboz, ribitol ve fosfat (<b>PRP</b>) içerir; <b>PRP'ye karşı antikorlar koruyucudur</b> (aşının temeli).</li><li>Hücre duvarındaki <b>lipid A</b> menenjiti indükler.</li></ul><h3>9. Bordetella pertussis</h3><ul><li>1 yaş altı çocuklarda şiddetli boğmaca gelişirken, farkına varmayanlar rezervuar olur; eliminasyonda aşı ve subklinik takip önemlidir.</li><li>Filamentöz hemaglütinin ve pertaktin ile trakea epiteline bağlanır; <b>aşılar bu proteinlerden yapılır</b>.</li></ul><div class="tbl"><table><tr><th>Toksin</th><th>Etki</th><th>Sonuç</th></tr><tr><td>Pertussis toksini, adenilat siklaz / hemolizin</td><td>Orofaringeal epitel ve makrofajlara bağlanır; Gi-alfa proteinini inhibe eder</td><td>Mukus artar, öksürük; fagositoz ve monosit yanıtı engellenir</td></tr><tr><td>Trakeal toksin</td><td>Epitel hücrelerini öldürür; İL-1 salgılatır</td><td>Ateş yükselir</td></tr></table></div><p><span class='k'>Boğmacanın seyri:</span></p><ul class="tree"><li><b>1.</b> Soğuk algınlığı belirtileri</li><li><b>2.</b> Tekrarlayan öksürük nöbetleri ve ıslık sesi</li><li><b>3.</b> Nöbetler azalır, komplikasyonlar ortaya çıkar</li></ul><h3>Klinik sendrom tablosunda</h3><div class="organ-grid"><div class="organ"><div class="oh">Sinüzit</div><span class="c">S. pneumoniae</span><span class="c">H. influenzae</span><span class="c">M. catarrhalis</span><small>karışık aerop ve anaerop bakteriler de</small></div><div class="organ"><div class="oh">Otitis media</div><span class="c">S. pneumoniae</span><span class="c">H. influenzae</span><span class="c">M. catarrhalis</span></div><div class="organ"><div class="oh">Bronşit</div><span class="c">M. catarrhalis</span><span class="c">Mycoplasma pneumoniae</span></div><div class="organ"><div class="oh">Menenjit</div><span class="c">H. influenzae</span><span class="c">N. meningitidis</span><span class="c">S. pneumoniae</span><span class="c">S. agalactiae</span><span class="c">E. coli</span><span class="c">L. monocytogenes</span></div><div class="organ"><div class="oh">Konjonktivit</div><span class="c">Haemophilus aegyptius</span><span class="c">S. aureus</span><span class="c">S. pneumoniae</span></div><div class="organ"><div class="oh">Endokardit (HACEK)</div><span class="c">Haemophilus</span><span class="c">Aggregatibacter</span><span class="c">Cardiobacterium</span><span class="c">Eikenella</span><span class="c">Kingella</span></div></div><h3>Sık karıştırılanlar</h3><ul class="mix"><li><b>Haemophilus influenzae, influenza (grip) etkeni değildir</b>; adını grip etkeni sanıldığı için almıştır.</li><li><b>Moraxella penisiline dirençlidir</b>; tedavide sefalosporin, eritromisin, tetrasiklin, TMP-SMX.</li><li><b>Hib aşısı</b> konjuge PRP'dir: ilk 6 ay + 12-15. ay. <b>Boğmaca aşısı</b> 5 dozdur: 2-4-6, 15-18. ay ve 4-6 yaş.</li><li>Moraxella ve Haemophilus ağız florasında; Bordetella'da <b>insan tek konaktır</b>.</li><li>Streptograminler (kinupristin-dalfopristin) Haemophilus ve Moraxella'ya etkilidir (antibiyotik tablosu).</li></ul>`,

şırı üşüme, şiddetli ağrı, soluk ya da renk değiştirmiş deri, uykuya meyil / zor uyanma / konfüzyon, 'ölecekmiş gibi hissetme', nefes darlığı.</p><h3>10. Francisella tularensis</h3><ul><li><b>Biyoterörizm etkenidir.</b> Kene ısırığı ve enfekte dokularla bulaşır.</li><li>Polisakkarit kapsül antikor aracılı fagositozu önler; <b>hücre içi</b> patojendir, fagositoza dirençlidir.</li><li>İnsan rastlantısal konaktır. Rezervuar: yabani memeliler, kan emen artropodlar, evcil hayvanlar, tavşanlar, kediler, keneler, ısıran sinekler. Tüm dünyada yaygındır.</li><li>Sindirimle bulaş için çok fazla bakteri alınmalıdır; kene dışkısından bulaş için kenenin uzun süre kan emmesi gerekir.</li></ul><div class="tbl"><table><tr><th>Tularemi (tavşan ateşi) bulaş yolları</th><th>Döngü</th></tr><tr><td>Kontamine aerosol / tarım tozlarının solunması; at sineği, kene, sivrisinek ısırığı; enfekte hayvanla temas; iyi pişmemiş tavşan eti; kontamine su</td><td>Tip A: karasal döngü<br>Tip B: sucul döngü</td></tr></table></div><h3>11. Brucella spp.</h3><ul><li>Çok küçüktür; 'seçilmiş ajan' olarak bilinir. <b>B. melitensis insanda en sık</b> görülendir.</li><li>Retiküloendotelyal hücre içi patojendir; fagositoza ve seruma dirençlidir.</li><li>Meme, plasenta, epididim ve uterusu enfekte eder; <b>süt, idrar ve doğum ürünlerine</b> geçer.</li><li>Risk: çiğ süt ve süt ürünleri tüketenler, hayvanla temas edenler, laboratuvar personeli.</li></ul><div class="tbl"><table><tr><th>Tür</th><th>Rezervuar</th></tr><tr><td>B. melitensis</td><td>Koyun, keçi</td></tr><tr><td>B. abortus</td><td>Sığır</td></tr><tr><td>B. suis</td><td>Ren geyiği, domuz</td></tr><tr><td>B. canis</td><td>Köpek, tilki, çakal</td></tr></table></div><p><span class='k'>Bruselloz bulguları:</span> <span class="c">Dalgalı ateş</span><span class="c">Kas-eklem ağrısı</span><span class="c">Titreme</span><span class="c">Terleme</span><span class="c">Yorgunluk</span><span class="c">Kilo kaybı</span><span class="c">Çoklu organ tutulumu</span></p><h3>Ayırt edici ipuçları</h3><div class="tbl"><table class="clue"><tr><th>İpucu</th><th>Etken</th></tr><tr><td>İnsan ısırığı yarası</td><td><span class="c">Eikenella</span></td></tr><tr><td>Kedi / köpek ısırığı, tırmalama</td><td><span class="c">Pasteurella</span></td></tr><tr><td>Sinsi seyirli septik artrit, kültürün geç üremesi</td><td><span class="c">Kingella</span></td></tr><tr><td>Hastane, solunum cihazı, çoklu dirençli; yalnız kolistin etkili</td><td><span class="c">Acinetobacter</span></td></tr><tr><td>Kene / tavşan; ülser + lenf bezi tutulumu</td><td><span class="c">Francisella</span></td></tr><tr><td>Çiğ süt, koyun-keçi teması, dalgalı ateş</td><td><span class="c">Brucella</span></td></tr></table></div><h3>Sık karıştırılanlar</h3><ul class="mix"><li><b>HACEK</b> (endokardit): Haemophilus, Aggregatibacter, Cardiobacterium, <b>Eikenella, Kingella</b>. Pasteurella HACEK'te değildir.</li><li><b>Isırık yaraları</b> tablosunda: Eikenella corrodens, Pasteurella multocida, karışık aerop ve anaeroplar. İnsan ısırığı → Eikenella; hayvan → Pasteurella.</li><li><b>Gentamisin</b> Francisella'nın ana ilacı; Brucella'da doksisikline <b>eklenebilir</b>.</li><li><b>Aşı:</b> Brucella'da var (hayvan aşılaması ile korunma); Francisella'da canlı aşı var ama insanda kullanılmaz.</li><li>Eikenella, Kingella ve Pasteurella ağız florasında (Pasteurella hayvan florasında); <b>Acinetobacter florada yoktur</b>.</li></ul>`,
`<h3>Aerobik Gram (+) basiller</h3><ul class="tree"><li><span class='k'>Spor oluşturan:</span> <span class="c">Bacillus (B. anthracis, B. cereus)</span></li><li><span class='k'>Spor oluşturmayan:</span> <span class="c">Listeria</span><span class="c">Corynebacterium</span></li></ul><div class="tbl"><table><tr><th>Etken</th><th>Akılda kalacak sayı / bilgi</th></tr><tr><td>B. anthracis</td><td>Şarbon, bakterinin kaza ile insana geçmesiyle oluşur</td></tr><tr><td>B. cereus</td><td>ABD'de 65 bin gıda zehirlenmesi</td></tr><tr><td>L. monocytogenes</td><td>Buzdolabında ve tuzda ürer; et ve süt ürünlerini bozar</td></tr><tr><td>C. diphtheriae</td><td>Aşıdan önce 200 bin difteri; aşıdan sonra yalnız 2 vaka bildirilmiş</td></tr></table></div>{{MINI}}<h3>Karşılaştırma tablosu</h3><div class="tbl"><table class="vs"><tr><th>Özellik</th><th>B. anthracis</th><th>B. cereus</th><th>L. monocytogenes</th><th>C. diphtheriae</th></tr><tr><td>Adın kökeni</td><td>'Kömür' (siyah lezyon)</td><td>Mumlu yüzey</td><td>Lord Joseph Lister</td><td>-</td></tr><tr><td>Virülans</td><td>Poli-D-glutamik asit kapsül (fagositozu önler), koruyucu antijen, letal faktör, ödem toksini (adenilat siklaz)</td><td>Enterotoksin; sereolizin (hemoliz); PLC (lesitinaz); sitotoksik enzimler</td><td>Yüzey proteinleri reseptöre bağlanır; hemolizinler hücre içinde sağ kalım ve çoğalma</td><td>Lizojenik β-faj; A-B ekzotoksin EF-2'yi inhibe eder</td></tr><tr><td>Kaynak / bulaş</td><td>Sığır konak; insan rastlantısal; spor toprakta</td><td>Toprak, çevre; kontamine besinler ve yaralar</td><td>Toprak, bitki, hayvan, su; işlenmiş et, çiğ sebze, sosis, süt; transplasental</td><td>Sadece insan; damlacık ve deri; asemptomatik taşıyıcılar</td></tr><tr><td>Hastalık</td><td>Deri, bağırsak, akciğer şarbonu</td><td>Gastroenterit, travmatik göz enfeksiyonu, fırsatçı enfeksiyonlar, şarbon benzeri pulmoner hastalık</td><td>Erken / geç yenidoğan hastalığı, ateşli bakteriyemi, menenjit, grip benzeri tablo, gastroenterit</td><td>Respiratuvar ve kutanöz difteri</td></tr><tr><td>Tedavi</td><td>Siprofloksasin + doksisiklin (kombine); doğal yolla oluşmuşsa amoksisilin yeterli</td><td>GİS: semptomatik; göz: siprofloksasin, klindamisin, vankomisin, gentamisin</td><td>Penisilin ve ampisilin</td><td>Penisilin, eritromisin; ekzotoksin nötralizasyonu</td></tr><tr><td>Aşı / korunma</td><td><span class='yes'>Aşı etkili</span> ama toksisitesi var; sporları topraktan elimine etmek zor</td><td>Slaytta aşı yok; besin uygun hazırlanıp hemen tüketilmeli ya da buzdolabında saklanmalı</td><td>Slaytta aşı yok; yüksek riskliler krem peynir, çiğ gıda, yıkanmamış sebzeden kaçınmalı</td><td><span class='yes'>Toksoid aşı</span>; aşılanan ülkelerde nadir</td></tr></table></div><h3>Bacillus anthracis</h3><ul><li>Hastalık için <b>kapsül + koruyucu antijen + letal faktör + ödem toksini</b> birlikte gerekir.</li><li>Letal toksin makrofajları uyararak TNF ve İL salgılatır; ödem toksini (adenilat siklaz) ödem yapar.</li><li>Nadir görüldüğü ve deneyim az olduğu için tanısı zordur. Hayvan aşılamasının az olduğu ülkelerde yaygındır.</li><li><span class='warn'>Biyolojik silah potansiyeli</span> vardır; biyoterörizmde kullanılabilir. Etkeni Robert Koch bulmuştur.</li></ul><h3>Bacillus cereus</h3><div class="tbl"><table><tr><th>Suş</th><th>Enterotoksin</th><th>Sonuç</th></tr><tr><td>Isıya dirençli</td><td>Isıya dayanıklı toksin</td><td><b>Kusma</b></td></tr><tr><td>Isıya duyarlı</td><td>Isıya duyarlı toksin</td><td><b>İshal</b></td></tr></table></div><ul><li>Fırsatçıdır; önemsiz kontaminant sanıldığı için tanısı zordur. Gıdaların saklama ve üretim koşulları takip edilmelidir.</li><li>Sereolizin ve PLC ile <b>gözde doku hasarı</b> yapar (endoftalmit: B. cereus, S. aureus, P. aeruginosa).</li></ul><h3>Listeria monocytogenes</h3><ul><li><b>Mide asidi ve safraya dirençlidir; buzdolabında ve yüksek tuzda</b> yaşayabilir.</li><li>Hücre içi fakültatiftir; bozulmuş gıdalarla toplumda hızla yayılır; tüm yıl sporadik ya da epidemik görülür.</li><li>Florada bulunan streptokok ve korinebakterilerden zor ayırt edilir.</li><li>Risk: <b>yenidoğan, yaşlı ve hasta kişiler</b>; transplasental geçer.</li></ul><h3>Corynebacterium diphtheriae</h3><ul><li>Deri ve mukozada farklı korinebakteriler bulunur; çoğu fırsatçı ve kontaminanttır. C. diphtheriae sık rastlanmayan ve zor izole edilen türdür.</li><li>Lizojenik β-faj ile A-B ekzotoksin üretir; toksin <b>protein zinciri uzama faktörü-2'yi (EF-2)</b> inhibe eder.</li><li>Slayt: 'Difteri; aşı ile önlenebilen ölümcül bir hastalıktır. Aşılar hayat kurtarır.'</li></ul><h3>Klinik sendrom tablosunda</h3><div class="organ-grid"><div class="organ"><div class="oh">Besin zehirlenmesi</div><span class="c">S. aureus</span><span class="c">B. cereus</span></div><div class="organ"><div class="oh">Gastroenterit</div><span class="c">B. cereus</span><span class="c">Salmonella</span><span class="c">Shigella</span><span class="c">Campylobacter</span><span class="c">E. coli</span><span class="c">V. cholerae</span></div><div class="organ"><div class="oh">Endoftalmit</div><span class="c">B. cereus</span><span class="c">S. aureus</span><span class="c">P. aeruginosa</span></div><div class="organ"><div class="oh">Travma yaraları</div><span class="c">Bacillus türleri</span><span class="c">S. aureus</span></div><div class="organ"><div class="oh">Menenjit</div><span class="c">L. monocytogenes</span><span class="c">S. agalactiae</span><span class="c">E. coli</span><span class="c">H. influenzae</span><span class="c">S. pneumoniae</span><span class="c">N. meningitidis</span></div></div><h3>Sık karıştırılanlar</h3><ul class="mix"><li><b>Spor:</b> yalnız Bacillus spor oluşturur; Listeria ve Corynebacterium sporsuzdur.</li><li><b>B. cereus:</b> ısıya dirençli toksin → kusma, ısıya duyarlı toksin → ishal.</li><li><b>Adenilat siklaz</b> şarbonda ödem toksinidir; Bordetella'da da adenilat siklaz/hemolizin toksini vardır.</li><li><b>Listeria tedavisi</b> penisilin / ampisilin; buzdolabı onu durdurmaz. B. cereus'ta ise buzdolabında saklama önerilir.</li><li><b>Difteri tedavisi</b> antibiyotik (penisilin, eritromisin) + ekzotoksin nötralizasyonu; korunma toksoid aşı.</li><li><b>Şarbon:</b> doğal yolla oluşmuşsa amoksisilin yeterli; aksi halde siprofloksasin + doksisiklin.</li></ul>`,
`<h3>Aside dirençli bakteriler: ortak özellikler</h3><div class="callout">Hareketsiz, sporsuz <b>Gram (+) basiller</b>. Hücre duvarındaki <b>mikolik asitler</b> asitle boyanmaya (renk kaybına) direnç sağlar. <span class="c">Mycobacterium</span><span class="c">Nocardia</span><span class="c">Rhodococcus</span><span class="c">Gordonia</span><span class="c">Tsukamurella</span></div><ul><li>Yavaş ürerler; sert çevre şartlarına, dezenfektanlara ve antibiyotiklere dirençlidirler.</li><li>Hastalık persistan kalabilir; ortaya çıkması konağın immün yeteneğine bağlıdır.</li><li>Fagositozda <b>fagozom-lizozom birleşmesini engeller</b> (tüberkülozda olduğu gibi).</li><li><b>Granülomlar</b> enfeksiyonu sınırlar ama bakterinin canlı kalmasını da sağlar.</li><li>Mycobacterium ve Nocardia <b>eksojendir</b>.</li></ul><div class="tbl"><table><tr><th>Cins</th><th>Klinik</th></tr><tr><td>Rhodococcus</td><td>İmmün yetmezlikte patojen; primer invaziv pulmoner hastalık</td></tr><tr><td>Gordonia, Tsukamurella</td><td>Fırsatçı; pulmoner enfeksiyon ve İV kateter enfeksiyonu</td></tr></table></div>{{MINI}}<h3>Mycobacterium tuberculosis: patogenez zinciri</h3><ul class="tree"><li>Solunum yolu → alveol penetrasyonu</li><li>→ Makrofaj fagositozu → fagozom-lizozom birleşme engeli</li><li>→ Sitokinler, T ve NK hücrelerinin gelişi → makrofaj aktivasyonu</li><li>→ Nekrotik hücreler: <b>granülom (tüberkül)</b></li></ul><ul><li>Akciğerde tüberkül oluşumu ile karakterizedir; hücre içi, persistan, hayat boyu enfeksiyon yapabilir.</li><li>Kümeler halindedir; yavaş ürer (2-6 hafta inkübasyon); <b>deri testi pozitif</b>.</li><li>Dünyanın 1/4'ü enfekte; 2019'da 1,4 milyon ölüm. Doğu Avrupa, Afrika, Çin, Hindistan, Pakistan'da görülür; ABD'de yılda 9000 vaka göçmenlerde.</li><li>Risk: immün yetmezlik, HIV, ilaç ve alkol bağımlılığı, evsizlik. Kişiden kişiye aerosol; <b>insan tek rezervuar</b>.</li><li>Hastalık: <span class="c">Pulmoner tüberküloz</span><span class="c">Ekstrapulmoner tüberküloz</span></li></ul><h3>Mycobacterium leprae (cüzzam)</h3><div class="tbl"><table class="vs"><tr><th></th><th>Tüberküloid lepra</th><th>Lepromatöz lepra</th></tr><tr><td>İmmün yanıt</td><td>Hücresel bağışıklık ile sitokin artar, makrofajlar basilleri temizler</td><td>Bol aside dirençli basil, yaygın nekroz</td></tr><tr><td>Bulaşıcılık</td><td>-</td><td><span class='warn'>Yüksek bulaşıcı</span></td></tr><tr><td>Tedavi süresi</td><td>6 ay</td><td>18 ay</td></tr></table></div><ul><li><b>Kültürde üretilememiştir.</b> Yara eksudaları, solunum salgıları ve aerosollerle vücuda girer.</li><li>Yavaş üreme ve immün yanıtla hastalık oluşur; klinik belirtilerin ortaya çıkması yıllar sürer. Deri testi pozitiftir.</li><li>Brezilya ve Endonezya'da görülmüştür; ABD'de yılda 200 yeni olgu. Karantina ve tedavi önemlidir.</li></ul><h3>Mycobacterium avium</h3><ul><li>Tüberküloz benzeri hastalığı olan <b>kuşlardan</b> (avis) elde edilmiştir.</li><li><b>AIDS hastalarında en sık fırsatçı enfeksiyondur.</b> Akciğer hastalığı olanlarda yavaş, immün yetmezlikte hızlı ilerler.</li><li>Kontamine su ve besinle bulaşır; tüberkülozun az olduğu ülkelerde görülür. Kültürde çevresel kontaminasyon olabilir; kronik akciğer hastalığı olan yaşlılarda çok sayıda balgam incelenmelidir.</li><li>Hastalık: <span class="c">Pulmoner enfeksiyon</span><span class="c">Servikal adenit</span><span class="c">Dissemine hastalık</span></li></ul><h3>Nocardia</h3><ul><li>Fransız veteriner Edmond Nocard'a ithaf edilmiştir. <b>Kısmi aside dirençlidir</b>; uzun, dallanan filamentler oluşturur; kültürde 3-4 günde ürer.</li><li>Organik toprakta bulunur, dünyada yaygındır; immün yetmezlikte fırsatçı enfeksiyon yapar. Eksojen enfeksiyon inhalasyon ve kutanöz travma ile olur.</li><li>Risk: HIV, kanser, transplantasyon gibi immün yetmezlikler ve travmatik enfeksiyonlar.</li><li>Pnömoni olarak başlayan enfeksiyon <b>beyin ve deride apselere</b> dönüşür.</li><li>Hastalık: <span class="c">Bronkopulmoner hastalık</span><span class="c">Miçetom</span><span class="c">Lenfokutanöz hastalık</span><span class="c">Selülit</span><span class="c">Subkutan apse</span><span class="c">Beyin apsesi</span></li></ul><h3>Tedavi ve aşı özeti</h3><div class="tbl"><table class="vs"><tr><th>Etken</th><th>Tedavi</th><th>Korunma / aşı</th></tr><tr><td>M. tuberculosis</td><td>Rifamisin, etambutol, izoniazid; tedavi hızla değiştiği için bölgeseldir</td><td>Profilaksi: 3 ay izoniazid + rifapentin; <span class='yes'>BCG aşısı</span>; dikkatli olgu takibi ve tarama</td></tr><tr><td>M. leprae</td><td>Rifamisin, dapson, klofazimin (tüberküloid 6 ay, lepromatöz 18 ay)</td><td>Slaytta aşı yok; karantina ve tedavi</td></tr><tr><td>M. avium</td><td>Etambutol + rifabutin; klaritromisin ve azitromisin idame tedavide ve CD4 sayısı düşük kişilerde</td><td>Slaytta aşı yok</td></tr><tr><td>Nocardia</td><td>İmmünokompetan kutanöz: TMP-SMX; immün yetmezlik: TMP-SMX + amikasin; SSS: TMP-SMX + imipenem veya sefalosporin; tedavi 12 ay</td><td>Slaytta aşı yok; yara bakımı; her yerde bulunduğundan temastan kaçınmak zor</td></tr></table></div><h3>Antibiyotik tablosundan</h3><ul><li>İzoniazid, etiyonamid: <b>mikolik asit sentezini</b> inhibe eder.</li><li>Etambutol: <b>arabinogalaktan sentezini</b> inhibe eder.</li><li>Rifampin, rifabutin: DNA'ya bağımlı RNA polimerazı bağlar; mikobakteriler ve aerop Gram (+)'lara etkili.</li><li>Dapson: dihidropteroat sentazı inhibe eder; mikobakterilere etkili.</li><li>Klaritromisin ve azitromisin bazı mikobakterilere de etkindir.</li></ul><h3>Sık karıştırılanlar</h3><ul class="mix"><li><b>Tam / kısmi aside dirençli:</b> Nocardia <b>kısmi</b> ARB'dir ve dallanan filament yapar.</li><li><b>Kültür:</b> M. leprae kültürde üretilemez; M. tuberculosis 2-6 hafta; Nocardia 3-4 gün.</li><li><b>Bulaş:</b> M. tuberculosis aerosol (insan tek rezervuar); M. avium kontamine su ve besin.</li><li><b>Lepromatöz</b> form bol basilli ve yüksek bulaşıcıdır, tedavi 18 ay; <b>tüberküloid</b> form 6 ay.</li><li><b>AIDS'te en sık fırsatçı:</b> M. avium; tedavide etambutol + rifabutin (rifabutin, rifampin ile karıştırılmasın).</li><li><b>Granülomatöz hastalık</b> tablosu: M. tuberculosis, Nocardia, T. pallidum.</li></ul>`,
`<h3>Vaka çözme mantığı</h3><div class="callout">Vaka sorusunda sırayla bak: <b>1)</b> hastalığın yeri (organ), <b>2)</b> hastanın özelliği (yaş, gebelik, immün durum), <b>3)</b> maruziyet (ısırık, gıda, hayvan, hastane), <b>4)</b> tedavi veya aşı ipucu. Aşağıdaki ipuçlarının hepsi slaytlardan.</div><h3>Maruziyet ipucu → etken</h3><div class="tbl"><table class="clue"><tr><th>Vakada bunu görürsen</th><th>Aklına gelsin</th></tr><tr><td>İnsan ısırığı yarası</td><td><span class="c">Eikenella corrodens</span></td></tr><tr><td>Kedi ısırığı (derin), köpek ısırığı, tırmalama</td><td><span class="c">Pasteurella multocida</span></td></tr><tr><td>Çiğ süt ve süt ürünleri, hayvan teması, laboratuvar personeli; dalgalı ateş</td><td><span class="c">Brucella</span></td></tr><tr><td>Koyun-keçi / sığır / domuz / köpek kaynağı</td><td><span class="c">B. melitensis</span><span class="c">B. abortus</span><span class="c">B. suis</span><span class="c">B. canis</span></td></tr><tr><td>Kene ısırığı, tavşan, kontamine aerosol; ülser + lenf bezi</td><td><span class="c">Francisella tularensis</span></td></tr><tr><td>Hastane, solunum cihazı, cerrahi yara; neredeyse tüm antibiyotiklere direnç, yalnız kolistin etkili</td><td><span class="c">Acinetobacter baumannii</span></td></tr><tr><td>Savaş bölgesinden dönen asker, pnömoni ve ağır sepsis</td><td><span class="c">Acinetobacter baumannii</span></td></tr><tr><td>Yüksek tuzlu gıda, kusma-ishal-mide krampı</td><td><span class="c">S. aureus</span></td></tr><tr><td>Gıda zehirlenmesi: kusma (ısıya dirençli toksin) veya ishal (ısıya duyarlı toksin)</td><td><span class="c">B. cereus</span></td></tr><tr><td>Gebe / yenidoğan / yaşlı + krem peynir, sosis, çiğ sebze, buzdolabında saklanan gıda</td><td><span class="c">Listeria monocytogenes</span></td></tr><tr><td>Sığır teması, siyah deri lezyonu ('kömür'); biyoterörizm</td><td><span class="c">Bacillus anthracis</span></td></tr><tr><td>Travmatik göz yaralanması sonrası enfeksiyon</td><td><span class="c">Bacillus cereus</span></td></tr><tr><td>Kontamine su ve besin, AIDS hastası</td><td><span class="c">Mycobacterium avium</span></td></tr><tr><td>Organik toprak, travma; pnömoni sonrası beyin / deri apsesi</td><td><span class="c">Nocardia</span></td></tr></table></div><h3>Hasta ve tablo ipucu → etken</h3><div class="tbl"><table class="clue"><tr><th>Vakada bunu görürsen</th><th>Aklına gelsin</th></tr><tr><td>Bakteriyel farenjit; 10 gün içinde tedavi edilmezse romatizmal ateş</td><td><span class="c">S. pyogenes</span></td></tr><tr><td>Farenjit sonrası akut glomerülonefrit</td><td><span class="c">S. pyogenes</span></td></tr><tr><td>Ateş + hipotansiyon + döküntü (toksik şok)</td><td><span class="c">S. aureus</span><span class="c">S. pyogenes</span></td></tr><tr><td>Cilt soyulması (haşlanmış deri)</td><td><span class="c">S. aureus</span></td></tr><tr><td>Erken membran rüptürü, yenidoğan sepsisi / menenjiti</td><td><span class="c">S. agalactiae</span></td></tr><tr><td>Aspleni veya hematolojik hastalık + fulminan sepsis</td><td><span class="c">S. pneumoniae</span></td></tr><tr><td>Viral enfeksiyon geçiren çocukta otitis media, sinüzit, pnömoni; soğuk aylar</td><td><span class="c">S. pneumoniae</span></td></tr><tr><td>Geniş spektrumlu sefalosporin altında hastane kaynaklı İYE, peritonit, endokardit</td><td><span class="c">Enterococcus</span></td></tr><tr><td>Akıntı + idrarda yanma; kadında asemptomatik taşıyıcılık; kısırlık</td><td><span class="c">N. gonorrhoeae</span></td></tr><tr><td>Yenidoğan konjonktiviti (oftalmia neonatorum)</td><td><span class="c">N. gonorrhoeae</span></td></tr><tr><td>Septik artritin en sık nedeni (slayt)</td><td><span class="c">N. gonorrhoeae</span></td></tr><tr><td>Üniversite yurdu, askeriye, bakım evi; menenjit, kuru-soğuk aylar</td><td><span class="c">N. meningitidis</span></td></tr><tr><td>Geç kompleman eksikliği + menenjit</td><td><span class="c">N. meningitidis</span><span class="c">H. influenzae</span></td></tr><tr><td>Aşısız çocukta menenjit, epiglotit; splenektomi</td><td><span class="c">H. influenzae (Hib)</span></td></tr><tr><td>Balgamda bol inflamatuar hücreli pnömoni, bronşit, otit; Neisseria ile karışan</td><td><span class="c">Moraxella catarrhalis</span></td></tr><tr><td>Aşısız bebekte nöbet tarzı öksürük ve ıslık sesi</td><td><span class="c">Bordetella pertussis</span></td></tr><tr><td>Sinsi seyirli septik artrit; kültür geç ürer</td><td><span class="c">Kingella kingae</span></td></tr><tr><td>Subakut endokardit (HACEK)</td><td><span class="c">Haemophilus</span><span class="c">Aggregatibacter</span><span class="c">Cardiobacterium</span><span class="c">Eikenella</span><span class="c">Kingella</span></td></tr><tr><td>Aşısız kişide respiratuvar veya kutanöz difteri; EF-2'yi inhibe eden toksin</td><td><span class="c">Corynebacterium diphtheriae</span></td></tr><tr><td>Göçmen, HIV, evsizlik; akciğerde tüberkül, deri testi pozitif</td><td><span class="c">M. tuberculosis</span></td></tr><tr><td>Deri lezyonları, yıllar içinde gelişen tablo; kültürde üretilemez</td><td><span class="c">M. leprae</span></td></tr></table></div><h3>Tedavi ipucu → etken</h3><div class="tbl"><table class="clue"><tr><th>Soruda geçen tedavi</th><th>Etken</th></tr><tr><td>Kolistin tek etkili antibiyotik</td><td><span class="c">Acinetobacter</span></td></tr><tr><td>Gentamisin; penisilin ve sefalosporin etkisiz</td><td><span class="c">Francisella</span></td></tr><tr><td>Doksisiklin (+ gentamisin / streptomisin)</td><td><span class="c">Brucella</span></td></tr><tr><td>Monomikrobiyal ampisilin, polimikrobiyal amoksisilin-klavulanat; endokarditte seftriakson</td><td><span class="c">Eikenella</span></td></tr><tr><td>Oksasiline dirençli; penisilin + geniş spektrumlu sefalosporin</td><td><span class="c">Pasteurella</span></td></tr><tr><td>Penisiline dirençli; sefalosporin, eritromisin, tetrasiklin, TMP-SMX</td><td><span class="c">Moraxella</span></td></tr><tr><td>Seftriakson + azitromisin; yenidoğanda %1 AgNO<sub>3</sub></td><td><span class="c">N. gonorrhoeae</span></td></tr><tr><td>Temaslıya rifamisin / siprofloksasin / seftriakson profilaksisi</td><td><span class="c">N. meningitidis</span></td></tr><tr><td>Makrolid (azitromisin / klaritromisin)</td><td><span class="c">B. pertussis</span></td></tr><tr><td>Doğumdan 4 saat önce penisilin</td><td><span class="c">S. agalactiae</span></td></tr><tr><td>Penisilin dirençliyse seftriakson + vankomisin</td><td><span class="c">S. pneumoniae</span></td></tr><tr><td>İnsizyon-drenaj; TMP-SMX, klindamisin, doksisiklin; IV vankomisin</td><td><span class="c">S. aureus (MRSA)</span></td></tr><tr><td>Aminoglikozid + ampisilin; dirençte linezolid, daptomisin</td><td><span class="c">Enterococcus</span></td></tr><tr><td>Siprofloksasin + doksisiklin; doğal yolla amoksisilin</td><td><span class="c">B. anthracis</span></td></tr><tr><td>Penisilin + ampisilin</td><td><span class="c">Listeria</span></td></tr><tr><td>Antibiyotik + ekzotoksin nötralizasyonu + toksoid</td><td><span class="c">C. diphtheriae</span></td></tr><tr><td>3 ay izoniazid + rifapentin profilaksisi</td><td><span class="c">M. tuberculosis</span></td></tr><tr><td>Rifamisin, dapson, klofazimin (6 / 18 ay)</td><td><span class="c">M. leprae</span></td></tr><tr><td>Etambutol + rifabutin; idamede klaritromisin / azitromisin</td><td><span class="c">M. avium</span></td></tr><tr><td>TMP-SMX (+ amikasin / imipenem); 12 ay</td><td><span class="c">Nocardia</span></td></tr></table></div><h3>Aşı sorusu hızlı tablo</h3><div class="tbl"><table><tr><th>Aşı durumu</th><th>Etkenler</th></tr><tr><td><span class='yes'>Aşı var</span></td><td><span class="c">N. meningitidis</span><span class="c">H. influenzae (Hib konjuge PRP)</span><span class="c">S. pneumoniae (13 konjuge / 23 polivalan)</span><span class="c">B. pertussis (5 doz)</span><span class="c">C. diphtheriae (toksoid)</span><span class="c">M. tuberculosis (BCG)</span><span class="c">B. anthracis (etkili ama toksik)</span><span class="c">Brucella</span></td></tr><tr><td><span class='no'>Aşı yok</span></td><td><span class="c">S. aureus</span><span class="c">S. agalactiae</span><span class="c">N. gonorrhoeae</span></td></tr><tr><td>Var ama insanda kullanılmaz</td><td><span class="c">Francisella (canlı aşı)</span></td></tr></table></div><h3>Sınavda tuzak olabilecekler</h3><ul class="mix"><li>Isırık: <b>insan → Eikenella</b>, <b>kedi-köpek → Pasteurella</b>. Kedi ısırığı daha derin olduğu için daha tehlikeli.</li><li>Çiğ süt → <b>Brucella</b>; krem peynir / buzdolabı gıdası + gebe → <b>Listeria</b>.</li><li>Kolistin → <b>Acinetobacter</b>; Gram (+)'lara etkisizdir çünkü onlarda dış membran yoktur.</li><li><b>Gentamisin</b> hem Francisella (ana ilaç) hem Brucella (ek ilaç) tedavisinde geçer.</li><li>Gonokok ve meningokokun ikisi de yalnız insanda yaşar; aşı yalnız meningokokta vardır.</li></ul>`

": "ARB · fırsatçılar", "alias": ["Rhodococcus", "Gordonia", "Tsukamurella"], "kimlik": ["Aside dirençli bakteriler grubunda (Mycobacterium, Nocardia ile birlikte)"], "bulas": ["Slaytta ayrı bulaş yolu verilmemiş"], "risk": ["**Rhodococcus:** immün yetmezliği olanlarda patojen", "**Gordonia, Tsukamurella:** fırsatçı"], "virulans": ["Fırsatçı"], "hastalik": ["Rhodococcus → **primer invaziv pulmoner hastalık**", "Gordonia ve Tsukamurella → **pulmoner enfeksiyon, IV kateter enfeksiyonu**"], "tedavi": ["Slaytta belirtilmemiş"], "korunma": ["Slaytta belirtilmemiş"], "akil": ["**Mycobacterium ve Nocardia eksojendir**"], "key": {"kimlik": "Aside dirençli bakteri grubu", "bulas": "Slaytta belirtilmemiş", "virulans": "Fırsatçı", "hastalik": "İnvaziv pulmoner hastalık; IV kateter enfeksiyonu", "tedavi": "Slaytta belirtilmemiş", "korunma": "Slaytta belirtilmemiş"}, "kitap": ["Rhodococcus equi: atla temas öyküsü olan (immünsüpresif) hastada invaziv pulmoner hastalık yapar.", "R. equi ARB (+) basil görünümündedir; kültürde somon-pembe renkli mukoid koloniler oluşturur."]}];

const ORG = Object.fromEntries(ORGS.map(o=>[o.id,o]));


/* ---------- Yeniden tasarlanan konu özetleri (Klinik, Antibiyotik ve organizma konuları) ----------
