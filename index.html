<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mikrobiyoloji Soru Bankası</title>
<meta name="description" content="Açıklamalı mikrobiyoloji soru bankası, mikroorganizma kimlik kartları atlası ve görsel konu özetleri.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%230b7285'/%3E%3Ccircle cx='24' cy='26' r='6' fill='%23fff'/%3E%3Ccircle cx='40' cy='24' r='5' fill='%23fff'/%3E%3Ccircle cx='34' cy='40' r='7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: tek sütun çalışma defteri; set menüsünde üç çalışma modu (test / kart / özet) */
:root{
  --bg:#f3f6f6;
  --surface:#ffffff;
  --fg:#17292c;
  --muted:#5a6f72;
  --accent:#0b7285;
  --accent-ink:#ffffff;
  --accent-soft:#e1f0f3;
  --line:#d7e2e3;
  --good:#2b7a3f;
  --good-soft:#e5f3e8;
  --bad:#b3362e;
  --bad-soft:#faeae8;
  --chip:#eef3f3;
  --display:'Lora',Georgia,'Times New Roman',serif;
  --body:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1719; --surface:#172124; --fg:#e6eef0; --muted:#9db0b3;
    --accent:#5cc0d4; --accent-ink:#06282e; --accent-soft:#113640;
    --line:#2a383b; --good:#7ccb8c; --good-soft:#163420; --bad:#e8847c; --bad-soft:#3a1d1a;
    --chip:#1f2b2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172124; --fg:#e6eef0; --muted:#9db0b3;
  --accent:#5cc0d4; --accent-ink:#06282e; --accent-soft:#113640;
  --line:#2a383b; --good:#7ccb8c; --good-soft:#163420; --bad:#e8847c; --bad-soft:#3a1d1a;
  --chip:#1f2b2e; color-scheme:dark;
}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 48px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.wrap{max-width:740px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- ana ekran ---------- */
.masthead{padding:34px 0 10px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.masthead h1{font-size:clamp(28px,6vw,38px);font-weight:700;margin-top:6px}
.masthead p{color:var(--muted);margin:10px 0 0;max-width:58ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.stat{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.stat b{color:var(--fg);font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.set-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg)}
.set-card:hover{border-color:var(--accent)}
.set-num{flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;font-weight:700}
.set-card.special .set-num{background:var(--accent);color:var(--accent-ink)}
.set-body{min-width:0;flex:1}
.set-title{font-weight:800;font-size:16px}
.set-desc{color:var(--muted);font-size:13.5px;margin-top:2px}
.set-meta{display:flex;gap:10px;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.set-meta .best{color:var(--good)}
.go{flex:none;color:var(--accent);font-size:22px;font-weight:800}
.note{color:var(--muted);font-size:13px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:18px}
.plan .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.plan ol{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--fg)}
.plan li{margin:3px 0}
.plan b{color:var(--accent)}

/* ---------- set menüsü ---------- */
.menu-head{padding:26px 0 4px}
.menu-head h2{font-size:clamp(22px,5vw,28px)}
.menu-head p{color:var(--muted);margin:8px 0 0}
.modes{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--fg)}
.mode:hover{border-color:var(--accent)}
.mode .ic{flex:none;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--accent-soft)}
.mode .t{font-weight:800;font-size:15.5px}
.mode .d{color:var(--muted);font-size:13px;margin-top:2px}

/* ---------- soru ekranı ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn-ghost{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;padding:6px 8px;border-radius:8px}
.btn-ghost:hover{color:var(--accent)}
.counts{font-size:13.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.counts .ok{color:var(--good)} .counts .no{color:var(--bad)}
.bar{height:6px;background:var(--chip);border-radius:999px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
.quiz-set-name{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:18px 0 6px}
.qtext{font-family:var(--display);font-size:clamp(18px,4.2vw,22px);font-weight:600;line-height:1.45;margin:4px 0 18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  color:var(--fg);font-size:15.5px;line-height:1.45}
.opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:none;width:26px;height:26px;border-radius:8px;background:var(--chip);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt span.txt{min-width:0}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.verdict{margin-top:16px;font-weight:800;font-size:15px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.explain{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:0 12px 12px 0;padding:13px 15px}
.explain .label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.explain p{margin:6px 0 0;font-size:14.5px;color:var(--fg)}
.explain p b,.review-item .re b,.flash-exp b{color:var(--accent)}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:11px;
  padding:12px 22px;font-size:15px;font-weight:800}
.btn:hover{filter:brightness(1.06)}
.btn.secondary{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.btn.badbtn{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.btn.goodbtn{background:var(--good);color:#fff}
.hint-keys{color:var(--muted);font-size:12.5px;margin-top:14px}

/* ---------- bilgi kartları ---------- */
.flash-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-top:16px;min-height:200px;display:flex;flex-direction:column}
.flash-q{font-family:var(--display);font-size:clamp(17px,4vw,21px);font-weight:600;line-height:1.5}
.flash-back{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.flash-ans{font-weight:800;color:var(--good);font-size:15.5px}
.flash-exp{font-size:14.5px;color:var(--fg);margin-top:8px}
.flash-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.flash-tag{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.flash-tag .again{color:var(--bad)}

/* ---------- özet ---------- */
.sum h3{font-size:17px;margin:24px 0 8px;color:var(--accent)}
.sum p{font-size:14px;margin:6px 0}
.sum ul{margin:6px 0;padding-left:20px;font-size:14px}
.sum li{margin:3px 0}
.sum .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sum table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:430px}
.sum th{background:var(--accent-soft);color:var(--accent);text-align:left;padding:8px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sum td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
.sum td:first-child{font-weight:800;white-space:nowrap}
.sum .k{color:var(--accent);font-weight:800}
.sum .warn{color:var(--bad);font-weight:700}
.sum .okk{color:var(--good);font-weight:700}

/* ---------- sonuç ekranı ---------- */
.result-head{text-align:center;padding:34px 0 8px}
.score-ring{width:128px;height:128px;margin:0 auto;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:
  conic-gradient(var(--good) calc(var(--p)*1%), var(--chip) 0)}
.score-ring > div{width:100px;height:100px;border-radius:50%;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring b{font-size:26px;font-variant-numeric:tabular-nums}
.score-ring small{color:var(--muted);font-weight:700;font-size:12px}
.result-head h2{font-size:24px;margin-top:14px}
.result-head p{color:var(--muted);margin:6px 0 0}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 8px}
.review h3{font-size:18px;margin:26px 0 10px}
.review-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
.review-item .rq{font-weight:700;font-size:14.5px}
.review-item .ra{font-size:13.5px;margin-top:8px}
.review-item .ra .you{color:var(--bad);font-weight:700}
.review-item .ra .cor{color:var(--good);font-weight:700}
.review-item .re{font-size:13.5px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.perfect{color:var(--good);font-weight:800}

/* ================= ATLAS + YENİ ÖZETLER ================= */
.set-title,.set-desc,.mode .t,.mode .d{display:block}
.qtag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--good);background:var(--good-soft);border-radius:999px;padding:2px 10px;margin:2px 0 6px}
:root{ --gpos:#6d3fc0; --gneg:#c2367a; --arb:#b42318; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --gpos:#b197f0; --gneg:#f08ab8; --arb:#f2877c; } }
:root[data-theme="dark"]{ --gpos:#b197f0; --gneg:#f08ab8; --arb:#f2877c; }
.gp{color:var(--gpos)} .gn{color:var(--gneg)} .ga{color:var(--arb)}
.atlas-card .set-num{font-size:24px}
.fchips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.fchip small{color:var(--muted);font-weight:700;margin-left:3px}
.fchip:hover{border-color:var(--oc,var(--accent))}
.fchip.on{background:var(--oc,var(--accent));border-color:var(--oc,var(--accent));color:#fff}
.fchip.on small{color:rgba(255,255,255,.85)}
.atlas-modes{margin-top:14px}
.search{width:100%;margin:16px 0 10px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:15px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.org-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.org-tile{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--oc);border-radius:12px;padding:12px 13px;color:var(--fg)}
.org-tile:hover{border-color:var(--oc)}
.ot-name{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25}
.ot-tag{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--oc)}
.ot-dis{font-size:13px;color:var(--muted);line-height:1.4}

/* kimlik kartı */
.oc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:16px;box-shadow:0 6px 18px rgba(0,0,0,.05)}
.oc-head{background:var(--oc);color:#fff;padding:16px 18px 14px}
.oc-head h3{font-size:clamp(20px,5vw,25px);color:#fff;font-style:italic}
.oc-tag{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.oc-set{font-size:12.5px;opacity:.85;margin-top:3px}
.oc-row{display:grid;grid-template-columns:170px 1fr;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.oc-row:nth-child(even){background:color-mix(in srgb,var(--oc) 5%,transparent)}
.oc-lab{font-size:12.5px;font-weight:800;color:var(--oc);display:flex;gap:7px;align-items:flex-start;line-height:1.35}
.oc-lab span{font-size:15px}
.oc-val ul{margin:0;padding-left:17px;font-size:14.2px}
.oc-val li{margin:2px 0}
.oc-val b{color:var(--fg)}
@media (max-width:560px){ .oc-row{grid-template-columns:1fr;gap:3px} }
.cardnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.cardnav .btn{flex:1;font-size:14px;padding:10px 12px}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:12px}
.chiplab{font-size:12.5px;font-weight:800;color:var(--muted)}
.ochip{border:1.5px solid var(--oc);color:var(--oc);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;font-style:italic}
.ochip.on,.ochip:hover{background:var(--oc);color:#fff}

/* karşılaştırma */
.cmp{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cmp-row{display:grid;grid-template-columns:150px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--oc);border-radius:12px;padding:10px 12px}
.cmp-name{background:none;border:none;text-align:left;padding:0;color:var(--oc);font-weight:800;font-style:italic;font-size:14.5px}
.cmp-val ul{margin:0;padding-left:17px;font-size:14px}
@media (max-width:560px){ .cmp-row{grid-template-columns:1fr;gap:2px} }

/* boş kart */
.rc-row{border-top:1px solid var(--line);padding:6px 12px}
.rc-lab{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--oc);font-weight:800;font-size:13.5px;padding:8px 4px;text-align:left}
.rc-lab em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:2px 8px}
.rc-row.open .rc-lab em{display:none}
.rc-val ul{margin:0 0 6px;padding-left:20px;font-size:14px}

/* mini kartlar (özetlerde) */
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mini{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--oc);border-radius:12px;padding:11px 12px;color:var(--fg);font-size:13px;line-height:1.4}
.mini:hover{border-color:var(--oc)}
.mh b{display:block;font-family:var(--display);font-style:italic;font-size:16px;color:var(--oc)}
.mh small{color:var(--muted);font-weight:700;font-size:11.5px}
.mr{display:flex;gap:7px} .mr i{font-style:normal;flex:none}
.mgo{margin-top:auto;padding-top:4px;font-weight:800;color:var(--oc);font-size:12.5px}

/* özet bileşenleri */
.sum .callout{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:11px 14px;font-size:14px;margin:12px 0}
.sum .sm{font-size:12.8px;color:var(--muted)}
.sum .c{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:3px 4px 0 0;font-size:12.8px;font-weight:600}
.sum .yes{color:var(--good);font-weight:800} .sum .no{color:var(--bad);font-weight:800}
.organ-grid,.target-grid,.drug-grid,.hook-grid,.exposure-grid{display:grid;gap:10px}
.organ-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.organ{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.organ .oh{font-weight:800;font-size:13.5px;margin-bottom:4px}
.organ small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.target-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.target{border-radius:14px;padding:12px 13px;border:1px solid var(--line);background:var(--surface);border-top:6px solid var(--tc)}
.target .th{font-weight:800;font-size:15px;color:var(--tc)}
.target p{margin:4px 0;font-size:13.2px}
.t1{--tc:#c2410c} .t2{--tc:#0e7490} .t3{--tc:#7c3aed} .t4{--tc:#15803d}
.drug-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.drug{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.drug b{font-size:13px;color:var(--muted)} .drug span{font-weight:800;color:var(--accent);font-size:14.5px} .drug i{font-size:12px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){ .pair{grid-template-columns:1fr} }
.side{border-radius:12px;padding:11px 12px;border:1px solid var(--line);background:var(--surface)}
.side .sh{font-weight:800;font-size:13.5px;margin-bottom:4px}
.side.bad{border-color:var(--bad);background:var(--bad-soft)} .side.bad .sh{color:var(--bad)}
.side.good{border-color:var(--good);background:var(--good-soft)} .side.good .sh{color:var(--good)}
.sum ul.mix{padding-left:0;list-style:none}
.sum ul.mix li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:0 10px 10px 0;padding:8px 12px;margin:7px 0}
.weapon-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.weapon-row .w{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:center}
.weapon-row .w b{display:block;color:var(--accent);font-size:14px} .weapon-row .w span{font-size:12.5px;color:var(--muted)}
.hook-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.hook{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--gneg);border-radius:12px;padding:10px 12px}
.hook .hh{font-family:var(--display);font-style:italic;font-weight:700;font-size:16px;color:var(--gneg);margin-bottom:4px}
.hook p{margin:4px 0;font-size:13.2px}
.exposure-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:3px}
.ex .ei{font-size:26px} .ex b{font-size:13px} .ex span{font-weight:800;font-style:italic;color:var(--gneg);font-size:15px} .ex i{font-style:normal;font-size:12px;color:var(--muted)}
.spectrum{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;align-items:stretch}
.sp-bar{border-radius:12px;background:linear-gradient(90deg,var(--good),var(--bad))}
.sp-left,.sp-right{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.sp-left b{color:var(--good)} .sp-right b{color:var(--bad)}
@media (max-width:560px){ .spectrum{grid-template-columns:1fr} .sp-bar{height:10px} }
/* ayırım ağacı */
.sum ul.tree{list-style:none;padding-left:0;margin:8px 0}
.sum ul.tree ul{list-style:none;padding-left:22px;margin:0;border-left:2px solid var(--line);margin-left:10px}
.sum ul.tree li{margin:6px 0;position:relative}
.sum ul.tree ul li::before{content:"";position:absolute;left:-22px;top:15px;width:18px;border-top:2px solid var(--line)}
.node{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13.5px}
.node.root{background:var(--gpos);border-color:var(--gpos);color:#fff;font-weight:800}
.node.hit{border-color:var(--gpos);background:color-mix(in srgb,var(--gpos) 9%,var(--surface))}
/* tablolar: daha okunur */
.sum table tr:nth-child(even) td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.sum table.vs td:first-child,.sum table.clue td:first-child{color:var(--muted)}
.sum table.vs td{white-space:normal}
</style>
</head>

/* ---------- Sorular: yalnızca ders slaytlarına dayanır; 'Pekiştirme' ve 'Feyyaz Akay' etiketliler kullanıcının yüklediği kaynaklardan ---------- */
const SETS = [{"title": "Mikrobiyolojiye Giriş ve Tarihçe", "desc": "Mikrobiyoloji nedir, dalları; Leeuwenhoek'tan Koch'a tarihçe ve dört gelişim dönemi", "short": "Tarihçe", "questions": [{"q": "\"Mikrobiyoloji\" sözcüğünü oluşturan Yunanca kökler ve anlamları hangisinde doğru verilmiştir?", "opts": [{"t": "mikros: tek – bios: organizma – logos: bilim"}, {"t": "mikros: görünmez – bios: yaşam – logos: inceleme"}, {"t": "mikros: canlı – bios: hücre – logos: bilim"}, {"t": "mikros: küçük – bios: yaşam – logos: bilim"}, {"t": "mikros: küçük – bios: hücre – logos: söz"}], "a": 3, "exp": "Doğru cevap: **mikros = küçük, bios = yaşam, logos = bilim**. Sözcüğün tam karşılığı \"küçük canlıların bilimi\"dir.\nMikroskop altında görülebilen, çoğunlukla tek hücreli ve basit yapılı canlılara **mikroorganizma** denir. Bu canlıları inceleyen bilim dalı da **mikrobiyoloji**dir. Kısa tanım: mikroskobik canlıları inceleyen bilim dalı.\nYanlış şıklar:\n• \"tek – organizma – bilim\" → mikros \"tek\" değil \"küçük\"; bios \"organizma\" değil \"yaşam\" demektir.\n• \"görünmez – yaşam – inceleme\" → mikros \"görünmez\" değil; logos burada \"inceleme\" değil \"bilim\"dir.\n• \"canlı – hücre – bilim\" → mikros \"canlı\", bios \"hücre\" anlamına gelmez.\n• \"küçük – hücre – söz\" → bios \"hücre\" değil \"yaşam\"; logos burada \"bilim\" anlamındadır.\n💡 Akılda kalsın: mikros-bios-logos = küçük-yaşam-bilim. Aynı kökler başka kelimelerde de yaşar: mikroskop, biyoloji, psikoloji.", "shuf": true}, {"q": "Mikroorganizmaların hastalık yapıcı özelliklerini, patojenlerin tanı ve identifikasyonunu inceleyen, etkenin belirlenmesine yönelik laboratuvar işlemlerini yapan bilim dalı hangisidir?", "opts": [{"t": "Tarımsal mikrobiyoloji"}, {"t": "Klinik mikrobiyoloji"}, {"t": "Çevre mikrobiyolojisi"}, {"t": "Gıda mikrobiyolojisi"}, {"t": "Endüstriyel mikrobiyoloji"}], "a": 1, "exp": "Doğru cevap **klinik mikrobiyoloji**dir. Bu dal mikroorganizmaların hastalık yapıcı özelliklerini ve enfeksiyon oluşturmalarını inceler. İnsan için patojen mikroorganizmaların tanısını ve identifikasyonunu yapar. Hastalık etkeninin belirlenmesine yönelik laboratuvar işlemleri de bu dalın işidir. Kısacası \"hastadaki etken hangisi?\" sorusunu yanıtlar.\nDiğer mikrobiyoloji alanları ise mikroorganizmalardan \"yararlanma\" amaçlıdır:\n• Tarımsal mikrobiyoloji → tarımsal üretimi artırmak için mikroorganizmalardan yararlanır.\n• Çevre mikrobiyolojisi → çevre sorunlarının giderilmesinde ve değerlendirilmesinde mikroorganizmaların fizyolojik etkilerinden yararlanır.\n• Gıda mikrobiyolojisi → gıda maddelerinin üretiminde ve korunmasında yararlanır.\n• Endüstriyel mikrobiyoloji → yararlı mikroorganizmaları endüstriyel üretimde kullanır.\n💡 Akılda kalsın: hastalık + tanı + laboratuvar = klinik mikrobiyoloji. Diğerleri mikroptan yararlanır, klinik mikrobiyoloji mikropla savaşır.", "shuf": true}, {"q": "Papilloma virüsü ile rahim ağzı kanseri arasındaki bağlantıyı tespit eden bilim insanı kimdir?", "opts": [{"t": "Alexander Fleming"}, {"t": "Robert Koch"}, {"t": "Harald zur Hausen"}, {"t": "Joseph Lister"}, {"t": "Edward Jenner"}], "a": 2, "exp": "Doğru cevap **Harald zur Hausen**'dir. Papilloma virüsü (HPV) ile rahim ağzı (serviks) kanseri arasındaki bağlantıyı o tespit etmiştir; bu keşif, modern toplumun temelini oluşturan keşifler arasında sayılır ve bugünkü HPV aşılarının bilimsel temelidir.\nAynı listedeki diğer örnekler: Edward Jenner → çiçek aşısı; Alexander Fleming → penisilinin keşfi. Son yıllarda da mikrobiyologlar SARS-CoV-2'nin genomunu haritalamış, yayılımını izlemiş ve aşılar geliştirmiştir.\nYanlış şıklar:\n• Alexander Fleming → penisilini keşfetmiştir.\n• Robert Koch → şarbon etkenini (B. anthracis) bulmuş, Koch postulatlarını ortaya atmıştır.\n• Joseph Lister → cerrahi antisepsisi ortaya atmıştır.\n• Edward Jenner → çiçek aşısıyla anılır.\n💡 Akılda kalsın: zur Hausen = HPV ↔ rahim ağzı kanseri. \"Haus\" Almanca \"ev\" demek: HPV'nin evini (serviksi) bulan adam.", "shuf": true}, {"q": "Bakterilere daha önce sentezleyemedikleri insülin ve somatotropinin (büyüme hormonu) sentezletilmesi hangi alanın konusudur?", "opts": [{"t": "Klinik mikrobiyoloji"}, {"t": "Gıda mikrobiyolojisi"}, {"t": "Tarımsal mikrobiyoloji"}, {"t": "Çevre mikrobiyolojisi"}, {"t": "Gen mühendisliği ve modern biyoteknoloji"}], "a": 4, "exp": "Doğru cevap **gen mühendisliği ve modern biyoteknoloji**dir. Bu alanda klonlama ile genetik bilgi aktarılır. Böylece bakterilere, daha önce sentezleyemedikleri **insülin** ve **somatotropin (büyüme hormonu)** sentezletilir. Buna kontrollü gen manipülasyonu denir.\nYanlış şıklar:\n• Klinik mikrobiyoloji → patojenlerin tanısı ve identifikasyonu ile laboratuvar işlemlerini yapar; üretim yapmaz.\n• Gıda mikrobiyolojisi → gıdaların üretiminde ve korunmasında mikroorganizmalardan yararlanır.\n• Tarımsal mikrobiyoloji → tarımsal üretimi artırmak için mikroorganizmalardan yararlanır.\n• Çevre mikrobiyolojisi → çevre sorunlarının giderilmesinde mikroorganizmaların fizyolojik etkilerini kullanır.\n💡 Akılda kalsın: bakteriye \"yeni bir gen\" verip insan hormonu ürettirmek = gen mühendisliği. Bakteri burada minik bir ilaç fabrikasına dönüşür.", "shuf": true}, {"q": "Mikrobiyoloji tarihinin başladığı yüzyıl ve ilk mikroskobu bulan kişi hangi seçenekte doğru verilmiştir?", "opts": [{"t": "17. yy – Antonie van Leeuwenhoek"}, {"t": "18. yy – Louis Pastör"}, {"t": "17. yy – John Tyndall"}, {"t": "19. yy – Robert Koch"}, {"t": "16. yy – Francesco Redi"}], "a": 0, "exp": "Doğru cevap: **17. yy – Antonie van Leeuwenhoek**. Mikrobiyoloji tarihi 17. yüzyılda mikroskobun bulunuşuyla başlar; ilk mikroskobu Leeuwenhoek yapmıştır. İlk mikroskoplar iki tipti: basit mercekli ve bileşik mercekli (objektif + oküler).\nMikroskobun bulunduğu dönemde iki görüş tartışılıyordu: biyogenez (canlının canlıdan oluşumu) ve abiyogenez (canlının cansızdan, kendiliğinden oluşumu).\nYanlış şıklar:\n• 18. yy – Pastör → Pastör abiyogenez–biyogenez tartışmasına son veren kişidir; ilk mikroskobu bulmamıştır.\n• 17. yy – Tyndall → Tyndall tindalizasyonu (3 gün boyunca 100 °C'de ½ saat ısıtma) bulmuştur.\n• 19. yy – Koch → Koch şarbon etkenini bulmuş ve postulatlarını ortaya atmıştır.\n• 16. yy – Redi → Redi açık etteki kurtların sinek larvalarından oluştuğunu söylemiştir.\n💡 Akılda kalsın: 17. yy + Leeuwenhoek + mikroskop = mikrobiyolojinin başlangıcı. Önce görmek gerekir; mikrop görülmeden bilimi olmaz.", "shuf": true}, {"q": "\"Spontan generasyon\" (kendiliğinden oluşum) hangi kavramın karşılığıdır?", "opts": [{"t": "Abiyogenez – canlının cansızdan oluşumu"}, {"t": "Biyogenez – canlının canlıdan oluşumu"}, {"t": "Tindalizasyon"}, {"t": "Pütrefaksiyon"}, {"t": "Fermantasyon"}], "a": 0, "exp": "Doğru cevap: **abiyogenez – canlının cansızdan oluşumu**. Spontan generasyon (kendiliğinden oluşum) bu kavramın karşılığıdır. Karşıt görüş olan **biyogenez** ise canlının canlıdan oluşumudur.\nBu tartışma mikroskobun bulunduğu dönemde sürüyordu. Redi, açık etteki kurtların sineklerin bıraktığı larvalardan oluştuğunu göstererek kendiliğinden oluşuma karşı çıktı. Tartışmaya kesin olarak **Pastör** son verdi.\nYanlış şıklar:\n• Biyogenez → canlının canlıdan oluşumudur; kendiliğinden oluşumun tam tersidir.\n• Tindalizasyon → Tyndall'ın aralıklı ısıtma yöntemidir (3 gün 100 °C'de ½ saat).\n• Pütrefaksiyon ve fermantasyon → Pastör'ün mikroorganizmalarca gerçekleştirildiğini gösterdiği organik madde transformasyonlarıdır.\n💡 Akılda kalsın: \"a-\" olumsuzluk ekidir → a-biyogenez = canlıdan DEĞİL, cansızdan oluşum. Tıpkı a-tipik, a-septik gibi.", "shuf": true}, {"q": "Açıkta bırakılan etteki kurtların kendiliğinden değil, sineklerin bıraktığı larvalardan oluştuğunu söyleyen kimdir?", "opts": [{"t": "Lister"}, {"t": "Appert"}, {"t": "Tyndall"}, {"t": "Pastör"}, {"t": "Francesco Redi"}], "a": 4, "exp": "Doğru cevap **Francesco Redi**'dir. Redi, açıkta bırakılan etteki kurtların kendi kendine değil, sineklerin bıraktığı larvalardan oluştuğunu söylemiştir. Bu gözlem, kendiliğinden oluşum (abiyogenez) görüşüne karşı biyogenezi destekleyen bir bulgudur.\nYanlış şıklar:\n• Lister → cerrahi antisepsisi ortaya atmıştır.\n• Appert → 19. yy'da appertizasyonu keşfetmiştir.\n• Tyndall → bakterilerin sporları olduğu için tek ısıtmanın yetmediğini göstermiş, tindalizasyonu bulmuştur.\n• Pastör → abiyogenez–biyogenez tartışmasına kesin olarak son vermiş; fermantasyon ve pütrefaksiyonun mikroorganizmalarca yapıldığını bulmuştur.\n💡 Akılda kalsın: Redi = et + sinek larvası. Redi'nin kapalı kavanozundaki ete sinek konamadı, kurt da çıkmadı.", "shuf": true}, {"q": "Bakterilerin sporları olduğu için tek ısıtmanın yetmediğini gösteren ve 3 gün boyunca 100 °C'de ½ saat ısıtmayı öneren bilim insanı ve yöntemin adı hangisidir?", "opts": [{"t": "Koch – sterilizasyon"}, {"t": "Appert – appertizasyon"}, {"t": "Tyndall – tindalizasyon"}, {"t": "Lister – antisepsis"}, {"t": "Pastör – pastörizasyon"}], "a": 2, "exp": "Doğru cevap: **Tyndall – tindalizasyon**. Tyndall, bakterilerin sporları olduğunu ve bu yüzden tek bir ısıtmanın yeterli olmadığını gösterdi. Önerdiği yöntem: **3 gün boyunca 100 °C'de ½ saat ısıtma**. Buna **tindalizasyon** denir.\nAralıklı ısıtmanın mantığı şudur: her ısıtmada canlı (vejetatif) formlar ölür. Aradaki bekleme süresinde sporlardan yeni canlı formlar çıkar. Bir sonraki ısıtma bunları da öldürür.\nYanlış şıklar:\n• Koch – sterilizasyon → Koch şarbon etkenini bulmuş; postulatları ve saf kültür/katı besiyeri çalışmalarıyla anılır.\n• Appert – appertizasyon → Appert 19. yy'da appertizasyonu keşfetmiştir; ama 3 günlük aralıklı ısıtma Tyndall'ındır.\n• Lister – antisepsis → Lister cerrahi antisepsisi ortaya atmıştır.\n• Pastör – pastörizasyon → Pastör fermantasyon/pütrefaksiyon, Pastör etkisi ve saf kültürle anılır.\n💡 Akılda kalsın: Tyndall → tindalizasyon → spor yüzünden 3 gün ısıtma. Sporu bir kalede saklanan askere benzet: kale kapısından çıkınca (sporlar çimlenince) teker teker vurulur.", "shuf": true}, {"q": "Aşağıdakilerden hangisi Pastör'ün katkılarından biri **değildir**?", "opts": [{"t": "Aerobik/anaerobik yaşam şekillerini ve Pastör etkisini bulması"}, {"t": "Saf kültür elde etmesi"}, {"t": "Fermantasyon ve pütrefaksiyonun mikroorganizmalarca yapıldığını bulması"}, {"t": "Cerrahi antisepsis kavramını ortaya atması"}, {"t": "Abiyogenez–biyogenez tartışmasına son vermesi"}], "a": 3, "exp": "Doğru cevap: **cerrahi antisepsis kavramını ortaya atması** — çünkü bunu yapan Pastör değil, **Lister**'dir.\nPastör'ün gerçek katkıları:\n• Abiyogenez–biyogenez tartışmasına son vermiştir.\n• Organik madde transformasyonunun (fermantasyon ve pütrefaksiyon) mikroorganizmalarca gerçekleştirildiğini bulmuştur.\n• Mikroorganizmaların aerobik ve anaerobik yaşam şekilleri olduğunu saptamış ve Pastör etkisini bulmuştur.\n• Saf kültür elde etmiştir.\nDiğer dört şık bu listede birebir yer aldığı için Pastör'e aittir.\n💡 Akılda kalsın: Pastör = tartışmaya son + fermantasyon + aerob/anaerob + saf kültür; Lister = antisepsis. (Ağız gargarası \"Listerine\" adını Lister'den alır — antisepsisi hatırlatır.)", "shuf": true, "html": true}, {"q": "Şarbon etkeni Bacillus anthracis'i bulan, postulatlarıyla tıbbi mikrobiyolojinin temelini atan bilim insanı kimdir?", "opts": [{"t": "Petri"}, {"t": "Robert Koch"}, {"t": "Joseph Lister"}, {"t": "Louis Pastör"}, {"t": "Paul Ehrlich"}], "a": 1, "exp": "Doğru cevap **Robert Koch**'tur. Koch, şarbon hastalığının etkenini (**Bacillus anthracis**) bulmuş ve **Koch postulatlarını** ortaya atarak tıbbi mikrobiyolojinin temelini atmıştır. Ayrıca saf (aksenik) kültür kavramını ortaya atanlardan biridir; jelatin kullanarak saf kültürde kullandığı katı besiyerini yapmıştır.\nYanlış şıklar:\n• Petri → Koch'un öğrencisidir; Petri kabını icat ederek mikroorganizma üremesi için geniş yüzey sağlamıştır.\n• Joseph Lister → cerrahi antisepsisi ortaya atmıştır.\n• Louis Pastör → abiyogenez–biyogenez tartışmasına son vermiştir.\n• Paul Ehrlich → antimikrobik kemoterapide \"seçici toksisite\" kavramını ilk ortaya atan kişidir.\n💡 Akılda kalsın: Koch = şarbon (B. anthracis) + postulatlar + jelatinli katı besiyeri. Koch ayrıca tüberküloz basilinin de kâşifidir; basilin diğer adı \"Koch basili\" buradan gelir.", "shuf": true}, {"q": "Koch'un öğrencisi olan ve mikroorganizmaların üremesi için geniş yüzey sağlayan kabı icat eden kişi kimdir?", "opts": [{"t": "Jenner"}, {"t": "Petri"}, {"t": "Redi"}, {"t": "Appert"}, {"t": "Tyndall"}], "a": 1, "exp": "Doğru cevap **Petri**'dir. Koch'un öğrencisi olan Petri, **Petri kabını** icat etmiş ve mikroorganizmaların üremesi için geniş yüzey sağlamıştır. Bu kap, hocası Koch'un jelatinle yaptığı katı besiyeriyle birlikte saf kültür çalışmalarını kolaylaştırmıştır. Petri kabı bugün hâlâ her mikrobiyoloji laboratuvarının temel gerecidir.\nYanlış şıklar:\n• Jenner → çiçek aşısıyla anılır.\n• Redi → açık etteki kurtların sinek larvalarından oluştuğunu söylemiştir.\n• Appert → 19. yy'da appertizasyonu keşfetmiştir.\n• Tyndall → tindalizasyonu (3 gün 100 °C'de ½ saat ısıtma) bulmuştur.\n💡 Akılda kalsın: Koch katı besiyerini yaptı, öğrencisi Petri ona \"kap\" yaptı. Usta hamuru kardı, çırak tepsiyi getirdi.", "shuf": true}, {"q": "Mikrobiyolojinin gelişim dönemlerinden \"bakteriyel genetik ve moleküler biyolojinin ortaya çıkışı\" ile karakterize olan dönem hangisidir?", "opts": [{"t": "3. dönem (1977–1994)"}, {"t": "1. dönem (1862–1945)"}, {"t": "Mikroskobun bulunuşu (17. yy)"}, {"t": "4. dönem (1995–günümüz)"}, {"t": "2. dönem (1946–1977)"}], "a": 4, "exp": "Doğru cevap: **2. dönem (1946–1977)** — bakteriyel genetik ve moleküler biyolojinin ortaya çıkışı bu döneme aittir.\nMikrobiyolojideki gelişmeler dört döneme ayrılır:\n• 1. dönem (1862–1945): hastalığın germ (mikrobiyal köken) teorisi ve bakterilerde fizyolojik çeşitliliğin tanımlanması.\n• **2. dönem (1946–1977): bakteriyel genetik ve moleküler biyolojinin ortaya çıkışı** → sorunun cevabı.\n• 3. dönem (1977–1994): rRNA'ya dayalı moleküler evrim çalışmaları → evrimsel yaşam ağacı.\n• 4. dönem (1995–günümüz): mikrobiyal genomiğin ortaya çıkışı.\nYanlış şıklar: 3. dönem yaşam ağacı, 4. dönem genomik, 1. dönem germ teorisiyle karakterizedir. Mikroskobun bulunuşu (17. yy) ise dönemlerden önce, mikrobiyoloji tarihinin başlangıcıdır.\n💡 Akılda kalsın: Germ → Genetik → (yaşam) Ağacı → Genomik. Sıra hep G-G-A-G.", "shuf": true}, {"q": "rRNA'ya dayalı moleküler evrim çalışmalarıyla \"evrimsel yaşam ağacı\"nın oluşturulduğu dönem hangisidir?", "opts": [{"t": "1946–1977"}, {"t": "1995–günümüz"}, {"t": "1977–1994"}, {"t": "17. yüzyıl"}, {"t": "1862–1945"}], "a": 2, "exp": "Doğru cevap: **1977–1994 (3. dönem)**. Bu dönemde rRNA'ya dayalı moleküler evrim çalışmaları, **evrimsel yaşam ağacının** oluşturulmasını sağlamıştır.\nDönemleri sırayla hatırla:\n• 1862–1945 → germ (mikrobiyal köken) teorisi ve bakterilerde fizyolojik çeşitlilik\n• 1946–1977 → bakteriyel genetik ve moleküler biyoloji\n• **1977–1994 → rRNA ile evrimsel yaşam ağacı (doğru cevap)**\n• 1995–günümüz → mikrobiyal genomik\n• 17. yüzyıl → mikroskobun bulunuşu; dönemlere dahil değil, tarihin başlangıcı\nYanlış şıklar bu listedeki diğer dönemlerin tarihleridir.\n💡 Akılda kalsın: rRNA → yaşam ağacı → 3. dönem. Ağacın 3 ana dalı (Bacteria, Archaea, Eukarya) gibi: ağaç deyince 3'ü düşün.", "shuf": true}, {"q": "Gıda maddelerinin üretiminde ve korunmasında mikroorganizmalardan yararlanan mikrobiyoloji dalı hangisidir?", "opts": [{"t": "Tarımsal mikrobiyoloji"}, {"t": "Çevre mikrobiyolojisi"}, {"t": "Klinik mikrobiyoloji"}, {"t": "Gıda mikrobiyolojisi"}, {"t": "Endüstriyel mikrobiyoloji"}], "a": 3, "exp": "Doğru cevap **gıda mikrobiyolojisi**dir. Bu dal, gıda maddelerinin üretiminde ve korunmasında mikroorganizmalardan yararlanır. Yararlara örnek: yoğurt, boza, alkollü içecekler gibi gıdaların üretimi.\nYanlış şıklar:\n• Tarımsal mikrobiyoloji → tarımsal üretimi artırmak için mikroorganizmalardan yararlanır.\n• Çevre mikrobiyolojisi → çevre sorunlarının giderilmesinde ve değerlendirilmesinde mikroorganizmaların fizyolojik etkilerini kullanır.\n• Klinik mikrobiyoloji → hastalık etkeninin tanısı ve identifikasyonuyla ilgilenir.\n• Endüstriyel mikrobiyoloji → yararlı mikroorganizmaları endüstriyel üretimde kullanır (alkol, aseton gibi endüstriyel ürünler); gıdanın korunması ise gıda mikrobiyolojisinin işidir.\n💡 Akılda kalsın: yoğurt-boza üretimi ve gıdanın korunması = gıda mikrobiyolojisi. Sofrada gördüğün fermente ürünlerin hepsi bu dalın eseri.", "shuf": true}, {"q": "Çevre sorunlarının giderilmesinde ve değerlendirilmesinde mikroorganizmaların fizyolojik etkilerinden yararlanan dal hangisidir?", "opts": [{"t": "Çevre mikrobiyolojisi"}, {"t": "Klinik mikrobiyoloji"}, {"t": "Gen mühendisliği ve modern biyoteknoloji"}, {"t": "Gıda mikrobiyolojisi"}, {"t": "Endüstriyel mikrobiyoloji"}], "a": 0, "exp": "Doğru cevap **çevre mikrobiyolojisi**dir. Bu dal, çevre sorunlarının giderilmesinde ve değerlendirilmesinde mikroorganizmaların fizyolojik etkilerinden yararlanır. Örnekler: biyolojik atık su arıtımı ve doğadaki C, N, P, S döngüleri.\nYanlış şıklar:\n• Klinik mikrobiyoloji → hastalık etkenlerinin tanısı ve laboratuvar işlemleri.\n• Gen mühendisliği ve modern biyoteknoloji → klonlama ile bakterilere insülin ve somatotropin sentezletilmesi.\n• Gıda mikrobiyolojisi → gıdaların üretimi ve korunması.\n• Endüstriyel mikrobiyoloji → yararlı mikroorganizmaların endüstriyel üretimde kullanımı.\n💡 Akılda kalsın: \"çevre sorunu\" görürsen → çevre mikrobiyolojisi. Atık suyu temizleyen görünmez işçiler = mikroplar.", "shuf": true}, {"q": "Aşağıdaki gelişmelerin kronolojik sırası hangisinde doğru verilmiştir?", "opts": [{"t": "İlk mikroskop → appertizasyon → mikrobiyal genomik dönemi"}, {"t": "Mikrobiyal genomik dönemi → appertizasyon → ilk mikroskop"}, {"t": "Appertizasyon → ilk mikroskop → mikrobiyal genomik dönemi"}, {"t": "Mikrobiyal genomik dönemi → ilk mikroskop → appertizasyon"}, {"t": "Üçü de aynı yüzyılda gerçekleşmiştir"}], "a": 0, "exp": "Doğru sıra: **ilk mikroskop → appertizasyon → mikrobiyal genomik dönemi**.\nTarihleri sıralayalım:\n• İlk mikroskop → **17. yy** (Leeuwenhoek)\n• Appertizasyon → **19. yy** (Appert)\n• Mikrobiyal genomik dönemi → **1995'ten günümüze** (4. dönem)\nYanlış şıklar: diğer sıralamalarda en yeni olan genomik dönemi başa ya da ortaya, en eski olan ilk mikroskop ortaya ya da sona konmuştur. \"Üçü de aynı yüzyılda\" ifadesi de 17. yy, 19. yy ve 1995 sonrası tarihleriyle çelişir.\n💡 Akılda kalsın: 17. yy mikroskop → 19. yy Appert ve Tyndall → 1862 sonrası dört dönem → 1995 genomik. Önce gör, sonra sakla, en son genomu oku.", "shuf": true}, {"q": "\"Aksenik kültür\" ifadesinin karşılığı hangisidir?", "opts": [{"t": "Saf kültür"}, {"t": "Kanlı agar kültürü"}, {"t": "Jelatinli katı besiyeri"}, {"t": "Tindalizasyon"}, {"t": "Appertizasyon"}], "a": 0, "exp": "Doğru cevap: **saf kültür**. Aksenik kültür, saf kültürün diğer adıdır; tek tür mikroorganizma içeren kültür demektir. Bu kavramı ortaya atanlardan biri **Koch**'tur. Koch ardından **jelatin** kullanarak saf kültürde kullandığı katı besiyerini yapmış, öğrencisi Petri de Petri kabını icat etmiştir. Pastör de saf kültür elde edenler arasında sayılır.\nYanlış şıklar:\n• Kanlı agar kültürü → streptokokların hemoliz tiplerine (α, β, γ) göre sınıflandırılmasında kullanılan besiyeridir; \"aksenik\" anlamına gelmez.\n• Jelatinli katı besiyeri → saf kültür elde etmek için kullanılan araçtır, kültürün kendisi değildir.\n• Tindalizasyon → Tyndall'ın aralıklı ısıtma yöntemidir.\n• Appertizasyon → Appert'in 19. yy'da keşfettiği yöntemdir.\n💡 Akılda kalsın: aksenik = tek tür içeren = saf kültür. Yunanca \"xenos\" yabancı demektir; a-ksenik = yabancısız, yani içinde yabancı tür yok.", "shuf": true}, {"q": "Pastör'ün mikroorganizmalarca gerçekleştirildiğini bulduğu \"organik madde transformasyonu\" hangi iki süreci kapsar?", "opts": [{"t": "Tindalizasyon ve appertizasyon"}, {"t": "Biyogenez ve abiyogenez"}, {"t": "Fermantasyon ve pütrefaksiyon"}, {"t": "Endositoz ve egzositoz"}, {"t": "Fagositoz ve pinositoz"}], "a": 2, "exp": "Doğru cevap: **fermantasyon ve pütrefaksiyon**. Pastör, organik madde transformasyonunun bu iki süreçten oluştuğunu ve mikroorganizmalarca gerçekleştirildiğini bulmuştur. Pastör ayrıca abiyogenez–biyogenez tartışmasına son vermiş, aerobik/anaerobik yaşam şekillerini ve Pastör etkisini bulmuş, saf kültür elde etmiştir.\nYanlış şıklar:\n• Tindalizasyon ve appertizasyon → Tyndall'ın ve Appert'in yöntemleridir; transformasyon değil, ısıl işlem teknikleridir.\n• Biyogenez ve abiyogenez → Pastör'ün son verdiği tartışmanın iki görüşüdür; transformasyon değildir.\n• Endositoz ve egzositoz → hücre zarındaki transport mekanizmalarıdır.\n• Fagositoz ve pinositoz → endositozun türleridir.\n💡 Akılda kalsın: fermantasyon (mayalanma) + pütrefaksiyon (çürüme) = Pastör'ün organik madde transformasyonu. Üzüm şaraba (fermantasyon), et leşe (pütrefaksiyon) — ikisini de mikroplar yapar.", "shuf": true}, {"q": "Bilim insanı – katkı eşleştirmelerinden hangisi **yanlıştır**?", "opts": [{"t": "Fleming – penisilinin keşfi"}, {"t": "Leeuwenhoek – ilk mikroskop"}, {"t": "Jenner – çiçek aşısı"}, {"t": "Petri – Koch postulatları"}, {"t": "zur Hausen – papilloma virüsü ile rahim ağzı kanseri bağlantısı"}], "a": 3, "exp": "Yanlış eşleştirme: **Petri – Koch postulatları**. Petri'nin katkısı **Petri kabıdır**; Koch postulatları hocası **Robert Koch**'a aittir.\nDiğer eşleştirmeler doğrudur:\n• Fleming → penisilinin keşfi\n• Leeuwenhoek → ilk mikroskop (17. yy)\n• Jenner → çiçek aşısı\n• zur Hausen → papilloma virüsü ile rahim ağzı kanseri arasındaki bağlantı\n💡 Akılda kalsın: Koch = postulatlar + şarbon + jelatinli katı besiyeri; Petri = kap. Çırak, ustanın postulatlarını değil tepsisini yapar.", "shuf": true, "html": true}, {"q": "Slayta göre mikrobiyologlar SARS-CoV-2'nin ortaya çıkışına verilen yanıtta hangi rolleri üstlenmiştir?", "opts": [{"t": "Genomunu haritalamış, yayılımını izlemiş ve toplumu korumak için aşılar geliştirmişlerdir"}, {"t": "Yalnızca antibiyotik tedavisi geliştirmişlerdir"}, {"t": "Tindalizasyon yöntemiyle virüsü ortamdan yok etmişlerdir"}, {"t": "Virüsün rahim ağzı kanseriyle bağlantısını tespit etmişlerdir"}, {"t": "Virüsü saf kültürde üreterek penisilinle tedavi etmişlerdir"}], "a": 0, "exp": "Doğru cevap: mikrobiyologlar SARS-CoV-2'nin **genomunu haritalamış, yayılımını izlemiş ve toplumu korumak için aşılar geliştirmişlerdir**. Üç rol birlikte: genom + yayılım takibi + aşı.\nYanlış şıklar:\n• \"Yalnızca antibiyotik tedavisi geliştirmişlerdir\" → antibiyotikler bakterilere etkilidir, virüslere etki etmez; sayılan üç rol genom, yayılım ve aşıdır.\n• \"Tindalizasyonla virüsü yok etmişlerdir\" → tindalizasyon Tyndall'ın 19. yy'daki aralıklı ısıtma yöntemidir.\n• \"Virüsü rahim ağzı kanseriyle ilişkilendirmişlerdir\" → bu bağlantı papilloma virüsü (HPV) için Harald zur Hausen'e aittir.\n• \"Saf kültürde üretip penisilinle tedavi etmişlerdir\" → saf kültür Koch/Pastör, penisilin Fleming ile anılır; SARS-CoV-2 rolleri arasında yoktur.\n💡 Akılda kalsın: SARS-CoV-2 → genom haritası + yayılım takibi + aşı. Pandemiye karşı üçlü silah: oku, izle, aşıla.", "shuf": true}, {"q": "Slayta göre ilk mikroskoplar hangi iki tipteydi?", "opts": [{"t": "Basit mercekli ve bileşik mercekli (objektif + oküler)"}, {"t": "Işık ve elektron mikroskobu"}, {"t": "Tek mercekli ve aynalı"}, {"t": "Karanlık alan ve faz kontrast"}, {"t": "Floresan ve ışık mikroskobu"}], "a": 0, "exp": "Doğru cevap: **basit mercekli ve bileşik mercekli (objektif + oküler)**. Mikrobiyoloji tarihi 17. yy'da mikroskobun bulunuşuyla başlar; ilk mikroskoplar bu iki tipteydi. İlk mikroskobu Antonie van Leeuwenhoek bulmuştur.\nFark şudur: basit mercekli mikroskopta tek mercek vardır. Bileşik mercekli mikroskopta ise iki mercek sistemi birlikte büyütme yapar: göze yakın olan **oküler**, cisme (objeye) yakın olan **objektif**.\nYanlış şıklar: ışık–elektron, tek mercekli–aynalı, karanlık alan–faz kontrast, floresan–ışık mikroskobu eşleştirmeleri \"ilk mikroskop\" tipleri değildir; bunlar çok daha sonra geliştirilen modern mikroskopi yöntemleridir.\n💡 Akılda kalsın: ilk mikroskop = basit mercekli + bileşik mercekli (obj + oküler). \"Oküler\" göz (okulus), \"objektif\" obje tarafı — isimler yerlerini söyler.", "shuf": true}, {"q": "Koch, saf kültürde kullandığı katı besiyerini hangi maddeyi kullanarak yapmıştır?", "opts": [{"t": "Jelatin"}, {"t": "Kanlı agar"}, {"t": "Kolesterol"}, {"t": "Peptidoglikan"}, {"t": "Selüloz"}], "a": 0, "exp": "Doğru cevap: **jelatin**. Saf (aksenik) kültür kavramını ortaya atanlardan biri olan Koch, jelatin kullanarak saf kültürde kullandığı katı besiyerini yapmıştır. Öğrencisi Petri de Petri kabını icat ederek mikroorganizma üremesi için geniş yüzey sağlamıştır.\nYanlış şıklar:\n• Kanlı agar → streptokokların hemolize göre sınıflandırılmasında kullanılan besiyeridir; Koch'un ilk katı besiyeri değildir.\n• Kolesterol → hücre zarında dayanıklılık ve akışkanlığı düzenleyen lipittir.\n• Peptidoglikan → bakteri hücre duvarındaki tabakadır (Gram pozitiflerde kalın peptidoglikan, Gram negatiflerde ince peptidoglikan + dış membran).\n• Selüloz → Golgi'nin sentezlediği selülozlu madde olarak geçer; besiyeriyle ilgisi yoktur.\n💡 Akılda kalsın: Koch + jelatin = ilk katı besiyeri. Jelatin mutfaktaki jöledir; Koch mikroplara jöle döşedi. (Günümüzde jelatin yerine agar kullanılır, çünkü agar vücut sıcaklığında erimez.)", "shuf": true}, {"q": "Tarımsal üretimi artırmak için mikroorganizmalardan yararlanan mikrobiyoloji dalı hangisidir?", "opts": [{"t": "Klinik mikrobiyoloji"}, {"t": "Tarımsal mikrobiyoloji"}, {"t": "Gıda mikrobiyolojisi"}, {"t": "Çevre mikrobiyolojisi"}, {"t": "Gen mühendisliği ve modern biyoteknoloji"}], "a": 1, "exp": "Doğru cevap **tarımsal mikrobiyoloji**dir. Bu dal, tarımsal üretimi artırmak için mikroorganizmalardan yararlanır. Örnekler: biyolojik gübre üretimi ve tarımsal savaş ilaçları (biyoinsektisit) üretimi.\nYanlış şıklar:\n• Klinik mikrobiyoloji → hastalık etkenlerinin tanısı ve identifikasyonu.\n• Gıda mikrobiyolojisi → gıdaların üretimi ve korunması.\n• Çevre mikrobiyolojisi → çevre sorunlarının giderilmesi ve değerlendirilmesi.\n• Gen mühendisliği ve modern biyoteknoloji → klonlama ile bakterilere insülin ve somatotropin sentezletilmesi.\n💡 Akılda kalsın: tarımsal üretimi artırmak (gübre, biyoinsektisit) = tarımsal mikrobiyoloji. Tarlanın verimini mikroplar da artırır.", "shuf": true}, {"q": "Mikrobiyolojinin gelişim dönemlerinden 1. dönem (1862–1945) neyle karakterizedir?", "opts": [{"t": "Mikrobiyal genomiğin ortaya çıkışı"}, {"t": "Hastalığın germ (mikrobiyal köken) teorisi ve bakterilerde fizyolojik çeşitliliğin tanımlanması"}, {"t": "rRNA'ya dayalı evrimsel yaşam ağacının oluşturulması"}, {"t": "Bakteriyel genetik ve moleküler biyolojinin ortaya çıkışı"}, {"t": "Mikroskobun bulunuşu"}], "a": 1, "exp": "Doğru cevap: **hastalığın germ (mikrobiyal köken) teorisi ve bakterilerde fizyolojik çeşitliliğin tanımlanması**. 1. dönem (1862–1945) bununla karakterizedir. Germ teorisi, hastalıkların mikroorganizmalardan kaynaklandığı fikridir. Koch'un şarbon etkenini bulması ve postulatları bu düşüncenin temel taşlarıdır.\nYanlış şıklar:\n• Mikrobiyal genomiğin ortaya çıkışı → 4. dönem (1995–günümüz).\n• rRNA'ya dayalı evrimsel yaşam ağacı → 3. dönem (1977–1994).\n• Bakteriyel genetik ve moleküler biyoloji → 2. dönem (1946–1977).\n• Mikroskobun bulunuşu → 17. yy; mikrobiyoloji tarihinin başlangıcıdır, dönemlerden biri değildir.\n💡 Akılda kalsın: 1. dönem = germ teorisi (hastalığın mikrobik kökeni). Önce \"hastalığı mikrop yapar\" dendi, gerisi sonra geldi: Germ → Genetik → Ağaç → Genomik.", "shuf": true}, {"q": "Koch postulatlarıyla ilk olarak tanımlanan mikroorganizma aşağıdakilerden hangisidir?", "opts": [{"t": "Treponema pallidum"}, {"t": "Stenotrophomonas maltophilia"}, {"t": "Mycobacterium leprae"}, {"t": "Bacillus anthracis"}, {"t": "Neisseria gonorrhoeae"}], "a": 3, "shuf": true, "tag": "Feyyaz Akay", "exp": "📖 Kitap: Koch postulatları, bir mikroorganizmanın patojen olup olmadığını anlamaya yarayan kurallar bütünüdür. Bu postulatlarla ilk tanımlanan mikroorganizma **Bacillus anthracis**'tir (şarbon etkeni). Kitabın hızlı tekrarında ayrıca şunlar belirtilir: kültürü yapılamayan ya da yalnızca insanda hastalık yapan etkenler (ör. B. pertussis, gonokok) Koch postulatlarına uymaz. In vitro kültürü yapılamayan bakterilere örnekler: Treponema pallidum, Spirillum minus ve Mycobacterium leprae.\n📑 Slaytta: **Robert Koch, şarbon hastalığının etkenini (B. anthracis) bulmuş** ve Koch postulatlarını ortaya atarak tıbbi mikrobiyolojinin temelini atmıştır. Gram pozitif basil sunumunda da şarbonun, B. anthracis'in kaza ile insana geçmesiyle oluştuğu belirtilir.\nYanlış şıklar:\n• Mycobacterium leprae → kültürde üretilememiştir (cüzzam etkeni); kültürü yapılamayan bir etkenle postulatlar ilk kez gösterilemez.\n• Neisseria gonorrhoeae → insan dışında canlı kalamaz, tek konağı insandır; hayvan deneyi basamağı işlemez.\n• Treponema pallidum ve Stenotrophomonas maltophilia → Koch'un şarbon çalışmalarıyla ilgisi yoktur.\n💡 Akılda kalsın: Koch → şarbon → B. anthracis → ilk postulat örneği. \"Anthrax\" Yunanca kömür demektir; şarbon yarasının siyah kabuğu da kömüre benzer."}]}, {"title": "Hücre Bilgisi", "desc": "Hücre zarı, hücreler arası bağlantılar, transport, organeller ve çekirdek", "short": "Hücre", "questions": [{"q": "Biyolojik organizasyon seviyelerinden hangileri her organizmada bulunmaz?", "opts": [{"t": "Doku, organ, organ sistemi"}, {"t": "Molekül, hücre, organizma"}, {"t": "Atom, hücre, organ"}, {"t": "Atom, molekül, organel"}, {"t": "Hücre, doku, organizma"}], "a": 0, "exp": "Doğru cevap: **doku, organ, organ sistemi**. Biyolojik organizasyon seviyeleri küçükten büyüğe şöyledir: atomlar → moleküller → subsellüler organeller → hücreler → **dokular* → organlar* → organ sistemleri*** → organizma. Yıldızla işaretli üç seviye her organizmada bulunmaz.\nNeden? Tek hücreli bir bakteri ya da protozoon, hücre düzeyinde doğrudan organizmadır; doku ve organ oluşturmaz.\nYanlış şıklar:\n• Molekül, hücre, organizma → üçü de yıldızsızdır; her canlıda vardır.\n• Atom, hücre, organ → organ yıldızlıdır ama atom ve hücre her canlıda bulunur.\n• Atom, molekül, organel → hepsi yıldızsız, her canlıda bulunan seviyelerdir.\n• Hücre, doku, organizma → yalnızca doku yıldızlıdır.\n💡 Akılda kalsın: tek hücrelide \"hücre = organizma\"dır; doku–organ–sistem basamakları atlanır. Merdivenin ortası ancak bina yüksekse vardır.", "shuf": true}, {"q": "Slayta göre aşağıdaki hücre büyüklüğü eşleştirmelerinden hangisi doğrudur?", "opts": [{"t": "Tavuk yumurtası – 5 mm"}, {"t": "Balık yumurtası – 30 mm"}, {"t": "İnsan ovumu – 200 mikron"}, {"t": "İnsan ovumu – 20 mikron"}, {"t": "En küçük beyin hücresi – 40–50 mikron"}], "a": 2, "exp": "Doğru cevap: **insan ovumu – 200 mikron**.\nHücre büyüklükleri:\n• **İnsan ovumu → 200 mikron** (insanın en büyük hücresidir)\n• Balık yumurtası → 5 mm\n• Tavuk yumurtası → 30 mm\n• Beyin hücrelerinin en küçüğü → 4–5 mikron\nYanlış şıklar:\n• Tavuk yumurtası – 5 mm ve balık yumurtası – 30 mm → iki değer yer değiştirmiştir; tavuk yumurtası daha büyüktür (30 mm).\n• İnsan ovumu – 20 mikron → doğrusu 200 mikrondur.\n• En küçük beyin hücresi – 40–50 mikron → doğrusu 4–5 mikrondur.\n💡 Akılda kalsın: ovum 200 µ, beyin 4–5 µ; balık 5 mm < tavuk 30 mm. Yumurta büyüdükçe sahibi de büyür: balık → tavuk.", "shuf": true}, {"q": "Slayta göre hangi dokulardaki hücre sayısı sabittir?", "opts": [{"t": "Bağırsak epiteli, deri, mide"}, {"t": "Deri, kemik, karaciğer"}, {"t": "Kan, kemik iliği, dalak"}, {"t": "Kas, yağ, kıkırdak"}, {"t": "MSS, retina, lens kristali"}], "a": 4, "exp": "Doğru cevap: **MSS, retina, lens kristali**. Bu üç dokudaki hücrelerin sayısı sabittir; yaşam boyunca yenilenerek çoğalmazlar. (Klinik yansıması: bu yüzden sinir hücresi ve retina hasarı kalıcı olma eğilimindedir.)\nAynı konudaki diğer bilgiler: insanda kan hücreleri hariç 1 katrilyon hücre bulunur; hücreler pigmentli hücreler hariç çoğunlukla renksizdir; hücrelerin kıvamları hücre çeşidine göre değişir (ör. beyin hücreleri ile derinin stratum corneum hücreleri farklı kıvamdadır).\nYanlış şıklar: bağırsak epiteli, deri, mide, kan, kemik iliği, dalak, karaciğer, kemik, kas, yağ ve kıkırdak \"sayısı sabit\" dokular arasında sayılmaz; sabit sayılı yalnızca MSS, retina ve lens kristalidir.\n💡 Akılda kalsın: sinir + göz (retina, lens) = sabit hücre sayısı. Beyin ve göz \"yedek parçasız\" organlardır.", "shuf": true}, {"q": "Hücrenin canlı kısımlarına ve cansız kısımlarına verilen adlar sırasıyla hangisidir?", "opts": [{"t": "İnklüzyon – organel"}, {"t": "Nükleus – vakuol"}, {"t": "Organel – glikokaliks"}, {"t": "Organel – inklüzyon"}, {"t": "Sitoplazma – nükleus"}], "a": 3, "exp": "Doğru cevap: **organel – inklüzyon**. Hücrenin **canlı kısımlarına organel**, **cansız kısımlarına inklüzyon** denir. Hücre; hücre zarı, sitoplazma ve nükleustan oluşur. Sitoplazmanın içeriğinde \"hücre inklüzyonları\" ayrıca sayılır.\nYanlış şıklar:\n• İnklüzyon – organel → sıra ters verilmiştir.\n• Nükleus – vakuol → nükleus hücrenin ana bölümlerinden biridir; vakuol ise sitoplazmadaki organellerden biridir.\n• Organel – glikokaliks → glikokaliks zarın dış yüzündeki karbohidrat örtüsüdür; \"cansız kısım\" karşılığı değildir.\n• Sitoplazma – nükleus → ikisi de hücrenin ana bölümleridir.\n💡 Akılda kalsın: organel = canlı (iş yapan işçi), inklüzyon = cansız (depodaki yük). \"Inclusion\" İngilizcede \"içine katılmış şey\" demektir.", "shuf": true}, {"q": "Slayta göre hücre zarının toplam kalınlığı yaklaşık ne kadardır?", "opts": [{"t": "45 Å"}, {"t": "75–100 Å"}, {"t": "400–700 Å"}, {"t": "80–200 Å"}, {"t": "400–1000 Å"}], "a": 1, "exp": "Doğru cevap: **75–100 Å**. Hücre zarı; 45 Å kalınlığında çift katlı fosfolipit tabaka, aralarında yer yer 80–85 Å kalınlığında protein bölgeleri ve şeker ucu dış yüze bakan glikoprotein bölgelerinden oluşan, toplam **75–100 Å** kalınlığında **dinamik** bir yapıdır.\nBu sayılar sınavda birbirine karıştırılmaya çok uygundur:\n• 45 Å → yalnızca fosfolipit çift tabaka\n• **75–100 Å → hücre zarının tamamı (doğru cevap)**\n• 80–200 Å → hücreler arası (interselüler) aralık\n• 400–700 Å → çekirdek zarındaki perinükleer aralık\n• 400–1000 Å → çekirdek porlarının (annulus) çapı\n💡 Akılda kalsın: zar 75–100, hücre arası 80–200; çekirdek tarafı hep \"400'lü\" sayılar.", "shuf": true}, {"q": "Hücre zarında dayanıklılığı ve akışkanlığı düzenleyen molekül hangisidir?", "opts": [{"t": "Kolesterol"}, {"t": "Fosfolipit"}, {"t": "Periferik protein"}, {"t": "Glikolipit"}, {"t": "Glikoprotein"}], "a": 0, "exp": "Doğru cevap: **kolesterol**. Membranda en fazla fosfolipit olmak üzere glikolipit ve kolesterol bulunur; her birinin görevi farklıdır. **Kolesterol, zarın dayanıklılığının ve akışkanlığının düzenlenmesini** sağlar.\nYanlış şıklar:\n• Fosfolipit → dış ortamdan izolasyonu sağlar.\n• Periferik protein → zar proteinleri (integral ve periferik) özgül reseptör, enzim ve transport proteini olarak görev yapar.\n• Glikolipit ve glikoprotein → zarın dış yüzündeki karbohidratlarla birlikte glikokaliksi oluşturur.\n💡 Akılda kalsın: kolesterol = dayanıklılık + akışkanlık; fosfolipit = izolasyon; karbohidrat = glikokaliks. Kolesterol, zarın \"amortisörü\"dür: ne çok katı ne çok akışkan bırakır.", "shuf": true}, {"q": "Aşağıdakilerden hangisi glikokaliksin işlevlerinden biri **değildir**?", "opts": [{"t": "Virüs reseptörü olarak görev yapmak"}, {"t": "Hücre zarına antijen özelliği vermek"}, {"t": "Hücreye asimetri özelliği vermek"}, {"t": "Zarın dayanıklılığını ve akışkanlığını düzenlemek"}, {"t": "Hücrelerin birbirini tanımasını sağlamak"}], "a": 3, "exp": "Doğru cevap: **zarın dayanıklılığını ve akışkanlığını düzenlemek** — çünkü bu görev glikokaliksin değil, **kolesterolün** işidir.\nGlikokaliks, zarın dış yüzünde karbohidratların glikolipit ya da glikoprotein olarak oluşturduğu örtüdür. Dört işlevi vardır:\na) Hücre zarına **antijen** özelliği verir,\nb) **Virüs reseptörü** olarak fonksiyon görür,\nc) Hücrelerin **birbirini tanımasını** sağlar,\nd) Hücreye **asimetri** özelliği verir.\nDiğer dört şık bu listedendir, bu yüzden doğrudur.\n💡 Akılda kalsın: glikokaliks = ARTA → Antijen, Reseptör (virüs), Tanıma, Asimetri. Kan grubu antijenleri (ABO) de glikokaliksteki şekerlerdir — \"tanıma\" işlevinin en bilinen örneği.", "shuf": true, "html": true}, {"q": "Hücreler arası bağlantılardan \"geçirgen olmayan (engelleyici)\" bağlantı hangisidir?", "opts": [{"t": "Gap junction"}, {"t": "Desmozom"}, {"t": "Zonula okludens"}, {"t": "Hemidesmozom"}, {"t": "Zonula adherens"}], "a": 2, "exp": "Doğru cevap: **zonula okludens**.\nHücreler arası bağlantıların üçlü sınıflaması:\n• Tutucu (sabitleyici) bağlantılar → zonula adherens, makula adherens (desmozom, hemidesmozom)\n• **Geçirgen olmayan (engelleyici) bağlantı → zonula okludens** (doğru cevap)\n• İletişim sağlayan bağlantı → gap junction (konnekson)\nZonula okludens iki hücre zarını birbirine mühürler; maddelerin hücreler arasından sızmasını engeller.\nYanlış şıklar:\n• Gap junction → iletişim sağlar; tam tersine hücreler arası geçişe izin verir.\n• Desmozom ve hemidesmozom → makula adherens grubundaki tutucu bağlantılardır.\n• Zonula adherens → tutucu bağlantıdır.\n💡 Akılda kalsın: \"okludens\" = occlude = tıkamak → engelleyici bağlantı. Tıpta \"oklüzyon\" da (damar tıkanması) aynı kökten gelir.", "shuf": true}, {"q": "İki hücre arasında iletişim sağlayan bağlantı tipi hangisidir?", "opts": [{"t": "Zonula adherens"}, {"t": "Makula adherens"}, {"t": "Zonula okludens"}, {"t": "Hemidesmozom"}, {"t": "Gap junction"}], "a": 4, "exp": "Doğru cevap: **gap junction**. İki hücre arasında iletişimi gap junction sağlar; yapısında konnekson adlı kanal birimleri bulunur. Küçük moleküller ve iyonlar bu kanallardan komşu hücreye doğrudan geçer.\nÜçlü sınıflama:\n• Tutucu (sabitleyici) → zonula adherens, makula adherens (desmozom, hemidesmozom)\n• Geçirgen olmayan (engelleyici) → zonula okludens\n• **İletişim sağlayan → gap junction**\nYanlış şıklar:\n• Zonula adherens ve makula adherens → hücreleri birbirine tutturur.\n• Hemidesmozom → makula adherens grubundandır (integrinle gösterilen tutucu bağlantı).\n• Zonula okludens → geçişi engelleyen bağlantıdır.\n💡 Akılda kalsın: \"gap\" (aralık) + konnekson (\"connect\" = bağlamak) → hücreler arası iletişim kanalı. Kalp kası hücreleri bu kanallar sayesinde birlikte atar.", "shuf": true}, {"q": "Özel yüzey oluşumlarıyla ilgili hangisi doğrudur?", "opts": [{"t": "Mikrovillusun tabanında tripletlerden oluşan bazal cisim bulunur"}, {"t": "Silyumda merkezde mikrotübül çifti, periferde doubletler bulunur; bazal cisimde triplet vardır"}, {"t": "Silyum, iskeletini aktin filamentlerinden alır"}, {"t": "Mikrovillusun merkezinde mikrotübül çifti bulunur"}, {"t": "Silyum ve mikrovillus aynı iskelet yapısına sahiptir"}], "a": 1, "exp": "Doğru cevap: **silyumda merkezde mikrotübül çifti, periferde doubletler bulunur; bazal cisimde triplet vardır**.\nİki özel yüzey oluşumunun iskeleti farklıdır:\n• **Silyum (cilium)** → merkezde bir çift mikrotübül, periferde doubletler; tabanındaki **bazal cisimde tripletler** bulunur.\n• **Mikrovillus** → iskeletini **aktin filamentleri** oluşturur.\nYanlış şıklar:\n• \"Mikrovillusun tabanında triplet bazal cisim vardır\" → bazal cisim silyuma aittir.\n• \"Silyum iskeletini aktinden alır\" → aktin mikrovillusa aittir; silyumun iskeleti mikrotübüldür.\n• \"Mikrovillusun merkezinde mikrotübül çifti vardır\" → merkezdeki mikrotübül çifti silyumda bulunur.\n• \"İkisi aynı iskelet yapısındadır\" → silyum mikrotübül, mikrovillus aktin içerir; yapıları farklıdır.\n💡 Akılda kalsın: Silyum = mikroTübül (bazalde Triplet); Mikrovillus = Aktin. Silyum hareket eder (solunum yolu kirpikleri), mikrovillus emer (bağırsak yüzeyi) — hareket tübül ister, emilim yüzey ister.", "shuf": true}, {"q": "Hücre zarında transport sınıflamasında \"kolaylaştırılmış difüzyon\" hangi yapılarla gerçekleşir?", "opts": [{"t": "Yalnızca aktif transport pompalarıyla"}, {"t": "Taşıyıcı proteinler ve kanal proteinleri"}, {"t": "Fagositoz ve pinositoz"}, {"t": "Lizozom ve peroksizom"}, {"t": "Fosfolipit çift tabakadan doğrudan geçişle"}], "a": 1, "exp": "Doğru cevap: **taşıyıcı proteinler ve kanal proteinleri**.\nHücre zarında transport sınıflaması:\n• Endositoz/egzositoz → fagositoz, pinositoz\n• Difüzyon → basit difüzyon/osmoz; **kolaylaştırılmış difüzyon: i. taşıyıcı proteinler, ii. kanal proteinleri** (doğru cevap)\n• Aktif transport\nKolaylaştırılmış difüzyonda madde yine konsantrasyon farkıyla, enerji harcanmadan geçer; ama geçişe bir zar proteini aracılık eder.\nYanlış şıklar:\n• Yalnızca aktif transport pompaları → aktif transport ayrı bir başlıktır; kolaylaştırılmış difüzyonun aracı değildir.\n• Fagositoz ve pinositoz → endositoz başlığındadır.\n• Lizozom ve peroksizom → sitoplazmadaki organellerdir; transport yolu değildir.\n• Fosfolipit çift tabakadan doğrudan geçiş → bu basit difüzyondur; \"kolaylaştırılmış\"ta protein yardımı vardır.\n💡 Akılda kalsın: kolaylaştırılmış = protein \"kolaylaştırır\" (taşıyıcı + kanal). Kapıdan geçmek serbest ama kapıyı tutan görevli (protein) var.", "shuf": true}, {"q": "Steroid hormon sentezi, kolesterol yapımı, detoksifikasyon, glikojen değişimi, kasılma–gevşeme ve asit salgılanmasında görevli organel hangisidir?", "opts": [{"t": "Peroksizom"}, {"t": "Golgi cihazı"}, {"t": "Ribozom"}, {"t": "Lizozom"}, {"t": "Düz (granülsüz) endoplazmik retikulum"}], "a": 4, "exp": "Doğru cevap: **düz (granülsüz) endoplazmik retikulum**. Görev listesi onundur: steroid hormon sentezi, safra ve kolesterol yapımı, detoksifikasyon ve glikojen değişimi, lipitlerin iletimi, kasılma–gevşemenin gerçekleştirilmesi, asit salgılanması ve klorun uzaklaştırılması. Endoplazmik retikulum, sitoplazma organelleri listesinin ilk sırasındadır.\nYanlış şıklar:\n• Peroksizom → ürat oksidaz, katalaz, D-aminoasit oksidaz ve hidroksi asit oksidaz içerir.\n• Golgi cihazı → spermatid spermatozoaya dönüşürken akrozomu oluşturur; glikoprotein, mukopolisakkarit gibi maddeleri sentezler.\n• Ribozom → sitoplazmadaki organellerden biridir; bu görev listesi ona ait değildir.\n• Lizozom → primer, sekonder ve fagozom adlarını alır; nükleaz, proteaz, glukozidaz, lipaz, fosfataz içerir.\n💡 Akılda kalsın: düz ER = \"steroid–safra–kolesterol–detoks–glikojen–kasılma\". Steroid üreten hücrelerde (böbrek üstü bezi, Leydig) ve detoks yapan karaciğerde düz ER boldur.", "shuf": true}, {"q": "Spermatid spermatozoaya dönüşürken spermin uç kısmında toplanarak akrozomu oluşturan, glikoprotein ve mukopolisakkarit sentezleyen organel hangisidir?", "opts": [{"t": "Vakuol"}, {"t": "Sentriol"}, {"t": "Peroksizom"}, {"t": "Golgi cihazı"}, {"t": "Mitokondri"}], "a": 3, "exp": "Doğru cevap: **Golgi cihazı**. Spermatid spermatozoaya dönüşürken Golgi, spermin uç kısmında toplanarak **akrozomu** oluşturur. Ayrıca glikoprotein, mukopolisakkarit, kıkırdak ve bağ doku bileşenleri, lipoprotein ve selülozlu madde sentezler; yağların sindirilmesinde rol oynar.\nYanlış şıklar:\n• Vakuol ve sentriol → sitoplazma organelleridir ama akrozom oluşumu onlara ait değildir.\n• Peroksizom → ürat oksidaz, katalaz gibi oksidaz enzimlerini içerir.\n• Mitokondri → enerji organelidir; akrozom yapmaz.\n💡 Akılda kalsın: Golgi = akrozom + glikoprotein/mukopolisakkarit \"paketleyicisi\". Akrozom, spermin yumurta kabuğunu delen \"enzim başlığı\"dır — paketleme ustası Golgi'nin işi.", "shuf": true}, {"q": "Primer, sekonder ve fagozom adlarını alan; nükleaz, proteaz, glukozidaz, lipaz ve fosfataz içeren organel hangisidir?", "opts": [{"t": "Ribozom"}, {"t": "Golgi cihazı"}, {"t": "Lizozom"}, {"t": "Peroksizom"}, {"t": "Mitokondri"}], "a": 2, "exp": "Doğru cevap: **lizozom**. Lizozom; primer, sekonder ve fagozom adlarını alır. İçinde **nükleaz, proteaz, glukozidaz, lipaz ve fosfataz** bulunur. Yani nükleik asit, protein, şeker ve yağları parçalayan sindirim enzimleriyle doludur; hücrenin \"sindirim organeli\"dir.\nYanlış şıklar:\n• Ribozom → protein sentezi yapan organeldir; sindirim enzimi deposu değildir.\n• Golgi cihazı → akrozomu oluşturur, glikoprotein ve mukopolisakkarit sentezler.\n• Peroksizom → ürat oksidaz, katalaz, D-aminoasit oksidaz ve hidroksi asit oksidaz içerir (oksidazlar).\n• Mitokondri → bu enzim listesiyle ilişkilendirilmez.\n💡 Akılda kalsın: lizozom = \"-az\" ile biten sindirim enzimleri (nükleaz, proteaz, lipaz...); peroksizom = \"oksidaz + katalaz\". \"Lysis\" Yunanca \"çözme/parçalama\" demektir.", "shuf": true}, {"q": "Ürat oksidaz, katalaz, D-aminoasit oksidaz ve hidroksi asit oksidaz içeren organel hangisidir?", "opts": [{"t": "Peroksizom"}, {"t": "Sentriol"}, {"t": "Lizozom"}, {"t": "Golgi cihazı"}, {"t": "Endoplazmik retikulum"}], "a": 0, "exp": "Doğru cevap: **peroksizom**. İçerdiği enzimler: **ürat oksidaz, katalaz, D-aminoasit oksidaz ve hidroksi asit oksidaz**. Oksidazlar hidrojen peroksit (H₂O₂) üretir; katalaz da bu zararlı peroksidi parçalar — organelin adı buradan gelir.\nLizozomla karıştırma: lizozomda nükleaz, proteaz, glukozidaz, lipaz ve fosfataz (sindirim enzimleri) bulunur; peroksizomda ise oksidazlar ve katalaz bulunur.\nYanlış şıklar:\n• Sentriol → sitoplazma organelidir; bu enzimleri içermez.\n• Lizozom → sindirim enzimlerini içerir; primer, sekonder, fagozom adlarını alır.\n• Golgi cihazı → akrozomu oluşturur.\n• Endoplazmik retikulum → (düz ER) steroid hormon sentezi, detoksifikasyon, glikojen değişimi gibi görevler yapar.\n💡 Akılda kalsın: PEROKSizom = OKSidazlar + katalaz.", "shuf": true}, {"q": "Aktin, tubulin, vimentin veya lamin gibi proteinleri içeren yapı hangisidir?", "opts": [{"t": "Ribozom"}, {"t": "Nükleolus"}, {"t": "Glikokaliks"}, {"t": "Hücre iskeleti"}, {"t": "Lizozom"}], "a": 3, "exp": "Doğru cevap: **hücre iskeleti**. Hücre iskeleti **aktin, tubulin, vimentin veya lamin** gibi proteinleri içerir. Bu proteinler hücreye şekil ve destek verir: aktin mikrovillusun, tubulin (mikrotübül) silyumun iskeletini oluşturur; çekirdek zarı da nükleer lamina ve ara filamentle (lamin) desteklenir.\nYanlış şıklar:\n• Ribozom → sitoplazma organelidir; iskelet proteini içermez.\n• Nükleolus → nükleolonema ve pars amorfadan oluşur.\n• Glikokaliks → zarın dış yüzündeki karbohidrat örtüsüdür.\n• Lizozom → nükleaz, proteaz, glukozidaz, lipaz, fosfataz içerir.\n💡 Akılda kalsın: aktin–tubulin–vimentin–lamin = hücre iskeleti. Bina gibi düşün: kolonlar (mikrotübül), çelik halatlar (ara filament/vimentin), ince teller (aktin).", "shuf": true}, {"q": "Çekirdekle ilgili slayttaki bilgilerden hangisi **yanlıştır**?", "opts": [{"t": "Çekirdek hücrenin yaklaşık %10'unu kapsar"}, {"t": "Bazı patolojik durumlarda çekirdek sayısı artabilir"}, {"t": "Kemik hücrelerinde 5–10 çekirdek olabilir"}, {"t": "Karaciğer, kas ve Leydig hücrelerinde iki çekirdek olabilir"}, {"t": "Yaklaşık 120 günde yenilenen insan eritrositlerinde çekirdek bulunur"}], "a": 4, "exp": "Yanlış (dolayısıyla aranan) ifade: **\"yaklaşık 120 günde yenilenen insan eritrositlerinde çekirdek bulunur\"**. Olgun insan eritrositinde **çekirdek yoktur**; eritrositler yaklaşık 120 günde yenilenir.\nÇekirdekle ilgili doğru bilgiler:\n• Çekirdek hücrenin yaklaşık %10'unu kapsar.\n• Karaciğer, kas ve testisteki Leydig hücrelerinde çekirdek sayısı iki olabilir.\n• Kemik hücrelerinde 5–10 çekirdek olabilir.\n• Bazı patolojik durumlarda çekirdek sayısı artabilir.\n• İnterfaz çekirdeğinde dört bölge ayırt edilir: nükleus zarı, nükleus plazması, kromatin, nükleolus.\nDiğer dört şık bu listeden alındığı için doğrudur.\n💡 Akılda kalsın: eritrosit = çekirdeksiz, ömrü ~120 gün; kemik hücresi = 5–10 çekirdek. Eritrosit çekirdeğini atar ki içine daha çok hemoglobin sığsın.", "shuf": true, "html": true}, {"q": "Çekirdek zarıyla ilgili hangisi doğrudur?", "opts": [{"t": "Dış zar düz, iç zar ribozomlu ve granüllüdür"}, {"t": "Mitoz bölünmenin telofaz evresinde kaybolur"}, {"t": "İç ve dış zar arasında 400–700 Å'lük perinükleer aralık bulunur"}, {"t": "Zar yalnızca dıştan mikrotübüllerle desteklenir"}, {"t": "Porlarına nükleolonema denir"}], "a": 2, "exp": "Doğru cevap: **iç ve dış zar arasında 400–700 Å'lük perinükleer aralık bulunur**.\nÇekirdek zarının özellikleri:\n• Zar iki taraftan nükleer lamina ve ara filamentle desteklenir.\n• İç zar düzdür; dış zar ribozom taşıdığı için granüllü görünür.\n• Zarların birbirine temas ettiği bölgelerde 400–1000 Å çapında **annulus** adı verilen porlar vardır.\n• Çekirdek zarı mitozun **profaz** evresi sonunda kaybolur (telofazda yeniden oluşur).\nYanlış şıklar:\n• \"Dış zar düz, iç zar granüllü\" → tersidir; ribozomlu (granüllü) olan dış zardır.\n• \"Telofazda kaybolur\" → profaz sonunda kaybolur.\n• \"Yalnızca dıştan mikrotübüllerle desteklenir\" → iki taraftan nükleer lamina ve ara filamentle desteklenir.\n• \"Porlarına nükleolonema denir\" → porların adı annulustur; nükleolonema nükleolusun bölümüdür.\n💡 Akılda kalsın: Dış zar = Dolu (ribozomlu); perinükleer aralık 400–700 Å, annulus 400–1000 Å.", "shuf": true}, {"q": "Aşağıdakilerden hangisi interfaz halindeki çekirdekte ayırt edilen dört bölgeden biri **değildir**?", "opts": [{"t": "Nükleolus"}, {"t": "Sentriol"}, {"t": "Nükleus zarı"}, {"t": "Kromatin"}, {"t": "Nükleus plazması"}], "a": 1, "exp": "Doğru cevap: **sentriol**. İnterfaz halindeki çekirdekte dört bölge ayırt edilir: **a) nükleus zarı, b) nükleus plazması, c) kromatin, d) nükleolus**. Sentriol bu dört bölgeden biri değildir; **sitoplazmada bulunan organeller** arasında sayılır (endoplazmik retikulum, mitokondri, ribozom, Golgi, sentrioller, plastidler, lizozom, peroksizom, vakuol).\nDiğer şıklar (nükleolus, nükleus zarı, kromatin, nükleus plazması) çekirdeğin dört bölgesinin kendisidir.\nBölgelerin ayrıntıları: kromatin → heterokromatin ve ökromatin (nükleozom = histon oktameri + DNA); nükleolus → nükleolonema ve pars amorfa; nükleus zarı → perinükleer aralık ve annulus porları.\n💡 Akılda kalsın: çekirdeğin 4'ü = Zar, Plazma, Kromatin, Nükleolus (ZPKN). Sentriol ise mitozda iğ ipliklerini kuran sitoplazma elemanıdır.", "shuf": true, "html": true}, {"q": "Nükleolusun bölümleri olarak slaytta verilen yapılar hangileridir?", "opts": [{"t": "Nükleolonema ve pars amorfa"}, {"t": "Heterokromatin ve ökromatin"}, {"t": "Annulus ve perinükleer aralık"}, {"t": "Zonula adherens ve zonula okludens"}, {"t": "Organel ve inklüzyon"}], "a": 0, "exp": "Doğru cevap: **nükleolonema ve pars amorfa**. Nükleolus bu iki bölümden oluşur ve interfaz çekirdeğindeki dört bölgeden biridir.\nYanlış şıklar:\n• Heterokromatin ve ökromatin → kromatinin kısımlarıdır.\n• Annulus ve perinükleer aralık → çekirdek zarına aittir (porlar ve iki zar arasındaki aralık).\n• Zonula adherens ve zonula okludens → hücreler arası bağlantılardır (tutucu ve engelleyici).\n• Organel ve inklüzyon → hücrenin canlı ve cansız kısımlarının adlarıdır.\n💡 Akılda kalsın: NÜKLEOlus → NÜKLEOlonema + pars amorfa. \"Pars amorfa\" Latince \"şekilsiz kısım\" demektir; nema ise \"iplik\" — iplikli kısım + şekilsiz kısım.", "shuf": true}, {"q": "Hücrenin tanımı hangisinde doğru verilmiştir?", "opts": [{"t": "Sadece çekirdek içeren yapılar"}, {"t": "Canlının canlılık özelliği gösteren en küçük yapısal ve fonksiyonel birimi"}, {"t": "Virüslerin de dahil olduğu en küçük canlı birim"}, {"t": "Zarla çevrili olmayan protein topluluğu"}, {"t": "Yalnızca çok hücreli canlılarda bulunan yapı taşı"}], "a": 1, "exp": "Doğru cevap: hücre, **canlının canlılık özelliği gösteren en küçük yapısal ve fonksiyonel birimidir**. Bir hücreli organizmalardan insana kadar bütün canlılar hücrelerden oluşur. Hücreler bağımsız üniteler oldukları halde birlikte işlev görür. Hücre yalnızca daha önce var olan başka bir canlı hücreden meydana gelebilir. Tek bir hücre, diğerlerinden hücre zarı ile ayrılmıştır.\nYanlış şıklar:\n• \"Sadece çekirdek içeren yapılar\" → prokaryot hücrelerde (bakteriler) çekirdek yoktur ama hücredirler; olgun eritrositte de çekirdek bulunmaz.\n• \"Virüslerin de dahil olduğu en küçük birim\" → virüsler hücresel yapıda olmayanlar (asellüler) arasındadır.\n• \"Zarla çevrili olmayan protein topluluğu\" → hücre zarla çevrilidir; sadece proteinden oluşan etken prionlardır.\n• \"Yalnızca çok hücreli canlılarda\" → bir hücreli organizmalar da hücreden oluşur.\n💡 Akılda kalsın: hücre = canlılığın en küçük yapı + işlev birimi; hücre ancak hücreden doğar (omnis cellula e cellula).", "shuf": true}, {"q": "Prokaryot ve ökaryot hücre ayrımının temel ölçütü nedir?", "opts": [{"t": "DNA içerip içermemesi"}, {"t": "Hücrenin büyüklüğü"}, {"t": "Hücre içi organellerin zarla çevrili olup olmaması"}, {"t": "Hücre duvarının varlığı"}, {"t": "Ribozom bulunup bulunmaması"}], "a": 2, "exp": "Doğru cevap: **hücre içi organellerin zarla çevrili olup olmaması**. Hücreler bu ölçüte göre yapısal olarak iki tiptir: **prokaryot** ve **ökaryot**. Prokaryot olan bakterilerde çekirdek, mitokondri, ER, Golgi gibi zarlı yapılar yoktur; ökaryot hücrelerde ise zarla çevrili çekirdek ve zarlı organeller bulunur.\nYanlış şıklar:\n• DNA içerip içermemesi → her iki hücre tipi de genetik materyal içerir; ayrım ölçütü bu değildir.\n• Hücrenin büyüklüğü → ayrım ölçütü olarak verilmez.\n• Hücre duvarının varlığı → bakterilerde hücre duvarı vardır ama prokaryot–ökaryot tanımının ölçütü bu değildir (bitki ve mantar hücrelerinde de duvar vardır).\n• Ribozom bulunup bulunmaması → ribozom her iki hücre tipinde de bulunur; ayırt edici değildir.\n💡 Akılda kalsın: \"zarlı organel var mı?\" → evetse ökaryot, hayırsa prokaryot. \"Karyon\" Yunanca çekirdek; pro- = önce(siz), eu- = gerçek: gerçek çekirdekli = ökaryot.", "shuf": true}, {"q": "Hücre zarında **en fazla** bulunan lipit hangisidir?", "opts": [{"t": "Fosfolipit"}, {"t": "Glikolipit"}, {"t": "Glikoprotein"}, {"t": "Glikokaliks"}, {"t": "Kolesterol"}], "a": 0, "exp": "Doğru cevap: **fosfolipit**. Membranda yer alan lipitler, **en fazla fosfolipit** olmak üzere glikolipit ve kolesteroldür. Fosfolipitler 45 Å kalınlığında çift katlı tabaka oluşturur ve dış ortamdan izolasyonu sağlar.\nYanlış şıklar:\n• Glikolipit → zar lipitlerindendir ama en fazla bulunan değildir; karbohidratla birlikte glikokaliksi oluşturur.\n• Glikoprotein → lipit değil, şeker ucu dış yüze bakan protein bölgesidir.\n• Glikokaliks → zarın dış yüzündeki karbohidrat örtüsüdür; bir lipit türü değildir.\n• Kolesterol → zarın dayanıklılığını ve akışkanlığını düzenler; miktarca fosfolipitten azdır.\n💡 Akılda kalsın: zar lipitleri = Fosfolipit (en çok) > glikolipit, kolesterol. Zarın \"tuğlası\" fosfolipit, \"harcı\" kolesteroldür.", "shuf": true, "html": true}, {"q": "Slayta göre hücre zarı proteinleriyle ilgili hangisi **yanlıştır**?", "opts": [{"t": "İntegral ve yüzeysel (periferik) olarak bulunurlar"}, {"t": "Transport proteinleri olarak bulunurlar"}, {"t": "Özgül reseptörler olarak bulunurlar"}, {"t": "Enzimler olarak bulunurlar"}, {"t": "Zarda en fazla bulunan yapıdır ve dış ortamdan izolasyonu sağlarlar"}], "a": 4, "exp": "Yanlış (dolayısıyla aranan) ifade: **\"zarda en fazla bulunan yapıdır ve dış ortamdan izolasyonu sağlarlar\"**. Zarda en fazla bulunan ve izolasyonu sağlayan yapı **fosfolipitlerdir**, proteinler değil.\nZar proteinleri globüler ve alfa heliks şeklinde ipliksi proteinlerdir; zarda yer yer 80–85 Å kalınlığında protein bölgeleri oluştururlar. **İntegral** ve **yüzeysel (periferik)** olarak; **özgül reseptörler, enzimler ve transport proteinleri** olarak bulunurlar. Diğer dört şık bu bilgilerden alındığı için doğrudur. Kolaylaştırılmış difüzyondaki taşıyıcı ve kanal proteinleri de transport proteinlerine örnektir.\n💡 Akılda kalsın: zar proteini görevleri = Reseptör + Enzim + Transport (RET); izolasyon = fosfolipit.", "shuf": true, "html": true}, {"q": "Hücreler arasındaki hücrelerarası sıvı ile dolu aralığın genişliği slayta göre ne kadardır?", "opts": [{"t": "45 Å"}, {"t": "75–100 Å"}, {"t": "400–1000 Å"}, {"t": "80–200 Å"}, {"t": "400–700 Å"}], "a": 3, "exp": "Doğru cevap: **80–200 Å**. Hücreler arasında, hücrelerarası sıvı ile dolu **80–200 Å'lük** bir interselüler aralık vardır. İki hücre bu aralığa rağmen bağlantı kompleksleriyle (tutucu, engelleyici, iletişim sağlayan) birbirine bağlıdır.\nYanlış şıklar (karıştırılan diğer sayılar):\n• 45 Å → fosfolipit çift tabaka\n• 75–100 Å → hücre zarının toplam kalınlığı\n• 400–1000 Å → çekirdek porlarının (annulus) çapı\n• 400–700 Å → perinükleer aralık\n💡 Akılda kalsın: hücre ARAsı 80–200 Å; zarın kendisi 75–100 Å. İki duvar (zar) arasındaki koridor, duvarın kendisinden biraz geniştir.", "shuf": true}, {"q": "\"Desmozom\" hangi bağlantı tipinin örneğidir?", "opts": [{"t": "Zonula okludens"}, {"t": "Makula adherens"}, {"t": "Zonula adherens"}, {"t": "Konnekson"}, {"t": "Gap junction"}], "a": 1, "exp": "Doğru cevap: **makula adherens**. Tutucu (sabitleyici) bağlantılar zonula adherens ve **makula adherens**tir; desmozom ve hemidesmozom, makula adherens grubundadır. Hemidesmozom hücreyi integrinle alttaki yapıya (bazal laminaya) bağlar.\nYanlış şıklar:\n• Zonula okludens → geçirgen olmayan (engelleyici) bağlantıdır.\n• Zonula adherens → tutucu bağlantıdır ama desmozom onun değil, makula adherensin örneğidir.\n• Konnekson ve gap junction → iletişim sağlayan bağlantıdır.\n💡 Akılda kalsın: makula (Latince \"leke/nokta\") adherens = desmozom ve hemidesmozom — nokta şeklinde perçinler. Zonula (\"kuşak\") ise hücreyi çepeçevre sarar.", "shuf": true}, {"q": "Osmoz, hücre zarında transport sınıflamasında hangi başlık altında yer alır?", "opts": [{"t": "Egzositoz"}, {"t": "Aktif transport"}, {"t": "Endositoz"}, {"t": "Basit difüzyon"}, {"t": "Kolaylaştırılmış difüzyon"}], "a": 3, "exp": "Doğru cevap: **basit difüzyon**. Transport sınıflamasında osmoz, **\"basit difüzyon/osmoz\"** şeklinde basit difüzyonla birlikte verilir. Osmoz, suyun zardan difüzyonudur; enerji ya da taşıyıcı protein gerektirmez.\nTam liste:\n• Endositoz/egzositoz → fagositoz, pinositoz\n• Difüzyon → **basit difüzyon/osmoz**; kolaylaştırılmış difüzyon (ta
