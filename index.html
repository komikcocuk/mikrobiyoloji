biyotiklere de dirençlidir**. Epidemiyolojide \"özellikle MRSA suşları antibiyotiğe dirençli\" diye vurgulanır; toplum ve hastane kaynaklı enfeksiyon yapar.\nPratik sonuç: MRSA'da penisilinler ve sefalosporinler (β-laktamlar) işe yaramaz; slayttaki IV seçenek vankomisindir. Direncin kaynağı, mecA geninin kodladığı ve β-laktamların bağlanamadığı değişmiş penisilin bağlayan protein olan PBP2a'dır.\nYanlış şıklar:\n• Metisiline duyarlı S. aureus → bu MSSA'dır, MRSA değil.\n• Metronidazole dirençli S. aureus → kısaltmadaki \"M\" metisilindir; metronidazol anaeroplara etkili bir ilaçtır.\n• Makrolide dirençli S. agalactiae → MRSA'nın \"SA\"sı Staphylococcus aureus'tur.\n• Çoklu dirençli S. anginosus → S. anginosus, biyokimyasal olarak viridanslara benzeyen bir streptokoktur; MRSA ile ilgisi yoktur.\n💡 Akılda kalsın: MRSA → \"β-laktam yok, vankomisin var\".", "org": ["saureus"], "shuf": true}, {"q": "Metisiline dirençli S. aureus (MRSA) enfeksiyonunun tedavisinde aşağıdaki antibiyotiklerden hangisi kullanılır?", "opts": [{"t": "Penisilin G"}, {"t": "Ampisilin-sulbaktam"}, {"t": "Sefalotin"}, {"t": "Nafsilin"}, {"t": "Vankomisin"}], "a": 4, "exp": "MRSA, metisilin dahil **tüm β-laktamlara** dirençlidir. Slaytta S. aureus tedavisinde **IV vankomisin** yer alır; antibiyotik tablosuna göre glikopeptid olan vankomisin **tüm stafilokok ve streptokoklara etkilidir** (peptidoglikan çapraz bağlanmasını inhibe eder).\nYanlış şıkların hepsi β-laktamdır:\n• Penisilin G → doğal penisilin; tabloya göre stafilokoklara etkisi zaten çok azdır.\n• Ampisilin-sulbaktam → β-laktamaz inhibitörlü β-laktam; β-laktamaz üreten stafilokoklara etkilidir ama MRSA'daki direnç β-laktam grubunun tamamını kapsar.\n• Sefalotin → dar spektrumlu sefalosporin (β-laktam).\n• Nafsilin → penisilinaza dirençli penisilin (metisilin grubunda); metisiline direnç zaten bu ilaçlara direnç demektir.\n💡 Akılda kalsın: \"MRSA'da β-laktam yazan her şık elenir → glikopeptid (vankomisin)\".", "org": ["saureus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Katalaz, koagülaz, lipaz ve nükleaz gibi enzimlerle hastalık yapan, piyojenik (irin oluşturan) Gram pozitif kok hangisidir?", "opts": [{"t": "Streptococcus pneumoniae"}, {"t": "Streptococcus agalactiae"}, {"t": "Staphylococcus aureus"}, {"t": "Streptococcus pyogenes"}, {"t": "Enterococcus faecalis"}], "a": 2, "exp": "Slayta göre **S. aureus**; katalaz, koagülaz, lipaz, hiyalüronidaz, nükleaz ve sitotoksinler ile hastalık yapar ve **piyojeniktir** (akut nötrofilik inflamasyon ve irin). Katalaz, stafilokokları katalaz negatif olan streptokok ve enterokoklardan ayırır; koagülaz ise S. aureus'u diğer stafilokoklardan ayıran anahtar enzimdir.\nYanlış şıklar (her birinin slayttaki \"imza\" virülans faktörü):\n• S. pneumoniae → polisakkarit kapsül, IgA proteaz, fosforilkolin, pnömolizin.\n• S. agalactiae → kapsül ve sialik asit (fagositoza karşı korur).\n• S. pyogenes → M proteini, hiyalüronik asit kapsül; hidrolitik enzimleri streptolizin S ve O, streptokinaz, DNaz.\n• Enterococcus faecalis → slaytta öne çıkan özelliği antibiyotik direncidir.\n💡 Akılda kalsın: \"Koagülaz = S. aureus\".", "org": ["saureus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdakilerden hangisi slaytta S. aureus'un hastalık yapmasında rol oynayan enzimler arasında **yer almaz**?", "opts": [{"t": "Lipaz"}, {"t": "Koagülaz"}, {"t": "Hiyalüronidaz"}, {"t": "Katalaz"}, {"t": "Streptokinaz"}], "a": 4, "exp": "**Streptokinaz**, slayta göre **S. pyogenes**'in hidrolitik enzimidir (streptolizin S ve O, streptokinaz ve DNazlar ile birlikte); S. aureus'un listesinde yer almaz.\nSlayttaki S. aureus enzim/virülans listesi: **katalaz, koagülaz, lipaz, hiyalüronidaz, nükleaz ve sitotoksinler**. Lipaz, koagülaz, hiyalüronidaz ve katalaz bu listede olduğu için \"yer almaz\" olamaz.\nAyırt etme ipucu:\n• S. aureus: \"-az\" ile biten genel enzimler (katalaz, koagülaz, lipaz, hiyalüronidaz, nükleaz).\n• S. pyogenes: adında \"strepto\" geçenler (streptolizin, streptokinaz) + DNaz.\n💡 Akılda kalsın: İsminde \"Strepto\" olan enzim stafilokoka ait olamaz.", "org": ["saureus", "spyogenes"], "shuf": true, "tag": "Pekiştirme", "html": true}, {"q": "Aşağıdakilerden hangisi stafilokokların (S. aureus) toksini **değildir**?", "opts": [{"t": "Enterotoksin"}, {"t": "Eksfoliyatif toksin"}, {"t": "Toksik şok sendromu toksini"}, {"t": "Pnömolizin"}, {"t": "Sitotoksinler"}], "a": 3, "exp": "**Pnömolizin**, slayta göre **S. pneumoniae**'nın toksinidir; epitel hücrelerini ve makrofajları yok eder. S. aureus'un toksini değildir.\nSlayttaki S. aureus toksinleri:\n• Enterotoksin → ısıya ve mide asidine dirençli; gıda zehirlenmesi.\n• Eksfoliyatif toksin (A ve B) → cildin soyulması (haşlanmış deri sendromu).\n• Toksik şok sendromu toksini → ısıya ve proteaza dirençli; çoklu organ patolojisi.\n• Sitotoksinler → slaytta katalaz, koagülaz, lipaz, hiyalüronidaz ve nükleaz ile birlikte hastalık yapan faktörler arasında sayılır.\nBu dört şık S. aureus'a ait olduğu için doğrudur.\n💡 Akılda kalsın: \"Pnömo-lizin = Pnömo-kok\".", "org": ["saureus", "spneumoniae"], "shuf": true, "tag": "Pekiştirme", "html": true}, {"q": "Akut osteomiyelit tanısı konan bir hastanın kan kültüründe Gram pozitif kok üremesi bekleniyor. Slayta göre en olası etken hangisidir?", "opts": [{"t": "Streptococcus pyogenes"}, {"t": "Enterococcus faecalis"}, {"t": "Streptococcus pneumoniae"}, {"t": "Staphylococcus aureus"}, {"t": "Streptococcus agalactiae"}], "a": 3, "exp": "Slaytta **osteomiyelit**, S. aureus'un piyojenik hastalıkları arasında sayılır (impetigo, follikülit, fronkül-karbonkül, yara enfeksiyonu, pnömoni, endokardit, osteomiyelit, septik artrit). Klinik sendromlar tablosunda da osteomiyelitin ilk sıradaki etkeni **S. aureus**'tur (ardından koagülaz-negatif stafilokoklar, P. aeruginosa, Enterobacteriales).\nYanlış şıklar:\n• S. pyogenes → farenjit, kızıl, piyoderma, erizipel, selülit, nekrotizan fasiit, TŞS, romatizmal ateş, AGN.\n• Enterococcus faecalis → üriner sistem enfeksiyonu, peritonit, bakteriyemi, endokardit.\n• S. pneumoniae → pnömoni, menenjit, sinüzit, otitis media, fulminan sepsis.\n• S. agalactiae → yenidoğan hastalığı (pnömoni, menenjit, sepsis), gebede endometrit/İYE, erişkinde pnömoni, eklem ve yumuşak doku enfeksiyonu.\n💡 Akılda kalsın: Kemik ve eklemin (osteomiyelit, septik artrit) baş etkeni S. aureus.", "org": ["saureus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Diz cerrahisi sonrasında sütür alanında ciddi piyojenik enfeksiyon gelişen 54 yaşındaki erkek hastadan katalaz ve koagülaz üreten Gram pozitif koklar izole ediliyor. Etken aşağıdakilerden hangisidir?", "opts": [{"t": "Moraxella catarrhalis"}, {"t": "Staphylococcus aureus"}, {"t": "Enterococcus faecalis"}, {"t": "Streptococcus agalactiae"}, {"t": "Streptococcus pyogenes"}], "a": 1, "exp": "Cerrahi yara alanında **piyojenik** enfeksiyon + **katalaz ve koagülaz** üreten Gram pozitif kok = **Staphylococcus aureus**. Slayta göre S. aureus katalaz, koagülaz, lipaz, hiyalüronidaz, nükleaz ve sitotoksinlerle hastalık yapar; yara enfeksiyonları piyojenik hastalıkları arasındadır. Klinik sendromlar tablosunda da cerrahi yaraların etkenleri S. aureus ve koagülaz-negatif stafilokoklardır — koagülaz pozitifliği S. aureus'u gösterir.\nYanlış şıklar:\n• Moraxella catarrhalis → Gram **negatif** kok; bronşit, sinüzit, otit etkeni.\n• Enterococcus faecalis → koagülaz üretmez; ÜSE, peritonit, endokardit yapar.\n• S. agalactiae ve S. pyogenes → streptokoklar; slaytta katalaz/koagülaz bunların değil S. aureus'un enzimleri olarak geçer.\n💡 Akılda kalsın: \"Katalaz + koagülaz + irin = S. aureus\".", "org": ["saureus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Slayttaki klinik sendromlar tablosuna göre Staphylococcus saprophyticus hangi tablonun etkenleri arasında yer alır?", "opts": [{"t": "Haşlanmış deri sendromu"}, {"t": "Toksik şok sendromu"}, {"t": "Gıda zehirlenmesi"}, {"t": "Sistit ve piyelonefrit"}, {"t": "Menenjit"}], "a": 3, "exp": "Slayttaki klinik sendromlar tablosunda **sistit ve piyelonefrit** etkenleri: E. coli, Proteus mirabilis, diğer Enterobacteriales ve **Staphylococcus saprophyticus**. Tabloya göre S. saprophyticus ayrıca **böbrek taşı** etkenlerinden biridir (P. mirabilis ile birlikte). Klinikte özellikle genç kadınlardaki idrar yolu enfeksiyonlarının tipik etkenlerindendir.\nYanlış şıklar:\n• Haşlanmış deri sendromu → S. aureus eksfoliyatif toksini.\n• Toksik şok sendromu → S. aureus TŞS toksini (ve streptokokal TŞS).\n• Gıda zehirlenmesi → S. aureus ve B. cereus.\n• Menenjit → S. agalactiae, E. coli, H. influenzae, S. pneumoniae, N. meningitidis, L. monocytogenes.\n💡 Akılda kalsın: Stafilokokların idrar yolu temsilcisi S. saprophyticus'tur.", "shuf": true, "tag": "Pekiştirme"}, {"q": "Slayttaki tabloya göre kateter ile ilişkili sepsisin etkeni hangisidir?", "opts": [{"t": "Proteus mirabilis"}, {"t": "Enterococcus faecalis"}, {"t": "Koagülaz-negatif stafilokoklar"}, {"t": "Streptococcus pneumoniae"}, {"t": "Streptococcus pyogenes"}], "a": 2, "exp": "Slayttaki tabloda \"**kateter ile ilişkili sepsis**\"in etkeni olarak yalnızca **koagülaz-negatif stafilokoklar** yazılıdır. Koagülaz-negatif stafilokoklar tabloda ayrıca genel sepsis, endokardit, osteomiyelit, cerrahi yara, protez ile ilişkili enfeksiyon ve diyaliz ile ilişkili peritonit etkenleri arasında geçer — yani **yabancı cisim / tıbbi cihaz** enfeksiyonlarıyla ilişkilidirler.\nYanlış şıklar:\n• Proteus mirabilis → sistit, piyelonefrit, böbrek taşı.\n• Enterococcus faecalis → peritonit, prostatit, ÜSE, endokardit; tabloda kateter sepsisi için yazılmamıştır.\n• S. pneumoniae → pnömoni, menenjit, otitis media, sinüzit.\n• S. pyogenes → farenjit, erizipel, selülit, nekrotizan fasiit.\n💡 Akılda kalsın: \"Kateter, protez, diyaliz → koagülaz-negatif stafilokok\".", "shuf": true, "tag": "Pekiştirme"}, {"q": "Kanlı agarda hemoliz tipleriyle ilgili hangisi doğrudur?", "opts": [{"t": "γ hemoliz – tam hemoliz"}, {"t": "α hemoliz – tam hemoliz"}, {"t": "γ hemoliz – hiç hemoliz yok"}, {"t": "α hemoliz – hiç hemoliz yok"}, {"t": "β hemoliz – kısmi hemoliz"}], "a": 2, "exp": "Slayta göre streptokoklar kanlı agardaki hemolizlerine göre sınıflandırılır:\n• **α hemoliz → kısmi hemoliz** (viridanslar; ör. S. pneumoniae viridanstır).\n• **β hemoliz → tam hemoliz** (ör. S. pyogenes, S. agalactiae).\n• **γ hemoliz → hiç hemoliz yok**.\nDoğru eşleşme \"γ hemoliz – hiç hemoliz yok\"tur.\nYanlış şıklar:\n• γ – tam hemoliz → tam hemoliz β'dır.\n• α – tam hemoliz → α kısmidir.\n• α – hiç hemoliz yok → hemoliz yokluğu γ'dır.\n• β – kısmi hemoliz → β tamdır.\nEk bilgi (slayt): S. anginosus biyokimyasal olarak viridanslara, hemolitik olarak β-hemolitiklere benzer; streptokoklar ayrıca seroloji ve biyokimyaya göre de sınıflandırılır.\n💡 Akılda kalsın: alfa = **a**z (kısmi), beta = **b**ütün (tam), gama = **g**örünmez (yok).", "shuf": true}, {"q": "Slayta göre viridans olarak tanımlanan ve viridans streptokoklar içinde en virülan olan streptokok hangisidir?", "opts": [{"t": "Streptococcus pneumoniae"}, {"t": "Streptococcus pyogenes"}, {"t": "Streptococcus agalactiae"}, {"t": "Staphylococcus aureus"}, {"t": "Enterococcus faecalis"}], "a": 0, "exp": "Slayta göre **S. pneumoniae viridanstır**; viridanslar genel olarak avirülandır, ancak S. pneumoniae **viridans streptokoklar içinde en virülan olandır** ve slayttaki \"bakteriyel virülansı en yüksek olanlar\" listesinde de ilk sıradadır. Virülansını fagositoza dirençli polisakkarit kapsül (100 farklı serotip), adezinler, fosforilkolin, IgA proteaz ve pnömolizin sağlar.\nYanlış şıklar:\n• S. pyogenes ve S. agalactiae → **β-hemolitik** streptokoklardır, viridans değildir.\n• Staphylococcus aureus → streptokok değil stafilokoktur.\n• Enterococcus faecalis → ayrı bir cins; slaytta viridans olarak geçmez.\n💡 Akılda kalsın: \"Viridansların kralı pnömokok\".", "org": ["spneumoniae"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Streptococcus pyogenes'te fagositozu önleyen yapılar hangileridir?", "opts": [{"t": "Pilin ve porin"}, {"t": "Koagülaz ve katalaz"}, {"t": "Lipid A ve PRP"}, {"t": "Pnömolizin ve IgA proteaz"}, {"t": "M, M benzeri ve C5 hücre duvarı proteinleri"}], "a": 4, "exp": "Slayta göre S. pyogenes'te **M, M benzeri ve C5 hücre duvarı proteinleri fagositozu önler**; M ve F proteinleri ise yapışma ve yayılmayı sağlar. Hiyalüronik asitten yapılmış, immünojenik olmayan kapsülü de vardır.\nYanlış şıklar (her biri başka bakteriye aittir):\n• Pilin ve porin → N. gonorrhoeae (pilin tutunma; porin nötrofillerde fagozom füzyonunu önler).\n• Koagülaz ve katalaz → S. aureus enzimleri.\n• Lipid A ve PRP → H. influenzae (PRP: riboz-ribitol-fosfat kapsül; lipid A menenjiti indükler).\n• Pnömolizin ve IgA proteaz → S. pneumoniae.\n💡 Akılda kalsın: S. pyogenes'in \"M\"si → \"Makrofajdan (fagositozdan) kaç\".", "org": ["spyogenes"], "shuf": true}, {"q": "Streptococcus pyogenes'in fagositozu önleyen antijeni aşağıdakilerden hangisidir?", "opts": [{"t": "M proteini"}, {"t": "Streptokinaz"}, {"t": "Streptolizin O"}, {"t": "Streptolizin S"}, {"t": "DNaz"}], "a": 0, "exp": "**M proteini**, S. pyogenes'in fagositozu önleyen temel antijenidir (slaytta M benzeri ve C5 proteinleriyle birlikte). Ayrıca M ve F proteinleri yapışma-yayılmayı sağlar; slayta göre farenjit ve yumuşak doku enfeksiyonları M proteini ile oluşturulur.\nYanlış şıklar — bunlar slayta göre S. pyogenes'in **hidrolitik enzimleridir**, fagositozu önleyen yapılar değildir:\n• Streptokinaz\n• Streptolizin O\n• Streptolizin S\n• DNaz\nToksini ise streptokokal pirojenik ekzotoksindir.\n💡 Akılda kalsın: S. pyogenes'te \"fagositozdan kaçış = M (ve C5); doku yıkımı = streptolizin, streptokinaz, DNaz\".", "org": ["spyogenes"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Grup A streptokokların (S. pyogenes) kapsülü için karakteristik olan hangisidir?", "opts": [{"t": "Riboz, ribitol ve fosfat (PRP) içeren polisakkarit kapsül"}, {"t": "Dış membran proteinleri"}, {"t": "Poli-D-glutamik asit yapısında kapsül"}, {"t": "Sialik asit içeren kapsül"}, {"t": "Hiyalüronik asitten yapılmış, immünojenik olmayan kapsül"}], "a": 4, "exp": "Slayta göre S. pyogenes'in kapsülü **hiyalüronik asitten yapılmıştır ve immünojenik değildir** (vücudun kendi hiyalüronik asidine benzediği için bağışıklık sistemi onu yabancı olarak tanımaz).\nYanlış şıkların hangi bakteriye ait olduğunu bil:\n• Riboz, ribitol ve fosfat (PRP) içeren polisakkarit kapsül → H. influenzae tip b (HIB aşısı bu PRP'ye karşı).\n• Dış membran proteinleri → Gram negatiflere aittir; Gram pozitiflerde dış membran yoktur.\n• Poli-D-glutamik asit kapsül → B. anthracis (fagositozu önler).\n• Sialik asit içeren kapsül → S. agalactiae (kapsül ve sialik asit fagositoza karşı korur).\n💡 Akılda kalsın: \"pYOgenes → hİYAlüronik\" kapsül; immünojenik değil.", "org": ["spyogenes"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdakilerden hangisi S. pyogenes'in fagositozu önleyen ya da yapışma ve yayılmayı sağlayan yapılarından biri **değildir**?", "opts": [{"t": "M proteini"}, {"t": "F proteini"}, {"t": "C5 hücre duvarı proteini"}, {"t": "Hiyalüronik asit kapsül"}, {"t": "Pilin"}], "a": 4, "exp": "**Pilin**, slayta göre **Neisseria** türlerinin tutunma yapısıdır (N. gonorrhoeae'de ağız boşluğu ve vajinaya tutunma, N. meningitidis'te tutunma). S. pyogenes'in yapıları arasında yer almaz.\nSlayttaki S. pyogenes yapıları:\n• M proteini → fagositozu önler + yapışma/yayılma.\n• F proteini → yapışma ve yayılma.\n• C5 hücre duvarı proteini → fagositozu önler (M ve M benzeri proteinlerle birlikte).\n• Hiyalüronik asit kapsül → immünojenik değildir; bakteriyi bağışıklıktan gizler.\n💡 Akılda kalsın: S. pyogenes yüzeyi = \"M, F, C5 + hiyalüronik kapsül\"; pilin Neisseria'nın.", "org": ["spyogenes"], "shuf": true, "tag": "Pekiştirme", "html": true}, {"q": "Aşağıdakilerden hangisi Streptococcus pyogenes'in hidrolitik enzimlerinden biri **değildir**?", "opts": [{"t": "Beta laktamaz"}, {"t": "Streptolizin S"}, {"t": "Streptolizin O"}, {"t": "Streptokinaz"}, {"t": "DNaz"}], "a": 0, "exp": "**Beta laktamaz**, slayta göre **N. gonorrhoeae**'de penisilin direnci sağlayan enzimdir; S. pyogenes'in hidrolitik enzimi değildir. Nitekim S. pyogenes tedavisinde ilk sırada penisilin V kullanılır.\nSlayttaki S. pyogenes hidrolitik enzimleri: **streptolizin S, streptolizin O, streptokinaz ve DNazlar**. Bu dört şık doğrudur.\nKarıştırma: S. pyogenes'in toksini streptokokal pirojenik ekzotoksindir; fagositozdan kaçış ise M, M benzeri ve C5 proteinleriyle olur.\n💡 Akılda kalsın: S. pyogenes penisiline duyarlıdır → β-laktamaz onun olamaz.", "org": ["spyogenes"], "shuf": true, "tag": "Pekiştirme", "html": true}, {"q": "S. pyogenes'in süpüratif **OLMAYAN** (otoimmün) hastalıkları hangileridir?", "opts": [{"t": "Streptokokal toksik şok sendromu"}, {"t": "Erizipel ve kızıl"}, {"t": "Nekrotizan fasiit ve selülit"}, {"t": "Romatizmal ateş ve akut glomerülonefrit"}, {"t": "Farenjit ve piyoderma"}], "a": 3, "exp": "Slayta göre S. pyogenes hastalıkları iki alt türe ayrılır:\n• **Süpüratif**: deri ve yumuşak doku enfeksiyonları (piyoderma, erizipel, selülit), farenjit, kızıl, nekrotizan fasiit, streptokokal toksik şok sendromu.\n• **Süpüratif olmayan (otoimmün)**: **romatizmal ateş** ve **akut glomerülonefrit**.\nYanlış şıklar:\n• Streptokokal toksik şok sendromu → slaytta süpüratif sayılır.\n• Erizipel ve kızıl → süpüratif deri/sistemik tablolar.\n• Nekrotizan fasiit ve selülit → süpüratif yumuşak doku enfeksiyonları.\n• Farenjit ve piyoderma → süpüratif enfeksiyonlar.\nSlayttaki bağlantı: farenjitte ilk 10 gün içinde tedavi başlanmazsa romatizmal ateş oluşur.\n💡 Akılda kalsın: Otoimmün ikili = \"Kalp (romatizmal ateş) – Böbrek (glomerülonefrit)\".", "org": ["spyogenes"], "shuf": true, "html": true}, {"q": "Aşağıdakilerden hangisi poststreptokoksik (süpüratif olmayan, otoimmün) bir hastalıktır?", "opts": [{"t": "Nekrotizan fasiit"}, {"t": "Farenjit"}, {"t": "Erizipel"}, {"t": "Streptokokal toksik şok sendromu"}, {"t": "Akut glomerülonefrit"}], "a": 4, "exp": "**Akut glomerülonefrit**, romatizmal ateşle birlikte S. pyogenes'in **süpüratif olmayan (otoimmün)** hastalığıdır; enfeksiyondan sonra bağışıklık yanıtı sonucu ortaya çıkar, bakteri dokuda irin yapmaz.\nYanlış şıklar — slayta göre hepsi süpüratiftir:\n• Nekrotizan fasiit → derin yumuşak doku enfeksiyonu.\n• Farenjit → bakteriyel farenjitin asıl sorumlusu S. pyogenes'tir.\n• Erizipel → deri enfeksiyonu.\n• Streptokokal toksik şok sendromu → slaytta süpüratif tablolar arasında sayılır.\n💡 Akılda kalsın: \"Post-streptokoksik\" = otoimmün = romatizmal ateş + akut glomerülonefrit.", "org": ["spyogenes"], "shuf": true, "tag": "Pekiştirme"}, {"q": "S. pyogenes farenjitinde tedaviye kaç gün içinde başlanmazsa romatizmal ateş oluşur?", "opts": [{"t": "5 gün"}, {"t": "3 gün"}, {"t": "10 gün"}, {"t": "21 gün"}, {"t": "30 gün"}], "a": 2, "exp": "Slayta göre S. pyogenes farenjitinde **ilk 10 gün içinde tedavi başlanmazsa romatizmal ateş oluşur**. Bu yüzden boğaz enfeksiyonunun erken ve tam tedavisi, romatizmal ateşin (süpüratif olmayan, otoimmün komplikasyon) önlenmesi için kritiktir.\nSlayttaki tedavi: Penisilin V (alternatif sefalosporin, makrolid), amoksisilin tablet; ağır tablolarda IV penisilin + klindamisin.\nRomatizmal ateşe bağlı kalp hastalığı (KDH) olan kişilerde diş tedavisinden önce antibiyotik gerekir.\nYanlış şıklar: 3 gün, 5 gün, 21 gün ve 30 gün slayttaki süre değildir.\n💡 Akılda kalsın: \"10 gün kuralı\" → 10 gün içinde tedavi = romatizmal ateş yok.", "org": ["spyogenes"], "shuf": true}, {"q": "Çocukluğunda romatizmal ateş geçirmiş ve buna bağlı kalp hastalığı olan bir hastaya diş tedavisi planlanıyor. Slayta göre ne yapılmalıdır?", "opts": [{"t": "BCG aşısı yapılır"}, {"t": "Yalnızca ağrı kesici verilir"}, {"t": "Diş tedavisinden önce antibiyotik verilir"}, {"t": "İşlemden sonra antiviral tedavi verilir"}, {"t": "Herhangi bir önlem gerekmez"}], "a": 2, "exp": "Slayta göre **romatizmal ateşe bağlı kalp hastalığı olan kişilerde diş tedavisinden önce antibiyotik gerekir** (profilaksi). Romatizmal ateş, S. pyogenes farenjitinin süpüratif olmayan (otoimmün) komplikasyonudur ve farenjit ilk 10 gün içinde tedavi edilmezse gelişir.\nYanlış şıklar:\n• BCG aşısı → tüberküloza karşı aşıdır; diş işlemiyle ilgisi yok.\n• Yalnızca ağrı kesici → slayttaki önlem antibiyotiktir.\n• İşlemden sonra antiviral → etken bakteriyeldir ve önlem işlemden **önce** alınır.\n• Herhangi bir önlem gerekmez → slayt bunu açıkça gerektirir.\n💡 Akılda kalsın: \"Romatizmal kalp + diş = önce antibiyotik\".", "org": ["spyogenes"], "shuf": true}, {"q": "Kızıl hangi bakterinin hastalıkları arasında sayılır?", "opts": [{"t": "Staphylococcus aureus"}, {"t": "Corynebacterium diphtheriae"}, {"t": "Streptococcus pyogenes"}, {"t": "Neisseria meningitidis"}, {"t": "Listeria monocytogenes"}], "a": 2, "exp": "Slaytta **kızıl**, S. pyogenes'in hastalıkları arasında sayılır (farenjit, kızıl, piyoderma, erizipel, selülit, nekrotizan fasiit, streptokokal TŞS, romatizmal ateş, akut glomerülonefrit). S. pyogenes'in toksini streptokokal pirojenik ekzotoksindir.\nYanlış şıklar:\n• S. aureus → impetigo, follikülit, fronkül-karbonkül, osteomiyelit, gıda zehirlenmesi, haşlanmış deri, TŞS.\n• Corynebacterium diphtheriae → respiratuvar ve kutanöz difteri.\n• N. meningitidis → menenjit, meningokoksemi, pnömoni.\n• Listeria monocytogenes → yenidoğan hastalığı, bakteriyemi, menenjit, gastroenterit.\n💡 Akılda kalsın: Döküntülü boğaz enfeksiyonu (kızıl) = Grup A streptokok.", "org": ["spyogenes"], "shuf": true}, {"q": "Aşağıdaki etken – hastalık eşleştirmelerinden hangisi **yanlıştır**?", "opts": [{"t": "Staphylococcus aureus – Osteomiyelit"}, {"t": "Streptococcus pyogenes – Romatizmal ateş"}, {"t": "Bacillus cereus – Gastroenterit"}, {"t": "Bacillus anthracis – Deri şarbonu"}, {"t": "Enterococcus faecalis – Kızıl"}], "a": 4, "exp": "**Kızıl**, slayta göre **S. pyogenes** hastalığıdır; Enterococcus faecalis'in hastalıkları ise üriner sistem enfeksiyonu, peritonit, bakteriyemi ve endokardittir. Bu yüzden \"E. faecalis – Kızıl\" eşleşmesi yanlıştır.\nDiğer eşleşmeler slayta göre doğrudur:\n• S. aureus – Osteomiyelit → piyojenik hastalıkları arasında.\n• S. pyogenes – Romatizmal ateş → süpüratif olmayan (otoimmün) hastalığı.\n• Bacillus cereus – Gastroenterit → enterotoksin ısıya dirençli suşta kusma, duyarlı suşta ishal.\n• Bacillus anthracis – Deri şarbonu → deri, bağırsak ve akciğer şarbonu yapar.\n💡 Akılda kalsın: Enterokok = \"İdrar – Karın (peritonit) – Kan – Kalp\".", "org": ["saureus", "spyogenes", "enterococcus", "cereus", "anthracis"], "shuf": true, "tag": "Pekiştirme", "html": true}, {"q": "Slayta göre nekrotizan fasiit hangi Gram pozitif kokun hastalıkları arasında sayılır?", "opts": [{"t": "Staphylococcus aureus"}, {"t": "Streptococcus pyogenes (grup A)"}, {"t": "Streptococcus pneumoniae"}, {"t": "Bacillus cereus"}, {"t": "Enterococcus faecalis"}], "a": 1, "exp": "Slaytta **nekrotizan fasiit**, S. pyogenes'in süpüratif hastalıkları arasındadır; klinik sendromlar tablosunda da nekrotizan selülit ve fasiitin ilk etkeni **S. pyogenes (grup A)**'dır (ardından Clostridium perfringens ve B. fragilis). Ağır tablolarda slayttaki tedavi IV penisilin + klindamisindir.\nYanlış şıklar:\n• S. aureus → fronkül-karbonkül, follikülit, impetigo, osteomiyelit; tabloda nekrotizan fasiit için yazılmamış.\n• S. pneumoniae → pnömoni, menenjit, sinüzit, otitis media, fulminan sepsis.\n• Bacillus cereus → Gram pozitif **basil**; gastroenterit, travmatik göz enfeksiyonu.\n• Enterococcus faecalis → ÜSE, peritonit, bakteriyemi, endokardit.\n💡 Akılda kalsın: \"Eti yiyen bakteri\" (nekrotizan fasiit) = Grup A streptokok.", "org": ["spyogenes"], "shuf": true, "tag": "Pekiştirme"}, {"q": "S. pyogenes'in bulaş yolları ve risk grubu hangisinde doğru verilmiştir?", "opts": [{"t": "Damlacık, artropod vektör ve hasarlı cildin kontaminasyonu; 2–5 ve 5–15 yaş hijyeni zayıf çocuklar risklidir"}, {"t": "Yalnızca çiğ süt; çiftçiler risklidir"}, {"t": "Transplasental yol; yenidoğanlar risklidir"}, {"t": "Yalnızca cinsel yol; erişkinler risklidir"}, {"t": "Yalnızca kene ısırığı; avcılar risklidir"}], "a": 0, "exp": "Slayta göre S. pyogenes **damlacık ile, artropod vektör ile ve hasarlı cildin kontaminasyonu ile** yayılır. Risk altındakiler: **2–5 yaş ve 5–15 yaş hijyeni zayıf çocuklar** ile farenjit, yumuşak doku enfeksiyonu veya toksik şok sendromu olan kişiler. Farenjit ve yumuşak doku enfeksiyonları M proteini ile oluşturulur.\nYanlış şıklar (başka bakterilerin bulaş özelliği):\n• Yalnızca çiğ süt; çiftçiler → Brucella (çiğ süt ve süt ürünleri, hayvan teması).\n• Transplasental yol; yenidoğanlar → Listeria monocytogenes.\n• Yalnızca cinsel yol; erişkinler → N. gonorrhoeae.\n• Yalnızca kene ısırığı; avcılar → Francisella tularensis (kene ısırığı ve enfekte doku).\n💡 Akılda kalsın: S. pyogenes = \"Damlacık + deri\"; risk okul çağı çocuk.", "org": ["spyogenes"], "shuf": true}, {"q": "Slayta göre bakteriyel farenjitin asıl sorumlusu olan ve tedavisinde ilk sırada penisilin V kullanılan bakteri hangisidir?", "opts": [{"t": "Streptococcus pneumoniae"}, {"t": "Streptococcus agalactiae"}, {"t": "Streptococcus pyogenes"}, {"t": "Staphylococcus aureus"}, {"t": "Enterococcus faecalis"}], "a": 2, "exp": "Slayta göre **S. pyogenes bakteriyel farenjitin asıl sorumlusudur**; klinik sendromlar tablosunda da farenjitin tek yazılı etkeni S. pyogenes (grup A)'dır. Tedavi: **Penisilin V** (alternatif sefalosporin, makrolid), amoksisilin tablet; ağır vakada IV penisilin + klindamisin. İlk 10 gün içinde tedavi başlanmazsa romatizmal ateş oluşur.\nYanlış şıklar:\n• S. pneumoniae → pnömoni, otitis media, sinüzit, menenjit; penisiline direnç gösterebilir.\n• S. agalactiae → yenidoğan hastalığı; tedavi penisilin G (+aminoglikozid).\n• S. aureus → piyojenik ve toksin kaynaklı hastalıklar; tedavide TMP-SXT, klindamisin, doksisiklin, IV vankomisin.\n• Enterococcus faecalis → nozokomiyal ÜSE, endokardit; aminoglikozid + penisilin/ampisilin/vankomisin.\n💡 Akılda kalsın: \"Boğaz + penisilin V = S. pyogenes\".", "org": ["spyogenes"], "shuf": true}, {"q": "Streptococcus agalactiae için yenidoğan riskini artıran faktörler arasında sayılmayan hangisidir?", "opts": [{"t": "Doğumun soğuk aylarda gerçekleşmesi"}, {"t": "Annede kompleman ve antikor eksikliği"}, {"t": "Uzamış ya da erken doğum"}, {"t": "Annede β-streptokok varlığı"}, {"t": "Erken membran rüptürü"}], "a": 0, "exp": "Slayttaki S. agalactiae için yenidoğan riskini artıran 4 faktör:\n1. Erken membran rüptürü\n2. Uzamış ya da erken doğum\n3. Annede β-streptokok varlığı (anneden bebeğe bulaştığı için)\n4. Annede kompleman ve antikor eksikliği\nSlayta göre S. agalactiae'nın **mevsimsel dağılımı yoktur**; bu yüzden \"doğumun soğuk aylarda gerçekleşmesi\" risk faktörü değildir.\nKarıştırma: \"Soğuk aylarda yaygın\" olan S. pneumoniae'dır; N. meningitidis de kuru ve soğuk aylarda görülür.\nDiğer dört şık slayttaki risk faktörlerinin aynısıdır.\n💡 Akılda kalsın: GBS riski = \"Erken rüptür, erken/uzun doğum, anne kolonize, annede savunma eksik\".", "org": ["sagalactiae"], "shuf": true}, {"q": "S. agalactiae'nın tedavi ve korunmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Penisilin alerjisinde gentamisin tek başına verilir"}, {"t": "Aşısı vardır"}, {"t": "Yalnızca erişkinlerde hastalık yapar"}, {"t": "Tedavide ilk seçenek kolistindir"}, {"t": "Riskli bebek için doğumdan 4 saat önce penisilin verilir"}], "a": 4, "exp": "Slayta göre S. agalactiae'da **riskli bebek için doğumdan 4 saat önce (anneye) penisilin verilir**; böylece doğum kanalından bebeğe bulaş önlenir.\nSlayttaki tedavi ve korunma: Penisilin G (+ aminoglikozid); **penisilin alerjisi varsa sefalosporin veya vankomisin**; aşı yoktur.\nYanlış şıklar:\n• Penisilin alerjisinde gentamisin tek başına → slayttaki alternatif sefalosporin/vankomisindir; aminoglikozid yalnızca penisiline eklenir.\n• Aşısı vardır → slayta göre aşı yoktur.\n• Yalnızca erişkinlerde hastalık yapar → esas olarak yenidoğan hastalığıdır; gebede endometrit/İYE, erişkinde pnömoni, eklem ve yumuşak doku enfeksiyonu da yapar.\n• İlk seçenek kolistin → kolistin, Acinetobacter baumannii'de tek etkili antibiyotiktir.\n💡 Akılda kalsın: \"GBS → doğumdan 4 saat önce penisilin\".", "org": ["sagalactiae"], "shuf": true}, {"q": "Slaytta \"yenidoğan hastalığı\" olarak tanımlanan, anneden bebeğe bulaşarak yenidoğanda menenjit, pnömoni ve sepsis yapan bakteri hangisidir?", "opts": [{"t": "Streptococcus pneumoniae"}, {"t": "Grup B streptokok (S. agalactiae)"}, {"t": "Neisseria meningitidis"}, {"t": "Enterococcus faecalis"}, {"t": "Haemophilus influenzae"}], "a": 1, "exp": "Slayttaki ilk cümle: \"S. agalactiae — **yenidoğan hastalığıdır**, anneden bebeğe bulaşır; mortalitesi ve ciddi sekel oluşturma oranı fazladır.\" Erken ve geç başlangıçlı yenidoğan hastalığı olarak pnömoni, **menenjit**, sepsis ve bakteriyemi yapar. Klinik sendromlar tablosunda menenjit etkenleri arasında ilk sırada S. agalactiae (grup B) yer alır. Kapsül ve sialik asit fagositoza karşı korur.\nYanlış şıklar:\n• S. pneumoniae → menenjit yapar ama risk grubu çocuk ve yaşlıdır; \"yenidoğan hastalığı\" olarak tanımlanmaz.\n• N. meningitidis → Gram negatif; insidansı <5 yaş, üniversite, askeriye; ilk 6 ayda bebekte immünite vardır.\n• Enterococcus faecalis → nozokomiyal ÜSE, peritonit, endokardit.\n• H. influenzae → Gram negatif kokobasil; menenjit, epiglotit; HIB aşısı ile önlenir.\n💡 Akılda kalsın: \"B grubu = Bebek\".", "org": ["sagalactiae"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Vajinal yolla doğmuş bir yenidoğanda yüksek ateş ve ense sertliği saptanıyor. Beyin omurilik sıvısının mikroskopik incelemesinde bol nötrofil ve Gram pozitif koklar görülüyor. Etken olarak öncelikle hangisi düşünülmelidir?", "opts": [{"t": "Staphylococcus aureus"}, {"t": "Listeria monocytogenes"}, {"t": "Grup B streptokoklar (S. agalactiae)"}, {"t": "Neisseria meningitidis"}, {"t": "Streptococcus pyogenes"}], "a": 2, "exp": "Vajinal doğum + yenidoğanda ateş ve ense sertliği (menenjit) + BOS'ta bol nötrofil ve **Gram pozitif kok** → **Grup B streptokok (S. agalactiae)**. Slayta göre S. agalactiae anneden bebeğe bulaşan bir yenidoğan hastalığıdır; genitoüriner sistemde asemptomatik koloni oluşturur ve yenidoğanda menenjit, pnömoni, sepsis yapar.\nYanlış şıklar:\n• S. aureus → Gram pozitif kok ama slaytta yenidoğan menenjiti etkeni olarak yer almaz (menenjit tablosunda yok).\n• Listeria monocytogenes → yenidoğan menenjiti yapar ama Gram pozitif **basildir**; ayrıca transplasental bulaşır.\n• N. meningitidis → Gram **negatif** diplokok.\n• S. pyogenes → farenjit, deri enfeksiyonları; yenidoğan menenjiti etkeni değil.\n💡 Akılda kalsın: \"Yenidoğan + BOS'ta Gram (+) kok = GBS; Gram (+) basil = Listeria\".", "org": ["sagalactiae"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Üst solunum yollarında ve genitoüriner sistemde asemptomatik koloni oluşturabilen, anneden bebeğe bulaşarak yenidoğan hastalığı yapan streptokok hangisidir?", "opts": [{"t": "Streptococcus pyogenes"}, {"t": "Streptococcus pneumoniae"}, {"t": "Streptococcus agalactiae"}, {"t": "Streptococcus anginosus"}, {"t": "Enterococcus faecalis"}], "a": 2, "exp": "Slayta göre **S. agalactiae** üst solunum yollarında (ÜSYE) ve genitoüriner sistemde **asemptomatik koloni** oluşturabilir ve **anneden bebeğe** bulaşarak yenidoğan hastalığı yapar. Bu nedenle annede β-streptokok varlığı yenidoğan için risk faktörüdür ve riskli bebek için doğumdan 4 saat önce penisilin verilir.\nYanlış şıklar:\n• S. pyogenes → damlacık, artropod ve hasarlı deriyle bulaşır; farenjit ve deri enfeksiyonları.\n• S. pneumoniae → nazofarenks ve orofarenkse yerleşir; çocuklarda yüksek kolonizasyon, pnömoni/otit/menenjit.\n• S. anginosus → biyokimyasal olarak viridanslara, hemolitik olarak β-hemolitiklere benzeyen streptokok; yenidoğan hastalığı olarak geçmez.\n• Enterococcus faecalis → GİS'e yerleşir, endojen nozokomiyal enfeksiyon yapar.\n💡 Akılda kalsın: \"Genital kolonizasyon → doğumda bebeğe → GBS\".", "org": ["sagalactiae"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Streptococcus agalactiae ile ilgili hangisi **YANLIŞTIR**?", "opts": [{"t": "Kapsül ve sialik asit fagositoza karşı korur"}, {"t": "Gebe kadınlarda endometrit ve idrar yolu enfeksiyonu yapabilir"}, {"t": "Diyabet, alkol ve kanser enfeksiyon riskini artırır"}, {"t": "Soğuk aylarda belirgin olarak artar"}, {"t": "Mortalitesi ve ciddi sekel oluşturma oranı yüksektir"}], "a": 3, "exp": "Slayta göre S. agalactiae'nın **mevsimsel dağılımı yoktur**; \"soğuk aylarda belirgin artış\" yanlıştır (soğuk aylarda yaygın olan S. pneumoniae'dır).\nDiğer şıklar slayttaki bilgilerdir:\n• Kapsül ve sialik asit fagositoza karşı korur.\n• Gebe kadınlarda endometrit ve idrar yolu enfeksiyonu yapabilir.\n• Diyabet, alkol ve kanser enfeksiyon riskini artırır (erişkinde pnömoni, eklem ve yumuşak doku enfeksiyonu).\n• Mortalitesi ve ciddi sekel oluşturma oranı yüksektir.\nEk olarak: genitoüriner enfeksiyonu olan kadınlar postpartum hastalık için risklidir; tedavi penisilin G (+aminoglikozid), aşı yoktur.\n💡 Akılda kalsın: \"GBS'nin mevsimi yok; pnömokok kışı sever\".", "org": ["sagalactiae"], "shuf": true, "html": true}, {"q": "Streptococcus pneumoniae ile ilgili hangisi **YANLIŞTIR**?", "opts": [{"t": "Pnömolizin salgılayarak epitel hücrelerini ve makrofajları yok eder"}, {"t": "Kişiden kişiye bulaşı çok sıktır ve en çok yaz aylarında görülür"}, {"t": "Mukustaki bakterilerin IgA ile inaktivasyonunu IgA proteaz ile önler"}, {"t": "Fagositoza dirençli polisakkarit kapsülünün 100 farklı serotipi tanımlanmıştır"}, {"t": "Viridans streptokoklar içinde en virülan olandır"}], "a": 1, "exp": "Slayta göre pnömokokta **bulaş nadirdir** ve hastalık **soğuk aylarda yaygındır**; \"kişiden kişiye bulaş çok sık, en çok yaz aylarında\" ifadesi iki yönden yanlıştır.\nSlayttaki diğer S. pneumoniae bilgileri (diğer şıklar doğrudur):\n• Pnömolizin salgılayarak epitel ve makrofajları yok eder.\n• Mukustaki bakterilerin IgA ile inaktivasyonu, IgA proteaz ile önlenir.\n• Fagositoza dirençli polisakkarit kapsülün 100 farklı serotipi vardır.\n• Viridanstır; viridans streptokoklar içinde en virülan olandır.\nEpidemiyoloji: nazofarenks ve orofarenkse yerleşir; çocuklarda yüksek kolonizasyon; önceden virüsle enfekte çocukta pnömoni, otitis media, sinüzit; çocuk ve yaşlı menenjit için, hematolojik hastalık ve aspleni sepsis için risklidir.\n💡 Akılda kalsın: Pnömokok = \"Kış hastalığı, nadir bulaş, yüksek kolonizasyon\".", "org": ["spneumoniae"], "shuf": true, "html": true}, {"q": "Pnömokokta fosforilkolinin görevi nedir?", "opts": [{"t": "Spor oluşumunu başlatır"}, {"t": "Transferrin ve laktoferrinden demir alır"}, {"t": "Kapsülü kalınlaştırır"}, {"t": "Penisilini parçalar"}, {"t": "Endotel, trombosit ve lökositlere bağlanarak bakteriyi hücre içine sokar"}], "a": 4, "exp": "Slayta göre pnömokokta **fosforilkolin; endotel, trombosit ve lökositlere bağlanır ve bakteriyi hücre içine sokar**. Tutunmanın ilk adımını ise yüzey proteini adezinler (epitel hücreye tutunma) sağlar.\nPnömokok virülans faktörleri özet: polisakkarit kapsül (fagositoza direnç), adezinler, fosforilkolin, IgA proteaz, pnömolizin.\nYanlış şıklar:\n• Spor oluşumunu başlatır → spor oluşturan Gram pozitifler Bacillus (ve Clostridium) türleridir; streptokoklar spor yapmaz.\n• Transferrin ve laktoferrinden demir alır → N. gonorrhoeae (demiri transferrin, laktoferrin ve hemoglobinden alır).\n• Kapsülü kalınlaştırır → slaytta böyle bir işlev yoktur.\n• Penisilini parçalar → bu β-laktamazın işidir (N. gonorrhoeae).\n💡 Akılda kalsın: \"Fosforil-kolin = kapıdan içeri sokan anahtar\".", "org": ["spneumoniae"], "shuf": true}, {"q": "Pnömokok aşılarıyla ilgili slayttaki bilgi hangisidir?", "opts": [{"t": "Yalnızca HIB aşısıyla korunulur"}, {"t": "Tek doz canlı aşı tüm yaş gruplarına uygulanır"}, {"t": "23 değerli konjuge aşı çocuklara, 13 değerli aşı erişkinlere uygulanır"}, {"t": "13 değerli konjuge aşı çocuklara, 23 değerli polivalan aşı erişkinlere uygulanır"}, {"t": "Aşısı yoktur"}], "a": 3, "exp": "Slayta göre pnömokokta **13 değerli konjuge aşı çocuklara, 23 değerli polivalan aşı erişkinlere** uygulanır. Bu konudaki Gram pozitif koklardan aşısı olan tek bakteri pnömokoktur (S. aureus ve S. agalactiae'da aşı yoktur). Aşının hedefi, 100 farklı serotipi tanımlanmış fagositoza dirençli polisakkarit kapsüldür.\nYanlış şıklar:\n• Yalnızca HIB aşısıyla korunulur → HIB aşısı H. influenzae tip b'ye karşıdır.\n• Tek doz canlı aşı tüm yaşlara → slaytta canlı aşı yok; iki farklı aşı farklı yaş gruplarına.\n• 23 değerli konjuge aşı çocuklara, 13 değerli erişkinlere → sayılar ters çevrilmiş.\n• Aşısı yoktur → polivalan aşısı mevcuttur.\n💡 Akılda kalsın: \"Küçüğe küçük sayı (13), büyüğe büyük sayı (23)\".", "org": ["spneumoniae"], "shuf": true}, {"q": "Penisiline dirençli S. pneumoniae enfeksiyonunda slayta göre hangi tedavi kullanılır?", "opts": [{"t": "Seftriakson ve vankomisin"}, {"t": "Yalnızca penisilin V"}, {"t": "Kolistin"}, {"t": "Linezolid, daptomisin, kinupristin"}, {"t": "Dapson ve klofazimin"}], "a": 0, "exp": "Slayta göre pnömokokta **penisilin dirençli ise seftriakson ve vankomisin** kullanılır; monoterapide sefalosporin veya florokinolon kullanılır. Slayt ayrıca pnömokokun penisilin, sefalosporin ve makrolidlere karşı direnç geliştirebildiğini vurgular.\nYanlış şıklar:\n• Yalnızca penisilin V → zaten penisiline direnç var; penisilin V S. pyogenes farenjitinin ilacıdır.\n• Kolistin → Acinetobacter baumannii'de tek etkili antibiyotik; Gram pozitiflere etkisizdir (dış membranları yoktur).\n• Linezolid, daptomisin, kinupristin → dirençli enterokok tedavisi.\n• Dapson ve klofazimin → lepra (M. leprae) tedavisi.\n💡 Akılda kalsın: \"Dirençli pnömokok = Seftriakson + Vankomisin\".", "org": ["spneumoniae"], "shuf": true}, {"q": "Slayta göre hematolojik hastalığı olan ya da dalağı olmayan (aspleni) kişilerde sepsis riski yüksek olan ve fulminan sepsis yapabilen Gram pozitif kok hangisidir?", "opts": [{"t": "Streptococcus pyogenes"}, {"t": "Enterococcus faecalis"}, {"t": "Streptococcus agalactiae"}, {"t": "Streptococcus pneumoniae"}, {"t": "Staphylococcus aureus"}], "a": 3, "exp": "Slayta göre pnömokokta **hematolojik hastalık ve aspleni sepsis için risktir** ve S. pneumoniae'nın hastalıkları arasında **fulminan sepsis** vardır (pnömoni, menenjit, sinüzit, otitis media ile birlikte). Dalak, kapsüllü bakterilerin temizlenmesinde önemlidir; pnömokokun fagositoza dirençli polisakkarit kapsülü bu yüzden dalaksız kişide ağır sepsise yol açar. Çocuk ve yaşlılar ise menenjit için risklidir.\nYanlış şıklar:\n• S. pyogenes → risk grubu 2–15 yaş hijyeni zayıf çocuklar; farenjit ve deri enfeksiyonları.\n• Enterococcus faecalis → risk nozokomiyal hasta ve geniş spektrumlu antibiyotik kullanımı.\n• S. agalactiae → risk yenidoğan ve gebe; erişkinde diyabet, alkol, kanser.\n• S. aureus → toplum/hastane kaynaklı; temasla bulaşır; slaytta aspleni ile ilişkilendirilmez.\n💡 Akılda kalsın: \"Dalak yoksa pnömokok fulminan seyreder\".", "org": ["spneumoniae"], "shuf": true}, {"q": "Aşağıdakilerden hangisi slaytta S. pneumoniae'nın hastalıkları arasında **sayılmaz**?", "opts": [{"t": "Pnömoni"}, {"t": "Menenjit"}, {"t": "Otitis media"}, {"t": "Romatizmal ateş"}, {"t": "Sinüzit"}], "a": 3, "exp": "**Romatizmal ateş**, S. pyogenes'in süpüratif olmayan (otoimmün) hastalığıdır; S. pneumoniae'nın hastalıkları arasında sayılmaz.\nSlayttaki S. pneumoniae hastalıkları: **pnömoni, menenjit, sinüzit, otitis media, fulminan sepsis**. Nazofarenks ve orofarenkse yerleşip akciğer, sinüsler, menink ve kulaklara yayılması bu listeyi açıklar.\nPnömoni, menenjit, otitis media ve sinüzit listede olduğu için doğrudur.\n💡 Akılda kalsın: Pnömokok \"baş-boyun-göğüs\" yapıları (sinüs, kulak, menink, akciğer) tutar; romatizmal ateş grup A streptokokun otoimmün komplikasyonudur.", "org": ["spneumoniae", "spyogenes"], "shuf": true, "html": true}, {"q": "Haemophilus influenzae, Neisseria meningitidis ve Streptococcus pneumoniae'nın slaytta belirtilen ortak virülans faktörü hangisidir?", "opts": [{"t": "M proteini"}, {"t": "Endotoksin"}, {"t": "Beta laktamaz"}, {"t": "Fagositozu engelleyen polisakkarit kapsül"}, {"t": "Pnömolizin"}], "a": 3, "exp": "Üç bakterinin de slayttaki ortak virülans faktörü **fagositozu engelleyen polisakkarit kapsüldür**:\n• S. pneumoniae → fagositoza dirençli polisakkarit kapsül, 100 farklı serotip.\n• N. meningitidis → polisakkarit kapsül fagositozu engeller.\n• H. influenzae → a-f kapsül antijenleri; en virülan serotip b; PRP yapılı kapsül antifagositik etki gösterir.\nAyrıca üçü de menenjit etkenidir ve üçünün de aşısı kapsüle yöneliktir (pnömokok aşıları, meningokok aşısı, HIB konjuge PRP aşısı).\nYanlış şıklar:\n• M proteini → yalnızca S. pyogenes'e özgü.\n• Endotoksin → Gram negatiflere aittir (meningokokta lipopoligosakkarit, H. influenzae'de lipid A); Gram pozitif pnömokokta endotoksin yoktur.\n• Beta laktamaz → slaytta N. gonorrhoeae'nın penisilin direnç mekanizması.\n• Pnömolizin → yalnızca pnömokoka ait.\n💡 Akılda kalsın: \"Menenjit üçlüsü (pnömokok, meningokok, Hib) = kapsüllü üçlü\".", "org": ["haemophilus", "meningokok", "spneumoniae"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Geniş spektrumlu sefalosporin tedavileri sırasında nozokomiyal enfeksiyonların en yaygın nedeni olan ve enfeksiyon kaynağı endojen olan bakteri hangisidir?", "opts": [{"t": "Enterococcus faecalis/faecium"}, {"t": "Staphylococcus aureus"}, {"t": "Streptococcus pneumoniae"}, {"t": "Streptococcus pyogenes"}, {"t": "Streptococcus agalactiae"}], "a": 0, "exp": "Slayta göre **Enterococcus faecalis/faecium**, **geniş spektrumlu sefalosporin tedavilerinde nozokomiyal enfeksiyonların en yaygın nedenidir**; antibiyotik direnci tedaviyi zorlaştırır. Epidemiyoloji: GİS'e yerleşir, geniş spektrumlu antibiyotik (GSA) kullanımı ile mukozaya yayılır, **enfeksiyon kaynağı endojendir**, nozokomiyal hastalarda sık görülür. Sefalosporinler enterokokları öldürmediği için, bu ilaçlar florayı baskılarken enterokoklar seçilip çoğalır.\nYanlış şıklar:\n• S. aureus → kişiden kişiye, yüzey/giysi/çarşaf temasıyla bulaşır (ekzojen); toplum ve hastane kaynaklı.\n• S. pneumoniae → nazofarenks kolonizasyonu; toplum kaynaklı pnömoni, otit, menenjit.\n• S. pyogenes → damlacık ve deri yoluyla bulaşır.\n• S. agalactiae → anneden bebeğe bulaşır.\n💡 Akılda kalsın: \"Sefalosporin verdin, enterokok çıktı\".", "org": ["enterococcus"], "shuf": true}, {"q": "Aşağıdakilerden hangisi slaytta enterokokların hastalıkları arasında **sayılmaz**?", "opts": [{"t": "Üriner sistem enfeksiyonu"}, {"t": "Peritonit"}, {"t": "Bakteriyemi"}, {"t": "Endokardit"}, {"t": "Kızıl"}], "a": 4, "exp": "Slayttaki enterokok hastalıkları: **üriner sistem enfeksiyonu, peritonit, bakteriyemi ve endokardit**. **Kızıl** ise S. pyogenes'in hastalığıdır; bu nedenle enterokok listesinde yer almaz.\nKlinik sendromlar tablosu da bunu destekler: peritonit (E. coli, B. fragilis, Enterococcus), prostatit ve yanık enfeksiyonları etkenleri arasında da Enterococcus geçer.\nÜriner sistem enfeksiyonu, peritonit, bakteriyemi ve endokardit slaytta sayıldığı için doğrudur.\nEnterokokların kaynağı endojen GİS florasıdır; bu yüzden idrar yolu ve karın içi enfeksiyonları ön plandadır.\n💡 Akılda kalsın: Enterokok = \"İdrar – Karın – Kan – Kalp\"; kızıl = grup A streptokok.", "org": ["enterococcus", "spyogenes"], "shuf": true, "html": true}, {"q": "Enterokok enfeksiyonlarında direnç varsa kullanılabilecek ilaçlar hangileridir?", "opts": [{"t": "Kolistin, metronidazol"}, {"t": "Dapson, klofazimin"}, {"t": "İzoniazid, rifampin"}, {"t": "Linezolid, daptomisin, kinupristin"}, {"t": "Penisilin V, amoksisilin"}], "a": 3, "exp": "Slayta göre enterokok tedavisinde temel rejim **aminoglikozid + (penisilin / ampisilin / vankomisin)** kombinasyonudur; **direnç varsa linezolid, daptomisin, kinupristin** kullanılır. Enfeksiyona göre antibiyotik ayarlanmalı ve direnç gelişmesinden kaçınılmalıdır. Antibiyotik tablosuna göre linezolid Enterococcus'a etkilidir; kinupristin-dalfopristin ise E. faecium'a etkili, **E. faecalis'e etkisizdir**.\nYanlış şıklar:\n• Kolistin, metronidazol → kolistin Gram negatiflere (Acinetobacter), metronidazol anaeroplara etkilidir.\n• Dapson, klofazimin → lepra tedavisi.\n• İzoniazid, rifampin → tüberküloz tedavisi.\n• Penisilin V, amoksisilin → S. pyogenes tablet tedavisi.\n💡 Akılda kalsın: \"Dirençli enterokok = L-D-K (Linezolid, Daptomisin, Kinupristin)\".", "org": ["enterococcus"], "shuf": true}, {"q": "Slayttaki antibiyotik tablosuna göre glikopeptid antibiyotik (vankomisin) aşağıdaki bakterilerden hangisinin çoğuna karşı etkisizdir?", "opts": [{"t": "Staphylococcus aureus"}, {"t": "Streptococcus pyogenes"}, {"t": "Streptococcus pneumoniae"}, {"t": "Koagülaz-negatif stafilokoklar"}, {"t": "Enterococcus faecalis"}], "a": 4, "exp": "Slayttaki antibiyotik tablosuna göre glikopeptid **vankomisin; tüm stafilokok ve streptokoklara etkilidir, ancak enterokokların çoğuna, Gram pozitif basillere ve tüm Gram negatiflere karşı etkisizdir**. Bu, enterokokların antibiyotik direncinin tedaviyi zorlaştırdığı bilgisiyle uyumludur; direnç varsa linezolid, daptomisin, kinupristin seçilir.\nYanlış şıklar (hepsi vankomisine duyarlı gruplarda):\n• S. aureus → stafilokok; slaytta S. aureus tedavisinde IV vankomisin geçer (MRSA dahil).\n• S. pyogenes → streptokok.\n• S. pneumoniae → streptokok; penisiline dirençli suşta seftriakson + vankomisin.\n• Koagülaz-negatif stafilokoklar → stafilokok.\n💡 Akılda kalsın: \"Vankomisin: Stafilo ✓, Strepto ✓, Entero ✗\".", "org": ["enterococcus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "6 aylık bir bebek acil servise iştahsızlık ve irritabilite nedeniyle getiriliyor. Fizik muayenede deride yaygın eritem dikkat çekiyor; lezyonlara dokunulduğunda derinin kolaylıkla ayrıldığı gözleniyor. Bu kliniğin patogenezinden temel olarak sorumlu mekanizma hangisidir?", "opts": [{"t": "Mikrobiyal deri invazyonu"}, {"t": "Mast hücre degranülasyonu"}, {"t": "T hücre aracılı hasar"}, {"t": "Ekzotoksin kaynaklı deri hasarı"}, {"t": "Endotoksin aracılı hasar"}], "a": 3, "exp": "📖 Kitap: Tablo **haşlanmış deri sendromu**dur (Ritter hastalığı). Bir stafilokokal toksin olan **eksfoliyatif toksine** bağlı gelişir. Lokalize perioral eritemle başlar, iki gün içinde yaygınlaşır; geniş büller ve kutanöz kabarıklıklarla karakterizedir. Lezyondan örnek alındığında kültür negatif çıkar — yani deri hasarını bakterinin kendisi değil, uzaktan etki eden toksin yapar.\n📑 Slaytta: S. aureus'un **eksfoliyatif toksini** A ve B türlerini üretir ve **cildin soyulmasına neden olur**; haşlanmış deri sendromu slaytta \"**toksin kaynaklı hastalıklar**\" grubundadır (gıda zehirlenmesi ve toksik şok sendromu ile birlikte). Eksfoliyatif toksin bakterinin salgıladığı bir **ekzotoksindir**.\nYanlış şıklar:\n• Mikrobiyal deri invazyonu → impetigo, follikülit, fronkül gibi piyojenik hastalıkların mekanizması; haşlanmış deride soyulmayı toksin yapar.\n• Mast hücre degranülasyonu ve T hücre aracılı hasar → bağışıklık reaksiyonlarıdır; slayttaki mekanizma toksindir.\n• Endotoksin aracılı hasar → endotoksin (lipopolisakkarit) Gram **negatiflere** aittir; S. aureus Gram pozitiftir.\n💡 Akılda kalsın: \"Dokununca soyulan deri = eksfoliyatif ekzotoksin\".", "org": ["saureus"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdakilerden hangisi, enterokoklarda in vitro etkili görünse bile tedavide kullanılmaması gereken antibiyotiklerden biridir?", "opts": [{"t": "Eritromisin"}, {"t": "Seftriakson"}, {"t": "Kloramfenikol"}, {"t": "Gatifloksasin"}, {"t": "Tetrasiklin"}], "a": 1, "exp": "📖 Kitap: Enterokoklar **sefalosporinlere** ve sülfonamidlere **doğal dirençlidir**. Sefalosporin direncinin nedeni, enterokok PBP'lerinin (penisilin bağlayan proteinler) sefalosporinlerle yapısal uyumsuzluk göstermesidir. Enterokoklar folik asidi dışarıdan hazır alıp kullanabildikleri için sülfonamidlere de doğal dirençlidir. Bu nedenle laboratuvarda duyarlı çıksa bile sefalosporinler enterokok tedavisinde kullanılmaz.\n📑 Slaytta: Enterococcus faecalis/faecium, **geniş spektrumlu sefalosporin tedavilerinde nozokomiyal enfeksiyonların en yaygın nedenidir** — yani sefalosporinler enterokoku öldürmez, aksine floradaki diğer bakterileri baskılayıp enterokokun seçilmesine yol açar. Antibiyotik tablosunda **seftriakson geniş spektrumlu sefalosporinler** grubundadır. Slayttaki enterokok tedavisi: aminoglikozid + (penisilin/ampisilin/vankomisin); direnç varsa linezolid, daptomisin, kinupristin.\nDiğer şıklar (eritromisin, kloramfenikol, gatifloksasin, tetrasiklin) slaytta enterokokun doğal direnç gösterdiği ilaç grubu olarak geçmez; sorunun hedefi sefalosporin grubudur.\n💡 Akılda kalsın: \"Enterokok + sefalosporin = asla\".", "org": ["enterococcus"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Streptokokların sınıflaması amacıyla kullanılan yöntem aşağıdakilerden hangisidir?", "opts": [{"t": "Hücre duvarı grup spesifik antijeni"}, {"t": "Biyokimyasal testler"}, {"t": "Hemolitik özellikler"}, {"t": "Kapsül şişme deneyi"}, {"t": "Hepsi"}], "a": 4, "exp": "📖 Kitap: Şıklardaki bütün yöntemler streptokokların gruplandırılmasında kullanılır. Kapsül şişme deneyi, pnömokokların ve grup B streptokokların sınıflandırılmasında kullanılır.\n📑 Slaytta: Streptokoklar **kanlı agardaki hemolizlerine, serolojiye ve biyokimyaya göre** sınıflandırılır.\n• Hemolitik özellikler → α (kısmi), β (tam), γ (hiç) hemoliz; ör. S. pneumoniae viridanstır, S. pyogenes ve S. agalactiae β-hemolitiktir.\n• Seroloji → hücre duvarı grup antijenleri (grup A = S. pyogenes, grup B = S. agalactiae) ve kapsül antijenleri (pnömokok kapsülünün 100 farklı serotipi) serolojik yöntemlerle belirlenir; kapsül şişme deneyi de kapsül antijenine dayanan serolojik bir yöntemdir.\n• Biyokimya → ör. S. anginosus biyokimyasal olarak viridanslara, hemolitik olarak β-hemolitiklere benzer.\nBu yüzden tek bir şık değil, \"Hepsi\" doğrudur.\n💡 Akılda kalsın: Streptokok sınıflaması = \"Hemoliz + Seroloji + Biyokimya\".", "org": ["spyogenes", "sagalactiae", "spneumoniae"], "shuf": false, "tag": "Feyyaz Akay"}, {"q": "Streptococcus pyogenes'in hiyalüronik asit yapıdaki kapsülü ile ilgili hangi ifade **yanlıştır**?", "opts": [{"t": "Kapsüle sahip alt tipler kültürde mukoid koloniler oluşturur"}, {"t": "İnsan epitel hücrelerindeki CD44 reseptörlerine bağlanır"}, {"t": "Bu komponentinden aşısı geliştirilmiştir"}, {"t": "Bakterinin immün sistemden kamufle olmasını sağlar"}, {"t": "Hiçbiri"}], "a": 2, "exp": "📖 Kitap: S. pyogenes kapsülü hiyalüronik asit yapıda olduğu için **immün sistemi uyarmaz**. Sonuç olarak aşı için uygun bir hedef değildir ve bakteriyi immün sistemden korur (kamufle eder). Kapsülün insan epitel hücrelerindeki reseptörü CD44'tür. Kapsüllü bakteriler tipik olarak mukoid koloniler oluşturur.\n📑 Slaytta: S. pyogenes'in \"**hiyalüronik asitten yapılmış immünojenik olmayan kapsülü**\" vardır. İmmünojenik olmayan bir yapıya karşı koruyucu antikor oluşturulamayacağı için ondan aşı geliştirilemez; slaytta S. pyogenes için aşıdan söz edilmez (bu konuda aşısı olan Gram pozitif kok yalnızca pnömokoktur).\n\"İmmün sistemden kamufle olma\" ifadesi slayttaki \"immünojenik olmayan kapsül\" bilgisiyle uyumludur. Mukoid koloni ve CD44 bilgileri kitaptan gelen doğru ifadelerdir.\nKarşılaştır: pnömokokun polisakkarit kapsülü (100 serotip) aşı hedefidir; S. pyogenes'in hiyalüronik kapsülü değildir.\n💡 Akılda kalsın: \"Hiyalüronik kapsül = görünmezlik pelerini → aşı yok\".", "org": ["spyogenes"], "shuf": false, "tag": "Feyyaz Akay", "html": true}]}, {"title": "Neisseria: Gonokok ve Meningokok", "desc": "İki Neisseria'nın virülans faktörleri, epidemiyolojisi, tedavi ve aşı farkları", "short": "Neisseria", "questions": [{"q": "Slayta göre \"tek gerçek Gram negatif koklar\" olarak tanımlanan cins hangisidir?", "opts": [{"t": "Haemophilus"}, {"t": "Moraxella"}, {"t": "Kingella"}, {"t": "Brucella"}, {"t": "Neisseria"}], "a": 4, "exp": "**Doğru cevap: Neisseria.** Slayttaki tanım: \"Tek gerçek Gram negatif koklar Neisseria'dır.\"\n\"Aerobik Gram Negatif Koklar ve Kokobasiller\" bölümünde Neisseria, Eikenella, Kingella, Moraxella, Haemophilus, Pasteurella, Acinetobacter, Bordetella, Francisella ve Brucella birlikte işlenir; ama bunlardan yalnızca Neisseria \"gerçek\" Gram negatif kok olarak tanımlanır.\nCinsin iki önemli türü vardır: **N. gonorrhoeae** (gonore/bel soğukluğu, cinsel yolla bulaşır) ve **N. meningitidis** (menenjit, meningokoksemi; solunum yoluyla bulaşır).\n\nYanlış şıklar:\n• Haemophilus → aynı bölümde işlenen kokobasil; menenjit, epiglotit, selülit ve artrit yapar.\n• Moraxella → Neisseria ile **karıştırılır**, fakat \"tek gerçek kok\" tanımı ona ait değildir; bronşit, sinüzit, otit yapar.\n• Kingella → ağız florasında bulunan fırsatçı; septik artrit ve subakut endokardit yapar.\n• Brucella → çok küçük, hücre içi bakteri; bruselloz (dalgalı ateş) etkenidir.\n\n💡 Akılda kalsın: Bölüm \"koklar VE kokobasiller\"dir; \"gerçek kok\" denince yalnız Neisseria.", "org": ["gonokok", "meningokok"], "shuf": true}, {"q": "Neisseria gonorrhoeae ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "Adı Albert Neisser'e ithafen ve \"tohumların akımı\" (pürülan eksüda) anlamından gelir"}, {"t": "Kültürde nem ve karbondioksite ihtiyaç duyar"}, {"t": "İnsan dışında uzun süre canlı kalabilir"}, {"t": "Düşük ısıya dayanıksızdır"}, {"t": "Cinsel yolla bulaşan hastalıklar içinde en sık görülenidir"}], "a": 2, "exp": "**Yanlış olan ifade: \"İnsan dışında uzun süre canlı kalabilir.\"** Slayta göre gonokok **insan dışında canlı kalamaz** ve **tek konağı insandır**. Bu yüzden bulaş ancak doğrudan cinsel temasla olur.\nGonokok \"nazlı\" bir bakteridir: düşük ısıya dayanıksızdır ve kültürde nem ile karbondioksite gereksinim duyar. Bu özellikler, bakterinin vücut dışında neden hızla öldüğünü de açıklar.\n\nDiğer şıklar slayttaki doğru bilgilerdir:\n• Ad → Albert Neisser'e ithafen; \"gonore\" = \"tohumların akımı\", pürülan eksüdaya verilen isimdir.\n• Nem + CO₂ ihtiyacı → slaytta kültür özelliği olarak geçer.\n• Düşük ısıya dayanıksızlık → slayttaki ifade.\n• CYBH içinde en sık görülen → slayt: \"CYBH içinde en sık görülenidir\"; 2019'da ABD'de 600 binden fazla bildirimle 2. hastalık olmuştur.\n\n💡 Akılda kalsın: Gonokok = tek konak insan + insan dışında yaşayamaz + aşısı yok.", "org": ["gonokok"], "shuf": true, "html": true}, {"q": "N. gonorrhoeae'de nötrofillerin fagozom füzyonunu önleyen yapı hangisidir?", "opts": [{"t": "Porin"}, {"t": "Lipopolisakkarit"}, {"t": "Opasite proteini"}, {"t": "Pilin"}, {"t": "Beta-laktamaz"}], "a": 0, "exp": "**Doğru cevap: Porin.** Slayt: \"Porin nötrofillerin fagozom füzyonunu önler.\" Böylece nötrofil gonokoku yutsa bile onu öldürecek fagolizozom oluşamaz ve bakteri hücre içinde canlı kalabilir; bu, gonorede bol nötrofilli pürülan akıntıya rağmen enfeksiyonun sürmesine katkı yapar.\n\nSlayttaki gonokok virülans faktörlerinin tamamı (her biri ayrı bir göreve sahip):\n• **Pilin** → ağız boşluğu ve vajinaya tutunma\n• **Opasite proteini** → hücreye tutunma\n• **Porin** → fagozom füzyonunu önleme\n• **Lipopolisakkarit** → endotoksin\n• **Beta-laktamaz** → penisilin direnci\n• Demir → transferrin, laktoferrin ve hemoglobinden alınır\n\nYanlış şıklar: Lipopolisakkarit endotoksin etkisi, opasite proteini ve pilin tutunma, beta-laktamaz penisilin direnci sağlar; hiçbiri fagozom füzyonunu engellemez.\n\n💡 Akılda kalsın: \"**Por**in → fagozomun kapısını kapatır.\"", "org": ["gonokok"], "shuf": true}, {"q": "Gonokokta penisilin direncini sağlayan yapı hangisidir?", "opts": [{"t": "Lipopolisakkarit"}, {"t": "Beta-laktamaz enzimi"}, {"t": "Polisakkarit kapsül"}, {"t": "Pilin"}, {"t": "Porin"}], "a": 1, "exp": "**Doğru cevap: Beta-laktamaz enzimi.** Slayt: \"Beta laktamaz enzimi penisilin direnci sağlar.\" Beta-laktamaz, penisilinin beta-laktam halkasını parçalayarak ilacı etkisiz bırakır. Bu nedenle slaytta gonore tedavisi penisilinle değil **seftriakson ve azitromisin** ile verilir.\n\nYanlış şıklar:\n• Lipopolisakkarit → gonokokun hücre duvarında endotoksin üretir.\n• Polisakkarit kapsül → slaytta **meningokokun** fagositozu engelleyen yapısıdır; gonokok için sayılmaz.\n• Pilin → ağız boşluğu ve vajinaya tutunmayı sağlar.\n• Porin → nötrofillerde fagozom füzyonunu önler.\n\n💡 Akılda kalsın: Gonokok penisilini beta-laktamazla yıkar → tedavi seftriakson + azitromisin.", "org": ["gonokok"], "shuf": true}, {"q": "Gonokok epidemiyolojisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Damlacık yoluyla bulaşır"}, {"t": "Kompleman eksikliği riski azaltır"}, {"t": "Hayvanlar rezervuardır"}, {"t": "Septik artritin en sık görülen nedenidir"}, {"t": "Erkeklerde asemptomatik taşıyıcılık daha sıktır"}], "a": 3, "exp": "**Doğru cevap: Septik artritin en sık görülen nedenidir.** Slaytta gonokok epidemiyolojisinde açıkça bu ifade yer alır. Gonokok yalnız genital enfeksiyonla sınırlı kalmayıp dissemine olabilir (slaytta \"dissemine enfeksiyon\" hastalıklar arasında sayılır); eklemlere yerleşerek septik artrit yapar.\n\nSlayttaki gonokok epidemiyolojisi: bulaş cinsel yolla; tek konak insan; kadınlarda asemptomatik taşıyıcılık; insidans erkeklerde, 15–24 yaşta, siyahlarda ve cinsel ilişki sıklığı yüksek olanlarda fazla; dünyada yılda 100 milyon vaka; risk kompleman ve komponent eksikliğinde yüksek.\n\nYanlış şıklar:\n• Damlacık yoluyla → hayır, bulaş **cinsel yolla**dır (damlacık/aerosol meningokokun bulaş yoludur).\n• Kompleman eksikliği riski azaltır → tersine, kompleman ve komponent eksikliğinde risk **yüksektir**.\n• Hayvanlar rezervuardır → hayır, **tek konak insandır**.\n• Erkeklerde asemptomatik taşıyıcılık → slayta göre asemptomatik taşıyıcılık **kadınlarda** görülür.\n\n💡 Akılda kalsın: Genç erişkinde septik artrit → önce gonokoku düşün.", "org": ["gonokok"], "shuf": true}, {"q": "Yenidoğanda gonokokal oftalmia neonatorum profilaksisinde slayta göre ne kullanılır?", "opts": [{"t": "Kolistin göz damlası"}, {"t": "Canlı aşı"}, {"t": "%1'lik gümüş nitrat (AgNO₃)"}, {"t": "Rifampisin şurup"}, {"t": "Gentamisin"}], "a": 2, "exp": "**Doğru cevap: %1'lik gümüş nitrat (AgNO₃).** Slayta göre yenidoğanda profilakside %1'lik AgNO₃ kullanılır.\nOftalmia neonatorum, doğum sırasında enfekte doğum kanalından geçen bebeğin gözünün gonokokla enfekte olmasıdır. Slaytta gonokokun hastalıkları **gonore, dissemine enfeksiyon ve oftalmia neonatorum** olarak sayılır. Annede asemptomatik taşıyıcılık (slayt: kadınlarda sık) bebeğe bulaş riskini açıklar.\n\nYanlış şıklar:\n• Kolistin → slaytta **Acinetobacter baumannii**'nin \"tek etkili antibiyotiği\"dir.\n• Canlı aşı → gonokokun **aşısı yoktur**; \"canlı aşısı var ama insanda kullanılmaz\" ifadesi tularemiye aittir.\n• Rifampisin → **meningokok** temaslılarının profilaksisinde kullanılır.\n• Gentamisin → **tularemi** tedavisidir (brusellozda da eklenebilir).\n\n💡 Akılda kalsın: Yenidoğan gözü + gonokok → %1 AgNO₃.", "org": ["gonokok"], "shuf": true}, {"q": "Gonore tedavisi ve korunmasıyla ilgili hangisi **yanlıştır**?", "opts": [{"t": "Etkili bir aşısı vardır"}, {"t": "Kadınlarda anormal vajinal akıntı ve pelvik ağrı, her iki cinsiyette idrarda ağrı ve yanma yapar"}, {"t": "Seftriakson ve azitromisin kullanılır"}, {"t": "Kondom ve hasta eğitimi korunmada önemlidir"}, {"t": "Kısırlığa neden olabilir"}], "a": 0, "exp": "**Yanlış olan ifade: \"Etkili bir aşısı vardır.\"** Slayta göre gonokokun **aşısı yoktur**; korunma **kondom ve hasta eğitimi** ile sağlanır. (Neisseria'lardan aşısı olan meningokoktur.)\n\nDiğer şıklar slayttaki doğru bilgilerdir:\n• Klinik (bel soğukluğu) → kadınlarda anormal vajinal akıntı ve pelvik ağrı; erkeklerde penisten akıntı; her iki cinsiyette idrar sırasında ağrı ve yanma.\n• Tedavi → seftriakson ve azitromisin (penisilin, beta-laktamaz nedeniyle kullanılmaz).\n• Korunma → kondom ve hasta eğitimi.\n• Komplikasyon → kısırlığa neden olur.\n\n💡 Akılda kalsın: Meningokok = aşı VAR; gonokok = aşı YOK.", "org": ["gonokok"], "shuf": true, "html": true}, {"q": "Neisseria meningitidis'in fagositozu engelleyen yapısı hangisidir?", "opts": [{"t": "Pnömolizin"}, {"t": "Porin"}, {"t": "Lipooligosakkarit"}, {"t": "Pilin"}, {"t": "Polisakkarit kapsül"}], "a": 4, "exp": "**Doğru cevap: Polisakkarit kapsül.** Slayt: meningokokta \"Polisakkarit kapsül fagositozu engeller.\" Kapsül, bakterinin kanda fagositlerden kaçmasını sağlar; bu da meningokokun hızla **ağır sepsise (meningokoksemi)** dönüşebilmesini açıklar.\n\nSlayttaki meningokok virülans faktörleri:\n• **Pilin** → tutunma\n• **Polisakkarit kapsül** → fagositozu engelleme\n• **Lipooligosakkarit** (hücre duvarında) → endotoksin\n\nYanlış şıklar:\n• Pnömolizin → **pnömokokun** epitel ve makrofajları yok eden toksinidir.\n• Porin → **gonokokta** nötrofillerin fagozom füzyonunu önler (fagositozu değil, yutulduktan sonraki öldürmeyi engeller).\n• Lipooligosakkarit → meningokokta endotoksin görevi görür.\n• Pilin → tutunmayı sağlar.\n\n💡 Akılda kalsın: Kapsül meningokokta var (fagositoz engeli); gonokokta slaytta kapsül sayılmaz.", "org": ["meningokok"], "shuf": true}, {"q": "Meningokok enfeksiyonu açısından risk grupları arasında **sayılmayan** hangisidir?", "opts": [{"t": "5 yaş altı çocuklar"}, {"t": "Çiğ süt tüketenler"}, {"t": "Askerler"}, {"t": "Geç kompleman eksikliği olanlar"}, {"t": "Üniversitede (toplu yaşamda) bulunanlar"}], "a": 1, "exp": "**Sayılmayan: Çiğ süt tüketenler.** Çiğ süt ve süt ürünleri tüketimi slaytta **Brucella** için risk faktörüdür.\nSlayta göre meningokokta insidans **5 yaş altı, üniversite, askeriye, bakım evi ve geç kompleman eksikliğinde** fazladır. Ortak nokta: toplu ve kalabalık yaşam (aerosol bulaşını kolaylaştırır) ve bağışıklık zayıflığıdır. Meningokok **sadece insanda bulunur**, **solunum ve aerosollerle** bulaşır ve **kuru, soğuk aylarda** görülür.\n\nDiğer şıklar (doğru risk grupları):\n• 5 yaş altı çocuklar → slaytta \"yaş<5\".\n• Askerler → slaytta \"askeriye\".\n• Geç kompleman eksikliği → slaytta \"geç kompleman\".\n• Üniversite → slaytta \"üniversite\" (yurtta toplu yaşam).\n\n💡 Akılda kalsın: Meningokok = kalabalık + kış + kompleman eksikliği.", "org": ["meningokok"], "shuf": true, "html": true}, {"q": "Meningokokal menenjitli hastayla temas edenlere uygulanan profilaksi ilaçları hangileridir?", "opts": [{"t": "İzoniazid, etambutol"}, {"t": "Kolistin, gentamisin"}, {"t": "Penisilin, oksasilin"}, {"t": "Rifampisin, siprofloksasin, seftriakson"}, {"t": "Doksisiklin, streptomisin"}], "a": 3, "exp": "**Doğru cevap: Rifampisin, siprofloksasin, seftriakson.** Slayta göre temaslılara rifampisin, siprofloksasin veya seftriakson uygulanır. Meningokok kişiden kişiye solunum ve aerosollerle bulaştığı ve hızla ağır sepsise dönebildiği için temaslıların profilaksisi önemlidir.\nHastanın kendisinin tedavisi ise **seftriakson, sefotaksim, meropenem** ile yapılır. Ayrıca meningokokun **aşısı vardır** ve ilk 6 ay bebekte (anneden geçen) immünite bulunur.\n\nYanlış şıklar:\n• İzoniazid, etambutol → mikobakteri (tüberküloz) ilaçlarıdır.\n• Kolistin, gentamisin → kolistin Acinetobacter'in tek etkili ilacı, gentamisin tularemi tedavisidir.\n• Penisilin, oksasilin → oksasilin stafilokok ilacıdır; Pasteurella oksasiline dirençlidir.\n• Doksisiklin, streptomisin → **bruselloz** tedavisidir.\n\n💡 Akılda kalsın: Meningokok temaslısı → \"**R-S-S**\": Rifampisin, Siprofloksasin, Seftriakson.", "org": ["meningokok"], "shuf": true}, {"q": "Slayttaki gonore verileriyle ilgili hangisi doğrudur?", "opts": [{"t": "Dünyada her yıl yaklaşık 1 milyon vaka belirlenir"}, {"t": "Kadınlarda asemptomatik taşıyıcılık görülmez"}, {"t": "İnsidans kadınlarda erkeklerden fazladır"}, {"t": "İnsidans en çok 50 yaş üstünde görülür"}, {"t": "Dünyada her yıl yaklaşık 100 milyon vaka belirlenir"}], "a": 4, "exp": "**Doğru cevap: Dünyada her yıl yaklaşık 100 milyon vaka belirlenir.** Slayt: \"Dünyada her yıl 100 milyon vaka belirleniyor.\" Ayrıca gonore 2019'da ABD'de **600 binden fazla** bildirimle 2. hastalık olmuş ve CYBH içinde en sık görülendir.\n\nYanlış şıklar:\n• 1 milyon → slayttaki rakam **100 milyon**dur.\n• Kadınlarda asemptomatik taşıyıcılık görülmez → tersine, slayta göre **kadınlarda asemptomatik taşıyıcılık görülür**; bu da fark edilmeden bulaşı ve kısırlık riskini artırır.\n• Kadınlarda daha fazla → slayta göre insidans **erkeklerde** fazladır.\n• 50 yaş üstü → insidans **15–24 yaşta** fazladır (ayrıca siyahlarda ve cinsel ilişki sıklığı yüksek olanlarda).\n\n💡 Akılda kalsın: Gonore sayıları → ABD 2019: 600 bin+; dünya: 100 milyon/yıl.", "org": ["gonokok"], "shuf": true}, {"q": "VAKA: Üniversite yurdunda kalan 19 yaşında bir öğrencide kış aylarında yüksek ateş, baş ağrısı ve ense sertliğiyle seyreden menenjit tablosu gelişiyor. En olası etken hangisidir?", "opts": [{"t": "Neisseria meningitidis"}, {"t": "Moraxella catarrhalis"}, {"t": "Neisseria gonorrhoeae"}, {"t": "Kingella kingae"}, {"t": "Brucella melitensis"}], "a": 0, "exp": "**Doğru cevap: Neisseria meningitidis.** İpuçları: menenjit + üniversite (toplu yaşam) + kuru ve soğuk aylar.\nSlayta göre meningokok **sadece insanda** bulunur, **solunum ve aerosollerle** bulaşır; insidansı 5 yaş altı, **üniversite**, askeriye, bakım evi ve geç kompleman eksikliğinde fazladır; **kuru ve soğuk aylarda** görülür. Hastalıkları menenjit, meningokoksemi ve pnömonidir; ağır sepsise dönüşebilir. Tedavi seftriakson/sefotaksim/meropenem; oda arkadaşlarına rifampisin, siprofloksasin veya seftriakson profilaksisi verilir.\n\nYanlış şıklar:\n• Moraxella catarrhalis → bronşit, bronkopnömoni, sinüzit, otit yapar; menenjit etkeni olarak sayılmaz.\n• N. gonorrhoeae → cinsel yolla bulaşır; gonore, dissemine enfeksiyon, oftalmia neonatorum yapar.\n• Kingella kingae → septik artrit ve subakut endokardit.\n• Brucella melitensis → çiğ süt/hayvan teması; dalgalı ateş.\n\n💡 Akılda kalsın: \"Yurt + kış + menenjit\" = meningokok.", "org": ["meningokok"], "shuf": true}, {"q": "VAKA: 24 yaşında erkek; idrar yaparken yanma ve penisten pürülan (irinli) akıntı tarif ediyor. En olası etken hangisidir?", "opts": [{"t": "Bordetella pertussis"}, {"t": "Listeria monocytogenes"}, {"t": "Neisseria meningitidis"}, {"t": "Neisseria gonorrhoeae"}, {"t": "Haemophilus influenzae"}], "a": 3, "exp": "**Doğru cevap: Neisseria gonorrhoeae.** Penisten pürülan akıntı + idrar sırasında yanma = **gonore (bel soğukluğu)**.\nSlayta göre gonokok erkeklerde penisten gelen akıntıyla birlikte idrar sırasında ağrı ve yanma yapar (kadınlarda anormal vajinal akıntı ve pelvik ağrı). Bulaş cinsel yolladır; insidans **erkeklerde ve 15–24 yaşta** fazladır. \"Gonore\" adı da pürülan eksüdaya verilen \"tohumların akımı\" ifadesinden gelir. Tedavi **seftriakson ve azitromisin**; kısırlığa neden olabilir; aşısı yoktur.\n\nYanlış şıklar:\n• Bordetella pertussis → boğmaca (öksürük nöbetleri, ıslık sesi).\n• Listeria monocytogenes → kontamine gıdalarla bulaşan Gram pozitif basil.\n• N. meningitidis → solunum yoluyla bulaşır; menenjit, meningokoksemi.\n• Haemophilus influenzae → menenjit, epiglotit, selülit, artrit.\n\n💡 Akılda kalsın: Genç erkek + üretral pürülan akıntı + dizüri → gonokok.", "org": ["gonokok"], "shuf": true}, {"q": "Meningokok ile gonokok karşılaştırmasında hangisi doğrudur?", "opts": [{"t": "İkisinin de konağı hayvanlardır"}, {"t": "Meningokokun aşısı vardır, gonokokun aşısı yoktur"}, {"t": "Gonokokun aşısı vardır, meningokokun yoktur"}, {"t": "İkisi de yalnızca cinsel yolla bulaşır"}, {"t": "Gonokok aerosolle bulaşır"}], "a": 1, "exp": "**Doğru cevap: Meningokokun aşısı vardır, gonokokun aşısı yoktur.** Slaytta meningokok tedavi başlığında \"Aşısı vardır\", gonokok tedavi başlığında \"Aşısı yoktur\" yazar.\n\nİki Neisseria'nın slayttaki karşılaştırması:\n• Bulaş → gonokok **cinsel yolla**; meningokok **solunum ve aerosollerle**.\n• Konak → ikisinde de **yalnız insan**.\n• Kapsül → meningokokta **polisakkarit kapsül** (fagositoz engeli) var.\n• Endotoksin → gonokokta lipopolisakkarit, meningokokta lipooligosakkarit.\n• Tedavi → gonokok: seftriakson + azitromisin; meningokok: seftriakson, sefotaksim, meropenem.\n\nYanlış şıklar:\n• Konak hayvanlar → ikisinin de tek konağı insandır (hayvan rezervuarı Brucella ve Francisella'da vardır).\n• Gonokokun aşısı var → tersi doğrudur.\n• İkisi de cinsel yolla → yalnız gonokok; meningokok aerosolle bulaşır.\n• Gonokok aerosolle → aerosolle bulaşan meningokoktur.\n\n💡 Akılda kalsın: Menin**go**kok = aşı var; **Go**nokok = aşı yok.", "org": ["gonokok", "meningokok"], "shuf": true}, {"q": "Gonokok, ihtiyaç duyduğu demiri hangi konak moleküllerinden alır?", "opts": [{"t": "Porin ve pilin"}, {"t": "Lipopolisakkarit ve beta-laktamaz"}, {"t": "Transferrin, laktoferrin ve hemoglobin"}, {"t": "PRP ve lipid A"}, {"t": "Filamentöz hemaglutinin ve pertaktin"}], "a": 2, "exp": "**Doğru cevap: Transferrin, laktoferrin ve hemoglobin.** Slayt: \"Bakterinin ihtiyacı olan demir transferrin, laktoferrin ve hemoglobin ile hücreye alınır.\" Bunlar konakta demir taşıyan/bağlayan proteinlerdir; gonokok bu proteinlerden demiri koparıp kullanarak insan vücudunda çoğalabilir (zaten insan dışında yaşayamaz).\n\nYanlış şıklar:\n• Porin ve pilin → gonokokun kendi yapılarıdır (porin fagozom füzyonunu önler, pilin tutunmayı sağlar); demir kaynağı değildir.\n• Lipopolisakkarit ve beta-laktamaz → gonokokta endotoksin ve penisilin direnci.\n• PRP ve lipid A → **Haemophilus influenzae**'ye aittir (PRP kapsül; lipid A menenjiti indükler).\n• Filamentöz hemaglutinin ve pertaktin → **Bordetella pertussis**'in trakeaya bağlanma proteinleridir.\n\n💡 Akılda kalsın: Gonokok demiri konağın \"demir taşıyıcılarından\" çalar: transferrin, laktoferrin, hemoglobin.", "org": ["gonokok"], "shuf": true}, {"q": "Gonokokun opasite proteinlerinin görevi nedir?", "opts": [{"t": "Demir taşımak"}, {"t": "Penisilini parçalamak"}, {"t": "Hücreye tutunmayı sağlamak"}, {"t": "Spor oluşturmak"}, {"t": "Nötrofillerde fagozom füzyonunu önlemek"}], "a": 2, "exp": "**Doğru cevap: Hücreye tutunmayı sağlamak.** Slayt: \"Opasite hücreye tutunmayı sağlar.\" Gonokokta tutunmadan sorumlu iki yapı vardır: **pilin** (ağız boşluğu ve vajinaya tutunma) ve **opasite proteini** (hücreye tutunma).\n\nYanlış şıklar:\n• Demir taşımak → demir konağın transferrin, laktoferrin ve hemoglobininden alınır.\n• Penisilini parçalamak → bu görev **beta-laktamaz** enzimine aittir.\n• Spor oluşturmak → slayta göre spor yalnız **Gram pozitif** bakterilerde (ör. Bacillus) oluşur; Neisseria spor yapmaz.\n• Fagozom füzyonunu önlemek → bu görev **porin**e aittir.\n\n💡 Akılda kalsın: Gonokokta \"tutunma ikilisi\" = pilin + opasite.", "org": ["gonokok"], "shuf": true}, {"q": "Meningokokta endotoksin görevi gören hücre duvarı bileşeni hangisidir?", "opts": [{"t": "Peptidoglikan"}, {"t": "Lipooligosakkarit"}, {"t": "Mikolik asit"}, {"t": "M proteini"}, {"t": "PRP"}], "a": 1, "exp": "**Doğru cevap: Lipooligosakkarit.** Slayta göre hücre duvarındaki lipooligosakkarit endotoksindir. Gram negatif bakterilerde dış zardaki bu lipid içeren yapı endotoksin etkisi gösterir; meningokokun hızla **ağır sepsise** ve meningokoksemiye dönüşmesinde rol oynar. (Gonokokta slayt bu yapıyı \"lipopolisakkarit\" olarak adlandırır.)\n\nYanlış şıklar:\n• Peptidoglikan → hücre duvarının temel iskeletidir; endotoksin olarak tanımlanmaz.\n• Mikolik asit → **mikobakterilerin** hücre duvarında bulunur, aside dirençli boyanmayı sağlar.\n• M proteini → **Streptococcus pyogenes**'in farenjit ve yumuşak doku enfeksiyonunda rol alan yapısıdır.\n• PRP → **Haemophilus influenzae** kapsülünün riboz-ribitol-fosfat yapısıdır.\n\n💡 Akılda kalsın: Meningokok üçlüsü = pilin (tutunma) + kapsül (fagositoz engeli) + lipooligosakkarit (endotoksin).", "org": ["meningokok"], "shuf": true}, {"q": "Meningokok tedavi ve korunmasıyla ilgili hangisi **yanlıştır**?", "opts": [{"t": "Tedavide seftriakson, sefotaksim ve meropenem kullanılır"}, {"t": "Temaslılara rifampisin, siprofloksasin veya seftriakson verilir"}, {"t": "İlk 6 ay bebekte immünite olur"}, {"t": "Aşısı yoktur"}, {"t": "Hastalık ağır sepsise dönüşebilir"}], "a": 3, "exp": "**Yanlış olan ifade: \"Aşısı yoktur.\"** Slayta göre meningokokun **aşısı vardır**; aşısı olmayan Neisseria **gonokok**tur.\n\nDiğer şıklar slayttaki doğru bilgilerdir:\n• Tedavi → seftriakson, sefotaksim, meropenem.\n• Temaslı profilaksisi → rifampisin (slaytta \"Rifamisin\"), siprofloksasin, seftriakson.\n• İlk 6 ay → bebekte immünite olur (bu yüzden risk özellikle 6 ay–5 yaş arasında artar; slayt: insidans 5 yaş altında fazla).\n• Ağır sepsis → slayt: meningokok \"ağır sepsise dönüşür\"; hastalıkları menenjit, meningokoksemi ve pnömonidir.\n\n💡 Akılda kalsın: Meningokok: tedavi 3'lü (seftriakson, sefotaksim, meropenem), profilaksi 3'lü (rifampisin, siprofloksasin, seftriakson), aşı VAR.", "org": ["meningokok"], "shuf": true, "html": true}, {"q": "Meningokokun slaytta sayılan hastalıkları arasında **olmayan** hangisidir?", "opts": [{"t": "Menenjit"}, {"t": "Meningokoksemi"}, {"t": "Pnömoni"}, {"t": "Oftalmia neonatorum"}, {"t": "Ağır sepsis"}], "a": 3, "exp": "**Olmayan: Oftalmia neonatorum.** Bu, **gonokokun** hastalığıdır (gonore ve dissemine enfeksiyonla birlikte sayılır); yenidoğanda %1'lik AgNO₃ ile önlenir.\nSlaytta meningokokun hastalıkları **menenjit, meningokoksemi ve pnömoni** olarak sayılır; ayrıca \"ağır sepsise dönüşür\" ve \"meninkslerin inflamasyonu olur\" ifadeleri yer alır.\n\nDiğer şıklar (meningokok için doğru):\n• Menenjit → meninkslerin inflamasyonu; meningokok kişiden kişiye bulaşıcı menenjit etkenidir.\n• Meningokoksemi → kanda meningokok yayılımı.\n• Pnömoni → slaytta sayılan üçüncü hastalık.\n• Ağır sepsis → slayt: \"Ağır sepsise dönüşür.\"\n\n💡 Akılda kalsın: Göz + yenidoğan = gonokok; meninks + kan = meningokok.", "org": ["gonokok", "meningokok"], "shuf": true, "html": true}, {"q": "Pilini olan bir Neisseria gonorrhoeae mutasyonla pilinini kaybediyor. Bu mutasyonun sonucunda en çok hangisi beklenir?", "opts": [{"t": "Ağız boşluğu ve vajina mukozasına tutunması bozulur"}, {"t": "Bakteri Gram pozitif boyanır"}, {"t": "Penisiline direnç kazanır"}, {"t": "Endotoksin üretimi durur"}, {"t": "Polisakkarit kapsül oluşturur"}], "a": 0, "exp": "**Doğru cevap: Ağız boşluğu ve vajina mukozasına tutunması bozulur.** Slayt: \"Pilin, ağız boşluğu ve vajinaya tutunmayı sağlar.\" Tutunamayan bakteri mukozada kolonize olamaz; bu da enfeksiyon başlatma yeteneğini azaltır.\n\nYanlış şıklar:\n• Gram pozitif boyanma → Gram boyanma hücre duvarı yapısına bağlıdır; pilin kaybı bakteriyi Gram pozitif yapmaz. Neisseria tek gerçek Gram negatif koktur.\n• Penisiline direnç → direnç **beta-laktamaz** enzimiyle ilgilidir; pilinle ilişkisi yoktur.\n• Endotoksin üretiminin durması → endotoksin **lipopolisakkarit**ten kaynaklanır; pilin kaybı bunu etkilemez.\n• Polisakkarit kapsül oluşturma → kapsül slaytta **meningokokun** yapısıdır; pilin kaybı kapsül oluşturmaz.\n\n💡 Akılda kalsın: Pilin = \"yapışma çengeli\"; gider ise bakteri tutunamaz.", "org": ["gonokok"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Meningokoksik menenjitli bir hastanın beyin omurilik sıvısının Gram boyamasında hangisi gözlenir?", "opts": [{"t": "Gram pozitif kok"}, {"t": "Gram pozitif basil"}, {"t": "Gram negatif kok"}, {"t": "Gram negatif basil"}, {"t": "Aside dirençli basil"}], "a": 2, "exp": "**Doğru cevap: Gram negatif kok.** Slayt: \"Tek gerçek Gram negatif koklar Neisseria'dır.\" N. meningitidis bu cinstendir; bu yüzden BOS'ta Gram negatif koklar görülür. Tipik görünüm, karşılıklı yüzleri düzleşmiş, kahve çekirdeğine benzeyen diplokoklardır.\n\nYanlış şıklar:\n• Gram pozitif kok → stafilokoklar, streptokoklar (ör. S. pneumoniae, S. agalactiae) ve enterokoklar.\n• Gram pozitif basil → Bacillus, Listeria ve Corynebacterium (slaytta \"Aerobik Gram Pozitif Basiller\").\n• Gram negatif basil → menenjit tablosunda E. coli gibi basiller (slayttaki SSS tablosunda yer alır); meningokok basil değil koktur.\n• Aside dirençli basil → mikobakteriler (hücre duvarındaki mikolik asit sayesinde).\n\n💡 Akılda kalsın: BOS'ta Gram negatif kok = Neisseria meningitidis.", "org": ["meningokok"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Kültürde üreyebilmesi için genellikle hasta başında ekim yapılması gereken bakteri aşağıdakilerden hangisidir?", "opts": [{"t": "Mycobacterium tuberculosis"}, {"t": "Listeria monocytogenes"}, {"t": "Haemophilus influenzae"}, {"t": "Neisseria gonorrhoeae"}, {"t": "Streptococcus pyogenes"}], "a": 3, "exp": "📖 Kitap: Neisseria gonorrhoeae, güneş ışığına aşırı derecede hassas olduğu için örnek alındıktan sonra bekletilmeden hasta başında ekim yapılmalıdır.\n\n📑 Slaytta: Gonokok **insan dışında canlı kalamaz**, **düşük ısıya dayanıksızdır** ve kültürde **nem ve karbondioksite** gereksinim duyar. Yani vücuttan çıkan bakteri çok çabuk ölür; bu yüzden örnek bekletilmeden ekilmelidir.\nYanlış şıklar:\n• Mycobacterium tuberculosis → slaytta \"insan dışında canlı kalamaz / düşük ısıya dayanıksız\" şeklinde tanımlanan bir bakteri değildir.\n• Listeria monocytogenes → tam tersine **buzdolabında ve yüksek tuzda** yaşayabilir; çok dayanıklıdır.\n• Haemophilus influenzae → slaytta \"kan kültüründe ürer\" bilgisi vardır; hasta başı ekim zorunluluğu verilmez.\n• Streptococcus pyogenes → slayttaki Gram pozitif koklar yüzeylerde (çarşaf, kapı kolu) uzun süre canlı kalabilir.\n\n💡 Akılda kalsın: \"İnsan dışında yaşayamayan\" bakteri = hasta başında ekim → gonokok.", "org": ["gonokok"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Baş ağrısı, bulantı-kusması olan 18 yaşındaki hastada BOS beyaz küresi 3000/mm³ bulunuyor. BOS yaymasının Gram yöntemiyle boyanmasında Gram negatif diplokoklar görülüyor. Bu tablodan sorumlu olabilecek en olası etken hangisidir?", "opts": [{"t": "Haemophilus influenzae"}, {"t": "Streptococcus pneumoniae"}, {"t": "Neisseria meningitidis"}, {"t": "Pseudomonas aeruginosa"}, {"t": "Cryptococcus neoformans"}], "a": 2, "exp": "📖 Kitap: Bakteriyel menenjit tablosunda BOS'ta Gram negatif diplokoklar görülmesi meningokoku düşündürür. Bakteriyel menenjitte BOS'ta glukoz azalır, protein artar.\n\n📑 Slaytta: **Tek gerçek Gram negatif koklar Neisseria'dır**; menenjit yapan Neisseria türü **N. meningitidis**'tir (menenjit, meningokoksemi, pnömoni). Genç erişkin yaş grubu da uygundur: slayta göre insidans üniversite ve askeriye gibi toplu yaşamda fazladır.\nYanlış şıklar:\n• Haemophilus influenzae → menenjit yapar ama bir **kokobasildir**; Gram negatif kok değildir.\n• Streptococcus pneumoniae → menenjit etkenidir ama **Gram pozitif** koktur.\n• Pseudomonas aeruginosa → Gram negatif **basildir**.\n• Cryptococcus neoformans → bakteri değil, bir mantardır.\n\n💡 Akılda kalsın: Menenjit + BOS'ta Gram negatif (diplo)kok = meningokok.", "org": ["meningokok"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Neisseria gonorrhoeae'nin enfeksiyon oluşturmasında rol oynayan en önemli virülans faktörü aşağıdakilerden hangisidir?", "opts": [{"t": "Kapsül"}, {"t": "Flajella"}, {"t": "Ekzotoksin"}, {"t": "Pili"}, {"t": "Koagülaz"}], "a": 3, "exp": "📖 Kitap: Üropatojen E. coli ve gonokoklar için en önemli virülans faktörü pilidir. Gonokokta pilus adezyondan sorumludur; pilisi olmayan gonokoklarda adezyonu Opa proteini sağlar.\n\n📑 Slaytta: Gonokokta **pilin, ağız boşluğu ve vajinaya tutunmayı** sağlar; tutunmadan enfeksiyon başlayamaz. Şıklardan slaytta gonokok için sayılan tek yapı pilidir.\nYanlış şıklar:\n• Kapsül → slaytta **meningokokun** (polisakkarit kapsül) ve Haemophilus'un yapısıdır; gonokok için sayılmaz.\n• Flajella → slaytta gonokok virülans faktörleri arasında yoktur.\n• Ekzotoksin → gonokokta slaytta sayılan toksik yapı **lipopolisakkarit (endotoksin)**tir, ekzotoksin değil.\n• Koagülaz → **Staphylococcus aureus**'un enzimidir.\n\n💡 Akılda kalsın: Gonokok = pili ile yapış, porin ile fagozomdan kaç, beta-laktamaz ile penisilini yık.", "org": ["gonokok"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdakilerden hangisi Neisseria gonorrhoeae'nin patojenitesine katkıda **bulunmaz**?", "opts": [{"t": "Lipopolisakkarit"}, {"t": "Por (porin) proteinleri"}, {"t": "Opasite proteini"}, {"t": "Kapsül"}, {"t": "Pili"}], "
