a": 3, "exp": "📖 Kitap: Meningokok ve gonokok her ikisi de IgA proteaza sahiptir; ancak meningokokun kapsülü varken **gonokokun kapsülü yoktur**. Gonokok için en önemli virülans faktörü pilidir.\n\n📑 Slaytta: Gonokokun virülans faktörleri **pilin** (ağız boşluğu ve vajinaya tutunma), **porin** (fagozom füzyonunu önleme), **opasite** (hücreye tutunma), **lipopolisakkarit** (endotoksin) ve **beta-laktamaz** (penisilin direnci) olarak sayılır. Polisakkarit kapsül ise slaytta yalnız **meningokokta** (fagositozu engeller) geçer.\nDiğer şıklar gonokokun slayttaki virülans faktörleridir: lipopolisakkarit → endotoksin; porin → fagozom füzyonunu önler; opasite → hücreye tutunma; pili → mukozaya tutunma.\n(Not: Kitaptaki \"IgA1 proteaz\" şıkkı slaytta gonokok için geçmediğinden \"Opasite proteini\" ile değiştirildi; kitap gonokokun dış zar yapısını \"lipooligosakkarit\", slayt \"lipopolisakkarit\" olarak adlandırır.)\n\n💡 Akılda kalsın: Kapsül = meningokok; gonokokta kapsül yok.", "org": ["gonokok", "meningokok"], "shuf": true, "tag": "Feyyaz Akay", "html": true}, {"q": "33 yaşında kadın hasta sarı renkli genital akıntı nedeniyle başvuruyor. Örneğin mikroskobik incelemesinde makrofaj içinde ve dışında kahve çekirdeği şeklinde Gram negatif diplokoklar görülüyor. Bu kliniğe bağlı en korkulan komplikasyon aşağıdakilerden hangisidir?", "opts": [{"t": "Endometriyal hiperplazi"}, {"t": "Over kanseri"}, {"t": "Polikistik over sendromu"}, {"t": "İnfertilite"}, {"t": "Komplet mol"}], "a": 3, "exp": "📖 Kitap: Cinsel yolla bulaşan hastalık + hücre içi ve dışı kahve çekirdeği şeklinde Gram negatif diplokoklar (oksidaz pozitif) gonokoku gösterir. Gonore sırasında oluşan yoğun fibrotik skar dokusu nedeniyle infertilite ve ektopik gebelik gelişebilir.\n\n📑 Slaytta: Gram negatif (diplo)kok = **Neisseria**; cinsel yolla bulaşan ve kadında anormal vajinal akıntı ile pelvik ağrı yapan tür **N. gonorrhoeae**'dir. Slayt tedavi başlığında açıkça \"**Kısırlığa neden olur**\" der. Kadınlarda asemptomatik taşıyıcılık sık olduğundan enfeksiyon fark edilmeden ilerleyip kısırlığa yol açabilir.\nYanlış şıklar: Endometriyal hiperplazi, over kanseri, polikistik over sendromu ve komplet mol gonokok enfeksiyonunun komplikasyonu olarak slaytta (ve kitapta) geçmez; bunlar enfeksiyon dışı jinekolojik durumlardır.\n\n💡 Akılda kalsın: Gonore → kısırlık (slayttaki tek komplikasyon vurgusu).", "org": ["gonokok"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdaki mikroorganizmalardan hangisi ürettiği Opa (opasite) proteinleri ile konak epiteline yapışmaktadır?", "opts": [{"t": "Neisseria meningitidis"}, {"t": "Neisseria gonorrhoeae"}, {"t": "Corynebacterium diphtheriae"}, {"t": "Mycobacterium tuberculosis"}, {"t": "Staphylococcus aureus"}], "a": 1, "exp": "📖 Kitap: Gonokoklarda pilus adezyondan sorumludur; pilisi olmayan gonokoklarda adezyondan sorumlu olan Opa proteinidir.\n\n📑 Slaytta: Gonokok başlığında \"**Opasite hücreye tutunmayı sağlar**\" yazar; ayrıca **pilin** ağız boşluğu ve vajinaya tutunmayı sağlar.\nYanlış şıklar:\n• Neisseria meningitidis → slaytta tutunma için **pilin**, fagositoz engeli için polisakkarit kapsül sayılır; opasite proteini meningokok için geçmez.\n• Corynebacterium diphtheriae → slaytta etkisini **difteri toksini** (uzama faktörü-2'yi inhibe eder) ile gösterir.\n• Mycobacterium tuberculosis → hücre duvarındaki **mikolik asit** ile aside dirençli boyanır; Opa proteini yoktur.\n• Staphylococcus aureus → Gram pozitif koktur; Opa proteini Neisseria'ya özgüdür.\n\n💡 Akılda kalsın: \"Opa\" = gonokokun ikinci yapışma aracı (birincisi pili).", "org": ["gonokok"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Neisseria meningitidis, hiçbir semptom olmaksızın hangi özelliği ile nazofarenkste kolonize olabilir?", "opts": [{"t": "Koagülaz"}, {"t": "Kollajenaz"}, {"t": "Hiyalüronidaz"}, {"t": "Pili"}, {"t": "Porin proteinleri"}], "a": 3, "exp": "📖 Kitap: Meningokoklar, pilileri aracılığıyla asemptomatik bir şekilde nazofarinkste kolonize olabilir.\n\n📑 Slaytta: Meningokok başlığında \"**Pilin tutunmayı sağlar**\" yazar. Kolonizasyonun ilk şartı mukozaya tutunmaktır. Meningokok solunum ve aerosollerle bulaşır; burun-boğazda tutunan bakteri buradan yayılarak menenjit ve meningokoksemi yapabilir.\nYanlış şıklar:\n• Koagülaz, kollajenaz, hiyalüronidaz → slaytta meningokokun virülans faktörleri arasında yer almaz (koagülaz stafilokok enzimidir).\n• Porin proteinleri → slaytta **gonokokta** nötrofillerin fagozom füzyonunu önleyen yapıdır; tutunma görevi değildir.\n\n💡 Akılda kalsın: Meningokok = pilin (tutun) + kapsül (fagositozdan kaç) + lipooligosakkarit (endotoksin).", "org": ["meningokok"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Streptococcus pneumoniae, Haemophilus influenzae ve Neisseria meningitidis'in ortak virülans faktörü aşağıdakilerden hangisidir?", "opts": [{"t": "Endotoksin"}, {"t": "Beta-laktamaz"}, {"t": "Kapsül"}, {"t": "Hemolizin"}, {"t": "M proteini"}], "a": 2, "exp": "📖 Kitap: Pnömokok, meningokok ve Hib'in ortak özellikleri: kapsül, IgA proteaz ve nazofarenks kolonizasyonu.\n\n📑 Slaytta: Üç bakterinin de **fagositoza dirençli polisakkarit kapsülü** vardır:\n• Pnömokok → \"Fagositoza dirençli polisakkarit kapsülün 100 farklı serotipi tanımlanmıştır.\"\n• Meningokok → \"Polisakkarit kapsül fagositozu engeller.\"\n• H. influenzae → \"Polisakkarit kapsül ile antifagositik etki gösterir\"; a–f kapsül antijenleri, en virülanı tip b.\nYanlış şıklar:\n• Endotoksin → meningokokta lipooligosakkarit, Haemophilus'ta lipid A vardır; ama pnömokok **Gram pozitif** olduğu için endotoksini yoktur, ortak değildir.\n• Beta-laktamaz → slaytta **gonokokta** penisilin direncinden sorumludur.\n• Hemolizin → slaytta Bordetella'nın adenilat siklaz/hemolizin toksini olarak geçer; ortak değildir.\n• M proteini → **Streptococcus pyogenes**'in yapısıdır.\n(Not: Kitaptaki \"Protein A\" şıkkı slaytta geçmediği için slayttaki \"M proteini\" ile değiştirildi.)\n\n💡 Akılda kalsın: Kapsüllü menenjit üçlüsü = pnömokok + meningokok + Hib; üçünün de aşısı slaytta vardır.", "org": ["meningokok", "haemophilus", "spneumoniae"], "shuf": true, "tag": "Feyyaz Akay"}]}, {"title": "Solunum Yolu Kokobasilleri", "desc": "Moraxella catarrhalis, Haemophilus influenzae (Hib) ve Bordetella pertussis (boğmaca)", "short": "Kokobasil I", "questions": [{"q": "Diğer Gram negatif pnömonilerden balgamda bol inflamatuar hücre içermesiyle ayrılan, Neisseria ile karıştırılan bakteri hangisidir?", "opts": [{"t": "Moraxella catarrhalis"}, {"t": "Bordetella pertussis"}, {"t": "Acinetobacter baumannii"}, {"t": "Pasteurella multocida"}, {"t": "Kingella kingae"}], "a": 0, "exp": "**Doğru cevap: Moraxella catarrhalis.** Slayt: \"Diğer negatif pnömonilerden balgamdaki bol inflamatuar hücre içermesi ile ayrılır. Neisseria ile karıştırılır.\"\nAdını tanımlayan **Morax**'tan alır; \"**catarrhalis**\" adı mukus salgısı (catarrhus) için eklenmiştir. **Fırsatçı** bir patojendir ve **ağız florasında** ürer. Hastalıkları **bronşit, bronkopnömoni, sinüzit ve otit**tir. **Penisiline dirençlidir**; sefalosporin, eritromisin, tetrasiklin ve TMP-SMX ile tedavi edilir.\n\nYanlış şıklar:\n• Bordetella pertussis → boğmaca (öksürük nöbetleri ve ıslık sesi).\n• Acinetobacter baumannii → hastane ortamı; solunum cihazına bağlı hastalarda pnömoni, sepsis; florada yoktur.\n• Pasteurella multocida → hayvan ısırığı/tırmalaması sonrası selülit, lenfadenit.\n• Kingella kingae → septik artrit ve subakut endokardit.\n\n💡 Akılda kalsın: \"Catarrh\" = mukus → solunum yolu: bronşit, sinüzit, otit.", "org": ["moraxella"], "shuf": true}, {"q": "Moraxella catarrhalis tedavisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Penisiline duyarlıdır; ilk seçenek penisilin G'dir"}, {"t": "Tek etkili antibiyotik kolistindir; tedavi in vitro teste göre yapılır"}, {"t": "Gentamisinle tedavi edilir; penisilin ve sefalosporin etkisizdir"}, {"t": "Doksisiklinle tedavi edilir; gentamisin veya streptomisin eklenebilir"}, {"t": "Penisiline dirençlidir; sefalosporin, eritromisin, tetrasiklin veya TMP-SMX kullanılır"}], "a": 4, "exp": "**Doğru cevap: Penisiline dirençlidir; sefalosporin, eritromisin, tetrasiklin veya TMP-SMX kullanılır.** Slayt: \"Sefalosporin, eritromisin, tetrasiklin, trimetoprim sülfametoksazol ile tedavi edilir. Penisiline dirençlidir.\"\n\nYanlış şıklar (her biri başka bir bakterinin tedavisidir):\n• Penisiline duyarlı / penisilin G → Moraxella penisiline **dirençlidir**.\n• Kolistin tek etkili, in vitro teste göre tedavi → **Acinetobacter baumannii**.\n• Gentamisin; penisilin ve sefalosporin etkisiz → **Francisella tularensis** (tularemi).\n• Doksisiklin ± gentamisin/streptomisin → **Brucella** (bruselloz).\n\n💡 Akılda kalsın: Moraxella = \"penisilin hariç\" çoğu ilaç: sefalosporin, eritromisin, tetrasiklin, TMP-SMX.", "org": ["moraxella"], "shuf": true}, {"q": "Haemophilus influenzae ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "Polisakkarit kapsül antifagositik etki gösterir"}, {"t": "İnfluenza (grip) hastalığının gerçek etkenidir"}, {"t": "Hücre duvarındaki lipid A menenjiti indükler"}, {"t": "Kapsül antijenleri a–f arasındadır; en virülan serotip b'dir (Hib)"}, {"t": "Kapsül riboz, ribitol ve fosfat (PRP) içerir; PRP'ye karşı antikorlar koruyucudur"}], "a": 1, "exp": "**Yanlış olan ifade: \"İnfluenza (grip) hastalığının gerçek etkenidir.\"** Slayta göre influenza etkeni **olduğu düşünülmüştür**. Yani bakteri adını bu eski (yanlış) düşünceden alır; grip bir virüs hastalığıdır, H. influenzae'nin gerçek hastalıkları **menenjit, epiglotit, selülit ve artrit**tir.\n\nDiğer şıklar slayttaki doğru bilgilerdir:\n• Polisakkarit kapsül → antifagositik etki.\n• Lipid A → hücre duvarında, menenjiti indükler.\n• a–f kapsül antijenleri → en virülan serotip **b (Hib)**.\n• PRP (riboz, ribitol, fosfat) → PRP'ye karşı oluşan antikorlar koruyucudur; bu yüzden aşı **konjuge PRP**'dir.\nAyrıca: kan kültüründe ürer; ağız florasında bulunur (Hib nadirdir); risk düşük antikor, geç kompleman eksikliği ve splenektomide fazladır.\n\n💡 Akılda kalsın: Adı \"influenzae\" ama grip yapmaz; Hib menenjit/epiglotit yapar.", "org": ["haemophilus"], "shuf": true, "html": true}, {"q": "Hib enfeksiyonu açısından risk faktörleri arasında slaytta sayılan hangisidir?", "opts": [{"t": "Kedi ısırığı"}, {"t": "Solunum cihazına bağlı olmak"}, {"t": "Splenektomi"}, {"t": "Çiğ süt tüketimi"}, {"t": "Kene ısırığı"}], "a": 2, "exp": "**Doğru cevap: Splenektomi.** Slayt: Haemophilus için \"Risk; düşük antikor, geç kompleman, splenektomide fazladır.\"\nMantık: Hib **kapsüllü** bir bakteridir; kapsüllü bakterilerin temizlenmesinde antikor (PRP'ye karşı antikorlar koruyucudur), kompleman ve dalak önemlidir. Bu üçünden birinin eksikliği riski artırır.\n\nYanlış şıklar (her biri başka bakterinin risk faktörüdür):\n• Kedi ısırığı → **Pasteurella multocida** (derin bulaş nedeniyle tehlikeli).\n• Solunum cihazına bağlı olmak → **Acinetobacter baumannii**.\n• Çiğ süt tüketimi → **Brucella**.\n• Kene ısırığı → **Francisella tularensis**.\n\n💡 Akılda kalsın: Hib riski = antikor ↓ + kompleman ↓ + dalak yok.", "org": ["haemophilus"], "shuf": true}, {"q": "Hib aşısıyla ilgili slayttaki bilgi hangisidir?", "opts": [{"t": "Canlı aşısı vardır ama insanda kullanılmaz"}, {"t": "5 doz uygulanır: 2, 4, 6, 15–18. aylar ve 4–6 yaş"}, {"t": "Filamentöz hemaglutinin ve pertaktinden hazırlanır"}, {"t": "Konjuge PRP aşısıdır; ilk 6 ayda, sonra 12–15. ayda yapılır"}, {"t": "Aşısı yoktur; korunma kondom ve hasta eğitimiyle sağlanır"}], "a": 3, "exp": "**Doğru cevap: Konjuge PRP aşısıdır; ilk 6 ayda, sonra 12–15. ayda yapılır.** Slayt: \"HIB konjuge PRP ile önlenir. Çocuklara ilk 6. ayda, sonra 12–15. ayda yapılır.\" PRP, Hib kapsülünün riboz-ribitol-fosfat yapısıdır ve **PRP'ye karşı oluşan antikorlar koruyucudur**. Tedavide sefalosporinler kullanılır.\n\nYanlış şıklar (her biri başka bakteriye aittir):\n• Canlı aşısı var ama insanda kullanılmaz → **tularemi** (Francisella).\n• 5 doz (2, 4, 6, 15–18. ay ve 4–6 yaş) → **boğmaca** aşı takvimi.\n• Filamentöz hemaglutinin ve pertaktinden hazırlanır → **Bordetella pertussis** aşısı.\n• Aşısı yok; kondom ve hasta eğitimi → **gonokok**.\n\n💡 Akılda kalsın: Hib aşısı = konjuge PRP → ilk 6 ay + 12–15. ay.", "org": ["haemophilus"], "shuf": true}, {"q": "Bordetella pertussis'in trakea epiteline bağlanmasını sağlayan ve aşıların yapıldığı proteinler hangileridir?", "opts": [{"t": "PRP ve lipid A"}, {"t": "Pilin ve opasite proteini"}, {"t": "Filamentöz hemaglutinin ve pertaktin"}, {"t": "Koruyucu antijen ve letal faktör"}, {"t": "Pilin ve porin"}], "a": 2, "exp": "**Doğru cevap: Filamentöz hemaglutinin ve pertaktin.** Slayta göre bakteri, filamentöz hemaglutinin ve pertaktin proteinleriyle trakea epiteline bağlanır; aşılar bu proteinlerden yapılır.\nBakterinin adı **Bordet**'e ithafen ve **per = şiddetli, tussis = öksürük** anlamından gelir. Önce trakea epiteline tutunur, ardından toksinleriyle (pertussis toksini, adenilat siklaz/hemolizin, trakeal toksin) mukus artışı, öksürük ve epitel hasarı yapar.\n\nYanlış şıklar:\n• PRP ve lipid A → **Haemophilus influenzae** (kapsül ve menenjiti indükleyen yapı).\n• Pilin ve opasite proteini → **gonokokun** tutunma yapıları.\n• Koruyucu antijen ve letal faktör → **Bacillus anthracis** (şarbon) toksin bileşenleri.\n• Pilin ve porin → gonokok (porin fagozom füzyonunu önler).\n\n💡 Akılda kalsın: Boğmaca aşısı = bağlanma proteinleri (FHA + pertaktin).", "org": ["pertussis"], "shuf": true}, {"q": "Pertussis toksininin etki mekanizmasıyla ilgili slayttaki bilgi hangisidir?", "opts": [{"t": "DNA girazı inhibe ederek DNA replikasyonunu durdurur"}, {"t": "Uzama faktörü-2'yi inhibe ederek protein sentezini durdurur"}, {"t": "Peptidoglikan çapraz bağlarını parçalar"}, {"t": "Nötrofillerde fagozom füzyonunu önler"}, {"t": "G1alfa proteinini inhibe ederek ATP oluşumunu engeller; mukus artar ve öksürük oluşur"}], "a": 4, "exp": "**Doğru cevap: G1alfa proteinini inhibe ederek ATP oluşumunu engeller; mukus artar ve öksürük oluşur.** Slayt: \"Pertusis ve adenilat siklaz/hemolizin toksini orofaringeal epitel ve makrofajlara bağlanır. G1alfa proteinini inhibe ederek ATP oluşmasını engeller. Mukus artar ve öksürük oluşur.\" Ayrıca \"toksinler fagositozu ve monosit müdahalesini engeller.\"\n\nYanlış şıklar:\n• DNA giraz inhibisyonu → **kinolonların** (siprofloksasin, levofloksasin) etki mekanizmasıdır.\n• Uzama faktörü-2 inhibisyonu → **difteri toksini**nin mekanizmasıdır.\n• Peptidoglikan çapraz bağlarını hedeflemek → beta-laktam/glikopeptit gibi **hücre duvarı antibiyotiklerinin** hedefidir, bir toksin mekanizması değildir.\n• Fagozom füzyonunu önleme → **gonokokun poriniyle** ilgilidir.\n\nPertussis toksini ayrıca kanda belirgin lenfositoza yol açar; bu, boğmaca için tipik bir laboratuvar bulgusudur.\n💡 Akılda kalsın: Pertussis toksini → G1alfa ↓ → mukus ↑ → öksürük.", "org": ["pertussis"], "shuf": true}, {"q": "Boğmacanın klinik seyriyle ilgili doğru sıra hangisidir?", "opts": [{"t": "Öksürük nöbetleri ve ıslık sesi → soğuk algınlığı belirtileri → iyileşme"}, {"t": "Ülser → bölgesel lenfadenopati → pnömoni"}, {"t": "Soğuk algınlığı belirtileri → komplikasyonlar → öksürük nöbetleri ve ıslık sesi"}, {"t": "Soğuk algınlığı belirtileri → tekrarlayan öksürük nöbetleri ve ıslık sesi → nöbetlerde azalma ve komplikasyonlar"}, {"t": "Ateş ve döküntü → öksürük nöbetleri → ense sertliği"}], "a": 3, "exp": "**Doğru cevap: Soğuk algınlığı belirtileri → tekrarlayan öksürük nöbetleri ve ıslık sesi → nöbetlerde azalma ve komplikasyonlar.** Slayttaki \"Hastalık\" başlığı tam bu üç aşamayı sırayla verir.\nİlk dönem soğuk algınlığına benzediği için hastalık fark edilmeyebilir; slayta göre özellikle 1 yaş altında şiddetli boğmaca gelişirken farkına varılmayan (hafif seyreden) kişiler **rezervuar** olur.\n\nYanlış şıklar:\n• Öksürük nöbetleri önce, soğuk algınlığı sonra → sıra ters; soğuk algınlığı dönemi **önce** gelir.\n• Ülser → lenfadenopati → pnömoni → **ülseroglandüler tularemiyi** çağrıştırır.\n• Komplikasyonlar öksürük nöbetlerinden önce → yanlış; komplikasyonlar **son** dönemde, nöbetler azalırken çıkar.\n• Ateş ve döküntü → ense sertliği → menenjit tablosunu çağrıştırır; boğmacanın slayttaki seyri değildir.\n\n💡 Akılda kalsın: Boğmaca 3 perde: \"nezle → nöbet + ıslık → azalma + komplikasyon\".", "org": ["pertussis"], "shuf": true}, {"q": "Boğmaca tedavisi ve aşı takvimiyle ilgili hangisi doğrudur?", "opts": [{"t": "Gentamisinle tedavi edilir; canlı aşısı var ama insanda kullanılmaz"}, {"t": "Makrolidle (azitromisin/klaritromisin) tedavi edilir; aşı 5 doz: 2, 4, 6, 15–18. aylar ve 4–6 yaş"}, {"t": "Doksisiklinle tedavi edilir; aşısı yoktur"}, {"t": "Makrolidle tedavi edilir; aşı 2 doz: ilk 6 ay ve 12–15. ay"}, {"t": "Kolistinle tedavi edilir; aşı tek dozdur"}], "a": 1, "exp": "**Doğru cevap: Makrolid (azitromisin/klaritromisin); aşı 5 doz (2, 4, 6, 15–18. aylar ve 4–6 yaş).** Slayta göre tedavi makrolidlerle (azitromisin/klaritromisin) yapılır; aşı 5 doz (2, 4, 6, 15–18. aylar ve 4–6 yaş) uygulanır. Aşılar, bakterinin trakeaya bağlanmasını sağlayan **filamentöz hemaglutinin ve pertaktin** proteinlerinden yapılır.\n\nYanlış şıklar:\n• Gentamisin + \"canlı aşı var ama insanda kullanılmaz\" → **tularemi**.\n• Doksisiklin → **bruselloz** tedavisi; ayrıca boğmacanın aşısı vardır.\n• Makrolid ama \"2 doz: ilk 6 ay + 12–15. ay\" → tedavi doğru, takvim **Hib aşısına** aittir. Dikkat: yarısı doğru şık tuzağı!\n• Kolistin → **Acinetobacter**; aşı tek doz değildir.\n\n💡 Akılda kalsın: Boğmaca = makrolid + 5 doz (2-4-6 ay, 15–18 ay, 4–6 yaş).", "org": ["pertussis"], "shuf": true}, {"q": "Bordetella pertussis epidemiyolojisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Rezervuar hayvanlardır; insan rastlantısal konaktır"}, {"t": "Kene ısırığı ve enfekte dokularla bulaşır"}, {"t": "İnsan tek konaktır ve kişiden kişiye aerosollerle bulaşır"}, {"t": "Aşılı kişilerde risk daha yüksektir"}, {"t": "Yalnızca belirli coğrafi bölgelerde görülür"}], "a": 2, "exp": "**Doğru cevap: İnsan tek konaktır ve kişiden kişiye aerosollerle bulaşır.** Slayttaki epidemiyoloji: \"İnsan tek konaktır. Dünya genelinde yaygındır. Risk aşılanmadığında yüksektir. Kişiden kişiye aerosollerle bulaşır.\"\nEk olarak: 1 yaş altı çocuklarda şiddetli boğmaca gelişirken, hastalığın farkına varmayan kişiler rezervuar olur; bu yüzden eliminasyonda **aşı ve subklinik takip** önemlidir.\n\nYanlış şıklar:\n• Hayvan rezervuarı / insan rastlantısal konak → **Brucella** ve **Francisella**'nın özelliği.\n• Kene ısırığı ve enfekte dokular → **Francisella tularensis**'in bulaş yolu.\n• Aşılı kişilerde risk yüksek → tersine, risk **aşılanmadığında** yüksektir.\n• Belirli bölgeler → slayta göre **dünya genelinde yaygındır**.\n\n💡 Akılda kalsın: Boğmaca = yalnız insan + aerosol + aşısızlık riski.", "org": ["pertussis"], "shuf": true}, {"q": "VAKA: Aşıları eksik 3 yaşında bir çocuk; yüksek ateş, yutamama ve hızla ilerleyen solunum sıkıntısıyla getiriliyor; epiglotit düşünülüyor. En olası etken hangisidir?", "opts": [{"t": "Haemophilus influenzae tip b (Hib)"}, {"t": "Bacillus cereus"}, {"t": "Corynebacterium diphtheriae"}, {"t": "Bordetella pertussis"}, {"t": "Moraxella catarrhalis"}], "a": 0, "exp": "**Doğru cevap: Haemophilus influenzae tip b (Hib).** Slaytta Haemophilus'un hastalıkları **menenjit, epiglotit, selülit ve artrit** olarak sayılır. En virülan serotip **b**'dir ve Hib **konjuge PRP aşısıyla** (ilk 6 ay + 12–15. ay) önlenir; aşıların eksik olması bu yüzden önemli bir ipucudur. Tedavide sefalosporinler kullanılır.\n\nYanlış şıklar:\n• Bacillus cereus → gıda zehirlenmesi (gastroenterit), travmatik göz enfeksiyonu.\n• Corynebacterium diphtheriae → difteri; toksini uzama faktörü-2'yi inhibe eder (slaytta epiglotit etkeni olarak geçmez).\n• Bordetella pertussis → boğmaca: soğuk algınlığı sonrası öksürük nöbetleri ve ıslık sesi.\n• Moraxella catarrhalis → bronşit, bronkopnömoni, sinüzit, otit.\n\n💡 Akılda kalsın: Aşısız çocuk + epiglotit = Hib.", "org": ["haemophilus"], "shuf": true}, {"q": "VAKA: 4 aylık, aşı takvimi aksamış bebekte 2 haftadır süren öksürük var; nöbetler halinde peş peşe öksürüyor ve sonunda ıslık gibi ses çıkararak nefes alıyor. En olası etken hangisidir?", "opts": [{"t": "Neisseria meningitidis"}, {"t": "Streptococcus pneumoniae"}, {"t": "Bordetella pertussis"}, {"t": "Acinetobacter baumannii"}, {"t": "Haemophilus influenzae"}], "a": 2, "exp": "**Doğru cevap: Bordetella pertussis.** Tekrarlayan öksürük nöbetleri + ıslık sesi = **boğmaca**. Slayta göre seyir soğuk algınlığı belirtileriyle başlar, ardından tekrarlayan öksürük nöbetleri ve ıslık sesi gelir, en sonda nöbetler azalır ve komplikasyonlar çıkar. **1 yaş altı** çocuklarda şiddetli boğmaca gelişir ve risk **aşılanmadığında** yüksektir (aşı 2, 4, 6. aylarda başlar). Mukus artışı ve öksürük, pertussis ve adenilat siklaz/hemolizin toksinlerinin G1alfa'yı inhibe etmesiyle oluşur. Tedavi: makrolid (azitromisin/klaritromisin).\n\nYanlış şıklar:\n• Neisseria meningitidis → menenjit, meningokoksemi, pnömoni.\n• Streptococcus pneumoniae → pnömoni, menenjit, otit, sinüzit; nöbet tarzı öksürük + ıslık beklenmez.\n• Acinetobacter baumannii → hastane kaynaklı solunum yolu enfeksiyonları (solunum cihazı).\n• Haemophilus influenzae → menenjit, epiglotit, selülit, artrit.\n\n💡 Akılda kalsın: \"Per-tussis\" = şiddetli öksürük; ıslık sesi duyduysan boğmaca.", "org": ["pertussis"], "shuf": true}, {"q": "VAKA: Bronkopnömonili bir hastanın balgamında bol inflamatuar hücre görülüyor; izole edilen bakteri Neisseria ile karıştırılıyor ve penisiline dirençli çıkıyor. En olası etken hangisidir?", "opts": [{"t": "Haemophilus influenzae"}, {"t": "Moraxella catarrhalis"}, {"t": "Acinetobacter baumannii"}, {"t": "Neisseria meningitidis"}, {"t": "Bordetella pertussis"}], "a": 1, "exp": "**Doğru cevap: Moraxella catarrhalis.** Üç ipucu birden slayttadır: (1) diğer negatif pnömonilerden **balgamda bol inflamatuar hücre** içermesiyle ayrılır, (2) **Neisseria ile karıştırılır**, (3) **penisiline dirençlidir**. Ağız florasında üreyen fırsatçı bir patojendir; bronşit, **bronkopnömoni**, sinüzit ve otit yapar. Tedavi: sefalosporin, eritromisin, tetrasiklin, TMP-SMX.\n\nYanlış şıklar:\n• Haemophilus influenzae → menenjit, epiglotit, selülit, artrit.\n• Acinetobacter baumannii → hastane kaynaklı; kolistin tek etkili antibiyotik.\n• Neisseria meningitidis → \"karıştırılan\" değil, Neisseria'nın kendisi; menenjit etkeni.\n• Bordetella pertussis → boğmaca.\n\n💡 Akılda kalsın: \"Neisseria'ya benzer + penisiline dirençli + bol hücreli balgam\" = Moraxella.", "org": ["moraxella"], "shuf": true}, {"q": "Boğmacada ateş yükselmesinden sorumlu mekanizma slayta göre hangisidir?", "opts": [{"t": "Filamentöz hemaglutininin eritrositleri parçalaması"}, {"t": "Lipid A'nın menenjiti indüklemesi"}, {"t": "Pertaktinin trakea epiteline bağlanması"}, {"t": "Trakeal toksinin epitel hücrelerini öldürüp interlökin-1 (IL-1) salgılatması"}, {"t": "Pertussis toksininin G1alfa proteinini inhibe etmesi"}], "a": 3, "exp": "**Doğru cevap: Trakeal toksinin epitel hücrelerini öldürüp interlökin-1 salgılatması.** Slayt: \"Trakeal toksini epitel hücrelerini öldürür ve interlökin 1 salgılatarak ateş yükselmesine neden olur.\" IL-1 ateşi yükselten bir sitokindir.\n\nSlayttaki B. pertussis faktörlerinin görev dağılımı:\n• Filamentöz hemaglutinin + pertaktin → trakea epiteline bağlanma (aşı bunlardan yapılır)\n• Pertussis toksini + adenilat siklaz/hemolizin → G1alfa inhibisyonu, mukus artışı, öksürük; fagositoz ve monosit müdahalesinin engellenmesi\n• Trakeal toksin → epitel hücre ölümü + IL-1 → **ateş**\n\nYanlış şıklar:\n• FHA'nın eritrosit parçalaması → FHA bağlanma proteinidir; slaytta böyle bir görev yoktur.\n• Lipid A'nın menenjiti indüklemesi → **Haemophilus influenzae**'ye aittir.\n• Pertaktinin bağlanması → doğru bir bilgi ama ateşle değil **tutunmayla** ilgilidir.\n• G1alfa inhibisyonu → **mukus ve öksürük** mekanizmasıdır, ateş değil.\n\n💡 Akılda kalsın: Trakeal toksin = \"epitel öldür + IL-1 → ateş\".", "org": ["pertussis"], "shuf": true}, {"q": "Boğmacada mukus artışı ve öksürük oluşumundan sorumlu toksinler hangileridir?", "opts": [{"t": "Trakeal toksin ve lipid A"}, {"t": "Pertussis toksini ve adenilat siklaz/hemolizin toksini"}, {"t": "Lipooligosakkarit ve porin"}, {"t": "Pnömolizin ve IgA proteaz"}, {"t": "Filamentöz hemaglutinin ve pertaktin"}], "a": 1, "exp": "**Doğru cevap: Pertussis toksini ve adenilat siklaz/hemolizin toksini.** Slayt: bu iki toksin orofaringeal epitel ve makrofajlara bağlanır, **G1alfa proteinini inhibe ederek ATP oluşmasını engeller; mukus artar ve öksürük oluşur.** Ayrıca toksinler fagositozu ve monosit müdahalesini engeller.\n\nYanlış şıklar:\n• Trakeal toksin ve lipid A → trakeal toksin epitel hücrelerini öldürür ve IL-1 ile **ateş** yapar; lipid A **Haemophilus**'ta menenjiti indükler.\n• Lipooligosakkarit ve porin → **Neisseria**'ya aittir (meningokok endotoksini; gonokokta fagozom füzyonunu önleyen porin).\n• Pnömolizin ve IgA proteaz → **pnömokoka** aittir.\n• Filamentöz hemaglutinin ve pertaktin → B. pertussis'in **bağlanma proteinleridir**, toksin değildir.\n\n💡 Akılda kalsın: Öksürük = pertussis toksini + adenilat siklaz/hemolizin; ateş = trakeal toksin; tutunma = FHA + pertaktin.", "org": ["pertussis"], "shuf": true}, {"q": "Haemophilus influenzae'nin insanlar için en virülan serotipi hangisidir?", "opts": [{"t": "Tip a"}, {"t": "Tip b"}, {"t": "Tip c"}, {"t": "Tip d"}, {"t": "Tip e"}], "a": 1, "exp": "**Doğru cevap: Tip b.** Slayt: \"A–f kapsül antijenleri vardır. En virülan serotip b'dir (HIB).\"\nSerotipler, polisakkarit **kapsül** antijenlerine göre ayrılır. Tip b kapsülünün yapısı **riboz, ribitol ve fosfat (PRP)** içerir; PRP'ye karşı antikorlar koruyucudur ve aşı (Hib aşısı) **konjuge PRP**'den yapılır.\n\nYanlış şıklar: Tip a, c, d ve e de H. influenzae'nin kapsül antijenleridir (a–f), ama slayta göre **en virülan olan b**'dir; aşı da yalnız tip b'ye karşıdır.\n\n💡 Akılda kalsın: \"**b** = **b**elalı\" → Hib; menenjit ve epiglotit.", "org": ["haemophilus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Haemophilus influenzae'de antifagositik etki gösteren yapı hangisidir?", "opts": [{"t": "Lipid A"}, {"t": "Polisakkarit (PRP) kapsül"}, {"t": "Pilin"}, {"t": "Pertaktin"}, {"t": "Porin"}], "a": 1, "exp": "**Doğru cevap: Polisakkarit (PRP) kapsül.** Slayt: \"Polisakkarit kapsül ile antifagositik etki gösterir. Yapı riboz, ribitol ve fosfat (PRP) içerir. PRP'ye karşı oluşan antikorlar koruyucudur.\" Kapsül, bakterinin fagositlerce yutulmasını engeller; vücut bu engeli **PRP'ye karşı antikor** ile aşar. Bu nedenle düşük antikor, geç kompleman eksikliği ve splenektomi riski artırır.\n\nYanlış şıklar:\n• Lipid A → H. influenzae'nin hücre duvarında bulunur ama görevi **menenjiti indüklemek**tir.\n• Pilin → **gonokok** (ağız boşluğu ve vajinaya tutunma) ve meningokokta tutunma yapısı.\n• Pertaktin → **Bordetella pertussis**'in trakeaya bağlanma proteini.\n• Porin → **gonokokta** fagozom füzyonunu önler.\n\n💡 Akılda kalsın: Hib kapsülü = PRP = hem kalkan hem aşının hedefi.", "org": ["haemophilus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Aşağıdakilerden hangisi slayta göre Bordetella pertussis'in virülans faktörü **değildir**?", "opts": [{"t": "Pertussis toksini"}, {"t": "Adenilat siklaz/hemolizin toksini"}, {"t": "Trakeal toksin"}, {"t": "PRP kapsülü"}, {"t": "Filamentöz hemaglutinin"}], "a": 3, "exp": "**Virülans faktörü olmayan: PRP kapsülü.** PRP (riboz, ribitol, fosfat) kapsülü **Haemophilus influenzae**'nin antifagositik yapısıdır ve Hib aşısının hedefidir.\n\nSlayttaki B. pertussis virülans faktörleri (diğer şıklar):\n• Filamentöz hemaglutinin (ve pertaktin) → trakea epiteline bağlanma; aşılar bu proteinlerden yapılır.\n• Pertussis toksini ve adenilat siklaz/hemolizin toksini → G1alfa inhibisyonu, ATP oluşumunun engellenmesi, mukus artışı ve öksürük; fagositoz ve monosit müdahalesinin engellenmesi.\n• Trakeal toksin → epitel hücrelerini öldürür, IL-1 salgılatarak ateş yapar.\n\n💡 Akılda kalsın: \"PRP\" görürsen Haemophilus; \"FHA, pertaktin, trakeal toksin\" görürsen Bordetella.", "org": ["pertussis"], "shuf": true, "tag": "Pekiştirme", "html": true}, {"q": "Aşağıdakilerden hangisi slaytta Haemophilus influenzae'nin hastalıkları arasında sayılır?", "opts": [{"t": "Boğmaca"}, {"t": "Tularemi"}, {"t": "Bruselloz"}, {"t": "Epiglotit"}, {"t": "Oftalmia neonatorum"}], "a": 3, "exp": "**Doğru cevap: Epiglotit.** Slaytta Haemophilus'un hastalıkları **menenjit, epiglotit, selülit ve artrit** olarak sayılır. Slaytta ayrıca H. influenzae'nin \"kişiden kişiye bulaşıcı menenjit etkeni\" olarak (meningokokla birlikte) anıldığı görülür.\n\nYanlış şıklar:\n• Boğmaca → **Bordetella pertussis**.\n• Tularemi → **Francisella tularensis** (ülseroglandüler, okuloglandüler, pnömonik).\n• Bruselloz (dalgalı ateş) → **Brucella**.\n• Oftalmia neonatorum → **gonokok** (yenidoğanda %1 AgNO₃ ile önlenir).\n\n💡 Akılda kalsın: Hib dörtlüsü = Menenjit, Epiglotit, Selülit, Artrit (\"MESA\").", "org": ["haemophilus"], "shuf": true, "tag": "Pekiştirme"}, {"q": "Moraxella catarrhalis'in slaytta sayılan hastalıkları arasında **olmayan** hangisidir?", "opts": [{"t": "Bronşit"}, {"t": "Bronkopnömoni"}, {"t": "Sinüzit"}, {"t": "Otit"}, {"t": "Epiglotit"}], "a": 4, "exp": "**Olmayan: Epiglotit.** Epiglotit slaytta **Haemophilus influenzae**'nin hastalıkları arasında sayılır (menenjit, epiglotit, selülit, artrit).\nSlaytta M. catarrhalis'in hastalıkları **bronşit, bronkopnömoni, sinüzit ve otit**tir; yani hep solunum yolu ve komşu boşluklar (sinüs, orta kulak). Bu, adındaki \"catarrhus\" (mukus salgısı) ile de uyumludur. Ağız florasında ürer, fırsatçıdır, penisiline dirençlidir.\n\nDiğer şıklar Moraxella için doğrudur: bronşit, bronkopnömoni, sinüzit, otit. (Slayttaki \"sık rastlanan bakteriler\" tablosunda da M. catarrhalis sinüzit, otitis media ve bronşit etkenleri arasında yer alır.)\n\n💡 Akılda kalsın: Moraxella = \"BBSO\": Bronşit, Bronkopnömoni, Sinüzit, Otit.", "org": ["moraxella"], "shuf": true, "html": true}, {"q": "Normalde nazofarinks mukozasında bulunan; immün yetmezliği olanlarda akut sinüzit, otit, bronşit ve pnömonilerin gelişimine neden olan, beta-laktamaz ve DNaz üretebilen bakteri aşağıdakilerden hangisidir?", "opts": [{"t": "Acinetobacter"}, {"t": "Neisseria sicca"}, {"t": "Neisseria subflava"}, {"t": "Neisseria elongata"}, {"t": "Moraxella catarrhalis"}], "a": 4, "exp": "📖 Kitap: Gram negatif diplokok, oksidaz pozitif, yüksek oranda beta-laktamaz üreten, DNaz pozitif; akut sinüzit ve otit etkeni → Moraxella catarrhalis.\n\n📑 Slaytta: M. catarrhalis **fırsatçı** bir patojendir ve **ağız florasında** ürer; hastalıkları **bronşit, bronkopnömoni, sinüzit ve otit**tir; **penisiline dirençlidir** (beta-laktamaz üretimiyle uyumlu) ve **Neisseria ile karıştırılır**. Kökteki klinik tablo tamamen slayttaki hastalık listesiyle örtüşür.\nYanlış şıklar:\n• Acinetobacter → hastane ortamında bulunur, **florada yoktur**; solunum cihazına bağlı hastalarda pnömoni ve sepsis yapar.\n• Neisseria sicca, subflava, elongata → slaytta hastalık tablosuyla anılmayan Neisseria türleridir; kökteki sinüzit-otit-bronşit tablosu ve \"Neisseria ile karıştırılan, penisiline dirençli\" özellik Moraxella'yı gösterir.\n\n💡 Akılda kalsın: Neisseria'ya benzeyen + penisilini yıkan + sinüzit/otit/bronşit = Moraxella.", "org": ["moraxella"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Çocuklarda sinüzit, otitis media, epiglotit ve menenjit gibi klinik tablolar oluşturan ve kanlı agara V faktörü diski yerleştirilerek klinik örneklerden izole edilen bakteri aşağıdakilerden hangisidir?", "opts": [{"t": "Streptococcus pyogenes"}, {"t": "Staphylococcus aureus"}, {"t": "Bordetella pertussis"}, {"t": "Haemophilus influenzae"}, {"t": "Escherichia coli"}], "a": 3, "exp": "📖 Kitap: H. influenzae'nin üremek için hem X hem V faktörüne ihtiyacı vardır. Kanlı agarda X faktörü bulunur, ama V faktörünün açığa çıkması için eritrositlerin hemolize edilmesi gerekir. Bu nedenle ya kanlı agar daha yüksek ısıda hazırlanarak eritrositler hemolize edilir (çikolata agar) ya da kanlı agara V faktörü diski konur; alternatif olarak hemoliz S. aureus'a yaptırılır ve onun çevresinde minik H. influenzae kolonileri ürer (\"süt anneliği\" fenomeni).\n\n📑 Slaytta: Haemophilus'un hastalıkları **menenjit, epiglotit, selülit ve artrit**tir; \"sık rastlanan bakteriler\" tablosunda **H. influenzae sinüzit ve otitis media** etkenleri arasında da yer alır. Klinik tablo bu nedenle H. influenzae'yi gösterir. (V faktörü bilgisi kitaptandır, slaytta yoktur.)\nYanlış şıklar:\n• Streptococcus pyogenes → farenjit, impetigo, erizipel, selülit; epiglotit/menenjit tablosu için slaytta sayılmaz.\n• Staphylococcus aureus → deri-yumuşak doku, osteomiyelit, endokardit gibi tablolar.\n• Bordetella pertussis → boğmaca.\n• Escherichia coli → menenjit tablosunda yer alır ama sinüzit/otit/epiglotit etkeni değildir; sistit-piyelonefritin başlıca etkenidir.\n\n💡 Akılda kalsın: Çocukta sinüzit + otit + epiglotit + menenjit = H. influenzae.", "org": ["haemophilus"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Genital ülser ve inguinal lenfadenopati nedeniyle hastaneye başvuran hastanın ülserinden yapılan kültürde Gram negatif kokobasil gözlenmiştir. Üreme için X faktörüne gereksinim gösteren bu bakteri aşağıdakilerden hangisidir?", "opts": [{"t": "Gardnerella vaginalis"}, {"t": "Haemophilus ducreyi"}, {"t": "Escherichia coli"}, {"t": "Pseudomonas aeruginosa"}, {"t": "Moraxella catarrhalis"}], "a": 1, "exp": "📖 Kitap: Haemophilus ducreyi üremek için yalnız X faktörüne (hemin) ihtiyaç duyar. Ağrılı bölgesel lenf bezleriyle karakterize **şankroid**e neden olur.\n\n📑 Slaytta: \"Sık rastlanan bakteriler ve klinik sendromlar\" tablosunda **genital ülserlerin** etkenleri **Treponema pallidum ve Haemophilus ducreyi** olarak verilir. Şıklarda genital ülser etkeni olan tek bakteri H. ducreyi'dir; Gram negatif kokobasil görünümü de Haemophilus cinsine uyar.\nYanlış şıklar:\n• Gardnerella vaginalis → slayt tablosunda genital ülser etkeni olarak geçmez (vajinit etkenleri: Mycoplasma hominis, Mobiluncus, anaeroplar).\n• Escherichia coli → sistit, piyelonefrit, prostatit, menenjit, peritonit; genital ülser değil.\n• Pseudomonas aeruginosa → eksternal otit, keratit, yanık enfeksiyonu, follikülit vb.\n• Moraxella catarrhalis → bronşit, sinüzit, otit.\n\n💡 Akılda kalsın: Genital ülser tablosunda iki isim: T. pallidum ve H. ducreyi.", "org": ["haemophilus"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Akut epiglotit düşünülen bir hastada etkenin izolasyonu ve tanımlanması için en uygun klinik örnek aşağıdakilerden hangisidir?", "opts": [{"t": "Endotrakeal aspirat"}, {"t": "Kan kültürü"}, {"t": "Boğaz çalkantı suyu"}, {"t": "Boğaz sürüntüsü"}, {"t": "Nazofaringeal aspirat"}], "a": 1, "exp": "📖 Kitap: Akut epiglotitte en sık etken H. influenzae'dir ve tanısı için kan kültürü yapılmalıdır. Vaka sorusu anahtar kelimeleri: kiraz kırmızısı epiglot, grafide başparmak işareti.\n\n📑 Slaytta: Haemophilus influenzae başlığının ilk satırı \"**Kan kültüründe ürer.**\" Hastalıkları menenjit, **epiglotit**, selülit ve artrittir. Yani epiglotit etkeni olan H. influenzae, kan kültüründen izole edilebilir.\nYanlış şıklar:\n• Endotrakeal aspirat, boğaz sürüntüsü, boğaz çalkantı suyu → solunum yolu örnekleridir; kitaba göre epiglotitte tanı kan kültürüyle konur, slayt da H. influenzae için \"kan kültüründe ürer\" bilgisini verir.\n• Nazofaringeal aspirat → kitaba göre **boğmaca** (B. pertussis) tanısında kullanılan örnektir.\n\n💡 Akılda kalsın: Epiglotit → Hib → kan kültürü.", "org": ["haemophilus"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Aşağıdakilerden hangisi Bordetella pertussis'in adezinlerinden (tutunma faktörlerinden) **değildir**?", "opts": [{"t": "Pertussis toksini"}, {"t": "Adenilat siklaz/hemolizin toksini"}, {"t": "Trakeal toksin"}, {"t": "Filamentöz hemaglutinin"}, {"t": "Pertaktin"}], "a": 2, "exp": "📖 Kitap: Trakeal sitotoksin silyer hücrelerde DNA sentezini inhibe ederek onları öldürür; adezinlerden değildir.\n\n📑 Slaytta: B. pertussis **filamentöz hemaglutinin ve pertaktin** proteinleriyle trakea epiteline bağlanır; **pertussis ve adenilat siklaz/hemolizin toksini** de orofaringeal epitel ve makrofajlara **bağlanır**. **Trakeal toksin** ise bağlanma değil, **epitel hücrelerini öldürme** ve IL-1 salgılatarak **ateş** yapma göreviyle anlatılır.\nDiğer şıklar (tutunma/bağlanma ile anılanlar):\n• Filamentöz hemaglutinin ve pertaktin → trakea epiteline bağlanma; aşılar bu proteinlerden yapılır.\n• Pertussis toksini ve adenilat siklaz/hemolizin → epitel ve makrofajlara bağlanır, sonra G1alfa'yı inhibe ederek mukus ve öksürük yapar.\n(Not: Kitaptaki \"Fimbria\" şıkkı slaytta geçmediği için slaytta bağlandığı belirtilen \"adenilat siklaz/hemolizin toksini\" ile değiştirildi.)\n\n💡 Akılda kalsın: Trakeal toksin = öldürür (ve ateş yapar), yapıştırmaz.", "org": ["pertussis"], "shuf": true, "tag": "Feyyaz Akay", "html": true}, {"q": "Aşağıdakilerden hangisi zoonoz (hayvanlardan insana bulaşan hastalık etkeni) **değildir**?", "opts": [{"t": "Brucella melitensis"}, {"t": "Bordetella pertussis"}, {"t": "Bacillus anthracis"}, {"t": "Pasteurella multocida"}, {"t": "Francisella tularensis"}], "a": 1, "exp": "📖 Kitap: Bordetella pertussis yalnızca insanda hastalık etkenidir; bu yüzden zoonoz değildir.\n\n📑 Slaytta: B. pertussis için \"**İnsan tek konaktır**\" ve \"kişiden kişiye aerosollerle bulaşır\" yazar; hayvan rezervuarı yoktur.\nDiğer şıklar slayta göre hayvanlardan bulaşır:\n• Brucella melitensis → rezervuar **koyun ve keçi**; insan rastlantısal konaktır; çiğ süt ve hayvan temasıyla bulaşır.\n• Bacillus anthracis → şarbon, bakterinin **hayvandan kaza ile insana** geçmesiyle oluşur.\n• Pasteurella multocida → **hayvanların ağız florasında** bulunur, tırmalama ve ısırmayla insana geçer.\n• Francisella tularensis → rezervuar yabani memeliler, tavşanlar, keneler vb.; insan rastlantısal konaktır.\n(Not: Kitaptaki \"Leptospira interrogans\" şıkkı slaytta işlenmediği için slayttaki zoonotik bir bakteri olan Pasteurella multocida ile değiştirildi.)\n\n💡 Akılda kalsın: \"Tek konak insan\" olanlar (gonokok, meningokok, B. pertussis) zoonoz değildir.", "org": ["pertussis", "brucella", "pasteurella", "francisella", "anthracis"], "shuf": true, "tag": "Feyyaz Akay", "html": true}]}, {"title": "Isırık, Zoonoz ve Fırsatçı Gram (−)'ler", "desc": "Eikenella, Kingella, Pasteurella, Acinetobacter, Francisella (tularemi) ve Brucella", "short": "Kokobasil II", "questions": [{"q": "İnsan ısırığı yarası, subakut endokardit ve fırsatçı enfeksiyonlarla ilişkili, ağız florasında bulunan bakteri hangisidir?", "opts": [{"t": "Bordetella pertussis"}, {"t": "Pasteurella multocida"}, {"t": "Eikenella corrodens"}, {"t": "Francisella tularensis"}, {"t": "Acinetobacter baumannii"}], "a": 2, "exp": "**Doğru cevap: Eikenella corrodens.** Adı mikrobiyolog **M. Eiken**'e ithafen verilmiştir. İnsan **ağız florasında** bulunan **fırsatçı** bir patojendir ve **ısırıkla ilişkili enfeksiyon** yapar. Hastalıkları **insan ısırığı yarası, subakut endokardit ve fırsatçı enfeksiyonlar**dır. Tedavisi diğer Gram negatiflerden farklıdır: monomikrobik enfeksiyonda ampisilin, polimikrobikte amoksisilin-klavulanat, endokarditte seftriakson kullanılır. Slayttaki endokardit tablosunda Eikenella **HACEK** grubunda (Haemophilus, Aggregatibacter, Cardiobacterium, Eikenella, Kingella) yer alır.\n\nYanlış şıklar:\n• Bordetella pertussis → boğmaca; insan tek konak, aerosolle bulaş.\n• Pasteurella multocida → **hayvanların** ağız florası; kedi/köpek ısırığı ve tırmalaması.\n• Francisella tularensis → kene ısırığı ve enfekte dokularla bulaşan tularemi etkeni.\n• Acinetobacter baumannii → hastane ortamı; **florada yoktur**.\n\n💡 **Ezber ipucu:** İnsan ısırığı = Eikenella; hayvan ısırığı = Pasteurella.", "org": ["eikenella"], "shuf": true}, {"q": "Eikenella corrodens enfeksiyonlarının tedavisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Monomikrobik enfeksiyonda ampisilin, polimikrobikte amoksisilin-klavulanat kullanılır"}, {"t": "Gentamisin ilk seçenektir; penisilin ve sefalosporin etkisizdir"}, {"t": "Tek etkili antibiyotik kolistindir"}, {"t": "Doksisiklin verilir; gerekirse streptomisin eklenir"}, {"t": "Tedavide yalnızca makrolid (azitromisin/klaritromisin) kullanılır"}], "a": 0, "exp": "**Doğru cevap: Monomikrobikte ampisilin, polimikrobikte amoksisilin-klavulanat.** Slayta göre monomikrobik enfeksiyonlar ampisilin, polimikrobik enfeksiyonlar amoksisilin-klavulanat, endokardit ise seftriakson ile tedavi edilir. Isırık yaraları çoğu kez birden çok bakteri içerir (polimikrobik); bu durumda beta-laktamaz inhibitörlü amoksisilin-klavulanat tercih edilir. Slayt ayrıca Eikenella'nın \"tedavisinin diğer Gram negatiflerden farklı\" olduğunu vurgular.\n\nYanlış şıklar (her biri başka bakteriye ait):\n• Gentamisin; penisilin ve sefalosporin etkisiz → **tularemi**.\n• Kolistin tek etkili → **Acinetobacter baumannii**.\n• Doksisiklin ± streptomisin/gentamisin → **bruselloz**.\n• Yalnızca makrolid → **boğmaca** tedavisi (azitromisin/klaritromisin).\n\n💡 **Ezber ipucu:** Eikenella: tek bakteri → ampisilin; karışık → amoksisilin-klavulanat; endokardit → seftriakson.", "org": ["eikenella"], "shuf": true}, {"q": "Elizabeth King tarafından tanımlanan, sinsi klinik belirtilerle seyreden, kültürü zaman alan ve septik artrit ile subakut endokardit yapan bakteri hangisidir?", "opts": [{"t": "Brucella canis"}, {"t": "Kingella kingae"}, {"t": "Haemophilus influenzae"}, {"t": "Moraxella catarrhalis"}, {"t": "Eikenella corrodens"}], "a": 1, "exp": "**Doğru cevap: Kingella kingae.** Bakteriyi **Elizabeth King** tanımlamıştır. İnsan **ağız florasında** bulunan **fırsatçı** bir patojendir; **sinsi klinik belirtilerle** hastalık oluşturur ve **kültürü zaman alır**. Hastalıkları **septik artrit ve subakut endokardit**tir. Tedavi: makrolid, beta-laktam, tetrasiklin ve florokinolon. Endokardit tablosunda **HACEK** grubunun \"K\"sıdır.\n\nYanlış şıklar:\n• Brucella canis → rezervuarı köpek, tilki, çakal; bruselloz (dalgalı ateş).\n• Haemophilus influenzae → menenjit, epiglotit, selülit, artrit; artrit yapar ama \"Elizabeth King\", \"kültürü zaman alır\" ve \"sinsi seyir\" Kingella'ya aittir.\n• Moraxella catarrhalis → bronşit, bronkopnömoni, sinüzit, otit.\n• Eikenella corrodens → subakut endokardit yapar ama **insan ısırığı** ile ilişkilidir; adı M. Eiken'den gelir.\n\n💡 **Ezber ipucu:** **King**ella → Elizabeth **King**; sinsi artrit + yavaş kültür.", "org": ["kingella"], "shuf": true}, {"q": "Kingella kingae tedavisinde slayta göre hangi ilaç grupları kullanılır?", "opts": [{"t": "Makrolid, beta-laktam, tetrasiklin ve florokinolon"}, {"t": "Yalnızca kolistin"}, {"t": "Gentamisin ve streptomisin"}, {"t": "İzoniazid ve etambutol"}, {"t": "Yalnızca %1'lik AgNO₃"}], "a": 0, "exp": "**Doğru cevap: Makrolid, beta-laktam, tetrasiklin ve florokinolon.** Slayta göre Kingella makrolid, beta-laktam, tetrasiklin ve florokinolon ile tedavi edilir; yani geniş bir ilaç yelpazesine duyarlıdır.\n\nYanlış şıklar:\n• Yalnızca kolistin → **Acinetobacter baumannii** (slaytta \"tek etkili antibiyotik\").\n• Gentamisin ve streptomisin → **bruselloz** tedavisinde doksisikline eklenebilen ilaçlar; gentamisin ayrıca **tularemi** tedavisidir.\n• İzoniazid ve etambutol → **mikobakterilere** etkili ilaçlar (mikolik asit ve arabinogalaktan sentezini inhibe ederler).\n• %1'lik AgNO₃ → yenidoğanda **gonokokal** oftalmia profilaksisi.\n\n💡 **Ezber ipucu:** Kingella → \"4'lü serbest\": makrolid, beta-laktam, tetrasiklin, florokinolon.", "org": ["kingella"], "shuf": true}, {"q": "Hayvanların ağız florasında bulunan, tırmalama/ısırıkla insana geçen ve özellikle kedi ısırığında derin bulaş nedeniyle tehlikeli olan bakteri hangisidir?", "opts": [{"t": "Brucella canis"}, {"t": "Francisella tularensis"}, {"t": "Kingella kingae"}, {"t": "Pasteurella multocida"}, {"t": "Eikenella corrodens"}], "a": 3, "exp": "**Doğru cevap: Pasteurella multocida.** Adı **Louis Pasteur**'e ithaf edilmiştir; \"multocida\" adı birçok hayvan için öldürücü olmasını anlatır. **Hayvanların ağız florasında** bulunur ve **tırmalama, ısırma** ile insana geçer; **kedi ısırmaları daha derine bulaş nedeniyle tehlikelidir.** Hastalıkları **selülit, lenfadenit, kronik ÜSYE ve sistemik enfeksiyon**dur. Tedavi: penisilin ve geniş spektrumlu sefalosporin; **oksasiline dirençlidir**; derin ısırıklarda yara bakımı önemlidir.\n\nYanlış şıklar:\n• Brucella canis → köpek kaynaklı ama süt, idrar, doğum ürünleri ve hayvan temasıyla; ısırıkla değil.\n• Francisella tularensis → kene ısırığı ve enfekte dokularla.\n• Kingella kingae → **insan** ağız florası; septik artrit, endokardit.\n• Eikenella corrodens → **insan** ağız florası; insan ısırığı yarası.\n\n💡 **Ezber ipucu:** Kedi dişi ince ve derin → Pasteurella için en tehlikeli ısırık.", "org": ["pasteurella"], "shuf": true}, {"q": "Pasteurella multocida tedavisiyle ilgili hangisi doğrudur?", "opts": [{"t": "Penisiline dirençlidir; sefalosporin, eritromisin veya TMP-SMX kullanılır"}, {"t": "Tek etkili antibiyotik kolistindir"}, {"t": "Gentamisinle tedavi edilir; penisilin ve sefalosporin etkisizdir"}, {"t": "Doksisiklin ve streptomisin kombinasyonu kullanılır"}, {"t": "Penisilin ve geniş spektrumlu sefalosporin kullanılır; oksasiline dirençlidir"}], "a": 4, "exp": "**Doğru cevap: Penisilin ve geniş spektrumlu sefalosporin kullanılır; oksasiline dirençlidir.** Slayta göre tedavi penisilin ve geniş spektrumlu sefalosporin ile yapılır; bakteri oksasiline dirençlidir ve derin ısırıklarda yara bakımı önemlidir.\nDikkat: oksasilin de bir penisilindir (penisilinaza dirençli, stafilokoklara yönelik), ama Pasteurella **oksasiline dirençli**, **penisiline duyarlıdır**.\n\nYanlış şıklar (her biri başka bakteriye ait):\n• Penisiline dirençli; sefalosporin, eritromisin, TMP-SMX → **Moraxella catarrhalis**.\n• Kolistin tek etkili → **Acinetobacter baumannii**.\n• Gentamisin; penisilin ve sefalosporin etkisiz → **tularemi**.\n• Doksisiklin + streptomisin → **bruselloz**.\n\n💡 **Ezber ipucu:** Pasteurella = penisilin \"evet\", oksasilin \"hayır\".", "org": ["pasteurella"], "shuf": true}, {"q": "Adı \"akinetos\" (hareketsiz) kelimesinden gelen, Irak ve Afganistan çatışmalarında neredeyse tüm antibiyotiklere direnç geliştiren bakteri hangisidir?", "opts": [{"t": "Brucella melitensis"}, {"t": "Francisella tularensis"}, {"t": "Bordetella pertussis"}, {"t": "Pasteurella multocida"}, {"t": "Acinetobacter baumannii"}], "a": 4, "exp": "**Doğru cevap: Acinetobacter baumannii.** Adı Yunanca **akinetos (hareketsiz)** sözcüğünden ve mikrobiyolog **Baumann**'a ithafen gelir. **Irak ve Afganistan'daki çatışmalarda neredeyse tüm antibiyotiklere karşı direnç** geliştirmiştir; pnömoni ve ağır sepsis taşıyan askerler ülkelerinde **rezervuar** olmuştur. Hastanelerin iç ve dış ortamlarında ve nemli yüzeylerde (insan derisi) canlı kalır; florada yoktur. Tedavi in vitro teste göre yapılır; **kolistin tek etkili antibiyotiktir**.\n\nYanlış şıklar (adlarının kökeni):\n• Brucella → Bruce'a ithafen.\n• Francisella tularensis → Francis ve Kaliforniya'daki Tulare bölgesi.\n• Bordetella pertussis → Bordet; per = şiddetli, tussis = öksürük.\n• Pasteurella → Louis Pasteur.\n\n💡 **Ezber ipucu:** \"A-kinetos\" = hareketsiz; savaş yarası + çoklu direnç = Acinetobacter.", "org": ["acinetobacter"], "shuf": true}, {"q": "Acinetobacter baumannii epidemiyolojisiyle ilgili hangisi **yanlıştır**?", "opts": [{"t": "İnsan derisi gibi nemli yüzeylerde canlı kalır"}, {"t": "Normal florada bol miktarda bulunur"}, {"t": "Hastanelerin iç ve dış ortamlarında bulunur"}, {"t": "Solunum cihazına bağlı ve cerrahi yarası olanlarda risk yüksektir"}, {"t": "Geniş spektrumlu antibiyotik kullananlarda risk yüksektir"}], "a": 1, "exp": "**Yanlış olan ifade: \"Normal florada bol miktarda bulunur.\"** Slayt açıkça \"**Florada yoktur**\" der. Acinetobacter bir çevre/hastane bakterisidir; bu yönüyle ağız florasında bulunan Eikenella, Kingella, Moraxella ve Haemophilus'tan ayrılır.\n\nDiğer şıklar slayttaki doğru bilgilerdir:\n• Nemli yüzeyler (insan derisi) → canlı kalır.\n• Hastanelerin iç ve dış ortamları → bulunur.\n• Risk → **GSA (geniş spektrumlu antibiyotik) kullananlarda**, **cerrahi yarası olanlarda**, **solunum cihazına bağlı olanlarda** ve **enfekte kişiyle temasta olanlarda** fazladır.\nKorunma: yara bakımı ve solunum cihazlarının sterilizasyonuna dikkat (hastane yayılımını önlemek için).\n\n💡 **Ezber ipucu:** Acinetobacter = florada YOK, hastanede VAR.", "org": ["acinetobacter"], "shuf": true, "html": true}, {"q": "Slayta göre Acinetobacter baumannii'ye karşı tek etkili antibiyotik hangisidir?", "opts": [{"t": "Seftriakson"}, {"t": "Azitromisin"}, {"t": "Penisilin"}, {"t": "Kolistin"}, {"t": "Doksisiklin"}], "a": 3, "exp": "**Doğru cevap: Kolistin.** Slayta göre tedavi in vitro duyarlılık testine göre uygulanır ve kolistin tek etkili antibiyotiktir. Kolistin (bir polimiksin) bakterinin **dış membran geçirgenliğini bozar**; nefrotoksik olduğu için son seçenek olarak saklanır. slayttaki antibiyotik tablosuna göre birçok Gram negatife etkilidir, Gram pozitiflere ise (dış membranları olmadığından) etkisizdir. Hastane yayılımını önlemek için yara bakımı ve solunum cihazlarının sterilizasyonuna dikkat edilmelidir.\n\nYanlış şıklar (slaytta hangi bakteride geçtikleri):\n• Seftriakson → gonore, meningokok, Eikenella endokarditi.\n• Azitromisin → gonore (seftriaksonla), boğmaca.\n• Penisilin → Pasteurella; Moraxella ise penisiline dirençlidir.\n• Doksisiklin → bruselloz.\n\n💡 **Ezber ipucu:** Acinetobacter'de son kale = kolistin.", "org": ["acinetobacter"], "shuf": true}, {"q": "Adını hastalığın ilk bulunduğu Kaliforniya'daki Tulare bölgesinden alan, biyoterörizm etkeni olan hücre içi patojen hangisidir?", "opts": [{"t": "Francisella tularensis"}, {"t": "Pasteurella multocida"}, {"t": "Brucella suis"}, {"t": "Bordetella pertussis"}, {"t": "Acinetobacter baumannii"}], "a": 0, "exp": "**Doğru cevap: Francisella tularensis.** Adını **Francis**'e ve hastalığın ilk bulunduğu Kaliforniya'daki **Tulare** bölgesine ithafen alır. **Biyoterörizm etkenidir** ve **kene ısırığı ile enfekte dokular** aracılığıyla bulaşır. **Polisakkarit kapsülü** antikor aracılı fagositozu önler; **hücre içi patojendir** ve fagositoza dirençlidir. Hastalık: tularemi (tavşan ateşi) — ülseroglandüler, okuloglandüler ve pnömonik formlar. Tedavi gentamisin.\n\nYanlış şıklar:\n• Pasteurella multocida → Louis Pasteur; hayvan ısırığı.\n• Brucella suis → Bruce'a ithafen; rezervuar ren geyiği ve domuz; o da hücre içidir ama adı Tulare'den gelmez.\n• Bordetella pertussis → Bordet; boğmaca.\n• Acinetobacter baumannii → akinetos (hareketsiz) + Baumann.\n\n💡 **Ezber ipucu:** **Tula**re → **tula**remi → Francisella **tula**rensis.", "org": ["francisella"], "shuf": true}, {"q": "Francisella tularensis'te antikor aracılı fagositozu önleyen yapı hangisidir?", "opts": [{"t": "Polisakkarit kapsül"}, {"t": "Pertaktin"}, {"t": "Beta-laktamaz"}, {"t": "Opasite proteini"}, {"t": "Lipid A"}], "a": 0, "exp": "**Doğru cevap: Polisakkarit kapsül.** Slayta göre polisakkarit kapsül antikor aracılı fagositozu önler; bakteri hücre içi patojendir ve fagositoza dirençlidir. Kapsül, antikorların bakteriyi fagositlere \"işaretlemesini\" engeller; hücre içinde yaşayabilmesi de bağışıklıktan kaçmasını kolaylaştırır.\n\nYanlış şıklar:\n• Pertaktin → **Bordetella pertussis**'in trakea epiteline bağlanma proteini.\n• Beta-laktamaz → **gonokokta** penisilin direnci.\n• Opasite proteini → gonokokta hücreye tutunma.\n• Lipid A → **Haemophilus influenzae**'de menenjiti indükler.\n\n💡 **Ezber ipucu:** Polisakkarit kapsül slaytta 3 Gram negatifte fagositoz engeli: meningokok, H. influenzae, Francisella.", "org": ["francisella"], "shuf": true}, {"q": "Tularemi epidemiyolojisiyle ilgili hangisi **yanlıştır**?", "opts": [{"t": "Yabani memeliler, tavşanlar, keneler ve ısıran sinekler rezervuardır"}, {"t": "Sindirimle bulaş için çok fazla bakteri alınması gerekir"}, {"t": "İnsan tek rezervuardır"}, {"t": "Kene dışkısından bulaş için kenenin uzun süre kan emmesi gerekir"}, {"t": "İnsan rastlantısal konaktır"}], "a": 2, "exp": "**Yanlış olan ifade: \"İnsan tek rezervuardır.\"** Slayta göre tularemide **insan rastlantısal konaktır**; rezervuar **yabani memeliler, kan emen artropodlar, evcil hayvanlar, tavşanlar, kediler, keneler ve ısıran sinekler**dir.\n\nDiğer şıklar slayttaki doğru bilgilerdir:\n• Rezervuarlar → yabani memeliler, tavşanlar, keneler, ısıran sinekler (ve diğerleri).\n• Sindirimle bulaş → \"çok fazla alınması gerekir\".\n• Kene dışkısından bulaş → \"kenenin uzun süre kan emmesi gerekir\"; bu yüzden **kene hemen çıkarılmalıdır**.\n• İnsan rastlantısal konak → doğru.\nAyrıca hastalık **tüm dünyada yaygındır**; slayttaki şemaya göre Tip A karasal, Tip B sucul döngüdedir.\n\n💡 **Ezber ipucu:** Tularemi ve brusellozda insan \"kazara\" konaktır; boğmaca, gonokok ve meningokokta ise tek konak insandır.", "org": ["francisella"], "shuf": true, "html": true}, {"q": "Slaytta sayılan tularemi formları arasında **olmayan** hangisidir?", "opts": [{"t": "Ülseroglandüler tularemi"}, {"t": "Okuloglandüler tularemi"}, {"t": "Pnömonik tularemi"}, {"t": "Lepromatöz tularemi"}, {"t": "Hepsi sayılmıştır"}], "a": 3, "exp": "**Olmayan: \"Lepromatöz tularemi.\"** Böyle bir tularemi formu yoktur; \"lepromatöz\" terimi **Mycobacterium leprae**'nin yaptığı lepromatöz lepraya aittir.\nSlaytta sayılan tularemi formları: **ülseroglandüler, okuloglandüler ve pnömonik** tularemi.\n• Ülseroglandüler → giriş yerinde ülser + bölgesel lenf bezi büyümesi (tavşan/kene teması).\n• Okuloglandüler → göz tutulumu + bölgesel lenf bezi.\n• Pnömonik → akciğer tutulumu (kontamine aerosol/tarım tozlarının solunması).\n\"Hepsi sayılmıştır\" şıkkı yanlıştır; çünkü lepromatöz form sayılmamıştır.\n\n💡 **Ezber ipucu:** Tularemi formları = giriş kapısına göre: deri (ülsero-), göz (okulo-), akciğer (pnömonik).", "org": ["francisella"], "shuf": false, "html": true}, {"q": "Tularemi tedavisi ve korunmasıyla ilgili hangisi doğrudur?", "opts": [{"t": "Penisilin ve sefalosporin ilk seçenek ilaçlardır"}, {"t": "İnsanlara rutin canlı aşı uygulanır"}, {"t": "Kolistin tek etkili antibiyotiktir"}, {"t": "Kenenin geç çıkarılması bulaş riskini azaltır"}, {"t": "Canlı aşısı vardır ama insanda kullanılmaz"}], "a": 4, "exp": "**Doğru cevap: Canlı aşısı vardır ama insanda kullanılmaz.** Slayta göre tularemi gentamisin ile tedavi edilir; penisilin ve sefalosporin etkili değildir. Korunmada vektörlerden kaçınılır ve kene hemen çıkarılır. Canlı aşısı vardır ama insanda kullanılmaz.\n\nYanlış şıklar:\n• Penisilin ve sefalosporin ilk seçenek → tersine, **etkili değildir**; ilk seçenek **gentamisin**dir.\n• Rutin canlı aşı → aşı vardır ama **insanda kullanılmaz**.\n• Kolistin tek etkili → bu **Acinetobacter baumannii** içindir.\n• Kenenin geç çıkarılması riski azaltır → tersine, kene dışkısından bulaş için kenenin **uzun süre kan emmesi** gerekir; bu yüzden kene **hemen** çıkarılmalıdır.\n\n💡 **Ezber ipucu:** Tularemi = gentamisin (beta-laktam etkisiz) + keneyi hemen çıkar + canlı aşı insanda yok.", "org": ["francisella"], "shuf": true}, {"q": "Brucella ile ilgili hangisi **yanlıştır**?", "opts": [{"t": "İnsanda en sık görülen tür Brucella melitensis'tir"}, {"t": "İnsan tek rezervuardır"}, {"t": "Retiküloendotelyal hücre içi patojendir"}, {"t": "Çok küçük bakterilerdir"}, {"t": "Fagositoza ve seruma dirençlidir"}], "a": 1, "exp": "**Yanlış olan ifade: \"İnsan tek rezervuardır.\"** Slayta göre Brucella'da **insan rastlantısal konaktır; rezervuar hayvanlardır.** (B. melitensis: koyun-keçi; B. abortus: sığır; B. suis: ren geyiği-domuz; B. canis: köpek-tilki-çakal.)\n\nDiğer şıklar slayttaki doğru bilgilerdir:\n• B. melitensis → insanda en sık görülen tür.\n• Retiküloendotelyal hücre içi patojen → doğru; makrofaj sisteminde yaşar.\n• Çok küçük → doğru; Brucella'lar çok küçük Gram negatif kokobasillerdir.\n• Fagositoza ve seruma dirençli → doğru.\nEk slayt bilgileri: Bruce'a ithafen adlandırılmıştır, \"seçilmiş ajan\" olarak bilinir, ilk pastörize sütte görülmüştür.\n\n💡 **Ezber ipucu:** Brucella = küçük, hücre içi, hayvan kaynaklı; insan kazara konak.", "org": ["brucella"], "shuf": true, "html": true}, {"q": "Brucella türü – rezervuar eşleştirmelerinden hangisi **yanlıştır**?", "opts": [{"t": "B. melitensis – koyun, keçi"}, {"t": "B. abortus – sığır"}, {"t": "B. suis – domuz, ren geyiği"}, {"t": "B. canis – köpek, tilki, çakal"}, {"t": "B. abortus – köpek"}], "a": 4, "exp": "**Yanlış eşleştirme: \"B. abortus – köpek.\"** Slayta göre köpek **B. canis**'in rezervuarıdır; **B. abortus**'un rezervuarı **sığır**dır.\n\nSlayttaki doğru eşleştirmeler (diğer şıklar):\n• B. melitensis → koyun, keçi (insanda en sık görülen tür)\n• B. abortus → sığır\n• B. suis → ren geyiği, domuz\n• B. canis → köpek, tilki, çakal\nBakteri hayvanda **meme, plasenta, epididim ve uterusu** enfekte ederek **süt, idrar ve doğum ürünlerine** geçer; insana bu ürünler ve hayvan temasıyla bulaşır.\n\n💡 **Ezber ipucu:** **Meli**tensis → \"**meleyen**\" koyun-keçi; **Canis** → köpek; **Suis** → domuz; abortus → sığır.", "org": ["brucella"], "shuf": true, "html": true}, {"q": "Slaytta \"dalgalı ateş\" olarak geçen hastalığın etkeni hangisidir?", "opts": [{"t": "Bordetella pertussis"}, {"t": "Haemophilus influenzae"}, {"t": "Brucella spp."}, {"t": "Francisella tularensis"}, {"t": "Neisseria meningitidis"}], "a": 2, "exp": "**Doğru cevap: Brucella spp.** Slaytta hastalık **\"Bruselloz (Dalgalı Ateş)\"** olarak geçer; bulguları: **kas-eklem ağrısı, titreme, terleme, yorgunluk, ateş, kilo kaybı ve çoklu organ tutulumları**. Bulaş çiğ süt-süt ürünleri ve hayvan temasıyla olur; tedavi doksisiklin (gentamisin/streptomisin eklenebilir).\n\nYanlış şıklar:\n• Bordetella pertussis → boğmaca (öksürük nöbetleri, ıslık sesi).\n• Haemophilus influenzae → menenjit, epiglotit, selülit, artrit.\n• Francisella tularensis → tularemi (ülseroglandüler, okuloglandüler, pnömonik).\n• Neisseria meningitidis → menenjit, meningokoksemi, pnömoni.\n\n💡 **Ezber ipucu:** Dalgalı ateş + terleme + eklem ağrısı = bruselloz.", "org": ["brucella"], "shuf": true}, {"q": "Bruselloz tedavisinde slayta göre hangi ilaç kullanılır?", "opts": [{"t": "Kolistin"}, {"t": "Metronidazol"}, {"t": "Vankomisin"}, {"t": "Doksisiklin (gentamisin veya streptomisin eklenebilir)"}, {"t": "Penisilin V"}], "a": 3, "exp": "**Doğru cevap: Doksisiklin (gentamisin veya streptomisin eklenebilir).** Slayta göre bruselloz doksisiklin ile tedavi edilir; gentamisin veya streptomisin eklenebilir. Brucella hücre içinde yaşadığı için hücre içine iyi geçen doksisiklin (bir tetrasiklin) temel ilaçtır. (Doksisiklin gebelere ve 8 yaş altı çocuklara verilmez.) Korunma: **aşılama ve hayvan eradikasyonu**; **çiğ süt ve süt ürünleri tüketilmemelidir**.\n\nYanlış şıklar:\n• Kolistin → **Acinetobacter**'in tek etkili antibiyotiği.\n• Metronidazol → slayttaki tabloya göre **anaeroplara** etkili; aerop ve fakültatif anaeroplara etkisiz.\n• Vankomisin → stafilokok ve streptokoklara etkili; **tüm Gram negatiflere etkisiz**.\n• Penisilin V → brusellozda slaytta önerilmez.\n\n💡 **Ezber ipucu:** Bruselloz = doksisiklin ± aminoglikozid (gentamisin/streptomisin).", "org": ["brucella"], "shuf": true}, {"q": "Bruselloz açısından yüksek risk grubu hangisidir?", "opts": [{"t": "Splenektomili hastalar"}, {"t": "Solunum cihazına bağlı hastalar"}, {"t": "Üniversite yurdunda kalan gençler"}, {"t": "5 yaş altı aşısız çocuklar"}, {"t": "Çiğ süt ve süt ürünü tüketenler, hayvanla temaslı kişiler, laboratuvar personeli"}], "a": 4, "exp": "**Doğru cevap: Çiğ süt ve süt ürünü tüketenler, hayvanla temaslı kişiler, laboratuvar personeli.** Slayta göre risk, çiğ süt ve süt ürünleri tüketenlerde, hayvanla temaslı kişilerde ve laboratuvar personelinde yüksektir; Brucella laboratuvarda en sık bulaşan bakterilerden biridir. Mantık: bakteri hayvanın memesine, plasentasına, epididimine ve uterusuna yerleşip **süt, idrar ve doğum ürünlerine** geçer. Hastalık tüm dünyada yaygındır ve hayvanlar için aşısı vardır.\n\nYanlış şıklar (başka bakterilerin risk grupları):\n• Splenektomi → **Haemophilus influenzae** (düşük antikor, geç kompleman ile birlikte).\n• Solunum cihazı → **Acinetobacter baumannii**.\n• Üniversite yurdu → **meningokok**.\n• 5 yaş altı → **meningokok** (aşısızlık ise boğmaca ve Hib için önemli).\n\n💡 **Ezber ipucu:** Bruselloz = \"süt, hayvan, laboratuvar\".", "org": ["brucella"], "shuf": true}, {"q": "Aşağıdaki bakterilerden hangisinde insan **tek konak değil, rastlantısal konaktır**?", "opts": [{"t": "Neisseria gonorrhoeae"}, {"t": "Neisseria meningitidis"}, {"t": "Francisella tularensis"}, {"t": "Bordetella pertussis"}, {"t": "Hepsinde insan tek konaktır"}], "a": 2, "exp": "**Doğru cevap: Francisella tularensis.** Slayttaki tularemi epidemiyolojisine göre **insan rastlantısal konaktır.** Rezervuar yabani memeliler, kan emen artropodlar, evcil hayvanlar, tavşanlar, kediler, keneler ve ısıran sineklerdir. (Slayta göre Brucella'da da insan rastlantısal konaktır.)\n\nYanlış şıklar:\n• Neisseria gonorrhoeae → slayta göre tek konak insandır; insan dışında canlı kalamaz.\n• Neisseria meningitidis → slayta göre sadece insanda bulunur.\n• Bordetella pertussis → slayta göre insan tek konaktır.\n• \"Hepsinde insan tek konaktır\" → yanlış, çünkü Francisella'da insan rastlantısal konaktır.\n\n💡 **Ezber ipucu:** Rastlantısal konak insan = zoonozlar (tularemi, bruselloz).", "org": ["francisella", "gonokok", "meningokok", "pertussis"], "shuf": false, "html": true}, {"q": "VAKA: Kedisi elini ısıran bir hastada ısırık yerinde ağrılı, kızarık selülit gelişiyor. En olası etken hangisidir?", "opts": [{"t": "Pasteurella multocida"}, {"t": "Streptococcus agalactiae"}, {"t": "Francisella tularensis"}, {"t": "Acinetobacter baumannii"}, {"t": "Eikenella corrodens"}], "a": 0, "exp": "**Doğru cevap: Pasteurella multocida.** Kedi ısırığı + selülit = Pasteurella. Slayta göre hayvanların ağız florasında bulunur; tırmalama ve ısırma ile insana geçer; **kedi ısırmaları daha derine bulaş nedeniyle tehlikelidir**. Hastalıkları **selülit, lenfadenit**, kronik ÜSYE ve sistemik enfeksiyondur. Tedavi penisilin ve geniş spektrumlu sefalosporin (oksasiline dirençli); derin ısırıkta yara bakımı önemlidir. Slayttaki \"ısırık yaraları\" satırında da etkenler Eikenella corrodens ve Pasteurella multocida olarak verilir.\n\nYanlış şıklar:\n• Streptococcus agalactiae (grup B) → yenidoğan enfeksiyonları ve menenjit; ısırıkla ilişkili değil.\n• Francisella tularensis → kene ısırığı ve enfekte dokular (kedi de rezervuarlar arasında sayılır ama selülit + ısırık tablosu Pasteurella'yı gösterir).\n• Acinetobacter baumannii → hastane kaynaklı enfeksiyonlar.\n• Eikenella corrodens → **insan** ısırığı yarası.\n\n💡 **Ezber ipucu:** Kedi/köpek ısırığı → Pasteurella; insan ısırığı → Eikenella.", "org": ["pasteurella"], "shuf": true}, {"q": "VAKA: Kavgada rakibinin dişine yumruk atan bir gencin el eklemindeki yarada günler içinde enfeksiyon gelişiyor. İnsan ağız florası kaynaklı bu enfeksiyonun en olası etkeni hangisidir?", "opts": [{"t": "Pasteurella multocida"}, {"t": "Eikenella corrodens"}, {"t": "Francisella tularensis"}, {"t": "Brucella canis"}, {"t": "Mycobacterium leprae"}], "a": 1, "exp": "**Doğru cevap: Eikenella corrodens.** İnsan dişiyle oluşan yara = **insan ısırığı yarası**. Slayta göre Eikenella **ağız florasında** bulunan **fırsatçı** bir patojendir; **ısırıkla ilişkili enfeksiyon** yapar; hastalıkları insan ısırığı yarası, subakut endokardit ve fırsatçı enfeksiyonlardır. Tedavisi diğer Gram negatiflerden farklıdır: monomikrobikte ampisilin, polimikrobikte (ısırıklarda sık) amoksisilin-klavulanat.\n\nYanlış şıklar:\n• Pasteurella multocida → **hayvanların** ağız florası; kedi/köpek ısırığı.\n• Francisella tularensis → kene ısırığı ve enfekte hayvan dokuları.\n• Brucella canis → köpek, tilki, çakal kaynaklı bruselloz.\n• Mycobacterium leprae → lepra etkeni; ısırık yarası etkeni değildir.\n\n💡 **Ezber ipucu:** \"Yumruk-diş yarası\" klasik insan ısırığıdır → Eikenella.", "org": ["eikenella"], "shuf": true}, {"q": "VAKA: Tavşan avlayıp derisini yüzen bir avcının elinde ağrılı bir ülser ve koltuk altında şiş, ağrılı lenf bezleri gelişiyor. En olası tanı hangisidir?", "opts": [{"t": "Bruselloz"}, {"t": "Deri şarbonu"}, {"t": "Kutanöz difteri"}, {"t": "Erizipel"}, {"t": "Ülseroglandüler tularemi"}], "a": 4, "exp": "**Doğru cevap: Ülseroglandüler tularemi.** Tavşan teması + giriş yerinde ülser + bölgesel lenf bezi büyümesi. Slayta göre Francisella tularensis **enfekte dokular** ve kene ısırığıyla bulaşır; **tavşanlar** rezervuarlar arasındadır (slayttaki görselde tularemi \"tavşan ateşi\" olarak anılır); formları **ülseroglandüler, okuloglandüler ve pnömonik**tir. Tedavi **gentamisin**; penisilin ve sefalosporin etkili değildir.\n\nYanlış şıklar:\n• Bruselloz → çiğ süt ve hayvan temasıyla dalgalı ateş, kas-eklem ağrısı, terleme; ülser + bölgesel lenfadenopati tablosu değildir.\n• Deri şarbonu → B. anthracis; slayta göre enfeksiyonu siyah olduğu için \"kömür\" denmiştir.\n• Kutanöz difteri → C. diphtheriae; tavşan temasıyla ilişkili değildir.\n• Erizipel → S. pyogenes'in deri enfeksiyonu.\n\n💡 **Ezber ipucu:** Tavşan + ülser + lenf bezi = ülseroglandüler tularemi.", "org": ["francisella"], "shuf": true}, {"q": "Bir avcı tavşan temizlerken elini kesiyor ve bir süre sonra kesi yerinde ülseroglandüler hastalık gelişiyor. Muhtemel etken hangisidir?", "opts": [{"t": "Pasteurella multocida"}, {"t": "Francisella tularensis"}, {"t": "Staphylococcus aureus"}, {"t": "Brucella melitensis"}, {"t": "Bacillus anthracis"}], "a": 1, "exp": "**Doğru cevap: Francisella tularensis.** Ülseroglandüler tularemi etkenidir. Slayta göre **enfekte dokularla** (tavşan temizlerken oluşan kesi tipik örnektir) ve kene ısırığıyla bulaşır; tavşanlar rezervuarlar arasındadır; **hücre içi patojendir** ve fagositoza dirençlidir; polisakkarit kapsülü antikor aracılı fagositozu önler. Biyoterörizm etkenidir.\n\nYanlış şıklar:\n• Pasteurella multocida → hayvan ısırığı/tırmalaması ile selülit ve lenfadenit; \"ülseroglandüler\" terimi tularemiye aittir.\n• Staphylococcus aureus → deri-yumuşak doku enfeksiyonları (selülit, fronkül vb.); tavşan teması ile özgül değildir.\n• Brucella melitensis → koyun-keçi kaynaklı bruselloz (dalgalı ateş).\n• Bacillus anthracis → şarbon; siyah (\"kömür\") lezyon.\n\n💡 **Ezber ipucu:** \"Ülseroglandüler\" kelimesini görünce → Francisella.", "org": ["francisella"], "shuf": true, "tag": "Pekiştirme"}, {"q": "VAKA: Köyden getirilen çiğ sütten yapılmış peyniri yiyen bir hastada haftalardır dalgalanan ateş, terleme, kas-eklem ağrıları ve yorgunluk var. En olası etken hangisidir?", "opts": [{"t": "Bacillus cereus"}, {"t": "Moraxella catarrhalis"}, {"t": "Brucella melitensis"}, {"t": "Haemophilus influenzae"}, {"t": "Francisella tularensis"}], "a": 2, "exp": "**Doğru cevap: Brucella melitensis.** Çiğ süt ürünü + dalgalı ateş + terleme + kas-eklem ağrısı + yorgunluk = **bruselloz**. Slayta göre insanda en sık görülen tür **B. melitensis**'tir (rezervuar koyun, keçi); risk **çiğ süt ve süt ürünleri tüketenlerde** yüksektir; bakteri hayvanın memesini enfekte edip **süte** geçer. Tedavi doksisiklin; gentamisin ve streptomisin eklenebilir.\n\nYanlış şıklar:\n• Bacillus cereus → besin zehirlenmesi (gastroenterit); haftalarca dalgalı ateş yapmaz.\n• Moraxella catarrhalis → bronşit, sinüzit, otit.\n• Haemophilus influenzae → menenjit, epiglotit, selülit, artrit.\n• Francisella tularensis → kene ısırığı ve enfekte dokularla bulaşan tularemi.\n\n💡 **Ezber ipucu:** Köy peyniri + dalgalı ateş = B. melitensis.", "org": ["brucella"], "shuf": true}, {"q": "Bir koyun çobanında uzun süren, nedeni bilinmeyen ateş gelişirse en olası etken hangisidir?", "opts": [{"t": "Mycobacterium tuberculosis"}, {"t": "Bordetella pertussis"}, {"t": "Moraxella catarrhalis"}, {"t": "Neisseria meningitidis"}, {"t": "Brucella melitensis"}], "a": 4, "exp": "**Doğru cevap: Brucella melitensis.** Slayta göre **B. melitensis**'in rezervuarı **koyun ve keçidir**; insanda en sık görülen Brucella türüdür ve **hayvanla temaslı kişilerde** risk yüksektir. Bruselloz dalgalı ateş, kas-eklem ağrısı, titreme, terleme, yorgunluk, kilo kaybı ve çoklu organ tutulumuyla seyreder.\n\nYanlış şıklar:\n• Mycobacterium tuberculosis → aside dirençli basil; koyun teması ile ilişkili değildir.\n• Bordetella pertussis → **tek konağı insandır**; boğmaca.\n• Moraxella catarrhalis → insan ağız florasında ürer; solunum yolu enfeksiyonları.\n• Neisseria meningitidis → **sadece insanda** bulunur; menenjit.\n\n💡 **Ezber ipucu:** Çoban/kasap/veteriner + uzun ateş → bruselloz.", "org": ["brucella"], "shuf": true, "tag": "Pekiştirme"}, {"q": "VAKA: Savaş bölgesinde yaralanıp uzun süre yoğun bakımda yatan bir askerin yara kültüründe neredeyse tüm antibiyotiklere dirençli Gram negatif bir bakteri üriyor. En olası etken hangisidir?", "opts": [{"t": "Kingella kingae"}, {"t": "Pasteurella multocida"}, {"t": "Eikenella corrodens"}, {"t": "Acinetobacter baumannii"}, {"t": "Streptococcus pyogenes"}], "a": 3, "exp": "**Doğru cevap: Acinetobacter baumannii.** Savaş yarası (Irak/Afganistan) + hastane ortamı + neredeyse tüm antibiyotiklere direnç. Slayta göre çatışmalarda neredeyse tüm antibiyotiklere direnç geliştirmiş, pnömoni ve ağır sepsis taşıyan askerler ülkelerinde rezervuar olmuştur. Hastanelerin iç ve dış ortamlarında ve nemli yüzeylerde canlı kalır, **florada yoktur**; **solunum yolu, idrar yolu, yara enfeksiyonları ve sepsis** yapar. Risk: GSA kullanımı, cerrahi yara, solunum cihazı. Tedavi in vitro teste göre; **kolistin tek etkili antibiyotiktir**.\n\nYanlış şıklar:\n• Kingella kingae → ağız florası; septik artrit, endokardit.\n• Pasteurella multocida → hayvan ısırığı.\n• Eikenella corrodens → insan ısırığı yarası.\n• Streptococcus pyogenes → **Gram pozitif** kok; farenjit, impetigo, erizipel.\n\n💡 **Ezber ipucu:** Asker + yoğun bakım + çoklu direnç = Acinetobacter → kolistin.", "org": ["acinetobacter"], "shuf": true}, {"q": "Sinsi seyirli bir septik artritte kültür geç pozitifleşiyor ve ağız florası kaynaklı Gram negatif bir etken saptanıyor. En olası etken hangisidir?", "opts": [{"t": "Bacillus anthracis"}, {"t": "Kingella kingae"}, {"t": "Nocardia"}, {"t": "Brucella abortus"}, {"t": "Staphylococcus aureus"}], "a": 1, "exp": "**Doğru cevap: Kingella kingae.** Slayta göre Kingella **sinsi klinik belirtilerle** hastalık oluşturur, **kültürü zaman alır** ve **ağız florasında** bulunur; hastalıkları **septik artrit ve subakut endokardit**tir. Tedavi makrolid, beta-laktam, tetrasiklin ve florokinolon.\nNot: Slayta göre septik artritin **en sık** nedeni **gonokoktur**; ama burada \"sinsi seyir + geç üreyen kültür + ağız florası\" ipuçları Kingella'yı gösterir.\n\nYanlış şıklar:\n• Bacillus anthracis → **Gram pozitif** sporlu basil; şarbon.\n• Nocardia → slaytta Gram negatif ağız florası bakterisi olarak geçmez; granülomatöz enfeksiyon etkenidir.\n• Brucella abortus → sığır kaynaklı; ağız florasında bulunmaz.\n• Staphylococcus aureus → **Gram pozitif** kok; slayt tablosunda artrit etkeni ama ağız florası Gram negatifi değil.\n\n💡 **Ezber ipucu:** \"Sinsi + yavaş kültür + artrit\" = Kingella.", "org": ["kingella"], "shuf": true}, {"q": "Tularemi döngüleriyle ilgili slayttaki şemaya göre hangisi doğrudur?", "opts": [{"t": "Tip A karasal döngüde, Tip B sucul döngüde yer alır"}, {"t": "İki tip de yalnızca kedilerden bulaşır"}, {"t": "Tip A yalnızca insandan insana bulaşır"}, {"t": "Tip B yalnızca aerosolle bulaşır"}, {"t": "Döngülerde artropodların rolü yoktur"}], "a": 0, "exp": "**Doğru cevap: Tip A karasal döngüde, Tip B sucul döngüde yer alır.** Slayttaki tularemi (tavşan ateşi) görselinde bu iki döngü gösterilir. Aynı görselde insana bulaş yolları: **kontamine aerosol/tarım tozlarının solunması, at sineği-kene-sivrisinek ısırıkları, enfekte hayvanla temas, iyi pişmemiş tavşan eti yeme ve kontamine su içme**.\n\nYanlış şıklar:\n• Yalnızca kedilerden → hayır; rezervuar yabani memeliler, tavşanlar, kediler, keneler, ısıran sinekler vb.\n• Tip A insandan insana → slaytta insan **rastlantısal konaktır**; insandan insana bulaş anlatılmaz.\n• Tip B yalnızca aerosol → hayır; sucul döngü kontamine su ile ilişkilidir ve bulaş yolları çok çeşitlidir.\n• Artropodların rolü yok → tersine, keneler, sivrisinekler ve at sinekleri önemli bulaş araçlarıdır; slayt kene dışkısından bulaşı da anlatır.\n\n💡 **Ezber ipucu:** **A**=**A**razi (karasal), **B**=**B**ataklık/su (sucul).", "org": ["francisella"], "shuf": true}, {"q": "İnsanda en sık görülen Brucella türü ve rezervuarı hangisidir?", "opts": [{"t": "B. melitensis – koyun ve keçi"}, {"t": "B. canis – sığır"}, {"t": "B. suis – köpek"}, {"t": "B. abortus – kedi"}, {"t": "B. abortus – domuz"}], "a": 0, "exp": "**Doğru cevap: B. melitensis – koyun ve keçi.** Slayt: \"Brucella melitensis insanda en sık görülenidir\"; rezervuarı **koyun ve keçidir**. Ülkemiz gibi küçükbaş hayvancılığın ve köy peynirinin yaygın olduğu yerlerde brusellozun bu türle ilişkili olması bu yüzdendir.\n\nYanlış şıklar (slayttaki doğru eşleştirmeler):\n• B. canis → **köpek, tilki, çakal** (sığır değil).\n• B. suis → **ren geyiği, domuz** (köpek değil).\n• B. abortus → **sığır** (kedi veya domuz değil).\n\n💡 **Ezber ipucu:** En sık = melitensis = koyun/keçi.", "org": ["brucella"], "shuf": true}, {"q": "Brucella, hayvanda hangi organları enfekte eder ve hangi ürünlere geçer?", "opts": [{"t": "Akciğer ve trakea; öksürük ve aerosolle yayılır"}, {"t": "Deri ve tüyler; doğrudan temasla yayılır"}, {"t": "Ağız florası; ısırık ve tırmalamayla geçer"}, {"t": "Nazofarenks; damlacıkla yayılır"}, {"t": "Meme, plasenta, epididim ve uterus; süt, idrar ve doğum ürünlerine geçer"}], "a": 4, "exp": "**Doğru cevap: Meme, plasenta, epididim ve uterus; süt, idrar ve doğum ürünlerine geçer.** Slayta göre bakteri memeyi, plasentayı, epididimi ve uterusu enfekte ederek süt, idrar ve doğum ürünlerine geçer. Bu yüzden risk grupları **çiğ süt ve süt ürünleri tüketenler, hayvanla temaslı kişiler** (doğum yaptıran çoban, veteriner, kasap) ve **laboratuvar personeli**dir. Korunma: aşılama, hayvan eradikasyonu, çiğ süt ürünlerinden kaçınma.\n\nYanlış şıklar (başka bakterileri çağrıştırır):\n• Akciğer/trakea, aerosol → **Bordetella pertussis** (insan tek konak, aerosolle bulaş).\n• Deri/tüy, doğrudan temas → Brucella için slaytta böyle bir yayılım yoktur.\n• Ağız florası, ısırık-tırmalama → **Pasteurella multocida**.\n• Nazofarenks, damlacık → **meningokok** (solunum ve aerosollerle bulaşır).\n\n💡 **Ezber ipucu:** Brucella üreme organlarını ve memeyi sever → süt + doğum ürünleri.", "org": ["brucella"], "shuf": true}, {"q": "Slaytlara göre kolistinin \"tek etkili antibiyotik\" olduğu etken hangisidir?", "opts": [{"t": "Brucella melitensis"}, {"t": "Francisella tularensis"}, {"t": "Streptococcus pyogenes"}, {"t": "Acinetobacter baumannii"}, {"t": "Corynebacterium diphtheriae"}], "a": 3, "exp": "**Doğru cevap: Acinetobacter baumannii.** Slayta göre tedavi in vitro duyarlılık testine göre uygulanır ve kolistin tek etkili antibiyotiktir. Kolistin, dış membran geçirgenliğini bozan bir polipeptittir; slayttaki ilaç tablosuna göre birçok **Gram negatife** etkilidir, **Gram pozitiflere etkisizdir** (dış membranları yoktur).\n\nYanlış şıklar:\n• Brucella melitensis → doksisiklin (± gentamisin/streptomisin).\n• Francisella tularensis → gentamisin.\n• Streptococcus pyogenes → Gram pozitif olduğu için kolistin zaten etkisizdir.\n• Corynebacterium diphtheriae → Gram pozitif basil; kolistin etkisizdir.\n\n💡 **Ezber ipucu:** Kolistin = Gram negatif; slaytta \"tek etkili\" vurgusu Acinetobacter için.", "org": ["acinetobacter"], "shuf": true}, {"q": "Gentamisinle tedavi edilen, penisilin ve sefalosporinin etkili olmadığı hastalık hangisidir?", "opts": [{"t": "Boğmaca"}, {"t": "Difteri"}, {"t": "Tularemi"}, {"t": "Listerioz"}, {"t": "Kızıl"}], "a": 2, "exp": "**Doğru cevap: Tularemi.** Slayta göre tularemi gentamisin ile tedavi edilir; penisilin ve sefalosporin etkili değildir. Gentamisin bir aminoglikoziddir; slayttaki tabloya göre aminoglikozidler öncelikle Gram negatif basil enfeksiyonlarında kullanılır. Francisella hücre içi bir patojendir ve beta-laktamlara yanıt vermez.\n\nYanlış şıklar:\n• Boğmaca → **makrolid** (azitromisin/klaritromisin).\n• Difteri → slaytta tularemi gibi \"gentamisin + beta-laktam etkisiz\" tanımıyla geçmez; aşı ile önlenebilen bir hastalık olarak vurgulanır.\n• Listerioz → slayta göre **penisilin ve ampisilin** ile tedavi edilir; yani penisilin etkilidir.\n• Kızıl → S. pyogenes hastalığı; streptokoklar penisiline duyarlıdır.\n\n💡 **Ezber ipucu:** \"Beta-laktam işe yaramıyor, gentamisin ver\" = tularemi.", "org": ["francisella"], "shuf": true}, {"q": "Köpek ısırıklarından sonra selülit ve lenfadenite yol açabilen bakteri hangisidir?", "opts": [{"t": "Pseudomonas aeruginosa"}, {"t": "Eikenella corrodens"}, {"t": "Pasteurella multocida"}, {"t": "Francisella tularensis"}, {"t": "Brucella canis"}], "a": 2, "exp": "**Doğru cevap: Pasteurella multocida.** Slayta göre P. multocida **hayvanların ağız florasında** bulunur, **tırmalama ve ısırma** ile insana geçer; hastalıkları **selülit, lenfadenit**, kronik ÜSYE ve sistemik enfeksiyondur. Tedavi penisilin ve geniş spektrumlu sefalosporin; oksasiline dirençli.\n\nYanlış şıklar:\n• Pseudomonas aeruginosa → slayt tablosunda eksternal otit, yanık enfeksiyonu, follikülit vb.; ısırık yarası etkeni olarak geçmez.\n• Eikenella corrodens → **insan** ısırığıyla ilişkilidir.\n• Francisella tularensis → kene ısırığı ve enfekte dokularla bulaşır.\n• Brucella canis → rezervuarı köpek olsa da ısırıkla değil; süt, idrar ve doğum ürünleri ile hayvan temasıyla bulaşır ve dalgalı ateş yapar.\n\n💡 **Ezber ipucu:** Köpek veya kedi → Pasteurella; \"köpek\" kelimesi seni B. canis'e çekmesin.", "org": ["pasteurella"], "shuf": true, "tag": "Pekiştirme"}, {"q": "On beş gündür mekanik ventilatör desteği alan bir hastada gelişen pnömonide en olası etken aşağıdakilerden hangisidir?", "opts": [{"t": "Acinetobacter baumannii"}, {"t": "Streptococcus pneumoniae"}, {"t": "Bacteroides fragilis"}, {"t": "Moraxella catarrhalis"}, {"t": "Viridans streptokoklar"}], "a": 0, "exp": "📖 Kitap: Non-fermenter, oksidaz negatif, hareketsiz Gram negatif basil olan Acinetobacter baumannii, mekanik ventilatöre bağlı hastalarda gelişen pnömoninin en olası etkenidir.\n\n📑 Slaytta: Acinetobacter **hastanelerin iç ve dış ortamlarında** bulunur, nemli yüzeylerde canlı kalır; risk **solunum cihazına bağlı olanlarda**, GSA kullananlarda ve cerrahi yarası olanlarda fazladır; hastalıkları arasında **solunum yolu enfeksiyonları** ve sepsis vardır. Korunmada **solunum cihazlarının sterilizasyonu** vurgulanır.\nYanlış şıklar:\n• Streptococcus pneumoniae → toplumda nazofarenks ve orofarenkse yerleşip akciğere yayılan etkendir; slaytta solunum cihazı riski ile anılmaz.\n• Bacteroides fragilis → anaerop; slayt tablosunda peritonit ve nekrotizan fasiit etkeni.\n• Moraxella catarrhalis → ağız florasında ürer; toplum kaynaklı bronşit, bronkopnömoni, sinüzit, otit.\n• Viridans streptokoklar → slayt tablosunda endokarditin önde gelen etkeni.\n\n💡 **Ezber ipucu:** Ventilatör + yoğun bakım pnömonisi → Acinetobacter.", "org": ["acinetobacter"], "shuf": true, "tag": "Feyyaz Akay"}, {"q": "Menenjiyom nedeniyle ameliyat edilen ve yoğun bakım ünitesinde 14 gün yatan 68 yaşındaki hastada menenjit bulguları gelişiyor. BOS örneğinde bol nötrofil ve Gram negatif kokobasiller görülüyor; kültürde üreyen kolonilerin oksidaz negatif, hareketsiz ve nonfermentatif olduğu saptanıyor. Bu tabloya yol açan etken en büyük olasılıkla hangisidir?", "opts": [{"t": "Pseudomonas aeruginosa"}, {"t": "Acinetobacter baumannii"}, {"t": "Neisseria meningitidis"}, {"t": "Haemophilus influenzae"}, {"t": "Alcaligenes faecalis"}], "a": 1, "exp": "📖 Kitap: Nonfermenter Gram negatif basillerden oksidaz pozitif olanlar Ps
