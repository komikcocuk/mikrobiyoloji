/* ================= MİKROORGANİZMA ATLASI ================= */
/* Renkler Gram boyasını taklit eder: mor = Gram (+), pembe = Gram (−), kırmızı = aside dirençli */
const SETCOLOR = {5:"var(--gpos)", 6:"var(--gneg)", 7:"var(--gneg)", 8:"var(--gneg)", 9:"var(--gpos)", 10:"var(--arb)"};
const ORG_SETS = [5,6,7,8,9,10];
let R = null;   // hafıza (boş kart) oturumu
const ORG_RX = ORGS.map(o=>({id:o.id, rx:new RegExp(o.alias.join("|"))}));

function orgsOf(i){ return ORGS.filter(o=>o.set===i); }
function li(arr){ return "<ul>"+arr.map(t=>`<li>${fmt(t)}</li>`).join("")+"</ul>"; }

function cardHTML(o, opts={}){
  const rows = FIELDS.filter(([k])=>o[k] && o[k].length).map(([k,ic,lab])=>`
    <div class="oc-row"><div class="oc-lab"><span>${ic}</span>${lab}</div><div class="oc-val">${li(o[k])}</div></div>`).join("");
  return `<article class="oc" style="--oc:${SETCOLOR[o.set]}">
    <header class="oc-head"><div class="oc-tag">${esc(o.tag)}</div><h3>${esc(o.name)}</h3><div class="oc-set">${esc(SETS[o.set].title)}</div></header>
    ${rows}
    ${opts.footer||""}
  </article>`;
}

function miniGrid(i){
  return `<div class="minis">`+orgsOf(i).map(o=>`
    <button class="mini" style="--oc:${SETCOLOR[o.set]}" onclick="orgPage('${o.id}',${i})">
      <span class="mh"><b>${esc(o.short)}</b><small>${esc(o.tag)}</small></span>
      <span class="mr"><i>⚔️</i>${esc(o.key.virulans)}</span>
      <span class="mr"><i>🩺</i>${esc(o.key.hastalik)}</span>
      <span class="mr"><i>💊</i>${esc(o.key.tedavi)}</span>
      <span class="mr"><i>🛡️</i>${esc(o.key.korunma)}</span>
      <span class="mgo">Kimlik kartı ›</span>
    </button>`).join("")+`</div>`;
}

/* --- soru ↔ kart bağlantısı --- */
function orgsForQ(q){
  if(q.org) return q.org.slice(0,4);
  const main = q.q+" "+q.opts[q.a].t;
  let hit = ORG_RX.filter(r=>r.rx.test(main)).map(r=>r.id);
  if(!hit.length) hit = ORG_RX.filter(r=>r.rx.test(q.exp||"")).map(r=>r.id);
  return hit.slice(0,3);
}
function orgChips(q, uid){
  const ids = orgsForQ(q); if(!ids.length) return "";
  return `<div class="chiprow"><span class="chiplab">🦠 Kimlik kartı:</span>${ids.map(id=>`<button class="ochip" style="--oc:${SETCOLOR[ORG[id].set]}" onclick="toggleCard(this,'${id}','${uid}')">${esc(ORG[id].short)}</button>`).join("")}</div><div id="${uid}"></div>`;
}
function toggleCard(btn,id,uid){
  const box=document.getElementById(uid);
  if(box.dataset.open===id){ box.innerHTML=""; box.dataset.open=""; btn.classList.remove("on"); return; }
  btn.parentNode.querySelectorAll(".ochip").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on"); box.dataset.open=id; box.innerHTML=cardHTML(ORG[id]);
}

/* --- atlas listesi --- */
let ATLAS = {set:null, q:""};
function atlas(setFilter){
  S=null; F=null; R=null;
  if(setFilter!==undefined) ATLAS.set=setFilter;
  const chips = [`<button class="fchip ${ATLAS.set===null?"on":""}" onclick="atlas(null)">Tümü <small>${ORGS.length}</small></button>`]
    .concat(ORG_SETS.map(i=>`<button class="fchip ${ATLAS.set===i?"on":""}" style="--oc:${SETCOLOR[i]}" onclick="atlas(${i})">${esc(SETS[i].short)} <small>${orgsOf(i).length}</small></button>`)).join("");
  const scope = ATLAS.set===null ? "tüm etkenler" : SETS[ATLAS.set].short;
  app.innerHTML = `
  <div class="topbar"><div class="topline"><button class="btn-ghost" onclick="home()">‹ Ana sayfa</button><span></span></div></div>
  <div class="menu-head">
    <div class="eyebrow">Mikroorganizma Atlası</div>
    <h2>Her etken tek kartta</h2>
    <p>Her kart aynı başlıklarla: kimlik, bulaş, risk, virülans, hastalık, tedavi, korunma, vaka ipucu, akılda kalsın. Renkler Gram boyası gibidir: <b class="gp">mor = Gram (+)</b>, <b class="gn">pembe = Gram (−)</b>, <b class="ga">kırmızı = aside dirençli</b>.</p>
  </div>
  <div class="fchips">${chips}</div>
  <div class="modes atlas-modes">
    <button class="mode" onclick="cardQuiz(ATLAS.set)"><span class="ic">🎯</span><span class="set-body"><span class="t">Kimlik kartı testi</span><span class="d">“Bu kart kimin?” ve “tedavisi / aşısı / bulaşı hangisi?” soruları — ${esc(scope)}</span></span><span class="go">›</span></button>
    <button class="mode" onclick="compare(ATLAS.set,'tedavi')"><span class="ic">📊</span><span class="set-body"><span class="t">Karşılaştırma tablosu</span><span class="d">Bir başlığı seç (tedavi, aşı, bulaş…), tüm etkenleri yan yana gör</span></span><span class="go">›</span></button>
  </div>
  <input class="search" id="orgSearch" type="search" placeholder="Etken, hastalık ya da ilaç ara… (ör. menenjit, kolistin)" value="${esc(ATLAS.q)}" oninput="ATLAS.q=this.value;atlasList()">
  <div id="atlasList"></div>`;
  atlasList();
  window.scrollTo(0,0);
}
function atlasList(){
  const q = ATLAS.q.trim().toLocaleLowerCase("tr");
  const list = ORGS.filter(o=>(ATLAS.set===null||o.set===ATLAS.set) &&
    (!q || JSON.stringify([o.name,o.tag,FIELDS.map(([k])=>o[k])]).toLocaleLowerCase("tr").includes(q)));
  document.getElementById("atlasList").innerHTML = list.length ? `<div class="org-list">`+list.map(o=>`
    <button class="org-tile" style="--oc:${SETCOLOR[o.set]}" onclick="orgPage('${o.id}')">
      <span class="ot-name">${esc(o.name)}</span>
      <span class="ot-tag">${esc(o.tag)}</span>
      <span class="ot-dis">${esc(o.key.hastalik)}</span>
    </button>`).join("")+`</div>` : `<p class="note">“${esc(ATLAS.q)}” için eşleşen etken yok.</p>`;
}

/* --- tek kart sayfası --- */
function orgPage(id, backSet){
  S=null; F=null; R=null;
  const o=ORG[id];
  const peers = ATLAS.set===null ? ORGS : orgsOf(ATLAS.set);
  const pool = peers.some(p=>p.id===id) ? peers : orgsOf(o.set);
  const k = pool.findIndex(p=>p.id===id);
  const prev = pool[(k-1+pool.length)%pool.length], nxt = pool[(k+1)%pool.length];
  const back = backSet!==undefined ? `showSummary(${backSet})` : "atlas()";
  app.innerHTML = `
  <div class="topbar"><div class="topline">
    <button class="btn-ghost" onclick="${back}">‹ ${backSet!==undefined?"Konu özeti":"Atlas"}</button>
    <span class="counts">${k+1} / ${pool.length}</span>
  </div></div>
  ${cardHTML(o)}
  <div class="cardnav">
    <button class="btn secondary" onclick="orgPage('${prev.id}'${backSet!==undefined?","+backSet:""})">‹ ${esc(prev.short)}</button>
    <button class="btn secondary" onclick="orgPage('${nxt.id}'${backSet!==undefined?","+backSet:""})">${esc(nxt.short)} ›</button>
  </div>
  <div class="result-actions">
    <button class="btn" onclick="cardQuiz(null,'${o.id}')">Bu etkenle ilgili test</button>
    <button class="btn secondary" onclick="startSet(${o.set})">${esc(SETS[o.set].short)} sorularını çöz</button>
  </div>`;
  window.scrollTo(0,0);
}

/* --- karşılaştırma tablosu --- */
function compare(setIdx, field){
  S=null; F=null; R=null;
  ATLAS.set = setIdx;
  const list = setIdx===null ? ORGS : orgsOf(setIdx);
  const fchips = FIELDS.map(([k,ic,lab])=>`<button class="fchip ${k===field?"on":""}" onclick="compare(${setIdx===null?"null":setIdx},'${k}')">${ic} ${lab.split(" (")[0]}</button>`).join("");
  const lab = FIELDS.find(f=>f[0]===field);
  app.innerHTML = `
  <div class="topbar"><div class="topline"><button class="btn-ghost" onclick="atlas()">‹ Atlas</button><span class="counts">${list.length} etken</span></div></div>
  <div class="menu-head"><div class="eyebrow">Karşılaştırma</div><h2>${lab[1]} ${esc(lab[2])}</h2><p>${setIdx===null?"Tüm etkenler":esc(SETS[setIdx].title)} — başlığı değiştirmek için seç:</p></div>
  <div class="fchips">${fchips}</div>
  <div class="cmp">${list.map(o=>`
    <div class="cmp-row" style="--oc:${SETCOLOR[o.set]}">
      <button class="cmp-name" onclick="orgPage('${o.id}')">${esc(o.short)}</button>
      <div class="cmp-val">${li(o[field]||["—"])}</div>
    </div>`).join("")}</div>`;
  window.scrollTo(0,0);
}

/* --- boş kart (hafıza) çalışması --- */
function startRecall(setIdx){
  S=null; F=null;
  const pool = shuffle(setIdx===null ? ORGS : orgsOf(setIdx)).map(o=>({o, again:false}));
  R = {setIdx, queue:pool, total:pool.length, done:0, firstTry:0, open:new Set()};
  renderRecall();
}
function renderRecall(){
  if(!R.queue.length){ recallDone(); return; }
  const c=R.queue[0]; R.open=new Set();
  const rows = FIELDS.map(([k,ic,lab])=>`
    <div class="rc-row" id="rc_${k}">
      <button class="rc-lab" onclick="revealField('${k}')"><span>${ic}</span>${lab}<em>Göster</em></button>
      <div class="rc-val"></div>
    </div>`).join("");
  app.innerHTML = `
  <div class="topbar"><div class="topline">
    <button class="btn-ghost" onclick="atlas()">‹ Çık</button>
    <span class="counts">Kalan: ${R.queue.length} · Biten: ${R.done}/${R.total}</span></div>
    <div class="bar"><i style="width:${Math.round(R.done/R.total*100)}%"></i></div></div>
  <div class="quiz-set-name">Boş kart çalışması ${c.again?"· ↻ tekrar geldi":""}</div>
  <article class="oc recall" style="--oc:${SETCOLOR[c.o.set]}">
    <header class="oc-head"><div class="oc-tag">${esc(c.o.tag)}</div><h3>${esc(c.o.name)}</h3><div class="oc-set">Her başlığı önce içinden söyle, sonra aç.</div></header>
    ${rows}
  </article>
  <div class="flash-actions" id="rcActs">
    <button class="btn secondary" onclick="FIELDS.forEach(f=>revealField(f[0]))">Hepsini aç</button>
  </div>
  <p class="hint-keys">Boşluk: sıradaki başlığı aç · 1: bilemedim · 2: bildim</p>`;
  window.scrollTo(0,0);
}
function revealField(k){
  if(!R || R.open.has(k)) return;
  const o=R.queue[0].o; R.open.add(k);
  const row=document.getElementById("rc_"+k);
  row.classList.add("open");
  row.querySelector(".rc-val").innerHTML = li(o[k]||["—"]);
  if(R.open.size===FIELDS.length) document.getElementById("rcActs").innerHTML = `
    <button class="btn badbtn" onclick="recallMark(false)">Bilemedim — tekrar gelsin</button>
    <button class="btn goodbtn" onclick="recallMark(true)">Bildim</button>`;
}
function recallMark(ok){
  const c=R.queue.shift();
  if(ok){ R.done++; if(!c.again) R.firstTry++; } else { c.again=true; R.queue.push(c); }
  renderRecall();
}
function recallDone(){
  const pct=Math.round(R.firstTry/R.total*100);
  app.innerHTML = `
  <div class="result-head"><div class="score-ring" style="--p:${pct}"><div><b>%${pct}</b><small>ilk turda</small></div></div>
  <h2>Kartlar tamam</h2><p>${R.total} etkenin ${R.firstTry} tanesinin kartını ilk seferde doldurdun.</p></div>
  <div class="result-actions">
    <button class="btn" onclick="startRecall(R.setIdx)">Yeniden karıştır</button>
    <button class="btn secondary" onclick="cardQuiz(R.setIdx)">Kimlik kartı testi</button>
    <button class="btn secondary" onclick="atlas()">Atlas</button></div>`;
  window.scrollTo(0,0);
}

/* --- kimlik kartı testi (karttan otomatik soru) --- */
function pickOthers(o, n, ok){
  const same = shuffle(ORGS.filter(x=>x.id!==o.id && x.set===o.set && ok(x)));
  const rest = shuffle(ORGS.filter(x=>x.id!==o.id && x.set!==o.set && ok(x)));
  return same.concat(rest).slice(0,n);
}
/* birden fazla etkene uyabilen genel ifadeler otomatik sorularda kullanılmaz */
function weakKey(f,t){
  return !t || (/belirtilmemiş/.test(t)) || (f==="korunma" && /Aşı yok|Yara bakımı|Kateter|Akılcı/.test(t)) || (f==="virulans" && /Fırsatçı|direnci$/.test(t)) || (f==="tedavi" && /belirtilmemiş/.test(t));
}
function genFor(o){
  const out=[];
  const clues = ["kimlik","bulas","hastalik"].map(k=>({kimlik:"🔬 ",bulas:"🏠 ",hastalik:"🩺 "})[k]+o.key[k]).join("\n");
  const wrongOrgs = pickOthers(o,4,()=>true);
  const opts1 = shuffle([o].concat(wrongOrgs));
  out.push({q:"Bu kimlik kartı hangi etkene ait?\n"+clues, html:true, opts:opts1.map(x=>({t:x.name})), a:opts1.indexOf(o),
    exp:`Bu ipuçları **${o.name}** kartına ait.\n**Diğer şıklar:**\n`+wrongOrgs.map(x=>`• ${x.short}: ${x.key.kimlik}; ${x.key.hastalik}`).join("\n"), org:[o.id], from:SETS[o.set].short});
  shuffle(["tedavi","korunma","hastalik","bulas","virulans"].filter(f=>!weakKey(f,o.key[f]))).slice(0,2).forEach(f=>{
    const seen=new Set([o.key[f]]);
    const others = pickOthers(o,20,x=>!weakKey(f,x.key[f])).filter(x=>{ if(seen.has(x.key[f])) return false; seen.add(x.key[f]); return true; }).slice(0,4);
    const all = shuffle([o].concat(others));
    out.push({q:`${o.short} — ${KEYLABEL[f]} hangisidir?`, opts:all.map(x=>({t:x.key[f]})), a:all.indexOf(o),
      exp:`**${o.short}:** ${o.key[f]}.\n**Diğer şıklar başka etkenlere ait:**\n`+others.map(x=>`• ${x.key[f]} → ${x.short}`).join("\n"), org:[o.id], from:SETS[o.set].short});
  });
  return out;
}
function cardQuiz(setIdx, onlyId){
  const pool = onlyId ? [ORG[onlyId]] : (setIdx===null||setIdx===undefined ? ORGS : orgsOf(setIdx));
  let qs=[]; pool.forEach(o=>qs=qs.concat(genFor(o)));
  qs = onlyId ? qs : shuffle(qs).slice(0,30);
  const title = onlyId ? ORG[onlyId].short+" · kimlik kartı testi" : "Kimlik kartı testi"+(setIdx!=null?" · "+SETS[setIdx].short:"");
  begin(title, qs, null, null);
  S.fromAtlas = true;
}


/* --- localStorage: yalnızca "en iyi skor" kolaylığı; her erişim korumalı --- */
function loadBest(){ try{ return JSON.parse(localStorage.getItem("mikro-best-v2")||"{}"); }catch(e){ return {}; } }
function saveBest(id,pct){ try{ const b=loadBest(); if(b[id]==null||pct>b[id]){ b[id]=pct; localStorage.setItem("mikro-best-v2",JSON.stringify(b)); } }catch(e){} }

let S = null;      // test oturumu

function esc(t){ const d=document.createElement("div"); d.textContent=t; return d.innerHTML; }
/* Açıklama metni: **kalın**, *italik* ve satır sonu desteği */
function fmt(t){
  t = esc(t).replace(/\n/g,"<br>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  t = t.replace(/\*([^*]+)\*/g,"<i>$1</i>");
  return t;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- test oturumu ---------- */
function startSet(i){ begin(SETS[i].title, SETS[i].questions.map(q=>({...q,from:SETS[i].short})), "set"+i, i); }
function startExam(){
  const pool=[]; SETS.forEach(s=>s.questions.forEach(q=>pool.push({...q,from:s.short})));
  begin("Deneme Sınavı", shuffle(pool).slice(0,40), "exam", null);
}
function startAll(){
  const pool=[]; SETS.forEach(s=>s.questions.forEach(q=>pool.push({...q,from:s.short})));
  begin("Maraton", pool, "all", null);
}
function retryWrong(){
  if(!S) return;
  const wrongQs = S.answers.filter(a=>!a.ok).map(a=>a.q);
  const fa = S.fromAtlas;
  begin(S.title.replace(" · Yanlışlar","")+" · Yanlışlar", wrongQs, null, S.setIdx);
  S.fromAtlas = fa;
}
function begin(title, qs, storeId, setIdx){
  F=null; R=null;
  qs = qs.map(q=>{
    if(!q.org && !q.shuf) return q;
    const order = shuffle(q.opts.map((_,k)=>k));
    return {...q, opts:order.map(k=>q.opts[k]), a:order.indexOf(q.a)};
  });
  S = { title, qs, idx:0, right:0, wrongN:0, answers:[], storeId, setIdx };
  renderQ();
}

function renderQ(){
  const q = S.qs[S.idx];
  const n = S.idx+1, N = S.qs.length;
  let opts="";
  q.opts.forEach((o,i)=>{
    opts += `<button class="opt" id="opt${i}" onclick="answer(${i})">
      <span class="key">${LETTERS[i]}</span><span class="txt">${esc(o.t)}</span></button>`;
  });
  app.innerHTML = `
  <div class="topbar"><div class="topline">
      <button class="btn-ghost" onclick="${S.fromAtlas?"atlas()":(S.setIdx!=null?`setMenu(${S.setIdx})`:"home()")}">‹ Çık</button>
      <span class="counts">Soru ${n}/${N} &nbsp; <span class="ok">✓ ${S.right}</span> <span class="no">✗ ${S.wrongN}</span></span>
    </div>
    <div class="bar"><i style="width:${Math.round((S.idx)/N*100)}%"></i></div>
  </div>
  <div class="quiz-set-name">${esc(S.title)}${q.from && S.storeId!==("set"+S.setIdx) ? " · "+esc(q.from):""}</div>
  ${q.tag?`<div class="qtag">📗 ${esc(q.tag)} sorusu</div>`:""}
  <div class="qtext">${q.html?fmt(q.q):esc(q.q)}</div>
  <div class="opts">${opts}</div>
  <div id="after"></div>
  <p class="hint-keys">A–E: cevapla · Enter: sonraki</p>`;
  window.scrollTo(0,0);
}

function answer(i){
  const q = S.qs[S.idx];
  if(document.getElementById("after").dataset.done) return;
  const ok = (i===q.a);
  if(ok) S.right++; else S.wrongN++;
  S.answers.push({q, ok, picked:i});
  q.opts.forEach((o,j)=>{
    const el=document.getElementById("opt"+j);
    el.disabled=true;
    if(j===q.a) el.classList.add("correct");
    else if(j===i) el.classList.add("wrong");
    else el.classList.add("dim");
  });
  const last = S.idx===S.qs.length-1;
  const after=document.getElementById("after");
  after.dataset.done="1";
  after.innerHTML = `
    <div class="verdict ${ok?"ok":"no"}">${ok?"Doğru!":"Yanlış — doğru cevap: "+LETTERS[q.a]}</div>
    <div class="explain"><div class="label">Açıklama</div><p>${fmt(q.exp)}</p></div>
    ${orgChips(q,"qcard")}
    <div class="nextrow"><button class="btn" id="nextBtn" onclick="next()">${last?"Sonuçları gör":"Sonraki soru"} →</button></div>`;
  document.getElementById("nextBtn").focus({preventScroll:true});
}

function next(){
  if(S.idx < S.qs.length-1){ S.idx++; renderQ(); }
  else results();
}

/* ---------- sonuç ---------- */
function results(){
  const N=S.qs.length, pct=Math.round(S.right/N*100);
  if(S.storeId) saveBest(S.storeId,pct);
  const wrongs=S.answers.filter(a=>!a.ok);
  let msg;
  if(pct===100) msg="Kusursuz. Bu konu sende.";
  else if(pct>=85) msg="Çok iyi — yanlışlara bir göz at, tamamdır.";
  else if(pct>=70) msg="İyi gidiyor. Yanlışları tekrar çözmek farkı kapatır.";
  else if(pct>=50) msg="Temel var; açıklamaları okuyarak bir tur daha dön.";
  else msg="Bu setin özetini okuyup kartlarla çalışmak, sonra testi tekrarlamak en verimlisi.";
  let review="";
  if(wrongs.length){
    review = `<div class="review"><h3>Yanlış cevapladıkların (${wrongs.length})</h3>` + wrongs.map(a=>`
      <div class="review-item">
        <div class="rq">${a.q.html?fmt(a.q.q):esc(a.q.q)}</div>
        <div class="ra"><span class="you">Senin cevabın: ${LETTERS[a.picked]})</span> ${esc(a.q.opts[a.picked].t)}<br>
        <span class="cor">Doğrusu: ${LETTERS[a.q.a]})</span> ${esc(a.q.opts[a.q.a].t)}</div>
        <div class="re">${fmt(a.q.exp)}</div>
        ${orgChips(a.q,"rv"+Math.random().toString(36).slice(2))}
      </div>`).join("") + `</div>`;
  } else {
    review = `<p style="text-align:center" class="perfect">Hiç yanlışın yok 🎉</p>`;
  }
  const sumLink = (S.setIdx!=null && SUMMARIES[S.setIdx]) ? `<button class="btn secondary" onclick="showSummary(${S.setIdx})">Konu özetine dön</button>`:"";
  app.innerHTML = `
  <div class="result-head">
    <div class="score-ring" style="--p:${pct}"><div><b>%${pct}</b><small>${S.right}/${N}</small></div></div>
    <h2>${esc(S.title)} tamamlandı</h2>
    <p>${msg}</p>
  </div>
  <div class="result-actions">
    ${wrongs.length?`<button class="btn" onclick="retryWrong()">Yanlışları tekrar çöz (${wrongs.length})</button>`:""}
    ${sumLink}
    <button class="btn secondary" onclick="home()">Ana sayfa</button>
  </div>
  ${review}`;
  window.scrollTo(0,0);
}

/* ---------- bilgi kartları ---------- */
function startFlash(i){
  S=null; R=null;
  const deck = shuffle(SETS[i].questions.map(q=>({q, again:false})));
  F = { setIdx:i, title:SETS[i].title, queue:deck, total:deck.length, firstTry:0, done:0, flipped:false, rounds:{} };
  renderFlash();
}
function renderFlash(){
  if(!F.queue.length){ flashDone(); return; }
  const c = F.queue[0];
  F.flipped=false;
  app.innerHTML = `
  <div class="topbar"><div class="topline">
      <button class="btn-ghost" onclick="setMenu(${F.setIdx})">‹ Çık</button>
      <span class="counts">Kalan: ${F.queue.length} · Biten: ${F.done}/${F.total}</span>
    </div>
    <div class="bar"><i style="width:${Math.round(F.done/F.total*100)}%"></i></div>
  </div>
  <div class="quiz-set-name">${esc(F.title)} · Bilgi kartları</div>
  <div class="flash-card">
    ${c.again?`<div class="flash-tag"><span class="again">↻ Tekrar geldi</span></div>`:""}
    ${c.q.tag?`<div class="qtag">📗 ${esc(c.q.tag)} sorusu</div>`:""}
    <div class="flash-q">${esc(c.q.q)}</div>
    <div id="fback"></div>
    <div class="flash-actions" id="facts">
      <button class="btn" id="flipBtn" onclick="flipCard()">Cevabı göster</button>
    </div>
  </div>
  <p class="hint-keys">Önce cevabı içinden söyle, sonra çevir. Boşluk: çevir · 1: bilemedim · 2: bildim</p>`;
  window.scrollTo(0,0);
}
function flipCard(){
  if(F.flipped) return;
  F.flipped=true;
  const c=F.queue[0];
  document.getElementById("fback").innerHTML = `
    <div class="flash-back">
      <div class="flash-ans">✓ ${esc(c.q.opts[c.q.a].t)}</div>
      <div class="flash-exp">${fmt(c.q.exp)}</div>
      ${orgChips(c.q,"fcard")}
    </div>`;
  document.getElementById("facts").innerHTML = `
    <button class="btn badbtn" onclick="flashMark(false)">Bilemedim — tekrar gelsin</button>
    <button class="btn goodbtn" onclick="flashMark(true)">Bildim</button>`;
}
function flashMark(known){
  const c=F.queue.shift();
  if(known){
    F.done++;
    if(!c.again) F.firstTry++;
  } else {
    c.again=true;
    F.queue.push(c);
  }
  renderFlash();
}
function flashDone(){
  const pct=Math.round(F.firstTry/F.total*100);
  app.innerHTML = `
  <div class="result-head">
    <div class="score-ring" style="--p:${pct}"><div><b>%${pct}</b><small>ilk turda</small></div></div>
    <h2>Kartlar bitti</h2>
    <p>${F.total} kartın ${F.firstTry} tanesini ilk görüşte bildin. Tekrar gelenler, sınavdan önce bir kez daha dönmen gereken yerler.</p>
  </div>
  <div class="result-actions">
    <button class="btn" onclick="startFlash(${F.setIdx})">Kartları yeniden karıştır</button>
    <button class="btn secondary" onclick="startSet(${F.setIdx})">Testi çöz</button>
    <button class="btn secondary" onclick="home()">Ana sayfa</button>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- klavye ---------- */
document.addEventListener("keydown",e=>{
  if(e.target && e.target.tagName==="INPUT") return;
  if(R && R.queue.length){
    if(e.key===" "){ e.preventDefault(); const k=FIELDS.find(f=>!R.open.has(f[0])); if(k) revealField(k[0]); return; }
    if(R.open.size===FIELDS.length && e.key==="1"){ recallMark(false); return; }
    if(R.open.size===FIELDS.length && e.key==="2"){ recallMark(true); return; }
    return;
  }
  if(F){
    if(e.key===" "){ e.preventDefault(); if(!F.flipped) flipCard(); return; }
    if(F.flipped && e.key==="1"){ flashMark(false); return; }
    if(F.flipped && e.key==="2"){ flashMark(true); return; }
    return;
  }
  if(!S) return;
  const after=document.getElementById("after");
  if(e.key==="Enter" && after && after.dataset.done){ next(); return; }
  const k="abcde".indexOf(e.key.toLowerCase());
  if(k>-1 && after && !after.dataset.done && S.qs[S.idx].opts[k]) answer(k);
});

home();
